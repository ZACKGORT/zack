<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wolfgang & Co. — Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f5f2ee;
      --dot: rgba(0,0,0,0.12);
      --fg: #1a1a1a;
      --accent: #8a7560;
      --pill-bg: rgba(255,255,255,0.55);
      --pill-active-bg: #1a1a1a;
      --pill-active-fg: #f5f2ee;
      --page-pad: 1.5rem;
    }
    html, body {
      width: 100%; height: 100%;
      background-color: var(--bg);
      background-image: radial-gradient(circle, var(--dot) 1px, transparent 1px);
      background-size: 20px 20px;
      background-position: center center;
      overflow: hidden;
      cursor: none;
      overscroll-behavior: none;
      touch-action: none;
      font-family: "DM Sans", sans-serif;
      color: var(--fg);
      -webkit-font-smoothing: antialiased;
    }

    /* ── Infinite pan world ── */
    #world-wrap { position: fixed; inset: 0; overflow: hidden; touch-action: none; }
    #world { position: absolute; top: 0; left: 0; width: 0; height: 0; will-change: transform; }

    /* ── iframe cards ── */
    .card {
      position: absolute;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 32px rgba(0,0,0,0.13), 0 1px 4px rgba(0,0,0,0.07);
      border: 1.5px solid rgba(138,117,96,0.13);
      background: #fff;
      transition: box-shadow 0.2s;
    }
    .card-overlay {
      position: absolute;
      inset: 0; bottom: 34px;
      z-index: 10;
      cursor: none;
    }
    .card.unlocked .card-overlay { display: none; }
    .card iframe {
      display: block; width: 100%; height: calc(100% - 34px);
      border: none; pointer-events: all;
    }
    .card-bar {
      position: absolute; bottom: 0; left: 0; right: 0; height: 34px;
      padding: 0 0.75rem;
      background: rgba(245,242,238,0.92);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      border-top: 1px solid rgba(138,117,96,0.12);
      display: flex; align-items: center; justify-content: space-between;
      z-index: 11;
    }
    .card-label {
      font-size: 0.6rem; letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--accent); opacity: 0.8;
    }
    .card-lock-btn {
      font-size: 0.58rem; letter-spacing: 0.14em; text-transform: uppercase;
      font-family: "DM Sans", sans-serif;
      color: var(--fg); opacity: 0.45;
      background: none; border: 1px solid rgba(26,26,26,0.2);
      border-radius: 100px; padding: 0.18rem 0.55rem;
      cursor: pointer;
      transition: opacity 0.2s, background 0.2s, color 0.2s;
    }
    .card-lock-btn:hover { opacity: 0.8; }
    .card.unlocked .card-lock-btn {
      background: var(--pill-active-bg); color: var(--pill-active-fg);
      opacity: 1; border-color: var(--pill-active-bg);
    }

    /* ── Header ── */
    #hdr {
      position: fixed; top: 0; left: 0; width: 100%;
      padding: var(--page-pad);
      display: flex; align-items: flex-start; justify-content: space-between;
      pointer-events: none; z-index: 100;
    }
    #hdr-left { display: flex; flex-direction: column; gap: 0.25rem; }
    #title {
      font-size: clamp(1rem, 3vw, 1.5rem);
      font-weight: 300; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--fg); opacity: 0.75;
    }
    #subtitle {
      font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--accent); opacity: 0.6;
    }

    /* ── Nav pills ── */
    #nav {
      position: fixed; top: var(--page-pad); left: 50%; transform: translateX(-50%);
      z-index: 200; display: flex; gap: 0.4rem; pointer-events: all;
      background: rgba(245,242,238,0.6);
      backdrop-filter: blur(12px) saturate(1.4); -webkit-backdrop-filter: blur(12px) saturate(1.4);
      border: 1px solid rgba(138,117,96,0.15); border-radius: 100px; padding: 0.3rem;
    }
    .pill {
      display: flex; align-items: center; gap: 0.35rem;
      padding: 0.38rem 0.9rem; border-radius: 100px; border: none;
      background: transparent; font-family: "DM Sans", sans-serif;
      font-size: 0.68rem; letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--fg); opacity: 0.5; cursor: none;
      transition: opacity 0.2s, background 0.2s, color 0.2s;
      white-space: nowrap; user-select: none;
    }
    .pill:hover { opacity: 0.8; }
    .pill.active { background: var(--pill-active-bg); color: var(--pill-active-fg); opacity: 1; }
    .pill-dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; opacity: 0.6; flex-shrink: 0; }
    .pill.active .pill-dot { opacity: 1; }

    /* ── Transition veil ── */
    #transition-veil {
      position: fixed; inset: 0; z-index: 150;
      background: var(--bg); opacity: 0; pointer-events: none;
      transition: opacity 0.45s ease;
    }
    #transition-veil.in  { opacity: 1; pointer-events: all; }
    #transition-veil.out { opacity: 0; pointer-events: none; }

    /* ── Category label ── */
    #cat-label {
      position: fixed; bottom: calc(var(--page-pad) + 2rem); left: 50%;
      transform: translateX(-50%); z-index: 100;
      font-size: 0.6rem; letter-spacing: 0.22em; text-transform: uppercase;
      color: var(--accent); opacity: 0; pointer-events: none; transition: opacity 0.6s ease;
    }
    #cat-label.visible { opacity: 0.5; }

    /* ── Controls hint ── */
    #hint {
      position: fixed; bottom: var(--page-pad); right: var(--page-pad);
      z-index: 100; font-size: 0.65rem; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--accent); opacity: 0.4;
      pointer-events: none; text-align: right; line-height: 1.8;
    }

    /* ── Custom cursor ── */
    #cursor {
      position: fixed; top: 0; left: 0; width: 10px; height: 10px;
      background: var(--accent); border-radius: 50%; pointer-events: none;
      z-index: 9998; transform: translate(-50%, -50%);
      transition: transform 0.08s ease, opacity 0.2s;
      opacity: 0.55; mix-blend-mode: multiply; will-change: transform;
    }
    #cursor.grabbing { transform: translate(-50%, -50%) scale(1.8); opacity: 0.3; }
  </style>
</head>
<body>

<div id="cursor"></div>

<header id="hdr">
  <div id="hdr-left">
    <div id="title">Wolfgang &amp; Co.</div>
    <div id="subtitle">An infinite archive</div>
  </div>
</header>

<nav id="nav"></nav>
<div id="transition-veil"></div>
<div id="cat-label"></div>
<div id="hint">Drag to pan · Scroll to zoom<br>Click Interact to browse a site</div>

<div id="world-wrap">
  <div id="world"></div>
</div>

<script>
(function () {
'use strict';

// ─── Categories — edit URLs and labels here ────────────────────────────────
const CATEGORIES = [
  {
    id: 'all', label: 'All',
    sites: [
      { url: 'https://zack.cx',              label: 'zack.cx' },
      { url: 'https://zack.cx/bny',          label: 'BNY' },
      { url: 'https://ifimaybefrank.com',     label: 'If I May Be Frank' },
      { url: 'https://zackgort.com',          label: 'Zack Gort' },
      { url: 'https://zackgort.com/career',   label: 'Career' },
      { url: 'https://zackgort.com/cube',     label: 'Cube' },
      { url: 'https://neverever.land',        label: 'Never Ever Land' },
      { url: 'https://reasonably.cc',         label: 'Reasonably' },
      { url: 'https://emdash.click',          label: 'Emdash' },
    ]
  },
  {
    id: 'personal', label: 'Personal',
    sites: [
      { url: 'https://zack.cx',              label: 'zack.cx' },
      { url: 'https://zackgort.com',          label: 'Zack Gort' },
      { url: 'https://zackgort.com/career',   label: 'Career' },
      { url: 'https://zackgort.com/cube',     label: 'Cube' },
    ]
  },
  {
    id: 'projects', label: 'Projects',
    sites: [
      { url: 'https://ifimaybefrank.com',     label: 'If I May Be Frank' },
      { url: 'https://neverever.land',        label: 'Never Ever Land' },
      { url: 'https://reasonably.cc',         label: 'Reasonably' },
      { url: 'https://emdash.click',          label: 'Emdash' },
      { url: 'https://zack.cx/bny',           label: 'BNY' },
    ]
  },
];

// ─── Layout ────────────────────────────────────────────────────────────────
const CARD_W = 520;
const CARD_H = 360;
const COLS   = 3;
const GAP_X  = 100;
const GAP_Y  = 80;

// ─── Seeded jitter ─────────────────────────────────────────────────────────
function jitter(i, amt) {
  const x = Math.sin(i * 127.1 + 311.7) * 10000;
  return (x - Math.floor(x) - 0.5) * amt;
}
function jitterRot(i) {
  const x = Math.sin(i * 311.7 + 127.1) * 10000;
  return (x - Math.floor(x) - 0.5) * 4;
}

// ─── State ─────────────────────────────────────────────────────────────────
let activeCatIdx = 0;
let cards = [];
let panX = 0, panY = 0;
let scale = 1, targetScale = 1;
let velX = 0, velY = 0;
let dragging = false, lastMX = 0, lastMY = 0;
let transitioning = false;

const world    = document.getElementById('world');
const worldWrap = document.getElementById('world-wrap');
const cursorEl  = document.getElementById('cursor');
const navEl     = document.getElementById('nav');
const veilEl    = document.getElementById('transition-veil');
const catLabel  = document.getElementById('cat-label');
let labelTimer  = null;

// ─── Build cards ───────────────────────────────────────────────────────────
function buildCards(sites) {
  cards.forEach(c => c.el.remove());
  cards = [];

  const totalRows = Math.ceil(sites.length / COLS);
  const layoutW = COLS * (CARD_W + GAP_X) - GAP_X;
  const layoutH = totalRows * (CARD_H + 34 + GAP_Y) - GAP_Y;

  sites.forEach((site, i) => {
    const col = i % COLS;
    const row = Math.floor(i / COLS);
    const baseX = col * (CARD_W + GAP_X) - layoutW / 2;
    const baseY = row * (CARD_H + 34 + GAP_Y) - layoutH / 2;

    const el = document.createElement('div');
    el.className = 'card';
    el.style.width  = CARD_W + 'px';
    el.style.height = (CARD_H + 34) + 'px';
    el.style.left   = (baseX + jitter(i * 2,     36)) + 'px';
    el.style.top    = (baseY + jitter(i * 2 + 1, 28)) + 'px';
    el.style.transform = `rotate(${jitterRot(i)}deg)`;
    el.style.opacity = '0';
    el.style.transition = 'opacity 0.5s';

    // Overlay blocks iframe during pan
    const overlay = document.createElement('div');
    overlay.className = 'card-overlay';
    el.appendChild(overlay);

    // iframe
    const iframe = document.createElement('iframe');
    iframe.src = site.url;
    iframe.loading = 'lazy';
    iframe.title = site.label;
    el.appendChild(iframe);

    // Bar
    const bar = document.createElement('div');
    bar.className = 'card-bar';
    const lbl = document.createElement('span');
    lbl.className = 'card-label';
    lbl.textContent = site.label;
    const btn = document.createElement('button');
    btn.className = 'card-lock-btn';
    btn.textContent = 'Interact';
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const locking = !el.classList.contains('unlocked');
      cards.forEach(c => { c.el.classList.remove('unlocked'); c.btn.textContent = 'Interact'; });
      if (locking) { el.classList.add('unlocked'); btn.textContent = 'Lock'; }
    });
    bar.appendChild(lbl);
    bar.appendChild(btn);
    el.appendChild(bar);

    world.appendChild(el);
    setTimeout(() => el.style.opacity = '1', i * 55 + 80);

    cards.push({ el, btn });
  });

  // Centre layout
  panX = window.innerWidth / 2;
  panY = window.innerHeight / 2;
  scale = 1; targetScale = 1;
  applyTransform();
}

function applyTransform() {
  world.style.transform = `translate(${panX}px,${panY}px) scale(${scale})`;
}

// ─── Nav pills ─────────────────────────────────────────────────────────────
CATEGORIES.forEach((cat, i) => {
  const btn = document.createElement('button');
  btn.className = 'pill' + (i === 0 ? ' active' : '');
  btn.innerHTML = `<span class="pill-dot"></span>${cat.label}`;
  btn.addEventListener('click', () => switchCategory(i));
  navEl.appendChild(btn);
});

function switchCategory(idx) {
  if (idx === activeCatIdx || transitioning) return;
  transitioning = true;
  veilEl.classList.add('in');
  setTimeout(() => {
    activeCatIdx = idx;
    buildCards(CATEGORIES[idx].sites);
    document.querySelectorAll('.pill').forEach((p, i) => p.classList.toggle('active', i === idx));
    clearTimeout(labelTimer);
    catLabel.textContent = CATEGORIES[idx].label;
    catLabel.classList.add('visible');
    labelTimer = setTimeout(() => catLabel.classList.remove('visible'), 2200);
    setTimeout(() => {
      veilEl.classList.remove('in');
      setTimeout(() => { transitioning = false; }, 500);
    }, 60);
  }, 450);
}

// ─── Cursor ────────────────────────────────────────────────────────────────
window.addEventListener('mousemove', e => {
  cursorEl.style.left = e.clientX + 'px';
  cursorEl.style.top  = e.clientY + 'px';
});

// ─── Drag ──────────────────────────────────────────────────────────────────
worldWrap.addEventListener('mousedown', e => {
  if (e.target.classList.contains('card-lock-btn')) return;
  // Don't steal drag from unlocked card
  if (e.target.closest('.card.unlocked')) return;
  dragging = true; lastMX = e.clientX; lastMY = e.clientY;
  velX = 0; velY = 0;
  cursorEl.classList.add('grabbing');
});
window.addEventListener('mouseup', () => { dragging = false; cursorEl.classList.remove('grabbing'); });
window.addEventListener('mousemove', e => {
  if (!dragging) return;
  const dx = e.clientX - lastMX, dy = e.clientY - lastMY;
  panX += dx; panY += dy;
  velX = dx * 0.55; velY = dy * 0.55;
  lastMX = e.clientX; lastMY = e.clientY;
  applyTransform();
});

// ─── Scroll to zoom ────────────────────────────────────────────────────────
worldWrap.addEventListener('wheel', e => {
  if (e.target.closest('.card.unlocked')) return;
  e.preventDefault();
  const delta = e.deltaY * 0.001;
  const prev = scale;
  targetScale = Math.max(0.25, Math.min(2.5, targetScale * (1 - delta)));
  const ratio = targetScale / prev;
  panX = e.clientX + (panX - e.clientX) * ratio;
  panY = e.clientY + (panY - e.clientY) * ratio;
  scale = targetScale;
  applyTransform();
}, { passive: false });

// ─── Inertia ───────────────────────────────────────────────────────────────
(function inertia() {
  requestAnimationFrame(inertia);
  if (!dragging && (Math.abs(velX) > 0.01 || Math.abs(velY) > 0.01)) {
    panX += velX; panY += velY;
    velX *= 0.92; velY *= 0.92;
    applyTransform();
  }
})();

// ─── Touch ─────────────────────────────────────────────────────────────────
let lt = [], ltd = 0;
function touchDist(t) { const dx=t[0].clientX-t[1].clientX,dy=t[0].clientY-t[1].clientY; return Math.sqrt(dx*dx+dy*dy); }
worldWrap.addEventListener('touchstart', e => {
  if (e.target.closest('.card.unlocked')) return;
  e.preventDefault(); lt = Array.from(e.touches); ltd = lt.length >= 2 ? touchDist(lt) : 0;
  velX = 0; velY = 0; cursorEl.classList.add('grabbing');
}, { passive: false });
worldWrap.addEventListener('touchmove', e => {
  if (e.target.closest('.card.unlocked')) return;
  e.preventDefault();
  const t = Array.from(e.touches);
  if (t.length === 1 && lt.length >= 1) {
    const dx = t[0].clientX - lt[0].clientX, dy = t[0].clientY - lt[0].clientY;
    panX += dx; panY += dy; velX = dx * 0.55; velY = dy * 0.55; applyTransform();
  } else if (t.length >= 2 && ltd > 0) {
    const d = touchDist(t), ratio = d / ltd;
    const cx = (t[0].clientX+t[1].clientX)/2, cy = (t[0].clientY+t[1].clientY)/2;
    panX = cx + (panX - cx) * ratio; panY = cy + (panY - cy) * ratio;
    scale = Math.max(0.25, Math.min(2.5, scale * ratio)); targetScale = scale; ltd = d; applyTransform();
  }
  lt = t;
}, { passive: false });
worldWrap.addEventListener('touchend', e => { lt = Array.from(e.touches); cursorEl.classList.remove('grabbing'); }, { passive: false });

// ─── Keyboard pan ──────────────────────────────────────────────────────────
const keys = {};
window.addEventListener('keydown', e => keys[e.key] = true);
window.addEventListener('keyup',   e => keys[e.key] = false);
const KB = 5;
(function kbLoop() {
  requestAnimationFrame(kbLoop);
  let dx = 0, dy = 0;
  if (keys['a'] || keys['A'] || keys['ArrowLeft'])  dx += KB;
  if (keys['d'] || keys['D'] || keys['ArrowRight']) dx -= KB;
  if (keys['w'] || keys['W'] || keys['ArrowUp'])    dy += KB;
  if (keys['s'] || keys['S'] || keys['ArrowDown'])  dy -= KB;
  if (dx || dy) { panX += dx; panY += dy; applyTransform(); }
})();

// ─── Init ──────────────────────────────────────────────────────────────────
buildCards(CATEGORIES[0].sites);

})();
</script>
</body>
</html>
