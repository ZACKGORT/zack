<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Zack Gort — Selected Work</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,500&family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/Flip.min.js"></script>
<style>
  :root{
    --bg:#0c0c0e;
    --ink:#efeee9;
    --dim:#8a8a8f;
    --hair:#232327;
    --maroon:#8f1454;
    --orange:#d9591f;
    --indigo:#3d2f9c;
    --black-tab:#111114;
    --teal:#0f7a5c;
    --red:#d81f26;
    --blue:#2b4fd6;
    --purple:#5b2a86;
    --yellow:#f2c519;
    --pink:#c23a7e;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Space Grotesk', sans-serif;
    min-height:100vh;
    overflow-x:hidden;
  }
  .display{ font-family:'Fraunces', serif; }
  .mono{ font-family:'JetBrains Mono', monospace; }
  a{ color:inherit; text-decoration:none; }

  /* ---------- top nav ---------- */
  nav{
    display:flex; align-items:center; justify-content:space-between;
    padding:22px 40px;
    border-bottom:1px solid var(--hair);
  }
  nav .links{ display:flex; gap:28px; font-size:14px; color:#cfcfd2; }
  nav .mark{
    width:34px;height:34px;border:1px solid #55555b;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-family:'Fraunces', serif; font-style:italic; font-size:13px;
  }
  nav .right{ display:flex; gap:22px; font-size:14px; color:#cfcfd2; align-items:center;}

  /* ---------- shared stage ---------- */
  .stage{ position:relative; }
  .view{ position:absolute; inset:0; transition:opacity .25s ease; }
  .view.is-hidden{ opacity:0; pointer-events:none; }
  #listView{ position:relative; }

  /* ---------- list view ---------- */
  .breadcrumb{ padding:44px 40px 0; font-size:13px; color:var(--dim); letter-spacing:.02em; }
  .breadcrumb .current{ color:#c9c9cc; }
  h1.title{ padding:6px 40px 40px; margin:0; font-size:56px; font-weight:400; letter-spacing:-0.01em; }

  .tab-stack{ padding:0 40px 120px; max-width:1200px; }
  .tab-row{ display:flex; gap:0; margin-top:-14px; position:relative; }
  .tab-row:first-child{ margin-top:0; }

  .tab{
    flex:1 1 0; min-width:0;
    padding:20px 28px 30px;
    cursor:pointer; border:none;
    font-family:'Fraunces', serif; font-size:22px; color:#fff;
    text-align:left;
    clip-path: path('M0,0 H100% V22 C100%,32 96%,38 88%,38 H12% C4%,38 0,32 0,22 Z');
    transition: filter .15s ease;
    position:relative;
  }
  .tab:hover{ filter:brightness(1.08); }
  .tab:focus-visible{ outline:2px solid #fff; outline-offset:-4px; }

  .row-panel{ width:100%; overflow:hidden; height:0; }
  .row-panel .inner{ padding:26px 34px 34px; }
  .row-panel .entry{ display:flex; justify-content:space-between; gap:24px; padding:14px 0; border-top:1px solid rgba(255,255,255,.18); cursor:pointer; }
  .row-panel .entry:first-child{ border-top:none; }
  .row-panel .entry:hover .entry-label{ text-decoration:underline; }
  .entry-id{ font-family:'JetBrains Mono', monospace; font-size:12px; opacity:.75; width:60px; flex:none; }
  .entry-body{ flex:1; }
  .entry-label{ font-family:'Fraunces', serif; font-style:italic; font-size:17px; display:block; margin-bottom:4px;}
  .entry-desc{ font-size:13px; opacity:.85; line-height:1.5; max-width:520px; }
  .entry-date{ font-family:'JetBrains Mono', monospace; font-size:12px; opacity:.75; flex:none; white-space:nowrap; }

  /* ---------- detail view ---------- */
  #detailView{ min-height:100vh; }
  .detail-header{ display:flex; justify-content:space-between; align-items:flex-start; padding:36px 40px 0; }
  .back-btn{
    display:inline-flex; align-items:center; gap:8px; font-size:13px; color:var(--dim);
    cursor:pointer; margin-bottom:18px; background:none; border:none; padding:0;
    font-family:'Space Grotesk', sans-serif;
  }
  .back-btn:hover{ color:var(--ink); }
  .detail-meta{ text-align:right; font-family:'JetBrains Mono', monospace; font-size:12px; color:#b7b7bb; line-height:1.6; max-width:280px; }
  h2.detail-title{ margin:0; padding:0 40px 26px; font-size:52px; font-weight:400; }

  .view-toggle{ display:flex; gap:6px; }
  .view-toggle button{
    width:30px;height:30px; border-radius:6px; border:1px solid var(--hair);
    background:#141416; color:#b7b7bb; cursor:pointer; display:flex;align-items:center;justify-content:center;
  }
  .view-toggle button.active{ background:#232327; color:#fff; }

  .document-panel{
    display:flex; padding:0 40px 140px; gap:0; align-items:flex-start;
    min-height:760px;
  }
  .tab-rail{ display:flex; flex-direction:column; padding-top:40px; flex:none; }
  .tab.is-side-tab{
    writing-mode: vertical-rl; text-orientation: mixed;
    width:44px; padding:22px 0 22px 8px; font-size:16px;
    border-radius:0 8px 8px 0;
    clip-path: path('M0,0 H22 C32,0 38,4 38,12 V88% C38,96% 32,100% 22,100% H0 Z');
    flex:none; cursor:default;
  }

  .pages-wrap{ position:relative; flex:1; min-height:760px; padding:40px 20px 40px 60px; }
  .pages-wrap.is-spread{ display:flex; gap:36px; flex-wrap:wrap; align-items:flex-start; padding-top:40px; }

  .cs-gallery-section{ padding:0 40px 120px; }
  .cs-gallery-label{ font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:#8a8a90; margin-bottom:28px; }
  .cs-gallery{
    display:flex; flex-wrap:wrap; gap:34px 26px;
  }
  .cs-gallery-item{
    width:170px; aspect-ratio:4/5;
    background: radial-gradient(circle at 30% 30%, #4a4a52, #17171a 70%);
    border:6px solid #f2f0ea;
    display:flex; align-items:flex-end; justify-content:center;
    padding-bottom:8px;
    overflow:hidden; position:relative;
    filter:drop-shadow(0 14px 22px rgba(0,0,0,.4));
    transition: transform .25s ease, filter .25s ease;
    cursor:pointer;
  }
  .cs-gallery-item:nth-child(6n+1){ transform:rotate(-3deg); }
  .cs-gallery-item:nth-child(6n+2){ transform:rotate(2deg); }
  .cs-gallery-item:nth-child(6n+3){ transform:rotate(-1.5deg); }
  .cs-gallery-item:nth-child(6n+4){ transform:rotate(2.5deg); }
  .cs-gallery-item:nth-child(6n+5){ transform:rotate(-2deg); }
  .cs-gallery-item:nth-child(6n){ transform:rotate(1.5deg); }
  .cs-gallery-item:hover{ transform:rotate(0deg) scale(1.05); filter:drop-shadow(0 20px 30px rgba(0,0,0,.55)); z-index:2; }
  .cs-gallery-item img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .cs-gallery-caption{
    position:relative; z-index:1;
    font-family:'JetBrains Mono', monospace; font-size:9px; letter-spacing:.06em;
    text-transform:uppercase; color:#f2f0ea; opacity:.75; text-align:center; padding:0 6px;
  }

  /* cascading document pages — offsets/tilt set per-item via inline custom props */
  .page{
    position:absolute;
    top:var(--py, 0px); left:var(--px, 0px);
    z-index:var(--pz, 1);
    width:min(46vw, 400px);
    aspect-ratio:1 / 1.41421;
    background:var(--page-bg, #efe9dd);
    color:#2a2620;
    padding:34px 32px;
    box-shadow:0 30px 60px rgba(0,0,0,.5);
    transform:rotate(var(--tilt, 0deg));
    transition:box-shadow .2s ease;
    cursor:pointer;
  }
  .page:hover{ box-shadow:0 34px 70px rgba(0,0,0,.6); }
  .pages-wrap.is-spread .page{
    position:relative; inset:auto; top:auto; left:auto;
    transform:none; width:280px;
  }
  .page .file-stamp{
    position:absolute; top:22px; right:24px;
    font-family:'JetBrains Mono', monospace; font-size:10.5px;
    border:1px solid #2a2620; padding:3px 8px; border-radius:3px; opacity:.7;
  }
  .page h3{ font-family:'Fraunces', serif; font-style:italic; font-weight:500; font-size:30px; line-height:1.08; margin:0 0 16px; }
  .page p{ margin:0 0 12px; }
  .page p:first-of-type{ font-family:'Fraunces', serif; font-style:italic; font-size:16px; line-height:1.5; opacity:.95; }
  .page p:not(:first-of-type){ font-family:'JetBrains Mono', monospace; font-size:10.5px; line-height:1.6; letter-spacing:.01em; opacity:.65; }
  .page .rev-stamp{
    position:absolute; bottom:20px; right:24px;
    font-family:'Fraunces', serif; font-style:italic; font-size:12px;
    border:1px solid #2a2620; border-radius:50%;
    width:58px;height:58px; display:flex;align-items:center;justify-content:center;
    text-align:center; opacity:.6; transform:rotate(-8deg); line-height:1.1;
  }
  .page .page-index{ position:absolute; bottom:22px; left:32px; font-family:'JetBrains Mono', monospace; font-size:10px; opacity:.55; }

  /* ---------- fullscreen page zoom ---------- */
  .zoom-backdrop{
    position:fixed; inset:0; z-index:300;
    background:rgba(6,6,7,.82);
    opacity:0; pointer-events:none;
    transition:opacity .35s ease;
  }
  .zoom-backdrop.is-active{ opacity:1; pointer-events:auto; }
  .page.is-zoomed{
    position:fixed !important; z-index:301;
    top:50% !important; left:50% !important;
    transform:translate(-50%,-50%) rotate(0deg) !important;
    width:min(60vw, 620px);
    aspect-ratio:1 / 1.41421;
    padding:64px 60px;
    cursor:default;
    box-shadow:0 60px 140px rgba(0,0,0,.7);
  }
  .page.is-zoomed .file-stamp{ top:32px; right:36px; font-size:12px; }
  .page.is-zoomed h3{ font-size:clamp(38px, 4.2vw, 60px); margin-bottom:26px; }
  .page.is-zoomed p:first-of-type{ font-size:clamp(19px, 1.7vw, 24px); line-height:1.55; }
  .page.is-zoomed p:not(:first-of-type){ font-size:12px; }
  .page.is-zoomed .rev-stamp{ bottom:32px; right:36px; width:68px; height:68px; font-size:13px; }
  .page.is-zoomed .page-index{ bottom:34px; left:60px; }

  .cs-gallery-item.is-zoomed{
    position:fixed !important; z-index:301;
    top:50% !important; left:50% !important;
    transform:translate(-50%,-50%) rotate(0deg) !important;
    width:min(52vw, 500px);
    aspect-ratio:4/5;
    padding-bottom:18px;
    cursor:default;
    filter:drop-shadow(0 60px 140px rgba(0,0,0,.7));
  }
  .cs-gallery-item.is-zoomed:hover{ transform:translate(-50%,-50%) rotate(0deg) !important; }
  .cs-gallery-item.is-zoomed .cs-gallery-caption{ font-size:13px; letter-spacing:.08em; }
  .zoom-hint{
    position:fixed; top:28px; right:36px; z-index:302;
    font-family:'JetBrains Mono', monospace; font-size:12px; color:#cfcfd2;
    opacity:0; pointer-events:none; transition:opacity .3s ease;
    display:flex; align-items:center; gap:8px;
  }
  .zoom-hint.is-active{ opacity:1; }
  .zoom-hint kbd{
    border:1px solid #55555b; border-radius:4px; padding:2px 7px;
    font-family:'JetBrains Mono', monospace; font-size:11px; color:#efeee9;
  }

  /* attachment cluster — receipts / notes / photos cascading off the paperclip point */
  .attachment{
    position:absolute;
    top:var(--ay, 0px); left:var(--ax, 0px);
    z-index:var(--az, 5);
    rotate:var(--arot, -6deg);
    filter:drop-shadow(0 14px 22px rgba(0,0,0,.45));
    font-family:'JetBrains Mono', monospace;
  }
  .pages-wrap.is-spread .attachment{ position:relative; inset:auto; top:auto; left:auto; }

  .attachment.receipt{
    width:190px; background:#f0d95c; color:#241e08;
    padding:15px 15px 18px;
    clip-path: polygon(0 5%, 7% 0, 93% 3%, 100% 8%, 97% 96%, 4% 100%, 0 90%);
  }
  .attachment.receipt .r-head{ font-size:15px; letter-spacing:.06em; margin-bottom:9px; }
  .attachment.receipt .r-row{ display:flex; justify-content:space-between; font-size:9.5px; margin-bottom:7px; opacity:.85;}
  .attachment.receipt .r-sig{ font-family:'Fraunces', serif; font-style:italic; font-size:16px; margin-top:12px; border-top:1px solid rgba(0,0,0,.3); padding-top:7px;}

  .attachment.note{
    width:150px; background:#e9e2c9; color:#241e08;
    padding:14px 14px 16px;
    clip-path: polygon(2% 0, 100% 3%, 98% 100%, 0 97%);
    font-family:'Fraunces', serif; font-style:italic; font-size:13px; line-height:1.4;
  }

  .attachment.photo{
    width:150px; aspect-ratio:4/5;
    background:
      radial-gradient(circle at 30% 30%, #4a4a52, #17171a 70%);
    border:6px solid #f2f0ea;
    display:flex; align-items:flex-end; justify-content:center;
    padding-bottom:8px;
    overflow:hidden; position:relative;
  }
  .attachment.photo img{ position:absolute; inset:0; }
  .attachment.photo span{ position:relative; z-index:1; }
  .attachment.photo span{ font-size:9px; letter-spacing:.08em; color:#f2f0ea; opacity:.6; }

  .paperclip{ position:absolute; z-index:10; top:-16px; right:24px; width:24px; height:50px; rotate:10deg; }
  .paperclip svg{ width:100%; height:100%; overflow:visible; }

  .cluster-label{
    position:absolute; z-index:11; top:-30px; left:0;
    font-family:'JetBrains Mono', monospace; font-size:10px; color:var(--dim);
    letter-spacing:.06em; text-transform:uppercase;
  }

  @media (max-width:900px){
    .document-panel{ flex-direction:column; }
    .page{ position:relative !important; top:auto !important; left:auto !important; width:82vw; margin-bottom:24px; transform:none !important; }
    .attachment{ position:relative !important; top:auto !important; left:auto !important; margin-bottom:20px; }
    h1.title{ font-size:36px; }
    .tab{ font-size:16px; padding:14px 16px 22px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
  }
</style>
</head>

<nav>
  <div class="links">

<div class="stage">

  <!-- ===================== LIST VIEW (homepage default) ===================== -->
  <section id="listView" class="view">
    <div class="breadcrumb">Zack Gort / <span class="current">Work</span></div>

    <div class="cs-gallery-section">

</div>

<div class="zoom-backdrop" id="zoomBackdrop"></div>
<div class="zoom-hint" id="zoomHint"><kbd>esc</kbd> back</div>

<script>
gsap.registerPlugin(Flip);

/* =========================================================
   1. cascading list data (rows of tabs) — same model as before
   ========================================================= */
const rows = [
  { tabs: [ { id:'bny', label:'BNY Mellon', color:'var(--indigo)', title:'BNY Mellon — Pershing X',
      entries:[{ id:'ENT', label:'BNY Mellon — Pershing X | Financial Advisor Platform vis-a-vis Publicis Sapient', desc:'De facto Team Lead + Product Owner. Research, discovery, client workshops, cross-track collaboration. Contract extension secured. Shipped. Live.', date:'2022–23' }] } ] },
  { tabs: [
    { id:'gnc', label:'GNC', color:'var(--orange)', title:'GNC — Shopify Plus Redesign',
      entries:[{ id:'ECM', label:'"if the bar ain\u2019t bending, you just pretending"', desc:'Post-bankruptcy rebrand for Elva Design Group. Total creative freedom, extreme timeline. Discovery through launch. GNC went from bankruptcy to $500M/year within five years.', date:'2021' }]},
    { id:'hardinge', label:'Hardinge', color:'var(--teal)', title:'Hardinge — B2B SAP Hybris',
      entries:[{ id:'B2B', label:'A nav system that didn\u2019t throw in everything but the kitchen sink \u2014 just what you found underneath it', desc:'0-1 Salesforce Commerce build under board-level pressure. Shipped for Aquasana, Hardinge, and Simpson Strong-Tie across verticals, at the impetus of COVID.', date:'2020–21' }]},
    { id:'kent', label:'Kent State', color:'var(--purple)', title:'Kent State — .EDU Overhaul',
      entries:[{ id:'IAN', label:'1 S Broad, Floor 9 \u2014 a premiere full-service agency', desc:'Visual + Interactive Design, IA, navigation prototypes, WCAG 2.0 compliance across eight regional campuses and dozens of international locations.', date:'2016' }]}
  ]},
  { tabs: [ { id:'dana', label:'Dana Foundation', color:'var(--pink)', title:'The Dana Foundation',
      entries:[{ id:'NPD', label:'PHI \u2194 NYC; Pharma, Philanthropic, E-commerce; Midtown, Ramen', desc:'A good-faith $20K project, two-week timeline, shipped. Complete autonomy, hand-coded by Antonio on his lunch breaks. Also: Merck, Vetsulin.', date:'2018' }] } ] },
  { tabs: [
    { id:'power', label:'Power Home', color:'var(--red)', title:'Power Home Remodeling',
      entries:[{ id:'BRC', label:'"Power is a _____ company." Fill in the blank.', desc:'Cofounders wanted something unlike anything else in home remodeling \u2014 lifestyle benefits, not a service inventory. Video, animation, photography, cross-department coordination.', date:'2015' }]},
    { id:'wovn', label:'AmericanMuscle', color:'var(--blue)', title:'AmericanMuscle.com',
      entries:[{ id:'ECR', label:'Millions of dollars of merchandise, shipped to a fanatical fanbase', desc:'Full-funnel e-commerce UX, homepage through checkout, for Turn5 Inc. Product photography and the Raxiom brand identity under one holistic hand.', date:'2011' }]}
  ]},
];

/* =========================================================
   2. real case-study content for the expanded document panel,
   keyed by tab id — each tab supplies its own pages/attachments
   ========================================================= */
const caseStudies = {
  bny: {
    pages: [
      { stamp:'BNY · Pershing X', bg:'#efe9dd', title:'BNY Mellon — Pershing X / Financial Advisory Platform',
        body:[
          'NBD \u2014 just the most sophisticated work of my career. De facto Team Lead and Product Owner, unifying teams to transform the client\u2019s disparate legacy software into one ecosystem \u2014 specifically owned navigation systems and dashboard product architecture while mentoring junior and associate designers.',
          'Designed by Zack Gort \u00b7 Publicis Sapient \u00b7 2022\u201323 \u2014 Principal UX Lead'
        ], rev:true },
      { stamp:'504 Artifacts', bg:'#e7c9d9', title:'The Work',

      { stamp:'Specs', bg:'#d6d2ef', title:'Specifications',

        ] }
    ],
    attachments: [
      { type:'receipt', to:'BNY Mellon / Pershing X', date:'2022\u201323' },
      { type:'note', text:'Named de facto Team Lead and Product Owner on a platform that two years prior existed only as a concept, ultimately securing a contract extension into the next fiscal year.' },
      { type:'photo', label:'DASHBOARD DESIGN', src:'https://i.ibb.co/B2V4Skt5/1-Oen-HCQm-Ga10wp-Cz-R8o9-Pt-A.webp' },
      { type:'photo', label:'HEURISTIC ANALYSIS', src:'https://i.ibb.co/fdvw7XLN/1-PGk-VR2s-OAfc-Kk5kk-Trn-Qdw.webp' },
    ]
  },
  gnc: {
    pages: [
      { stamp:'GNC · Elva', bg:'#efe9dd', title:'this is / the whey',
        body:[
          'Post-bankruptcy, every UX decision carried real weight. Mobile-first navigation designed bold enough to feel like a genuine rebrand \u2014 disciplined enough to actually ship.',
          'Designed by Zack Gort \u00b7 Elva Design Group \u00b7 2021 \u2014 Lead UX Designer'
        ], rev:true },
      { stamp:'E-Commerce Artifacts', bg:'#f6dfc2', title:'The Work',
        body:[
          'GNC leadership wanted to shake things up \u2014 a mobile-first navigation schema with conventional fallbacks. Post-bankruptcy, they needed to relaunch the brand and reinvigorate consumer interest: modernize, optimize, and make it feel like a real rebrand without blowing the budget.',

    ]
  },
};

const SECTIONS = {
  work:    { rows: rows,        caseStudies: caseStudies,        galleries: galleries },
  life:    { rows: lifeRows,    caseStudies: lifeCaseStudies,    galleries: {} },
  balance: { rows: balanceRows, caseStudies: balanceCaseStudies, galleries: balanceGalleries },
  journal: { rows: journalRows, caseStudies: journalCaseStudies, galleries: {} },
};

/* =========================================================
   3. build tab stack (list view) — reusable across sections
   ========================================================= */
const tabStack = document.getElementById('tabStack');
const originalHome = new Map();
let currentSection = 'work';

function renderTabStack(rowsData){
  tabStack.innerHTML = '';
  rowsData.forEach(row => {
    const rowEl = document.createElement('div');
    rowEl.className = 'tab-row';

    row.tabs.forEach(tabData => {
      const tabEl = document.createElement('button');
      tabEl.className = 'tab';
      tabEl.style.background = tabData.color;
      tabEl.style.color = '#fff';
      tabEl.textContent = tabData.label;
      tabEl.dataset.id = tabData.id;
      rowEl.appendChild(tabEl);
      tabEl.addEventListener('click', () => toggleRowPanel(tabEl, tabData));
    });

    tabStack.appendChild(rowEl);
    const panel = document.createElement('div');
    panel.className = 'row-panel';
    panel.innerHTML = `<div class="inner"></div>`;
    tabStack.appendChild(panel);
    rowEl._panel = panel;
  });
}

renderTabStack(SECTIONS.work.rows);

/* =========================================================
   3b. section switching (Work / Life / Balance / Journal)
   ========================================================= */
const SECTION_META = {
  work:    { crumb:'Work',    title:'Selected Work' },
  life:    { crumb:'Life',    title:'Life' },
  balance: { crumb:'Balance', title:'Balance' },
  journal: { crumb:'Journal', title:'Journal' },
};

function switchSection(id){
  if (id === currentSection) return;

  // collapse any active zoom instantly
  if (zoomedPage){
    zoomedPage.classList.remove('is-zoomed');
    zoomedPage = null;
    zoomBackdrop.classList.remove('is-active');
    zoomHint.classList.remove('is-active');
  }
  // reset detail view back to this section's homepage
  activeTab = null;
  tabRail.innerHTML = '';
  detailView.classList.add('is-hidden');
  listView.classList.remove('is-hidden');

  currentSection = id;
  const meta = SECTION_META[id];
  document.querySelector('.breadcrumb .current').textContent = meta.crumb;
  document.querySelector('.title.display').textContent = meta.title;
  document.getElementById('backBtn').textContent = `← Back to ${meta.title}`;

  document.querySelectorAll('nav .links a').forEach(a => a.classList.toggle('current', a.dataset.section === id));

  renderTabStack(SECTIONS[id].rows);
}

document.querySelectorAll('nav .links a').forEach(a => {
  a.addEventListener('click', (ev) => { ev.preventDefault(); switchSection(a.dataset.section); });
});

let openPanel = null;

function getContrastColor(id){
  return '#fff';
}

function toggleRowPanel(tabEl, tabData){
  if (tabEl.classList.contains('is-side-tab')) return; // parked in the side-rail during detail view — not a toggle target
  const rowEl = tabEl.parentElement;
  const panel = rowEl && rowEl._panel;
  if (!panel) return;
  const inner = panel.querySelector('.inner');

  if (openPanel && openPanel !== panel){
    gsap.to(openPanel, { height:0, duration:.35, ease:'power2.inOut' });
    openPanel.dataset.open = 'false';
  }

  const isOpen = panel.dataset.open === 'true';
  if (isOpen){
    gsap.to(panel, { height:0, duration:.35, ease:'power2.inOut' });
    panel.dataset.open = 'false';
    openPanel = null;
    return;
  }

  inner.innerHTML = tabData.entries.map(e => `
    <div class="entry" data-tab="${tabData.id}" data-entry="${e.id}">
      <div class="entry-id mono">${e.id}</div>
      <div class="entry-body">
        <span class="entry-label">${e.label}</span>
        <span class="entry-desc">${e.desc}</span>
      </div>
      <div class="entry-date mono">${e.date}</div>
    </div>
  `).join('');
  panel.style.background = tabData.color;
  panel.querySelectorAll('.entry').forEach(row => {
    row.style.color = getContrastColor(tabData.id);
    row.addEventListener('click', () => openDetail(tabEl, tabData, tabData.entries.find(e => e.id === row.dataset.entry)));
  });

  panel.dataset.open = 'true';
  openPanel = panel;
  gsap.set(panel, { height:'auto' });
  const h = panel.offsetHeight;
  gsap.fromTo(panel, { height:0 }, { height:h, duration:.45, ease:'power2.out' });
  gsap.from(inner.querySelectorAll('.entry'), { opacity:0, y:8, stagger:.05, duration:.3, delay:.1 });
}

/* =========================================================
   4. detail view — cascading page + attachment renderer
   ========================================================= */
const listView = document.getElementById('listView');
const detailView = document.getElementById('detailView');
const tabRail = document.getElementById('tabRail');
const pagesWrap = document.getElementById('pagesWrap');
const detailTitle = document.getElementById('detailTitle');
const detailMeta = document.getElementById('detailMeta');
const backBtn = document.getElementById('backBtn');

let activeTab = null;

function renderPages(pages, attachments){
  pagesWrap.innerHTML = '';

  pages.forEach((p, i) => {
    const el = document.createElement('div');
    el.className = 'page';
    el.style.setProperty('--px', `${i * 15}%`);
    el.style.setProperty('--py', `${i * 22}px`);
    el.style.setProperty('--tilt', `${(i % 2 === 0 ? -1 : 1) * (2 + i * 0.6)}deg`);
    el.style.setProperty('--pz', pages.length - i);
    el.style.setProperty('--page-bg', p.bg);
    el.innerHTML = `
      <div class="file-stamp mono">${p.stamp}</div>
      <h3>${p.title}</h3>
      ${p.body.map(t => `<p>${t}</p>`).join('')}
      <div class="page-index">${String(i + 1).padStart(2,'0')} / ${String(pages.length).padStart(2,'0')}</div>
      ${p.rev ? `<div class="rev-stamp">authenticated<br>files</div>` : ''}
    `;
    el.addEventListener('click', (ev) => { ev.stopPropagation(); zoomPage(el); });
    pagesWrap.appendChild(el);
  });

  const clusterBase = pages.length * 15 + 4;
  attachments.forEach((a, i) => {
    const el = document.createElement('div');
    el.className = `attachment ${a.type}`;
    el.style.setProperty('--ax', `${clusterBase + i * 9}%`);
    el.style.setProperty('--ay', `${pages.length * 22 + 60 + i * 34}px`);
    el.style.setProperty('--az', 20 + i);
    el.style.setProperty('--arot', `${(i % 2 === 0 ? -1 : 1) * (5 + i * 3)}deg`);

    if (a.type === 'receipt'){
      el.innerHTML = `
        <div class="r-head">RECEIPT</div>
        <div class="r-row"><span>TO:</span><span>${a.to}</span></div>
        <div class="r-row"><span>DATE:</span><span>${a.date}</span></div>
        <div class="r-sig">on file</div>
        <div class="paperclip">${paperclipSVG()}</div>
      `;
    } else if (a.type === 'note'){
      el.textContent = a.text;
    } else if (a.type === 'photo'){
      el.innerHTML = a.src
        ? `<img src="${a.src}" alt="${a.label}" loading="lazy" style="width:100%;height:100%;object-fit:cover;">`
        : `<span class="mono">${a.label}</span>`;
    }
    pagesWrap.appendChild(el);
  });
}

/* =========================================================
   3b. fullscreen page zoom — click a page to bring it to
   front and blow it up; click backdrop or press Esc to undo
   ========================================================= */
const zoomBackdrop = document.getElementById('zoomBackdrop');
const zoomHint = document.getElementById('zoomHint');
let zoomedPage = null;

function zoomPage(el){
  if (zoomedPage === el) return;
  if (zoomedPage) unzoomPage();

  const state = Flip.getState(el);
  el.classList.add('is-zoomed');
  zoomedPage = el;
  zoomBackdrop.classList.add('is-active');
  zoomHint.classList.add('is-active');
  Flip.from(state, { duration:.6, ease:'power3.inOut', absolute:true });
}

function unzoomPage(){
  if (!zoomedPage) return;
  const el = zoomedPage;
  const state = Flip.getState(el);
  el.classList.remove('is-zoomed');
  zoomedPage = null;
  zoomBackdrop.classList.remove('is-active');
  zoomHint.classList.remove('is-active');
  Flip.from(state, { duration:.5, ease:'power3.inOut', absolute:true });
}

zoomBackdrop.addEventListener('click', unzoomPage);

document.addEventListener('keydown', (ev) => {
  if (ev.key !== 'Escape') return;
  if (zoomedPage){ unzoomPage(); return; }
  if (!detailView.classList.contains('is-hidden')){ closeDetail(); return; }
});

function renderGallery(items){
  const section = document.querySelector('.cs-gallery-section');
  const grid = document.getElementById('csGallery');
  if (!items || !items.length){
    section.style.display = 'none';
    grid.innerHTML = '';
    return;
  }
  section.style.display = '';
  grid.innerHTML = items.map(g => `
    <div class="cs-gallery-item">
      <img src="${g.src}" alt="${g.caption}" loading="lazy">
      <span class="cs-gallery-caption">${g.caption}</span>
    </div>
  `).join('');
  grid.querySelectorAll('.cs-gallery-item').forEach(el => {
    el.addEventListener('click', (ev) => { ev.stopPropagation(); zoomPage(el); });
  });
}

function openDetail(tabEl, tabData, entry){
  if (zoomedPage){
    zoomedPage.classList.remove('is-zoomed');
    zoomedPage = null;
    zoomBackdrop.classList.remove('is-active');
    zoomHint.classList.remove('is-active');
  }
  if (!originalHome.has(tabEl)){
    originalHome.set(tabEl, { parent: tabEl.parentElement, next: tabEl.nextSibling });
  }
  const state = Flip.getState(tabEl);

  if (activeTab && activeTab !== tabEl){
    const prevHome = originalHome.get(activeTab);
    activeTab.classList.remove('is-side-tab');
    if (prevHome) (prevHome.next ? prevHome.parent.insertBefore(activeTab, prevHome.next) : prevHome.parent.appendChild(activeTab));
  }

  tabRail.innerHTML = '';
  tabRail.appendChild(tabEl);
  tabEl.classList.add('is-side-tab');
  activeTab = tabEl;

  const study = SECTIONS[currentSection].caseStudies[tabData.id];

  detailTitle.textContent = tabData.title || tabData.label;
  detailMeta.innerHTML = `${entry.desc}<br><br>${entry.date}`;

  listView.classList.add('is-hidden');
  detailView.classList.remove('is-hidden');

  renderPages(study.pages, study.attachments);
  renderGallery((SECTIONS[currentSection].galleries || {})[tabData.id]);

  Flip.from(state, {
    duration:.7, ease:'power3.inOut', absolute:true,
    onComplete(){
      gsap.from('.page', { opacity:0, y:26, stagger:.08, duration:.5, ease:'power2.out' });
      gsap.from('.attachment', { opacity:0, y:16, duration:.5, stagger:.06, delay:.15, ease:'power2.out' });
    }
  });
}

function closeDetail(){
  if (zoomedPage){
    zoomedPage.classList.remove('is-zoomed');
    zoomedPage = null;
    zoomBackdrop.classList.remove('is-active');
    zoomHint.classList.remove('is-active');
  }
  if (!activeTab){
    // came from the default expanded state with no source tab — just show the list
    listView.classList.remove('is-hidden');
    detailView.classList.add('is-hidden');
    return;
  }
  const home = originalHome.get(activeTab);
  const state = Flip.getState(activeTab);

  if (home.next) home.parent.insertBefore(activeTab, home.next);
  else home.parent.appendChild(activeTab);
  activeTab.classList.remove('is-side-tab');

  listView.classList.remove('is-hidden');
  detailView.classList.add('is-hidden');

  Flip.from(state, { duration:.6, ease:'power3.inOut', absolute:true });
  activeTab = null;
}

backBtn.addEventListener('click', closeDetail);

/* =========================================================
   5. stack / spread toggle — generic over N pages + attachments
   ========================================================= */
const stackBtn = document.getElementById('stackBtn');
const spreadBtn = document.getElementById('spreadBtn');

function setSpread(spread){
  const state = Flip.getState('.page, .attachment');
  pagesWrap.classList.toggle('is-spread', spread);
  stackBtn.classList.toggle('active', !spread);
  spreadBtn.classList.toggle('active', spread);
  Flip.from(state, { duration:.5, ease:'power2.inOut', stagger:.03, absolute:true });
}
stackBtn.addEventListener('click', () => setSpread(false));
spreadBtn.addEventListener('click', () => setSpread(true));

/* =========================================================
   6. helpers
   ========================================================= */
function paperclipSVG(){
  return `<svg viewBox="0 0 26 52" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M13 4 V40 a7 7 0 0 1-14 0 V14 a4 4 0 0 1 8 0 V36" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
  </svg>`;
}
</script>
</body>
