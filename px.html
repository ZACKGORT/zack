<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>zack.cx,</title>
<link rel="icon" type="image/png" href="https://ifimaybefrank.com/favicon-96x96-dark.png" sizes="96x96">
<link rel="icon" type="image/svg+xml" href="https://ifimaybefrank.com/favicon-dark.svg">
<link rel="shortcut icon" href="https://ifimaybefrank.com/favicon-dark.ico">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  scrollbar-width:thin;
  scrollbar-color:var(--surface-border-soft) transparent;
  --bar-h:52px;
  --bg:#ffffff;
  --ink:#111111;
  --rule:#e6e6e4;
  --muted:#8a8a86;
  --on-ink:#ffffff;
  --surface:#ffffff;
  --surface-border:#d5d5d1;
  --surface-border-soft:#c7c7c3;
  --shadow:rgba(0,0,0,.13);
  --accent:#7A3324;
  --chrome-font:'Plus Jakarta Sans',sans-serif;
  --mono:'IBM Plex Mono',monospace;
}
html[data-theme="dark"]{
  --bg:#121212;
  --ink:#f1f0ea;
  --rule:#2c2c29;
  --muted:#93938d;
  --on-ink:#111111;
  --surface:#1a1a18;
  --surface-border:#3a3a36;
  --surface-border-soft:#4a4a45;
  --shadow:rgba(0,0,0,.5);
  --accent:#c96a4c;
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--chrome-font);-webkit-font-smoothing:antialiased}
*::-webkit-scrollbar{width:8px;height:8px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background-color:var(--surface-border-soft);border-radius:999px}

/* ── top bar ── */
.topbar{
  position:fixed;top:0;left:0;right:0;z-index:40;height:var(--bar-h);
  display:flex;align-items:center;gap:18px;
  padding:0 clamp(14px,9px+1.2vw,22px);
  background:var(--surface);border-bottom:1px solid var(--rule);
}
.brand{
  font-family:'Fraunces',serif;font-style:italic;font-weight:600;font-size:16px;color:var(--ink);
  flex:none;letter-spacing:-0.01em;
}
.brand em{color:var(--muted);font-style:italic}
.focus-tabs{display:flex;align-items:center;gap:4px;flex:none;overflow-x:auto;max-width:56vw;scrollbar-width:none}
.focus-tabs::-webkit-scrollbar{display:none}
.focus-tab{
  font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;
  padding:6px 10px;border-radius:20px;background:none;border:1px solid var(--rule);color:var(--muted);
  cursor:pointer;transition:color .15s,background .15s,border-color .15s;white-space:nowrap;flex:none;
}
.focus-tab:hover{color:var(--ink);border-color:var(--surface-border-soft)}
.focus-tab.active{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:14px;flex:none}
.chrome-link{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
  background:none;border:none;color:var(--ink);cursor:pointer;padding:2px 0;
  border-bottom:1px solid transparent;transition:border-color .15s,opacity .15s;
}
.chrome-link:hover{border-bottom-color:var(--ink)}
.theme-toggle{
  width:14px;height:14px;border-radius:50%;flex:none;
  border:1.5px solid var(--ink);background:transparent;padding:0;cursor:pointer;
  transition:background .2s ease;
}
.theme-toggle[aria-pressed="true"]{background:var(--ink)}
@media(max-width:640px){
  .focus-tab span{display:none}
  .topbar{gap:10px;padding:0 12px}
  .focus-tabs{max-width:48vw}
}

/* ── grid wrap ── */
.grid-wrap{
  position:fixed;top:var(--bar-h);left:0;right:0;bottom:0;
  display:grid;
  gap:1px;background:var(--rule);
}
.grid-wrap.animate{transition:grid-template-columns .55s cubic-bezier(.16,1,.3,1),grid-template-rows .55s cubic-bezier(.16,1,.3,1)}
.pane{
  background:var(--bg);display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;position:relative;
}
.pane-head{
  flex:none;height:30px;display:flex;align-items:center;gap:8px;
  padding:0 12px;border-bottom:1px solid var(--rule);
}
.pane-dot{width:6px;height:6px;border-radius:50%;background:var(--surface-border-soft);flex:none}
.pane-label{
  font-family:var(--mono);font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.pane-actions{margin-left:auto;display:flex;align-items:center;gap:10px;flex:none}
.pane-btn{
  background:none;border:none;color:var(--muted);cursor:pointer;padding:2px;line-height:0;
  transition:color .15s;
}
.pane-btn:hover{color:var(--ink)}
.pane-frame-wrap{flex:1;min-height:0;position:relative}
.pane iframe{width:100%;height:100%;border:none;display:block;background:var(--surface)}
.pane-fallback{
  position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  background:var(--surface);text-align:center;padding:20px;
}
.pane-fallback.show{display:flex}
.pane-fallback p{font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.03em;max-width:220px}
.pane-fallback a{font-family:var(--mono);font-size:10.5px;color:var(--ink);text-decoration:underline;text-underline-offset:3px}

/* ── splitters ── */
.split{position:absolute;z-index:20;background:transparent}
.split-v{top:0;bottom:0;width:9px;cursor:col-resize;transform:translateX(-50%)}
.split-h{left:0;right:0;height:9px;cursor:row-resize;transform:translateY(-50%)}
.split::after{content:"";position:absolute;background:var(--rule);transition:background .15s}
.split-v::after{top:0;bottom:0;left:50%;width:1px;transform:translateX(-50%)}
.split-h::after{left:0;right:0;top:50%;height:1px;transform:translateY(-50%)}
.split:hover::after,.split.dragging::after{background:var(--ink)}

.brand-mark{
  position:fixed;bottom:14px;left:16px;z-index:50;
  font-family:'Fraunces',serif;font-style:italic;font-weight:600;font-size:12px;
  color:var(--muted);opacity:.32;transition:opacity .2s ease;pointer-events:none;
}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">zack.cx<em>,</em></div>
  <div class="focus-tabs" id="focusTabs">
    <button class="focus-tab" data-target="a">a · <span>zack.cx</span></button>
    <button class="focus-tab" data-target="b">b · <span>ifimaybefrank</span></button>
    <button class="focus-tab" data-target="c">c · <span>wolfie.life</span></button>
    <button class="focus-tab" data-target="d">d · <span>neverever.land</span></button>
    <button class="focus-tab" data-target="e">e · <span>wolfie.love/cine</span></button>
    <button class="focus-tab" data-target="f">f · <span>intoview.pro</span></button>
    <button class="focus-tab" data-target="g">g · <span>zack.cx/xp</span></button>
    <button class="focus-tab" data-target="h">h · <span>zack.cx/bny</span></button>
  </div>
  <div class="topbar-right">
    <button class="chrome-link" id="resetBtn">Reset</button>
    <button class="theme-toggle" id="themeToggle" aria-pressed="true" title="Toggle theme"></button>
  </div>
</div>

<div class="grid-wrap" id="gridWrap"></div>

<div class="brand-mark">zack.cx<em>,</em> — a wolfgang &amp; co. thing</div>

<script>
(function(){
  // ── pane definitions: 4 columns × 2 rows ──
  const PANES = [
    { id:'a', label:'zack.cx',         url:'https://zack.cx',            col:0, row:0 },
    { id:'b', label:'ifimaybefrank.com', url:'https://ifimaybefrank.com', col:1, row:0 },
    { id:'c', label:'wolfie.life',      url:'https://wolfie.life',       col:2, row:0 },
    { id:'d', label:'neverever.land',   url:'https://neverever.land',    col:3, row:0 },
    { id:'e', label:'wolfie.love/cine', url:'https://wolfie.love/cine',  col:0, row:1 },
    { id:'f', label:'intoview.pro',     url:'https://intoview.pro/',     col:1, row:1 },
    { id:'g', label:'zack.cx/xp',       url:'https://zack.cx/xp',        col:2, row:1 },
    { id:'h', label:'zack.cx/classic',      url:'https://zack.cx/classic',       col:3, row:1 },
  ];
  const NCOLS = 4, NROWS = 2;
  const COL_MIN = 8, ROW_MIN = 12;

  const wrap = document.getElementById('gridWrap');

  // build DOM panes
  PANES.forEach(p => {
    const el = document.createElement('div');
    el.className = 'pane';
    el.dataset.id = p.id;
    el.style.gridColumn = (p.col + 1);
    el.style.gridRow = (p.row + 1);
    el.innerHTML = `
      <div class="pane-head">
        <span class="pane-dot"></span>
        <span class="pane-label">${p.label}</span>
        <div class="pane-actions">
          <button class="pane-btn" data-focus="${p.id}" title="Focus this pane">
            <svg width="11" height="11" viewBox="0 0 11 11" fill="none"><path d="M1 4V1h3M10 4V1H7M1 7v3h3M10 7v3H7" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <a class="pane-btn" href="${p.url}" target="_blank" rel="noopener" title="Open in new tab">
            <svg width="11" height="11" viewBox="0 0 11 11" fill="none"><path d="M4.5 1.5H1.5V9.5H9.5V6.5M6.5 1.5H9.5V4.5M9.5 1.5L4.75 6.25" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </a>
        </div>
      </div>
      <div class="pane-frame-wrap">
        <iframe src="${p.url}" loading="lazy" referrerpolicy="no-referrer-when-downgrade" sandbox="allow-scripts allow-same-origin allow-popups allow-forms allow-popups-to-escape-sandbox"></iframe>
        <div class="pane-fallback"><p>This may not allow embedding.</p><a href="${p.url}" target="_blank" rel="noopener">open ${p.label} ↗</a></div>
      </div>`;
    wrap.appendChild(el);
  });

  // splitters: NCOLS-1 vertical (full height), NROWS-1 horizontal (full width)
  const vSplitters = [];
  for (let i = 0; i < NCOLS - 1; i++){
    const s = document.createElement('div');
    s.className = 'split split-v';
    s.dataset.index = i;
    wrap.appendChild(s);
    vSplitters.push(s);
  }
  const hSplitters = [];
  for (let i = 0; i < NROWS - 1; i++){
    const s = document.createElement('div');
    s.className = 'split split-h';
    s.dataset.index = i;
    wrap.appendChild(s);
    hSplitters.push(s);
  }

  let cols = Array(NCOLS).fill(100 / NCOLS);
  let rows = Array(NROWS).fill(100 / NROWS);

  function apply(){
    wrap.style.gridTemplateColumns = cols.map(c => c + '%').join(' ');
    wrap.style.gridTemplateRows = rows.map(r => r + '%').join(' ');
    let acc = 0;
    vSplitters.forEach((s, i) => { acc += cols[i]; s.style.left = acc + '%'; });
    acc = 0;
    hSplitters.forEach((s, i) => { acc += rows[i]; s.style.top = acc + '%'; });
  }

  function withAnimation(fn){
    wrap.classList.add('animate');
    fn();
    window.setTimeout(() => wrap.classList.remove('animate'), 600);
  }

  function focusPane(id){
    const p = PANES.find(x => x.id === id);
    if (!p) return;
    const bigC = 58, restC = (100 - bigC) / (NCOLS - 1);
    const bigR = 68, restR = (100 - bigR) / (NROWS - 1);
    withAnimation(() => {
      cols = cols.map((_, i) => i === p.col ? bigC : restC);
      rows = rows.map((_, i) => i === p.row ? bigR : restR);
      apply();
    });
    document.querySelectorAll('.focus-tab').forEach(t => t.classList.toggle('active', t.dataset.target === id));
  }

  document.querySelectorAll('[data-focus]').forEach(btn => {
    btn.addEventListener('click', () => focusPane(btn.dataset.focus));
  });
  document.querySelectorAll('.focus-tab').forEach(tab => {
    tab.addEventListener('click', () => focusPane(tab.dataset.target));
  });
  document.getElementById('resetBtn').addEventListener('click', () => {
    withAnimation(() => {
      cols = Array(NCOLS).fill(100 / NCOLS);
      rows = Array(NROWS).fill(100 / NROWS);
      apply();
    });
    document.querySelectorAll('.focus-tab').forEach(t => t.classList.remove('active'));
  });

  // ── drag handling ──
  function startVDrag(index, handleEl){
    return function(e){
      e.preventDefault();
      handleEl.classList.add('dragging');
      document.body.style.userSelect = 'none';
      const overlays = document.querySelectorAll('.pane-frame-wrap');
      overlays.forEach(o => o.style.pointerEvents = 'none');
      const leftBound = cols.slice(0, index).reduce((a, b) => a + b, 0);
      const span = cols[index] + cols[index + 1];
      function move(ev){
        const pt = ev.touches ? ev.touches[0] : ev;
        const rect = wrap.getBoundingClientRect();
        let pos = ((pt.clientX - rect.left) / rect.width) * 100;
        pos = Math.min(leftBound + span - COL_MIN, Math.max(leftBound + COL_MIN, pos));
        cols[index] = pos - leftBound;
        cols[index + 1] = leftBound + span - pos;
        apply();
      }
      function up(){
        handleEl.classList.remove('dragging');
        document.body.style.userSelect = '';
        overlays.forEach(o => o.style.pointerEvents = '');
        document.removeEventListener('pointermove', move);
        document.removeEventListener('pointerup', up);
      }
      document.addEventListener('pointermove', move);
      document.addEventListener('pointerup', up);
    };
  }

  function startHDrag(index, handleEl){
    return function(e){
      e.preventDefault();
      handleEl.classList.add('dragging');
      document.body.style.userSelect = 'none';
      const overlays = document.querySelectorAll('.pane-frame-wrap');
      overlays.forEach(o => o.style.pointerEvents = 'none');
      const topBound = rows.slice(0, index).reduce((a, b) => a + b, 0);
      const span = rows[index] + rows[index + 1];
      function move(ev){
        const pt = ev.touches ? ev.touches[0] : ev;
        const rect = wrap.getBoundingClientRect();
        let pos = ((pt.clientY - rect.top) / rect.height) * 100;
        pos = Math.min(topBound + span - ROW_MIN, Math.max(topBound + ROW_MIN, pos));
        rows[index] = pos - topBound;
        rows[index + 1] = topBound + span - pos;
        apply();
      }
      function up(){
        handleEl.classList.remove('dragging');
        document.body.style.userSelect = '';
        overlays.forEach(o => o.style.pointerEvents = '');
        document.removeEventListener('pointermove', move);
        document.removeEventListener('pointerup', up);
      }
      document.addEventListener('pointermove', move);
      document.addEventListener('pointerup', up);
    };
  }

  vSplitters.forEach((s, i) => s.addEventListener('pointerdown', startVDrag(i, s)));
  hSplitters.forEach((s, i) => s.addEventListener('pointerdown', startHDrag(i, s)));

  apply();

  // ── blocked-frame fallback detection ──
  document.querySelectorAll('.pane-frame-wrap').forEach(w => {
    const iframe = w.querySelector('iframe');
    const fallback = w.querySelector('.pane-fallback');
    iframe.addEventListener('error', () => fallback.classList.add('show'));
  });

  // ── theme toggle ──
  const themeToggle = document.getElementById('themeToggle');
  function setTheme(dark){
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    themeToggle.setAttribute('aria-pressed', dark ? 'true' : 'false');
    localStorage.setItem('zack.cx-theme', dark ? 'dark' : 'light');
  }
  const saved = localStorage.getItem('zack.cx-theme');
  setTheme(saved ? saved === 'dark' : true);
  themeToggle.addEventListener('click', () => {
    setTheme(document.documentElement.getAttribute('data-theme') !== 'dark');
  });
})();
</script>
</body>
</html>
