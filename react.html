<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>a single-prompt react prototype</title>
<meta name="description" content="Zack Gort — Staff/Principal Product &amp; UX Designer. Enterprise UX, navigation systems, and design systems work across fintech, e-commerce, and SaaS." />

<meta property="og:url" content="https://zack.cx/" />

<meta name="twitter:title" content="Zack Gort — Wolfgang &amp; Co." />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Serif+Display:ital@0;1&family=Fraunces:ital,wght@0,400..900;1,400..900&family=Inter:wght@400;500;600&family=Outfit:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;1,500&family=Space+Grotesk:wght@400;500;600&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#0b0b0a;
    --bg-alt:#141412;
    --paper:#f3f1ea;
    --fg:#f3f1ea;
    --fg-dim:#9c9a90;
    --fg-dimmer:#6b6a62;
    --line:rgba(243,241,234,0.14);
    --line-strong:rgba(243,241,234,0.34);
    --signal:#b7402c;
    --f-display:'Anton',sans-serif;
    --f-bebas:'Bebas Neue',sans-serif;
    --f-serif:'DM Serif Display',serif;
    --f-fraunces:'Fraunces',serif;
    --f-playfair:'Playfair Display',serif;
    --f-syne:'Syne',sans-serif;
    --f-ui:'Space Grotesk',sans-serif;
    --f-sub:'Outfit',sans-serif;
    --f-mono:'DM Mono',monospace;
    --f-body:'Inter',sans-serif;
  }
  *,*::before,*::after{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  html{background:var(--bg);}
  body{
    background:var(--bg);
    color:var(--fg);
    font-family:var(--f-body);
    font-size:15px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    cursor:none;
    overflow-x:hidden;
  }
  img{max-width:100%;display:block;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;background:none;border:none;color:inherit;cursor:none;padding:0;}
  ul{list-style:none;margin:0;padding:0;}
  input[type=range]{cursor:none;}
  h1,h2,h3,h4,p{margin:0;}
  :focus-visible{outline:1px solid var(--fg);outline-offset:3px;}
  ::selection{background:var(--fg);color:var(--bg);}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important;transition-duration:0.001ms !important;}
  }

  /* ---------- custom cursor ---------- */
  .cursor-dot{
    position:fixed;top:0;left:0;width:8px;height:8px;background:var(--fg);
    pointer-events:none;z-index:10000;transform:translate(-50%,-50%);
    transition:width .15s ease,height .15s ease,background .15s ease,border .15s ease;
    mix-blend-mode:difference;
  }
  .cursor-dot.is-big{width:34px;height:34px;background:transparent;border:1px solid var(--fg);}

  /* ---------- layout shell ---------- */
  .app{min-height:100vh;display:flex;flex-direction:column;}
  .wrap{max-width:1240px;margin:0 auto;padding:0 32px;}
  @media (max-width:760px){.wrap{padding:0 18px;}}

  .eyebrow{
    font-family:var(--f-syne);font-weight:700;font-size:11px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--fg-dim);
  }

  /* ---------- top nav ---------- */
  .topbar{
    position:sticky;top:0;z-index:400;background:rgba(11,11,10,0.86);
    backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
  }
  .topbar-row{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 0;gap:24px;
  }
  .logo-mark{
    font-family:var(--f-bebas);font-size:22px;letter-spacing:.06em;
    border:1px solid var(--line-strong);padding:4px 10px;line-height:1;
  }
  .nav-right{display:flex;align-items:center;gap:20px;}
  .nav-linkedin{font-family:var(--f-mono);font-size:12px;color:var(--fg-dim);border-bottom:1px solid transparent;}
  .nav-linkedin:hover{color:var(--fg);border-color:var(--fg-dim);}

  .dock{display:flex;gap:2px;background:var(--bg-alt);border:1px solid var(--line);padding:4px;}
  .dock-item{
    font-family:var(--f-ui);font-weight:500;font-size:13px;padding:8px 16px;
    color:var(--fg-dim);transition:transform .18s cubic-bezier(.2,.9,.3,1.4),color .15s ease,background .15s ease;
    white-space:nowrap;
  }
  .dock-item:hover{color:var(--fg);}
  .dock-item.is-active{color:var(--bg);background:var(--fg);}

  .breadcrumb-row{
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:10px 0;border-top:1px solid var(--line);font-family:var(--f-mono);
    font-size:12px;color:var(--fg-dim);flex-wrap:wrap;
  }
  .breadcrumb-toggle{display:flex;border:1px solid var(--line-strong);}
  .breadcrumb-toggle button{padding:5px 12px;font-family:var(--f-mono);font-size:11px;color:var(--fg-dim);}
  .breadcrumb-toggle button.is-active{background:var(--fg);color:var(--bg);}

  /* ---------- specular button ---------- */
  .specular-btn{
    position:relative;display:inline-flex;align-items:center;gap:8px;
    border:1px solid var(--fg);padding:10px 18px;font-family:var(--f-ui);
    font-weight:500;font-size:13px;overflow:hidden;isolation:isolate;
  }
  .specular-btn::before{
    content:"";position:absolute;inset:0;z-index:-1;
    background:radial-gradient(120px circle at var(--sx,50%) var(--sy,50%), rgba(243,241,234,0.9), transparent 60%);
    opacity:0;transition:opacity .25s ease;
  }
  .specular-btn:hover::before{opacity:1;}
  .specular-btn:hover{color:var(--bg);}
  .specular-btn span{position:relative;z-index:1;}
  .specular-btn.ghost{border-color:var(--line-strong);}

  /* ---------- page wipe ---------- */
  .page-wipe{
    position:fixed;inset:0;background:var(--fg);z-index:9000;transform:scaleY(0);
    transform-origin:bottom;pointer-events:none;
  }
  .page-wipe.is-active{animation:wipe .7s cubic-bezier(.76,0,.24,1) both;}
  @keyframes wipe{
    0%{transform:scaleY(0);transform-origin:bottom;}
    45%{transform:scaleY(1);transform-origin:bottom;}
    55%{transform:scaleY(1);transform-origin:top;}
    100%{transform:scaleY(0);transform-origin:top;}
  }

  /* ---------- particle hero ---------- */
  .hero{position:relative;height:46vh;min-height:320px;border-bottom:1px solid var(--line);}
  .particle-hero{width:100%;height:100%;display:block;}
  .hero-caption{
    position:absolute;left:32px;bottom:16px;font-family:var(--f-mono);
    font-size:11px;color:var(--fg-dimmer);letter-spacing:.08em;
  }

  /* ---------- footer ---------- */
  .site-footer{
    margin-top:auto;border-top:1px solid var(--line);padding:28px 0;
    font-family:var(--f-mono);font-size:11px;color:var(--fg-dimmer);
    display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;
  }

  .back-to-top{
    position:fixed;right:24px;bottom:24px;z-index:500;border:1px solid var(--line-strong);
    background:var(--bg);padding:10px 14px;font-family:var(--f-mono);font-size:11px;
    opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .3s ease,transform .3s ease;
  }
  .back-to-top.is-visible{opacity:1;transform:translateY(0);pointer-events:auto;}

  /* ================= WORK / INDEX ================= */
  .section-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:56px 0 20px;flex-wrap:wrap;}
  .section-title{font-family:var(--f-syne);font-weight:800;font-size:13px;letter-spacing:.14em;text-transform:uppercase;}

  .toolbar{
    display:flex;flex-wrap:wrap;gap:22px;align-items:center;padding:14px 0;
    border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:18px;
  }
  .toolbar-group{display:flex;align-items:center;gap:10px;}
  .toolbar-label{font-family:var(--f-mono);font-size:10px;color:var(--fg-dimmer);text-transform:uppercase;letter-spacing:.08em;}
  .seg{display:flex;border:1px solid var(--line-strong);}
  .seg button{padding:6px 11px;font-family:var(--f-mono);font-size:11px;color:var(--fg-dim);}
  .seg button.is-active{background:var(--fg);color:var(--bg);}
  .toolbar-reset{font-family:var(--f-mono);font-size:11px;color:var(--fg-dim);border-bottom:1px dashed var(--fg-dimmer);}
  .toolbar-reset:hover{color:var(--fg);}

  .elastic-slider{display:flex;align-items:center;gap:10px;}
  .es-label{font-family:var(--f-mono);font-size:10px;color:var(--fg-dimmer);text-transform:uppercase;letter-spacing:.08em;white-space:nowrap;}
  .elastic-slider input[type=range]{
    -webkit-appearance:none;appearance:none;width:120px;height:1px;background:var(--line-strong);
  }
  .elastic-slider input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:12px;height:12px;background:var(--fg);border-radius:50%;
    transition:transform .35s cubic-bezier(.34,1.9,.4,1.1);
  }
  .elastic-slider input.is-dragging[type=range]::-webkit-slider-thumb{transform:scale(1.9);}
  .elastic-slider input[type=range]::-moz-range-thumb{width:12px;height:12px;background:var(--fg);border:none;border-radius:50%;}

  .option-wheel{position:relative;}
  .ow-trigger{font-family:var(--f-mono);font-size:11px;color:var(--fg-dim);border:1px solid var(--line-strong);padding:6px 11px;}
  .ow-trigger b{color:var(--fg);font-weight:500;}
  .ow-ring{position:absolute;top:50%;left:50%;width:0;height:0;z-index:50;}
  .ow-opt{
    position:absolute;top:0;left:0;transform-origin:center;width:64px;height:26px;margin-left:-32px;margin-top:-13px;
    background:var(--bg);border:1px solid var(--line-strong);font-family:var(--f-mono);font-size:10px;
    display:flex;align-items:center;justify-content:center;transition:background .15s ease,color .15s ease;
  }
  .ow-opt:hover,.ow-opt.is-active{background:var(--fg);color:var(--bg);}

  .case-rows{display:flex;flex-direction:column;gap:1px;background:var(--line);}
  .case-rows.is-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;}
  .tilted-card{
    background:var(--bg);padding:26px 28px;display:grid;grid-template-columns:56px 1fr auto;gap:22px;align-items:center;
    will-change:transform;transition:transform .12s ease-out;
  }
  .tilted-card:hover{background:var(--bg-alt);}
  .tc-num{font-family:var(--f-mono);font-size:12px;color:var(--fg-dimmer);}
  .tc-headline{font-family:var(--f-fraunces);font-weight:600;font-size:clamp(18px,2.4vw,26px);line-height:1.2;}
  .tc-sub{font-family:var(--f-sub);font-size:13px;color:var(--fg-dim);margin-top:6px;max-width:60ch;}
  .tc-meta{text-align:right;font-family:var(--f-mono);font-size:11px;color:var(--fg-dimmer);white-space:nowrap;}
  .tc-tag{display:block;color:var(--fg-dim);margin-bottom:4px;}
  @media (max-width:700px){
    .tilted-card{grid-template-columns:1fr;gap:8px;}
    .tc-meta{text-align:left;}
    .case-rows.is-grid{grid-template-columns:1fr;}
  }

  .archive-row{margin-bottom:34px;}
  .archive-row-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;}
  .archive-row-title{font-family:var(--f-ui);font-weight:600;font-size:14px;}
  .archive-row-tag{font-family:var(--f-mono);font-size:10px;color:var(--fg-dimmer);text-transform:uppercase;}
  .circular-gallery{
    display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory;
  }
  .circular-gallery::-webkit-scrollbar{height:4px;}
  .circular-gallery::-webkit-scrollbar-thumb{background:var(--line-strong);}
  .cg-item{flex:0 0 auto;width:150px;height:100px;scroll-snap-align:start;overflow:hidden;filter:grayscale(0.5) brightness(0.85);transition:filter .25s ease,transform .25s ease;}
  .cg-item:hover{filter:grayscale(0) brightness(1);transform:scale(1.03);}
  .cg-item img{width:100%;height:100%;object-fit:cover;}

  .animated-list{display:flex;flex-direction:column;gap:1px;background:var(--line);}
  .al-item{
    background:var(--bg);padding:22px 26px;opacity:0;transform:translateY(16px);
    transition:opacity .6s ease,transform .6s ease;
  }
  .al-item.is-visible{opacity:1;transform:translateY(0);}
  .testi-quote{font-family:var(--f-playfair);font-style:italic;font-size:17px;line-height:1.5;max-width:70ch;}
  .testi-name{font-family:var(--f-ui);font-weight:600;font-size:13px;margin-top:12px;}
  .testi-role{font-family:var(--f-mono);font-size:11px;color:var(--fg-dimmer);margin-top:2px;}

  .career-cta{margin:64px 0 40px;padding:30px 0;border-top:1px solid var(--line);}
  .career-cta-label{font-family:var(--f-mono);font-size:11px;color:var(--fg-dim);margin-bottom:10px;}
  .career-cta-link{font-family:var(--f-serif);font-style:italic;font-size:19px;line-height:1.45;display:inline-block;border-bottom:1px solid var(--line-strong);}
  .career-cta-link:hover{border-color:var(--fg);}

  /* ================= CASE STUDY DETAIL ================= */
  .cs-credit{font-family:var(--f-mono);font-size:12px;color:var(--fg-dim);padding:22px 0;border-bottom:1px solid var(--line);}
  .cs-deliverables{display:flex;flex-wrap:wrap;gap:10px;padding:22px 0;border-bottom:1px solid var(--line);}
  .cs-deliverables span{
    font-family:var(--f-sub);font-size:calc(12px + var(--i,0)*3px);color:var(--fg-dim);
  }
  .glyph-strip{
    font-family:var(--f-display);font-size:clamp(30px,7vw,86px);letter-spacing:.02em;
    padding:20px 0;border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap;color:var(--fg-dimmer);
  }
  .cs-head{padding:44px 0;border-bottom:1px solid var(--line);}
  .cs-headline{font-family:var(--f-fraunces);font-weight:600;font-size:clamp(28px,5vw,54px);line-height:1.08;max-width:16ch;}
  .cs-subhead{font-family:var(--f-sub);font-size:16px;color:var(--fg-dim);margin-top:18px;max-width:62ch;line-height:1.6;}
  .cs-details{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:24px;padding:30px 0;border-bottom:1px solid var(--line);}
  .cs-detail-k{font-family:var(--f-mono);font-size:10px;color:var(--fg-dimmer);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;}
  .cs-detail-v{font-family:var(--f-ui);font-size:14px;}
  .cs-gallery{padding:30px 0;border-bottom:1px solid var(--line);}
  .cs-extra-note{font-family:var(--f-mono);font-size:11px;color:var(--fg-dimmer);padding:20px 0;border-bottom:1px solid var(--line);}
  .cs-closer{font-family:var(--f-playfair);font-style:italic;font-size:20px;line-height:1.6;max-width:60ch;padding:40px 0;}
  .cs-footer-nav{display:flex;justify-content:space-between;padding:26px 0;border-top:1px solid var(--line);gap:12px;flex-wrap:wrap;}

  /* ================= LIFE / CONTRACTS ================= */
  .life-layout{display:grid;grid-template-columns:230px 1fr;gap:48px;padding-top:36px;}
  @media (max-width:860px){.life-layout{grid-template-columns:1fr;}}
  .line-sidebar{position:sticky;top:96px;align-self:start;max-height:80vh;overflow:auto;padding-right:8px;}
  @media (max-width:860px){
    .line-sidebar{position:static;display:flex;overflow-x:auto;gap:2px;max-height:none;margin-bottom:24px;padding-bottom:8px;}
  }
  .ls-item{
    display:flex;align-items:center;gap:10px;padding:9px 4px;text-align:left;width:100%;
    border-left:1px solid var(--line);padding-left:14px;
  }
  @media (max-width:860px){.ls-item{border-left:none;border-bottom:2px solid var(--line);white-space:nowrap;}}
  .ls-item.is-active{border-left-color:var(--fg);color:var(--fg);}
  @media (max-width:860px){.ls-item.is-active{border-bottom-color:var(--fg);}}
  .ls-item:not(.is-active){color:var(--fg-dimmer);}
  .ls-label{font-family:var(--f-mono);font-size:11px;}
  .life-opener{font-family:var(--f-playfair);font-style:italic;font-size:22px;padding-bottom:30px;border-bottom:1px solid var(--line);margin-bottom:10px;}
  .chapter{padding:38px 0;border-bottom:1px solid var(--line);scroll-margin-top:120px;}
  .chapter-num{font-family:var(--f-mono);font-size:11px;color:var(--fg-dimmer);}
  .chapter-title{font-family:var(--f-fraunces);font-weight:600;font-size:clamp(22px,3vw,34px);margin-top:6px;}
  .chapter-sub{font-family:var(--f-sub);font-size:13px;color:var(--fg-dim);margin-top:8px;}
  .chapter-body{font-family:var(--f-body);font-size:15px;line-height:1.75;color:#d8d6cd;margin-top:16px;max-width:70ch;}

  /* ================= BALANCE ================= */
  .balance-head{padding:40px 0 20px;}
  .balance-title{font-family:var(--f-display);font-size:clamp(36px,7vw,80px);line-height:1;}
  .balance-sub{font-family:var(--f-sub);font-size:14px;color:var(--fg-dim);margin-top:10px;}
  .balance-split{display:flex;gap:0;align-items:flex-start;}
  .balance-gallery-pane{overflow:hidden;}
  .balance-divider{
    width:14px;flex:0 0 auto;cursor:none;position:relative;align-self:stretch;
  }
  .balance-divider::before{
    content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line-strong);
  }
  .balance-essay-pane{overflow:hidden;}
  @media (max-width:860px){
    .balance-split{flex-direction:column;}
    .balance-divider{display:none;}
    .balance-gallery-pane,.balance-essay-pane{width:100% !important;}
  }
  .masonry{width:100%;}
  .masonry-item{break-inside:avoid;overflow:hidden;margin-bottom:0;filter:grayscale(.35);transition:filter .25s ease,transform .25s ease;}
  .masonry-item:hover{filter:grayscale(0);}
  .masonry-item img{width:100%;display:block;}
  .essay-section{padding:26px 0;border-bottom:1px solid var(--line);}
  .essay-num{font-family:var(--f-mono);font-size:11px;color:var(--fg-dimmer);}
  .essay-headline{font-family:var(--f-serif);font-size:19px;line-height:1.4;margin-top:8px;}
  .essay-summary{font-family:var(--f-body);font-size:13.5px;color:var(--fg-dim);line-height:1.65;margin-top:10px;}
  .photo-modal{
    position:fixed;inset:0;background:rgba(11,11,10,0.92);z-index:2000;display:flex;
    align-items:center;justify-content:center;padding:40px;
  }
  .photo-modal-card{background:var(--paper);color:#111;padding:18px 18px 26px;max-width:640px;width:100%;}
  .photo-modal-card img{width:100%;filter:none;}
  .photo-modal-cap{font-family:var(--f-mono);font-size:11px;margin-top:14px;color:#555;}

  /* ================= JOURNAL / ABOUT ================= */
  .journal-layout{display:grid;grid-template-columns:280px 1fr;gap:48px;padding-top:36px;}
  @media (max-width:860px){.journal-layout{grid-template-columns:1fr;}}
  .flowing-menu{border-top:1px solid var(--line);}
  .fm-item{position:relative;border-bottom:1px solid var(--line);padding:16px 4px;overflow:hidden;}
  .fm-kicker{display:block;font-family:var(--f-mono);font-size:10px;color:var(--fg-dimmer);letter-spacing:.08em;}
  .fm-name{display:block;font-family:var(--f-display);font-size:26px;margin-top:4px;letter-spacing:.02em;}
  .fm-item.is-active .fm-name,.fm-item:hover .fm-name{color:var(--signal);}
  .fm-marquee{
    display:block;font-family:var(--f-mono);font-size:10px;color:var(--fg-dimmer);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:6px;
  }
  .letter-panel{padding-top:4px;}
  .letter-kicker{font-family:var(--f-mono);font-size:11px;color:var(--fg-dimmer);}
  .letter-name{font-family:var(--f-syne);font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.1em;margin-top:8px;}
  .letter-h1{font-family:var(--f-display);font-size:clamp(40px,8vw,96px);line-height:.98;margin-top:10px;}
  .letter-deck{font-family:var(--f-serif);font-style:italic;font-size:18px;color:var(--fg-dim);margin-top:16px;max-width:60ch;}
  .letter-body{margin-top:32px;}

  .bio-grid{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:16px;}
  @media (max-width:700px){.bio-grid{grid-template-columns:1fr;}}
  .bio-p{font-family:var(--f-body);font-size:14.5px;line-height:1.75;color:#d8d6cd;margin-bottom:14px;}

function useCustomCursor() {
  useEffect(() => {
    const dot = document.createElement("div");
    dot.className = "cursor-dot";
    document.body.appendChild(dot);
    function onMove(e) {
      dot.style.top = e.clientY + "px";
      dot.style.left = e.clientX + "px";
      const el = e.target.closest && e.target.closest("a,button,.tilted-card,input[type=range],.masonry-item,.fm-item");
      dot.classList.toggle("is-big", !!el);
    }
    window.addEventListener("mousemove", onMove);
    return () => { window.removeEventListener("mousemove", onMove); document.body.removeChild(dot); };
  }, []);
}

function useClickSpark() {
  useEffect(() => {
    const canvas = document.createElement("canvas");
    Object.assign(canvas.style, { position: "fixed", inset: 0, pointerEvents: "none", zIndex: 9998 });
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    document.body.appendChild(canvas);
    const ctx = canvas.getContext("2d");
    let sparks = [];
    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    function onClick(e) {
      const n = 8;
      for (let i = 0; i < n; i++) {
        const angle = (Math.PI * 2 * i) / n;
        sparks.push({ x: e.clientX, y: e.clientY, angle, life: 1, speed: 2 + Math.random() * 2 });
      }
    }
    window.addEventListener("resize", resize);
    document.addEventListener("click", onClick);
    let raf;
    function tick() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      sparks.forEach((s) => {
        const len = 14 * s.life;
        const x2 = s.x + Math.cos(s.angle) * len;
        const y2 = s.y + Math.sin(s.angle) * len;
        ctx.strokeStyle = `rgba(243,241,234,${s.life})`;
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(x2, y2); ctx.stroke();
        s.x += Math.cos(s.angle) * s.speed; s.y += Math.sin(s.angle) * s.speed; s.life -= 0.045;
      });
      sparks = sparks.filter((s) => s.life > 0);
      raf = requestAnimationFrame(tick);
    }
    tick();
    return () => { document.removeEventListener("click", onClick); window.removeEventListener("resize", resize); cancelAnimationFrame(raf); document.body.removeChild(canvas); };
  }, []);
}

function usePageWipe(route) {
  const [wiping, setWiping] = useState(false);
  const first = useRef(true);
  useEffect(() => {
    if (first.current) { first.current = false; return; }
    setWiping(true);
    const t = setTimeout(() => setWiping(false), 720);
    return () => clearTimeout(t);
  }, [route]);
  return wiping;
}

function SpecularButton({ children, className = "", href = "#", onClick, ...rest }) {
  const ref = useRef(null);
  function onMove(e) {
    const r = ref.current.getBoundingClientRect();
    ref.current.style.setProperty("--sx", ((e.clientX - r.left) / r.width) * 100 + "%");
    ref.current.style.setProperty("--sy", ((e.clientY - r.top) / r.height) * 100 + "%");
  }
  return (
    <a ref={ref} href={href} className={"specular-btn " + className} onMouseMove={onMove}
       onClick={(e) => { if (href === "#") e.preventDefault(); onClick && onClick(e); }} {...rest}>
      <span>{children}</span>
    </a>
  );
}

function Dock({ items, active, onSelect }) {

  return (
    <nav className="dock" onMouseLeave={() => setHoverIdx(null)}>
      {items.map((it, i) => {
        const dist = hoverIdx === null ? 0 : Math.abs(hoverIdx - i);
        const scale = hoverIdx === null ? 1 : Math.max(1, 1.28 - dist * 0.14);
        return (
          <button key={it.id} className={"dock-item" + (active === it.id ? " is-active" : "")}
            style={{ transform: `scale(${scale})` }}
            onMouseEnter={() => setHoverIdx(i)}
            onClick={() => onSelect(it.id)}>
            {it.label}
          </button>
        );
      })}
    </nav>
  );
}

function TiltedCard({ children, className = "", onClick, maxTilt = 6 }) {
  const ref = useRef(null);
  const [style, setStyle] = useState({});
  function onMove(e) {
    const r = ref.current.getBoundingClientRect();
    const px = (e.clientX - r.left) / r.width;
    const py = (e.clientY - r.top) / r.height;
    const rx = (py - 0.5) * -maxTilt * 2;
    const ry = (px - 0.5) * maxTilt * 2;
    setStyle({ transform: `perspective(900px) rotateX(${rx}deg) rotateY(${ry}deg)` });
  }
  function onLeave() { setStyle({ transform: "perspective(900px) rotateX(0) rotateY(0)" }); }
  return (
    <div ref={ref} className={"tilted-card " + className} onMouseMove={onMove} onMouseLeave={onLeave} onClick={onClick} style={style}>
      {children}
    </div>
  );
}

function AnimatedList({ items, renderItem, className = "" }) {
  const ref = useRef(null);
  const [visible, setVisible] = useState(() => items.map(() => false));
  useEffect(() => {
    const els = ref.current.querySelectorAll(".al-item");
    const obs = new IntersectionObserver((entries) => {
      entries.forEach((en) => {
        if (en.isIntersecting) {
          const idx = Number(en.target.dataset.idx);
          setVisible((v) => { const nv = [...v]; nv[idx] = true; return nv; });
        }
      });
    }, { threshold: 0.15 });
    els.forEach((el) => obs.observe(el));
    return () => obs.disconnect();
  }, [items]);
  return (
    <ul className={"animated-list " + className} ref={ref}>
      {items.map((it, i) => (
        <li key={i} className={"al-item" + (visible[i] ? " is-visible" : "")} data-idx={i} style={{ transitionDelay: i * 70 + "ms" }}>
          {renderItem(it, i)}
        </li>
      ))}
    </ul>
  );
}

}

function OptionWheel({ label, options, value, onChange }) {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  useEffect(() => {
    function onDoc(e) { if (ref.current && !ref.current.contains(e.target)) setOpen(false); }
    document.addEventListener("click", onDoc);
    return () => document.removeEventListener("click", onDoc);
  }, []);
  return (
    <div className="option-wheel" ref={ref}>
      <button className="ow-trigger" onClick={() => setOpen((o) => !o)}>{label}: <b>{value}</b></button>
      {open && (
        <div className="ow-ring">

function ParticleHero({ text, big }) {
  const canvasRef = useRef(null);
  useEffect(() => {
    const canvas = canvasRef.current;
    const ctx = canvas.getContext("2d");
    let w, h, particles = [];
    const mouse = { x: -9999, y: -9999 };

    function sampleText(str, fontSize) {
      const off = document.createElement("canvas");
      off.width = w; off.height = h;
      const octx = off.getContext("2d");
      octx.fillStyle = "#fff";
      octx.font = `700 ${fontSize}px Anton, sans-serif`;
      octx.textAlign = "center"; octx.textBaseline = "middle";
      const maxWidth = w * 0.92;
      let size = fontSize;
      octx.font = `700 ${size}px Anton, sans-serif`;
      while (octx.measureText(str).width > maxWidth && size > 8) {
        size -= 2; octx.font = `700 ${size}px Anton, sans-serif`;
      }
      octx.fillText(str, w / 2, h / 2);
      const data = octx.getImageData(0, 0, w, h).data;
      const pts = [];
      const gap = Math.max(3, Math.round(w / 220));
      for (let y = 0; y < h; y += gap) {
        for (let x = 0; x < w; x += gap) {
          if (data[(y * w + x) * 4 + 3] > 128) pts.push({ tx: x, ty: y });
        }
      }
      return pts;
    }

    function build() {
      const pts = sampleText(text, big ? Math.min(w / 5, 150) : Math.min(w / 5, 150));
      particles = pts.map((p) => ({ x: Math.random() * w, y: Math.random() * h, tx: p.tx, ty: p.ty, vx: 0, vy: 0 }));
    }

    function resize() {
      w = canvas.parentElement.clientWidth; h = canvas.parentElement.clientHeight;
      canvas.width = w; canvas.height = h;
      build();
    }

    function onMove(e) {
      const r = canvas.getBoundingClientRect();
      mouse.x = e.clientX - r.left; mouse.y = e.clientY - r.top;
    }
    function onLeave() { mouse.x = -9999; mouse.y = -9999; }

    canvas.addEventListener("mousemove", onMove);
    canvas.addEventListener("mouseleave", onLeave);
    window.addEventListener("resize", resize);
    resize();

    let raf;
    function tick() {
      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = "rgba(243,241,234,0.88)";
      particles.forEach((p) => {
        const dx = p.tx - p.x, dy = p.ty - p.y;
        p.vx += dx * 0.02; p.vy += dy * 0.02;
        const mdx = p.x - mouse.x, mdy = p.y - mouse.y;
        const dist = Math.hypot(mdx, mdy);
        if (dist < 55 && dist > 0) {
          const f = ((55 - dist) / 55) * 3.2;
          p.vx += (mdx / dist) * f; p.vy += (mdy / dist) * f;
        }
        p.vx *= 0.82; p.vy *= 0.82;
        p.x += p.vx; p.y += p.vy;
        ctx.fillRect(p.x, p.y, 1.6, 1.6);
      });
      raf = requestAnimationFrame(tick);
    }
    tick();

    return () => {
      window.removeEventListener("resize", resize);
      canvas.removeEventListener("mousemove", onMove);
      canvas.removeEventListener("mouseleave", onLeave);
      cancelAnimationFrame(raf);
    };
  }, [text]);
  return <canvas className="particle-hero" ref={canvasRef} />;
}

/* =========================================================================
   APP SHELL
   ========================================================================= */

function parseHash() {
  const h = window.location.hash.replace("#", "") || "index";
  return h;
}

function App() {
  const [route, setRoute] = useState(parseHash());
  const [breadcrumbMode, setBreadcrumbMode] = useState("xp");
  useCustomCursor();
  useClickSpark();
  const wiping = usePageWipe(route);

  useEffect(() => {
    function onHash() { setRoute(parseHash()); window.scrollTo({ top: 0 }); }
    window.addEventListener("hashchange", onHash);
    return () => window.removeEventListener("hashchange", onHash);
  }, []);

  function navigate(id) {
    window.location.hash = "#" + id;
  }

  const isCase = route.startsWith("case/");
  const caseId = isCase ? route.split("/")[1] : null;
  const cs = isCase ? CASE_STUDIES.find((c) => c.id === caseId) : null;

  let breadcrumbLabel = "Work";
  if (route === "contracts") breadcrumbLabel = "Life";
  if (route === "generalassembly") breadcrumbLabel = "Balance";
  if (route === "about") breadcrumbLabel = "Journal";
  if (isCase && cs) breadcrumbLabel = cs.client;

  const navActiveId = isCase ? "index" : route;

  return (
    <div className="app">
      <div className={"page-wipe" + (wiping ? " is-active" : "")} />
      <TopChrome
        route={navActiveId}
        isIndex={route === "index"}
        onNavigate={navigate}
        breadcrumbMode={breadcrumbMode}
        setBreadcrumbMode={setBreadcrumbMode}
        breadcrumbLabel={breadcrumbLabel}
      />
      <main style={{ flex: 1 }}>
        {route === "index" && <WorkPage onOpenCase={(id) => navigate("case/" + id)} breadcrumbMode={breadcrumbMode} />}
        {route === "contracts" && <LifePage />}
        {route === "generalassembly" && <BalancePage />}
        {route === "about" && <JournalPage />}
        {isCase && cs && (
          <CaseStudyPage cs={cs} onOpenCase={(id) => navigate("case/" + id)} onBack={() => navigate("index")} />
        )}
      </main>
      <footer className="site-footer wrap">
        <span>Zack Gort — Wolfgang &amp; Co. © {new Date().getFullYear()}</span>
        <span>Single-page application · client-side view routing</span>
      </footer>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
