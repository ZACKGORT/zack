<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LOOP — Guitar Looper</title>
<style>
  :root{
    --bg:#0A0A0A;
    --paper:#F2F0EA;
    --dim:#5A5850;
    --line:#2A2926;
    --flat:#FF6A3D;
    --sharp:#3DA8FF;
    --true:#5CFF9D;
    --rec:#FF3D5C;
    --mono: 'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
    --disp: 'Neue Haas Grotesk Display', 'Helvetica Neue', Arial, sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; height:100%; background:var(--bg); color:var(--paper);
    font-family:var(--disp); overflow:hidden; touch-action:manipulation;
    -webkit-user-select:none; user-select:none;
  }
  #scope{ position:fixed; inset:0; width:100%; height:100%; opacity:0.45; }
  .app{
    position:relative; z-index:2; height:100%; display:flex; flex-direction:column;
    align-items:center; justify-content:space-between; padding:28px 20px 22px;
  }

  /* --- top: bpm stepper --- */
  .top{ width:100%; max-width:560px; display:flex; justify-content:center; }
  .bpmRow{
    display:flex; align-items:center; gap:14px; border:1px solid var(--line);
    border-radius:999px; padding:6px 8px;
  }
  .bpmRow button{
    appearance:none; border:none; background:transparent; color:var(--paper);
    font-family:var(--mono); font-size:15px; width:26px; height:26px; border-radius:50%;
    cursor:pointer; line-height:1;
  }
  .bpmRow button:active{ background:var(--line); }
  .bpmRow button:disabled{ color:var(--line); cursor:default; }
  .bpmMid{ font-family:var(--mono); font-size:11px; letter-spacing:0.12em; color:var(--dim); text-transform:uppercase; }
  .bpmMid b{ color:var(--paper); font-weight:600; }

  /* --- center --- */
  .center{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; width:100%; gap:18px; }
  .status{
    font-family:var(--mono); font-size:11px; letter-spacing:0.2em; text-transform:uppercase;
    color:var(--dim); height:16px; text-align:center;
  }
  .status.live{ color:var(--rec); }
  .status.ok{ color:var(--true); }

  .timeDisplay{
    font-family:var(--mono); font-size:min(14vw, 64px); font-weight:600; letter-spacing:-0.02em;
    color:var(--paper); font-variant-numeric:tabular-nums;
  }
  .countBig{
    font-family:var(--disp); font-size:min(28vw, 180px); font-weight:600; color:var(--paper);
    line-height:1; min-height:min(28vw,180px); display:flex; align-items:center; justify-content:center;
  }

  .waveWrap{
    width:min(92vw, 560px); display:none; flex-direction:column; align-items:center; gap:10px;
  }
  .waveWrap.show{ display:flex; }
  .waveBox{
    position:relative; width:100%; height:110px; border:1px solid var(--line); border-radius:8px; overflow:hidden;
  }
  .waveBox canvas{ position:absolute; inset:0; width:100%; height:100%; }
  .handle{
    position:absolute; top:0; bottom:0; width:14px; margin-left:-7px; cursor:ew-resize;
    display:flex; align-items:center; justify-content:center; touch-action:none;
  }
  .handle::before{
    content:''; position:absolute; top:0; bottom:0; left:6px; width:2px; background:var(--true);
  }
  .handle .grip{
    width:14px; height:26px; border-radius:4px; background:var(--true); position:relative; z-index:2;
    box-shadow:0 0 0 3px var(--bg);
  }
  .handle.start .grip::after, .handle.end .grip::after{
    content:''; position:absolute; inset:5px; border-left:1px solid var(--bg); border-right:1px solid var(--bg);
  }
  .dimLeft, .dimRight{
    position:absolute; top:0; bottom:0; background:rgba(10,10,10,0.72); pointer-events:none; z-index:1;
  }
  .playhead{
    position:absolute; top:0; bottom:0; width:1px; background:var(--paper); pointer-events:none; z-index:3;
    opacity:0; box-shadow:0 0 6px rgba(242,240,234,0.6);
  }
  .waveHint{ font-family:var(--mono); font-size:10px; color:var(--dim); letter-spacing:0.08em; text-transform:uppercase; text-align:center; }

  /* --- bottom --- */
  .bottom{ width:100%; max-width:560px; display:flex; flex-direction:column; align-items:center; gap:18px; }

  .mainBtn{
    appearance:none; width:96px; height:96px; border-radius:50%; cursor:pointer;
    font-family:var(--mono); font-size:11px; letter-spacing:0.1em; text-transform:uppercase; font-weight:600;
    display:flex; align-items:center; justify-content:center; text-align:center;
    border:2px solid var(--paper); background:transparent; color:var(--paper);
    transition:background .15s ease, border-color .15s ease, color .15s ease, transform .1s ease;
  }
  .mainBtn:active{ transform:scale(0.94); }
  .mainBtn.idle{ border-color:var(--paper); color:var(--paper); }
  .mainBtn.counting{ border-color:var(--dim); color:var(--dim); animation:pulseDim 0.6s ease-in-out infinite; }
  .mainBtn.recording{ background:var(--rec); border-color:var(--rec); color:var(--bg); animation:pulseRec 1s ease-in-out infinite; }
  .mainBtn.ready{ background:var(--true); border-color:var(--true); color:var(--bg); }
  .mainBtn.playing{ border-color:var(--true); color:var(--true); animation:pulseTrue 1.2s ease-in-out infinite; }

  @keyframes pulseRec{ 0%,100%{ box-shadow:0 0 0 0 rgba(255,61,92,0.45);} 50%{ box-shadow:0 0 0 14px rgba(255,61,92,0);} }
  @keyframes pulseTrue{ 0%,100%{ box-shadow:0 0 0 0 rgba(92,255,157,0.35);} 50%{ box-shadow:0 0 0 10px rgba(92,255,157,0);} }
  @keyframes pulseDim{ 0%,100%{ opacity:1;} 50%{ opacity:0.4;} }

  .subRow{ display:flex; gap:10px; align-items:center; min-height:34px; }
  .subBtn{
    appearance:none; border:1px solid var(--line); background:transparent; color:var(--dim);
    font-family:var(--mono); font-size:10px; letter-spacing:0.1em; text-transform:uppercase;
    padding:9px 16px; border-radius:999px; cursor:pointer; transition:all .15s ease;
  }
  .subBtn:active{ background:var(--line); color:var(--paper); }
  .subBtn.hide{ display:none; }

  .volumeRow{ display:flex; align-items:center; gap:10px; width:100%; }
  .volIcon{ color:var(--dim); font-family:var(--mono); font-size:14px; width:12px; text-align:center; }
  .volReadout{ font-family:var(--mono); font-size:11px; color:var(--dim); width:40px; text-align:right; }
  #volSlider{
    flex:1; -webkit-appearance:none; appearance:none; height:3px; background:var(--line);
    border-radius:2px; outline:none;
  }
  #volSlider::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none; width:16px; height:16px; border-radius:50%;
    background:var(--paper); cursor:pointer; border:none;
  }
  #volSlider::-moz-range-thumb{ width:16px; height:16px; border-radius:50%; background:var(--paper); cursor:pointer; border:none; }

  .startOverlay{
    position:fixed; inset:0; z-index:10; background:var(--bg); display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:22px; text-align:center; padding:24px;
  }
  .startOverlay h1{ font-size:15px; letter-spacing:0.2em; text-transform:uppercase; color:var(--dim); font-weight:500; margin:0; }
  .startBtn{
    appearance:none; border:1px solid var(--paper); background:transparent; color:var(--paper);
    font-family:var(--mono); font-size:13px; letter-spacing:0.15em; text-transform:uppercase;
    padding:16px 34px; border-radius:999px; cursor:pointer;
  }
  .startBtn:active{ background:var(--paper); color:var(--bg); }
  .err{ font-family:var(--mono); font-size:11px; color:var(--flat); max-width:320px; }
</style>
</head>
<body>

<canvas id="scope"></canvas>

<div class="startOverlay" id="startOverlay">
  <h1>Loop — a guitar looper</h1>
  <button class="startBtn" id="startBtn">Enable Microphone</button>
  <div class="err" id="err"></div>
</div>

<div class="app">
  <div class="top">
    <div class="bpmRow">
      <button id="bpmDown">−</button>
      <div class="bpmMid">Count-in <b id="bpmVal">90</b> bpm</div>
      <button id="bpmUp">+</button>
    </div>
  </div>

  <div class="center">
    <div class="status" id="status">tap record to begin</div>
    <div class="countBig" id="countBig" style="display:none;"></div>
    <div class="timeDisplay" id="timeDisplay" style="display:none;">0:00.0</div>

    <div class="waveWrap" id="waveWrap">
      <div class="waveBox" id="waveBox">
        <canvas id="waveCanvas"></canvas>
        <div class="dimLeft" id="dimLeft"></div>
        <div class="dimRight" id="dimRight"></div>
        <div class="playhead" id="playhead"></div>
        <div class="handle start" id="handleStart"><div class="grip"></div></div>
        <div class="handle end" id="handleEnd"><div class="grip"></div></div>
      </div>
      <div class="waveHint">Drag the edges to close the loop cleanly</div>
    </div>
  </div>

  <div class="bottom">
    <div class="subRow">
      <button class="subBtn hide" id="rerecordBtn">Re-record</button>
    </div>
    <button class="mainBtn idle" id="mainBtn">Record</button>
    <div class="volumeRow">
      <span class="volIcon">−</span>
      <input type="range" id="volSlider" min="0" max="150" value="100" step="1">
      <span class="volIcon">+</span>
      <span class="volReadout" id="volReadout">100%</span>
    </div>
  </div>
</div>

<script>
// ---------- State ----------
let STATE = 'idle'; // idle | counting | recording | ready | playing
let bpm = 90;
const COUNT_BEATS = 4;
const MAX_RECORD_SECONDS = 60;
const MIN_LOOP_SECONDS = 0.08;

let audioCtx, mic, analyser, processor, silentGain, playGain;
let dataArray;

let recording = false;
let recordedChunks = [];
let recordStartCtxTime = null;
let recTimerRaf = null;

let rawBuffer = null;      // AudioBuffer of the raw take
let trimStart = 0;
let trimEnd = 0;

let playSource = null;
let playStartCtxTime = null;
let playheadRaf = null;

let countInTimeoutIds = [];

const el = {
  scope: document.getElementById('scope'),
  startOverlay: document.getElementById('startOverlay'),
  startBtn: document.getElementById('startBtn'),
  err: document.getElementById('err'),
  bpmVal: document.getElementById('bpmVal'),
  bpmDown: document.getElementById('bpmDown'),
  bpmUp: document.getElementById('bpmUp'),
  status: document.getElementById('status'),
  countBig: document.getElementById('countBig'),
  timeDisplay: document.getElementById('timeDisplay'),
  waveWrap: document.getElementById('waveWrap'),
  waveBox: document.getElementById('waveBox'),
  waveCanvas: document.getElementById('waveCanvas'),
  dimLeft: document.getElementById('dimLeft'),
  dimRight: document.getElementById('dimRight'),
  playhead: document.getElementById('playhead'),
  handleStart: document.getElementById('handleStart'),
  handleEnd: document.getElementById('handleEnd'),
  mainBtn: document.getElementById('mainBtn'),
  rerecordBtn: document.getElementById('rerecordBtn'),
  volSlider: document.getElementById('volSlider'),
  volReadout: document.getElementById('volReadout'),
};

// ---------- BPM stepper ----------
function setBpm(v){
  bpm = Math.max(50, Math.min(200, v));
  el.bpmVal.textContent = bpm;
}
el.bpmDown.addEventListener('click', () => setBpm(bpm - 5));
el.bpmUp.addEventListener('click', () => setBpm(bpm + 5));

// ---------- Time formatting ----------
function fmtTime(sec){
  const m = Math.floor(sec / 60);
  const s = sec - m * 60;
  return m + ':' + s.toFixed(1).padStart(4, '0');
}

// ---------- UI state machine ----------
function setState(next){
  STATE = next;
  el.mainBtn.className = 'mainBtn ' + next;
  el.bpmDown.disabled = next !== 'idle';
  el.bpmUp.disabled = next !== 'idle';

  el.countBig.style.display = 'none';
  el.timeDisplay.style.display = 'none';
  el.waveWrap.classList.remove('show');
  el.rerecordBtn.classList.add('hide');
  el.status.className = 'status';

  if(next === 'idle'){
    el.status.textContent = 'tap record to begin';
    el.mainBtn.textContent = 'Record';
  } else if(next === 'counting'){
    el.status.textContent = 'count-in — get ready';
    el.countBig.style.display = 'flex';
    el.mainBtn.textContent = 'Cancel';
  } else if(next === 'recording'){
    el.status.textContent = 'recording';
    el.status.classList.add('live');
    el.timeDisplay.style.display = 'block';
    el.mainBtn.textContent = 'Stop';
  } else if(next === 'ready'){
    el.status.textContent = 'loop ready';
    el.status.classList.add('ok');
    el.timeDisplay.style.display = 'block';
    el.timeDisplay.textContent = fmtTime(trimEnd - trimStart);
    el.waveWrap.classList.add('show');
    el.rerecordBtn.classList.remove('hide');
    el.mainBtn.textContent = 'Play';
    el.playhead.style.opacity = 0;
  } else if(next === 'playing'){
    el.status.textContent = 'playing';
    el.status.classList.add('ok');
    el.timeDisplay.style.display = 'block';
    el.timeDisplay.textContent = fmtTime(trimEnd - trimStart);
    el.waveWrap.classList.add('show');
    el.rerecordBtn.classList.remove('hide');
    el.mainBtn.textContent = 'Stop';
    el.playhead.style.opacity = 1;
  }
}

// ---------- Main button dispatch ----------
el.mainBtn.addEventListener('click', () => {
  if(STATE === 'idle') armCountIn();
  else if(STATE === 'counting') cancelCountIn();
  else if(STATE === 'recording') stopRecording();
  else if(STATE === 'ready') startPlayback();
  else if(STATE === 'playing') stopPlayback();
});

el.rerecordBtn.addEventListener('click', () => {
  stopPlayback();
  rawBuffer = null;
  recordedChunks = [];
  setState('idle');
});

// ---------- Count-in + metronome click ----------
function scheduleClick(time, accent){
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(accent ? 1400 : 900, time);
  g.gain.setValueAtTime(0, time);
  g.gain.linearRampToValueAtTime(accent ? 0.35 : 0.22, time + 0.005);
  g.gain.exponentialRampToValueAtTime(0.0001, time + 0.06);
  osc.connect(g);
  g.connect(audioCtx.destination);
  osc.start(time);
  osc.stop(time + 0.07);
}

function armCountIn(){
  setState('counting');
  const interval = 60 / bpm;
  const lead = 0.05;
  const now = audioCtx.currentTime + lead;

  for(let i = 0; i < COUNT_BEATS; i++){
    scheduleClick(now + i * interval, i === 0);
    const displayDelayMs = Math.max(0, (now + i * interval - audioCtx.currentTime) * 1000);
    const id = setTimeout(() => {
      el.countBig.textContent = COUNT_BEATS - i;
    }, displayDelayMs);
    countInTimeoutIds.push(id);
  }

  const recordStartTime = now + COUNT_BEATS * interval;
  const startDelayMs = Math.max(0, (recordStartTime - audioCtx.currentTime) * 1000);
  const goId = setTimeout(() => { beginRecording(); }, startDelayMs);
  countInTimeoutIds.push(goId);
}

function cancelCountIn(){
  countInTimeoutIds.forEach(id => clearTimeout(id));
  countInTimeoutIds = [];
  setState('idle');
}

// ---------- Recording ----------
function beginRecording(){
  countInTimeoutIds = [];
  recordedChunks = [];
  recording = true;
  recordStartCtxTime = audioCtx.currentTime;
  setState('recording');
  updateRecTimer();
}

function updateRecTimer(){
  const elapsed = audioCtx.currentTime - recordStartCtxTime;
  el.timeDisplay.textContent = fmtTime(elapsed);
  if(elapsed >= MAX_RECORD_SECONDS){ stopRecording(); return; }
  if(recording) recTimerRaf = requestAnimationFrame(updateRecTimer);
}

function stopRecording(){
  recording = false;
  if(recTimerRaf) cancelAnimationFrame(recTimerRaf);
  finalizeBuffer();
  setState('ready');
}

function finalizeBuffer(){
  const totalLen = recordedChunks.reduce((sum, c) => sum + c.length, 0);
  if(totalLen === 0){ setState('idle'); return; }
  const merged = new Float32Array(totalLen);
  let offset = 0;
  for(const chunk of recordedChunks){ merged.set(chunk, offset); offset += chunk.length; }

  rawBuffer = audioCtx.createBuffer(1, totalLen, audioCtx.sampleRate);
  rawBuffer.copyToChannel(merged, 0);
  recordedChunks = [];

  trimStart = 0;
  trimEnd = rawBuffer.duration;
  drawWaveform();
  positionHandles();
}

// ---------- Waveform drawing ----------
function drawWaveform(){
  if(!rawBuffer) return;
  const canvas = el.waveCanvas;
  const rect = el.waveBox.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  const cx = canvas.getContext('2d');
  cx.clearRect(0, 0, canvas.width, canvas.height);

  const data = rawBuffer.getChannelData(0);
  const w = canvas.width, h = canvas.height, mid = h / 2;
  const samplesPerPx = Math.max(1, Math.floor(data.length / w));

  cx.strokeStyle = 'rgba(242,240,234,0.55)';
  cx.lineWidth = Math.max(1, dpr);
  cx.beginPath();
  for(let x = 0; x < w; x++){
    const start = x * samplesPerPx;
    let min = 1, max = -1;
    for(let i = 0; i < samplesPerPx; i++){
      const v = data[start + i] || 0;
      if(v < min) min = v;
      if(v > max) max = v;
    }
    cx.moveTo(x, mid + min * mid * 0.92);
    cx.lineTo(x, mid + max * mid * 0.92);
  }
  cx.stroke();
}

function positionHandles(){
  if(!rawBuffer) return;
  const dur = rawBuffer.duration;
  const startPct = (trimStart / dur) * 100;
  const endPct = (trimEnd / dur) * 100;
  el.handleStart.style.left = startPct + '%';
  el.handleEnd.style.left = endPct + '%';
  el.dimLeft.style.left = '0%';
  el.dimLeft.style.width = startPct + '%';
  el.dimRight.style.left = endPct + '%';
  el.dimRight.style.width = (100 - endPct) + '%';
}

// ---------- Trim handle dragging ----------
function bindHandleDrag(handleEl, isStart){
  handleEl.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    handleEl.setPointerCapture(e.pointerId);
    const onMove = (ev) => {
      const rect = el.waveBox.getBoundingClientRect();
      const pct = Math.max(0, Math.min(1, (ev.clientX - rect.left) / rect.width));
      const t = pct * rawBuffer.duration;
      if(isStart){
        trimStart = Math.min(t, trimEnd - MIN_LOOP_SECONDS);
        trimStart = Math.max(0, trimStart);
      } else {
        trimEnd = Math.max(t, trimStart + MIN_LOOP_SECONDS);
        trimEnd = Math.min(rawBuffer.duration, trimEnd);
      }
      positionHandles();
      if(playSource){
        playSource.loopStart = trimStart;
        playSource.loopEnd = trimEnd;
      }
      if(STATE === 'ready' || STATE === 'playing'){
        el.timeDisplay.textContent = fmtTime(trimEnd - trimStart);
      }
    };
    const onUp = (ev) => {
      handleEl.releasePointerCapture(e.pointerId);
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
    };
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
  });
}
bindHandleDrag(el.handleStart, true);
bindHandleDrag(el.handleEnd, false);

// ---------- Playback ----------
function startPlayback(){
  if(!rawBuffer) return;
  playSource = audioCtx.createBufferSource();
  playSource.buffer = rawBuffer;
  playSource.loop = true;
  playSource.loopStart = trimStart;
  playSource.loopEnd = trimEnd;
  playSource.connect(playGain);
  playStartCtxTime = audioCtx.currentTime;
  playSource.start(0, trimStart);
  setState('playing');
  animatePlayhead();
}

function stopPlayback(){
  if(playSource){
    try{ playSource.stop(); } catch(e){}
    playSource.disconnect();
    playSource = null;
  }
  if(playheadRaf) cancelAnimationFrame(playheadRaf);
  if(rawBuffer) setState('ready');
}

function animatePlayhead(){
  if(STATE !== 'playing' || !rawBuffer) return;
  const loopLen = trimEnd - trimStart;
  const elapsed = (audioCtx.currentTime - playStartCtxTime) % loopLen;
  const pos = trimStart + elapsed;
  const pct = (pos / rawBuffer.duration) * 100;
  el.playhead.style.left = pct + '%';
  playheadRaf = requestAnimationFrame(animatePlayhead);
}

// ---------- Volume ----------
el.volSlider.addEventListener('input', () => {
  const pct = +el.volSlider.value;
  el.volReadout.textContent = pct + '%';
  if(playGain) playGain.gain.value = pct / 100;
});

// ---------- Background oscilloscope (live mic) ----------
const ctx2d = el.scope.getContext('2d');
function resizeScope(){
  el.scope.width = window.innerWidth * devicePixelRatio;
  el.scope.height = window.innerHeight * devicePixelRatio;
}
resizeScope();
window.addEventListener('resize', () => { resizeScope(); drawWaveform(); positionHandles(); });

function drawScope(buf){
  const w = el.scope.width, h = el.scope.height;
  ctx2d.clearRect(0, 0, w, h);
  ctx2d.beginPath();
  ctx2d.lineWidth = 1.5 * devicePixelRatio;
  ctx2d.strokeStyle = STATE === 'recording' ? 'rgba(255,61,92,0.18)' : 'rgba(242,240,234,0.12)';
  const midY = h / 2;
  const step = w / buf.length;
  for(let i = 0; i < buf.length; i++){
    const x = i * step;
    const y = midY + buf[i] * midY * 0.9;
    if(i === 0) ctx2d.moveTo(x, y); else ctx2d.lineTo(x, y);
  }
  ctx2d.stroke();
}

function scopeLoop(){
  if(analyser){
    analyser.getFloatTimeDomainData(dataArray);
    drawScope(dataArray);
  }
  requestAnimationFrame(scopeLoop);
}

// ---------- Mic + recording graph ----------
async function start(){
  try{
    const stream = await navigator.mediaDevices.getUserMedia({ audio: {
      echoCancellation:false, noiseSuppression:false, autoGainControl:false
    }});
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    mic = audioCtx.createMediaStreamSource(stream);

    // live scope
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 2048;
    dataArray = new Float32Array(analyser.fftSize);
    mic.connect(analyser);

    // recording chain — ScriptProcessorNode captures raw mic samples.
    // Routed through a zero-gain node to destination to keep it alive,
    // so the mic is never itself audible (avoids feedback through speakers).
    processor = audioCtx.createScriptProcessor(4096, 1, 1);
    silentGain = audioCtx.createGain();
    silentGain.gain.value = 0;
    mic.connect(processor);
    processor.connect(silentGain);
    silentGain.connect(audioCtx.destination);
    processor.onaudioprocess = (e) => {
      if(!recording) return;
      recordedChunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));
    };

    // playback chain
    playGain = audioCtx.createGain();
    playGain.gain.value = (+el.volSlider.value) / 100;
    playGain.connect(audioCtx.destination);

    el.startOverlay.style.display = 'none';
    setState('idle');
    scopeLoop();
  } catch(e){
    el.err.textContent = 'Microphone access failed: ' + e.message + '. Check your browser/site permissions and try again.';
  }
}

el.startBtn.addEventListener('click', start);
</script>
</body>
</html>
