/* blocks: rendered view (.vw) swaps with a growing textarea (.ed) while editing */
.blk{position:relative;transition:border-color .2s;border-left:3px solid transparent;padding-left:12px;margin-left:-15px;}

.vw{white-space:pre-wrap;overflow-wrap:anywhere;min-height:1.2em;cursor:text;outline:0}
.vw:empty::before{content:attr(data-ph);color:var(--muted);opacity:.55}

.blk.ef .vw{display:none}.blk.ef .ed{display:grid}

.kicker,.sig{font-family:var(--f-meta,Satoshi,system-ui,sans-serif);font-weight:var(--w-meta,400);font-size:calc(13px*var(--z-meta,1)*var(--fs,1)*var(--bz,1));line-height:var(--l-meta,1.3);letter-spacing:var(--s-meta,0em);color:var(--c-meta, var(--muted));transition:color .3s}
.kicker{margin:0 0 14px}
.title{font-family:var(--f-title,Satoshi,system-ui,sans-serif);font-weight:var(--w-title,500);font-size:calc(clamp(34px,6vw,52px)*var(--z-title,1)*var(--fs,1)*var(--bz,1));line-height:var(--l-title,1.08);letter-spacing:var(--s-title,-.025em);margin:0 0 18px;color:var(--c-title, var(--fg));transition:color .3s}
.dek{font-family:var(--f-dek,Satoshi,system-ui,sans-serif);font-weight:var(--w-dek,400);font-size:calc(21px*var(--z-dek,1)*var(--fs,1)*var(--bz,1));line-height:var(--l-dek,1.45);letter-spacing:var(--s-dek,0em);color:var(--c-dek, var(--muted));margin:0 0 56px;transition:color .3s}
.sig{margin-top:56px}
.rd{font-family:var(--f-p,Satoshi,system-ui,sans-serif);font-weight:var(--w-p,400);font-size:calc(clamp(20px,2.6vw,22px)*var(--z-p,1)*var(--fs,1)*var(--bz,1));line-height:var(--l-p,1.6);letter-spacing:var(--s-p,0em);margin:0 0 1.5em;opacity:var(--inactive);filter:blur(var(--blur));transition:opacity .8s ease,filter .8s ease,color .3s;color:var(--c-p, var(--fg))}
.rd.in{opacity:1;filter:blur(0)}
.hl{background-image:linear-gradient(var(--hl),var(--hl));background-repeat:no-repeat;background-size:var(--s0);background-position:var(--pos);border-radius:3px;padding:0 3px;margin:0 -3px;-webkit-box-decoration-break:clone;box-decoration-break:clone;transition:background-size var(--hdur) ease var(--hdelay)}
.rd.in .hl,.blk:not(.rd) .hl,.w-on .rd .hl{background-size:var(--s1)}
/* writing: the paragraph you're in is sharp, the rest soften */
.w-on .rd:not(.ef){opacity:var(--inactive);filter:blur(var(--blur))}
.w-on .rd.ef{opacity:1;filter:none}
/* neighbours of the line you're writing stay legible: closer = clearer */
.w-on .rd[data-near="1"]:not(.ef){opacity:max(var(--inactive),.85);filter:blur(calc(var(--blur)*.2))}
.w-on .rd[data-near="2"]:not(.ef){opacity:max(var(--inactive),.55);filter:blur(calc(var(--blur)*.5))}
.w .body{max-height:min(72vh,calc(100vh - 150px));overflow:auto;overflow-x:hidden}

/* links + hover preview */
.vw a{color:inherit;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:.22em;text-decoration-color:var(--muted);transition:text-decoration-color .15s;cursor:pointer}

.pv{position:fixed;z-index:30;display:block;width:400px;max-width:calc(100vw - 24px);background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.14);opacity:0;transform:translateY(4px);pointer-events:none;transition:opacity .16s ease,transform .16s ease;font:500 12px Satoshi,system-ui,sans-serif;color:var(--muted);text-decoration:none}

/* Floating Window */

/* HUD Redesign */
.hud{position:fixed;right:max(14px,env(safe-area-inset-right,0px));top:calc(60px + env(safe-area-inset-top,0px));z-index:50;display:flex;flex-direction:column;align-items:flex-end;gap:8px;font-size:12px;max-width:calc(100vw - 28px)}

#wTune>button{display:none}

/* minimal page scroll indicator: a 3px thumb that appears while scrolling, then fades. Colour follows the theme. */
html{scrollbar-width:none}
html::-webkit-scrollbar{display:none}
.sbar{position:fixed;z-index:14;right:max(3px,env(safe-area-inset-right,0px));top:calc(72px + env(safe-area-inset-top,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:3px;pointer-events:none;opacity:0;transition:opacity .4s ease}

.zone{padding:12px;border-bottom:1px solid var(--line);}
.zone:last-child{border-bottom:0}
.z-title{font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:10px}
.row{display:grid;grid-template-columns:60px 1fr 44px;align-items:center;gap:8px;height:24px;color:var(--muted);margin-bottom:4px}

input[type=range]{width:100%;margin:0;accent-color:var(--fg);height:16px}
.line{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px;color:var(--muted)}
.seg{display:flex;background:var(--chip);border-radius:8px;padding:2px}
.seg button{all:unset;cursor:pointer;width:26px;height:20px;text-align:center;border-radius:6px;color:var(--muted);font-size:11px;display:flex;align-items:center;justify-content:center}
.seg.wd button{width:auto;min-width:34px;padding:0 9px;line-height:22px;font-size:12px}
.seg button[aria-pressed=true]{background:var(--bg);color:var(--fg);box-shadow:0 0 0 1px var(--line)}
.seg button:focus-visible,.sw:focus-within,.mini:focus-visible{outline:2px solid var(--fg);outline-offset:1px}
.sw{position:relative;display:flex;align-items:center;gap:6px;cursor:pointer}
.sw i{width:18px;height:18px;border-radius:5px;border:1px solid var(--line);display:block}
.sw input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.mini{all:unset;box-sizing:border-box;cursor:pointer;background:var(--chip);color:var(--fg);border-radius:8px;padding:5px 10px;font-weight:500}
.actions{display:flex;gap:6px;flex-wrap:wrap;padding:12px;background:var(--bg);border-top:1px solid var(--line)}
.actions .mini{font-size:10px;padding:4px 8px;background:none;border:1px solid var(--line);color:var(--muted);opacity:.8;transition:all .2s}
.actions .mini:hover{opacity:1;color:var(--fg);border-color:var(--fg)}

.stat{padding:8px 12px;display:flex;align-items:center;justify-content:space-between;font-variant-numeric:tabular-nums;color:var(--muted);font-size:11px;border-bottom:1px solid var(--line);background:var(--bg)}
.stat span#cnt{color:var(--fg);font-weight:700}
.stat span#hc{color:var(--muted)}
#msg{padding:10px 12px 10px;color:var(--muted);line-height:1.4;font-size:11px}#msg:empty{display:none}
.st.pulse{animation:pl .35s}@keyframes pl{30%{transform:translateX(-3px)}60%{transform:translateX(3px)}}
/* touch / small screens: a static hint of softness instead of the animated blur.
   The filter value is fixed and never transitioned (animating it repaints every paragraph per frame, which was the cost);
   the fade is opacity + a small lift, which stay on the compositor. */
@media (hover:none),(pointer:coarse),(max-width:640px){
  .rd{filter:blur(1.5px)!important;transform:translate3d(0,6px,0);transition:opacity .45s ease,transform .45s ease,color .3s}
  .rd.in{filter:none!important;transform:none}
  .w-on .rd:not(.ef){filter:blur(1.5px)!important;transform:none}

  .w-on .rd[data-near="1"]:not(.ef){filter:none!important}

}

.fbar{position:fixed;z-index:60;left:50%;bottom:calc(var(--kb,0px) + max(14px,env(safe-area-inset-bottom,0px)));transform:translate(-50%,6px);display:flex;align-items:center;gap:2px;padding:4px;max-width:calc(100vw - 24px);background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 28px rgba(0,0,0,.12);opacity:0;visibility:hidden;transition:opacity .18s ease,transform .18s ease,visibility 0s .18s}
.fbar.on{opacity:1;visibility:visible;transform:translate(-50%,0);transition:opacity .18s ease,transform .18s ease}
.fbar .fm,.fbar .fu{display:flex;align-items:center;gap:2px}
.fbar .fu{display:none;gap:4px}

/* ---- slosh gauge (text size) — shown when nothing is being edited ---- */
.sg-dock{position:fixed;z-index:50;right:max(14px,env(safe-area-inset-right,0px));bottom:max(14px,env(safe-area-inset-bottom,0px));transition:opacity .2s ease,visibility 0s}
body.editing .sg-dock{opacity:0;visibility:hidden;pointer-events:none;transition:opacity .2s ease,visibility 0s .2s}
.slosh-gauge{--sg-w:48px;--sg-h:128px;--sg-r:16px;--sg-glass:var(--chip);--sg-liquid:var(--fg);--sg-on-liquid:var(--bg);--sg-ticks:4;--sg-font:12px;
  position:relative;display:inline-block;box-sizing:border-box;width:var(--sg-w);height:var(--sg-h);border-radius:var(--sg-r);border:1px solid var(--line);overflow:clip;isolation:isolate;background:var(--sg-glass);color:var(--fg);
  font-size:var(--sg-font);font-weight:600;font-variant-numeric:tabular-nums;line-height:1;outline:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;cursor:ns-resize;touch-action:none;-webkit-touch-callout:none}
.slosh-gauge:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.slosh-gauge__value{position:absolute;inset:0;display:grid;place-items:center;color:color-mix(in srgb,currentColor 65%,transparent);pointer-events:none}
.slosh-gauge__liquid{position:absolute;inset:0;background:var(--sg-liquid);clip-path:polygon(0 100%,100% 100%,100% 100%,0 100%)}
.slosh-gauge__liquid .slosh-gauge__value{color:var(--sg-on-liquid)}
.slosh-gauge__ticks{position:absolute;right:0;bottom:0;width:22%;height:100%;background-image:linear-gradient(to top,color-mix(in srgb,currentColor 22%,transparent) 0 1px,transparent 1px);background-size:100% calc(100% / var(--sg-ticks));background-repeat:repeat-y;background-position:bottom;pointer-events:none}
.slosh-gauge__marker{position:absolute;top:0;right:10%;left:10%;height:2px;margin-top:-1px;border-radius:1px;background:currentColor;opacity:0;transition:opacity 150ms ease;pointer-events:none}
.slosh-gauge[data-held='true'] .slosh-gauge__marker{opacity:1}
@media (prefers-reduced-motion:reduce){#wTune{animation:none!important}.rd,.hl,.st,.pv,.blk,.sbar,.fbar,.sg-dock,.slosh-gauge__marker{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}
#wTune{width:268px}
.rz{position:fixed;z-index:40;left:0;top:0;width:20px;height:20px;display:flex;align-items:center;justify-content:center;border-radius:6px;color:var(--muted);background:var(--panel);border:1px solid var(--line);cursor:nwse-resize;touch-action:none;user-select:none;-webkit-user-select:none;opacity:0;visibility:hidden;transition:opacity .15s ease,color .15s,border-color .15s,visibility 0s .15s}
.rz.on{opacity:1;visibility:visible;transition:opacity .15s ease,color .15s,border-color .15s}
.rz:hover,.rz.drag{color:var(--fg);border-color:var(--muted)}
.rz svg{pointer-events:none}
.rz-v{position:absolute;right:calc(100% + 6px);top:50%;transform:translateY(-50%);padding:2px 7px;border-radius:7px;background:var(--fg);color:var(--bg);font:600 11px/1.4 Satoshi,system-ui,sans-serif;font-variant-numeric:tabular-nums;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s}
.rz.drag .rz-v{opacity:1}
.fbar .hlb{background:var(--hl);color:var(--fg);padding:1px 4px;border-radius:3px;font-size:13px}

/* resume hover preview + llms.txt popover */
.top-left{position:relative}
.rv{position:relative;display:flex}
.rv-pv{position:absolute;top:100%;left:0;margin-top:6px;width:220px;padding:6px;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.14);opacity:0;visibility:hidden;transform:translateY(-4px);transition:opacity .15s,transform .15s,visibility .15s;pointer-events:none;z-index:20}
.rv-pv img{display:block;width:100%;height:auto;border-radius:4px;background:#fff}
.rv-pv span{display:block;margin-top:6px;font:400 11px/1.3 ui-monospace,'SF Mono',Menlo,Consolas,monospace;color:var(--muted)}
@media (hover:hover){.rv:hover .rv-pv,.rv:focus-within .rv-pv{opacity:1;visibility:visible;transform:none}}
.llms-btn{border:0;background:none;font:400 11px/1 ui-monospace,'SF Mono',Menlo,Consolas,monospace;gap:6px}
.llms-btn[aria-expanded=true]{background:var(--chip);color:var(--fg)}
@media (max-width:479px){.llms-btn b{display:none}}
.llms-btn b{font-weight:400}
.llms-pop{display:none;position:absolute;top:100%;left:0;margin-top:6px;width:min(560px,calc(100vw - 40px));max-height:70vh;overflow:auto;background:var(--panel);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:8px;padding:12px;box-shadow:0 8px 24px rgba(0,0,0,.14);z-index:21;pointer-events:auto}
.llms-pop.open{display:block}
.llms-bar{display:flex;align-items:center;gap:8px;margin-bottom:10px;font:400 11px/1.3 ui-monospace,'SF Mono',Menlo,Consolas,monospace;color:var(--muted)}
.llms-bar span{flex:1}
.llms-bar button{font:inherit;color:var(--fg);background:var(--chip);border:0;border-radius:6px;padding:5px 9px;cursor:pointer}
.llms-bar button:hover{outline:1px solid var(--line)}
.llms-bar button:focus-visible{outline:2px solid var(--fg)}
.llms-pop pre{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font:400 12px/1.55 ui-monospace,'SF Mono',Menlo,Consolas,monospace;color:var(--fg)}
</style>

# Zachary "Zack" Ryan Gort

> Experience architect and product designer (UX / IA / design systems) with 15+ years across e-commerce, financial services, pharma, higher ed, and social/advertising, at startups and agencies in Philadelphia and New York. Currently independent as Wolfgang & Co. Self-taught: no degree, learned by studying and shipping. Core belief: human intent matters most, even in the era of agentic automation. Current thesis treats "the sentence" as a primary product primitive that the user experience is built upon.

This file is a plain-text summary for language models of https://zack.cx/cv/a (cover note and timeline) and https://zack.cx (full portfolio and writing). The pages are written by a human; this is the structured version. Claims about outcomes are the author's own.

Contact: zckgrt@gmail.com

## Links

- [Portfolio and deep-dive](https://zack.cx): Case studies, career narrative, R&D, and writing on one canvas.
- [ifimaybefrank](https://ifimaybefrank.com): Hub for writing and everything else shared publicly.
- [LinkedIn](https://www.linkedin.com/in/zackgort): Professional profile.
- [Resume (PDF)](https://raw.githubusercontent.com/ZACKGORT/zack/main/media/Zachary_Ryan_Gort-Product_Design-Resume-2026-.pdf): One-page resume, 2026.
- [This page](https://zack.cx/cv/a): Cover note and career timeline.

## Core competencies

- Systems: information architecture, design systems, component-based and modular UI, headless CMS and content strategy, IA workshop facilitation.
- Product: 0-1 product design, UX strategy, product ownership (often interim or de facto), Agile/Scrum (Certified Scrum Master), stakeholder management, roadmap planning.
- Craft: interaction design, visual design, mobile-first and responsive, prototyping, wireframing, accessibility (WCAG 2.0 AA and beyond), product photography.
- Stack: Figma, Salesforce Commerce Cloud, Shopify, SAP Hybris, Contentful, Jira, iOS, B2B and B2C e-commerce, Claude, prompt engineering.
- Leadership: team lead, mentorship of junior and associate designers, creative direction, client-facing lead.

## Roles (most recent first)

- Wolfgang & Co. - Founder / Proprietor (independent), current. Freelance design and R&D; self-directed portfolio of product experiments (see R&D below).
- HUGE Inc. - Freelance, 2025-2026. Merck Europe (2026): design systems and technical writing, refactoring an approved visual design into a modular, maintainable design system (atomic design, Figma prototypes, UX developer documentation; under NDA).
- Phenom AI - Product UX Strategist, 02/2025-05/2025. Corporate web presence: owned content strategy, product roadmap, and third-party integrations end to end; built live-event infrastructure; worked across Marketing, Sales, and Product to map operational silos. Contentful, Jira.
- Brave People - Lead Product Designer (contract), 11/2024-02/2025.
- 2023-2024 - Independent contracting, including low-voltage data and network installation alongside design work.
- Publicis Sapient - Senior UX Designer / Product Design Lead, 04/2022-03/2023. BNY Mellon, Pershing X advisory platform. Interim product owner and primary client liaison across three Agile tracks.
- Code & Theory - Senior Interaction Designer, 08/2021-04/2022. TikTok For Business: 0-1 brand activation and replatforming to Contentful. IA and headless CMS workshops; stepped up to cover Acting ACD responsibilities on the account.
- Elva Design Group - Senior UX Designer, 04/2021-08/2021. GNC Shopify redesign, 12 weeks, discovery through delivery.
- HUGE Inc. - Senior UX Designer, 03/2021-04/2021. Sentral Lifestyle Apartments: end-to-end UX and booking flow, brand activation strategy, competitive analysis.
- PFSweb LiveArea - Manager, UX, 01/2020-02/2021. Salesforce Commerce Cloud and SAP Hybris builds for B2C and B2B (Hardinge, Simpson Strong-Tie, Aquasana, YETI, West Marine); UX strategy and design across the lifecycle.
- FlightPath - Senior UX Designer (listed as Lead Designer on zack.cx/cv/a), 08/2018-01/2020. Full-spectrum B2C and B2B builds in pharma and e-commerce for Merck, Zoetis, Charter, Goya, Organic Girl, and The Dana Foundation, under regulated legal review and WCAG AA requirements.
- Workarea (WebLinc) - Senior UX Designer, 07/2017-09/2018. Proprietary SaaS e-commerce platform; shaped the platform through direct client relationships and data-informed iteration; worked sketch-to-shipped with engineers. Platform clients included Rachel Roy, Century 21, Worldwide Stereo, and LimeCrime.
- O3 World - UX Designer, 07/2016-06/2017. Lean UX, sprints, fintech and iOS work (Vertex SMB, SEIC, La Colombe, WOVN iOS).
- One Sixty Over Ninety (160OVER90) - Interaction Designer, 09/2014-07/2016. Full-service interaction design for .EDU and enterprise clients: IA, prototyping, accessibility, client-facing creative lead (Comcast, Comcast Spectacor, Philadelphia Eagles, Kent State, Texas A&M, University of Wisconsin-Madison, Mount St. Mary, Centro, Power Home Remodeling).
- Leadnomics - Senior Web Designer, 2011-2014. Lead-generation startup; data-driven UX for conversion funnels.
- Turn5 (Xoxide) - Graphic Designer to Senior Web Designer, circa 2007-2011. Print, packaging, catalog, product photography, email and display ads, then web UX for AmericanMuscle.com, AmericanTrucks, CorvetteGuys, and brands such as Raxiom, Stack Racing, and 'Bama Tuning.
- Earlier: Miller Designworks (design intern), CertainTeed and Hotwire Communications (graphic design).

## Education

- Pratt Institute of Art, Brooklyn: BFA program (3D Animation and Motion Graphics), attended 2002-2003 and 2004-2005; did not graduate. Self-taught in typography, color theory, and web design afterward.

## Selected case studies (full write-ups at https://zack.cx)

- BNY Mellon, Pershing X ("Wove"), via Publicis Sapient, 2023-2024: Design systems, dashboards, and data work. Pulled disparate legacy advisor applications into one interconnected dashboard so a client's full financial picture lives in one place and work moves across modules without re-entry. Author's piece: information architecture, task and flow mapping, cross-module navigation, and component patterns that keep data alive across steps. The author reports reducing manual data-entry touchpoints from 11 events to 4. No AI was involved in this work.
- GNC (General Nutrition Centers), via Elva Design Group, 2021: Post-bankruptcy overhaul into a modular, mobile-first Shopify marketplace. Lead UX: IA, UI prototypes, component-based design system, mobile-first navigation schema, and a retail taxonomy strategy. 12-week engagement with weekly executive reviews. The author credits the work with helping GNC reclaim about $500M in annual revenue.
- Hardinge, B2B on SAP Hybris, via LiveArea: Principal UX / UX Manager. Created "Cards Against Bad UX", a gamified requirements-gathering method using persona cards ("As a shopper", "As a content manager", "As a guest user") that moved a client unfamiliar with design process away from jargon-laden spreadsheets; approved on first call. Delivered Drop 1 (style guide, header states, type-ahead search, B2B tools menu, category navigation, account flows, homepage) and complex PDP designs for single, variable, and kit purchases.
- The Dana Foundation (Dana.org and Brain Awareness Week), via FlightPath: Full redesign on a $20K budget in three weeks across two sites and one system. Card-based navigation, sitemap and content architecture, mobile-first WCAG 2.0 design system, and a bespoke logo concept.
- Power Home Remodeling Group, via 160OVER90: Campaign strategy, brand voice, and digital experience design around the idea "Power is a _____ company", where each visit fills the blank differently. Coordinated brand design, photography, motion, and video.
- Kent State University, via 160OVER90: Complete IA refactor, navigation system design, and visual design across 8 regional campuses and dozens of international locations; explored mega menus, full-screen takeovers, and a proprietary navigation system.
- AmericanMuscle.com, Turn5 (in-house): Full-funnel e-commerce UX through iterative A/B testing, custom checkout flow, product photography, and brand identity for the Raxiom line; also web and graphic design.

## R&D and side projects (the "sentence as primitive" thesis in practice)

- [ifimaybefrank.com](https://ifimaybefrank.com): Reader/writer prose platform where you write into a hierarchical, spatial structure that becomes the article. Original version at ifimaybefrank.com/classic.
- [intoview.pro](https://intoview.pro): Professional provenance through prose; no feed, no algorithm, no like button. Includes a kanban for restaurant floor operations (SMS to CMS task flow), intoview.pro/kanban.
- [neverever.land](https://neverever.land): A space where what you say becomes part of your canonical record; published statements cannot be edited or deleted.
- [dab.cx](https://dab.cx): Classifieds-style listings that apply the sentence-as-primitive idea to job listings and conversation.
- [emdash.click](https://emdash.click): Satirical e-commerce storefront defending the em dash.
- [zack.cx/cosmo](https://zack.cx/cosmo): Exploration of the thesis that the sentence is the most meaningful unit of understanding between human and machine.
- Smaller tools: zack.cx/pasted, zack.cx/tuner (alternate-tuning guitar tuner), zack.cx/xp (landing page for prototypes). Concept: Koło, a circular cellphone.
- Portfolio variants: zack.cx/ux, zack.cx/foundry, zack.cx/classic.

## Working style

- Systems thinker who works in the room: facilitates client workshops, maps legacy ecosystems end to end, and often fills product-owner or team-lead gaps without the title.
- Prefers sketch-to-shipped collaboration with engineers over mockup theater.
- Mentors junior designers; colleagues at Publicis Sapient describe a strong communicator who sets teams up for success.
- Interested in roles where human-centered product thinking and AI meet: 0-1 products, design systems, IA, and content-driven experiences.
