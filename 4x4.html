<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>zack.cx/4x4</title>
<style>
:root{--bg:#f5f5f3;--fg:#1c1c1c;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#f5f5f3;--fg:#1c1c1c}}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,sans-serif}
#stage{position:fixed;inset:0;overflow:hidden}
canvas{display:block;width:100%;height:100%}
#score{position:fixed;left:50%;bottom:calc(72px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);font-size:12px;font-weight:700;letter-spacing:.12em;opacity:.7;pointer-events:none;user-select:none;z-index:5}
#logo{position:fixed;left:calc(14px + env(safe-area-inset-left,0px));top:calc(14px + env(safe-area-inset-top,0px));color:var(--fg);text-decoration:none;display:block;z-index:5;font:12px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.04em;opacity:.7}
#nav{position:fixed;right:calc(12px + env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));display:flex;gap:6px;z-index:5}
#nav a{width:34px;height:34px;border:1px solid var(--fg);border-radius:50%;display:grid;place-items:center;color:var(--fg);opacity:.65;transition:opacity .15s,transform .15s}
#nav a:hover{opacity:1;transform:translateY(-1px)}
#nav svg{width:17px;height:17px}
#card{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:10;width:min(320px,calc(100vw - 32px));box-sizing:border-box;background:var(--bg);color:var(--fg);border:1px solid var(--fg);border-radius:14px;padding:22px 20px 16px;box-shadow:6px 6px 0 var(--fg);text-align:center}
#card[hidden]{display:none}
#card .x{position:absolute;right:10px;top:6px;border:0;background:none;font-size:24px;line-height:1;cursor:pointer;color:inherit}
#card .ic svg{width:44px;height:44px}
#card h2{margin:8px 0 4px;font-size:18px}
#card p{margin:0 0 14px;font-size:14px;opacity:.75}
#card .go{display:block;padding:10px 12px;border-radius:999px;background:var(--fg);color:var(--bg);text-decoration:none;font-weight:600;font-size:14px}
#card .keep{margin-top:10px;border:0;background:none;color:inherit;opacity:.6;font:inherit;font-size:12px;cursor:pointer;text-decoration:underline}
#site{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:10;width:min(980px,calc(100vw - 24px));height:min(680px,calc(100vh - 90px));box-sizing:border-box;display:flex;flex-direction:column;background:var(--bg);color:var(--fg);border:1px solid var(--fg);border-radius:14px;box-shadow:6px 6px 0 var(--fg);overflow:hidden}
#site[hidden]{display:none}
#site .bar{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 14px;border-bottom:1px solid var(--fg);flex:none}
#site .bar svg{width:22px;height:22px;flex:none}
#site .bar h2{margin:0;font-size:15px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#site .bar a{font-size:12px;font-weight:600;color:var(--bg);background:var(--fg);padding:5px 11px;border-radius:999px;text-decoration:none;flex:none}
#site .bar button{border:0;background:none;font-size:26px;line-height:1;cursor:pointer;color:inherit;padding:0 4px}
#site iframe{flex:1;width:100%;border:0;background:#fff}
#fx{position:absolute;inset:0;pointer-events:none}
#gear{font-size:16px;font-weight:700;letter-spacing:.08em;margin-bottom:2px;opacity:.85}
#hud{position:fixed;left:0;right:0;bottom:calc(12px + env(safe-area-inset-bottom,0px));text-align:center;font-size:11px;letter-spacing:.04em;opacity:.5;pointer-events:none;user-select:none;z-index:5}
/* top-center control bar */
#topBar{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:6;display:flex;align-items:center;gap:0;pointer-events:auto;
  border:1px solid var(--fg);border-radius:999px;background:var(--bg);overflow:hidden;box-shadow:0 1px 0 rgba(0,0,0,.04)}
#topBar button{height:32px;padding:0 14px;border:0;border-right:1px solid var(--fg);background:transparent;color:var(--fg);
  font:12px system-ui,sans-serif;letter-spacing:.04em;cursor:pointer;opacity:.75;touch-action:none;white-space:nowrap}
#topBar button:last-child{border-right:0}
#topBar button:hover,#topBar button:active{opacity:1;background:var(--fg);color:var(--bg)}
#topBar button.on{opacity:1;background:var(--fg);color:var(--bg)}
#topBar #recBtn.on{background:#7a2c2c;color:#f5f5f3;opacity:1}
#recTime{font-variant-numeric:tabular-nums;min-width:2.6em;display:inline-block;text-align:center}
/* mobile */
#mobileControls{display:none;position:fixed;inset:0;pointer-events:none;z-index:4}
#joyBase{position:absolute;left:calc(14px + env(safe-area-inset-left,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));width:96px;height:96px;border:1.5px solid var(--fg);border-radius:50%;opacity:.4;pointer-events:auto;touch-action:none}
#joyKnob{position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px 0 0 -20px;border:1.5px solid var(--fg);border-radius:50%;background:var(--bg);opacity:.9;pointer-events:none}
#btnCluster{position:absolute;right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;pointer-events:auto}
#btnCluster button{width:52px;height:52px;border:1.5px solid var(--fg);border-radius:50%;background:var(--bg);color:var(--fg);font-size:14px;font-weight:600;opacity:.65;pointer-events:auto;touch-action:none;-webkit-user-select:none;user-select:none}
#btnCluster button:active,#btnCluster button.active{opacity:1;background:var(--fg);color:var(--bg)}
@media (pointer:coarse){
  #mobileControls{display:block}
  #hud .desktop-hint{display:none}
  #score{bottom:calc(100px + env(safe-area-inset-bottom,0px))}
  #topBar{top:calc(8px + env(safe-area-inset-top,0px))}
  #topBar button{height:30px;padding:0 11px;font-size:11px}
  #logo{font-size:11px;opacity:.55}
  #nav a{width:30px;height:30px}
  #nav svg{width:15px;height:15px}
}
@media (max-width:420px){
  #nav{display:none} /* free right edge for action buttons on narrow phones */
  #logo{opacity:.5}
}
</style>

<script>
(() => {
const S = { color:'#c6c6c6', lineCount:22, lineWidth:1.2, majorLines:true, elevation:1, foreground:0.2, scale:1,
  detail:0.35, tilt:32, speed:0, direction:[0,1], morph:0, glow:0.6, depthOfField:0.4, fog:0.35, brightness:1,
  opacity:1, mouseRadius:1, mouseStrength:0.6, parallax:0.5, intro:true, lightMode:true };

const PLATEAU=1.0,SHOULDER=5,FOV=0.32,ORBIT=9,NEAR=0.05,FAR=160,HEIGHT=1.7,FREQUENCY=0.45,INTRO=2.8,MAX_PULSES=4,LEVELS=4,MAX_CELLS=200000;
const SUN=[-0.81,0.58,-0.02];
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const smoother=x=>{const t=clamp(x,0,1);return t*t*t*(t*(t*6-15)+10)};

const COMMON=`
precision highp float;precision highp int;
uniform float uFrequency;uniform vec2 uMorph;uniform vec4 uPulses[${MAX_PULSES}];
uniform vec3 uEye;uniform vec3 uForward;uniform vec3 uNear;
uint lattice(ivec2 p){uvec2 q=uvec2(p+1073741824);uint h=q.x*2654435761u+q.y*2246822519u;
h=(h^(h>>15u))*739982445u;h=(h^(h>>12u))*695872825u;return h^(h>>15u);}
float corner(ivec2 c,vec2 f){uint h=lattice(c);vec2 g=vec2(float(h&65535u),float(h>>16u))/32767.5-1.0;return dot(g,f);}
float noise(vec2 p){vec2 i=floor(p);vec2 f=p-i;ivec2 c=ivec2(i);vec2 u=f*f*f*(f*(f*6.0-15.0)+10.0);
float a=corner(c,f);float b=corner(c+ivec2(1,0),f-vec2(1.0,0.0));float d=corner(c+ivec2(0,1),f-vec2(0.0,1.0));float e=corner(c+ivec2(1,1),f-vec2(1.0,1.0));
return mix(mix(a,b,u.x),mix(d,e,u.x),u.y);}
vec2 octave(vec2 p,vec2 s){return vec2(1.6*p.x-1.2*p.y,1.2*p.x+1.6*p.y)+s;}
float relief(vec2 t){vec2 p=t*uFrequency;
vec2 w=vec2(noise(p*0.42+uMorph),noise(p*0.42-uMorph.yx+vec2(5.2,1.3)));p+=w*0.8;
float n=noise(p)*0.55;p=octave(p,vec2(7.1,3.7));n+=noise(p)*0.15;p=octave(p,vec2(1.9,8.3));n+=noise(p)*0.04;
float s=log(1.0+exp(7.0*(3.0*n+0.05)))/7.0;float r=s*s*1.4+0.1*n;return -log(exp(-r*${SHOULDER.toFixed(1)})+exp(-${PLATEAU.toFixed(2)}*${SHOULDER.toFixed(1)}))/${SHOULDER.toFixed(1)};}
float swell(vec2 t){float lift=0.0;for(int i=0;i<${MAX_PULSES};i++){vec4 p=uPulses[i];if(p.w<=0.0)continue;
float x=(length(t-p.xy)-p.z)/(0.28+p.z*0.05);lift+=exp(-x*x)*p.w;}return lift;}
float settle(vec2 world){float depth=dot(vec3(world.x,0.0,world.y)-uEye,uForward);
float x=clamp((depth-uNear.x)/max(uNear.y-uNear.x,1e-3),0.0,1.0);return mix(uNear.z,1.0,x*x*x*(x*(x*6.0-15.0)+10.0));}
`;

const VERT=`#version 300 es
${COMMON}
uniform ivec2 uOrigin;uniform ivec2 uCamCell;uniform vec2 uCamFrac;uniform float uCell;uniform int uStride;
uniform float uHeight;uniform mat4 uViewProj;
out vec2 vTerrain;out float vDepth;out float vLift;out vec3 vNormal;
float ground(vec2 t){return relief(t)+swell(t)*0.14;}
void main(){
ivec2 step=ivec2(gl_VertexID>>1,gl_InstanceID+(gl_VertexID&1))*uStride;
ivec2 local=uOrigin+step;
vec2 terrain=vec2(local+uCamCell)*uCell;
vec2 world=vec2(local)*uCell-uCamFrac;
float k=settle(world);
float h=ground(terrain)*k;float hx=ground(terrain+vec2(0.04,0.0))*k;float hz=ground(terrain+vec2(0.0,0.04))*k;
vNormal=vec3((h-hx)*uHeight/0.04,1.0,(h-hz)*uHeight/0.04);
vec4 clip=uViewProj*vec4(world.x,h*uHeight,world.y,1.0);
gl_Position=clip;vTerrain=terrain;vDepth=clip.w;vLift=h*uHeight;}`;

const FRAG=`#version 300 es
${COMMON}
uniform float uDetail,uLines,uLineWidth,uMajor,uBrightness,uRefDepth,uReveal,uLightMode,uOpacity;
uniform vec3 uColor;uniform vec2 uFade;uniform vec3 uFocus;uniform vec4 uHeat;uniform vec4 uLamp;uniform vec3 uSun;
in vec2 vTerrain;in float vDepth;in float vLift;in vec3 vNormal;out vec4 outColor;
float smoother(float x){x=clamp(x,0.0,1.0);return x*x*x*(x*(x*6.0-15.0)+10.0);}
float stroke(float dist,float width,float soft,float density,float crowd){
float cover=max(0.0,min(min(width,soft),0.5*(width+soft)-dist))/soft;
return mix(cover,min(width*density,1.0)*0.6,crowd);}
void main(){
vec2 spot=vTerrain;
vec2 dp=spot*uFrequency*5.0+vec2(13.1,4.7);
float ring=swell(spot);
float h=relief(spot)+ring*0.14+uDetail*0.1*(noise(dp)*0.6+noise(octave(dp,vec2(2.3,6.1)))*0.3);
float gx=dFdx(h)*uLines;float gy=dFdy(h)*uLines;
float lc=h*uLines+0.5;
float density=max(sqrt(gx*gx+gy*gy),1e-5);
float dist=abs(fract(lc+0.5)-0.5)/density;
float major=uMajor*(1.0-step(0.5,mod(floor(lc+0.5),5.0)));
vec2 hd=spot-uHeat.xy;
float heat=exp(-dot(hd,hd)/(uHeat.z*uHeat.z))*uHeat.w;
float energy=heat+ring;
float depth=max(vDepth,0.01);
float persp=clamp(sqrt(uRefDepth/depth),0.6,1.6);
float width=uLineWidth*persp*(1.0+0.6*major)*(1.0+0.45*min(energy,1.5));
float soft=1.0+min(uFocus.y*abs(1.0-uFocus.x/depth),uFocus.z);
float crowd=smoothstep(0.3,0.75,density*max(width,soft));
float cover=stroke(dist,width,soft,density,crowd);
vec3 normal=normalize(vNormal);
float sun=clamp(dot(normal,uSun),0.0,1.0);
vec3 toLamp=uLamp.xyz-vec3(vTerrain.x,vLift,vTerrain.y);
float ld=length(toLamp);
float lamp=clamp(dot(normal,toLamp/max(ld,1e-3)),0.0,1.0)*uLamp.w/(1.0+ld*ld*0.9);
float level=mix(0.45,1.05,smoothstep(0.0,1.1,h))*mix(0.35,1.25,sun*sun)*(1.0+0.6*major);
level+=heat*1.4+ring*3.0+lamp*1.2;
float fade=1.0-smoother((depth-uFade.x)/max(uFade.y-uFade.x,1e-3));
float light=cover*level*fade*uBrightness*uReveal;
if(uLightMode>0.5){float ink=(1.0-exp(-light*1.8))*0.92*uOpacity;outColor=vec4(uColor*ink,ink);return;}
vec3 color=1.0-exp(-uColor*light*1.8);
float dither=fract(sin(dot(gl_FragCoord.xy,vec2(12.9898,78.233))*1.0)*43758.5453)-0.5;
color=max(color+dither/255.0*step(0.002,max(max(color.r,color.g),color.b)),0.0);
outColor=vec4(color,max(max(color.r,color.g),color.b))*uOpacity;}`;

const FULL=`#version 300 es
void main(){vec2 p=vec2(float((gl_VertexID<<1)&2),float(gl_VertexID&2));gl_Position=vec4(p*2.0-1.0,0.0,1.0);}`;
const DOWN=`#version 300 es
precision highp float;uniform sampler2D uSource;uniform vec2 uTarget;uniform vec2 uTexel;out vec4 outColor;
void main(){vec2 uv=gl_FragCoord.xy/uTarget;vec4 c=texture(uSource,uv-uTexel);c+=texture(uSource,uv+uTexel);
c+=texture(uSource,uv+vec2(uTexel.x,-uTexel.y));c+=texture(uSource,uv+vec2(-uTexel.x,uTexel.y));outColor=min(c*0.25,vec4(1.0));}`;
const BLUR=`#version 300 es
precision highp float;uniform sampler2D uSource;uniform vec2 uTarget;uniform vec2 uStep;out vec4 outColor;
void main(){vec2 uv=gl_FragCoord.xy/uTarget;vec4 c=texture(uSource,uv)*0.181862;
c+=(texture(uSource,uv+uStep*1.423135)+texture(uSource,uv-uStep*1.423135))*0.284316;
c+=(texture(uSource,uv+uStep*3.326702)+texture(uSource,uv-uStep*3.326702))*0.106598;
c+=(texture(uSource,uv+uStep*5.242989)+texture(uSource,uv-uStep*5.242989))*0.018156;outColor=c;}`;
const COMP=`#version 300 es
precision highp float;uniform sampler2D uBloom0,uBloom1,uBloom2,uBloom3;uniform vec2 uView;uniform float uGlow;uniform float uLightMode;out vec4 outColor;
void main(){vec2 uv=gl_FragCoord.xy/uView;
vec4 halo=texture(uBloom0,uv)*0.4+texture(uBloom1,uv)*0.3+texture(uBloom2,uv)*0.2+texture(uBloom3,uv)*0.1;
if(uLightMode>0.5){outColor=halo*uGlow*0.35;return;}
vec3 c=halo.rgb*uGlow*1.6;c=c/(1.0+c);outColor=vec4(c,max(max(c.r,c.g),c.b));}`;

// ---- JS noise (for picking) ----
const lattice=(x,y)=>{let h=(Math.imul(x+1073741824,2654435761)+Math.imul(y+1073741824,2246822519))>>>0;
h=Math.imul(h^(h>>>15),739982445)>>>0;h=Math.imul(h^(h>>>12),695872825)>>>0;return(h^(h>>>15))>>>0};
const corner=(cx,cy,fx,fy)=>{const h=lattice(cx,cy);return((h&65535)/32767.5-1)*fx+((h>>>16)/32767.5-1)*fy};
const noise=(x,y)=>{const ix=Math.floor(x),iy=Math.floor(y),fx=x-ix,fy=y-iy;
const ux=fx*fx*fx*(fx*(fx*6-15)+10),uy=fy*fy*fy*(fy*(fy*6-15)+10);
const a=corner(ix,iy,fx,fy),b=corner(ix+1,iy,fx-1,fy),d=corner(ix,iy+1,fx,fy-1),e=corner(ix+1,iy+1,fx-1,fy-1);
const top=a+(b-a)*ux;return top+(d+(e-d)*ux-top)*uy};
const relief=(tx,tz,f,mx,mz)=>{let px=tx*f,pz=tz*f;
const wx=noise(px*0.42+mx,pz*0.42+mz),wz=noise(px*0.42-mz+5.2,pz*0.42-mx+1.3);px+=wx*0.8;pz+=wz*0.8;
let n=noise(px,pz)*0.55;const qx=1.6*px-1.2*pz+7.1,qz=1.2*px+1.6*pz+3.7;n+=noise(qx,qz)*0.15;
n+=noise(1.6*qx-1.2*qz+1.9,1.2*qx+1.6*qz+8.3)*0.04;
const s=Math.log(1+Math.exp(7*(3*n+0.05)))/7,r=s*s*1.4+0.1*n;return -Math.log(Math.exp(-r*SHOULDER)+Math.exp(-PLATEAU*SHOULDER))/SHOULDER};

const toRgb=hex=>{const n=parseInt(hex.replace('#','').slice(0,6),16);return[((n>>16)&255)/255,((n>>8)&255)/255,(n&255)/255]};
const orient=(yaw,pitch)=>{const cp=Math.cos(pitch);const f=[Math.sin(yaw)*cp,-Math.sin(pitch),Math.cos(yaw)*cp];
const r=[Math.cos(yaw),0,-Math.sin(yaw)];
const u=[f[1]*r[2]-f[2]*r[1],f[2]*r[0]-f[0]*r[2],f[0]*r[1]-f[1]*r[0]];return{f,r,u}};
const nrm=v=>{const l=Math.hypot(...v)||1;return v.map(x=>x/l)};
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const lens=a=>clamp(0.4877/a,FOV,0.6);
const viewProj=({eye,f,r,u},aspect,out)=>{const t=1/lens(aspect),nf=1/(NEAR-FAR);
const view=[r[0],u[0],-f[0],0,r[1],u[1],-f[1],0,r[2],u[2],-f[2],0,
-(r[0]*eye[0]+r[1]*eye[1]+r[2]*eye[2]),-(u[0]*eye[0]+u[1]*eye[1]+u[2]*eye[2]),f[0]*eye[0]+f[1]*eye[1]+f[2]*eye[2],1];
const p=[t/aspect,0,0,0,0,t,0,0,0,0,(FAR+NEAR)*nf,-1,0,0,2*FAR*NEAR*nf,0];
for(let c=0;c<4;c++)for(let row=0;row<4;row++){let s=0;for(let k=0;k<4;k++)s+=p[k*4+row]*view[c*4+k];out[c*4+row]=s}return out};

// ---- GL setup ----
const container=document.getElementById('stage'),canvas=document.getElementById('c');
const ratio=Math.min(window.devicePixelRatio||1,2);
const gl=canvas.getContext('webgl2',{alpha:true,premultipliedAlpha:true,antialias:ratio<1.5,depth:true,powerPreference:'high-performance'});
if(!gl){container.innerHTML='<p style="padding:2rem">WebGL2 is not available in this browser.</p>';return}
const floatTargets=!!gl.getExtension('EXT_color_buffer_float');
const sh=(t,src)=>{const s=gl.createShader(t);gl.shaderSource(s,src);gl.compileShader(s);
if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(s));return s};
const prog=(v,f)=>{const p=gl.createProgram();gl.attachShader(p,sh(gl.VERTEX_SHADER,v));gl.attachShader(p,sh(gl.FRAGMENT_SHADER,f));

  mc.innerHTML='<div id="joyBase"><div id="joyKnob"></div></div><div id="btnCluster"><button type="button" data-k="gas">▲</button><button type="button" data-k="brake">■</button><button type="button" data-k="gear">⚙</button></div>';
  document.body.appendChild(mc);
  const base=document.getElementById('joyBase'), knob=document.getElementById('joyKnob');
  const R=48;
  const setKnob=(x,y)=>{knob.style.transform='translate('+x+'px,'+y+'px)'};
  const joyEnd=()=>{joy.active=false;joy.dx=0;joy.dy=0;joy.id=null;setKnob(0,0)};
  base.addEventListener('pointerdown',e=>{
    e.preventDefault();e.stopPropagation();
    joy.active=true;joy.id=e.pointerId;base.setPointerCapture(e.pointerId);
    const r=base.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
    let dx=e.clientX-cx,dy=e.clientY-cy;const len=Math.hypot(dx,dy)||1;
    if(len>R){dx=dx/len*R;dy=dy/len*R}
    joy.dx=dx/R;joy.dy=dy/R;setKnob(dx,dy);
  });
  base.addEventListener('pointermove',e=>{
    if(!joy.active||e.pointerId!==joy.id)return;
    e.preventDefault();
    const r=base.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
    let dx=e.clientX-cx,dy=e.clientY-cy;const len=Math.hypot(dx,dy)||1;
    if(len>R){dx=dx/len*R;dy=dy/len*R}
    joy.dx=dx/R;joy.dy=dy/R;setKnob(dx,dy);
  });
  base.addEventListener('pointerup',joyEnd);base.addEventListener('pointercancel',joyEnd);base.addEventListener('pointerleave',joyEnd);
  mc.querySelectorAll('#btnCluster button').forEach(b=>{
    const k=b.dataset.k;
    const on=e=>{e.preventDefault();e.stopPropagation();b.classList.add('active');if(k==='gear')shiftGear();else keys[k]=true};
    const off=()=>{b.classList.remove('active');if(k!=='gear')keys[k]=false};
    b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);
    b.addEventListener('pointercancel',off);b.addEventListener('pointerleave',off);
  });
}

/* Record — MediaRecorder composite, 60s max (skate-style) */
const Rec=(function(){
  const MAX=60, LINE_BOOST=2;
  let rec=null, chunks=[], startedAt=0, active=false, vStream=null;
  const out=document.createElement('canvas'), octx=out.getContext('2d');
  const btn=document.getElementById('recBtn'), timeEl=document.getElementById('recTime');
  const fmt=sec=>{sec=Math.max(0,Math.ceil(sec));const m=Math.floor(sec/60),s=sec%60;return m+':'+(s<10?'0':'')+s};
  const ui=()=>{btn.classList.toggle('on',active);btn.setAttribute('aria-pressed',active?'true':'false');
    if(!active){btn.innerHTML='Rec <span id="recTime">'+MAX+'s</span>';}
    else{const left=startedAt?Math.max(0,MAX-(performance.now()-startedAt)/1000):MAX;btn.innerHTML='Stop <span id="recTime">'+fmt(left)+'</span>'}};
  const pickMime=()=>{for(const m of ['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm']){if(window.MediaRecorder&&MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(m))return m}return'video/webm'};
  const ensureSize=()=>{const w=canvas.width,h=canvas.height;if(out.width!==w||out.height!==h){out.width=w;out.height=h}};
  const drawHud=()=>{
    const w=out.width,h=out.height,pad=Math.max(16,Math.round(w*0.016)),sc=Math.max(0.85,Math.min(1.3,w/1280));
    octx.save();octx.textBaseline='top';
    octx.fillStyle='rgba(28,28,28,0.85)';octx.font='600 '+Math.round(12*sc)+'px system-ui,sans-serif';
    octx.fillText('zack.cx/4x4',pad,pad);
    octx.font='700 '+Math.round(18*sc)+'px system-ui,sans-serif';octx.fillText('FLAGS '+score,pad,pad+Math.round(20*sc));
    const gearName=(GEARS[car.gear]&&GEARS[car.gear].name)||'';
    octx.font='600 '+Math.round(13*sc)+'px system-ui,sans-serif';octx.fillText(gearName,pad,pad+Math.round(44*sc));
    const left=startedAt?Math.max(0,MAX-(performance.now()-startedAt)/1000):MAX;
    octx.fillStyle='#7a2c2c';octx.font='600 '+Math.round(12*sc)+'px system-ui,sans-serif';
    octx.fillText('● REC  '+fmt(left),pad,h-pad-Math.round(14*sc));
    octx.restore();
    if(active){const te=document.getElementById('recTime');if(te)te.textContent=fmt(left)}
    if(active&&startedAt&&left<=0)stop();
  };
  const composite=()=>{
    /* GL canvas is transparent (clearColor alpha 0), so the page bg must be repainted every frame or frames smear together */
    octx.globalCompositeOperation='source-over';octx.globalAlpha=1;
    octx.fillStyle=getComputedStyle(document.body).backgroundColor||'#f5f5f3';
    octx.fillRect(0,0,out.width,out.height);
    octx.drawImage(canvas,0,0,out.width,out.height);
    /* contrast boost: re-draw terrain with multiply so line pixels darken; transparent areas/bg are untouched. Raise LINE_BOOST for stronger lines */
    octx.globalCompositeOperation='multiply';
    for(let i=0;i<LINE_BOOST;i++)octx.drawImage(canvas,0,0,out.width,out.height);
    octx.globalCompositeOperation='source-over';
    if(fx&&fx.width&&fx.height)octx.drawImage(fx,0,0,out.width,out.height); /* flags, smoke, coffee overlay */
    drawHud();
  };
  const frame=()=>{if(!active)return;ensureSize();try{composite()}catch(e){}};
  const download=blob=>{
    const a=document.createElement('a'),url=URL.createObjectURL(blob);
    a.href=url;a.download='softtop-'+new Date().toISOString().replace(/[:.]/g,'-').slice(0,19)+'.webm';
    document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},1500);
  };
  const stop=()=>{
    if(!active)return;active=false;ui();
    try{if(rec&&rec.state!=='inactive')rec.stop();else if(chunks.length){download(new Blob(chunks,{type:(rec&&rec.mimeType)||'video/webm'}));chunks=[]}}catch(e){console.warn(e)}
    if(vStream){try{vStream.getTracks().forEach(t=>t.stop())}catch(_){}vStream=null}
  };
  const paintNow=()=>{ensureSize();try{composite()}catch(_){}
    try{if(vStream){const vt=vStream.getVideoTracks()[0];if(vt&&typeof vt.requestFrame==='function')vt.requestFrame()}}catch(_){}};
  const start=()=>{
    if(active)return;if(!window.MediaRecorder){alert('Recording not supported');return}
    vStream=null;paintNow();
    try{vStream=out.captureStream(60)}catch(e){alert('Recording failed');console.warn(e);return}
    paintNow();const mime=pickMime();chunks=[];
    try{rec=new MediaRecorder(vStream,{mimeType:mime,videoBitsPerSecond:8e6})}
    catch(e1){try{rec=new MediaRecorder(vStream)}catch(e2){alert('Recording failed');return}}
    rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
    rec.onerror=e=>{console.warn(e);stop()};
    rec.onstop=()=>{const type=(rec&&rec.mimeType)||mime||'video/webm';if(chunks.length)download(new Blob(chunks,{type}));chunks=[];rec=null};
    active=true;startedAt=performance.now();ui();
    requestAnimationFrame(()=>{if(!active)return;paintNow();requestAnimationFrame(()=>{if(!active)return;paintNow();try{rec.start(250)}catch(e){console.warn(e);active=false;ui()}})});
  };
  const toggle=()=>{if(active)stop();else start()};
  btn.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();btn.blur();toggle()});
  ui();
  return{toggle,stop,isActive:()=>active,frame};
})();

setGear();updScore();stepCar(1/60);st.tx=car.x;st.tz=car.z;st.cy=car.y;
for(let i=0;i<3;i++){const p=findPeak();if(p)flags.push({x:p.x,z:p.z,y:0,prog:0,cap:0})}

const render=()=>{
const cam=camera();viewProj(cam,view.width/view.height,matrix);
const bottom=groundDepth(cam,-1),top=Math.min(groundDepth(cam,1),cam.distance*3.2);
const horizon=Math.max(top,bottom*1.6,cam.distance*1.4);
const fadeEnd=horizon+(bottom*1.8-horizon)*S.fog;
const fadeStart=fadeEnd*0.7+(bottom*0.7-fadeEnd*0.7)*S.fog;
const box=footprint(cam,fadeEnd);
const key=`${view.width}x${view.height}@${view.ratio}|${Math.round(st.tilt/4)}|${Math.round(st.elev*5)}`;
if(true){view.key=key;const focal=view.height*view.ratio*0.5/lens(view.width/view.height);
let cell=clamp(14*Math.max(box.near,0.5)/focal,0.02,0.4);
const cells=(box.maxX-box.minX)*(box.maxZ-box.minZ)/(cell*cell);if(cells>MAX_CELLS)cell*=Math.sqrt(cells/MAX_CELLS);view.cell=Math.exp(Math.round(Math.log(cell)/0.06)*0.06)}
const color=toRgb(S.color),height=st.elev*HEIGHT*st.rise,layout=grid(box,view.cell),near=nearRange(cam);
const touch=st.hit?st.presence:0,heatStrength=touch*(0.35+0.5*S.mouseStrength);
const focusScale=S.depthOfField*view.height*0.016,reveal=smoother(st.intro/0.35);
const hx=st.hit?st.hit.x:0,hz=st.hit?st.hit.z:0;
pulseData.fill(0);pulses.forEach((p,i)=>pulseData.set([p.x,p.z,p.age*4.2,Math.exp(-p.age*1.1)*smoother(p.age/0.08)],i*4));
gl.bindVertexArray(vao);
const draw=(pixel,w,h)=>{gl.viewport(0,0,w,h);gl.useProgram(terrain.p);const u=terrain.u;
gl.uniform1f(u('uFrequency'),FREQUENCY/S.scale);gl.uniform2f(u('uMorph'),st.morph*0.37,st.morph*0.23);
gl.uniform4fv(u('uPulses'),pulseData);
gl.uniform2i(u('uOrigin'),layout.k0,layout.m0);gl.uniform2i(u('uCamCell'),layout.camX,layout.camZ);
gl.uniform2f(u('uCamFrac'),layout.fracX,layout.fracZ);gl.uniform1f(u('uCell'),layout.cell);gl.uniform1i(u('uStride'),1);
gl.uniform1f(u('uHeight'),height);gl.uniform3fv(u('uEye'),cam.eye);gl.uniform3fv(u('uForward'),cam.f);gl.uniform3fv(u('uNear'),near);
gl.uniform1f(u('uRefDepth'),cam.distance);gl.uniformMatrix4fv(u('uViewProj'),false,matrix);
gl.uniform1f(u('uDetail'),S.detail);gl.uniform1f(u('uLines'),S.lineCount);gl.uniform1f(u('uLineWidth'),S.lineWidth*pixel);
gl.uniform1f(u('uMajor'),S.majorLines?1:0);gl.uniform3fv(u('uColor'),color);gl.uniform1f(u('uBrightness'),S.brightness);
gl.uniform2f(u('uFade'),fadeStart,fadeEnd);gl.uniform3f(u('uFocus'),st.focus,focusScale*pixel,view.height*0.03*pixel);
gl.uniform4f(u('uHeat'),hx,hz,0.9*S.mouseRadius,heatStrength);
gl.uniform4f(u('uLamp'),hx,st.hit?st.hit.y+1.4:0,hz,heatStrength);
gl.uniform3fv(u('uSun'),SUN);gl.uniform1f(u('uReveal'),reveal);gl.uniform1f(u('uLightMode'),S.lightMode?1:0);gl.uniform1f(u('uOpacity'),S.opacity);
gl.enable(gl.DEPTH_TEST);gl.depthFunc(gl.LESS);gl.disable(gl.BLEND);
gl.clearColor(0,0,0,0);gl.clearDepth(1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
gl.drawArraysInstanced(gl.TRIANGLE_STRIP,0,2*(layout.columns+1),layout.rows);gl.disable(gl.DEPTH_TEST)};
const bloom=S.glow>0.001;
if(bloom){const w=Math.max(1,Math.round(view.width/2)),h=Math.max(1,Math.round(view.height/2));
alloc(source,w,h,true);
levels.forEach((pair,i)=>{const lw=Math.max(1,Math.round(view.width/2**(i+2))),lh=Math.max(1,Math.round(view.height/2**(i+2)));
alloc(pair[0],lw,lh,false);alloc(pair[1],lw,lh,false)});
gl.bindFramebuffer(gl.FRAMEBUFFER,source.fb);draw(0.5,w,h);
let from=source;
levels.forEach(([front,back])=>{
gl.bindFramebuffer(gl.FRAMEBUFFER,front.fb);gl.viewport(0,0,front.w,front.h);gl.useProgram(down.p);
bind(0,from.texture);gl.uniform1i(down.u('uSource'),0);gl.uniform2f(down.u('uTarget'),front.w,front.h);
gl.uniform2f(down.u('uTexel'),1/from.w,1/from.h);gl.drawArrays(gl.TRIANGLES,0,3);
gl.useProgram(blur.p);gl.uniform1i(blur.u('uSource'),0);gl.uniform2f(blur.u('uTarget'),back.w,back.h);
gl.bindFramebuffer(gl.FRAMEBUFFER,back.fb);bind(0,front.texture);gl.uniform2f(blur.u('uStep'),1/front.w,0);gl.drawArrays(gl.TRIANGLES,0,3);
gl.bindFramebuffer(gl.FRAMEBUFFER,front.fb);bind(0,back.texture);gl.uniform2f(blur.u('uStep'),0,1/back.h);gl.drawArrays(gl.TRIANGLES,0,3);
from=front})}
gl.bindFramebuffer(gl.FRAMEBUFFER,null);draw(view.ratio,canvas.width,canvas.height);
if(bloom){gl.viewport(0,0,canvas.width,canvas.height);gl.useProgram(comp.p);
levels.forEach(([front],i)=>{bind(i,front.texture);gl.uniform1i(comp.u('uBloom'+i),i)});
gl.uniform2f(comp.u('uView'),canvas.width,canvas.height);gl.uniform1f(comp.u('uGlow'),S.glow*reveal);
gl.uniform1f(comp.u('uLightMode'),S.lightMode?1:0);gl.enable(gl.BLEND);
if(S.lightMode)gl.blendFunc(gl.ONE,gl.ONE_MINUS_SRC_ALPHA);else gl.blendFunc(gl.ONE,gl.ONE);
gl.drawArrays(gl.TRIANGLES,0,3);gl.disable(gl.BLEND)}
drawCar();for(let u=LEVELS;u>=0;u--)bind(u,null)};

const resize=()=>{view.width=Math.max(1,container.clientWidth);view.height=Math.max(1,container.clientHeight);
view.ratio=Math.min(window.devicePixelRatio||1,2);
canvas.width=Math.max(1,Math.round(view.width*view.ratio));canvas.height=Math.max(1,Math.round(view.height*view.ratio));render()};

let last=0,visible=true;
const frame=now=>{requestAnimationFrame(frame);if(!visible||document.hidden)return;
const dt=last?clamp((now-last)/1000,0,1/20):1/60;last=now;
if(!S.intro||reduce)st.intro=1;else if(st.intro<1)st.intro=Math.min(1,st.intro+dt/INTRO);
st.rise=smoother(st.intro);
if(!reduce)st.morph+=S.morph*0.12*dt;stepCar(dt);
const engaged=pointer.inside;
st.presence+=((engaged?1:0)-st.presence)*(1-Math.exp(-dt/(engaged?0.18:0.45)));
const nx=pointer.x/view.width*2-1,ny=1-pointer.y/view.height*2;
const lean=reduce||!engaged?0:S.parallax,ty=nx*lean*0.09,tp=-ny*lean*0.045;
st.yv+=(38*(ty-st.yaw)-11*st.yv)*dt;st.pv+=(38*(tp-st.pitch)-11*st.pv)*dt;st.yaw+=st.yv*dt;st.pitch+=st.pv*dt;
const cam=camera();
if(engaged)st.hit=pick(cam,nx,ny);else if(st.presence<0.002)st.hit=null;
const ft=st.hit&&S.depthOfField>0?st.hit.depth:cam.distance;st.focus+=(ft-st.focus)*(1-Math.exp(-dt/0.35));
for(let i=pulses.length-1;i>=0;i--){pulses[i].age+=dt;if(pulses[i].age>4)pulses.splice(i,1)}
render();if(Rec&&Rec.frame)Rec.frame()};

const locate=e=>{const r=container.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
return{x,y,inside:x>=0&&y>=0&&x<=r.width&&y<=r.height}};
window.addEventListener('pointermove',e=>{const{x,y,inside}=locate(e);pointer.inside=inside;if(inside){pointer.x=x;pointer.y=y}},{passive:true});
window.addEventListener('pointerdown',e=>{const{x,y,inside}=locate(e);if(!inside)return;pointer.x=x;pointer.y=y;pointer.inside=true;
},{passive:true});
window.addEventListener('pointerup',e=>{if(e.pointerType==='touch')pointer.inside=false},{passive:true});
document.documentElement.addEventListener('pointerleave',()=>{pointer.inside=false});
new ResizeObserver(resize).observe(container);
new IntersectionObserver(es=>{visible=es.some(e=>e.isIntersecting)}).observe(container);
resize();requestAnimationFrame(frame);
})();
</script>
