<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
  <title>BNY Mellon · Pershing X Advisory — Zack Gort</title>
    <!-- ─── Yellow favicon ─── -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 80'%3E%3Crect width='80' height='80' rx='12' fill='%23E5E567'/%3E%3Ctext x='40' y='50' font-family='system-ui, -apple-system, sans-serif' font-size='28' font-weight='800' text-anchor='middle' fill='%231C1C1E' letter-spacing='-0.5'%3EBNY%3C/text%3E%3C/svg%3E" />
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@1,2,3,4,5,6,7,8,9&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
  <style>
    /* ── design system (same as neverever.land) ── */
    :root {
      --bg: #f0f0f2;
      --card: #ffffff;
      --card-dark: #1c1c1e;
      --card-mid: #3a3a3c;
      --accent: #e5e567;
      --accent-2: #f5f557;
      --ink: #1c1c1e;
      --ink-mid: #3a3a3c;
      --ink-light: #8e8e93;
      --ink-lighter: #b0b0b6;
      --border: #e6e6e8;
      --shadow: 0 4px 12px rgba(0,0,0,0.04);
      --shadow-hover: 0 16px 40px rgba(0,0,0,0.08), 0 4px 12px rgba(0,0,0,0.02);
      --shadow-floating: 0 8px 32px rgba(0,0,0,0.1);
      --radius: 1.5rem;
      --radius-sm: 0.65rem;
      --font: 'Satoshi', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', 'IBM Plex Mono', monospace;
      --fs-body: 15px;
      --fs-display: 54px;
      --max-width: 1600px;
      --transition: 0.25s cubic-bezier(0.25,0.46,0.45,0.94);
      --margin: 16px;
      --topbar-height: 56px;
      --hud-height: 64px;
      --hud-top-height: 44px;
      --scrollbar-height: 3px;
    }
    @media (min-width: 640px) {
      :root {
        --margin: 24px;
        --topbar-height: 64px;
        --hud-height: 70px;
        --hud-top-height: 48px;
      }
    }
    @media (min-width: 1024px) {
      :root {
        --margin: 32px;
        --topbar-height: 72px;
        --hud-height: 76px;
        --hud-top-height: 52px;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font);
      font-size: var(--fs-body);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100vh;
      min-height: 100dvh;
      padding-bottom: calc(var(--hud-height) + 20px + var(--scrollbar-height));
      overflow-x: hidden;
    }
    ::selection { background: var(--accent); color: var(--ink); }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-thumb { background: var(--ink-lighter); border-radius: var(--radius-sm); }
    html { scrollbar-width: thin; scrollbar-color: var(--ink-lighter) transparent; }

    .t-micro {
      font-family: var(--font-mono);
      font-size: 7px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-light);
      line-height: 1.4;
    }
    .btn {
      font-family: var(--font-mono);
      font-size: 8px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--ink-mid);
      padding: 5px 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      border-radius: var(--radius-sm);
      font-weight: 500;
      touch-action: manipulation;
      min-height: 30px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      gap: 6px;
    }
    .btn:hover { background: var(--ink); color: var(--card); border-color: var(--ink); }
    .btn:active { transform: scale(0.96); }
    .btn.ghost { border-color: var(--border); color: var(--ink-light); }
    .btn.ghost:hover { background: var(--ink); color: var(--card); border-color: var(--ink); }
    .btn-primary { background: var(--ink); color: var(--card); border-color: var(--ink); }
    .btn-primary:hover { background: var(--ink-mid); border-color: var(--ink-mid); }

    /* ── topbar ── */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 150;
      background: transparent;
      padding: 6px 0;
      min-height: var(--topbar-height);
      display: flex;
      align-items: center;
    }
    .topbar .wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 0 var(--margin);
      max-width: var(--max-width);
      margin: 0 auto;
      width: 100%;
    }
    .wordmark {
      font-family: var(--font);
      font-size: clamp(12px, 3.5vw, 20px);
      font-weight: 700;
      letter-spacing: -0.03em;
      display: flex;
      align-items: baseline;
      gap: 6px;
      color: var(--ink);
      flex-shrink: 0;
    }
    .wordmark .count {
      font-family: var(--font-mono);
      font-size: 8px;
      font-weight: 400;
      color: var(--ink-light);
      letter-spacing: 0.04em;
    }
    .topbar-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .topbar-right .btn { font-size: 9px; min-height: 32px; padding: 4px 10px; }
    .topbar-right .btn-icon { width: 32px; padding: 0; font-size: 15px; }

    /* ── viewport blur ── */
    .viewport-blur {
      position: fixed;
      left: 0;
      right: 0;
      z-index: 40;
      pointer-events: none;
      backdrop-filter: blur(0px);
      -webkit-backdrop-filter: blur(0px);
      transition: backdrop-filter 0.3s ease, background 0.4s ease;
    }
    .viewport-blur.scrolling { backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(8px); }
    .viewport-blur-top {
      top: 0;
      height: calc(var(--topbar-height) + 36px);
      background: linear-gradient(to bottom, rgba(240,240,242,0.7), rgba(240,240,242,0));
      mask-image: linear-gradient(to bottom, black 0%, black 60%, transparent 100%);
      -webkit-mask-image: linear-gradient(to bottom, black 0%, black 60%, transparent 100%);
    }
    .viewport-blur-bottom {
      bottom: 0;
      height: calc(var(--hud-height) + 60px);
      background: linear-gradient(to top, rgba(240,240,242,0.7), rgba(240,240,242,0));
      mask-image: linear-gradient(to top, black 0%, black 45%, transparent 100%);
      -webkit-mask-image: linear-gradient(to top, black 0%, black 45%, transparent 100%);
    }

    /* ── carousel ── */
    .letters-viewport {
      position: relative;
      overflow: hidden;
      width: 100vw;
      left: 50%;
      margin-left: -50vw;
    }
    .letters-track {
      display: flex;
      align-items: flex-start;
      gap: 22px;
      padding-top: clamp(20px, 4vh, 60px);
      padding-bottom: 60px;
      padding-left: max(4vw, calc(50% - 520px));
      padding-right: max(4vw, calc(50% - 520px));
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      cursor: grab;
      user-select: none;
      box-sizing: border-box;
    }
    .letters-track.dragging { cursor: grabbing; scroll-snap-type: none; scroll-behavior: auto; }
    .letter-panel {
      flex: 0 0 auto;
      width: min(92vw, 1000px);
      max-width: 1000px;
      scroll-snap-align: center;
      box-sizing: border-box;
      opacity: 0.35;
      transition: opacity 0.3s ease, transform 0.3s ease;
      cursor: pointer;
    }
    .letter-panel.active { opacity: 1; cursor: auto; transform: scale(1); }
    .letter-hotspot {
      position: absolute;
      top: 0;
      bottom: 0;
      width: clamp(56px, 9vw, 180px);
      z-index: 20;
    }
    .letter-hotspot-prev {
      left: 0;
      cursor: url('data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%2744%27%20height%3D%2744%27%3E%3Ccircle%20cx%3D%2722%27%20cy%3D%2722%27%20r%3D%2720%27%20fill%3D%27rgba%2820%2C20%2C20%2C0.55%29%27/%3E%3Cpath%20d%3D%27M26%2012%20L16%2022%20L26%2032%27%20fill%3D%27none%27%20stroke%3D%27white%27%20stroke-width%3D%273%27%20stroke-linecap%3D%27round%27%20stroke-linejoin%3D%27round%27/%3E%3C/svg%3E') 22 22, w-resize;
    }
    .letter-hotspot-next {
      right: 0;
      cursor: url('data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%2744%27%20height%3D%2744%27%3E%3Ccircle%20cx%3D%2722%27%20cy%3D%2722%27%20r%3D%2720%27%20fill%3D%27rgba%2820%2C20%2C20%2C0.55%29%27/%3E%3Cpath%20d%3D%27M18%2012%20L28%2022%20L18%2032%27%20fill%3D%27none%27%20stroke%3D%27white%27%20stroke-width%3D%273%27%20stroke-linecap%3D%27round%27%20stroke-linejoin%3D%27round%27/%3E%3C/svg%3E') 22 22, e-resize;
    }

    .letter-card-frame {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px clamp(20px, 3vw, 36px) 40px;
      background: var(--card);
      box-shadow: var(--shadow);
      transition: box-shadow 0.3s ease, transform 0.3s ease;
      position: relative;
    }
    .letter-panel.active .letter-card-frame { box-shadow: var(--shadow-hover); }
    .letter-panel.active .letter-card-frame:hover {
      box-shadow: 0 24px 56px rgba(0,0,0,0.08), 0 8px 20px rgba(0,0,0,0.04);
      transform: translateY(-2px);
    }
    .letter-cover {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-bottom: 18px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }
    .letter-cover-kicker {
      font-family: var(--font-mono);
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-light);
    }
    .letter-cover-name {
      font-family: var(--font);
      font-size: clamp(22px, 3vw, 34px);
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--ink);
    }
    .letter-cover-deck {
      font-family: var(--font);
      font-size: clamp(13px, 1vw, 16px);
      line-height: 1.5;
      color: var(--ink-light);
      max-width: 520px;
    }
    .letter-toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }
    .letter-toolbar .letter-count {
      font-family: var(--font-mono);
      font-size: 8px;
      color: var(--ink-light);
      margin-left: auto;
    }

    /* ── title card (LETTER 01) — Provenance ── */
    .letter-card-frame.title-card-frame {
      background: var(--accent);
      border-color: var(--accent);
    }
    .letter-card-frame.title-card-frame .letter-cover {
      border-bottom-color: rgba(28, 28, 30, 0.15);
    }
    .letter-card-frame.title-card-frame .letter-cover-kicker,
    .letter-card-frame.title-card-frame .letter-cover-deck {
      color: rgba(28, 28, 30, 0.6);
    }
    .letter-card-frame.title-card-frame .letter-cover-name {
      color: var(--ink);
    }
    .letter-card-frame.title-card-frame .letter-toolbar .letter-count {
      color: rgba(28, 28, 30, 0.5);
    }
    .title-card-letter {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1px;
      background: rgba(28, 28, 30, 0.15);
      border: 1px solid rgba(28, 28, 30, 0.15);
      border-radius: var(--radius-sm);
      overflow: hidden;
    }
    .title-card-letter .tc-cell {
      background: var(--accent);
      padding: 1.25rem 1.4rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
      min-height: 110px;
      color: var(--ink);
    }
    .title-card-letter .tc-cell.span-2 { grid-column: span 2; }
    .title-card-letter .tc-cell.row-span-2 { grid-row: span 2; }
    .title-card-letter .tc-photo { padding: 0; overflow: hidden; }
    .title-card-letter .tc-photo img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      min-height: 110px;
    }
    .title-card-letter .tc-label {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(28, 28, 30, 0.55);
      font-weight: 500;
    }
    .title-card-letter .tc-value {
      font-family: var(--font);
      font-size: calc(var(--fs-body) * 1.1);
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: 1.25;
      color: var(--ink);
    }
    .title-card-letter .tc-value-sm {
      font-family: var(--font);
      font-size: calc(var(--fs-body) * 0.95);
      font-weight: 500;
      color: var(--ink);
    }
    .title-card-letter .tc-stat-row { display: flex; gap: 18px; }
    .title-card-letter .tc-stat-num {
      font-family: var(--font);
      font-size: calc(var(--fs-body) * 1.3);
      font-weight: 700;
      color: var(--ink);
    }
    .title-card-letter .tc-stat-label {
      font-family: var(--font-mono);
      font-size: 0.6rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(28, 28, 30, 0.55);
    }

    /* ── index card (LETTER 02) — Canon / table of contents ── */
    .letter-card-frame.index-card-frame {
      background: var(--card-dark);
      border-color: var(--card-dark);
    }
    .letter-card-frame.index-card-frame .letter-cover {
      border-bottom-color: rgba(255, 255, 255, 0.12);
    }
    .letter-card-frame.index-card-frame .letter-cover-kicker,
    .letter-card-frame.index-card-frame .letter-cover-deck {
      color: rgba(255, 255, 255, 0.55);
    }
    .letter-card-frame.index-card-frame .letter-cover-name {
      color: #ffffff;
    }
    .letter-card-frame.index-card-frame .letter-toolbar .letter-count {
      color: rgba(255, 255, 255, 0.4);
    }
    .index-letter {
      display: grid;
      grid-template-rows: repeat(10, auto);
      grid-auto-flow: column;
      gap: 0.2rem 2rem;
      max-width: 640px;
      overflow: hidden;
    }
    .index-letter a.idx-row {
      display: flex;
      align-items: baseline;
      gap: 0.6rem;
      padding: 0.35rem 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      cursor: pointer;
      transition: color 0.2s, transform 0.15s;
      color: rgba(255, 255, 255, 0.85);
      max-width: 100%;
      overflow: hidden;
    }
    .index-letter a.idx-row:hover {
      color: var(--accent);
      transform: translateX(4px);
    }
    .index-letter .idx-num {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      letter-spacing: 0.04em;
      opacity: 0.45;
      flex-shrink: 0;
      min-width: 2.6em;
      color: rgba(255, 255, 255, 0.55);
    }
    .index-letter .idx-title {
      font-family: var(--font);
      font-size: calc(var(--fs-body) * 0.95);
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
      min-width: 0;
    }
    @media (max-width: 640px) {
      .index-letter {
        grid-auto-flow: row;
        grid-template-rows: none;
      }
    }

    /* ── sample content cards ── */
    .sample-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1px;
      background: rgba(28,28,30,0.15);
      border: 1px solid rgba(28,28,30,0.15);
      border-radius: var(--radius-sm);
      overflow: hidden;
    }
    .sample-grid .cell {
      background: var(--bg);
      padding: 1.25rem 1.4rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
      min-height: 90px;
      color: var(--ink);
    }
    .sample-grid .cell .label { font-family: var(--font-mono); font-size: 0.65rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-light); font-weight: 500; }
    .sample-grid .cell .value { font-family: var(--font); font-size: calc(var(--fs-body) * 0.95); font-weight: 500; color: var(--ink); }
    .sample-grid .cell.span-2 { grid-column: span 2; }

    .sample-index {
      display: grid;
      grid-template-rows: repeat(6, auto);
      grid-auto-flow: column;
      gap: 0.2rem 2rem;
      max-width: 480px;
      overflow: hidden;
    }
    .sample-index a.idx-row {
      display: flex;
      align-items: baseline;
      gap: 0.6rem;
      padding: 0.35rem 0;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: color 0.2s, transform 0.15s;
      color: var(--ink-mid);
      max-width: 100%;
      overflow: hidden;
    }
    .sample-index a.idx-row:hover { color: var(--ink); transform: translateX(4px); }
    .sample-index .idx-num {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      letter-spacing: 0.04em;
      opacity: 0.45;
      flex-shrink: 0;
      min-width: 2.6em;
      color: var(--ink-light);
    }
    .sample-index .idx-title {
      font-family: var(--font);
      font-size: calc(var(--fs-body) * 0.95);
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
      min-width: 0;
    }

    .sample-letter {
      max-width: 640px;
      margin: 0 auto;
      padding: 0.5rem 0;
    }
    .sample-letter p {
      margin-bottom: 0.75rem;
      color: var(--ink-mid);
    }
    .sample-letter code {
      font-family: var(--font-mono);
      background: var(--bg);
      padding: 0.1rem 0.4rem;
      border-radius: var(--radius-sm);
      font-size: 0.85em;
      color: var(--ink);
    }

    /* ── case-study content primitives (normalized to shell tokens) ── */
    .cs-split { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; align-items: start; }
    .cs-split.rev { direction: rtl; }
    .cs-split.rev > * { direction: ltr; }
    @media (max-width: 700px) { .cs-split { grid-template-columns: 1fr; } }

    .cs-img { width: 100%; border-radius: var(--radius-sm); display: block; box-shadow: var(--shadow); }
    .cs-img + .cs-img { margin-top: 10px; }

    .cs-pills { margin-top: 14px; display: flex; flex-direction: column; gap: 7px; }
    .cs-pill { font-family: var(--font-mono); font-size: 11px; color: var(--ink-mid); padding-left: 15px; position: relative; line-height: 1.5; }
    .cs-pill::before { content: '—'; position: absolute; left: 0; color: var(--ink-lighter); }

    .cs-quote { border-left: 2px solid var(--ink); padding: 2px 0 2px 20px; margin: 26px 0; }
    .cs-quote blockquote { font-family: var(--font); font-size: clamp(15px,1.6vw,19px); font-style: italic; color: var(--ink); line-height: 1.5; margin-bottom: 8px; }
    .cs-quote cite { font-family: var(--font-mono); font-size: 10px; color: var(--ink-light); font-style: normal; }

    .cs-comp-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 16px; margin-top: 18px; }
    @media (max-width: 768px) { .cs-comp-grid { grid-template-columns: 1fr; } }
    .cs-comp-card { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 18px; }
    .cs-comp-num { font-family: var(--font-mono); font-size: 10px; color: var(--ink-light); margin-bottom: 8px; }
    .cs-comp-card h4 { font-family: var(--font); font-size: 15px; font-weight: 700; margin-bottom: 8px; color: var(--ink); }
    .cs-comp-card p { font-size: 12.5px; color: var(--ink-mid); line-height: 1.6; }

    .cs-phase { margin-bottom: 22px; }
    .cs-phase-tag { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-light); margin-bottom: 6px; }
    .cs-phase h5 { font-family: var(--font); font-size: 15px; font-weight: 700; margin-bottom: 6px; color: var(--ink); }
    .cs-phase p { font-size: 12.5px; color: var(--ink-mid); line-height: 1.6; }

    .cs-gallery { display: grid; grid-template-columns: repeat(3,1fr); gap: 14px; margin-top: 18px; }
    @media (max-width: 768px) { .cs-gallery { grid-template-columns: repeat(2,1fr); } }
    @media (max-width: 480px) { .cs-gallery { grid-template-columns: 1fr; } }
    .cs-gallery figure { margin: 0; }
    .cs-gallery img { width: 100%; border-radius: var(--radius-sm); display: block; box-shadow: var(--shadow); }
    .cs-gallery figcaption { font-family: var(--font-mono); font-size: 9px; color: var(--ink-light); margin-top: 6px; line-height: 1.4; }

    .cs-flow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 14px 0; }
    .cs-flow-step { font-family: var(--font-mono); font-size: 10px; padding: 6px 10px; border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--ink-mid); background: var(--bg); white-space: nowrap; }
    .cs-flow-step.accent { border-color: var(--ink); color: var(--ink); font-weight: 600; background: var(--card); }
    .cs-flow-arrow { color: var(--ink-lighter); font-size: 12px; }

    .cs-stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin: 18px 0; }
    .cs-stat { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px; text-align: center; }
    .cs-stat-val { display: block; font-family: var(--font); font-size: 22px; font-weight: 700; color: var(--ink); }
    .cs-stat-lbl { font-family: var(--font-mono); font-size: 8.5px; color: var(--ink-light); text-transform: uppercase; letter-spacing: 0.05em; }

    .cs-chart-card { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 16px; margin-bottom: 14px; }

    .cs-chart-desc { font-size: 12px; color: var(--ink-mid); margin-bottom: 10px; }
    .cs-chart-wrap { position: relative; width: 100%; height: 180px; }
    .cs-charts-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media (max-width: 640px) { .cs-charts-2col { grid-template-columns: 1fr; } }
    .cs-legend { display: flex; gap: 18px; margin-bottom: 10px; flex-wrap: wrap; }
    .cs-legend-item { display: flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 10px; color: var(--ink-mid); }
    .cs-legend-line { width: 20px; height: 2px; border-radius: 1px; }

    .cs-callout { border-left: 3px solid var(--ink); background: var(--bg); border-radius: 0 var(--radius-sm) var(--radius-sm) 0; padding: 12px 16px; font-size: 12.5px; color: var(--ink-mid); margin: 14px 0; line-height: 1.65; }
    .cs-callout strong { color: var(--ink); display: block; margin-bottom: 2px; }

    .cs-divider { height: 1px; background: var(--border); margin: 28px 0; }
    .cs-section-tag { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-light); margin: 30px 0 8px; }

    .cs-unf-entry { margin-bottom: 24px; padding-bottom: 24px; border-bottom: 1px solid var(--border); }
    .cs-unf-entry:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    .cs-unf-label { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--ink-light); margin-bottom: 6px; }
    .cs-unf-heading { font-family: var(--font); font-size: 18px; font-weight: 700; color: var(--ink); margin-bottom: 10px; letter-spacing: -0.01em; }
    .cs-unf-text { font-size: 12.5px; color: var(--ink-mid); line-height: 1.75; margin-bottom: 10px; }
    .cs-unf-text strong { color: var(--ink); font-weight: 600; }

    /* ── "unfiltered" mode: scoped dark override for one panel ──
       Redefines the shell's own tokens inside just this frame, so
       every .cs-* / .letter-* rule that already reads var(--ink),
       var(--card) etc. flips automatically — no duplicate ruleset. */
    .letter-panel[data-mode="unfiltered"] .letter-card-frame {
      --card: #141414;
      --bg: rgba(242,240,235,0.06);
      --ink: #f2f0eb;
      --ink-mid: rgba(242,240,235,0.72);
      --ink-light: rgba(242,240,235,0.42);
      --ink-lighter: rgba(242,240,235,0.28);
      --border: rgba(242,240,235,0.12);
      --shadow: 0 4px 28px rgba(232,0,125,0.14);
      --shadow-hover: 0 20px 56px rgba(232,0,125,0.22), 0 4px 16px rgba(0,0,0,0.3);
    }
    .letter-panel[data-mode="unfiltered"] .letter-cover-kicker { color: #e8007d; }
    .letter-panel[data-mode="unfiltered"] .cs-unf-heading {
      text-transform: uppercase;
      letter-spacing: 0.01em;
      font-weight: 800;
    }
    .letter-panel[data-mode="unfiltered"] .cs-unf-label { color: rgba(232,0,125,0.75); }
    .letter-panel[data-mode="unfiltered"] .cs-callout { border-left-color: #e8007d; }
    .letter-panel[data-mode="unfiltered"] .cs-unf-text a { color: #e8007d !important; }

    /* ── HUD ── */
    .hud {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-floating);
      padding: 6px 12px;
      display: flex;
      align-items: center;
      gap: 4px;
      min-height: 44px;
      font-family: var(--font-mono);
    }
    .hud-bottom {
      bottom: calc(12px + var(--scrollbar-height));
      padding: 8px 10px;
      min-height: 56px;
      gap: 6px;
      justify-content: center;
    }
    .hud .btn {
      min-height: 30px;
      padding: 5px 10px;
      font-size: 8px;
    }
    .hud .hud-divider {
      width: 1px;
      height: 24px;
      background: var(--border);
      flex-shrink: 0;
      margin: 0 2px;
    }
    .hud .filter-count {
      background: var(--ink);
      color: var(--card);
      padding: 1px 6px;
      border-radius: var(--radius-sm);
      font-size: 7px;
      font-weight: 600;
      min-width: 18px;
      text-align: center;
    }
    .hud .hud-label {
      font-size: 6px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-light);
      opacity: 0.5;
    }
    .hud-nav-counter {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: none;
      color: var(--ink);
      padding: 0 6px;
      font-family: var(--font-mono);
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.01em;
      min-width: auto;
    }
    @media (min-width: 640px) {
      .hud-nav-counter { font-size: 19px; }
    }
    .hud-email-cta {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--card);

    .hud-email-cta:hover { background: var(--ink-mid); }
    .hud-email-cta:active { transform: scale(0.97); }
    @media (min-width: 640px) {
      .hud-email-cta { font-size: 11px; padding: 11px 26px; }

    @media (max-width: 640px) {
      .hud-bottom { padding: 8px 12px; min-height: 48px; gap: 4px; }
      .hud .btn { font-size: 7px; padding: 4px 8px; min-height: 26px; }
      .hud .hud-label { display: none; }

    @media (max-width: 480px) {
      .hud-bottom { padding: 6px 10px; gap: 3px; min-height: 42px; }

    /* ── scroll progress ── */
    .scroll-progress-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;

      background: rgba(0,0,0,0.06);
      z-index: 150;
      pointer-events: none;
    }
    .scroll-progress-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.1s ease;
      border-radius: 0 2px 2px 0;
    }
    .scroll-progress-fill.dim { opacity: 0.5; }

    /* ── custom cursor ── */
    body.custom-cursor-active { cursor: none; }
    .write-cursor-dot, .write-cursor-ellipse {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 500;
      pointer-events: none;
      transform: translate(-9999px, -9999px);
      opacity: 0;
      transition: opacity 0.18s ease;
      will-change: transform;
    }
    .write-cursor-dot.visible, .write-cursor-ellipse.visible { opacity: 1; }
    .write-cursor-dot {
      width: 6px;
      height: 6px;
      margin: -3px 0 0 -3px;
      border-radius: 50%;
      background: var(--ink);
    }
    .write-cursor-ellipse {
      width: 34px;
      height: 34px;
      margin: -17px 0 0 -17px;
      border: 1.5px solid var(--ink);
      border-radius: 50%;
      opacity: 0;
    }
    .write-cursor-ellipse.visible { opacity: 0.32; }
    body.custom-cursor-active.write-native-cursor { cursor: auto; }
    .write-native-cursor .write-cursor-dot,
    .write-native-cursor .write-cursor-ellipse { opacity: 0 !important; }

    /* ── appearance dropdown ── */
    .topbar-appearance-dropdown {
      position: fixed;
      min-width: 100px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow-floating);
      padding: 4px 0;
      z-index: 200;
      display: none;
      flex-direction: column;
    }
    .topbar-appearance-dropdown.open { display: flex; }
    .topbar-appearance-dropdown .menu-item {
      padding: 4px 12px;
      font-family: var(--font-mono);
      font-size: 8px;
      letter-spacing: 0.04em;
      color: var(--ink-mid);
      cursor: pointer;
      transition: background 0.12s ease, color 0.12s ease;
      border: none;
      background: none;
      text-align: left;
      width: 100%;
      white-space: nowrap;
    }
    .topbar-appearance-dropdown .menu-item:hover { background: var(--bg); color: var(--ink); }
    .topbar-appearance-dropdown .menu-item.active { background: var(--ink); color: var(--card); }
    .topbar-appearance-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    /* ── responsive tweaks ── */
    @media (max-width: 820px) {
      .letter-panel { width: 94vw; }
      .letters-track { gap: 16px; padding-left: max(2vw, calc(50% - 400px)); padding-right: max(2vw, calc(50% - 400px)); }
      .sample-grid { grid-template-columns: repeat(2, 1fr); }
      .sample-grid .cell.span-2 { grid-column: span 2; }
    }
    @media (max-width: 640px) {
      .letter-card-frame { padding: 16px 14px 28px; border-radius: var(--radius-sm); }
      .sample-grid { grid-template-columns: 1fr; }
      .sample-grid .cell.span-2 { grid-column: span 1; }
      .sample-index { grid-auto-flow: row; }
    }
  </style>
</head>
<body>

  <!-- ─── CURSOR ─── -->
  <div class="write-cursor-ellipse" id="writeCursorEllipse" aria-hidden="true"></div>
  <div class="write-cursor-dot" id="writeCursorDot" aria-hidden="true"></div>

  <!-- ─── SCROLL PROGRESS ─── -->
  <div class="scroll-progress-bar" id="scrollProgressBar" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
    <div class="scroll-progress-fill" id="scrollProgressFill"></div>
  </div>

  <!-- ─── VIEWPORT BLUR ─── -->
  <div class="viewport-blur viewport-blur-top" id="viewportBlurTop" aria-hidden="true"></div>
  <div class="viewport-blur viewport-blur-bottom" id="viewportBlurBottom" aria-hidden="true"></div>

  <!-- ─── TOPBAR ─── -->
  <div class="topbar">
    <div class="wrap">
      <div class="wordmark">
        <span>BNY / PERSHING X</span>
        <span class="count" id="topCount">◈</span>
      </div>
      <div class="topbar-right">
        <a class="btn" href="https://zack.cx" target="_blank" rel="noopener">zack.cx</a>
        <a class="btn" href="https://www.linkedin.com/in/zckgrt" target="_blank" rel="noopener">in/zckgrt</a>

    </div>
  </div>

  <!-- ─── TOP HUD ─── -->
  <div class="hud hud-top" id="hudTop">
    <button class="btn btn-icon" id="hudPrev" title="Previous" aria-label="Previous letter">‹</button>
    <span class="hud-nav-counter" id="hudNavCounter" role="status" aria-live="polite">1/8</span>
    <button class="btn btn-icon" id="hudNext" title="Next" aria-label="Next letter">›</button>
  </div>

  <div class="wrap">
    <!-- ─── CAROUSEL ─── -->
    <div class="letters-viewport" id="lettersViewport">
      <div class="letters-track" id="lettersTrack"></div>
      <div class="letter-hotspot letter-hotspot-prev" id="letterHotspotPrev" aria-hidden="true" tabindex="-1"></div>
      <div class="letter-hotspot letter-hotspot-next" id="letterHotspotNext" aria-hidden="true" tabindex="-1"></div>
    </div>
  </div>

  <!-- ─── BOTTOM HUD ─── -->
  <div class="hud hud-bottom" id="hud">
    <a class="hud-email-cta" href="mailto:ZCKGRT@GMAIL.COM">✉ ZCKGRT@GMAIL.COM</a>
  </div>

  <!-- ─── APPEARANCE DROPDOWN ─── -->
  <div class="topbar-appearance-dropdown" id="appearanceDropdown"></div>

  <script>
    (function() {
      'use strict';

      // ── Helpers ──────────────────────────────────────────────
      const escapeHtml = (s) => (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
      const closestSafe = (node, selector) => node && node.nodeType===1 && node.closest ? node.closest(selector) : null;

      function positionFloatingPanel(panel, trigger, opts={}) {
        if (!panel || !trigger) return;
        const margin = opts.margin ?? 10;
        const gap = opts.gap ?? 8;
        const align = opts.align || 'right';
        const triggerRect = trigger.getBoundingClientRect();
        const vw = window.innerWidth, vh = window.innerHeight;
        panel.style.position = 'fixed';
        panel.style.right = 'auto';
        panel.style.bottom = 'auto';
        const panelRect = panel.getBoundingClientRect();
        const pw = panelRect.width, ph = panelRect.height;
        const spaceBelow = vh - triggerRect.bottom - gap;
        const spaceAbove = triggerRect.top - gap;
        let top = ph <= spaceBelow || spaceBelow >= spaceAbove ? triggerRect.bottom + gap : triggerRect.top - gap - ph;
        top = Math.max(margin, Math.min(top, vh - ph - margin));
        let left = align === 'left' ? triggerRect.left : triggerRect.right - pw;
        left = Math.max(margin, Math.min(left, vw - pw - margin));
        panel.style.top = top + 'px';
        panel.style.left = left + 'px';
      }

      // ── Carousel state ──────────────────────────────────────
      let letterData = [];
      let activeIndex = 0;

      // ── Render functions ────────────────────────────────────
      function buildLetterPanel(index, data) {
        const panel = document.createElement('div');
        panel.className = 'letter-panel' + (index === 0 ? ' active' : '');
        panel.dataset.index = String(index);
        if (data.mode) panel.dataset.mode = data.mode;

        const frame = document.createElement('div');
        frame.className = 'letter-card-frame' +
          (data.isTitleCard ? ' title-card-frame' : '') +
          (data.isIndex ? ' index-card-frame' : '');

        const cover = document.createElement('div');
        cover.className = 'letter-cover';
        const label = data.isSpecial ? data.specialLabel || 'SPECIAL' : 'LETTER ' + String(index+1).padStart(2,'0');
        cover.innerHTML = `
          <span class="letter-cover-kicker">${label}</span>
          <h2 class="letter-cover-name">${escapeHtml(data.title)}</h2>
          <p class="letter-cover-deck">${escapeHtml(data.deck || '')}</p>
        `;
        frame.appendChild(cover);

        const toolbar = document.createElement('div');
        toolbar.className = 'letter-toolbar';
        const countEl = document.createElement('span');
        countEl.className = 'letter-count';
        countEl.textContent = data.viewMode || 'info';
        toolbar.appendChild(countEl);
        frame.appendChild(toolbar);

        const content = document.createElement('div');
        content.className = 'letter-content';
        frame.appendChild(content);

        panel.appendChild(frame);

        panel.addEventListener('click', () => {
          const idx = Number(panel.dataset.index);
          if (idx !== activeIndex) activatePanel(idx);
        });

        return panel;
      }

      function renderLetter(index) {
        const panels = document.querySelectorAll('.letter-panel');
        if (!panels.length) return;
        const panel = panels[index];
        if (!panel) return;
        const data = letterData[index];
        if (!data) return;

        const frame = panel.querySelector('.letter-card-frame');
        const content = frame.querySelector('.letter-content');
        if (!content) return;

        // Build content from data.contentFn if provided, otherwise use static markup
        if (data.contentFn) {
          content.innerHTML = data.contentFn();
        } else if (data.staticContent) {
          content.innerHTML = data.staticContent;
        } else {
          // Fallback placeholder
          content.innerHTML = `<div class="sample-letter"><p>This letter is empty. Edit <code>letterData[${index}]</code> to add content.</p></div>`;
        }

        // Some letters need post-injection JS (e.g. Chart.js canvases can't
        // self-execute via innerHTML). afterRender runs once the markup is live.
        if (typeof data.afterRender === 'function') {
          try { data.afterRender(content); } catch (err) { console.error('afterRender failed for letter', index, err); }
        }

        if (index === activeIndex) {
          updateProgressBar();
          const counter = document.getElementById('hudNavCounter');
          if (counter) counter.textContent = `${activeIndex+1}/${letterData.length}`;
          const statusCount = document.getElementById('hudStatusCount');
          if (statusCount) statusCount.textContent = String(letterData.length);
        }
      }

      function renderTrack() {
        const track = document.getElementById('lettersTrack');
        track.innerHTML = '';
        letterData.forEach((data, i) => track.appendChild(buildLetterPanel(i, data)));
        renderLetter(0);
        updateProgressBar();
        const counter = document.getElementById('hudNavCounter');
        if (counter) counter.textContent = `1/${letterData.length}`;
      }

      function activatePanel(newIndex) {
        if (newIndex < 0) newIndex = letterData.length - 1;
        if (newIndex >= letterData.length) newIndex = 0;
        if (newIndex === activeIndex) { scrollToPanel(newIndex); updateProgressBar(); return; }
        const panels = document.querySelectorAll('.letter-panel');
        panels.forEach(p => p.classList.remove('active'));
        activeIndex = newIndex;
        panels[activeIndex].classList.add('active');
        renderLetter(activeIndex);
        scrollToPanel(activeIndex);
        updateProgressBar();
        const counter = document.getElementById('hudNavCounter');
        if (counter) counter.textContent = `${activeIndex+1}/${letterData.length}`;
      }

      function scrollToPanel(index) {
        const panel = document.querySelectorAll('.letter-panel')[index];
        if (!panel) return;
        const track = document.getElementById('lettersTrack');
        const trackRect = track.getBoundingClientRect();
        const panelRect = panel.getBoundingClientRect();
        const delta = panelRect.left + panelRect.width/2 - (trackRect.left + trackRect.width/2);
        track.scrollTo({ left: track.scrollLeft + delta, behavior: 'smooth' });
      }

      function updateProgressBar() {
        const fill = document.getElementById('scrollProgressFill');
        const total = letterData.length;
        if (total <= 1) { fill.style.width = '0%'; fill.classList.add('dim'); return; }
        const progress = activeIndex / (total - 1);
        const percent = Math.round(progress * 100);
        fill.style.width = percent + '%';
        fill.classList.remove('dim');
        document.getElementById('scrollProgressBar').setAttribute('aria-valuenow', String(percent));
      }

      // ── Viewport blur ──────────────────────────────────────────
      function setupViewportBlur() {
        const top = document.getElementById('viewportBlurTop'), bottom = document.getElementById('viewportBlurBottom'), hudTop = document.getElementById('hudTop');
        if (!top || !bottom) return;
        function update() {
          const scrollY = window.scrollY || window.pageYOffset || 0;
          const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
          top.classList.toggle('scrolling', scrollY > 4);
          bottom.classList.toggle('scrolling', scrollY < maxScroll - 4);
          if (hudTop) hudTop.classList.toggle('docked', scrollY > 4);
        }
        let ticking = false;
        function onScrollOrResize() { if (ticking) return; ticking = true; requestAnimationFrame(() => { update(); ticking = false; }); }
        window.addEventListener('scroll', onScrollOrResize, { passive: true });
        window.addEventListener('resize', onScrollOrResize);
        update();
      }

      // ── Custom cursor ──────────────────────────────────────────
      (function initWriteCursor() {
        const dot = document.getElementById('writeCursorDot');
        const ellipse = document.getElementById('writeCursorEllipse');
        if (!dot || !ellipse) return;
        const NATIVE_SELECTOR = ['button','a','input','textarea','select','[role="button"]','.letter-hotspot'].join(', ');
        let ptrX=0, ptrY=0, prevFrameX=0, prevFrameY=0, frameInit=false;
        let ellAngle=0, ellScaleX=1, ellScaleY=1, rafId=null;
        const ELLIPSE_LERP = 0.22, SPEED_SATURATE = 34, MAX_STRETCH = 0.6;

        function shortAngleLerp(current,target,factor) { const diff = ((target - current + 540) % 360) - 180; return current + diff * factor; }
        function step() {
          if (!frameInit) { prevFrameX = ptrX; prevFrameY = ptrY; frameInit = true; }
          const dx = ptrX - prevFrameX, dy = ptrY - prevFrameY;
          prevFrameX = ptrX; prevFrameY = ptrY;
          const speed = Math.hypot(dx, dy);
          const angleTarget = speed > 0.4 ? Math.atan2(dy, dx) * (180 / Math.PI) : ellAngle;
          const stretch = Math.min(speed / SPEED_SATURATE, 1) * MAX_STRETCH;
          ellAngle = shortAngleLerp(ellAngle, angleTarget, ELLIPSE_LERP);
          ellScaleX += (1 + stretch - ellScaleX) * ELLIPSE_LERP;
          ellScaleY += (1 - stretch * 0.45 - ellScaleY) * ELLIPSE_LERP;
          ellipse.style.transform = 'translate(' + ptrX + 'px,' + ptrY + 'px) rotate(' + ellAngle + 'deg) scale(' + ellScaleX + ',' + ellScaleY + ')';
          rafId = requestAnimationFrame(step);
        }
        function startLoop() { if (!rafId) rafId = requestAnimationFrame(step); }
        function stopLoop() { if (rafId) { cancelAnimationFrame(rafId); rafId = null; } }
        function hideAll() { dot.classList.remove('visible'); ellipse.classList.remove('visible'); document.body.classList.remove('write-native-cursor','custom-cursor-active'); stopLoop(); }
        window.addEventListener('mousemove', (e) => {
          const overNative = !!(e.target && e.target.nodeType===1 && e.target.closest(NATIVE_SELECTOR));
          document.body.classList.add('custom-cursor-active');
          document.body.classList.toggle('write-native-cursor', overNative);
          ptrX = e.clientX; ptrY = e.clientY;
          dot.style.transform = 'translate(' + ptrX + 'px,' + ptrY + 'px)';
          dot.classList.add('visible');
          ellipse.classList.add('visible');
          startLoop();
        });
        document.addEventListener('mouseleave', hideAll);
      })();

      // ── Appearance dropdown ──────────────────────────────────
      function setupAppearanceDropdown() {
        const trigger = document.getElementById('appearanceTrigger');
        const dropdown = document.getElementById('appearanceDropdown');
        const wrapper = document.querySelector('.topbar-appearance-wrapper');
        if (!trigger || !dropdown) return;

        const scales = ['xxl','xl','l','m','s'];
        const fonts = ['satoshi','serif'];
        const labelMap = { satoshi: 'Sat', serif: 'Ser' };
        const scaleMap = { s: 'S', m: 'M', l: 'L', xl: 'XL', xxl: 'XXL' };

        function renderMenu() {
          const currentFont = document.body.getAttribute('data-font') || 'satoshi';
          const currentScale = document.body.getAttribute('data-scale') || 'xl';
          dropdown.innerHTML = '';
          fonts.forEach(font => {
            scales.forEach(scale => {
              const item = document.createElement('button');
              item.className = 'menu-item';
              const isActive = font === currentFont && scale === currentScale;
              if (isActive) item.classList.add('active');
              item.textContent = `${labelMap[font]} ${scaleMap[scale]}`;
              item.dataset.font = font; item.dataset.scale = scale;
              item.addEventListener('click', (e) => {
                e.stopPropagation();
                document.body.setAttribute('data-font', font);
                document.body.setAttribute('data-scale', scale);
                renderMenu();
                dropdown.classList.remove('open');
              });
              dropdown.appendChild(item);
            });
          });
        }

        trigger.addEventListener('click', (e) => {
          e.stopPropagation();
          const isOpen = dropdown.classList.contains('open');
          document.querySelectorAll('.topbar-appearance-dropdown.open').forEach(d => d.classList.remove('open'));
          if (!isOpen) { renderMenu(); dropdown.classList.add('open'); positionFloatingPanel(dropdown, trigger, { align: 'right' }); }
          else dropdown.classList.remove('open');
        });
        document.addEventListener('click', (e) => {
          if (wrapper && !wrapper.contains(e.target)) dropdown.classList.remove('open');
        });
      }

                <div class="cs-unf-heading">Who was actually leading</div>
                <p class="cs-unf-text">The case study calls it a "UX leadership engagement delivered via Publicis Sapient." Here's what the org chart actually looked like in practice:</p>
                <div class="cs-callout">The official lead — a former Director of UX at the Pentagon — was clandestinely job shopping while on the project. Camera off. Ghosting standups. Unreachable.<br><br>The Program Director, referred to internally as "Coach," openly acknowledged he lacked a design or technical background. Finance knowledge only.<br><br>That left me as the <strong>de facto project lead</strong>: sole proprietor of client relationship, information gathering, and team direction for a months‑long engagement with a major financial services client.</div>

                <p class="cs-unf-text">In the first weeks of the project, I spent several days and nights at the office building something the team didn't have: <strong>a complete inventory of every state and surface of a disconnected product ecosystem</strong> — formatted for team socialization, structured for handoff, usable by anyone who picked it up.</p>
                <p class="cs-unf-text">I came into 375 Hudson specifically to use the whiteboards. Mapping a system of this complexity in my head at home wasn't productive for team work. I lived down the street. It cost me nothing but sleep. <strong>I regularly stayed until 2am.</strong></p>
                <div class="cs-callout">As part of that effort, I also proposed conceptual dashboard concepts — hypothetical visualizations showing a format wholly different from the dev‑designed, table‑based structure that existed across every product domain.<br><br>The inventory became the project's connective tissue. The dashboard concepts eventually found their way into the final product.<br><br>HR wrote me up for staying after business hours. Leadership wrote me up for "going rogue."</div>
                <p class="cs-unf-text">Six months in, a PhD‑holding product lead was brought in and promoted to Director. He rejected my handoff. Removed me from all client‑facing meetings. Presented the data and design work as his own. My junior and associate designers privately expressed fear of being fired. They weren't wrong to be afraid.</p>

      // ── Init ──────────────────────────────────────────────────
      letterData = getDefaultLetterData();

      document.addEventListener('DOMContentLoaded', function() {
        setupViewportBlur();
        setupAppearanceDropdown();

        renderTrack();

        // ── HUD events ──
        document.getElementById('hudPrev').addEventListener('click', () => activatePanel(activeIndex - 1));
        document.getElementById('hudNext').addEventListener('click', () => activatePanel(activeIndex + 1));
        document.getElementById('letterHotspotPrev').addEventListener('click', () => activatePanel(activeIndex - 1));
        document.getElementById('letterHotspotNext').addEventListener('click', () => activatePanel(activeIndex + 1));

        // ── Index jump links ──
        document.addEventListener('click', function(e) {
          const link = closestSafe(e.target, '.idx-row');
          if (link && link.dataset.jump !== undefined) {
            e.preventDefault();
            const idx = parseInt(link.dataset.jump);
            if (!isNaN(idx) && idx >= 0 && idx < letterData.length) activatePanel(idx);
          }
        });

        // ── Track drag ──
        const track = document.getElementById('lettersTrack');
        let isDragging = false, dragStartX = 0, dragStartScroll = 0;
        track.addEventListener('pointerdown', (e) => {
          if (e.pointerType === 'touch') return;
          if (closestSafe(e.target, 'button, a, input')) return;
          isDragging = true;
          dragStartX = e.clientX;
          dragStartScroll = track.scrollLeft;
          track.classList.add('dragging');
          track.setPointerCapture(e.pointerId);
        });
        track.addEventListener('pointermove', (e) => {
          if (!isDragging) return;
          track.scrollLeft = dragStartScroll - (e.clientX - dragStartX);
        });
        track.addEventListener('pointerup', () => { isDragging = false; track.classList.remove('dragging'); });
        track.addEventListener('pointercancel', () => { isDragging = false; track.classList.remove('dragging'); });

        // ── Scroll settle ──
        let settleTimer = null;
        track.addEventListener('scroll', () => {
          clearTimeout(settleTimer);
          settleTimer = setTimeout(() => {
            const rect = track.getBoundingClientRect();
            const centerX = rect.left + rect.width/2;
            let best=0, bestDist=Infinity;
            Array.from(track.children).forEach((panel, i) => {
              const r = panel.getBoundingClientRect();
              const c = r.left + r.width/2;
              const d = Math.abs(c - centerX);
              if (d < bestDist) { bestDist = d; best = i; }
            });
            if (best !== activeIndex) {
              const panels = track.querySelectorAll('.letter-panel');
              panels.forEach(p => p.classList.remove('active'));
              activeIndex = best;
              panels[best].classList.add('active');
              renderLetter(activeIndex);
              updateProgressBar();
              const counter = document.getElementById('hudNavCounter');
              if (counter) counter.textContent = `${activeIndex+1}/${letterData.length}`;
            } else updateProgressBar();
          }, 150);
        }, { passive: true });

        // ── Keyboard nav ──
        document.addEventListener('keydown', (e) => {
          if (e.key === 'ArrowLeft') { activatePanel(activeIndex - 1); e.preventDefault(); }
          if (e.key === 'ArrowRight') { activatePanel(activeIndex + 1); e.preventDefault(); }
          if (e.key === 'Escape') {
            const drop = document.getElementById('appearanceDropdown');
            if (drop.classList.contains('open')) drop.classList.remove('open');
          }
        });

        // Update sample count
        const countEl = document.getElementById('sampleCount');
        if (countEl) countEl.textContent = String(letterData.length);

        // ── Update HUD status ──
        const statusCount = document.getElementById('hudStatusCount');
        if (statusCount) statusCount.textContent = String(letterData.length);
        const statusText = document.getElementById('hudStatusText');
        if (statusText) statusText.textContent = `${letterData.length} letters`;
      });
    })();
  </script>
