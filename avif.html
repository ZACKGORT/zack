<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>AVIF Media Tool · Craft</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 80'%3E%3Crect width='80' height='80' rx='12' fill='%23E5E567'/%3E%3Ctext x='40' y='50' font-family='system-ui, -apple-system, sans-serif' font-size='28' font-weight='800' text-anchor='middle' fill='%231C1C1E' letter-spacing='-0.5'%3EAVIF%3C/text%3E%3C/svg%3E" />
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@1,2,3,4,5,6,7,8,9&display=swap" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js">
    </script>
    <style>
        /* ── design system ── */
        :root {
            --bg: #f0f0f2;
            --card: #ffffff;
            --card-dark: #1c1c1e;
            --accent: #e5e567;
            --accent-2: #f5f557;
            --ink: #1c1c1e;
            --ink-mid: #3a3a3c;
            --ink-light: #8e8e93;
            --ink-lighter: #b0b0b6;
            --border: #e6e6e8;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.04);
            --shadow-hover: 0 16px 40px rgba(0, 0, 0, 0.08), 0 4px 12px rgba(0, 0, 0, 0.02);
            --shadow-floating: 0 8px 32px rgba(0, 0, 0, 0.1);
            --radius: 1.5rem;
            --radius-sm: 0.65rem;
            --font: 'Satoshi', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --font-mono: 'JetBrains Mono', 'IBM Plex Mono', monospace;
            --fs-body: 15px;
            --max-width: 1600px;
            --margin: 16px;
            --topbar-height: 56px;
            --hud-height: 64px;
            --scrollbar-height: 3px;
        }
        @media (min-width:640px) {
            :root {
                --margin: 24px;
                --topbar-height: 64px;
                --hud-height: 70px;
            }
        }
        @media (min-width:1024px) {
            :root {
                --margin: 32px;
                --topbar-height: 72px;
                --hud-height: 76px;
            }
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html {
            -webkit-text-size-adjust: 100%;
        }
        body {
            background: var(--bg);
            color: var(--ink);
            font-family: var(--font);
            font-size: var(--fs-body);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            padding-bottom: calc(var(--hud-height) + 20px + var(--scrollbar-height));
            overflow-x: hidden;
        }
        ::selection {
            background: var(--accent);
            color: var(--ink);
        }
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--ink-lighter);
            border-radius: var(--radius-sm);
        }
        html {
            scrollbar-width: thin;
            scrollbar-color: var(--ink-lighter) transparent;
        }

        .btn {
            font-family: var(--font-mono);
            font-size: 8px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--ink-mid);
            padding: 5px 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            border-radius: var(--radius-sm);
            font-weight: 500;
            touch-action: manipulation;
            min-height: 30px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            gap: 6px;
        }
        .btn:hover {
            background: var(--ink);
            color: var(--card);
            border-color: var(--ink);
        }
        .btn:active {
            transform: scale(0.96);
        }
        .btn-primary {
            background: var(--ink);
            color: var(--card);
            border-color: var(--ink);
        }
        .btn-primary:hover {
            background: var(--ink-mid);
            border-color: var(--ink-mid);
        }
        .btn-danger {
            background: #d43a3a;
            color: #fff;
            border-color: #d43a3a;
        }
        .btn-danger:hover {
            background: #a00;
            border-color: #a00;
        }
        .btn-success {
            background: #2e7d32;
            color: #fff;
            border-color: #2e7d32;
        }
        .btn-success:hover {
            background: #1b5e20;
            border-color: #1b5e20;
        }
        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }
        .btn-icon {
            width: 30px;
            padding: 0;
            justify-content: center;
            font-size: 14px;
        }
        .btn-ghost {
            background: transparent;
            border-color: transparent;
            color: var(--ink-light);
        }
        .btn-ghost:hover {
            background: var(--bg);
            border-color: var(--border);
            color: var(--ink);
        }

        /* ── topbar ── */
        .topbar {
            position: sticky;
            top: 0;
            z-index: 150;
            background: transparent;
            padding: 6px 0;
            min-height: var(--topbar-height);
            display: flex;
            align-items: center;
        }
        .topbar .wrap {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 0 var(--margin);
            max-width: var(--max-width);
            margin: 0 auto;
            width: 100%;
        }
        .wordmark {
            font-family: var(--font);
            font-size: clamp(12px, 3.5vw, 20px);
            font-weight: 700;
            letter-spacing: -0.03em;
            display: flex;
            align-items: baseline;
            gap: 6px;
            color: var(--ink);
            flex-shrink: 0;
        }
        .wordmark .count {
            font-family: var(--font-mono);
            font-size: 8px;
            font-weight: 400;
            color: var(--ink-light);
            letter-spacing: 0.04em;
        }
        .topbar-right {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }
        .topbar-right .btn {
            font-size: 9px;
            min-height: 32px;
            padding: 4px 10px;
        }

        /* ── viewport blur ── */
        .viewport-blur {
            position: fixed;
            left: 0;
            right: 0;
            z-index: 40;
            pointer-events: none;
            backdrop-filter: blur(0px);
            -webkit-backdrop-filter: blur(0px);
            transition: backdrop-filter 0.3s ease, background 0.4s ease;
        }
        .viewport-blur.scrolling {
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(8px);
        }
        .viewport-blur-top {
            top: 0;
            height: calc(var(--topbar-height) + 36px);
            background: linear-gradient(to bottom, rgba(240, 240, 242, 0.7), rgba(240, 240, 242, 0));
            mask-image: linear-gradient(to bottom, black 0%, black 60%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, black 0%, black 60%, transparent 100%);
        }
        .viewport-blur-bottom {
            bottom: 0;
            height: calc(var(--hud-height) + 60px);
            background: linear-gradient(to top, rgba(240, 240, 242, 0.7), rgba(240, 240, 242, 0));
            mask-image: linear-gradient(to top, black 0%, black 45%, transparent 100%);
            -webkit-mask-image: linear-gradient(to top, black 0%, black 45%, transparent 100%);
        }

        /* ── carousel ── */
        .letters-viewport {
            position: relative;
            overflow: hidden;
            width: 100vw;
            left: 50%;
            margin-left: -50vw;
        }
        .letters-track {
            display: flex;
            align-items: flex-start;
            gap: 22px;
            padding-top: clamp(20px, 4vh, 60px);
            padding-bottom: 60px;
            padding-left: max(4vw, calc(50% - 520px));
            padding-right: max(4vw, calc(50% - 520px));
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            cursor: grab;
            user-select: none;
            box-sizing: border-box;
        }
        .letters-track.dragging {
            cursor: grabbing;
            scroll-snap-type: none;
            scroll-behavior: auto;
        }
        .letter-panel {
            flex: 0 0 auto;
            width: min(92vw, 1000px);
            max-width: 1000px;
            scroll-snap-align: center;
            box-sizing: border-box;
            opacity: 0.35;
            transition: opacity 0.3s ease, transform 0.3s ease;
            cursor: pointer;
        }
        .letter-panel.active {
            opacity: 1;
            cursor: auto;
            transform: scale(1);
        }
        .letter-hotspot {
            position: absolute;
            top: 0;
            bottom: 0;
            width: clamp(56px, 9vw, 180px);
            z-index: 20;
        }
        .letter-hotspot-prev {
            left: 0;
            cursor: url('data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%2744%27%20height%3D%2744%27%3E%3Ccircle%20cx%3D%2722%27%20cy%3D%2722%27%20r%3D%2720%27%20fill%3D%27rgba%2820%2C20%2C20%2C0.55%29%27/%3E%3Cpath%20d%3D%27M26%2012%20L16%2022%20L26%2032%27%20fill%3D%27none%27%20stroke%3D%27white%27%20stroke-width%3D%273%27%20stroke-linecap%3D%27round%27%20stroke-linejoin%3D%27round%27/%3E%3C/svg%3E') 22 22, w-resize;
        }
        .letter-hotspot-next {
            right: 0;
            cursor: url('data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%2744%27%20height%3D%2744%27%3E%3Ccircle%20cx%3D%2722%27%20cy%3D%2722%27%20r%3D%2720%27%20fill%3D%27rgba%2820%2C20%2C20%2C0.55%29%27/%3E%3Cpath%20d%3D%27M18%2012%20L28%2022%20L18%2032%27%20fill%3D%27none%27%20stroke%3D%27white%27%20stroke-width%3D%273%27%20stroke-linecap%3D%27round%27%20stroke-linejoin%3D%27round%27/%3E%3C/svg%3E') 22 22, e-resize;
        }

        .letter-card-frame {
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 28px clamp(20px, 3vw, 36px) 40px;
            background: var(--card);
            box-shadow: var(--shadow);
            transition: box-shadow 0.3s ease, transform 0.3s ease;
            position: relative;
        }
        .letter-panel.active .letter-card-frame {
            box-shadow: var(--shadow-hover);
        }
        .letter-cover {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-bottom: 18px;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border);
        }
        .letter-cover-kicker {
            font-family: var(--font-mono);
            font-size: 9px;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--ink-light);
        }
        .letter-cover-name {
            font-family: var(--font);
            font-size: clamp(22px, 3vw, 34px);
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--ink);
        }
        .letter-cover-deck {
            font-family: var(--font);
            font-size: clamp(13px, 1vw, 16px);
            line-height: 1.5;
            color: var(--ink-light);
            max-width: 520px;
        }
        .letter-toolbar {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }
        .letter-toolbar .letter-count {
            font-family: var(--font-mono);
            font-size: 8px;
            color: var(--ink-light);
            margin-left: auto;
        }

        /* ── HUD ── */
        .hud {
            --hud-pad: 6px 12px;
            --hud-gap: 4px;
            --hud-min-h: 44px;
            --hud-btn-min-h: 28px;
            --hud-btn-pad: 3px 10px;
            --hud-btn-fs: 7px;
            --hud-divider-h: 24px;
            --hud-fs-count: 7px;
            --hud-pad-count: 1px 6px;
            --hud-minw-count: 18px;
            --hud-fs-label: 6px;
            position: fixed;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow-floating);
            padding: var(--hud-pad);
            display: flex;
            align-items: center;
            gap: var(--hud-gap);
            transition: box-shadow 0.3s ease, padding 0.2s ease;
            min-height: var(--hud-min-h);
            font-family: var(--font-mono);
        }
        .hud:hover {
            box-shadow: var(--shadow-hover);
        }
        .hud-bottom {
            bottom: calc(12px + var(--scrollbar-height));
            --hud-pad: 10px 18px;
            --hud-gap: 6px;
            --hud-min-h: 56px;
            --hud-btn-min-h: 36px;
            --hud-btn-pad: 7px 14px;
            --hud-btn-fs: 11px;
            --hud-divider-h: 30px;
            --hud-fs-count: 10px;
            --hud-pad-count: 2px 8px;
            --hud-minw-count: 22px;
            --hud-fs-label: 9px;
        }
        .hud-top {
            top: calc(var(--topbar-height) + 12px);
            transition: top 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --hud-btn-pad: 5px 10px;
            --hud-btn-fs: 8px;
        }
        .hud-top.docked {
            top: max(24px, env(safe-area-inset-top));
        }
        .hud-divider {
            width: 1px;
            height: var(--hud-divider-h);
            background: var(--border);
            flex-shrink: 0;
            margin: 0 2px;
        }
        .hud .btn {
            min-height: var(--hud-btn-min-h);
            padding: var(--hud-btn-pad);
            font-size: var(--hud-btn-fs);
            border-radius: var(--radius-sm);
        }
        .hud .filter-count {
            background: var(--ink);
            color: var(--card);
            padding: var(--hud-pad-count);
            border-radius: var(--radius-sm);
            font-family: var(--font-mono);
            font-size: var(--hud-fs-count);
            font-weight: 600;
            min-width: var(--hud-minw-count);
            text-align: center;
        }
        .hud .hud-label {
            font-family: var(--font-mono);
            font-size: var(--hud-fs-label);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--ink-light);
            opacity: 0.5;
            margin-right: 2px;
        }
        .hud-nav-counter {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: var(--ink);
            color: var(--card);
            padding: var(--hud-pad-count);
            border-radius: var(--radius-sm);
            font-family: var(--font-mono);
            font-size: var(--hud-fs-count);
            font-weight: 600;
            min-width: var(--hud-minw-count);
            text-align: center;
        }
        @media (max-width:640px) {
            .hud-bottom {
                bottom: calc(10px + var(--scrollbar-height));
                --hud-pad: 8px 12px;
                --hud-min-h: 48px;
                --hud-btn-min-h: 30px;
                --hud-btn-pad: 5px 10px;
                --hud-btn-fs: 9px;
                --hud-divider-h: 22px;
                --hud-fs-count: 9px;
                --hud-pad-count: 2px 6px;
                --hud-minw-count: 18px;
                --hud-fs-label: 9px;
            }
            .hud-top {
                top: calc(var(--topbar-height) + 8px);
                --hud-pad: 4px 8px;
                --hud-gap: 3px;
                --hud-min-h: 38px;
                --hud-btn-min-h: 30px;
                --hud-btn-pad: 4px 8px;
                --hud-btn-fs: 7px;
                --hud-divider-h: 16px;
            }
            .hud {
                border-radius: var(--radius-sm);
            }
            .hud .hud-label {
                display: none;
            }
        }
        @media (max-width:480px) {
            .hud-bottom {
                bottom: calc(8px + var(--scrollbar-height));
                --hud-pad: 6px 10px;
                --hud-gap: 3px;
                --hud-min-h: 42px;
                --hud-btn-min-h: 26px;
                --hud-btn-pad: 4px 8px;
                --hud-btn-fs: 8px;
                --hud-divider-h: 18px;
            }
            .hud-top {
                top: calc(var(--topbar-height) + 6px);
                --hud-pad: 3px 6px;
                --hud-gap: 2px;
                --hud-min-h: 34px;
                --hud-btn-min-h: 28px;
                --hud-btn-pad: 3px 6px;
                --hud-btn-fs: 6px;
                --hud-divider-h: 14px;
            }
        }

        /* ── scroll progress ── */
        .scroll-progress-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: var(--scrollbar-height);
            background: rgba(0, 0, 0, 0.06);
            z-index: 150;
            pointer-events: none;
        }
        .scroll-progress-fill {
            height: 100%;
            width: 0%;
            background: var(--accent);
            transition: width 0.1s ease;
            border-radius: 0 2px 2px 0;
        }
        .scroll-progress-fill.dim {
            opacity: 0.5;
        }

        /* ── custom cursor ── */
        body.custom-cursor-active {
            cursor: none;
        }
        .write-cursor-dot,
        .write-cursor-ellipse {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 500;
            pointer-events: none;
            transform: translate(-9999px, -9999px);
            opacity: 0;
            transition: opacity 0.18s ease;
            will-change: transform;
        }
        .write-cursor-dot.visible,
        .write-cursor-ellipse.visible {
            opacity: 1;
        }
        .write-cursor-dot {
            width: 6px;
            height: 6px;
            margin: -3px 0 0 -3px;
            border-radius: 50%;
            background: var(--ink);
        }
        .write-cursor-ellipse {
            width: 34px;
            height: 34px;
            margin: -17px 0 0 -17px;
            border: 1.5px solid var(--ink);
            border-radius: 50%;
            opacity: 0;
        }
        .write-cursor-ellipse.visible {
            opacity: 0.32;
        }
        body.custom-cursor-active.write-native-cursor {
            cursor: auto;
        }
        .write-native-cursor .write-cursor-dot,
        .write-native-cursor .write-cursor-ellipse {
            opacity: 0 !important;
        }

        /* ── rollout modal ── */
        .bento-overlay.rollout {
            position: fixed;
            inset: 0;
            z-index: 400;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: flex-start;
            justify-content: flex-end;
            padding: calc(var(--topbar-height) + 12px) 16px 16px 0;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }
        .bento-overlay.rollout.open {
            opacity: 1;
            pointer-events: auto;
        }
        .bento-overlay.rollout .bento-panel {
            width: min(480px, calc(100vw - 32px));
            max-height: calc(100vh - var(--topbar-height) - 40px);
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow-floating);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            transform: translateY(-8px) scale(0.98);
            transform-origin: top right;
            opacity: 0;
            transition: transform 0.25s cubic-bezier(0.25, 0.46, 0.45, 0.94), opacity 0.2s ease;
        }
        .bento-overlay.rollout.open .bento-panel {
            transform: translateY(0) scale(1);
            opacity: 1;
        }
        .bento-overlay.rollout .bento-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
        }
        .bento-overlay.rollout .bento-header h2 {
            font-family: var(--font);
            font-size: calc(var(--fs-body) * 1.4);
            font-weight: 700;
            letter-spacing: -0.02em;
            margin: 0;
        }
        .bento-overlay.rollout .bento-header .close-btn {
            background: transparent;
            border: 1px solid var(--border);
            width: 36px;
            height: 36px;
            font-size: 16px;
            border-radius: 50%;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .bento-overlay.rollout .bento-header .close-btn:hover {
            background: var(--ink);
            color: var(--card);
        }
        .bento-overlay.rollout .bento-body {
            overflow-y: auto;
            flex: 1;
        }
        .bento-overlay.rollout .bento-body table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.7rem;
        }
        .bento-overlay.rollout .bento-body th {
            text-align: left;
            padding: 0.3rem 0.4rem;
            color: var(--ink-light);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            background: var(--card);
        }
        .bento-overlay.rollout .bento-body td {
            padding: 0.3rem 0.4rem;
            border-bottom: 1px solid var(--border);
            word-break: break-all;
        }
        .bento-overlay.rollout .bento-body .url {
            max-width: 180px;
            display: inline-block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: var(--ink-mid);
        }
        .bento-overlay.rollout .bento-body .badge {
            font-family: var(--font-mono);
            font-size: 0.55rem;
            color: var(--ink-light);
            background: var(--bg);
            padding: 0 4px;

</head>
<body>

    <!-- ─── CURSOR ─── -->
    <div class="write-cursor-ellipse" id="writeCursorEllipse" aria-hidden="true"></div>
    <div class="write-cursor-dot" id="writeCursorDot" aria-hidden="true"></div>

    <!-- ─── SCROLL PROGRESS ─── -->
    <div class="scroll-progress-bar" id="scrollProgressBar" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
        <div class="scroll-progress-fill" id="scrollProgressFill"></div>
    </div>

    <!-- ─── VIEWPORT BLUR ─── -->
    <div class="viewport-blur viewport-blur-top" id="viewportBlurTop" aria-hidden="true"></div>
    <div class="viewport-blur viewport-blur-bottom" id="viewportBlurBottom" aria-hidden="true"></div>

    <!-- ─── CONVERSION OVERLAY ─── -->
    <div class="conversion-overlay" id="conversionOverlay">
        <div class="box">
            <div class="spinner-big" id="overlaySpinner"></div>
            <h3 id="overlayTitle">Converting…</h3>
            <p id="overlayStatus">Starting…</p>
            <div class="progress-text" id="overlayProgressText">0%</div>
            <div class="progress-track"><div class="progress-fill" id="overlayProgressFill"></div></div>
            <div class="btn-group">
                <button class="cancel-btn" id="overlayCancelBtn">⏹ Cancel</button>
                <button class="download-btn hidden" id="overlayDownloadBtn">⬇ Download ZIP</button>
            </div>
        </div>
    </div>

    <!-- ─── TOPBAR ─── -->
    <div class="topbar">
        <div class="wrap">
            <div class="wordmark">
                <span>Media Tools</span>
                <span class="count" id="topCount">◈</span>
            </div>
            <div class="topbar-right">
                <button class="btn" id="topResetBtn">↺ Reset</button>
            </div>
        </div>
    </div>

    <!-- ─── TOP HUD ─── -->
    <div class="hud hud-top" id="hudTop">
        <button class="btn btn-icon" id="hudPrev">‹</button>
        <span class="hud-nav-counter" id="hudNavCounter">1/2</span>
        <button class="btn btn-icon" id="hudNext">›</button>
        <div class="hud-divider"></div>
        <span class="hud-label">Assets</span>
        <span class="filter-count" id="hudStatusCount">0</span>
        <span style="font-size:0.75rem;color:var(--ink-light);" id="hudStatusText">No images loaded</span>
    </div>

    <div class="wrap">
        <div class="letters-viewport" id="lettersViewport">
            <div class="letters-track" id="lettersTrack"></div>
            <div class="letter-hotspot letter-hotspot-prev" id="letterHotspotPrev" aria-hidden="true" tabindex="-1"></div>
            <div class="letter-hotspot letter-hotspot-next" id="letterHotspotNext" aria-hidden="true" tabindex="-1"></div>
        </div>
    </div>

    <!-- ─── BOTTOM HUD ─── -->
    <div class="hud hud-bottom" id="hud">
        <span class="hud-label">Jump</span>
        <button class="btn" id="hudJumpMedia">📁 Media</button>
        <button class="btn" id="hudJumpConverter">⚡ Convert</button>
        <div class="hud-divider"></div>
        <span style="font-size:0.75rem;color:var(--ink-light);" id="hudBottomStatus">Ready</span>
    </div>

    <!-- ─── MAPPING MODALS ─── -->
    <div class="bento-overlay rollout" id="converterMappingModal">
        <div class="bento-panel">
            <div class="bento-header"><h2>📋 Old → New Mapping</h2><button class="close-btn" id="converterMappingClose">✕</button></div>
            <div class="bento-body" id="converterMappingBody"><p style="color:var(--ink-light);padding:1rem 0;">No data loaded.</p></div>
        </div>
    </div>

    <div class="bento-overlay rollout" id="mediaMappingModal">
        <div class="bento-panel">
            <div class="bento-header"><h2>📋 Old → New Name Mapping</h2><button class="close-btn" id="mediaMappingClose">✕</button></div>
            <div class="bento-body" id="mediaMappingBody"><p style="color:var(--ink-light);padding:1rem 0;">No data loaded.</p></div>
        </div>
    </div>

    <!-- ─── BULK RENAME MODAL ─── -->
    <div class="bento-overlay centered" id="bulkRenameModal">
        <div class="bento-panel">
            <div class="bento-header"><h2>✎ Bulk Rename</h2><button class="close-btn" id="bulkRenameClose">✕</button></div>
            <div class="bento-body">
                <div class="field"><label>Prefix</label><input type="text" id="bulkPrefix" placeholder="my-prefix-" /></div>
                <div class="field"><label>Suffix</label><input type="text" id="bulkSuffix" placeholder="-v2" /></div>
                <div class="field"><label>Find</label><input type="text" id="bulkFind" placeholder="old-name" /></div>
                <div class="field"><label>Replace</label><input type="text" id="bulkReplace" placeholder="new-name" /></div>
                <div class="bulk-preview" id="bulkPreview"><div style="color:var(--ink-light);font-style:italic;">Preview will appear here</div></div>
            </div>
            <div class="bento-actions">
                <button class="btn btn-ghost" id="bulkRenameCancel">Cancel</button>
                <button class="btn btn-primary" id="bulkRenameApply">Apply</button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ── Helpers ──────────────────────────────────────────────
            const escapeHtml = (s) => (s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;',
                '"': '&quot;', "'": '&#39;' })[c]);
            const closestSafe = (node, selector) => node && node.nodeType === 1 && node.closest ? node.closest(
            selector) : null;

            function positionRolloutPanel(overlayId, trigger) {
                const overlay = document.getElementById(overlayId);
                const panel = overlay && overlay.querySelector('.bento-panel');
                if (!panel) return;
                if (window.innerWidth > 480) {
                    const tr = trigger.getBoundingClientRect();
                    const pw = panel.offsetWidth || 480;
                    const top = Math.max(10, Math.min(tr.bottom + 8, window.innerHeight - panel.offsetHeight - 10));
                    const left = Math.max(10, Math.min(tr.right - pw, window.innerWidth - pw - 10));
                    panel.style.position = 'fixed';
                    panel.style.top = top + 'px';
                    panel.style.left = left + 'px';
                    panel.style.right = 'auto';
                    panel.style.bottom = 'auto';
                } else {
                    panel.style.position = '';
                    panel.style.top = '';
                    panel.style.left = '';
                    panel.style.right = '';
                    panel.style.bottom = '';
                }
            }

            // ── State ──────────────────────────────────────────────
            let letterData = [];
            let activeIndex = 0;

            const MM_LS_KEY = 'media_rename_map';
            const MM_URLS_KEY = 'media_urls';

            let mmUrls = [];
            let mmRenameMap = {};
            let mmCurrentType = 'all';
            let mmCurrentSource = 'all';

            let convRows = [];
            let convIsConverting = false;
            let convCancelRequested = false;
            let convStartTime = 0;
            let convTimerInterval = null;
            let isConverterInitialized = false;
            let convQuality = 0.5;
            let lastZipBlob = null;

            function loadUrls() {
                try {
                    const raw = localStorage.getItem(MM_URLS_KEY);
                    if (raw) { const p = JSON.parse(raw); if (Array.isArray(p) && p.length) { mmUrls = p; return; } }
                } catch {}
                mmUrls = [];
            }

            function saveUrls() { try { localStorage.setItem(MM_URLS_KEY, JSON.stringify(mmUrls)); } catch {} }

            function loadMmMapping() {
                try { const raw = localStorage.getItem(MM_LS_KEY);
                    mmRenameMap = raw ? JSON.parse(raw) : {}; } catch { mmRenameMap = {}; }
            }

            function saveMmMapping() { try { localStorage.setItem(MM_LS_KEY, JSON.stringify(mmRenameMap)); } catch {} }
            loadMmMapping();
            loadUrls();

            const isVideo = (u) => /\.(mp4|mov|webm)(\?.*)?$/i.test(u);
            const isImage = (u) => !isVideo(u);
            const getDomain = (u) => { try { return new URL(u).hostname; } catch { return 'unknown'; } };
            const getBaseName = (u) => {
                try {
                    const path = new URL(u).pathname;
                    let n = path.split('/').pop().split('?')[0];
                    const d = n.lastIndexOf('.');
                    if (d > 0) n = n.slice(0, d);
                    try { n = decodeURIComponent(n); } catch {}
                    n = n.replace(/[^a-zA-Z0-9-_]/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '');
                    return n || 'asset';
                } catch { return 'asset'; }
            };

            function clearAllImages() {
                mmUrls = [];
                mmRenameMap = {};
                saveMmMapping();
                saveUrls();
                renderMediaLetter();
                syncConverterFromMedia();
                updateHudStatus();
            }

            function updateHudStatus() {
                const c = document.getElementById('hudStatusCount');
                const t = document.getElementById('hudStatusText');
                const img = mmUrls.filter(u => isImage(u)).length;
                if (c) c.textContent = img;
                if (t) t.textContent = img > 0 ? `${img} images ready` : 'No images loaded';
                const b = document.getElementById('hudBottomStatus');
                if (b) b.textContent = img > 0 ? `${img} images ready` : 'No images';
            }

            function syncConverterFromMedia() {
                convRows = mmUrls.map(url => ({
                    url,
                    originalName: getBaseName(url),
                    newName: mmRenameMap[url] || getBaseName(url),
                    type: isVideo(url) ? 'video' : 'image',
                    status: 'pending',
                    progress: 0
                }));
                if (isConverterInitialized) {
                    renderConvTable();
                    convClearLog();
                    const imgC = convRows.filter(r => r.type === 'image').length;
                    convLog(`🔄 Synced ${convRows.length} assets (${imgC} images)`, 'info');
                    const cb = document.getElementById('convConvertBtn');
                    if (cb) cb.disabled = (imgC === 0 || convIsConverting);
                }
                const imgC = convRows.filter(r => r.type === 'image').length;
                const c = document.getElementById('hudStatusCount');
                if (c) c.textContent = imgC;
                const t = document.getElementById('hudStatusText');
                if (t) t.textContent = `${imgC} images ready`;
            }

            function parseCSV(text) {
                let clean = text.replace(/^\uFEFF/, '').replace(/\r\n/g, '\n').replace(/\r/g, '\n');
                const lines = clean.split('\n').filter(l => l.trim() !== '');
                if (lines.length < 2) return [];
                const header = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, ''));
                const urlIdx = header.indexOf('Original URL');
                const origIdx = header.indexOf('Original Filename');
                const newIdx = header.indexOf('New Filename (no ext)');
                if (urlIdx === -1 || newIdx === -1) return [];
                const result = [];
                for (let i = 1; i < lines.length; i++) {
                    const line = lines[i];
                    const cols = [];
                    let inQuotes = false,
                        cur = '';
                    for (let ch of line) {
                        if (ch === '"') { inQuotes = !inQuotes; continue; }
                        if (ch === ',' && !inQuotes) { cols.push(cur.trim());
                            cur = ''; continue; }
                        cur += ch;
                    }
                    cols.push(cur.trim());
                    if (cols.length <= Math.max(urlIdx, newIdx)) continue;
                    const url = cols[urlIdx].replace(/^"|"$/g, '').trim();
                    const newName = cols[newIdx].replace(/^"|"$/g, '').trim();
                    if (!url || !newName) continue;
                    result.push({
                        url,
                        originalName: cols[origIdx] ? cols[origIdx].replace(/^"|"$/g, '').trim() : '',
                        newName,
                        type: isVideo(url) ? 'video' : 'image',
                        status: 'pending',
                        progress: 0
                    });
                }
                return result;
            }

            function loadCsvData(text) {
                const parsed = parseCSV(text);
                if (parsed.length === 0) {
                    alert(
                        'No valid rows found.\nMake sure your CSV has "Original URL" and "New Filename (no ext)" columns.'
                        );
                    return false;
                }
                convRows = parsed;
                renderConvTable();
                convClearLog();
                const imgC = convRows.filter(r => r.type === 'image').length;
                convLog(`📋 Loaded ${convRows.length} entries (${imgC} images, ${convRows.length - imgC} videos)`, 'info');
                const cb = document.getElementById('convConvertBtn');
                if (cb) cb.disabled = (imgC === 0 || convIsConverting);
                const c = document.getElementById('hudStatusCount');
                if (c) c.textContent = imgC;
                const t = document.getElementById('hudStatusText');
                if (t) t.textContent = `${imgC} images ready`;
                return true;
            }

            function exportMediaCsv() {
                if (mmUrls.length === 0) { alert('No images to export.'); return; }
                let csv = 'Original URL,Original Filename,New Filename (no ext),New Filename (.avif)\n';
                mmUrls.forEach(url => {
                    const base = getBaseName(url);
                    const newName = mmRenameMap[url] || base;
                    csv += `"${url}","${base}","${newName}","${newName}.avif"\n`;
                });
                const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                saveAs(blob, 'media-rename-map.csv');
            }

            // ── Render Media Manager ────────────────────────────────
            function renderMediaLetter() {
                const panel = document.querySelector('.letter-panel[data-letter="media"]');
                if (!panel) return;
                const content = panel.querySelector('.letter-content');
                if (!content) return;

                const filtered = mmUrls.filter(url => {
                    if (mmCurrentType === 'image' && !isImage(url)) return false;
                    if (mmCurrentType === 'video' && !isVideo(url)) return false;
                    if (mmCurrentSource !== 'all' && getDomain(url) !== mmCurrentSource) return false;
                    return true;
                });

                const total = mmUrls.length,
                    images = mmUrls.filter(u => isImage(u)),
                    videos = mmUrls.filter(u => isVideo(u));

                let html = `
              <div class="mm-upload-area" id="mmUploadArea">
                <div style="font-size:1.2rem;margin-bottom:0.2rem;">📤 Load assets</div>
                <div class="hint">Paste URLs (one per line) or upload a .txt / .csv file</div>
                <textarea id="mmUrlInput" placeholder="https://example.com/image1.jpg\nhttps://example.com/image2.png\n..."></textarea>
                <div class="upload-actions">
                  <button class="btn btn-primary" id="mmLoadBtn">Load assets</button>
                  <button class="btn" id="mmFileBtn">📂 Upload file</button>
                  <input type="file" id="mmFileInput" accept=".txt,.csv" />
                  <span class="badge-count" id="mmUrlCount">${total} loaded</span>
                </div>
              </div>
              <div class="mm-stats">
                <div class="badge">📊 Total: <span>${total}</span></div>
                <div class="badge">🖼️ Images: <span>${images.length}</span></div>
                <div class="badge">🎬 Videos: <span>${videos.length}</span></div>
              </div>
              <div class="csv-export-row">
                <span class="label">📋 Export CSV</span>
                <button class="btn btn-success" id="mmExportCsvBtn">⬇ Download CSV</button>
                <span style="font-size:0.6rem;color:var(--ink-light);">(includes all URLs + rename mappings)</span>
              </div>
              <div class="mm-filter-group">
                <span class="label">Type</span>
                <button class="${mmCurrentType === 'all' ? 'active' : ''}" data-mm-type="all">All</button>
                <button class="${mmCurrentType === 'image' ? 'active' : ''}" data-mm-type="image">Images</button>
                <button class="${mmCurrentType === 'video' ? 'active' : ''}" data-mm-type="video">Videos</button>
                <span style="width:0.5rem;"></span>
                <span class="label">Source</span>
                <button class="${mmCurrentSource === 'all' ? 'active' : ''}" data-mm-source="all">All</button>
                <button class="${mmCurrentSource === 'raw.githubusercontent.com' ? 'active' : ''}" data-mm-source="raw.githubusercontent.com">GitHub</button>
              </div>
              <div class="mm-actions">
                <button class="btn" id="mmShowMapping">📋 Mapping</button>
                <button class="btn" id="mmClearNames">✕ Clear renames</button>
                <button class="btn" id="mmBulkRename">✎ Bulk Rename</button>
                <button class="btn btn-ghost" id="mmClearAll">🗑 Clear all</button>
                <button class="btn btn-primary" id="mmSyncConverter">⚡ Send to Converter</button>
              </div>
            `;

                if (total === 0) {
                    html += `<div class="empty-state"><div class="icon">🖼️</div><div class="title">No assets loaded</div>
                <div class="sub">Paste URLs above, upload a file, or drag & drop a CSV.</div></div>`;
                } else if (filtered.length === 0) {
                    html += `<div class="empty-state"><div class="sub">No items match current filters.</div></div>`;
                } else {
                    html += `<div class="mm-grid">`;
                    filtered.forEach(url => {
                        const isV = isVideo(url);
                        const domain = getDomain(url);
                        const type = isV ? 'video' : 'image';
                        const base = getBaseName(url);
                        const newName = mmRenameMap[url] || base;
                        const shortDomain = domain.replace('.medium.com', '').replace('.githubusercontent.com', '');
                        html += `
                  <div class="mm-item" data-url="${escapeHtml(url)}">
                    <button class="mm-delete" data-url="${escapeHtml(url)}">×</button>
                    <div class="mm-media-wrap" data-url="${escapeHtml(url)}" data-type="${type}">
                      ${isV ? `<video src="${escapeHtml(url)}" muted playsinline preload="metadata" controls></video>` :
                        `<img src="${escapeHtml(url)}" loading="lazy" alt="" />`}
                    </div>
                    <div class="mm-info"><span class="type">${type}</span><span class="domain">${escapeHtml(shortDomain)}</span></div>
                    <div class="mm-rename">
                      <label>→</label>
                      <input type="text" value="${escapeHtml(newName)}" placeholder="${escapeHtml(base)}" spellcheck="false" data-url="${escapeHtml(url)}" />
                      <span class="ext-hint">.avif</span>
                    </div>
                  </div>
                `;
                    });
                    html += `</div>`;
                }

                content.innerHTML = html;

                // ── Wire events ──
                const loadBtn = document.getElementById('mmLoadBtn');
                const urlInput = document.getElementById('mmUrlInput');
                const fileBtn = document.getElementById('mmFileBtn');
                const fileInput = document.getElementById('mmFileInput');
                const urlCount = document.getElementById('mmUrlCount');

                if (loadBtn) {
                    loadBtn.addEventListener('click', function() {
                        const text = urlInput.value.trim();
                        if (!text) { alert('Paste some URLs first.'); return; }
                        const lines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l && (l.startsWith(
                            'http://') || l.startsWith('https://')));
                        if (lines.length === 0) { alert('No valid URLs found.'); return; }
                        const existing = new Set(mmUrls);
                        lines.forEach(url => { if (!existing.has(url)) { existing.add(url); } });
                        mmUrls = Array.from(existing);
                        saveUrls();
                        urlInput.value = lines.join('\n');
                        renderMediaLetter();
                        syncConverterFromMedia();
                        updateHudStatus();
                    });
                }
                if (fileBtn) fileBtn.addEventListener('click', () => fileInput.click());
                if (fileInput) {
                    fileInput.addEventListener('change', function(e) {
                        const file = this.files[0];
                        if (!file) return;
                        const reader = new FileReader();
                        reader.onload = function(ev) { urlInput.value = ev.target.result;
                            loadBtn.click(); };
                        reader.readAsText(file);
                        this.value = '';
                    });
                }

                document.querySelectorAll('.mm-filter-group button').forEach(btn => {
                    btn.addEventListener('click', function() {
                        if (this.dataset.mmType) { mmCurrentType = this.dataset.mmType;
                            renderMediaLetter(); }
                        if (this.dataset.mmSource) { mmCurrentSource = this.dataset.mmSource;
                            renderMediaLetter(); }
                    });
                });

                document.querySelectorAll('.mm-rename input').forEach(inp => {
                    inp.addEventListener('input', function() {
                        const url = this.dataset.url;
                        const val = this.value.trim();
                        if (val) mmRenameMap[url] = val;
                        else delete mmRenameMap[url];
                        saveMmMapping();
                        const row = convRows.find(r => r.url === url);
                        if (row) row.newName = mmRenameMap[url] || getBaseName(url);
                    });
                });

                document.querySelectorAll('.mm-media-wrap').forEach(wrap => {
                    wrap.addEventListener('click', function() {
                        openMediaLightbox(this.dataset.url, this.dataset.type);
                    });
                });

                document.querySelectorAll('.mm-delete').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const url = this.dataset.url;
                        if (!url || !confirm('Remove this item?')) return;
                        mmUrls = mmUrls.filter(u => u !== url);
                        delete mmRenameMap[url];
                        saveUrls();
                        saveMmMapping();
                        renderMediaLetter();
                        syncConverterFromMedia();
                        updateHudStatus();
                    });
                });

                const showMap = document.getElementById('mmShowMapping');
                if (showMap) showMap.addEventListener('click', openMediaMappingModal);

                const clearNames = document.getElementById('mmClearNames');
                if (clearNames) {
                    clearNames.addEventListener('click', function() {
                        if (confirm('Clear all custom names?')) { mmRenameMap = {};
                            saveMmMapping();
                            renderMediaLetter();
                            syncConverterFromMedia(); }
                    });
                }

                const clearAll = document.getElementById('mmClearAll');
                if (clearAll) clearAll.addEventListener('click', function() {
                    if (confirm('Remove all assets?')) clearAllImages();
                });

                const bulkBtn = document.getElementById('mmBulkRename');
                if (bulkBtn) bulkBtn.addEventListener('click', openBulkRenameModal);

                const exportBtn = document.getElementById('mmExportCsvBtn');
                if (exportBtn) exportBtn.addEventListener('click', exportMediaCsv);

                const syncBtn = document.getElementById('mmSyncConverter');
                if (syncBtn) {
                    syncBtn.addEventListener('click', function() {
                        syncConverterFromMedia();
                        const idx = letterData.findIndex(d => d.letterId === 'converter');
                        if (idx >= 0) activatePanel(idx);
                    });
                }

                if (urlCount) urlCount.textContent = `${total} loaded`;
                updateHudStatus();
            }

            // ── Bulk Rename ──────────────────────────────────────────
            function openBulkRenameModal() {
                const modal = document.getElementById('bulkRenameModal');
                modal.classList.add('open');
                document.body.style.overflow = 'hidden';
                ['bulkPrefix', 'bulkSuffix', 'bulkFind', 'bulkReplace'].forEach(id => document.getElementById(id).value =
                    '');
                document.getElementById('bulkPreview').innerHTML =
                    '<div style="color:var(--ink-light);font-style:italic;">Preview will appear here</div>';
                ['bulkPrefix', 'bulkSuffix', 'bulkFind', 'bulkReplace'].forEach(id => {
                    document.getElementById(id).addEventListener('input', updateBulkPreview);
                });
                updateBulkPreview();
            }

            function closeBulkRenameModal() {
                document.getElementById('bulkRenameModal').classList.remove('open');
                document.body.style.overflow = '';
            }

            function updateBulkPreview() {
                const prefix = document.getElementById('bulkPrefix').value;
                const suffix = document.getElementById('bulkSuffix').value;
                const find = document.getElementById('bulkFind').value;
                const replace = document.getElementById('bulkReplace').value;
                const el = document.getElementById('bulkPreview');
                const samples = mmUrls.slice(0, 5);
                if (!samples.length) { el.innerHTML =
                    '<div style="color:var(--ink-light);font-style:italic;">No assets to rename.</div>'; return; }
                let html = '';
                samples.forEach(url => {
                    let base = getBaseName(url),
                        n = base;
                    if (find && replace) n = n.replaceAll(find, replace);
                    if (prefix) n = prefix + n;
                    if (suffix) n = n + suffix;
                    html +=
                        `<div class="preview-item"><span>${escapeHtml(base)}</span><span class="arrow">→</span><span>${escapeHtml(n)}</span></div>`;
                });
                if (mmUrls.length > 5) html +=
                    `<div class="preview-item" style="color:var(--ink-light);font-style:italic;">... and ${mmUrls.length - 5} more</div>`;
                el.innerHTML = html;
            }

            function applyBulkRename() {
                const prefix = document.getElementById('bulkPrefix').value;
                const suffix = document.getElementById('bulkSuffix').value;
                const find = document.getElementById('bulkFind').value;
                const replace = document.getElementById('bulkReplace').value;
                if (!prefix && !suffix && !find) { alert('Please enter at least one rename pattern.'); return; }
                mmUrls.forEach(url => {
                    let base = getBaseName(url),
                        n = base;
                    if (find && replace) n = n.replaceAll(find, replace);
                    if (prefix) n = prefix + n;
                    if (suffix) n = n + suffix;

            async function convStartConversion() {
                if (convIsConverting) return;
                const images = convRows.filter(r => r.type === 'image');
                if (!images.length) { alert('No images to convert.'); return; }

                convIsConverting = true;
                convCancelRequested = false;
                lastZipBlob = null;
                convEnableUI(false);
                convClearLog();
                convLog(`🔄 Starting conversion of ${images.length} images…`, 'info');
                document.getElementById('convProgressWrap').classList.add('active');
                convSetProgress(0, 'Starting…');
                convUpdateStatus('⏳ Initializing…');

                const zip = new JSZip();
                let completed = 0,
                    errors = 0;

                const indices = convRows.map((r, i) => r.type === 'image' ? i : -1).filter(i => i >= 0);
                const total = indices.length;

                for (let i = 0; i < indices.length; i++) {
                    if (convCancelRequested) { convLog('⏹️ Cancelled by user.', 'info'); break; }

                    const idx = indices[i];
                    const row = convRows[idx];
                    const pct = (i / total) * 100;
                    convSetProgress(pct, `Processing ${i+1}/${total}: ${row.newName}`);
                    convUpdateStatus(`⬇️ Downloading (${i+1}/${total}): ${row.newName}`);
                    convLog(`⬇️ Downloading ${row.newName}`, 'info');
                    updateConvRowStatus(idx, 'downloading', 10);

                    try {
                        const controller = new AbortController();
                        const signal = controller.signal;
                        const cancelCheck = new Promise((resolve, reject) => {
                            const check = () => {
                                if (convCancelRequested) { controller.abort();
                                    reject(new Error('Cancelled')); } else setTimeout(check, 100);
                            };
                            check();
                        });
                        const response = await Promise.race([fetchWithAbort(row.url, signal), cancelCheck]);
                        const blob = await response.blob();
                        if (convCancelRequested) break;

                        updateConvRowStatus(idx, 'converting', 30);
                        convUpdateStatus(`🔄 Converting (${i+1}/${total}): ${row.newName}`);
                        convLog(`🔄 Converting ${row.newName} to AVIF`, 'info');

                        const avifBlob = await convertBlobToAvif(blob, convQuality);
                        if (convCancelRequested) break;

                        updateConvRowStatus(idx, 'converting', 80);
                        zip.file(row.newName + '.avif', avifBlob);
                        updateConvRowStatus(idx, 'done', 100);
                        convLog(`✅ Added ${row.newName}.avif to ZIP`, 'ok');
                        completed++;

                    } catch (err) {
                        if (err.message === 'Cancelled') { convLog('⏹️ Operation cancelled.', 'info'); break; }
                        convLog(`❌ Error: ${err.message}`, 'err');
                        updateConvRowStatus(idx, 'error', 0);
                        errors++;
                    }
                }

                if (convCancelRequested) convLog('⏹️ Conversion stopped early.', 'info');

                if (zip.files.length > 0) {
                    convSetProgress(100, 'Zipping…');
                    convUpdateStatus('📦 Generating ZIP…');
                    convLog('📦 Generating ZIP file…', 'info');
                    try {
                        const zipBlob = await zip.generateAsync({ type: 'blob' });
                        lastZipBlob = zipBlob;
                        document.getElementById('overlaySpinner').classList.add('hidden');
                        document.getElementById('overlayTitle').textContent = '✅ Conversion complete';
                        document.getElementById('overlayStatus').textContent =
                            `Downloaded ${completed} files${errors ? ' (with errors)' : ''}`;
                        document.getElementById('overlayProgressFill').style.width = '100%';
                        document.getElementById('overlayProgressText').textContent = '100%';
                        document.getElementById('overlayCancelBtn').disabled = true;
                        document.getElementById('overlayDownloadBtn').classList.remove('hidden');
                        const dlBtn = document.getElementById('convDownloadZipBtn');
                        if (dlBtn) {
                            dlBtn.classList.add('visible');
                            dlBtn.style.display = 'inline-flex';
                        }
                        saveAs(zipBlob, 'converted_avif.zip');
                        convLog(`✅ ZIP downloaded with ${completed} files.`, 'ok');
                        if (errors) convLog(`⚠️ ${errors} errors occurred.`, 'err');
                    } catch (err) {
                        convLog(`❌ ZIP error: ${err.message}`, 'err');
                    }
                } else {
                    convLog('⚠️ No files converted. ZIP not created.', 'info');
                    document.getElementById('conversionOverlay').classList.remove('active');
                }

                document.getElementById('convProgressWrap').classList.remove('active');
                convSetProgress(0, 'Done');
                convEnableUI(true);
                convIsConverting = false;
                convUpdateStatus('🏁 Finished');
                convLog('🏁 Conversion finished.', 'info');
                renderConvTable();
            }

            function convCancelConversion() {

            }

            function convOpenMappingModal(trigger) {
                const overlay = document.getElementById('converterMappingModal');
                convRenderMappingModal();
                positionRolloutPanel('converterMappingModal', trigger || document.getElementById('topResetBtn'));
                overlay.classList.add('open');
                document.body.style.overflow = 'hidden';
            }

            function convCloseMappingModal() {
                document.getElementById('converterMappingModal').classList.remove('open');
                document.body.style.overflow = '';
            }

            function fetchWithAbort(url, signal) { return fetch(url, { mode: 'cors', signal }); }

            function convertBlobToAvif(blob, quality) {
                return new Promise((resolve, reject) => {
                    const url = URL.createObjectURL(blob);
                    const img = new Image();
                    img.onload = function() {
                        try {
                            const canvas = document.createElement('canvas');
                            canvas.width = img.width;
                            canvas.height = img.height;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0);
                            canvas.toBlob(b => {
                                URL.revokeObjectURL(url);
                                if (b) resolve(b);
                                else reject(new Error('toBlob returned null'));
                            }, 'image/avif', quality);
                        } catch (err) {
                            URL.revokeObjectURL(url);
                            reject(err);
                        }
                    };
                    img.onerror = function() {
                        URL.revokeObjectURL(url);
                        reject(new Error('Failed to load image'));
                    };
                    img.src = url;
                });
            }

            // ── Carousel ─────────────────────────────────────────────
            function buildLetterPanel(index, data) {
                const panel = document.createElement('div');
                panel.className = 'letter-panel' + (index === 0 ? ' active' : '');
                panel.dataset.index = String(index);
                panel.dataset.letter = data.letterId || '';
                panel.innerHTML = `
              <div class="letter-card-frame">
                <div class="letter-cover">
                  <span class="letter-cover-kicker">${data.isSpecial ? data.specialLabel || 'SPECIAL' : 'SECTION ' + String(index+1).padStart(2,'0')}</span>
                  <h2 class="letter-cover-name">${escapeHtml(data.title)}</h2>
                  <p class="letter-cover-deck">${escapeHtml(data.deck || '')}</p>
                </div>
                <div class="letter-toolbar"><span class="letter-count">${data.letterId || 'info'}</span></div>
                <div class="letter-content"></div>
              </div>
            `;
                panel.addEventListener('click', () => {
                    const idx = Number(panel.dataset.index);
                    if (idx !== activeIndex) activatePanel(idx);
                });
                return panel;
            }

            function renderLetter(index) {
                const panels = document.querySelectorAll('.letter-panel');
                if (!panels.length) return;
                const panel = panels[index];
                if (!panel) return;
                const data = letterData[index];
                if (!data) return;
                const content = panel.querySelector('.letter-content');
                if (!content) return;

                if (data.letterId === 'media') renderMediaLetter();
                else if (data.letterId === 'converter') renderConverterLetter();
                else content.innerHTML = '<div class="sample-letter"><p>Empty.</p></div>';

                if (index === activeIndex) {
                    updateProgressBar();
                    const c = document.getElementById('hudNavCounter');
                    if (c) c.textContent = `${activeIndex+1}/${letterData.length}`;
                }
            }

            function renderTrack() {
                const track = document.getElementById('lettersTrack');
                track.innerHTML = '';
                letterData.forEach((d, i) => track.appendChild(buildLetterPanel(i, d)));
                renderLetter(0);
                updateProgressBar();
                const c = document.getElementById('hudNavCounter');
                if (c) c.textContent = `1/${letterData.length}`;
            }

            function activatePanel(newIndex) {
                if (newIndex < 0) newIndex = letterData.length - 1;
                if (newIndex >= letterData.length) newIndex = 0;
                if (newIndex === activeIndex) { scrollToPanel(newIndex);
                    updateProgressBar(); return; }
                document.querySelectorAll('.letter-panel').forEach(p => p.classList.remove('active'));
                activeIndex = newIndex;
                const panels = document.querySelectorAll('.letter-panel');
                panels[activeIndex].classList.add('active');
                renderLetter(activeIndex);
                scrollToPanel(activeIndex);
                updateProgressBar();
                const c = document.getElementById('hudNavCounter');
                if (c) c.textContent = `${activeIndex+1}/${letterData.length}`;
            }

            function scrollToPanel(index) {
                const panel = document.querySelectorAll('.letter-panel')[index];
                if (!panel) return;
                const track = document.getElementById('lettersTrack');
                const tr = track.getBoundingClientRect();
                const pr = panel.getBoundingClientRect();
                const delta = pr.left + pr.width / 2 - (tr.left + tr.width / 2);
                track.scrollTo({ left: track.scrollLeft + delta, behavior: 'smooth' });
            }

            function updateProgressBar() {
                const fill = document.getElementById('scrollProgressFill');
                const total = letterData.length;
                if (total <= 1) { fill.style.width = '0%';
                    fill.classList.add('dim'); return; }
                const pct = Math.round((activeIndex / (total - 1)) * 100);
                fill.style.width = pct + '%';
                fill.classList.remove('dim');
                document.getElementById('scrollProgressBar').setAttribute('aria-valuenow', String(pct));
            }

            // ── Viewport blur ──────────────────────────────────────
            function setupViewportBlur() {
                const top = document.getElementById('viewportBlurTop'),
                    bottom = document.getElementById('viewportBlurBottom'),
                    hudTop = document.getElementById('hudTop');

                function update() {
                    const sy = window.scrollY || 0;
                    const max = document.documentElement.scrollHeight - window.innerHeight;
                    top.classList.toggle('scrolling', sy > 4);
                    bottom.classList.toggle('scrolling', sy < max - 4);
                    if (hudTop) hudTop.classList.toggle('docked', sy > 4);
                }
                let tick = false;

                function onScroll() { if (tick) return;
                    tick = true;
                    requestAnimationFrame(() => { update();
                        tick = false; }); }
                window.addEventListener('scroll', onScroll, { passive: true });
                window.addEventListener('resize', onScroll);
                update();
            }

            // ── Custom cursor ──────────────────────────────────────
            (function initWriteCursor() {
                const dot = document.getElementById('writeCursorDot');
                const ellipse = document.getElementById('writeCursorEllipse');
                if (!dot || !ellipse) return;
                const NATIVE = ['button', 'a', 'input', 'textarea', 'select', '[role="button"]', '.letter-hotspot'].join(
                ', ');
                let px = 0,
                    py = 0,
                    lx = 0,
                    ly = 0,
                    init = false,
                    angle = 0,
                    sx = 1,
                    sy = 1,
                    raf = null;
                const LERP = 0.22,
                    SPEED = 34,
                    STRETCH = 0.6;

                function step() {
                    if (!init) { lx = px;
                        ly = py;
                        init = true; }
                    const dx = px - lx,
                        dy = py - ly;
                    lx = px;
                    ly = py;
                    const spd = Math.hypot(dx, dy);
                    const targetAngle = spd > 0.4 ? Math.atan2(dy, dx) * (180 / Math.PI) : angle;
                    const stretch = Math.min(spd / SPEED, 1) * STRETCH;
                    const diff = ((targetAngle - angle + 540) % 360) - 180;
                    angle += diff * LERP;
                    sx += (1 + stretch - sx) * LERP;
                    sy += (1 - stretch * 0.45 - sy) * LERP;
                    ellipse.style.transform = `translate(${px}px,${py}px) rotate(${angle}deg) scale(${sx},${sy})`;
                    raf = requestAnimationFrame(step);
                }

                window.addEventListener('mousemove', (e) => {
                    const native = !!(e.target && e.target.nodeType === 1 && e.target.closest(NATIVE));
                    document.body.classList.add('custom-cursor-active');
                    document.body.classList.toggle('write-native-cursor', native);
                    px = e.clientX;
                    py = e.clientY;
                    dot.style.transform = `translate(${px}px,${py}px)`;
                    dot.classList.add('visible');
                    ellipse.classList.add('visible');
                    if (!raf) raf = requestAnimationFrame(step);
                });
                document.addEventListener('mouseleave', () => {
                    dot.classList.remove('visible');
                    ellipse.classList.remove('visible');
                    document.body.classList.remove('write-native-cursor', 'custom-cursor-active');
                    if (raf) { cancelAnimationFrame(raf);
                        raf = null; }
                });
            })();

            // ── Init ──────────────────────────────────────────────────
            letterData = [
                { title: 'Media Manager', deck: 'Load, preview, rename, and map your assets.', letterId: 'media' },
                { title: 'AVIF Converter', deck: 'Convert images to .avif from a CSV mapping.', letterId: 'converter' },
            ];

            document.addEventListener('DOMContentLoaded', function() {
                setupViewportBlur();
                renderTrack();

                document.getElementById('hudPrev').addEventListener('click', () => activatePanel(activeIndex - 1));
                document.getElementById('hudNext').addEventListener('click', () => activatePanel(activeIndex + 1));
                document.getElementById('letterHotspotPrev').addEventListener('click', () => activatePanel(activeIndex -
                1));
                document.getElementById('letterHotspotNext').addEventListener('click', () => activatePanel(activeIndex +
                1));

                document.getElementById('hudJumpMedia').addEventListener('click', () => {
                    const idx = letterData.findIndex(d => d.letterId === 'media');
                    if (idx >= 0) activatePanel(idx);
                });
                document.getElementById('hudJumpConverter').addEventListener('click', () => {
                    const idx = letterData.findIndex(d => d.letterId === 'converter');
                    if (idx >= 0) activatePanel(idx);
                });

                document.getElementById('topResetBtn').addEventListener('click', function() {
                    if (confirm('Reset all data?')) {
                        mmRenameMap = {};
                        saveMmMapping();
                        isConverterInitialized = false;
                        convRows = [];
                        convIsConverting = false;
                        convCancelRequested = false;
                        lastZipBlob = null;
                        if (convTimerInterval) { clearInterval(convTimerInterval);
                            convTimerInterval = null; }
                        renderLetter(0);
                        renderLetter(1);
                        updateHudStatus();
                    }
                });

                document.getElementById('converterMappingClose').addEventListener('click', convCloseMappingModal);
                document.getElementById('converterMappingModal').addEventListener('click', (e) => {
                    if (e.target === e.currentTarget) convCloseMappingModal();
                });
                document.getElementById('mediaMappingClose').addEventListener('click', closeMediaMappingModal);
                document.getElementById('mediaMappingModal').addEventListener('click', (e) => {
                    if (e.target === e.currentTarget) closeMediaMappingModal();
                });

                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') {
                        if (document.getElementById('converterMappingModal').classList.contains('open'))
                            convCloseMappingModal();
                        if (document.getElementById('mediaMappingModal').classList.contains('open'))
                            closeMediaMappingModal();
                        if (document.getElementById('mmLightbox')?.classList.contains('open'))
                            closeMediaLightbox();
                        if (document.getElementById('bulkRenameModal')?.classList.contains('open'))
                            closeBulkRenameModal();
                        if (document.getElementById('conversionOverlay').classList.contains('active')) {
                            if (!convIsConverting) {
                                document.getElementById('conversionOverlay').classList.remove('active');
                            }
                        }
                    }
                    if (e.key === 'ArrowLeft') { activatePanel(activeIndex - 1);
                        e.preventDefault(); }
                    if (e.key === 'ArrowRight') { activatePanel(activeIndex + 1);
                        e.preventDefault(); }
                });

                // Track drag
                const track = document.getElementById('lettersTrack');
                let dragging = false,
                    startX = 0,
                    startScroll = 0;
                track.addEventListener('pointerdown', (e) => {
                    if (e.pointerType === 'touch') return;
                    if (closestSafe(e.target,
                        'button, a, input, .converter-upload, .converter-table-wrap, .mm-item, .mm-upload-area textarea'
                        )) return;
                    dragging = true;
                    startX = e.clientX;
                    startScroll = track.scrollLeft;
                    track.classList.add('dragging');
                    track.setPointerCapture(e.pointerId);
                });
                track.addEventListener('pointermove', (e) => {
                    if (!dragging) return;
                    track.scrollLeft = startScroll - (e.clientX - startX);
                });
                track.addEventListener('pointerup', () => { dragging = false;
                    track.classList.remove('dragging'); });
                track.addEventListener('pointercancel', () => { dragging = false;
                    track.classList.remove('dragging'); });

                // Scroll settle
                let settle = null;
                track.addEventListener('scroll', () => {
                    clearTimeout(settle);
                    settle = setTimeout(() => {
                        const rect = track.getBoundingClientRect();
                        const cx = rect.left + rect.width / 2;
                        let best = 0,
                            bestDist = Infinity;
                        Array.from(track.children).forEach((panel, i) => {
                            const r = panel.getBoundingClientRect();
                            const c = r.left + r.width / 2;
                            const d = Math.abs(c - cx);
                            if (d < bestDist) { bestDist = d;
                                best = i; }
                        });
                        if (best !== activeIndex) {
                            document.querySelectorAll('.letter-panel').forEach(p => p.classList.remove(
                            'active'));
                            activeIndex = best;
                            document.querySelectorAll('.letter-panel')[best].classList.add('active');
                            renderLetter(activeIndex);
                            updateProgressBar();
                            const c = document.getElementById('hudNavCounter');
                            if (c) c.textContent = `${activeIndex+1}/${letterData.length}`;
                        } else updateProgressBar();
                    }, 150);
                }, { passive: true });

                renderLetter(0);
                renderLetter(1);
                updateHudStatus();

                // Hide download button initially
                const dlBtn = document.getElementById('convDownloadZipBtn');
                if (dlBtn) { dlBtn.style.display = 'none';
                    dlBtn.classList.remove('visible'); }
            });
        })();
    </script>
