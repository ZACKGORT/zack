            function parseCSV(text) {
                const lines = text.split(/\r?\n/).filter(line => line.trim() !== '');
                if (lines.length < 2) return [];
                const header = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, ''));
                const urlIdx = header.indexOf('Original URL');
                const origIdx = header.indexOf('Original Filename');
                const newIdx = header.indexOf('New Filename (no ext)');
                if (urlIdx === -1 || newIdx === -1) return [];
                const result = [];
                for (let i = 1; i < lines.length; i++) {
                    const line = lines[i];
                    const cols = [];
                    let inQuotes = false,
                        current = '';
                    for (let ch of line) {
                        if (ch === '"') { inQuotes = !inQuotes; continue; }
                        if (ch === ',' && !inQuotes) { cols.push(current.trim());
                            current = ''; continue; }
                        current += ch;
                    }
                    cols.push(current.trim());
                    if (cols.length <= Math.max(urlIdx, newIdx)) continue;
                    const url = cols[urlIdx].replace(/^"|"$/g, '').trim();
                    const newName = cols[newIdx].replace(/^"|"$/g, '').trim();
                    if (!url || !newName) continue;
                    result.push({
                        url,
                        originalName: cols[origIdx] ? cols[origIdx].replace(/^"|"$/g, '').trim() : '',
                        newName,
                        type: isVideo(url) ? 'video' : 'image',
                        status: 'pending',
                        progress: 0
                    });
                }
                return result;
            }

            function fetchWithAbort(url, signal) {
                return fetch(url, { mode: 'cors', signal });
            }

            function convertBlobToAvif(blob, quality = 0.5) {
                return new Promise((resolve, reject) => {
                    const url = URL.createObjectURL(blob);
                    const img = new Image();
                    img.onload = function() {
                        try {
                            const canvas = document.createElement('canvas');
                            canvas.width = img.width;
                            canvas.height = img.height;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0);
                            canvas.toBlob(blob => {
                                URL.revokeObjectURL(url);
                                if (blob) resolve(blob);
                                else reject(new Error('toBlob returned null'));
                            }, 'image/avif', quality);
                        } catch (err) {
                            URL.revokeObjectURL(url);
                            reject(err);
                        }
                    };
                    img.onerror = function() {
                        URL.revokeObjectURL(url);
                        reject(new Error('Failed to load image'));
                    };
                    img.src = url;
                });
            }

            async function convStartConversion() {
                if (convIsConverting) return;
                const images = convRows.filter(r => r.type === 'image');
                if (images.length === 0) { alert('No images to convert.'); return; }

                convIsConverting = true;
                convCancelRequested = false;
                convEnableUI(false);
                convClearLog();
                convLog(`🔄 Starting conversion of ${images.length} images…`, 'info');
                const progressWrap = document.getElementById('convProgressWrap');
                if (progressWrap) progressWrap.classList.add('active');
                convSetProgress(0, 'Starting…');
                convUpdateStatus('⏳ Initializing…');

                const zip = new JSZip();
                let completed = 0,
                    errors = 0;

                const imageIndices = convRows.map((r, i) => r.type === 'image' ? i : -1).filter(i => i >= 0);
                const totalImages = imageIndices.length;

                for (let i = 0; i < imageIndices.length; i++) {
                    if (convCancelRequested) { convLog('⏹️ Cancelled by user.', 'info'); break; }

                    const idx = imageIndices[i];
                    const row = convRows[idx];
                    const pct = (i / totalImages) * 100;
                    convSetProgress(pct, `Processing ${i+1}/${totalImages}: ${row.newName}`);
                    convUpdateStatus(`⬇️ Downloading (${i+1}/${totalImages}): ${row.newName}`);
                    convLog(`⬇️ Downloading ${row.newName}`, 'info');
                    updateConvRowStatus(idx, 'downloading', 10);

                    try {
                        const controller = new AbortController();
                        const signal = controller.signal;
                        const cancelPromise = new Promise((resolve, reject) => {
                            const check = () => {
                                if (convCancelRequested) { controller.abort();
                                    reject(new Error('Cancelled')); } else setTimeout(check, 100);
                            };
                            check();
                        });
                        const response = await Promise.race([fetchWithAbort(row.url, signal), cancelPromise]);
                        const blob = await response.blob();
                        if (convCancelRequested) break;

                        updateConvRowStatus(idx, 'converting', 30);
                        convUpdateStatus(`🔄 Converting (${i+1}/${totalImages}): ${row.newName}`);
                        convLog(`🔄 Converting ${row.newName} to AVIF`, 'info');

                        const avifBlob = await convertBlobToAvif(blob, convQuality);
                        if (convCancelRequested) break;

                        updateConvRowStatus(idx, 'converting', 80);
                        zip.file(row.newName + '.avif', avifBlob);
                        updateConvRowStatus(idx, 'done', 100);
                        convLog(`✅ Added ${row.newName}.avif to ZIP`, 'ok');
                        completed++;

                    } catch (err) {
                        if (err.message === 'Cancelled') { convLog('⏹️ Operation cancelled.', 'info'); break; }
                        convLog(`❌ Error converting ${row.url}: ${err.message}`, 'err');
                        updateConvRowStatus(idx, 'error', 0);
                        errors++;
                    }
                }

                if (convCancelRequested) convLog('⏹️ Conversion stopped early.', 'info');

                if (zip.files.length > 0) {
                    convSetProgress(100, 'Zipping…');
                    convUpdateStatus('📦 Generating ZIP…');
                    convLog('📦 Generating ZIP file…', 'info');
                    try {
                        const zipBlob = await zip.generateAsync({ type: 'blob' });
                        saveAs(zipBlob, 'converted_avif.zip');
                        convLog(`✅ ZIP downloaded with ${completed} files.`, 'ok');
                        if (errors > 0) convLog(`⚠️ ${errors} errors occurred.`, 'err');
                    } catch (err) {
                        convLog(`❌ Failed to create ZIP: ${err.message}`, 'err');
                    }
                } else {
                    convLog('⚠️ No files were converted. ZIP not created.', 'info');
                }

                if (progressWrap) progressWrap.classList.remove('active');
                convSetProgress(0, 'Done');
                convEnableUI(true);
                convIsConverting = false;
                convUpdateStatus('🏁 Finished');
                convLog('🏁 Conversion finished.', 'info');
                const cancelBtn = document.getElementById('convCancelBtn');
                if (cancelBtn) { cancelBtn.disabled = true;
                    cancelBtn.classList.remove('btn-danger');
                    cancelBtn.classList.add('btn'); }
                const hudStatusCount = document.getElementById('hudStatusCount');
                if (hudStatusCount) hudStatusCount.textContent = convRows.filter(r => r.type === 'image').length;
                // Re-render to update button states
                renderConvTable();
            }

            function convCancelConversion() {
                if (!convIsConverting) return;
                convCancelRequested = true;
                const cancelBtn = document.getElementById('convCancelBtn');
                if (cancelBtn) cancelBtn.disabled = true;
                convLog('⏹️ Cancelling…', 'info');
                convUpdateStatus('⏹️ Cancelling…');
            }

            function convDownloadUpdatedCSV() {
                if (convRows.length === 0) return;
                let csv = 'Original URL,Original Filename,New Filename (no ext),New Filename (.avif)\n';
                convRows.forEach(row => {
                    csv += `"${row.url}","${row.originalName || ''}","${row.newName}","${row.newName}.avif"\n`;
                });
                const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                saveAs(blob, 'media-rename-map-updated.csv');
            }

            function convRenderMappingModal() {
                const body = document.getElementById('converterMappingBody');
                if (!body) return;
                if (convRows.length === 0) { body.innerHTML =
                    '<p style="color:var(--ink-light);padding:1rem 0;">No data loaded.</p>'; return; }
                let html =
                    `<table><thead><tr><th>Original URL</th><th>New name</th><th>.avif</th></tr></thead><tbody>`;
                convRows.forEach(row => {
                    const displayUrl = row.url.length > 60 ? row.url.slice(0, 55) + '…' : row.url;
                    const domain = new URL(row.url).hostname.replace('www.', '');
                    html +=
                        `<tr><td><span class="url" title="${row.url}">${displayUrl}</span> <span class="badge">${domain}</span></td><td><code>${escapeHtml(row.newName)}</code></td><td><code>${escapeHtml(row.newName)}.avif</code></td></tr>`;
                });
                html += `</tbody></table>`;
                body.innerHTML = html;
            }

            function convOpenMappingModal(trigger) {
                const overlay = document.getElementById('converterMappingModal');
                convRenderMappingModal();
                positionRolloutPanel('converterMappingModal', trigger || document.getElementById('topResetBtn'));
                overlay.classList.add('open');
                document.body.style.overflow = 'hidden';
            }

            function convCloseMappingModal() {
                document.getElementById('converterMappingModal').classList.remove('open');
                document.body.style.overflow = '';
            }

            function initConverter(container) {
                if (isConverterInitialized) return;
                isConverterInitialized = true;

                // ── Quality slider ──
                const slider = document.getElementById('convQualitySlider');
                const valueDisplay = document.getElementById('convQualityValue');
                if (slider && valueDisplay) {
                    slider.addEventListener('input', function() {
                        convQuality = parseFloat(this.value);
                        valueDisplay.textContent = convQuality.toFixed(2);
                    });
                }

                // Initial sync from media
                syncConverterFromMedia();
                convClearLog();
                const imgCount = convRows.filter(r => r.type === 'image').length;
                convLog(`📂 Synced ${convRows.length} assets from Media Manager (${imgCount} images).`, 'info');
                const convertBtn = document.getElementById('convConvertBtn');
                if (convertBtn) convertBtn.disabled = (imgCount === 0);

                // ── Wire events ──
                const fileInput = document.getElementById('converterFileInput');
                const upload = document.getElementById('converterUpload');

                if (fileInput) {
                    fileInput.addEventListener('change', function(e) {
                        const file = this.files[0];
                        if (!file) return;
                        const reader = new FileReader();
                        reader.onload = function(ev) {
                            const parsed = parseCSV(ev.target.result);
                            if (parsed.length === 0) { alert('No valid rows found.'); return; }
                            convRows = parsed;
                            renderConvTable();
                            convClearLog();
                            convLog(
                                `📋 Loaded ${convRows.length} entries (${convRows.filter(r=>r.type==='image').length} images, ${convRows.filter(r=>r.type==='video').length} videos)`,
                                'info');
                            const imgC = convRows.filter(r => r.type === 'image').length;
                            if (convertBtn) convertBtn.disabled = (imgC === 0);
                            const hudCount = document.getElementById('hudStatusCount');
                            if (hudCount) hudCount.textContent = imgC;
                            const hudText = document.getElementById('hudStatusText');
                            if (hudText) hudText.textContent = `${imgC} images ready`;
                        };
                        reader.readAsText(file);
                    });
                }

                if (upload) {
                    upload.addEventListener('click', () => fileInput && fileInput.click());
                    upload.addEventListener('dragover', (e) => { e.preventDefault();
                        upload.style.borderColor = 'var(--ink)'; });
                    upload.addEventListener('dragleave', () => { upload.style.borderColor = 'var(--border)'; });
                    upload.addEventListener('drop', (e) => {
                        e.preventDefault();
                        upload.style.borderColor = 'var(--border)';
                        const files = e.dataTransfer.files;
                        if (files.length > 0 && fileInput) {
                            fileInput.files = files;
                            fileInput.dispatchEvent(new Event('change'));
                        }
                    });
                }

                const syncBtn = document.getElementById('convSyncMediaBtn');
                if (syncBtn) {
                    syncBtn.addEventListener('click', function() {
                        syncConverterFromMedia();
                        renderConvTable();
                        convClearLog();
                        const imgC = convRows.filter(r => r.type === 'image').length;
                        convLog(`🔄 Synced ${convRows.length} assets from Media Manager (${imgC} images)`, 'info');
                        if (convertBtn) convertBtn.disabled = (imgC === 0);
                    });
                }

                const convertBtn2 = document.getElementById('convConvertBtn');
                if (convertBtn2) convertBtn2.addEventListener('click', convStartConversion);

                const cancelBtn = document.getElementById('convCancelBtn');
                if (cancelBtn) {
                    cancelBtn.addEventListener('click', convCancelConversion);
                    cancelBtn.disabled = true;
                    cancelBtn.classList.remove('btn-danger');
                    cancelBtn.classList.add('btn');
                }

                const exportBtn = document.getElementById('convExportCsvBtn');
                if (exportBtn) exportBtn.addEventListener('click', convDownloadUpdatedCSV);

                const mappingBtn = document.getElementById('convMappingBtn');
                if (mappingBtn) mappingBtn.addEventListener('click', (e) => convOpenMappingModal(e.currentTarget));
            }

            // ── Carousel build ──────────────────────────────────────
            function buildLetterPanel(index, data) {
                const panel = document.createElement('div');
                panel.className = 'letter-panel' + (index === 0 ? ' active' : '');
                panel.dataset.index = String(index);
                panel.dataset.letter = data.letterId || '';

                const frame = document.createElement('div');
                frame.className = 'letter-card-frame';

                const cover = document.createElement('div');
                cover.className = 'letter-cover';
                const label = data.isSpecial ? data.specialLabel || 'SPECIAL' : 'LETTER ' + String(index + 1).padStart(2,
                '0');
                cover.innerHTML = `
              <span class="letter-cover-kicker">${label}</span>
              <h2 class="letter-cover-name">${escapeHtml(data.title)}</h2>
              <p class="letter-cover-deck">${escapeHtml(data.deck || '')}</p>
            `;
                frame.appendChild(cover);

                const toolbar = document.createElement('div');
                toolbar.className = 'letter-toolbar';
                const countEl = document.createElement('span');
                countEl.className = 'letter-count';
                countEl.textContent = data.letterId || 'info';
                toolbar.appendChild(countEl);
                frame.appendChild(toolbar);

                const content = document.createElement('div');
                content.className = 'letter-content';
                frame.appendChild(content);

                panel.appendChild(frame);

                panel.addEventListener('click', () => {
                    const idx = Number(panel.dataset.index);
                    if (idx !== activeIndex) activatePanel(idx);
                });

                return panel;
            }

            function renderLetter(index) {
                const panels = document.querySelectorAll('.letter-panel');
                if (!panels.length) return;
                const panel = panels[index];
                if (!panel) return;
                const data = letterData[index];
                if (!data) return;

                const frame = panel.querySelector('.letter-card-frame');
                const content = frame.querySelector('.letter-content');
                if (!content) return;

                if (data.letterId === 'media') {
                    renderMediaLetter();
                } else if (data.letterId === 'converter') {
                    renderConverterLetter();
                } else {
                    content.innerHTML = `<div class="sample-letter"><p>This letter is empty.</p></div>`;
                }

                if (index === activeIndex) {
                    updateProgressBar();
                    const counter = document.getElementById('hudNavCounter');
                    if (counter) counter.textContent = `${activeIndex+1}/${letterData.length}`;
                }
            }

            function renderTrack() {
                const track = document.getElementById('lettersTrack');
                track.innerHTML = '';
                letterData.forEach((data, i) => track.appendChild(buildLetterPanel(i, data)));
                renderLetter(0);
                updateProgressBar();
                const counter = document.getElementById('hudNavCounter');
                if (counter) counter.textContent = `1/${letterData.length}`;
            }

            function activatePanel(newIndex) {
                if (newIndex < 0) newIndex = letterData.length - 1;
                if (newIndex >= letterData.length) newIndex = 0;
                if (newIndex === activeIndex) { scrollToPanel(newIndex);
                    updateProgressBar(); return; }
                const panels = document.querySelectorAll('.letter-panel');
                panels.forEach(p => p.classList.remove('active'));
                activeIndex = newIndex;
                panels[activeIndex].classList.add('active');
                renderLetter(activeIndex);
                scrollToPanel(activeIndex);
                updateProgressBar();
                const counter = document.getElementById('hudNavCounter');
                if (counter) counter.textContent = `${activeIndex+1}/${letterData.length}`;
            }

            function scrollToPanel(index) {
                const panel = document.querySelectorAll('.letter-panel')[index];
                if (!panel) return;
                const track = document.getElementById('lettersTrack');
                const trackRect = track.getBoundingClientRect();
                const panelRect = panel.getBoundingClientRect();
                const delta = panelRect.left + panelRect.width / 2 - (trackRect.left + trackRect.width / 2);
                track.scrollTo({ left: track.scrollLeft + delta, behavior: 'smooth' });
            }

            function updateProgressBar() {
                const fill = document.getElementById('scrollProgressFill');
                const total = letterData.length;
                if (total <= 1) { fill.style.width = '0%';
                    fill.classList.add('dim'); return; }
                const progress = activeIndex / (total - 1);
                const percent = Math.round(progress * 100);
                fill.style.width = percent + '%';
                fill.classList.remove('dim');
                document.getElementById('scrollProgressBar').setAttribute('aria-valuenow', String(percent));
            }

            // ── Viewport blur ──────────────────────────────────────────
            function setupViewportBlur() {
                const top = document.getElementById('viewportBlurTop'),
                    bottom = document.getElementById('viewportBlurBottom'),
                    hudTop = document.getElementById('hudTop');
                if (!top || !bottom) return;

                function update() {
                    const scrollY = window.scrollY || window.pageYOffset || 0;
                    const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
                    top.classList.toggle('scrolling', scrollY > 4);
                    bottom.classList.toggle('scrolling', scrollY < maxScroll - 4);
                    if (hudTop) hudTop.classList.toggle('docked', scrollY > 4);
                }
                let ticking = false;

                function onScrollOrResize() { if (ticking) return;
                    ticking = true;
                    requestAnimationFrame(() => { update();
                        ticking = false; }); }
                window.addEventListener('scroll', onScrollOrResize, { passive: true });
                window.addEventListener('resize', onScrollOrResize);
                update();
            }

            // ── Custom cursor ──────────────────────────────────────────
            (function initWriteCursor() {
                const dot = document.getElementById('writeCursorDot');
                const ellipse = document.getElementById('writeCursorEllipse');
                if (!dot || !ellipse) return;
                const NATIVE_SELECTOR = ['button', 'a', 'input', 'textarea', 'select', '[role="button"]', '.letter-hotspot']
                    .join(', ');
                let ptrX = 0,
                    ptrY = 0,
                    prevFrameX = 0,
                    prevFrameY = 0,
                    frameInit = false;
                let ellAngle = 0,
                    ellScaleX = 1,
                    ellScaleY = 1,
                    rafId = null;
                const ELLIPSE_LERP = 0.22,
                    SPEED_SATURATE = 34,
                    MAX_STRETCH = 0.6;

                function shortAngleLerp(current, target, factor) { const diff = ((target - current + 540) % 360) - 180;
                    return current + diff * factor; }

                function step() {
                    if (!frameInit) { prevFrameX = ptrX;
                        prevFrameY = ptrY;
                        frameInit = true; }
                    const dx = ptrX - prevFrameX,
                        dy = ptrY - prevFrameY;
                    prevFrameX = ptrX;
                    prevFrameY = ptrY;
                    const speed = Math.hypot(dx, dy);
                    const angleTarget = speed > 0.4 ? Math.atan2(dy, dx) * (180 / Math.PI) : ellAngle;
                    const stretch = Math.min(speed / SPEED_SATURATE, 1) * MAX_STRETCH;
                    ellAngle = shortAngleLerp(ellAngle, angleTarget, ELLIPSE_LERP);
                    ellScaleX += (1 + stretch - ellScaleX) * ELLIPSE_LERP;
                    ellScaleY += (1 - stretch * 0.45 - ellScaleY) * ELLIPSE_LERP;
                    ellipse.style.transform = 'translate(' + ptrX + 'px,' + ptrY + 'px) rotate(' + ellAngle +
                        'deg) scale(' + ellScaleX + ',' + ellScaleY + ')';
                    rafId = requestAnimationFrame(step);
                }

                function startLoop() { if (!rafId) rafId = requestAnimationFrame(step); }

                function stopLoop() { if (rafId) { cancelAnimationFrame(rafId);
                        rafId = null; } }

                function hideAll() { dot.classList.remove('visible');
                    ellipse.classList.remove('visible');
                    document.body.classList.remove('write-native-cursor', 'custom-cursor-active');
                    stopLoop(); }
                window.addEventListener('mousemove', (e) => {
                    const overNative = !!(e.target && e.target.nodeType === 1 && e.target.closest(NATIVE_SELECTOR));
                    document.body.classList.add('custom-cursor-active');
                    document.body.classList.toggle('write-native-cursor', overNative);
                    ptrX = e.clientX;
                    ptrY = e.clientY;
                    dot.style.transform = 'translate(' + ptrX + 'px,' + ptrY + 'px)';
                    dot.classList.add('visible');
                    ellipse.classList.add('visible');
                    startLoop();
                });
                document.addEventListener('mouseleave', hideAll);
            })();

            // ── Init ──────────────────────────────────────────────────
            letterData = [
                { title: 'Media Manager', deck: 'Load, preview, rename, and map your assets.', letterId: 'media' },
                { title: 'AVIF Converter', deck: 'Convert images to .avif from a CSV mapping.', letterId: 'converter' },
            ];

            document.addEventListener('DOMContentLoaded', function() {
                setupViewportBlur();
                renderTrack();

                // ── HUD events ──
                document.getElementById('hudPrev').addEventListener('click', () => activatePanel(activeIndex - 1));
                document.getElementById('hudNext').addEventListener('click', () => activatePanel(activeIndex + 1));
                document.getElementById('letterHotspotPrev').addEventListener('click', () => activatePanel(activeIndex -
                1));
                document.getElementById('letterHotspotNext').addEventListener('click', () => activatePanel(activeIndex +
                1));

                document.getElementById('hudJumpMedia').addEventListener('click', () => {
                    const idx = letterData.findIndex(d => d.letterId === 'media');
                    if (idx >= 0) activatePanel(idx);
                });
                document.getElementById('hudJumpConverter').addEventListener('click', () => {
                    const idx = letterData.findIndex(d => d.letterId === 'converter');
                    if (idx >= 0) activatePanel(idx);
                });

                document.getElementById('topResetBtn').addEventListener('click', function() {
                    if (confirm('Reset all data? This will clear media renames and converter demo data.')) {
                        mmRenameMap = {};
                        saveMmMapping();
                        isConverterInitialized = false;
                        convRows = [];
                        convIsConverting = false;
                        convCancelRequested = false;
                        if (convTimerInterval) { clearInterval(convTimerInterval);
                            convTimerInterval = null; }
                        renderLetter(0);
                        renderLetter(1);
                        updateHudStatus();
                        updateDemoBadge();
                    }
                });

                // ── Mapping modal close ──
                document.getElementById('converterMappingClose').addEventListener('click', convCloseMappingModal);
                document.getElementById('converterMappingModal').addEventListener('click', (e) => {
                    if (e.target === e.currentTarget) convCloseMappingModal();
                });
                document.getElementById('mediaMappingClose').addEventListener('click', closeMediaMappingModal);
                document.getElementById('mediaMappingModal').addEventListener('click', (e) => {
                    if (e.target === e.currentTarget) closeMediaMappingModal();
                });
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') {
                        if (document.getElementById('converterMappingModal').classList.contains('open'))
                            convCloseMappingModal();
                        if (document.getElementById('mediaMappingModal').classList.contains('open'))
                            closeMediaMappingModal();
                        if (document.getElementById('mmLightbox')?.classList.contains('open'))
                            closeMediaLightbox();
                        if (document.getElementById('bulkRenameModal')?.classList.contains('open'))
                            closeBulkRenameModal();
                    }
                    if (e.key === 'ArrowLeft') { activatePanel(activeIndex - 1);
                        e.preventDefault(); }
                    if (e.key === 'ArrowRight') { activatePanel(activeIndex + 1);
                        e.preventDefault(); }
                });

                // ── Track drag ──
                const track = document.getElementById('lettersTrack');
                let isDragging = false,
                    dragStartX = 0,
                    dragStartScroll = 0;
                track.addEventListener('pointerdown', (e) => {
                    if (e.pointerType === 'touch') return;
                    if (closestSafe(e.target, 'button, a, input, .converter-upload, .converter-table-wrap, .mm-item, .mm-upload-area textarea'))
                        return;
                    isDragging = true;
                    dragStartX = e.clientX;
                    dragStartScroll = track.scrollLeft;
                    track.classList.add('dragging');
                    track.setPointerCapture(e.pointerId);
                });
                track.addEventListener('pointermove', (e) => {
                    if (!isDragging) return;
                    track.scrollLeft = dragStartScroll - (e.clientX - dragStartX);
                });
                track.addEventListener('pointerup', () => { isDragging = false;
                    track.classList.remove('dragging'); });
                track.addEventListener('pointercancel', () => { isDragging = false;
                    track.classList.remove('dragging'); });

                // ── Scroll settle ──
                let settleTimer = null;
                track.addEventListener('scroll', () => {
                    clearTimeout(settleTimer);
                    settleTimer = setTimeout(() => {
                        const rect = track.getBoundingClientRect();
                        const centerX = rect.left + rect.width / 2;
                        let best = 0,
                            bestDist = Infinity;
                        Array.from(track.children).forEach((panel, i) => {
                            const r = panel.getBoundingClientRect();
                            const c = r.left + r.width / 2;
                            const d = Math.abs(c - centerX);
                            if (d < bestDist) { bestDist = d;
                                best = i; }
                        });
                        if (best !== activeIndex) {
                            const panels = track.querySelectorAll('.letter-panel');
                            panels.forEach(p => p.classList.remove('active'));
                            activeIndex = best;
                            panels[best].classList.add('active');
                            renderLetter(activeIndex);
                            updateProgressBar();
                            const counter = document.getElementById('hudNavCounter');
                            if (counter) counter.textContent = `${activeIndex+1}/${letterData.length}`;
                        } else updateProgressBar();
                    }, 150);
                }, { passive: true });

                // ── Initial render ──
                renderLetter(0);
                renderLetter(1);
                updateHudStatus();
                updateDemoBadge();
            });
        })();
    </script>
</body>
</html>
