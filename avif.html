<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
  <title>Media Manager + AVIF Converter</title>
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@1,2,3,4,5,6,7,8,9&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <style>
    /* ── design system ── */
    :root {
      --bg: #f0f0f2;
      --card: #ffffff;
      --card-dark: #1c1c1e;
      --card-mid: #3a3a3c;
      --accent: #e5e567;
      --accent-2: #f5f557;
      --ink: #1c1c1e;
      --ink-mid: #3a3a3c;
      --ink-light: #8e8e93;
      --ink-lighter: #b0b0b6;
      --border: #e6e6e8;
      --shadow: 0 4px 12px rgba(0,0,0,0.04);
      --shadow-hover: 0 16px 40px rgba(0,0,0,0.08), 0 4px 12px rgba(0,0,0,0.02);
      --shadow-floating: 0 8px 32px rgba(0,0,0,0.1);
      --radius: 1.5rem;
      --radius-sm: 0.65rem;
      --font: 'Satoshi', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', 'IBM Plex Mono', monospace;
      --fs-body: 15px;
      --fs-display: 54px;
      --max-width: 1600px;
      --transition: 0.25s cubic-bezier(0.25,0.46,0.45,0.94);
      --margin: 16px;
      --topbar-height: 56px;
      --hud-height: 64px;
      --hud-top-height: 44px;
      --scrollbar-height: 3px;
    }
    @media (min-width: 640px) {
      :root { --margin: 24px; --topbar-height: 64px; --hud-height: 70px; --hud-top-height: 48px; }
    }
    @media (min-width: 1024px) {
      :root { --margin: 32px; --topbar-height: 72px; --hud-height: 76px; --hud-top-height: 52px; }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font);
      font-size: var(--fs-body);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100vh;
      min-height: 100dvh;
      padding-bottom: calc(var(--hud-height) + 20px + var(--scrollbar-height));
      overflow-x: hidden;
    }
    ::selection { background: var(--accent); color: var(--ink); }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-thumb { background: var(--ink-lighter); border-radius: var(--radius-sm); }
    html { scrollbar-width: thin; scrollbar-color: var(--ink-lighter) transparent; }

    .t-micro {
      font-family: var(--font-mono);
      font-size: 7px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-light);
      line-height: 1.4;
    }
    .btn {
      font-family: var(--font-mono);
      font-size: 8px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--ink-mid);
      padding: 5px 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      border-radius: var(--radius-sm);
      font-weight: 500;
      touch-action: manipulation;
      min-height: 30px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      gap: 6px;
    }
    .btn:hover { background: var(--ink); color: var(--card); border-color: var(--ink); }
    .btn:active { transform: scale(0.96); }
    .btn.ghost { border-color: var(--border); color: var(--ink-light); }
    .btn.ghost:hover { background: var(--ink); color: var(--card); border-color: var(--ink); }
    .btn-primary { background: var(--ink); color: var(--card); border-color: var(--ink); }
    .btn-primary:hover { background: var(--ink-mid); border-color: var(--ink-mid); }
    .btn-danger { background: #d43a3a; color: #fff; border-color: #d43a3a; }
    .btn-danger:hover { background: #a00; border-color: #a00; }
    .btn.small { padding: 3px 8px; font-size: 6px; min-height: 22px; }
    .btn-icon { width: 30px; padding: 0; justify-content: center; font-size: 14px; }

    /* ── topbar ── */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 150;
      background: transparent;
      padding: 6px 0;
      min-height: var(--topbar-height);
      display: flex;
      align-items: center;
    }
    .topbar .wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 0 var(--margin);
      max-width: var(--max-width);
      margin: 0 auto;
      width: 100%;
    }
    .wordmark {
      font-family: var(--font);
      font-size: clamp(12px, 3.5vw, 20px);
      font-weight: 700;
      letter-spacing: -0.03em;
      display: flex;
      align-items: baseline;
      gap: 6px;
      color: var(--ink);
      flex-shrink: 0;
    }
    .wordmark .count {
      font-family: var(--font-mono);
      font-size: 8px;
      font-weight: 400;
      color: var(--ink-light);
      letter-spacing: 0.04em;
    }
    .topbar-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .topbar-right .btn { font-size: 9px; min-height: 32px; padding: 4px 10px; }

    /* ── viewport blur ── */
    .viewport-blur {
      position: fixed;
      left: 0;
      right: 0;
      z-index: 40;
      pointer-events: none;
      backdrop-filter: blur(0px);
      -webkit-backdrop-filter: blur(0px);
      transition: backdrop-filter 0.3s ease, background 0.4s ease;
    }
    .viewport-blur.scrolling { backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(8px); }
    .viewport-blur-top {
      top: 0;
      height: calc(var(--topbar-height) + 36px);
      background: linear-gradient(to bottom, rgba(240,240,242,0.7), rgba(240,240,242,0));
      mask-image: linear-gradient(to bottom, black 0%, black 60%, transparent 100%);
      -webkit-mask-image: linear-gradient(to bottom, black 0%, black 60%, transparent 100%);
    }
    .viewport-blur-bottom {
      bottom: 0;
      height: calc(var(--hud-height) + 60px);
      background: linear-gradient(to top, rgba(240,240,242,0.7), rgba(240,240,242,0));
      mask-image: linear-gradient(to top, black 0%, black 45%, transparent 100%);
      -webkit-mask-image: linear-gradient(to top, black 0%, black 45%, transparent 100%);
    }

    /* ── carousel ── */
    .letters-viewport {
      position: relative;
      overflow: hidden;
      width: 100vw;
      left: 50%;
      margin-left: -50vw;
    }
    .letters-track {
      display: flex;
      align-items: flex-start;
      gap: 22px;
      padding-top: clamp(20px, 4vh, 60px);
      padding-bottom: 60px;
      padding-left: max(4vw, calc(50% - 520px));
      padding-right: max(4vw, calc(50% - 520px));
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      cursor: grab;
      user-select: none;
      box-sizing: border-box;
    }
    .letters-track.dragging { cursor: grabbing; scroll-snap-type: none; scroll-behavior: auto; }
    .letter-panel {
      flex: 0 0 auto;
      width: min(92vw, 1000px);
      max-width: 1000px;
      scroll-snap-align: center;
      box-sizing: border-box;
      opacity: 0.35;
      transition: opacity 0.3s ease, transform 0.3s ease;
      cursor: pointer;
    }
    .letter-panel.active { opacity: 1; cursor: auto; transform: scale(1); }
    .letter-hotspot {
      position: absolute;
      top: 0;
      bottom: 0;
      width: clamp(56px, 9vw, 180px);
      z-index: 20;
    }
    .letter-hotspot-prev {
      left: 0;
      cursor: url('data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%2744%27%20height%3D%2744%27%3E%3Ccircle%20cx%3D%2722%27%20cy%3D%2722%27%20r%3D%2720%27%20fill%3D%27rgba%2820%2C20%2C20%2C0.55%29%27/%3E%3Cpath%20d%3D%27M26%2012%20L16%2022%20L26%2032%27%20fill%3D%27none%27%20stroke%3D%27white%27%20stroke-width%3D%273%27%20stroke-linecap%3D%27round%27%20stroke-linejoin%3D%27round%27/%3E%3C/svg%3E') 22 22, w-resize;
    }
    .letter-hotspot-next {
      right: 0;
      cursor: url('data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%2744%27%20height%3D%2744%27%3E%3Ccircle%20cx%3D%2722%27%20cy%3D%2722%27%20r%3D%2720%27%20fill%3D%27rgba%2820%2C20%2C20%2C0.55%29%27/%3E%3Cpath%20d%3D%27M18%2012%20L28%2022%20L18%2032%27%20fill%3D%27none%27%20stroke%3D%27white%27%20stroke-width%3D%273%27%20stroke-linecap%3D%27round%27%20stroke-linejoin%3D%27round%27/%3E%3C/svg%3E') 22 22, e-resize;
    }

    .letter-card-frame {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px clamp(20px, 3vw, 36px) 40px;
      background: var(--card);
      box-shadow: var(--shadow);
      transition: box-shadow 0.3s ease, transform 0.3s ease;
      position: relative;
    }
    .letter-panel.active .letter-card-frame { box-shadow: var(--shadow-hover); }
    .letter-panel.active .letter-card-frame:hover {
      box-shadow: 0 24px 56px rgba(0,0,0,0.08), 0 8px 20px rgba(0,0,0,0.04);
      transform: translateY(-2px);
    }
    .letter-cover {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-bottom: 18px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }
    .letter-cover-kicker {
      font-family: var(--font-mono);
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-light);
    }
    .letter-cover-name {
      font-family: var(--font);
      font-size: clamp(22px, 3vw, 34px);
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--ink);
    }
    .letter-cover-deck {
      font-family: var(--font);
      font-size: clamp(13px, 1vw, 16px);
      line-height: 1.5;
      color: var(--ink-light);
      max-width: 520px;
    }
    .letter-toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }
    .letter-toolbar .letter-count {
      font-family: var(--font-mono);
      font-size: 8px;
      color: var(--ink-light);
      margin-left: auto;
    }

    /* ── HUD ── */
    .hud {
      --hud-pad: 6px 12px;
      --hud-gap: 4px;
      --hud-min-h: 44px;
      --hud-btn-min-h: 28px;
      --hud-btn-pad: 3px 10px;
      --hud-btn-fs: 7px;
      --hud-divider-h: 24px;
      --hud-fs-count: 7px;
      --hud-pad-count: 1px 6px;
      --hud-minw-count: 18px;
      --hud-fs-label: 6px;
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-floating);
      padding: var(--hud-pad);
      display: flex;
      align-items: center;
      gap: var(--hud-gap);
      transition: box-shadow 0.3s ease, padding 0.2s ease;
      min-height: var(--hud-min-h);
      font-family: var(--font-mono);
    }
    .hud:hover { box-shadow: var(--shadow-hover); }
    .hud-bottom {
      bottom: calc(12px + var(--scrollbar-height));
      --hud-pad: 10px 18px;
      --hud-gap: 6px;
      --hud-min-h: 56px;
      --hud-btn-min-h: 36px;
      --hud-btn-pad: 7px 14px;
      --hud-btn-fs: 11px;
      --hud-divider-h: 30px;
      --hud-fs-count: 10px;
      --hud-pad-count: 2px 8px;
      --hud-minw-count: 22px;
      --hud-fs-label: 9px;
    }
    .hud-top {
      top: calc(var(--topbar-height) + 12px);
      transition: top 0.3s cubic-bezier(0.25,0.46,0.45,0.94);
      --hud-btn-pad: 5px 10px;
      --hud-btn-fs: 8px;
    }
    .hud-top.docked { top: max(24px, env(safe-area-inset-top)); }
    .hud-divider {
      width: 1px;
      height: var(--hud-divider-h);
      background: var(--border);
      flex-shrink: 0;
      margin: 0 2px;
    }
    .hud .btn {
      min-height: var(--hud-btn-min-h);
      padding: var(--hud-btn-pad);
      font-size: var(--hud-btn-fs);
      border-radius: var(--radius-sm);
    }
    .hud .filter-count {
      background: var(--ink);
      color: var(--card);
      padding: var(--hud-pad-count);
      border-radius: var(--radius-sm);
      font-family: var(--font-mono);
      font-size: var(--hud-fs-count);
      font-weight: 600;
      min-width: var(--hud-minw-count);
      text-align: center;
    }
    .hud .hud-label {
      font-family: var(--font-mono);
      font-size: var(--hud-fs-label);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-light);
      opacity: 0.5;
      margin-right: 2px;
    }
    .hud-nav-counter {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--ink);
      color: var(--card);
      padding: var(--hud-pad-count);
      border-radius: var(--radius-sm);
      font-family: var(--font-mono);
      font-size: var(--hud-fs-count);
      font-weight: 600;
      min-width: var(--hud-minw-count);
      text-align: center;
    }
    @media (max-width: 640px) {
      .hud-bottom {
        bottom: calc(10px + var(--scrollbar-height));
        --hud-pad: 8px 12px;
        --hud-min-h: 48px;
        --hud-btn-min-h: 30px;
        --hud-btn-pad: 5px 10px;
        --hud-btn-fs: 9px;
        --hud-divider-h: 22px;
        --hud-fs-count: 9px;
        --hud-pad-count: 2px 6px;
        --hud-minw-count: 18px;
        --hud-fs-label: 9px;
      }
      .hud-top {
        top: calc(var(--topbar-height) + 8px);
        --hud-pad: 4px 8px;
        --hud-gap: 3px;
        --hud-min-h: 38px;
        --hud-btn-min-h: 30px;
        --hud-btn-pad: 4px 8px;
        --hud-btn-fs: 7px;
        --hud-divider-h: 16px;
      }
      .hud { border-radius: var(--radius-sm); }
      .hud .hud-label { display: none; }
    }
    @media (max-width: 480px) {
      .hud-bottom {
        bottom: calc(8px + var(--scrollbar-height));
        --hud-pad: 6px 10px;
        --hud-gap: 3px;
        --hud-min-h: 42px;
        --hud-btn-min-h: 26px;
        --hud-btn-pad: 4px 8px;
        --hud-btn-fs: 8px;
        --hud-divider-h: 18px;
      }
      .hud-top {
        top: calc(var(--topbar-height) + 6px);
        --hud-pad: 3px 6px;
        --hud-gap: 2px;
        --hud-min-h: 34px;
        --hud-btn-min-h: 28px;
        --hud-btn-pad: 3px 6px;
        --hud-btn-fs: 6px;
        --hud-divider-h: 14px;
      }
    }

    /* ── scroll progress ── */
    .scroll-progress-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: var(--scrollbar-height);
      background: rgba(0,0,0,0.06);
      z-index: 150;
      pointer-events: none;
    }
    .scroll-progress-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.1s ease;
      border-radius: 0 2px 2px 0;
    }
    .scroll-progress-fill.dim { opacity: 0.5; }

    /* ── custom cursor ── */
    body.custom-cursor-active { cursor: none; }
    .write-cursor-dot, .write-cursor-ellipse {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 500;
      pointer-events: none;
      transform: translate(-9999px, -9999px);
      opacity: 0;
      transition: opacity 0.18s ease;
      will-change: transform;
    }
    .write-cursor-dot.visible, .write-cursor-ellipse.visible { opacity: 1; }
    .write-cursor-dot {
      width: 6px;
      height: 6px;
      margin: -3px 0 0 -3px;
      border-radius: 50%;
      background: var(--ink);
    }
    .write-cursor-ellipse {
      width: 34px;
      height: 34px;
      margin: -17px 0 0 -17px;
      border: 1.5px solid var(--ink);
      border-radius: 50%;
      opacity: 0;
    }
    .write-cursor-ellipse.visible { opacity: 0.32; }
    body.custom-cursor-active.write-native-cursor { cursor: auto; }
    .write-native-cursor .write-cursor-dot,
    .write-native-cursor .write-cursor-ellipse { opacity: 0 !important; }

    /* ── rollout modal (mapping) ── */
    .bento-overlay.rollout {
      position: fixed;
      inset: 0;
      z-index: 400;
      background: rgba(0,0,0,0.3);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: flex-start;
      justify-content: flex-end;
      padding: calc(var(--topbar-height) + 12px) 16px 16px 0;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .bento-overlay.rollout.open { opacity: 1; pointer-events: auto; }
    .bento-overlay.rollout .bento-panel {
      width: min(480px, calc(100vw - 32px));
      max-height: calc(100vh - var(--topbar-height) - 40px);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-floating);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      transform: translateY(-8px) scale(0.98);
      transform-origin: top right;
      opacity: 0;
      transition: transform 0.25s cubic-bezier(0.25,0.46,0.45,0.94), opacity 0.2s ease;
    }
    .bento-overlay.rollout.open .bento-panel { transform: translateY(0) scale(1); opacity: 1; }
    .bento-overlay.rollout .bento-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }
    .bento-overlay.rollout .bento-header h2 {
      font-family: var(--font);
      font-size: calc(var(--fs-body) * 1.4);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 0;
    }
    .bento-overlay.rollout .bento-header .close-btn {
      background: transparent;
      border: 1px solid var(--border);
      width: 36px;
      height: 36px;
      font-size: 16px;
      border-radius: 50%;
      cursor: pointer;
      transition: background 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .bento-overlay.rollout .bento-header .close-btn:hover { background: var(--ink); color: var(--card); }
    .bento-overlay.rollout .bento-body {
      overflow-y: auto;
      flex: 1;
    }
    .bento-overlay.rollout .bento-body table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.7rem;
    }
    .bento-overlay.rollout .bento-body th {
      text-align: left;
      padding: 0.3rem 0.4rem;
      color: var(--ink-light);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: var(--card);
    }
    .bento-overlay.rollout .bento-body td {
      padding: 0.3rem 0.4rem;
      border-bottom: 1px solid var(--border);
      word-break: break-all;
    }
    .bento-overlay.rollout .bento-body .url { max-width: 180px; display: inline-block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-mid); }
    .bento-overlay.rollout .bento-body .badge { font-family: var(--font-mono); font-size: 0.55rem; color: var(--ink-light); background: var(--bg); padding: 0 4px; border-radius: 4px; }
    @media (max-width: 480px) {
      .bento-overlay.rollout { padding: 0; align-items: flex-end; justify-content: stretch; }
      .bento-overlay.rollout .bento-panel {
        width: 100%;
        max-height: 76vh;
        border-radius: var(--radius) var(--radius) 0 0;
        transform: translateY(16px);
        transform-origin: bottom center;
      }
      .bento-overlay.rollout.open .bento-panel { transform: translateY(0); }
    }

    /* ── Media Manager (from media.html) ── */
    .mm-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 1rem;
      margin: 1rem 0;
    }
    .mm-item {
      background: var(--bg);
      border-radius: var(--radius-sm);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--border);
      transition: transform 0.2s, border-color 0.2s;
    }

      const closestSafe = (node, selector) => node && node.nodeType===1 && node.closest ? node.closest(selector) : null;

      function positionFloatingPanel(panel, trigger, opts={}) {
        if (!panel || !trigger) return;
        const margin = opts.margin ?? 10;
        const gap = opts.gap ?? 8;
        const align = opts.align || 'right';
        const triggerRect = trigger.getBoundingClientRect();
        const vw = window.innerWidth, vh = window.innerHeight;
        panel.style.position = 'fixed';
        panel.style.right = 'auto';
        panel.style.bottom = 'auto';
        const panelRect = panel.getBoundingClientRect();
        const pw = panelRect.width, ph = panelRect.height;
        const spaceBelow = vh - triggerRect.bottom - gap;
        const spaceAbove = triggerRect.top - gap;
        let top = ph <= spaceBelow || spaceBelow >= spaceAbove ? triggerRect.bottom + gap : triggerRect.top - gap - ph;
        top = Math.max(margin, Math.min(top, vh - ph - margin));
        let left = align === 'left' ? triggerRect.left : triggerRect.right - pw;
        left = Math.max(margin, Math.min(left, vw - pw - margin));
        panel.style.top = top + 'px';
        panel.style.left = left + 'px';
      }

          const lastDot = name.lastIndexOf('.');
          if (lastDot > 0) name = name.slice(0, lastDot);
          try { name = decodeURIComponent(name); } catch {}
          name = name.replace(/[^a-zA-Z0-9-_]/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '');

          return name;

      function parseCSV(text) {
        const lines = text.split(/\r?\n/).filter(line => line.trim() !== '');
        if (lines.length < 2) return [];
        const header = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, ''));
        const urlIdx = header.indexOf('Original URL');
        const origIdx = header.indexOf('Original Filename');
        const newIdx = header.indexOf('New Filename (no ext)');
        if (urlIdx === -1 || newIdx === -1) return [];
        const result = [];
        for (let i = 1; i < lines.length; i++) {
          const line = lines[i];
          const cols = [];
          let inQuotes = false, current = '';
          for (let ch of line) {
            if (ch === '"') { inQuotes = !inQuotes; continue; }
            if (ch === ',' && !inQuotes) { cols.push(current.trim()); current = ''; continue; }
            current += ch;
          }
          cols.push(current.trim());
          if (cols.length <= Math.max(urlIdx, newIdx)) continue;
          const url = cols[urlIdx].replace(/^"|"$/g, '').trim();
          const newName = cols[newIdx].replace(/^"|"$/g, '').trim();
          if (!url || !newName) continue;
          result.push({
            url, originalName: cols[origIdx] ? cols[origIdx].replace(/^"|"$/g, '').trim() : '',
            newName, type: isVideo(url) ? 'video' : 'image', status: 'pending'
          });
        }
        return result;
      }

      function fetchWithAbort(url, signal) {
        return fetch(url, { mode: 'cors', signal });
      }

      function convertBlobToAvif(blob, quality = 0.5) {
        return new Promise((resolve, reject) => {
          const url = URL.createObjectURL(blob);
          const img = new Image();
          img.onload = function() {
            try {
              const canvas = document.createElement('canvas');
              canvas.width = img.width;
              canvas.height = img.height;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0);
              canvas.toBlob(blob => {
                URL.revokeObjectURL(url);
                if (blob) resolve(blob);
                else reject(new Error('toBlob returned null'));
              }, 'image/avif', quality);
            } catch (err) {
              URL.revokeObjectURL(url);
              reject(err);
            }
          };
          img.onerror = function() {
            URL.revokeObjectURL(url);
            reject(new Error('Failed to load image'));
          };
          img.src = url;
        });
      }

      async function convStartConversion() {
        if (convIsConverting) return;
        if (convRows.length === 0) return;
        const images = convRows.filter(r => r.type === 'image');
        if (images.length === 0) { alert('No images to convert.'); return; }

        convIsConverting = true;
        convCancelRequested = false;
        convEnableUI(false);
        convClearLog();
        convLog(`🔄 Starting conversion of ${images.length} images…`, 'info');
        const progressWrap = document.getElementById('convProgressWrap'); if (progressWrap) progressWrap.classList.add('active');
        convSetProgress(0, 'Starting…');
        convUpdateStatus('⏳ Initializing…');

        const zip = new JSZip();
        let completed = 0, errors = 0;

        const imageIndices = convRows.map((r, i) => r.type === 'image' ? i : -1).filter(i => i >= 0);
        const totalImages = imageIndices.length;

        for (let i = 0; i < imageIndices.length; i++) {
          if (convCancelRequested) { convLog('⏹️ Cancelled by user.', 'info'); break; }

          const idx = imageIndices[i];
          const row = convRows[idx];
          const pct = (i / totalImages) * 100;
          convSetProgress(pct, `Processing ${i+1}/${totalImages}: ${row.newName}`);
          convUpdateStatus(`⬇️ Downloading (${i+1}/${totalImages}): ${row.newName}`);
          convLog(`⬇️ Downloading ${row.newName}`, 'info');

          try {
            const controller = new AbortController();
            const signal = controller.signal;
            const cancelPromise = new Promise((resolve, reject) => {
              const check = () => {
                if (convCancelRequested) { controller.abort(); reject(new Error('Cancelled')); }
                else setTimeout(check, 100);
              };
              check();
            });
            const response = await Promise.race([fetchWithAbort(row.url, signal), cancelPromise]);
            const blob = await response.blob();
            if (convCancelRequested) break;

            convUpdateStatus(`🔄 Converting (${i+1}/${totalImages}): ${row.newName}`);
            convLog(`🔄 Converting ${row.newName} to AVIF`, 'info');

            const avifBlob = await convertBlobToAvif(blob, 0.5);
            if (convCancelRequested) break;

            zip.file(row.newName + '.avif', avifBlob);
            updateConvStatusRow(idx, 'done');
            convLog(`✅ Added ${row.newName}.avif to ZIP`, 'ok');
            completed++;

          } catch (err) {
            if (err.message === 'Cancelled') { convLog('⏹️ Operation cancelled.', 'info'); break; }
            convLog(`❌ Error converting ${row.url}: ${err.message}`, 'err');
            updateConvStatusRow(idx, 'error');
            errors++;
          }
        }

        if (convCancelRequested) convLog('⏹️ Conversion stopped early.', 'info');

        if (zip.files.length > 0) {
          convSetProgress(100, 'Zipping…');
          convUpdateStatus('📦 Generating ZIP…');
          convLog('📦 Generating ZIP file…', 'info');
          try {
            const zipBlob = await zip.generateAsync({ type: 'blob' });
            saveAs(zipBlob, 'converted_avif.zip');
            convLog(`✅ ZIP downloaded with ${completed} files.`, 'ok');
            if (errors > 0) convLog(`⚠️ ${errors} errors occurred.`, 'err');
          } catch (err) {
            convLog(`❌ Failed to create ZIP: ${err.message}`, 'err');
          }
        } else {
          convLog('⚠️ No files were converted. ZIP not created.', 'info');
        }

        if (progressWrap) progressWrap.classList.remove('active');
        convSetProgress(0, 'Done');
        convEnableUI(true);
        convIsConverting = false;
        convUpdateStatus('🏁 Finished');
        convLog('🏁 Conversion finished.', 'info');
        const cancelBtn = document.getElementById('convCancelBtn'); if (cancelBtn) cancelBtn.disabled = true;
        const hudStatusCount = document.getElementById('hudStatusCount');
        if (hudStatusCount) hudStatusCount.textContent = convRows.filter(r => r.type === 'image').length;
      }

      function convCancelConversion() {
        if (!convIsConverting) return;
        convCancelRequested = true;
        const cancelBtn = document.getElementById('convCancelBtn'); if (cancelBtn) cancelBtn.disabled = true;
        convLog('⏹️ Cancelling…', 'info');
        convUpdateStatus('⏹️ Cancelling…');
      }

        saveAs(blob, 'media-rename-map-updated.csv');
      }

      function buildLetterPanel(index, data) {
        const panel = document.createElement('div');
        panel.className = 'letter-panel' + (index === 0 ? ' active' : '');
        panel.dataset.index = String(index);
        panel.dataset.letter = data.letterId || '';

        const frame = document.createElement('div');
        frame.className = 'letter-card-frame';

        const cover = document.createElement('div');
        cover.className = 'letter-cover';
        const label = data.isSpecial ? data.specialLabel || 'SPECIAL' : 'LETTER ' + String(index+1).padStart(2,'0');
        cover.innerHTML = `
          <span class="letter-cover-kicker">${label}</span>
          <h2 class="letter-cover-name">${escapeHtml(data.title)}</h2>
          <p class="letter-cover-deck">${escapeHtml(data.deck || '')}</p>
        `;
        frame.appendChild(cover);

        const toolbar = document.createElement('div');
        toolbar.className = 'letter-toolbar';
        const countEl = document.createElement('span');
        countEl.className = 'letter-count';
        countEl.textContent = data.letterId || 'info';
        toolbar.appendChild(countEl);
        frame.appendChild(toolbar);

        const content = document.createElement('div');
        content.className = 'letter-content';
        frame.appendChild(content);

        panel.appendChild(frame);

        panel.addEventListener('click', () => {
          const idx = Number(panel.dataset.index);
          if (idx !== activeIndex) activatePanel(idx);
        });

        return panel;
      }

      function renderLetter(index) {
        const panels = document.querySelectorAll('.letter-panel');
        if (!panels.length) return;
        const panel = panels[index];
        if (!panel) return;
        const data = letterData[index];
        if (!data) return;

        const frame = panel.querySelector('.letter-card-frame');
        const content = frame.querySelector('.letter-content');
        if (!content) return;

        if (data.letterId === 'media') {
          renderMediaLetter();
        } else if (data.letterId === 'converter') {
          renderConverterLetter();
        } else {
          content.innerHTML = `<div class="sample-letter"><p>This letter is empty.</p></div>`;
        }

        if (index === activeIndex) {
          updateProgressBar();
          const counter = document.getElementById('hudNavCounter');
          if (counter) counter.textContent = `${activeIndex+1}/${letterData.length}`;
        }
      }

      function renderTrack() {
        const track = document.getElementById('lettersTrack');
        track.innerHTML = '';
        letterData.forEach((data, i) => track.appendChild(buildLetterPanel(i, data)));
        renderLetter(0);
        updateProgressBar();
        const counter = document.getElementById('hudNavCounter');
        if (counter) counter.textContent = `1/${letterData.length}`;
      }

      function activatePanel(newIndex) {
        if (newIndex < 0) newIndex = letterData.length - 1;
        if (newIndex >= letterData.length) newIndex = 0;
        if (newIndex === activeIndex) { scrollToPanel(newIndex); updateProgressBar(); return; }
        const panels = document.querySelectorAll('.letter-panel');
        panels.forEach(p => p.classList.remove('active'));
        activeIndex = newIndex;
        panels[activeIndex].classList.add('active');
        renderLetter(activeIndex);
        scrollToPanel(activeIndex);
        updateProgressBar();
        const counter = document.getElementById('hudNavCounter');
        if (counter) counter.textContent = `${activeIndex+1}/${letterData.length}`;
      }

      function scrollToPanel(index) {
        const panel = document.querySelectorAll('.letter-panel')[index];
        if (!panel) return;
        const track = document.getElementById('lettersTrack');
        const trackRect = track.getBoundingClientRect();
        const panelRect = panel.getBoundingClientRect();
        const delta = panelRect.left + panelRect.width/2 - (trackRect.left + trackRect.width/2);
        track.scrollTo({ left: track.scrollLeft + delta, behavior: 'smooth' });
      }

      function updateProgressBar() {
        const fill = document.getElementById('scrollProgressFill');
        const total = letterData.length;
        if (total <= 1) { fill.style.width = '0%'; fill.classList.add('dim'); return; }
        const progress = activeIndex / (total - 1);
        const percent = Math.round(progress * 100);
        fill.style.width = percent + '%';
        fill.classList.remove('dim');
        document.getElementById('scrollProgressBar').setAttribute('aria-valuenow', String(percent));
      }

      // ── Viewport blur ──────────────────────────────────────────
      function setupViewportBlur() {
        const top = document.getElementById('viewportBlurTop'), bottom = document.getElementById('viewportBlurBottom'), hudTop = document.getElementById('hudTop');
        if (!top || !bottom) return;
        function update() {
          const scrollY = window.scrollY || window.pageYOffset || 0;
          const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
          top.classList.toggle('scrolling', scrollY > 4);
          bottom.classList.toggle('scrolling', scrollY < maxScroll - 4);
          if (hudTop) hudTop.classList.toggle('docked', scrollY > 4);
        }
        let ticking = false;
        function onScrollOrResize() { if (ticking) return; ticking = true; requestAnimationFrame(() => { update(); ticking = false; }); }
        window.addEventListener('scroll', onScrollOrResize, { passive: true });
        window.addEventListener('resize', onScrollOrResize);
        update();
      }

      // ── Custom cursor ──────────────────────────────────────────
      (function initWriteCursor() {
        const dot = document.getElementById('writeCursorDot');
        const ellipse = document.getElementById('writeCursorEllipse');
        if (!dot || !ellipse) return;
        const NATIVE_SELECTOR = ['button','a','input','textarea','select','[role="button"]','.letter-hotspot'].join(', ');
        let ptrX=0, ptrY=0, prevFrameX=0, prevFrameY=0, frameInit=false;
        let ellAngle=0, ellScaleX=1, ellScaleY=1, rafId=null;
        const ELLIPSE_LERP = 0.22, SPEED_SATURATE = 34, MAX_STRETCH = 0.6;

        function shortAngleLerp(current,target,factor) { const diff = ((target - current + 540) % 360) - 180; return current + diff * factor; }
        function step() {
          if (!frameInit) { prevFrameX = ptrX; prevFrameY = ptrY; frameInit = true; }
          const dx = ptrX - prevFrameX, dy = ptrY - prevFrameY;
          prevFrameX = ptrX; prevFrameY = ptrY;
          const speed = Math.hypot(dx, dy);
          const angleTarget = speed > 0.4 ? Math.atan2(dy, dx) * (180 / Math.PI) : ellAngle;
          const stretch = Math.min(speed / SPEED_SATURATE, 1) * MAX_STRETCH;
          ellAngle = shortAngleLerp(ellAngle, angleTarget, ELLIPSE_LERP);
          ellScaleX += (1 + stretch - ellScaleX) * ELLIPSE_LERP;
          ellScaleY += (1 - stretch * 0.45 - ellScaleY) * ELLIPSE_LERP;
          ellipse.style.transform = 'translate(' + ptrX + 'px,' + ptrY + 'px) rotate(' + ellAngle + 'deg) scale(' + ellScaleX + ',' + ellScaleY + ')';
          rafId = requestAnimationFrame(step);
        }
        function startLoop() { if (!rafId) rafId = requestAnimationFrame(step); }
        function stopLoop() { if (rafId) { cancelAnimationFrame(rafId); rafId = null; } }
        function hideAll() { dot.classList.remove('visible'); ellipse.classList.remove('visible'); document.body.classList.remove('write-native-cursor','custom-cursor-active'); stopLoop(); }
        window.addEventListener('mousemove', (e) => {
          const overNative = !!(e.target && e.target.nodeType===1 && e.target.closest(NATIVE_SELECTOR));
          document.body.classList.add('custom-cursor-active');
          document.body.classList.toggle('write-native-cursor', overNative);
          ptrX = e.clientX; ptrY = e.clientY;
          dot.style.transform = 'translate(' + ptrX + 'px,' + ptrY + 'px)';
          dot.classList.add('visible');
          ellipse.classList.add('visible');
          startLoop();
        });
        document.addEventListener('mouseleave', hideAll);
      })();

      // ── Init ──────────────────────────────────────────────────
      letterData = [
        { title: 'Media Manager', deck: 'Preview, rename, and map assets.', letterId: 'media' },
        { title: 'AVIF Converter', deck: 'Convert images to .avif from a CSV mapping.', letterId: 'converter' },
      ];

      document.addEventListener('DOMContentLoaded', function() {
        setupViewportBlur();
        renderTrack();

        // ── HUD events ──
        document.getElementById('hudPrev').addEventListener('click', () => activatePanel(activeIndex - 1));
        document.getElementById('hudNext').addEventListener('click', () => activatePanel(activeIndex + 1));
        document.getElementById('letterHotspotPrev').addEventListener('click', () => activatePanel(activeIndex - 1));
        document.getElementById('letterHotspotNext').addEventListener('click', () => activatePanel(activeIndex + 1));

        document.getElementById('hudJumpMedia').addEventListener('click', () => {
          const idx = letterData.findIndex(d => d.letterId === 'media');
          if (idx >= 0) activatePanel(idx);
        });
        document.getElementById('hudJumpConverter').addEventListener('click', () => {
          const idx = letterData.findIndex(d => d.letterId === 'converter');
          if (idx >= 0) activatePanel(idx);
        });

        document.getElementById('topResetBtn').addEventListener('click', function() {
          if (confirm('Reset all data? This will clear media renames and converter demo data.')) {
            mmRenameMap = {};
            saveMmMapping();
            isConverterInitialized = false;
            convRows = [];
            convIsConverting = false;
            convCancelRequested = false;
            if (convTimerInterval) { clearInterval(convTimerInterval); convTimerInterval = null; }
            renderLetter(0);
            renderLetter(1);
            const hudStatusCount = document.getElementById('hudStatusCount');
            if (hudStatusCount) hudStatusCount.textContent = '0';
            const hudStatusText = document.getElementById('hudStatusText');
            if (hudStatusText) hudStatusText.textContent = 'Ready';
          }
        });

        // ── Mapping modal close ──
        document.getElementById('converterMappingClose').addEventListener('click', convCloseMappingModal);
        document.getElementById('converterMappingModal').addEventListener('click', (e) => {
          if (e.target === e.currentTarget) convCloseMappingModal();
        });
        document.getElementById('mediaMappingClose').addEventListener('click', closeMediaMappingModal);
        document.getElementById('mediaMappingModal').addEventListener('click', (e) => {
          if (e.target === e.currentTarget) closeMediaMappingModal();
        });
        document.addEventListener('keydown', (e) => {
          if (e.key === 'Escape') {
            if (document.getElementById('converterMappingModal').classList.contains('open')) convCloseMappingModal();
            if (document.getElementById('mediaMappingModal').classList.contains('open')) closeMediaMappingModal();
            if (document.getElementById('mmLightbox')?.classList.contains('open')) closeMediaLightbox();
          }
          if (e.key === 'ArrowLeft') { activatePanel(activeIndex - 1); e.preventDefault(); }
          if (e.key === 'ArrowRight') { activatePanel(activeIndex + 1); e.preventDefault(); }
        });

        // ── Track drag ──
        const track = document.getElementById('lettersTrack');
        let isDragging = false, dragStartX = 0, dragStartScroll = 0;
        track.addEventListener('pointerdown', (e) => {
          if (e.pointerType === 'touch') return;
          if (closestSafe(e.target, 'button, a, input, .converter-upload, .converter-table-wrap, .mm-item')) return;
          isDragging = true;
          dragStartX = e.clientX;
          dragStartScroll = track.scrollLeft;
          track.classList.add('dragging');
          track.setPointerCapture(e.pointerId);
        });
        track.addEventListener('pointermove', (e) => {
          if (!isDragging) return;
          track.scrollLeft = dragStartScroll - (e.clientX - dragStartX);
        });
        track.addEventListener('pointerup', () => { isDragging = false; track.classList.remove('dragging'); });
        track.addEventListener('pointercancel', () => { isDragging = false; track.classList.remove('dragging'); });

        // ── Scroll settle ──
        let settleTimer = null;
        track.addEventListener('scroll', () => {
          clearTimeout(settleTimer);
          settleTimer = setTimeout(() => {
            const rect = track.getBoundingClientRect();
            const centerX = rect.left + rect.width/2;
            let best=0, bestDist=Infinity;
            Array.from(track.children).forEach((panel, i) => {
              const r = panel.getBoundingClientRect();
              const c = r.left + r.width/2;
              const d = Math.abs(c - centerX);
              if (d < bestDist) { bestDist = d; best = i; }
            });
            if (best !== activeIndex) {
              const panels = track.querySelectorAll('.letter-panel');
              panels.forEach(p => p.classList.remove('active'));
              activeIndex = best;
              panels[best].classList.add('active');
              renderLetter(activeIndex);
              updateProgressBar();
              const counter = document.getElementById('hudNavCounter');
              if (counter) counter.textContent = `${activeIndex+1}/${letterData.length}`;
            } else updateProgressBar();
          }, 150);
        }, { passive: true });

        // ── Initial render ──
        renderLetter(0);
        renderLetter(1);
        const hudStatusCount = document.getElementById('hudStatusCount');
        if (hudStatusCount) hudStatusCount.textContent = convRows.filter(r => r.type === 'image').length;
        const hudStatusText = document.getElementById('hudStatusText');
        if (hudStatusText) hudStatusText.textContent = `${convRows.filter(r => r.type === 'image').length} images ready`;
      });
    })();
  </script>
</body>
</html>
