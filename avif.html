<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>AVIF Media Tool · Craft</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 80'%3E%3Crect width='80' height='80' rx='12' fill='%23E5E567'/%3E%3Ctext x='40' y='50' font-family='system-ui, -apple-system, sans-serif' font-size='28' font-weight='800' text-anchor='middle' fill='%231C1C1E' letter-spacing='-0.5'%3EAVIF%3C/text%3E%3C/svg%3E" />
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@1,2,3,4,5,6,7,8,9&display=swap" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js">
    </script>
    <style>
        /* ── design system ── */
        :root {
            --bg: #f0f0f2;
            --card: #ffffff;
            --card-dark: #1c1c1e;
            --card-mid: #3a3a3c;
            --accent: #e5e567;
            --accent-2: #f5f557;
            --ink: #1c1c1e;
            --ink-mid: #3a3a3c;
            --ink-light: #8e8e93;
            --ink-lighter: #b0b0b6;
            --border: #e6e6e8;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.04);
            --shadow-hover: 0 16px 40px rgba(0, 0, 0, 0.08), 0 4px 12px rgba(0, 0, 0, 0.02);
            --shadow-floating: 0 8px 32px rgba(0, 0, 0, 0.1);
            --radius: 1.5rem;
            --radius-sm: 0.65rem;
            --font: 'Satoshi', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --font-mono: 'JetBrains Mono', 'IBM Plex Mono', monospace;
            --fs-body: 15px;
            --fs-display: 54px;
            --max-width: 1600px;
            --transition: 0.25s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --margin: 16px;
            --topbar-height: 56px;
            --hud-height: 64px;
            --hud-top-height: 44px;
            --scrollbar-height: 3px;
        }
        @media (min-width: 640px) {
            :root {
                --margin: 24px;
                --topbar-height: 64px;
                --hud-height: 70px;
                --hud-top-height: 48px;
            }
        }
        @media (min-width: 1024px) {
            :root {
                --margin: 32px;
                --topbar-height: 72px;
                --hud-height: 76px;
                --hud-top-height: 52px;
            }
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html {
            -webkit-text-size-adjust: 100%;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: var(--bg);
            color: var(--ink);
            font-family: var(--font);
            font-size: var(--fs-body);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            min-height: 100vh;
            min-height: 100dvh;
            padding-bottom: calc(var(--hud-height) + 20px + var(--scrollbar-height));
            overflow-x: hidden;
        }
        ::selection {
            background: var(--accent);
            color: var(--ink);
        }
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--ink-lighter);
            border-radius: var(--radius-sm);
        }
        html {
            scrollbar-width: thin;
            scrollbar-color: var(--ink-lighter) transparent;
        }

        .t-micro {
            font-family: var(--font-mono);
            font-size: 7px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--ink-light);
            line-height: 1.4;
        }
        .btn {
            font-family: var(--font-mono);
            font-size: 8px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--ink-mid);
            padding: 5px 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            border-radius: var(--radius-sm);
            font-weight: 500;
            touch-action: manipulation;
            min-height: 30px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            gap: 6px;
        }
        .btn:hover {
            background: var(--ink);
            color: var(--card);
            border-color: var(--ink);
        }
        .btn:active {
            transform: scale(0.96);
        }
        .btn.ghost {
            border-color: var(--border);
            color: var(--ink-light);
        }
        .btn.ghost:hover {
            background: var(--ink);
            color: var(--card);
            border-color: var(--ink);
        }
        .btn-primary {
            background: var(--ink);
            color: var(--card);
            border-color: var(--ink);
        }
        .btn-primary:hover {
            background: var(--ink-mid);
            border-color: var(--ink-mid);
        }
        .btn-danger {
            background: #d43a3a;
            color: #fff;
            border-color: #d43a3a;
        }
        .btn-danger:hover {
            background: #a00;
            border-color: #a00;
        }
        .btn-danger:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            background: #888;
            border-color: #888;
            transform: none;
        }
        .btn-danger:disabled:hover {
            background: #888;
            border-color: #888;
        }
        .btn.small {
            padding: 3px 8px;
            font-size: 6px;
            min-height: 22px;
        }
        .btn-icon {
            width: 30px;
            padding: 0;
            justify-content: center;
            font-size: 14px;
        }
        .btn-demo {
            background: var(--accent);
            color: var(--ink);
            border-color: var(--accent);
        }
        .btn-demo:hover {
            background: var(--accent-2);
            border-color: var(--accent-2);
            color: var(--ink);
        }
        .btn-success {
            background: #2e7d32;
            color: #fff;
            border-color: #2e7d32;
        }
        .btn-success:hover {
            background: #1b5e20;
            border-color: #1b5e20;
        }
        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }
        .btn:disabled:hover {
            background: transparent;
            color: var(--ink-mid);
            border-color: var(--border);
        }
        .btn-primary:disabled:hover {
            background: var(--ink);
            color: var(--card);
            border-color: var(--ink);
            opacity: 0.4;
        }
        .btn-success:disabled:hover {
            background: #2e7d32;
            border-color: #2e7d32;
            opacity: 0.4;
        }

        /* ── topbar ── */
        .topbar {
            position: sticky;
            top: 0;
            z-index: 150;
            background: transparent;
            padding: 6px 0;
            min-height: var(--topbar-height);
            display: flex;
            align-items: center;
        }
        .topbar .wrap {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 0 var(--margin);
            max-width: var(--max-width);
            margin: 0 auto;
            width: 100%;
        }
        .wordmark {
            font-family: var(--font);
            font-size: clamp(12px, 3.5vw, 20px);
            font-weight: 700;
            letter-spacing: -0.03em;
            display: flex;
            align-items: baseline;
            gap: 6px;
            color: var(--ink);
            flex-shrink: 0;
        }
        .wordmark .count {
            font-family: var(--font-mono);
            font-size: 8px;
            font-weight: 400;
            color: var(--ink-light);
            letter-spacing: 0.04em;
        }
        .wordmark .demo-badge {
            font-family: var(--font-mono);
            font-size: 7px;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            background: var(--accent);
            color: var(--ink);
            padding: 0.1rem 0.6rem;
            border-radius: 12px;
            margin-left: 0.2rem;
            display: none;
        }
        .wordmark .demo-badge.active {
            display: inline-block;
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }
        .topbar-right .btn {
            font-size: 9px;
            min-height: 32px;
            padding: 4px 10px;
        }

        /* ── viewport blur ── */
        .viewport-blur {
            position: fixed;
            left: 0;
            right: 0;
            z-index: 40;
            pointer-events: none;
            backdrop-filter: blur(0px);
            -webkit-backdrop-filter: blur(0px);
            transition: backdrop-filter 0.3s ease, background 0.4s ease;
        }
        .viewport-blur.scrolling {
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(8px);
        }
        .viewport-blur-top {
            top: 0;
            height: calc(var(--topbar-height) + 36px);
            background: linear-gradient(to bottom, rgba(240, 240, 242, 0.7), rgba(240, 240, 242, 0));
            mask-image: linear-gradient(to bottom, black 0%, black 60%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, black 0%, black 60%, transparent 100%);
        }
        .viewport-blur-bottom {
            bottom: 0;
            height: calc(var(--hud-height) + 60px);
            background: linear-gradient(to top, rgba(240, 240, 242, 0.7), rgba(240, 240, 242, 0));
            mask-image: linear-gradient(to top, black 0%, black 45%, transparent 100%);
            -webkit-mask-image: linear-gradient(to top, black 0%, black 45%, transparent 100%);
        }

        /* ── carousel ── */
        .letters-viewport {
            position: relative;
            overflow: hidden;
            width: 100vw;
            left: 50%;
            margin-left: -50vw;
        }
        .letters-track {
            display: flex;
            align-items: flex-start;
            gap: 22px;
            padding-top: clamp(20px, 4vh, 60px);
            padding-bottom: 60px;
            padding-left: max(4vw, calc(50% - 520px));
            padding-right: max(4vw, calc(50% - 520px));
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            cursor: grab;
            user-select: none;
            box-sizing: border-box;
        }
        .letters-track.dragging {
            cursor: grabbing;
            scroll-snap-type: none;
            scroll-behavior: auto;
        }
        .letter-panel {
            flex: 0 0 auto;
            width: min(92vw, 1000px);
            max-width: 1000px;
            scroll-snap-align: center;
            box-sizing: border-box;
            opacity: 0.35;
            transition: opacity 0.3s ease, transform 0.3s ease;
            cursor: pointer;
        }
        .letter-panel.active {
            opacity: 1;
            cursor: auto;
            transform: scale(1);
        }
        .letter-hotspot {
            position: absolute;
            top: 0;
            bottom: 0;
            width: clamp(56px, 9vw, 180px);
            z-index: 20;
        }
        .letter-hotspot-prev {
            left: 0;
            cursor: url('data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%2744%27%20height%3D%2744%27%3E%3Ccircle%20cx%3D%2722%27%20cy%3D%2722%27%20r%3D%2720%27%20fill%3D%27rgba%2820%2C20%2C20%2C0.55%29%27/%3E%3Cpath%20d%3D%27M26%2012%20L16%2022%20L26%2032%27%20fill%3D%27none%27%20stroke%3D%27white%27%20stroke-width%3D%273%27%20stroke-linecap%3D%27round%27%20stroke-linejoin%3D%27round%27/%3E%3C/svg%3E') 22 22, w-resize;
        }
        .letter-hotspot-next {
            right: 0;
            cursor: url('data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%2744%27%20height%3D%2744%27%3E%3Ccircle%20cx%3D%2722%27%20cy%3D%2722%27%20r%3D%2720%27%20fill%3D%27rgba%2820%2C20%2C20%2C0.55%29%27/%3E%3Cpath%20d%3D%27M18%2012%20L28%2022%20L18%2032%27%20fill%3D%27none%27%20stroke%3D%27white%27%20stroke-width%3D%273%27%20stroke-linecap%3D%27round%27%20stroke-linejoin%3D%27round%27/%3E%3C/svg%3E') 22 22, e-resize;
        }

        .letter-card-frame {
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 28px clamp(20px, 3vw, 36px) 40px;
            background: var(--card);
            box-shadow: var(--shadow);
            transition: box-shadow 0.3s ease, transform 0.3s ease;
            position: relative;
        }
        .letter-panel.active .letter-card-frame {
            box-shadow: var(--shadow-hover);
        }
        .letter-panel.active .letter-card-frame:hover {
            box-shadow: 0 24px 56px rgba(0, 0, 0, 0.08), 0 8px 20px rgba(0, 0, 0, 0.04);
            transform: translateY(-2px);
        }
        .letter-cover {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-bottom: 18px;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border);
        }
        .letter-cover-kicker {
            font-family: var(--font-mono);
            font-size: 9px;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--ink-light);
        }
        .letter-cover-name {
            font-family: var(--font);
            font-size: clamp(22px, 3vw, 34px);
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--ink);
        }
        .letter-cover-deck {
            font-family: var(--font);
            font-size: clamp(13px, 1vw, 16px);
            line-height: 1.5;
            color: var(--ink-light);
            max-width: 520px;
        }
        .letter-toolbar {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }
        .letter-toolbar .letter-count {
            font-family: var(--font-mono);
            font-size: 8px;
            color: var(--ink-light);
            margin-left: auto;
        }

        /* ── HUD ── */
        .hud {
            --hud-pad: 6px 12px;
            --hud-gap: 4px;
            --hud-min-h: 44px;
            --hud-btn-min-h: 28px;
            --hud-btn-pad: 3px 10px;
            --hud-btn-fs: 7px;
            --hud-divider-h: 24px;
            --hud-fs-count: 7px;
            --hud-pad-count: 1px 6px;
            --hud-minw-count: 18px;
            --hud-fs-label: 6px;
            position: fixed;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow-floating);
            padding: var(--hud-pad);
            display: flex;
            align-items: center;
            gap: var(--hud-gap);
            transition: box-shadow 0.3s ease, padding 0.2s ease;
            min-height: var(--hud-min-h);
            font-family: var(--font-mono);
        }
        .hud:hover {
            box-shadow: var(--shadow-hover);
        }
        .hud-bottom {
            bottom: calc(12px + var(--scrollbar-height));
            --hud-pad: 10px 18px;
            --hud-gap: 6px;
            --hud-min-h: 56px;
            --hud-btn-min-h: 36px;
            --hud-btn-pad: 7px 14px;
            --hud-btn-fs: 11px;
            --hud-divider-h: 30px;
            --hud-fs-count: 10px;
            --hud-pad-count: 2px 8px;
            --hud-minw-count: 22px;
            --hud-fs-label: 9px;
        }
        .hud-top {
            top: calc(var(--topbar-height) + 12px);
            transition: top 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --hud-btn-pad: 5px 10px;
            --hud-btn-fs: 8px;
        }
        .hud-top.docked {
            top: max(24px, env(safe-area-inset-top));
        }
        .hud-divider {
            width: 1px;
            height: var(--hud-divider-h);
            background: var(--border);
            flex-shrink: 0;
            margin: 0 2px;
        }
        .hud .btn {
            min-height: var(--hud-btn-min-h);
            padding: var(--hud-btn-pad);
            font-size: var(--hud-btn-fs);
            border-radius: var(--radius-sm);
        }
        .hud .filter-count {
            background: var(--ink);
            color: var(--card);
            padding: var(--hud-pad-count);
            border-radius: var(--radius-sm);
            font-family: var(--font-mono);
            font-size: var(--hud-fs-count);
            font-weight: 600;
            min-width: var(--hud-minw-count);
            text-align: center;
        }
        .hud .hud-label {
            font-family: var(--font-mono);
            font-size: var(--hud-fs-label);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--ink-light);
            opacity: 0.5;
            margin-right: 2px;
        }
        .hud-nav-counter {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: var(--ink);
            color: var(--card);
            padding: var(--hud-pad-count);
            border-radius: var(--radius-sm);
            font-family: var(--font-mono);
            font-size: var(--hud-fs-count);
            font-weight: 600;
            min-width: var(--hud-minw-count);
            text-align: center;
        }
        @media (max-width: 640px) {
            .hud-bottom {
                bottom: calc(10px + var(--scrollbar-height));
                --hud-pad: 8px 12px;
                --hud-min-h: 48px;
                --hud-btn-min-h: 30px;
                --hud-btn-pad: 5px 10px;
                --hud-btn-fs: 9px;
                --hud-divider-h: 22px;
                --hud-fs-count: 9px;
                --hud-pad-count: 2px 6px;
                --hud-minw-count: 18px;
                --hud-fs-label: 9px;
            }
            .hud-top {
                top: calc(var(--topbar-height) + 8px);
                --hud-pad: 4px 8px;
                --hud-gap: 3px;
                --hud-min-h: 38px;
                --hud-btn-min-h: 30px;
                --hud-btn-pad: 4px 8px;
                --hud-btn-fs: 7px;
                --hud-divider-h: 16px;
            }
            .hud {
                border-radius: var(--radius-sm);
            }
            .hud .hud-label {
                display: none;
            }
        }
        @media (max-width: 480px) {
            .hud-bottom {
                bottom: calc(8px + var(--scrollbar-height));
                --hud-pad: 6px 10px;
                --hud-gap: 3px;
                --hud-min-h: 42px;
                --hud-btn-min-h: 26px;
                --hud-btn-pad: 4px 8px;
                --hud-btn-fs: 8px;
                --hud-divider-h: 18px;
            }
            .hud-top {
                top: calc(var(--topbar-height) + 6px);
                --hud-pad: 3px 6px;
                --hud-gap: 2px;
                --hud-min-h: 34px;
                --hud-btn-min-h: 28px;
                --hud-btn-pad: 3px 6px;
                --hud-btn-fs: 6px;
                --hud-divider-h: 14px;
            }
        }

        /* ── scroll progress ── */
        .scroll-progress-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: var(--scrollbar-height);
            background: rgba(0, 0, 0, 0.06);
            z-index: 150;
            pointer-events: none;
        }
        .scroll-progress-fill {
            height: 100%;
            width: 0%;
            background: var(--accent);
            transition: width 0.1s ease;
            border-radius: 0 2px 2px 0;
        }
        .scroll-progress-fill.dim {
            opacity: 0.5;
        }

        /* ── custom cursor ── */
        body.custom-cursor-active {
            cursor: none;
        }
        .write-cursor-dot,
        .write-cursor-ellipse {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 500;
            pointer-events: none;
            transform: translate(-9999px, -9999px);
            opacity: 0;
            transition: opacity 0.18s ease;
            will-change: transform;
        }
        .write-cursor-dot.visible,
        .write-cursor-ellipse.visible {
            opacity: 1;
        }
        .write-cursor-dot {
            width: 6px;
            height: 6px;
            margin: -3px 0 0 -3px;
            border-radius: 50%;
            background: var(--ink);
        }
        .write-cursor-ellipse {
            width: 34px;
            height: 34px;
            margin: -17px 0 0 -17px;
            border: 1.5px solid var(--ink);
            border-radius: 50%;
            opacity: 0;
        }
        .write-cursor-ellipse.visible {
            opacity: 0.32;
        }
        body.custom-cursor-active.write-native-cursor {
            cursor: auto;
        }
        .write-native-cursor .write-cursor-dot,
        .write-native-cursor .write-cursor-ellipse {
            opacity: 0 !important;
        }

        /* ── rollout modal (mapping) ── */
        .bento-overlay.rollout {
            position: fixed;
            inset: 0;
            z-index: 400;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: flex-start;
            justify-content: flex-end;
            padding: calc(var(--topbar-height) + 12px) 16px 16px 0;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }
        .bento-overlay.rollout.open {
            opacity: 1;
            pointer-events: auto;
        }
        .bento-overlay.rollout .bento-panel {
            width: min(480px, calc(100vw - 32px));
            max-height: calc(100vh - var(--topbar-height) - 40px);
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow-floating);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            transform: translateY(-8px) scale(0.98);
            transform-origin: top right;
            opacity: 0;
            transition: transform 0.25s cubic-bezier(0.25, 0.46, 0.45, 0.94), opacity 0.2s ease;
        }
        .bento-overlay.rollout.open .bento-panel {
            transform: translateY(0) scale(1);
            opacity: 1;
        }
        .bento-overlay.rollout .bento-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
        }
        .bento-overlay.rollout .bento-header h2 {
            font-family: var(--font);
            font-size: calc(var(--fs-body) * 1.4);
            font-weight: 700;
            letter-spacing: -0.02em;
            margin: 0;
        }
        .bento-overlay.rollout .bento-header .close-btn {
            background: transparent;
            border: 1px solid var(--border);
            width: 36px;
            height: 36px;
            font-size: 16px;
            border-radius: 50%;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .bento-overlay.rollout .bento-header .close-btn:hover {
            background: var(--ink);
            color: var(--card);
        }
        .bento-overlay.rollout .bento-body {
            overflow-y: auto;
            flex: 1;
        }
        .bento-overlay.rollout .bento-body table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.7rem;
        }
        .bento-overlay.rollout .bento-body th {
            text-align: left;
            padding: 0.3rem 0.4rem;
            color: var(--ink-light);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            background: var(--card);
        }
        .bento-overlay.rollout .bento-body td {
            padding: 0.3rem 0.4rem;
            border-bottom: 1px solid var(--border);
            word-break: break-all;
        }
        .bento-overlay.rollout .bento-body .url {
            max-width: 180px;
            display: inline-block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: var(--ink-mid);
        }
        .bento-overlay.rollout .bento-body .badge {
            font-family: var(--font-mono);
            font-size: 0.55rem;
            color: var(--ink-light);
            background: var(--bg);
            padding: 0 4px;
            border-radius: 4px;
        }
        @media (max-width: 480px) {
            .bento-overlay.rollout {
                padding: 0;
                align-items: flex-end;
                justify-content: stretch;
            }
            .bento-overlay.rollout .bento-panel {
                width: 100%;
                max-height: 76vh;
                border-radius: var(--radius) var(--radius) 0 0;
                transform: translateY(16px);
                transform-origin: bottom center;
            }
            .bento-overlay.rollout.open .bento-panel {
                transform: translateY(0);
            }
        }

        /* ── Media Manager ── */
        .mm-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 1rem;
            margin: 1rem 0;
        }
        .mm-item {
            background: var(--bg);
            border-radius: var(--radius-sm);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border);
            transition: transform 0.2s, border-color 0.2s;
            position: relative;
        }
        .mm-item:hover {
            transform: translateY(-2px);
            border-color: var(--ink);
        }
        .mm-item .mm-media-wrap {
            position: relative;
            width: 100%;
            padding-top: 75%;
            background: var(--card-dark);
            overflow: hidden;
            cursor: pointer;
        }
        .mm-item .mm-media-wrap img,
        .mm-item .mm-media-wrap video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .mm-item .mm-info {
            padding: 0.3rem 0.6rem 0.1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.2rem;
            background: var(--card);
            border-bottom: 1px solid var(--border);
        }
        .mm-item .mm-info .type {
            text-transform: uppercase;
            font-weight: 600;
            font-size: 0.55rem;
            letter-spacing: 0.04em;
            background: var(--bg);
            padding: 0.1rem 0.5rem;
            border-radius: 12px;
            color: var(--ink-light);
        }
        .mm-item .mm-info .domain {
            font-size: 0.55rem;
            opacity: 0.6;
            max-width: 100px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .mm-item .mm-rename {
            padding: 0.3rem 0.6rem 0.5rem;
            background: var(--card);
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }
        .mm-item .mm-rename label {
            font-size: 0.6rem;
            color: var(--ink-light);
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .mm-item .mm-rename input {
            flex: 1;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 0.2rem 0.4rem;
            color: var(--ink);
            font-size: 0.7rem;
            font-family: var(--font-mono);
            outline: none;
            transition: border 0.2s, background 0.2s;
            min-width: 0;
        }
        .mm-item .mm-rename input:focus {
            border-color: var(--ink);
            background: var(--card);
        }
        .mm-item .mm-rename .ext-hint {
            font-size: 0.6rem;
            color: var(--ink-light);
            white-space: nowrap;
        }
        .mm-item .mm-delete {
            position: absolute;
            top: 6px;
            right: 6px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: none;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            font-size: 14px;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s, background 0.2s;
            padding: 0;
            z-index: 5;
            backdrop-filter: blur(4px);
        }
        .mm-item:hover .mm-delete {
            opacity: 1;
        }
        .mm-item .mm-delete:hover {
            background: #d43a3a;
        }

        .mm-filter-group {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.3rem 0.6rem;
            margin: 0.5rem 0 1rem;
        }
        .mm-filter-group .label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--ink-light);
        }
        .mm-filter-group button {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--ink-mid);
            padding: 0.2rem 1rem;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.75rem;
            transition: 0.2s;
        }
        .mm-filter-group button.active {
            background: var(--ink);
            color: var(--card);
            border-color: var(--ink);
        }
        .mm-filter-group button:hover {
            border-color: var(--ink);
            color: var(--ink);
        }
        .mm-filter-group button.active:hover {
            background: var(--ink-mid);
            border-color: var(--ink-mid);
        }

        .mm-stats {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin: 0.5rem 0;
        }
        .mm-stats .badge {
            background: var(--bg);
            padding: 0.2rem 1rem;
            border-radius: 30px;
            font-size: 0.8rem;
            border: 1px solid var(--border);
        }
        .mm-stats .badge span {
            font-weight: 600;
            color: var(--ink);
        }
        .mm-stats .badge.demo-badge {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--ink);
        }

        .mm-lightbox {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            padding: 2rem;
        }
        .mm-lightbox.open {
            opacity: 1;
            pointer-events: auto;
        }
        .mm-lightbox img,
        .mm-lightbox video {
            max-width: 90vw;
            max-height: 85vh;
            border-radius: 8px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            object-fit: contain;
        }
        .mm-lightbox .close {
            position: fixed;
            top: 1.5rem;
            right: 2rem;
            font-size: 2rem;
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            opacity: 0.6;
            transition: 0.2s;
        }
        .mm-lightbox .close:hover {
            opacity: 1;
        }
        .mm-lightbox .caption {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6);
            padding: 0.4rem 1.2rem;
            border-radius: 30px;
            font-size: 0.75rem;
            color: #ccc;
            max-width: 80vw;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .mm-actions {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
            margin: 0.5rem 0;
        }
        .mm-actions .btn {
            font-size: 0.7rem;
            padding: 0.3rem 0.9rem;
        }

        /* ── Upload area for image list ── */
        .mm-upload-area {
            border: 2px dashed var(--border);
            border-radius: var(--radius-sm);
            padding: 1.5rem;
            text-align: center;
            margin-bottom: 1.5rem;
            transition: border-color 0.3s, background 0.3s;
            cursor: pointer;
        }
        .mm-upload-area:hover {
            border-color: var(--ink);
            background: var(--bg);
        }
        .mm-upload-area textarea {
            width: 100%;
            min-height: 80px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 0.5rem;
            font-family: var(--font-mono);
            font-size: 0.7rem;
            color: var(--ink);
            resize: vertical;
            margin-top: 0.5rem;
        }
        .mm-upload-area textarea:focus {
            outline: none;
            border-color: var(--ink);
        }
        .mm-upload-area .upload-actions {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 0.5rem;
        }
        .mm-upload-area .upload-actions .btn {
            font-size: 0.7rem;
            padding: 0.3rem 1rem;
        }
        .mm-upload-area .upload-actions input[type="file"] {
            display: none;
        }
        .mm-upload-area .hint {
            font-size: 0.65rem;
            color: var(--ink-light);
            margin-top: 0.3rem;
        }
        .mm-upload-area .badge-count {
            font-family: var(--font-mono);
            font-size: 0.7rem;
            background: var(--bg);
            padding: 0.15rem 0.6rem;
            border-radius: 12px;
            border: 1px solid var(--border);
            color: var(--ink-mid);
        }

        /* ── Bulk Rename Modal ── */
        .bento-overlay.centered {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
            padding: 1rem;
        }
        .bento-overlay.centered.open {
            opacity: 1;
            pointer-events: auto;
        }
        .bento-overlay.centered .bento-panel {
            width: min(500px, 100%);
            max-height: 90vh;
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow-floating);
            padding: 24px;
            transform: scale(0.96);
            transition: transform 0.25s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        .bento-overlay.centered.open .bento-panel {
            transform: scale(1);
        }
        .bento-overlay.centered .field {
            margin-bottom: 12px;
        }
        .bento-overlay.centered .field label {
            display: block;
            font-family: var(--font-mono);
            font-size: 7px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--ink-light);
            margin-bottom: 3px;
        }
        .bento-overlay.centered .field input {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 6px 10px;
            font-family: var(--font);
            font-size: calc(var(--fs-body) * 0.85);
            color: var(--ink);
        }
        .bento-overlay.centered .field input:focus {
            outline: none;
            border-color: var(--ink);
        }
        .bento-overlay.centered .bulk-preview {
            background: var(--bg);
            border-radius: var(--radius-sm);
            padding: 8px 12px;
            font-size: 0.7rem;
            color: var(--ink-mid);
            max-height: 120px;
            overflow-y: auto;
            margin-top: 8px;
            border: 1px solid var(--border);
        }
        .bento-overlay.centered .bulk-preview .preview-item {
            padding: 2px 0;
            border-bottom: 1px solid var(--border);
            font-family: var(--font-mono);
        }
        .bento-overlay.centered .bulk-preview .preview-item:last-child {
            border-bottom: none;
        }
        .bento-overlay.centered .bulk-preview .arrow {
            color: var(--ink-light);
            margin: 0 4px;
        }
        .bento-overlay.centered .bento-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            margin-top: 16px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
        }

        /* ── Converter ── */
        .converter-upload {
            border: 2px dashed var(--border);
            border-radius: var(--radius-sm);
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.3s, background 0.3s;
            margin-bottom: 1.5rem;
        }
        .converter-upload:hover {
            border-color: var(--ink);
            background: var(--bg);
        }
        .converter-upload input[type="file"] {
            display: none;
        }
        .converter-upload .icon {
            font-size: 2.4rem;
            margin-bottom: 0.4rem;
        }
        .converter-upload .label {
            font-size: 0.9rem;
            color: var(--ink-light);
        }
        .converter-upload .label strong {
            color: var(--ink);
        }

        .converter-settings {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: center;
            padding: 0.5rem 0;
            margin-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }
        .converter-settings .setting {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .converter-settings .setting label {
            font-family: var(--font-mono);
            font-size: 7px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--ink-light);
            white-space: nowrap;
        }
        .converter-settings .setting input[type="range"] {
            width: 120px;
            accent-color: var(--ink);
        }
        .converter-settings .setting .value {
            font-family: var(--font-mono);
            font-size: 8px;
            color: var(--ink);
            min-width: 28px;
            text-align: center;
        }

        .converter-stats {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin: 0.5rem 0 1rem;
        }
        .converter-stats .badge {
            background: var(--bg);
            padding: 0.2rem 1rem;
            border-radius: 30px;
            font-size: 0.8rem;
            border: 1px solid var(--border);
        }
        .converter-stats .badge span {
            font-weight: 600;
            color: var(--ink);
        }

        .converter-table-wrap {
            overflow-x: auto;
            max-height: 350px;
            overflow-y: auto;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--bg);
            margin: 1rem 0;
        }
        .converter-table-wrap table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.75rem;
        }
        .converter-table-wrap th {
            background: var(--card);
            text-align: left;
            padding: 0.4rem 0.8rem;
            position: sticky;
            top: 0;
            z-index: 2;
            color: var(--ink-light);
            font-weight: 500;
            border-bottom: 1px solid var(--border);
        }
        .converter-table-wrap td {
            padding: 0.4rem 0.8rem;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
            word-break: break-all;
        }
        .converter-table-wrap td .url {
            max-width: 220px;
            display: inline-block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: var(--ink-mid);
        }
        .converter-table-wrap .status-col {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .status-col.pending {
            color: var(--ink-light);
        }
        .status-col.downloading {
            color: #0d47a1;
        }
        .status-col.converting {
            color: #f57c00;
        }
        .status-col.done {
            color: #2e7d32;
        }
        .status-col.error {
            color: #c62828;
        }
        .status-col.skipped {
            color: #f57c00;
        }

        .conv-progress-wrap {
            width: 60px;
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            overflow: hidden;
            display: inline-block;
            vertical-align: middle;
            margin-right: 6px;
        }
        .conv-progress-wrap .conv-progress-bar {
            height: 100%;
            width: 0%;
            background: var(--accent);
            transition: width 0.15s ease;
        }

        .converter-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            align-items: center;
            margin-top: 0.5rem;
        }
        .converter-progress-wrap-global {
            width: 100%;
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            overflow: hidden;
            margin: 0.5rem 0;
            display: none;
        }
        .converter-progress-wrap-global.active {
            display: block;
        }
        .converter-progress-bar-global {
            height: 100%;
            width: 0%;
            background: var(--accent);
            transition: width 0.2s ease;
        }
        .converter-status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.4rem;
            font-size: 0.8rem;
            color: var(--ink-light);
            margin: 0.4rem 0;
        }
        .converter-status-bar .current {
            color: var(--ink);
            font-weight: 500;
        }
        .converter-status-bar .elapsed {
            font-family: var(--font-mono);
            font-size: 0.7rem;
        }

        .converter-log {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 0.5rem 0.8rem;
            max-height: 120px;
            overflow-y: auto;
            font-family: var(--font-mono);
            font-size: 0.65rem;
            color: var(--ink-light);
            margin-top: 0.5rem;
            display: none;
        }
        .converter-log.active {
            display: block;
        }
        .converter-log .entry {
            padding: 0.1rem 0;
            border-bottom: 1px solid var(--border);
        }
        .converter-log .entry .ok {
            color: #2e7d32;
        }
        .converter-log .entry .err {
            color: #c62828;
        }
        .converter-log .entry .info {
            color: #0d47a1;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 4px;
            vertical-align: middle;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .empty-state {
            text-align: center;
            padding: 2rem 0;
            color: var(--ink-light);
        }
        .empty-state .icon {
            font-size: 2.4rem;
            margin-bottom: 0.5rem;
        }
        .empty-state .title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--ink);
            margin-bottom: 0.3rem;
        }
        .empty-state .sub {
            font-size: 0.85rem;
            color: var(--ink-light);
        }

        /* ── Inline CSV export helper ── */
        .csv-export-row {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            flex-wrap: wrap;
            margin: 0.5rem 0 0.5rem;
            padding: 0.5rem 0.8rem;
            background: var(--bg);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
        }
        .csv-export-row .label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--ink-light);
        }
        .csv-export-row .btn {
            font-size: 0.7rem;
            padding: 0.2rem 0.9rem;
        }

        @media (max-width: 640px) {
            .letter-card-frame {
                padding: 16px 14px 28px;
                border-radius: var(--radius-sm);
            }
            .mm-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 0.7rem;
            }
            .converter-upload {
                padding: 1.5rem;
            }
            .converter-table-wrap {
                max-height: 200px;
            }
            .converter-table-wrap th,
            .converter-table-wrap td {
                padding: 0.3rem 0.5rem;
                font-size: 0.65rem;
            }
            .mm-upload-area textarea {
                min-height: 60px;
            }
            .converter-settings .setting input[type="range"] {
                width: 80px;
            }
            .csv-export-row {
                flex-direction: column;
                align-items: stretch;
            }
        }
        @media (max-width: 480px) {
            .mm-grid {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            }
            .converter-controls .btn {
                font-size: 7px;
                padding: 4px 8px;
                min-height: 24px;
            }
        }

            function positionFloatingPanel(panel, trigger, opts = {}) {
                if (!panel || !trigger) return;
                const margin = opts.margin ?? 10;
                const gap = opts.gap ?? 8;
                const align = opts.align || 'right';
                const triggerRect = trigger.getBoundingClientRect();
                const vw = window.innerWidth,
                    vh = window.innerHeight;
                panel.style.position = 'fixed';
                panel.style.right = 'auto';
                panel.style.bottom = 'auto';
                const panelRect = panel.getBoundingClientRect();
                const pw = panelRect.width,
                    ph = panelRect.height;
                const spaceBelow = vh - triggerRect.bottom - gap;
                const spaceAbove = triggerRect.top - gap;
                let top = ph <= spaceBelow || spaceBelow >= spaceAbove ? triggerRect.bottom + gap : triggerRect.top -
                    gap - ph;
                top = Math.max(margin, Math.min(top, vh - ph - margin));
                let left = align === 'left' ? triggerRect.left : triggerRect.right - pw;
                left = Math.max(margin, Math.min(left, vw - pw - margin));
                panel.style.top = top + 'px';
                panel.style.left = left + 'px';
            }

                        if (!text) { alert('Paste some URLs first.'); return; }
                        const lines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l && (l.startsWith(
                            'http://') || l.startsWith('https://')));
                        if (lines.length === 0) { alert('No valid URLs found.'); return; }
                        const existing = new Set(mmUrls);
                        let added = 0;
                        lines.forEach(url => {
                            if (!existing.has(url)) { existing.add(url);
                                added++; }
                        });
                        mmUrls = Array.from(existing);
                        isDemoLoaded = false;
                        saveUrls();
                        urlInput.value = lines.join('\n');
                        renderMediaLetter();
                        syncConverterFromMedia();
                        updateDemoBadge();
                        updateHudStatus();
                    });

                if (fileBtn) {
                    fileBtn.addEventListener('click', () => fileInput.click());

                    fileInput.addEventListener('change', function(e) {
                        const file = this.files[0];
                        if (!file) return;
                        const reader = new FileReader();
                        reader.onload = function(ev) {
                            urlInput.value = ev.target.result;
                            loadBtn.click();
                        };
                        reader.readAsText(file);
                        this.value = '';
                    });
                }

                if (demoBtn) {
                    demoBtn.addEventListener('click', function() {
                        if (mmUrls.length > 0 && !confirm('Load demo data? This will replace your current image list.'

                content.querySelectorAll('.mm-filter-group button').forEach(btn => {
                    btn.addEventListener('click', function() {
                        if (this.dataset.mmType) {
                            mmCurrentType = this.dataset.mmType;

                            mmCurrentSource = this.dataset.mmSource;

                });

                content.querySelectorAll('.mm-rename input').forEach(inp => {
                    inp.addEventListener('input', function() {

                        if (val && val !== '') {
                            mmRenameMap[url] = val;
                        } else {
                            delete mmRenameMap[url];
                        }
                        saveMmMapping();
                        // Also update convRows if they exist
                        const row = convRows.find(r => r.url === url);
                        if (row) {
                            row.newName = mmRenameMap[url] || getBaseName(url);
                        }
                    });
                });

                content.querySelectorAll('.mm-media-wrap').forEach(wrap => {
                    wrap.addEventListener('click', function() {
                        const url = this.dataset.url;
                        const type = this.dataset.type;
                        openMediaLightbox(url, type);
                    });
                });

                // ── Delete individual item ──
                content.querySelectorAll('.mm-delete').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const url = this.dataset.url;
                        if (!url) return;
                        if (!confirm(`Remove this item from the list?`)) return;
                        mmUrls = mmUrls.filter(u => u !== url);
                        delete mmRenameMap[url];
                        saveUrls();
                        saveMmMapping();
                        renderMediaLetter();
                        syncConverterFromMedia();
                        updateHudStatus();
                        updateDemoBadge();
                    });
                });

                const showMapping = content.querySelector('#mmShowMapping');
                if (showMapping) showMapping.addEventListener('click', openMediaMappingModal);

                const clearNames = content.querySelector('#mmClearNames');
                if (clearNames) clearNames.addEventListener('click', function() {
                    if (confirm('Clear all custom names?')) {
                        mmRenameMap = {};
                        saveMmMapping();
                        renderMediaLetter();
                        syncConverterFromMedia();
                    }
                });

                const clearAll = content.querySelector('#mmClearAll');
                if (clearAll) clearAll.addEventListener('click', function() {
                    if (confirm('Remove all images from the list?')) {
                        clearAllImages();
                    }
                });

                // ── Bulk Rename ──
                const bulkBtn = content.querySelector('#mmBulkRename');
                if (bulkBtn) bulkBtn.addEventListener('click', openBulkRenameModal);

                // ── Export CSV ──

                // ── Sync to Converter ──

                if (syncBtn) {

                        // Jump to converter letter
                        const idx = letterData.findIndex(d => d.letterId === 'converter');
                        if (idx >= 0) activatePanel(idx);

            function updateBulkPreview() {
                const prefix = document.getElementById('bulkPrefix').value;
                const suffix = document.getElementById('bulkSuffix').value;
                const find = document.getElementById('bulkFind').value;
                const replace = document.getElementById('bulkReplace').value;
                const previewEl = document.getElementById('bulkPreview');

                    return;
                }

                let html = '';
                samples.forEach(url => {

                    if (prefix) newName = prefix + newName;

                    html +=
                        `<div class="preview-item"><span>${escapeHtml(base)}</span><span class="arrow">→</span><span>${escapeHtml(newName)}</span></div>`;
