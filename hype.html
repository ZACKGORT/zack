<style>
:root{--bg:#000;--fg:#f5f5f7;--mute:#86868b;--blue:#2997ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box;margin:0}
body{height:100%;background:radial-gradient(ellipse 60% 55% at 50% 50%,#0f1319 0,#000 75%);color:var(--fg);font-family:"Satoshi","Manrope",-apple-system,"Helvetica Neue",Arial,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0;opacity:0;transition:opacity 1.2s}canvas.on{opacity:1}
.bx{position:fixed;left:0;right:0;height:7vh;background:#000;z-index:4}.bx.t{top:0}.bx.b{bottom:0}
.cap{position:fixed;left:0;right:0;bottom:calc(9.5vh + env(safe-area-inset-bottom,0px));text-align:center;padding:0 6vw;opacity:0;transform:translateY(26px);filter:blur(8px);transition:opacity .9s,transform .9s cubic-bezier(.2,.8,.2,1),filter .9s;z-index:5;pointer-events:none;text-shadow:0 2px 30px #000}
.cap.on{opacity:1;transform:none;filter:none}
.cap h2{font-size:clamp(32px,6vw,84px);font-weight:800;letter-spacing:-.04em;line-height:1.03}
.cap p{font-size:clamp(16px,1.9vw,26px);color:#a1a1a9;margin-top:10px;font-weight:500;letter-spacing:-.01em}
.g{background:linear-gradient(100deg,#fff,#8ec1ff 55%,#ffd48a);-webkit-background-clip:text;background-clip:text;color:transparent}
.xl{position:fixed;left:0;top:0;z-index:4;pointer-events:none;font-size:14px;font-weight:600;color:#c7c8d0;white-space:nowrap;opacity:0;will-change:transform,opacity;letter-spacing:-.005em;transition:color .3s}
.xl span{display:block;transform:translateX(-50%);padding:0 2px;transition:transform .3s}.xl::after{content:"";position:absolute;left:0;width:1px;height:16px;background:#8a8b93}.xl.u::after{top:100%}.xl.d::after{bottom:100%}
.xl.hot{color:#fff}.xl.hot span{transform:translateX(-50%) scale(1.35)}.xl.hot::after{background:var(--blue);width:2px}
@media(max-width:820px){.xl{font-size:11px}}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:9}
#veil{position:fixed;inset:0;background:#000;pointer-events:none;z-index:8}
#bar{position:fixed;left:0;bottom:0;height:3px;background:var(--blue);width:0;z-index:10}
#start{position:fixed;inset:0;z-index:20;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;cursor:pointer;text-align:center}
#start .pl{width:104px;height:104px;border-radius:50%;border:3px solid #c9c9d0;display:grid;place-items:center;transition:transform .3s}
#start:hover .pl{transform:scale(1.08)}
#start .pl::after{content:"";border-left:28px solid #fff;border-top:17px solid transparent;border-bottom:17px solid transparent;margin-left:8px}
#start p{font-size:32px;font-weight:800;letter-spacing:-.03em}#start small{font-size:16px;color:var(--mute)}
#again{position:fixed;top:calc(9vh + env(safe-area-inset-top,0px));right:24px;z-index:11;background:rgba(255,255,255,.08);border:1px solid #444;color:#ddd;border-radius:980px;padding:8px 18px;font:600 15px inherit;cursor:pointer;display:none}
