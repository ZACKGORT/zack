<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Media Manager – Rename & Map</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #0f0f12;
            color: #f0f0f2;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            padding: 1.5rem;
            min-height: 100vh;
        }
        header {
            max-width: 1400px;
            margin: 0 auto 1.5rem;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: baseline;
            gap: 0.75rem;
        }
        .header-left {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 0.5rem 1rem;
        }
        h1 {
            font-weight: 600;
            font-size: 1.6rem;
            letter-spacing: -0.01em;
        }
        .stats {
            font-size: 0.9rem;
            color: #8e8e93;
        }
        .stats span {
            background: #2c2c2e;
            padding: 0.2rem 0.8rem;
            border-radius: 20px;
            margin-left: 0.3rem;
        }
        .header-actions {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
        }
        .btn {
            background: #2c2c2e;
            border: 1px solid #3a3a3c;
            color: #e0e0e2;
            padding: 0.3rem 1.2rem;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: 0.2s;
            white-space: nowrap;
        }
        .btn-primary {
            background: #3D6BEF;
            border-color: #3D6BEF;
            color: white;
        }
        .btn-primary:hover {
            background: #5a7bef;
        }
        .btn:hover {
            background: #3a3a3c;
        }
        .btn-primary:hover {
            background: #5a7bef;
        }
        .filter-group {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.3rem 0.6rem;
            margin-top: 0.3rem;
        }
        .filter-group .label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: #6e6e73;
        }
        .filter-group button {
            background: #2c2c2e;
            border: 1px solid #3a3a3c;
            color: #e0e0e2;
            padding: 0.2rem 1rem;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.75rem;
            transition: 0.2s;
        }
        .filter-group button.active {
            background: #3D6BEF;
            border-color: #3D6BEF;
            color: white;
        }
        .filter-group button:hover {
            background: #3a3a3c;
        }
        .filter-group button.active:hover {
            background: #5a7bef;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 1rem;
            max-width: 1400px;
            margin: 0 auto;
        }
        .item {
            background: #1c1c1e;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid #2c2c2e;
            transition: transform 0.2s, border-color 0.2s;
        }
        .item:hover {
            transform: translateY(-2px);
            border-color: #3D6BEF;
        }
        .item .media-wrap {
            position: relative;
            width: 100%;
            padding-top: 75%;
            background: #0a0a0c;
            overflow: hidden;
            cursor: pointer;
        }
        .item .media-wrap img,
        .item .media-wrap video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .item .media-wrap video {
            background: #000;
        }
        .item .info {
            padding: 0.3rem 0.6rem 0.1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.2rem;
            background: #1c1c1e;
            border-bottom: 1px solid #2a2a2c;
        }
        .item .info .type {
            text-transform: uppercase;
            font-weight: 600;
            font-size: 0.55rem;
            letter-spacing: 0.04em;
            background: #2c2c2e;
            padding: 0.1rem 0.5rem;
            border-radius: 12px;
            color: #8e8e93;
        }
        .item .info .domain {
            font-size: 0.55rem;
            opacity: 0.6;
            max-width: 100px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .item .rename {
            padding: 0.3rem 0.6rem 0.5rem;
            background: #1c1c1e;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }
        .item .rename label {
            font-size: 0.6rem;
            color: #6e6e73;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .item .rename input {
            flex: 1;
            background: #2a2a2c;
            border: 1px solid transparent;
            border-radius: 6px;
            padding: 0.2rem 0.4rem;
            color: #f0f0f2;
            font-size: 0.7rem;
            font-family: monospace;
            outline: none;
            transition: border 0.2s, background 0.2s;
            min-width: 0;
        }
        .item .rename input:focus {
            border-color: #3D6BEF;
            background: #222;
        }
        .item .rename input::placeholder {
            color: #5e5e63;
        }
        .item .rename .ext-hint {
            font-size: 0.6rem;
            color: #5e5e63;
            white-space: nowrap;
        }

        /* Lightbox */
        .lightbox {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            padding: 2rem;
        }
        .lightbox.open {
            opacity: 1;
            pointer-events: auto;
        }
        .lightbox img,
        .lightbox video {
            max-width: 90vw;
            max-height: 85vh;
            border-radius: 8px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            object-fit: contain;
        }
        .lightbox .close {
            position: fixed;
            top: 1.5rem;
            right: 2rem;
            font-size: 2rem;
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            opacity: 0.6;
            transition: 0.2s;
        }
        .lightbox .close:hover {
            opacity: 1;
        }
        .lightbox .caption {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6);
            padding: 0.4rem 1.2rem;
            border-radius: 30px;
            font-size: 0.75rem;
            color: #ccc;
            max-width: 80vw;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Mapping Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(6px);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .modal-overlay.open {
            display: flex;
        }
        .modal {
            background: #1c1c1e;
            border: 1px solid #2c2c2e;
            border-radius: 16px;
            max-width: 1200px;
            width: 100%;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem 1rem;
            margin-bottom: 1rem;
        }
        .modal-header h2 {
            font-weight: 600;
            font-size: 1.2rem;
        }
        .modal-header .actions {
            display: flex;
            gap: 0.6rem;
        }
        .modal-body {
            overflow-y: auto;
            flex: 1;
        }
        .modal-body table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.75rem;
        }
        .modal-body th {
            text-align: left;
            padding: 0.4rem 0.6rem;
            color: #8e8e93;
            font-weight: 500;
            border-bottom: 1px solid #2c2c2e;
            position: sticky;
            top: 0;
            background: #1c1c1e;
            z-index: 2;
        }
        .modal-body td {
            padding: 0.4rem 0.6rem;
            border-bottom: 1px solid #262628;
            vertical-align: middle;
            word-break: break-all;
        }
        .modal-body .old-url {
            color: #9e9ea3;
            max-width: 300px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            display: block;
        }
        .modal-body .new-name {
            font-family: monospace;
            color: #f0f0f2;
        }
        .modal-body .new-name .ext {
            color: #6e6e73;
        }
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 4rem 1rem;
            color: #6e6e73;
            font-size: 1rem;
        }
        .badge {
            background: #2c2c2e;
            padding: 0.15rem 0.6rem;
            border-radius: 12px;
            font-size: 0.6rem;
            color: #8e8e93;
            white-space: nowrap;
        }

        @media (max-width: 600px) {
            .grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 0.7rem;
            }
            header {
                flex-direction: column;
                align-items: stretch;
            }
            .modal {
                padding: 1rem;
            }
            .modal-body td,
            .modal-body th {
                font-size: 0.65rem;
                padding: 0.3rem 0.4rem;
            }
        }
    </style>
</head>

<header>
    <div class="header-left">
        <h1>📸 Media Manager</h1>
        <div class="stats">
            <span id="totalCount">0</span>
            <span id="imageCount">0</span>
            <span id="videoCount">0</span>
        </div>
    </div>
    <div class="header-actions">
        <button class="btn btn-primary" id="showMappingBtn">📋 Mapping List</button>
        <button class="btn" id="clearNamesBtn">✕ Clear all renames</button>
    </div>
</header>

<div style="max-width:1400px;margin:0 auto 1rem;">
    <div class="filter-group">
        <span class="label">Type</span>
        <button class="active" data-filter-type="all">All</button>
        <button data-filter-type="image">Images</button>
        <button data-filter-type="video">Videos</button>
        <span style="width:1rem;"></span>
        <span class="label">Source</span>
        <button class="active" data-filter-source="all">All</button>
        <button data-filter-source="i.ibb.co">ImageBB</button>
        <button data-filter-source="miro.medium.com">Miro</button>
        <button data-filter-source="raw.githubusercontent.com">GitHub</button>
    </div>
</div>

<div class="grid" id="grid"></div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">
    <button class="close" id="lightboxClose">✕</button>
    <div id="lightboxContent"></div>
    <div class="caption" id="lightboxCaption"></div>
</div>

<!-- Mapping Modal -->
<div class="modal-overlay" id="mappingModal">
    <div class="modal">
        <div class="modal-header">
            <h2>📋 Old → New Name Mapping</h2>
            <div class="actions">
                <button class="btn" id="downloadCsvBtn">⬇ Download CSV</button>
                <button class="btn" id="closeMappingBtn">✕ Close</button>
            </div>
        </div>
        <div class="modal-body" id="mappingBody">
            <p style="color:#6e6e73;padding:1rem 0;">Loading mapping…</p>
        </div>
    </div>
</div>

            "https://miro.medium.com/v2/resize:fit:1100/format:webp/1*RTEI5aCcw31fjFzqjBgFEg.png",
            "https://miro.medium.com/v2/resize:fit:4000/format:webp/1*xQoqrV021PFk0sxts5AWAg.png",
            "https://miro.medium.com/v2/resize:fit:1100/format:webp/1*1gjrEffBioJYoEAvMWHfKQ.png",
            "https://miro.medium.com/v2/resize:fit:2000/format:webp/1*gC_cmPMoCAMgckq051lwZg.png",
            "https://miro.medium.com/v2/resize:fit:1400/format:webp/1*UATKEet6VtcLkA8rYspjFQ.png",
            "https://miro.medium.com/v2/resize:fit:720/format:webp/1*KF8S3mjG-LyygktGkM10Kg.jpeg",
            "https://miro.medium.com/v2/resize:fit:720/format:webp/1*iP-y0X1WqN9WLw_Y-w-evQ.jpeg",
            "https://miro.medium.com/v2/resize:fit:720/format:webp/1*fQX6x7lVSHT4XJxpApkBfg.jpeg",
            "https://miro.medium.com/v2/resize:fit:720/format:webp/1*Fpw92LFkhtWU0eFuRAKqVg.jpeg",
            "https://miro.medium.com/v2/resize:fit:720/format:webp/1*O3ydblRDwhoq24nxcOKolw.jpeg",
            "https://raw.githubusercontent.com/ZACKGORT/ZACKGORT/main/waitingontheworldtochange_zackgort_v1720p.mp4",
            "https://raw.githubusercontent.com/ZACKGORT/ifimaybefrank/main/mp4/nothingelsematterswolfgang720.mp4"
        ];

        const uniqueUrls = [...new Set(urls)];

        // ─── Helpers ──────────────────────────────────────────────────
        const isVideo = (url) => /\.(mp4|mov|webm)(\?.*)?$/i.test(url);
        const isImage = (url) => !isVideo(url);

        function getDomain(url) {
            try {
                const host = new URL(url).hostname;
                if (host === 'i.ibb.co') return 'i.ibb.co';
                if (host === 'miro.medium.com') return 'miro.medium.com';
                if (host === 'raw.githubusercontent.com') return 'raw.githubusercontent.com';
                return host;
            } catch {
                return 'unknown';
            }
        }

        function getBaseName(url) {
            try {
                const path = new URL(url).pathname;
                let name = path.split('/').pop() || 'file';
                // strip query params if any (though none should be present)
                name = name.split('?')[0];
                // remove extension
                const lastDot = name.lastIndexOf('.');
                if (lastDot > 0) name = name.slice(0, lastDot);
                // decode percent-encoded chars
                try { name = decodeURIComponent(name); } catch { /* keep as is */ }
                // sanitize: replace non-alphanumeric with dash, collapse
                name = name.replace(/[^a-zA-Z0-9-_]/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '');
                if (!name) name = 'asset';
                return name;
            } catch {
                return 'asset';
            }
        }

        // ─── State ────────────────────────────────────────────────────
        let currentType = 'all';
        let currentSource = 'all';
        const LS_KEY = 'media_rename_map';

        function loadMapping() {
            try {
                const raw = localStorage.getItem(LS_KEY);
                if (raw) return JSON.parse(raw);
            } catch {}
            return {};
        }

        function saveMapping(map) {
            try {
                localStorage.setItem(LS_KEY, JSON.stringify(map));
            } catch {}
        }

        let renameMap = loadMapping();

        // ─── Stats ────────────────────────────────────────────────────
        function updateStats() {
            const total = uniqueUrls.length;
            const images = uniqueUrls.filter(u => isImage(u));
            const videos = uniqueUrls.filter(u => isVideo(u));
            document.getElementById('totalCount').textContent = total;
            document.getElementById('imageCount').textContent = images.length;
            document.getElementById('videoCount').textContent = videos.length;
        }
        updateStats();

        // ─── Render ──────────────────────────────────────────────────
        function render() {
            const filtered = uniqueUrls.filter(url => {
                if (currentType === 'image' && !isImage(url)) return false;
                if (currentType === 'video' && !isVideo(url)) return false;
                if (currentSource !== 'all' && getDomain(url) !== currentSource) return false;
                return true;
            });

            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            if (filtered.length === 0) {
                grid.innerHTML = `<div class="empty-state">No items match current filters.</div>`;
                return;
            }

            filtered.forEach(url => {
                const isVideoFile = isVideo(url);
                const domain = getDomain(url);
                const type = isVideoFile ? 'video' : 'image';
                const baseName = getBaseName(url);
                const currentNewName = renameMap[url] || baseName;

                const item = document.createElement('div');
                item.className = 'item';
                item.dataset.url = url;

                // Media
                const wrap = document.createElement('div');
                wrap.className = 'media-wrap';
                let media;
                if (isVideoFile) {
                    media = document.createElement('video');
                    media.src = url;
                    media.muted = true;
                    media.playsInline = true;
                    media.preload = 'metadata';
                    media.setAttribute('controls', '');
                } else {
                    media = document.createElement('img');
                    media.src = url;
                    media.loading = 'lazy';
                    media.alt = url.split('/').pop();
                    media.onerror = function() { this.alt = '⚠️ load failed'; };
                }
                wrap.appendChild(media);
                // Lightbox on click
                wrap.addEventListener('click', () => openLightbox(url, type));
                item.appendChild(wrap);

                // Info (type + domain)
                const info = document.createElement('div');
                info.className = 'info';
                const typeLabel = document.createElement('span');
                typeLabel.className = 'type';
                typeLabel.textContent = type;
                const domainLabel = document.createElement('span');
                domainLabel.className = 'domain';
                const shortDomain = domain.replace('.medium.com', '').replace('.githubusercontent.com', '');
                domainLabel.textContent = shortDomain;
                info.appendChild(typeLabel);
                info.appendChild(domainLabel);
                item.appendChild(info);

                // Rename input
                const renameDiv = document.createElement('div');
                renameDiv.className = 'rename';
                const label = document.createElement('label');
                label.textContent = '→';
                const input = document.createElement('input');
                input.type = 'text';
                input.value = currentNewName;
                input.placeholder = baseName;
                input.spellcheck = false;
                const extHint = document.createElement('span');
                extHint.className = 'ext-hint';
                extHint.textContent = '.avif';

                renameDiv.appendChild(label);
                renameDiv.appendChild(input);
                renameDiv.appendChild(extHint);
                item.appendChild(renameDiv);

                // Save on change
                input.addEventListener('input', () => {
                    const val = input.value.trim();
                    if (val && val !== '') {
                        renameMap[url] = val;
                    } else {
                        delete renameMap[url];
                    }
                    saveMapping(renameMap);
                    // update ext hint visibility if needed
                });

                grid.appendChild(item);
            });
        }

        // ─── Lightbox ──────────────────────────────────────────────────
        const lightbox = document.getElementById('lightbox');
        const lightboxContent = document.getElementById('lightboxContent');
        const lightboxCaption = document.getElementById('lightboxCaption');
        const lightboxClose = document.getElementById('lightboxClose');

        function openLightbox(url, type) {
            lightboxContent.innerHTML = '';
            if (type === 'video') {
                const vid = document.createElement('video');
                vid.src = url;
                vid.controls = true;
                vid.autoplay = true;
                vid.muted = false;
                vid.style.maxWidth = '90vw';
                vid.style.maxHeight = '85vh';
                vid.style.borderRadius = '8px';
                lightboxContent.appendChild(vid);
            } else {
                const img = document.createElement('img');
                img.src = url;
                img.alt = url.split('/').pop();
                lightboxContent.appendChild(img);
            }
            lightboxCaption.textContent = url;
            lightbox.classList.add('open');
        }

        function closeLightbox() {
            lightbox.classList.remove('open');
            const vid = lightboxContent.querySelector('video');
            if (vid) vid.pause();
            lightboxContent.innerHTML = '';
        }
        lightboxClose.addEventListener('click', closeLightbox);
        lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeLightbox(); });

        // ─── Filters ──────────────────────────────────────────────────
        document.querySelectorAll('[data-filter-type]').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('[data-filter-type]').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentType = btn.dataset.filterType;
                render();
            });
        });
        document.querySelectorAll('[data-filter-source]').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('[data-filter-source]').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentSource = btn.dataset.filterSource;
                render();
            });
        });

        // ─── Mapping Modal ────────────────────────────────────────────
        const mappingModal = document.getElementById('mappingModal');
        const mappingBody = document.getElementById('mappingBody');
        const closeMappingBtn = document.getElementById('closeMappingBtn');
        const showMappingBtn = document.getElementById('showMappingBtn');
        const downloadCsvBtn = document.getElementById('downloadCsvBtn');

        function renderMappingTable() {
            let html = '';
            const entries = uniqueUrls.map(url => {
                const base = getBaseName(url);
                const newName = renameMap[url] || base;
                return { url, base, newName };
            });

            if (entries.length === 0) {
                mappingBody.innerHTML = '<p style="color:#6e6e73;padding:1rem 0;">No assets found.</p>';
                return;
            }

            html += `<table>
                <thead><tr>
                    <th style="width:40%;">Original URL</th>
                    <th style="width:25%;">Old filename (base)</th>
                    <th style="width:25%;">New name (without ext)</th>
                    <th style="width:10%;">New .avif</th>
                </tr></thead><tbody>`;
            entries.forEach(({ url, base, newName }) => {
                const displayUrl = url.length > 60 ? url.slice(0, 55) + '…' : url;
                const shortDomain = getDomain(url).replace('.medium.com', '').replace('.githubusercontent.com', '');
                html += `<tr>
                    <td><span class="old-url" title="${url}">${displayUrl}</span> <span class="badge">${shortDomain}</span></td>
                    <td><code>${base}</code></td>
                    <td><code class="new-name">${newName}</code></td>
                    <td><code class="new-name">${newName}<span class="ext">.avif</span></code></td>
                </tr>`;
            });
            html += `</tbody></table>`;
            mappingBody.innerHTML = html;
        }

        function openMappingModal() {
            renderMappingTable();
            mappingModal.classList.add('open');
            document.body.style.overflow = 'hidden';
        }

        function closeMappingModal() {
            mappingModal.classList.remove('open');
            document.body.style.overflow = '';
        }

        showMappingBtn.addEventListener('click', openMappingModal);
        closeMappingBtn.addEventListener('click', closeMappingModal);
        mappingModal.addEventListener('click', (e) => { if (e.target === mappingModal) closeMappingModal(); });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && mappingModal.classList.contains('open')) closeMappingModal();
        });

        // ─── Download CSV ─────────────────────────────────────────────
        function downloadCSV() {
            const rows = uniqueUrls.map(url => {
                const base = getBaseName(url);
                const newName = renameMap[url] || base;
                return { url, base, newName };
            });
            // Header: Original URL, Original Filename (base), New Filename (without ext), New Filename (.avif)
            let csv = 'Original URL,Original Filename,New Filename (no ext),New Filename (.avif)\n';
            rows.forEach(({ url, base, newName }) => {
                const safeUrl = `"${url}"`;
                const safeBase = `"${base}"`;
                const safeNew = `"${newName}"`;
                const safeAvif = `"${newName}.avif"`;
                csv += `${safeUrl},${safeBase},${safeNew},${safeAvif}\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'media-rename-map.csv';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(link.href);
        }
        downloadCsvBtn.addEventListener('click', downloadCSV);

        // ─── Clear all renames ────────────────────────────────────────
        document.getElementById('clearNamesBtn').addEventListener('click', () => {
            if (confirm('Clear all custom names? This will reset to the original filenames.')) {
                renameMap = {};
                saveMapping(renameMap);
                render();
                if (mappingModal.classList.contains('open')) renderMappingTable();
            }
        });

        // ─── Init ─────────────────────────────────────────────────────
        render();

        // Auto-refresh mapping table if open when changes occur (via input)
        // We'll re-render the modal content if it's open whenever we save.
        // Since we call saveMapping on every input, we can hook into that.
        // Let's override saveMapping to also refresh modal if open.
        const originalSave = saveMapping;
        saveMapping = function(map) {
            originalSave(map);
            if (mappingModal.classList.contains('open')) {
                renderMappingTable();
            }
        };
        // Re-bind the function in the global scope since we used it inside event handlers.
        // The above is sufficient because we call saveMapping inside input handlers.
        // Also, if the user opens the modal later, renderMappingTable() will read latest localStorage.
        // Let's also make sure renderMappingTable reads directly from localStorage to be safe.
        // I'll adjust renderMappingTable to read from localStorage directly.
        const originalRenderTable = renderMappingTable;
        renderMappingTable = function() {
            // Reload from localStorage to be safe
            try {
                const raw = localStorage.getItem(LS_KEY);
                if (raw) renameMap = JSON.parse(raw);
                else renameMap = {};
            } catch { renameMap = {}; }

            let html = '';
            const entries = uniqueUrls.map(url => {
                const base = getBaseName(url);
                const newName = renameMap[url] || base;
                return { url, base, newName };
            });
            if (entries.length === 0) {
                mappingBody.innerHTML = '<p style="color:#6e6e73;padding:1rem 0;">No assets found.</p>';
                return;
            }
            html += `<table><thead><tr>
                <th style="width:40%;">Original URL</th>
                <th style="width:25%;">Old filename (base)</th>
                <th style="width:25%;">New name (without ext)</th>
                <th style="width:10%;">New .avif</th>
            </tr></thead><tbody>`;
            entries.forEach(({ url, base, newName }) => {
                const displayUrl = url.length > 60 ? url.slice(0, 55) + '…' : url;
                const shortDomain = getDomain(url).replace('.medium.com', '').replace('.githubusercontent.com', '');
                html += `<tr>
                    <td><span class="old-url" title="${url}">${displayUrl}</span> <span class="badge">${shortDomain}</span></td>
                    <td><code>${base}</code></td>
                    <td><code class="new-name">${newName}</code></td>
                    <td><code class="new-name">${newName}<span class="ext">.avif</span></code></td>
                </tr>`;
            });
            html += `</tbody></table>`;
            mappingBody.innerHTML = html;
        };
        // Reassign the open modal function to use the new renderer
        const originalOpen = openMappingModal;
        openMappingModal = function() {
            renderMappingTable();
            mappingModal.classList.add('open');
            document.body.style.overflow = 'hidden';
        };
        showMappingBtn.removeEventListener('click', openMappingModal);
        showMappingBtn.addEventListener('click', openMappingModal);
    })();
</script>
</body>
</html>
