<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ripple Rings Globe</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #000; }
  #globeViz { width: 100vw; height: 100vh; }
</style>
</head>
<body>
<div id="globeViz"></div>

<script src="https://cdn.jsdelivr.net/npm/globe.gl@2.41.2/dist/globe.gl.min.js"></script>
<script>
  window.addEventListener('DOMContentLoaded', () => {
    if (typeof Globe === 'undefined') {
      document.body.innerHTML =
        '<p style="color:#fff;font-family:sans-serif;padding:2em;">' +
        'Could not load the globe.gl library. Check your internet connection and try again.</p>';
      return;
    }

    // Generate random ripple data
    const N = 10;
    const gData = [...Array(N).keys()].map(() => ({
      lat: (Math.random() - 0.5) * 180,
      lng: (Math.random() - 0.5) * 360,
      maxR: Math.random() * 20 + 3,
      propagationSpeed: (Math.random() - 0.5) * 20 + 1,
      repeatPeriod: Math.random() * 2000 + 200
    }));

    const colorInterpolator = t => `rgba(255,255,255,${1 - t})`;

    const world = new Globe(document.getElementById('globeViz'))
      .globeImageUrl('https://cdn.jsdelivr.net/npm/three-globe/example/img/earth-dark.jpg')
      .bumpImageUrl('https://cdn.jsdelivr.net/npm/three-globe/example/img/earth-topology.png')
      .atmosphereColor('white')
      .ringsData(gData)
      .ringColor(() => colorInterpolator)
      .ringMaxRadius('maxR')
      .ringPropagationSpeed('propagationSpeed')
      .ringRepeatPeriod('repeatPeriod');
  });
</script>
</body>
</html>
