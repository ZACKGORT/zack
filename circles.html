<meta charset="UTF-8">
<title>Whitewashed Globe</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #f5f5f3; }
  #globeViz { width: 100vw; height: 100vh; }

  #viewToggle {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 10;
    display: flex;
    gap: 6px;
    background: rgba(255,255,255,0.6);
    backdrop-filter: blur(6px);
    border: 1px solid rgba(0,0,0,0.1);
    border-radius: 999px;
    padding: 4px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  #viewToggle button {
    border: none;
    background: transparent;
    color: #444;
    font-size: 13px;
    padding: 8px 16px;
    border-radius: 999px;
    cursor: pointer;
    transition: background 150ms, color 150ms;
  }
  #viewToggle button.active {
    background: #111;
    color: #fff;
  }
  #viewToggle button:not(.active):hover {
    background: rgba(0,0,0,0.06);
  }
</style>
</head>

<div id="globeViz"></div>
<div id="viewToggle">

    // ---- Ripples data ----
    const N = 10;
    const ringsData = [...Array(N).keys()].map(() => ({
      lat: (Math.random() - 0.5) * 180,
      lng: (Math.random() - 0.5) * 360,
      maxR: Math.random() * 20 + 3,
      propagationSpeed: (Math.random() - 0.5) * 20 + 1,
      repeatPeriod: Math.random() * 2000 + 200
    }));
    const ringColorInterpolator = t => `rgba(0,0,0,${1 - t})`;

    // ---- Globe setup ----
    const world = new Globe(document.getElementById('globeViz'))
      .backgroundColor('#f5f5f3')
      .globeImageUrl(GRAYSCALE_EARTH_TEXTURE)
      .bumpImageUrl('https://cdn.jsdelivr.net/npm/three-globe/example/img/earth-topology.png')
      .atmosphereColor('#cccccc')
      .atmosphereAltitude(0.1)
      .ringsData(ringsData)
      .ringColor(() => ringColorInterpolator)
      .ringMaxRadius('maxR')
      .ringPropagationSpeed('propagationSpeed')
      .ringRepeatPeriod('repeatPeriod')
      .labelsData([])
      .labelLat(d => d.properties.latitude)
      .labelLng(d => d.properties.longitude)
      .labelText(d => d.properties.name)
      .labelSize(d => Math.sqrt(d.properties.pop_max) * 4e-4)
      .labelDotRadius(d => Math.sqrt(d.properties.pop_max) * 4e-4)
      .labelColor(() => 'rgba(0,0,0,0.75)')
      .labelResolution(2);

    // Wash the photo texture out toward white so it stays pale
    // but keeps visible continent/ocean definition (emissive adds
    // light rather than multiplying it away like .color would).
    const globeMaterial = world.globeMaterial();
    globeMaterial.bumpScale = 6;
    globeMaterial.emissive.set('#ffffff');
    globeMaterial.emissiveIntensity = 0.88;
    globeMaterial.shininess = 9;

    // ---- View toggle ----
    const btnRipples = document.getElementById('btnRipples');
    const btnCities = document.getElementById('btnCities');
    let citiesData = null;
    let citiesRequested = false;

    function setActive(btn) {
      [btnRipples, btnCities].forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    function showRipples() {
      setActive(btnRipples);
      world.ringsData(ringsData);
      world.labelsData([]);
    }

    function showCities() {
      setActive(btnCities);
      world.ringsData([]);
      if (citiesData) {
        console.log('World Cities: using cached data,', citiesData.length, 'cities');
        world.labelsData(citiesData);
        return;
      }
      if (!citiesRequested) {
        citiesRequested = true;
        btnCities.textContent = 'Loading…';
        console.log('World Cities: fetching dataset…');
        fetch('https://cdn.jsdelivr.net/npm/globe.gl@2.41.2/example/datasets/ne_110m_populated_places_simple.geojson')
          .then(res => {
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.json();
          })
          .then(places => {
            citiesData = places.features;
            console.log('World Cities: loaded', citiesData.length, 'cities');
            btnCities.textContent = 'World Cities';
            // Only apply if the user is still on the Cities view
            if (btnCities.classList.contains('active')) {
              world.labelsData(citiesData);
            }
          })
          .catch(err => {
            console.error('World Cities: failed to load dataset:', err);
            btnCities.textContent = 'World Cities (retry)';
            citiesRequested = false; // allow retry on next click
          });
      }
    }

    btnRipples.addEventListener('click', showRipples);
    btnCities.addEventListener('click', showCities);

    // Default view on load
    showCities();
  });
</script>
