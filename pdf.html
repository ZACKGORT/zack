  <style>
    * { box-sizing: border-box; }
    :root {
      --bg: #0a0a0a;
      --panel: #111111;
      --border: #232323;
      --text: #f2f1ed;
      --muted: #7d7c78;
      --guide: #242423;
      --row-hover: #161616;
      --row-selected: #1a1a1a;
      --accent: #e8a672;
    }
    body {
      margin: 0;
      background: #000;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
      min-height: 100vh;
    }
    .card {
      background: var(--bg);
      border-radius: 16px;
      padding: 28px 8px 8px;
      max-width: 720px;
      width: 100%;
    }
    .card-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      padding: 0 20px 20px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .card-title { font-family: Fraunces, serif; font-size: 20px; font-weight: 500; color: var(--text); margin: 0 0 3px; }
    .card-sub { font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; color: var(--muted); }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn {
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 14px;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    .btn:hover { border-color: #555; background: #1a1a1a; }
    .btn .pdf-badge {
      background: var(--accent);
      color: #1a1206;
      border-radius: 20px;
      padding: 0 10px;
      font-size: 11px;
      font-weight: 700;
      margin-left: 6px;
      display: inline-block;
      line-height: 1.6;
    }
    .tree {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 4px;
      position: relative;
    }
    .row {
      display: flex;
      align-items: center;
      height: 38px;
      cursor: pointer;
      position: relative;
      border-radius: 6px;
      outline: none;
      transition: background 0.1s;
    }
    .row:hover { background: var(--row-hover); }
    .row.selected { background: var(--row-selected); }
    .row-main {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
      min-width: 0;
    }
    .chevron {
      width: 16px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: var(--muted);
      transition: transform 0.12s;
    }
    .chevron.open { transform: rotate(90deg); }
    .type-icon {
      display: flex;
      align-items: center;
      flex-shrink: 0;
      color: var(--muted);
    }
    .name {
      font-size: 14px;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .name.folder { font-weight: 500; }
    .meta {
      font-size: 12.5px;
      color: var(--muted);
      padding-right: 16px;
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }
    .hint {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 14px 20px 4px;
      font-size: 12px;
      color: var(--muted);
      font-family: 'IBM Plex Mono', monospace;
    }
    .folder-color-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 4px;
      margin-left: 6px;
      flex-shrink: 0;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .checkbox-select {
      margin-right: 4px;
      width: 14px;
      height: 14px;
      accent-color: var(--accent);
      cursor: pointer;
      flex-shrink: 0;
    }

    /* context menu */
    .context-menu {
      position: fixed;
      z-index: 9999;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 6px 0;
      min-width: 180px;
      box-shadow: 0 16px 48px rgba(0,0,0,0.8);
      display: none;
      backdrop-filter: blur(4px);
    }
    .context-menu .cm-item {
      padding: 8px 18px;
      font-size: 13px;
      color: #ddd;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: background 0.1s;
      font-family: 'Inter', sans-serif;
    }
    .context-menu .cm-item:hover { background: #2a2a2a; color: #fff; }
    .context-menu .cm-item .color-swatch {
      display: inline-block;
      width: 16px;
      height: 16px;
      border-radius: 4px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .context-menu .cm-divider {
      height: 1px;
      background: #2a2a2a;
      margin: 4px 12px;
    }
    .context-menu .cm-item .check {
      margin-left: auto;
      color: var(--accent);
    }

    @media (max-width: 640px) {
      .row { height: 46px; }
      .name { font-size: 14.5px; }
      .context-menu { min-width: 160px; }
    }
  </style>
</head>

    // ─── STATE ───
    const nodeIndex = {};
    const parentIndex = {};
    (function indexAll(nodes, parentId) {
      nodes.forEach(n => {
        nodeIndex[n.id] = n;
        parentIndex[n.id] = parentId;
        if (n.type === 'folder' && n.children) indexAll(n.children, n.id);
      });
    })(TREE, null);

    const expanded = new Set(['root', 'work', 'bny', 'life', 'public', 'private', 'balance']);
    let focusedId = 'root';
    let selectedId = null;
    const treeEl = document.getElementById('tree');

    // folder colors & export selection
    const folderColors = new Map();
    const selectedForExport = new Set();

    // ─── RENDER ───
    function visibleRows() {
      const out = [];
      (function walk(nodes, depth) {
        nodes.forEach(n => {
          out.push({ node: n, depth });
          if (n.type === 'folder' && n.children && expanded.has(n.id)) {
            walk(n.children, depth + 1);
          }
        });
      })(TREE, 0);
      return out;
    }

    function render() {
      const rows = visibleRows();
      treeEl.innerHTML = '';
      rows.forEach(({ node, depth }) => {
        const folder = node.type === 'folder';
        const open = folder && expanded.has(node.id);
        const color = folderColors.get(node.id) || null;
        const isSelected = selectedForExport.has(node.id);

        const row = document.createElement('div');
        row.className = 'row' + (selectedId === node.id ? ' selected' : '');
        row.setAttribute('data-id', node.id);
        row.setAttribute('data-type', node.type);
        row.tabIndex = focusedId === node.id ? 0 : -1;

        // guides
        for (let i = 0; i < depth; i++) {
          const guide = document.createElement('span');
          guide.className = 'guide';
          guide.style.left = (12 + i * 22 + 9) + 'px';
          row.appendChild(guide);
        }

        const main = document.createElement('div');
        main.className = 'row-main';
        main.style.paddingLeft = (12 + depth * 22) + 'px';

        // checkbox
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.className = 'checkbox-select';
        cb.checked = isSelected;
        cb.addEventListener('change', (e) => {
          e.stopPropagation();
          if (cb.checked) selectedForExport.add(node.id);
          else selectedForExport.delete(node.id);
          updateExportBadge();
        });
        cb.addEventListener('click', (e) => e.stopPropagation());
        main.appendChild(cb);

        // chevron
        const chevron = document.createElement('span');
        chevron.className = 'chevron' + (open ? ' open' : '');
        chevron.innerHTML = folder ? `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>` : '';
        main.appendChild(chevron);

        // icon
        const icon = document.createElement('span');
        icon.className = 'type-icon';
        icon.innerHTML = folder
          ? `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M4 4a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V8a1 1 0 0 0-1-1h-9l-2-3H4Z"/></svg>`
          : `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><polyline points="14 2 14 8 20 8"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="15" y2="17"/></svg>`;
        main.appendChild(icon);

        const nameSpan = document.createElement('span');
        nameSpan.className = 'name' + (folder ? ' folder' : '');
        nameSpan.textContent = node.name;
        main.appendChild(nameSpan);

        if (folder && color) {
          const dot = document.createElement('span');
          dot.className = 'folder-color-dot';
          dot.style.background = color;
          main.appendChild(dot);
        }

        row.appendChild(main);

        const meta = document.createElement('div');
        meta.className = 'meta';
        if (folder) {
          const count = node.children ? node.children.length : 0;
          meta.textContent = count + ' item' + (count === 1 ? '' : 's');
        } else {
          meta.textContent = node.size || '';
        }
        row.appendChild(meta);

        // click
        row.addEventListener('click', (e) => {
          if (e.target.type === 'checkbox') return;
          selectedId = node.id;
          focusedId = node.id;
          if (folder) {
            if (expanded.has(node.id)) expanded.delete(node.id);
            else expanded.add(node.id);
            render();
          } else {
            render();
          }
          focusRow(node.id);
        });

        // right-click
        row.addEventListener('contextmenu', (e) => {
          e.preventDefault();
          e.stopPropagation();
          selectedId = node.id;
          focusedId = node.id;
          render();
          showContextMenu(e.clientX, e.clientY, node.id);
        });

        treeEl.appendChild(row);
      });

      requestAnimationFrame(() => {
        const el = treeEl.querySelector('[data-id="' + CSS.escape(focusedId) + '"]');
        if (el) el.focus();
      });
      updateExportBadge();
    }

    function focusRow(id) {
      focusedId = id;
      render();
      requestAnimationFrame(() => {
        const el = treeEl.querySelector('[data-id="' + CSS.escape(id) + '"]');
        if (el) el.focus();
      });
    }

    function updateExportBadge() {
      const count = selectedForExport.size;
      const btn = document.getElementById('exportPdfBtn');
      if (count > 0) {
        btn.innerHTML = `📄 Export selected as PDF <span class="pdf-badge">${count}</span>`;
      } else {
        btn.innerHTML = `📄 Export selected as PDF`;
      }
    }

    // ─── CONTEXT MENU ───
    const contextMenu = document.getElementById('contextMenu');
    let contextNodeId = null;

    function showContextMenu(x, y, nodeId) {
      contextNodeId = nodeId;
      const w = 200, h = 340;
      if (x + w > window.innerWidth) x = window.innerWidth - w - 8;
      if (y + h > window.innerHeight) y = window.innerHeight - h - 8;
      if (x < 8) x = 8;
      if (y < 8) y = 8;
      contextMenu.style.left = x + 'px';
      contextMenu.style.top = y + 'px';
      contextMenu.style.display = 'block';
    }

    function hideContextMenu() {
      contextMenu.style.display = 'none';
      contextNodeId = null;
    }

    document.addEventListener('click', (e) => {
      if (!contextMenu.contains(e.target)) hideContextMenu();
    });

    contextMenu.addEventListener('click', (e) => {
      const item = e.target.closest('.cm-item');
      if (!item) return;
      const action = item.dataset.action;
      const nodeId = contextNodeId;
      if (!nodeId) return;
      const node = nodeIndex[nodeId];
      if (!node) return;

      if (action === 'select') {
        selectedForExport.add(nodeId);
        render();
        hideContextMenu();
      } else if (action === 'deselect') {
        selectedForExport.delete(nodeId);
        render();
        hideContextMenu();
      } else if (action === 'color') {
        const color = item.dataset.color;
        if (node.type === 'folder') {
          folderColors.set(nodeId, color);
          render();
        }
        hideContextMenu();
      } else if (action === 'reset-color') {
        if (node.type === 'folder') {
          folderColors.delete(nodeId);
          render();
        }
        hideContextMenu();
      }
    });

    // ─── EXPORT PDF ───
    document.getElementById('exportPdfBtn').addEventListener('click', () => {
      const count = selectedForExport.size;
      if (count === 0) {
        alert('No items selected. Use checkboxes or right-click → Select.');
        return;
      }
      const names = [];
      selectedForExport.forEach(id => {
        const n = nodeIndex[id];
        if (n) names.push(n.name);
      });
      alert(`📦 Exporting ${count} item(s) as PDF (simulated):\n\n${names.join('\n')}\n\n(Actual PDF generation would happen here.)`);
    });

    // ─── EXPAND / COLLAPSE ───
    document.getElementById('expandAllBtn').addEventListener('click', () => {
      Object.keys(nodeIndex).forEach(id => {
        if (nodeIndex[id].type === 'folder') expanded.add(id);
      });
      render();
    });
    document.getElementById('collapseAllBtn').addEventListener('click', () => {
      expanded.clear();
      render();
    });

    // ─── KEYBOARD ───
    treeEl.addEventListener('keydown', (e) => {
      const rows = visibleRows();
      const idx = rows.findIndex(r => r.node.id === focusedId);
      if (idx === -1) return;
      const { node } = rows[idx];
      const folder = node.type === 'folder';
      const isOpen = folder && expanded.has(node.id);

      switch (e.key) {
        case 'ArrowDown': e.preventDefault(); if (rows[idx+1]) focusRow(rows[idx+1].node.id); break;
        case 'ArrowUp': e.preventDefault(); if (rows[idx-1]) focusRow(rows[idx-1].node.id); break;
        case 'ArrowRight': {
          e.preventDefault();
          if (folder) {
            if (!isOpen) { expanded.add(node.id); render(); }
            else if (rows[idx+1] && parentIndex[rows[idx+1].node.id] === node.id) focusRow(rows[idx+1].node.id);
          }
          break;
        }
        case 'ArrowLeft': {
          e.preventDefault();
          if (folder && isOpen) { expanded.delete(node.id); render(); }
          else { const pid = parentIndex[node.id]; if (pid) focusRow(pid); }
          break;
        }
        case 'Home': e.preventDefault(); if (rows[0]) focusRow(rows[0].node.id); break;
        case 'End': e.preventDefault(); if (rows[rows.length-1]) focusRow(rows[rows.length-1].node.id); break;
        case 'Enter':
        case ' ':
          e.preventDefault();
          if (folder) {
            if (expanded.has(node.id)) expanded.delete(node.id);
            else expanded.add(node.id);
            render();
          }
          break;
        default: break;
      }
    });

    // ─── INIT ───
    render();
    updateExportBadge();
  })();
</script>
