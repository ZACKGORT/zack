<script type="module">
import * as THREE from 'three';

const errEl = document.getElementById('err');
let RAPIER;
try {
  RAPIER = (await import('https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.12.0/rapier.es.js')).default;
  await RAPIER.init();
} catch (e) {
  errEl.style.display = 'grid';
  errEl.textContent = 'The physics engine could not load. Check your connection and reload.';
  throw e;
}

const HERO_PHRASES = ['ux is dead.', '¡viva la cx!'];
const LOGO_PHRASES = ['zack.cx'];
const VERBS = ['rebuild', 'reshape', 'reframe', 'reapproach', 'refactor', 'recognize'];
const HERO_WIDTH = 8.4;     // world units
const LOGO_WIDTH = 2.4;
const BASE_DEPTH = 0.36;    // extrusion at hero scale
const EXPLODE_FORCE = 1.1;  // gentle nudge, gravity does the work
const nowSec = () => performance.now() / 1000;
const IDENT = new THREE.Quaternion();
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const easeOut = t => 1 - Math.pow(1 - t, 3);

/* Swarm cursors. The cursor shapes and the idea of a crowd of multiplayer
 * cursors building a page are adapted from Joel Califa's Swarm
 * (https://califa.github.io/swarm-site/). */
const swarmEl = document.getElementById('swarm');
const AGENT_COLORS = ['#F24E1E', '#A259FF', '#1ABCFE', '#0ACF83', '#FF7262', '#FFC700',
                      '#E8467C', '#0D99FF', '#FF8A00', '#14AE5C', '#9747FF', '#00B5CE'];
const ARROW_D = 'M4.6 3.9 C4.2 3.1 4.9 2.4 5.7 2.8 L20.6 9.4 C21.5 9.8 21.4 11.1 20.4 11.3 L13.9 12.9 C13.4 13 13 13.4 12.9 13.9 L11.3 20.4 C11.1 21.4 9.8 21.5 9.4 20.6 Z';
const AGENT_SHAPES = {
  arrow: { hot: [5, 3.5], svg: c => `<path d="${ARROW_D}" fill="${c}" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/>` },
  cross: { hot: [12, 12], svg: c =>
    `<g stroke-linecap="round"><path d="M12 3.5 V20.5 M3.5 12 H20.5" stroke="#fff" stroke-width="3.6"/>` +
    `<path d="M12 3.5 V20.5 M3.5 12 H20.5" stroke="${c}" stroke-width="1.5"/></g>` },
};

/* ------------------------------------------------------------------ *
 *  Convex solids. A solid is a list of convex "parts"; a part is a
 *  list of polygon faces.
 * ------------------------------------------------------------------ */
//@@GEOM_START
const EPS = 1e-6;
const V = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);

function newell(pts) {
  const n = V();
  for (let i = 0; i < pts.length; i++) {
    const a = pts[i], b = pts[(i + 1) % pts.length];
    n.x += (a.y - b.y) * (a.z + b.z);
    n.y += (a.z - b.z) * (a.x + b.x);
    n.z += (a.x - b.x) * (a.y + b.y);
  }
  return n;
}
function orient(pts, normal) {
  if (newell(pts).dot(normal) < 0) pts.reverse();
  return pts;
}

// Keep the half-space n·x <= d. New cut faces are tagged `inner`.
function clip(faces, n, d, inner) {
  const out = [];
  for (const f of faces) {
    const pts = f.pts, res = [];
    for (let i = 0; i < pts.length; i++) {
      const a = pts[i], b = pts[(i + 1) % pts.length];
      const da = n.dot(a) - d, db = n.dot(b) - d;
      if (da <= EPS) res.push(a);
      if ((da < -EPS && db > EPS) || (da > EPS && db < -EPS)) {
        res.push(a.clone().lerp(b, da / (da - db)));
      }
    }
    if (res.length >= 3) out.push({ pts: res, inner: f.inner });
  }
  if (!out.length) return null;

  const cut = [];
  for (const f of out) {
    for (const p of f.pts) {
      if (Math.abs(n.dot(p) - d) <= 1e-5 && !cut.some(q => q.distanceToSquared(p) < 1e-9)) cut.push(p);
    }
  }
  if (cut.length >= 3) {
    const c = V();
    cut.forEach(p => c.add(p));
    c.divideScalar(cut.length);
    const t = Math.abs(n.x) < 0.9 ? V(1, 0, 0) : V(0, 1, 0);
    const u = t.clone().cross(n).normalize();
    const w = n.clone().cross(u);
    const ang = p => { const r = p.clone().sub(c); return Math.atan2(r.dot(w), r.dot(u)); };
    cut.sort((p, q) => ang(p) - ang(q));
    orient(cut, n);
    out.push({ pts: cut, inner });
  }
  return out;
}

function metrics(faces) {
  const c0 = V();
  let n = 0;
  for (const f of faces) for (const p of f.pts) { c0.add(p); n++; }
  c0.divideScalar(n);
  let vol = 0;
  const cen = V();
  for (const f of faces) {
    const p = f.pts;
    for (let i = 1; i < p.length - 1; i++) {
      const a = p[0].clone().sub(c0), b = p[i].clone().sub(c0), c = p[i + 1].clone().sub(c0);
      const v = Math.abs(a.dot(b.clone().cross(c))) / 6;
      vol += v;
      cen.addScaledVector(p[0].clone().add(p[i]).add(p[i + 1]).add(c0).multiplyScalar(0.25), v);
    }
  }
  return { vol, centroid: vol > 1e-12 ? cen.divideScalar(vol) : c0 };
}

function metricsParts(parts) {
  let vol = 0;
  const cen = V();
  for (const p of parts) {
    const m = metrics(p);
    vol += m.vol;
    cen.addScaledVector(m.centroid, m.vol);
  }
  return { vol, centroid: vol > 1e-12 ? cen.divideScalar(vol) : V() };
}

const recentreParts = (parts, c) =>
  parts.map(faces => faces.map(f => ({ inner: f.inner, pts: f.pts.map(p => p.clone().sub(c)) })));

function isInside(faces, s, margin) {
  for (const f of faces) {
    const nn = newell(f.pts);
    if (nn.lengthSq() < 1e-12) continue;
    nn.normalize();
    if (nn.dot(s.clone().sub(f.pts[0])) > -margin) return false;
  }
  return true;
}
const isInsideParts = (parts, s, margin = 0.01) => parts.some(p => isInside(p, s, margin));

function maxDist(faces, c) {
  let m = 0;
  for (const f of faces) for (const p of f.pts) m = Math.max(m, p.distanceToSquared(c));
  return Math.sqrt(m);
}

// Voronoi cells of `seeds`, each cell = every convex part clipped by bisector
// planes. Neighbours are visited nearest-first and we stop as soon as the next
// bisector lies outside the cell, so the result is exact but cheap.
function voronoiCells(parts, seeds, minVol) {
  const cells = [];
  for (let i = 0; i < seeds.length; i++) {
    const si = seeds[i];
    const order = [];
    for (let j = 0; j < seeds.length; j++) if (j !== i) order.push([seeds[j].distanceTo(si), j]);
    order.sort((a, b) => a[0] - b[0]);
    const cellParts = [];
    for (const part of parts) {
      let f = part, R = maxDist(f, si);
      for (const [dj, j] of order) {
        if (dj < 1e-4) continue;
        if (dj * 0.5 > R + 1e-4) break;
        const nrm = seeds[j].clone().sub(si).divideScalar(dj);
        const d = nrm.dot(si.clone().add(seeds[j])) * 0.5;
        f = clip(f, nrm, d, true);
        if (!f) break;
        R = maxDist(f, si);
      }
      if (f && metrics(f).vol >= minVol * 0.33) cellParts.push(f);
    }
    if (!cellParts.length) continue;
    const m = metricsParts(cellParts);
    if (m.vol >= minVol) cells.push({ parts: cellParts, m });
  }
  return cells;
}

// well-spread random points inside a solid (best-candidate sampling)
function spreadSeeds(parts, n, margin = 0.003) {
  const infos = parts.map(p => {
    const box = new THREE.Box3();
    p.forEach(f => f.pts.forEach(q => box.expandByPoint(q)));
    return { p, box, vol: Math.max(metrics(p).vol, 1e-9) };
  });
  const total = infos.reduce((s, i) => s + i.vol, 0);
  const pick = () => {
    let r = Math.random() * total, info = infos[infos.length - 1];
    for (const i of infos) { r -= i.vol; if (r <= 0) { info = i; break; } }
    for (let k = 0; k < 60; k++) {
      const s = V(
        info.box.min.x + Math.random() * (info.box.max.x - info.box.min.x),
        info.box.min.y + Math.random() * (info.box.max.y - info.box.min.y),
        info.box.min.z + Math.random() * (info.box.max.z - info.box.min.z));
      if (isInside(info.p, s, margin)) return s;
    }
    return info.box.getCenter(V());
  };
  const seeds = [pick()];
  while (seeds.length < n) {
    let best = null, bd = -1;
    for (let k = 0; k < 12; k++) {
      const c = pick();
      let d = Infinity;
      for (const s of seeds) d = Math.min(d, s.distanceToSquared(c));
      if (d > bd) { bd = d; best = c; }
    }
    seeds.push(best);
  }
  return seeds;
}

function hullPoints(faces) {
  const seen = new Set(), arr = [];
  for (const f of faces) for (const p of f.pts) {
    const k = `${Math.round(p.x * 1e4)},${Math.round(p.y * 1e4)},${Math.round(p.z * 1e4)}`;
    if (!seen.has(k)) { seen.add(k); arr.push(p.x, p.y, p.z); }
  }
  return new Float32Array(arr);
}
//@@GEOM_END

function boxFaces(h) {
  const axes = [V(1, 0, 0), V(0, 1, 0), V(0, 0, 1)];
  const faces = [];
  for (let a = 0; a < 3; a++) {
    for (const s of [-1, 1]) {
      const n = axes[a].clone().multiplyScalar(s);
      const u = axes[(a + 1) % 3], v = axes[(a + 2) % 3];
      const c = n.clone().multiplyScalar(h);
      const pts = [
        c.clone().addScaledVector(u, h).addScaledVector(v, h),
        c.clone().addScaledVector(u, -h).addScaledVector(v, h),
        c.clone().addScaledVector(u, -h).addScaledVector(v, -h),
        c.clone().addScaledVector(u, h).addScaledVector(v, -h),
      ];
      faces.push({ pts: orient(pts, n), inner: false });
    }
  }
  return faces;
}

/* ------------------------------------------------------------------ *
 *  Text -> convex prisms
 *  The phrase is drawn in Satoshi on a canvas, traced into outlines
 *  (marching squares), triangulated, and merged into convex pieces.
 * ------------------------------------------------------------------ */
//@@TRACE_START
function marchingSquares(a, W, H) {
  const at = (x, y) => a[y * W + x];
  const segs = new Map(), pos = new Map();
  const hpt = (x, y) => {
    const k = 'h' + x + ',' + y;
    if (!pos.has(k)) { const v1 = at(x, y), v2 = at(x + 1, y); pos.set(k, [x + (0.5 - v1) / (v2 - v1), y]); }
    return k;
  };
  const vpt = (x, y) => {
    const k = 'v' + x + ',' + y;
    if (!pos.has(k)) { const v1 = at(x, y), v2 = at(x, y + 1); pos.set(k, [x, y + (0.5 - v1) / (v2 - v1)]); }
    return k;
  };
  const add = (s, e) => segs.set(s, e);
  for (let y = 0; y < H - 1; y++) {
    for (let x = 0; x < W - 1; x++) {
      const tl = at(x, y) >= 0.5, tr = at(x + 1, y) >= 0.5, br = at(x + 1, y + 1) >= 0.5, bl = at(x, y + 1) >= 0.5;
      const idx = (tl << 3) | (tr << 2) | (br << 1) | (bl ? 1 : 0);
      if (idx === 0 || idx === 15) continue;
      const T = () => hpt(x, y), B = () => hpt(x, y + 1), L = () => vpt(x, y), R = () => vpt(x + 1, y);
      switch (idx) {
        case 8: add(L(), T()); break;
        case 4: add(T(), R()); break;
        case 2: add(R(), B()); break;
        case 1: add(B(), L()); break;
        case 7: add(T(), L()); break;
        case 11: add(R(), T()); break;
        case 13: add(B(), R()); break;
        case 14: add(L(), B()); break;
        case 12: add(L(), R()); break;
        case 6: add(T(), B()); break;
        case 3: add(R(), L()); break;
        case 9: add(B(), T()); break;
        case 10: {
          const c = (at(x, y) + at(x + 1, y) + at(x, y + 1) + at(x + 1, y + 1)) / 4 >= 0.5;
          if (c) { add(R(), T()); add(L(), B()); } else { add(L(), T()); add(R(), B()); }
          break;
        }
        case 5: {
          const c = (at(x, y) + at(x + 1, y) + at(x, y + 1) + at(x + 1, y + 1)) / 4 >= 0.5;
          if (c) { add(T(), L()); add(B(), R()); } else { add(T(), R()); add(B(), L()); }
          break;
        }
      }
    }
  }
  const loops = [], used = new Set();
  for (const start of segs.keys()) {
    if (used.has(start)) continue;
    const loop = [];
    let k = start;
    while (k !== undefined && !used.has(k)) { used.add(k); loop.push(pos.get(k)); k = segs.get(k); }
    if (k === start && loop.length > 2) loops.push(loop);
  }
  return loops;
}

function dpOpen(pts, eps) {
  if (pts.length < 3) return pts;
  const a = pts[0], b = pts[pts.length - 1];
  const dx = b[0] - a[0], dy = b[1] - a[1];
  const len = Math.hypot(dx, dy) || 1e-9;
  let best = -1, bi = 0;
  for (let i = 1; i < pts.length - 1; i++) {
    const d = Math.abs((pts[i][0] - a[0]) * dy - (pts[i][1] - a[1]) * dx) / len;
    if (d > best) { best = d; bi = i; }
  }
  if (best > eps) return dpOpen(pts.slice(0, bi + 1), eps).slice(0, -1).concat(dpOpen(pts.slice(bi), eps));
  return [a, b];
}
function simplifyClosed(pts, eps) {
  let f = 0, fd = -1;
  for (let i = 1; i < pts.length; i++) {
    const d = Math.hypot(pts[i][0] - pts[0][0], pts[i][1] - pts[0][1]);
    if (d > fd) { fd = d; f = i; }
  }
  const a = dpOpen(pts.slice(0, f + 1), eps);
  const b = dpOpen(pts.slice(f).concat([pts[0]]), eps);
  return a.slice(0, -1).concat(b.slice(0, -1));
}
//@@TRACE_END

function traceWord(word, size = 3.3) {
  const F = 400, pad = 40;
  const c = document.createElement('canvas');
  const ctx = c.getContext('2d', { willReadFrequently: true });
  const font = `700 ${F}px Satoshi, "Helvetica Neue", Arial, sans-serif`;
  ctx.font = font;
  const w = Math.ceil(ctx.measureText(word).width) + pad * 2;
  const h = Math.ceil(F * 1.3) + pad * 2;
  c.width = w; c.height = h;
  ctx.font = font;
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#000';
  const baseY = pad + Math.round(F * 0.95);
  ctx.fillText(word, pad, baseY);
  const img = ctx.getImageData(0, 0, w, h).data;
  const a = new Float32Array(w * h);
  for (let i = 0; i < a.length; i++) a[i] = img[i * 4 + 3] / 255;
  const s = size / F;
  return marchingSquares(a, w, h)
    .map(l => simplifyClosed(l, 1.5))
    .filter(l => l.length >= 3)
    .map(l => l.map(([x, y]) => new THREE.Vector2(x * s, (baseY - y) * s)));
}

const area2 = poly => {
  let a = 0;
  for (let i = 0; i < poly.length; i++) {
    const p = poly[i], q = poly[(i + 1) % poly.length];
    a += p.x * q.y - q.x * p.y;
  }
  return a / 2;
};
function pointInPoly(pt, poly) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const a = poly[i], b = poly[j];
    if ((a.y > pt.y) !== (b.y > pt.y) && pt.x < ((b.x - a.x) * (pt.y - a.y)) / (b.y - a.y) + a.x) inside = !inside;
  }
  return inside;
}

// glue triangles back together into larger convex polygons (fewer parts)
function mergeConvex(verts, tris) {
  const P = i => verts[i];
  const polys = [];
  for (const t of tris) {
    const a = P(t[0]), b = P(t[1]), c = P(t[2]);
    const ar = (b.x - a.x) * (c.y - a.y) - (b.y - a.y) * (c.x - a.x);
    if (Math.abs(ar) < 1e-7) continue;
    polys.push(ar > 0 ? [t[0], t[1], t[2]] : [t[0], t[2], t[1]]);
  }
  const convex = m => {
    for (let k = 0; k < m.length; k++) {
      const a = P(m[k]), b = P(m[(k + 1) % m.length]), c = P(m[(k + 2) % m.length]);
      if ((b.x - a.x) * (c.y - b.y) - (b.y - a.y) * (c.x - b.x) < -1e-9) return false;
    }
    return true;
  };
  let changed = true;
  while (changed) {
    changed = false;
    search:
    for (let i = 0; i < polys.length; i++) {
      for (let j = i + 1; j < polys.length; j++) {
        const A = polys[i], B = polys[j];
        for (let ai = 0; ai < A.length; ai++) {
          const a = A[ai], b = A[(ai + 1) % A.length];
          const bi = B.findIndex((v, k) => v === b && B[(k + 1) % B.length] === a);
          if (bi < 0) continue;
          const m = [];
          for (let k = 1; k <= A.length; k++) m.push(A[(ai + k) % A.length]);
          for (let k = 2; k < B.length; k++) m.push(B[(bi + k) % B.length]);
          if (!convex(m)) continue;
          polys[i] = m;
          polys.splice(j, 1);
          changed = true;
          break search;
        }
      }
    }
  }
  return polys.map(poly => {
    const pts = poly.map(P);
    return pts.filter((p, k) => {
      const a = pts[(k + pts.length - 1) % pts.length], b = pts[(k + 1) % pts.length];
      return Math.abs((p.x - a.x) * (b.y - p.y) - (p.y - a.y) * (b.x - p.x)) > 1e-7;
    });
  }).filter(pts => pts.length >= 3);
}

// extrude a convex CCW polygon into a convex prism
function prismPart(pts, depth) {
  const h = depth / 2, faces = [];
  faces.push({ pts: pts.map(p => V(p.x, p.y, h)), inner: false });
  faces.push({ pts: pts.map(p => V(p.x, p.y, -h)).reverse(), inner: false });
  for (let i = 0; i < pts.length; i++) {
    const a = pts[i], b = pts[(i + 1) % pts.length];
    const dx = b.x - a.x, dy = b.y - a.y;
    if (Math.hypot(dx, dy) < 1e-6) continue;
    const q = [V(a.x, a.y, h), V(b.x, b.y, h), V(b.x, b.y, -h), V(a.x, a.y, -h)];
    faces.push({ pts: orient(q, V(dy, -dx, 0)), inner: false });
  }
  return faces;
}

function contoursToParts(contours, depth) {
  if (!contours.length) return null;
  // outer shapes share one winding direction, counters (holes) the other
  const biggest = contours.reduce((m, c) => Math.abs(area2(c)) > Math.abs(area2(m)) ? c : m);
  const outerSign = Math.sign(area2(biggest));
  const outers = contours.filter(c => Math.sign(area2(c)) === outerSign).map(c => ({ c, holes: [] }));
  for (const h of contours.filter(c => Math.sign(area2(c)) !== outerSign)) {
    const owner = outers.find(o => pointInPoly(h[0], o.c));
    if (owner) owner.holes.push(h);
  }
  const parts = [];
  for (const { c, holes } of outers) {
    const verts = c.concat(...holes);
    const tris = THREE.ShapeUtils.triangulateShape(c, holes);
    for (const poly of mergeConvex(verts, tris)) parts.push(prismPart(poly, depth));
  }
  return parts.length ? parts : null;
}

// a phrase as centred convex prisms, scaled to `width`
function phraseParts(phrase, width, depth) {
  const contours = traceWord(phrase);
  if (!contours.length) return null;
  const box = new THREE.Box2();
  contours.forEach(c => c.forEach(p => box.expandByPoint(p)));
  const s = width / (box.max.x - box.min.x);
  const cx = (box.min.x + box.max.x) / 2, cy = (box.min.y + box.max.y) / 2;
  const scaled = contours.map(c => c.map(p => new THREE.Vector2((p.x - cx) * s, (p.y - cy) * s)));
  return contoursToParts(scaled, depth);
}


/* ------------------------------------------------------------------ *
 *  Shared look: black coating outside, colour-by-normal inside
 * ------------------------------------------------------------------ */
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(Math.max(devicePixelRatio, 1), 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 0);
renderer.autoClear = false;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.prepend(renderer.domElement);

const outerMat = new THREE.MeshStandardMaterial({ color: 0x000000, roughness: 0.5, metalness: 0 });
const innerMat = new THREE.MeshNormalMaterial();

function buildGeometry(faces) {
  const pos = [], nor = [];
  const emit = isInner => {
    let count = 0;
    for (const f of faces) {
      if (f.inner !== isInner) continue;
      const nn = newell(f.pts);
      if (nn.lengthSq() < 1e-12) continue;
      nn.normalize();
      const p = f.pts;
      for (let i = 1; i < p.length - 1; i++) {
        for (const q of [p[0], p[i], p[i + 1]]) {
          pos.push(q.x, q.y, q.z);
          nor.push(nn.x, nn.y, nn.z);
          count++;
        }
      }
    }
    return count;
  };
  const outer = emit(false);
  const inner = emit(true);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  g.addGroup(0, outer, 0);
  g.addGroup(outer, inner, 1);
  g.computeBoundingSphere();
  return g;
}

const ease = t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
const ray = new THREE.Raycaster();

/* ------------------------------------------------------------------ *
 *  A block of text that can fracture. Each block owns its own scene,
 *  camera and physics world, so the logo stays pinned to the corner
 *  while the hero camera drifts.
 *  States: intact -> fractured -> reassembling -> intact (next phrase)
 * ------------------------------------------------------------------ */
class TextBlock {
  constructor({ kind, phrases, width, cells, swarmSize }) {
    this.kind = kind;                       // 'hero' | 'logo'
    this.phrases = phrases;
    this.width = width;
    this.unit = width / HERO_WIDTH;         // size relative to the hero
    this.depth = BASE_DEPTH * this.unit * (kind === 'logo' ? 1.4 : 1);
    this.cells = cells;
    this.swarmSize = swarmSize;             // how many cursors rebuild this block
    this.hitPad = kind === 'hero' ? 26 : 16;

    this.scene = new THREE.Scene();
    this.camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 1000);
    this.camera.position.set(0, 0, 20);
    this.camTarget = V(0, 0, 20);
    this.lookAt = V(0, 0, 0);

    this.scene.add(new THREE.HemisphereLight(0xffffff, 0xc9ccd3, 1.0));
    const sun = new THREE.DirectionalLight(0xffffff, 2.2);
    sun.position.set(4, 10, 9);
    this.scene.add(sun);
    this.shadows = kind === 'hero';
    if (this.shadows) {
      sun.castShadow = true;
      sun.shadow.mapSize.set(2048, 2048);
      Object.assign(sun.shadow.camera, { left: -14, right: 14, top: 14, bottom: -14, near: 1, far: 40 });
      sun.shadow.bias = -0.0004;
      sun.shadow.normalBias = 0.02;
    }

    this.world = new RAPIER.World({ x: 0, y: -9.81, z: 0 });
    this.ground = null;
    this.catcher = null;
    if (this.shadows) {
      this.catcher = new THREE.Mesh(
        new THREE.PlaneGeometry(90, 90).rotateX(-Math.PI / 2),
        new THREE.ShadowMaterial({ opacity: 0.14 })
      );
      this.catcher.receiveShadow = true;
      this.scene.add(this.catcher);
    }

    this.pieces = [];
    this.pending = [];     // fragments held in place until the crumble reaches them
    this.agents = [];      // the swarm: cursors carrying fragments back into place
    this.queue = [];       // rebuild tasks nobody has picked up yet
    this.built = [];       // meshes the swarm has put in place so far
    this.remaining = 0;    // tasks not yet finished
    this.state = 'intact';
    this.phraseIdx = 0;
    this.angled = false;
    this.epoch = 0;
    this.rootVol = 1;
    this.nextParts = null;
    this.intactBox = null;
    this.maxPieces = Math.round(cells * 5);
  }

  setGroundY(y) {
    if (this.ground) this.world.removeCollider(this.ground, true);
    this.ground = this.world.createCollider(
      RAPIER.ColliderDesc.cuboid(80, 0.5, 80).setTranslation(0, y - 0.5, 0).setFriction(0.9).setRestitution(0.2));
    if (this.catcher) this.catcher.position.y = y;
  }

  /* ---- layout ---- */
  layout(heroZoom) {
    const w = innerWidth, h = innerHeight, c = this.camera;
    c.left = -w / 2; c.right = w / 2; c.top = h / 2; c.bottom = -h / 2;
    if (this.kind === 'hero') {
      c.zoom = Math.min(w * 0.8 / HERO_WIDTH, h * 0.55 / 2.6);
      this.setGroundY(-1.75);
      this.baseView = V(0, 0, 20);
    } else {
      const px = Math.max(92, Math.min(140, w * 0.1));       // logo width on screen
      const margin = w < 560 ? 18 : 28;
      c.zoom = px / this.width;
      const size = this.intactBox ? this.intactBox.getSize(V()) : V(this.width, this.width * 0.25, 0);
      const cx = -w / 2 + margin + px / 2;
      const cy = h / 2 - margin - (size.y * c.zoom) / 2;
      this.baseView = V(-cx / c.zoom, -cy / c.zoom, 20);       // logo sits at world origin
      // same on-screen fall speed as the hero, and the floor is the bottom of the window
      this.world.gravity = { x: 0, y: -9.81 * heroZoom / c.zoom, z: 0 };
      this.setGroundY(this.baseView.y - h / 2 / c.zoom + 0.02);
      this.camTarget.copy(this.baseView);
    }
    c.updateProjectionMatrix();
  }

  /* ---- pieces ---- */
  makeMesh(geometry) {
    const mesh = new THREE.Mesh(geometry, [outerMat, innerMat]);
    mesh.castShadow = this.shadows;
    this.scene.add(mesh);
    return mesh;
  }

  addPiece(parts, vol, pos, rot, fixed) {
    const mesh = this.makeMesh(buildGeometry(parts.flat()));
    mesh.position.copy(pos);
    mesh.quaternion.copy(rot);
    const desc = fixed
      ? RAPIER.RigidBodyDesc.fixed()
      : RAPIER.RigidBodyDesc.dynamic().setLinearDamping(0.03).setAngularDamping(0.5);
    desc.setTranslation(pos.x, pos.y, pos.z).setRotation({ x: rot.x, y: rot.y, z: rot.z, w: rot.w });
    const body = this.world.createRigidBody(desc);
    let made = 0;
    for (const part of parts) {
      const cd = RAPIER.ColliderDesc.convexHull(hullPoints(part));
      if (!cd) continue;
      this.world.createCollider(cd.setRestitution(0.1).setFriction(0.9).setDensity(1), body);
      made++;
    }
    if (!made) {
      this.world.createCollider(
        RAPIER.ColliderDesc.ball(Math.max(0.01, Math.cbrt(vol) * 0.5)).setRestitution(0.1).setFriction(0.9), body);
    }
    const piece = { mesh, body, parts, vol };
    this.pieces.push(piece);
    return piece;
  }

  removePiece(piece) {
    for (let i = this.pending.length - 1; i >= 0; i--) if (this.pending[i].body === piece.body) this.pending.splice(i, 1);
    this.world.removeRigidBody(piece.body);
    this.scene.remove(piece.mesh);
    piece.mesh.geometry.dispose();
    const i = this.pieces.indexOf(piece);
    if (i >= 0) this.pieces.splice(i, 1);
  }

  trimPieces() {
    if (this.pieces.length <= this.maxPieces) return;
    const sorted = [...this.pieces].sort((a, b) => a.vol - b.vol);
    const drop = this.pieces.length - this.maxPieces + 10;
    for (let i = 0; i < drop && i < sorted.length; i++) this.removePiece(sorted[i]);
  }

  setState(s) { this.state = s; }

  spawnIntact(parts) {
    const m = metricsParts(parts);
    this.rootVol = m.vol;
    const box = new THREE.Box3();
    parts.forEach(f => f.forEach(q => q.pts.forEach(p => box.expandByPoint(p))));
    this.intactBox = box;
    this.addPiece(parts, m.vol, V(), IDENT, true);
  }

  /* ---- interaction helpers ---- */
  hits(x, y) {
    if (!this.intactBox) return false;
    const c = this.camera;
    c.updateMatrixWorld();
    const b = this.intactBox;
    const sp = (px, py) => {
      const v = V(px, py, 0).project(c);
      return [(v.x + 1) / 2 * innerWidth, (1 - v.y) / 2 * innerHeight];
    };
    const a = sp(b.min.x, b.min.y), d = sp(b.max.x, b.max.y), pad = this.hitPad;
    return x >= Math.min(a[0], d[0]) - pad && x <= Math.max(a[0], d[0]) + pad &&
           y >= Math.min(a[1], d[1]) - pad && y <= Math.max(a[1], d[1]) + pad;
  }

  pointerToWorld(x, y) {
    ray.setFromCamera(new THREE.Vector2((x / innerWidth) * 2 - 1, -(y / innerHeight) * 2 + 1), this.camera);
    const out = V();
    return ray.ray.intersectPlane(plane, out) ? out : V();
  }

  /* ---- intact -> crumble ---- */
  breakAll(hit) {
    if (this.state !== 'intact') return;
    const piece = this.pieces[0];
    if (!piece) return;
    const u = this.unit;
    const seeds = spreadSeeds(piece.parts, this.cells, 0.003 * u);
    const cells = voronoiCells(piece.parts, seeds, this.rootVol * 0.0006);
    if (cells.length < 2) return;
    const now = nowSec();
    this.removePiece(piece);

    for (const { parts: cp, m } of cells) {
      const center = m.centroid.clone();
      const np = this.addPiece(recentreParts(cp, m.centroid), m.vol, center, IDENT, true);
      const dir = center.clone().sub(hit);
      const dn = dir.length() / u;
      if (dn < 1e-4) dir.set(0, 1, 0); else dir.normalize();
      const k = EXPLODE_FORCE * u * m.vol / (1 + dn * 0.5);
      const imp = { x: dir.x * k, y: dir.y * k + k * 0.05, z: dir.z * k + k * 0.35 };
      const tq = { x: (Math.random() - 0.5) * k * 0.2, y: (Math.random() - 0.5) * k * 0.2, z: (Math.random() - 0.5) * k * 0.2 };
      // hold the piece, then let go as the crack front passes
      this.pending.push({ body: np.body, at: now + dn * 0.085 + Math.random() * 0.18, imp, tq });
    }
    this.trimPieces();
    this.angled = this.kind === 'hero';
    this.setState('fractured');
  }

  /* ---- fractured -> swarm rebuilds the next phrase ---- */
  startReassembly() {
    if (this.state !== 'fractured') return;
    this.pending.length = 0;
    this.setState('reassembling');
    const myEpoch = this.epoch;
    // let the browser repaint before the (short) heavy part
    setTimeout(() => {
      if (myEpoch !== this.epoch) return;
      const u = this.unit;
      const nextPhrase = this.phrases[(this.phraseIdx + 1) % this.phrases.length];
      this.nextParts = phraseParts(nextPhrase, this.width, this.depth);
      if (!this.nextParts) { this.setState('fractured'); return; }
      const m = metricsParts(this.nextParts);
      const N = Math.max(Math.round(this.cells * 0.45), Math.min(Math.round(this.cells * 1.1), this.pieces.length));
      const targets = voronoiCells(this.nextParts, spreadSeeds(this.nextParts, N, 0.003 * u), m.vol * 0.0002)
        .map(c => ({ geo: buildGeometry(recentreParts(c.parts, c.m.centroid).flat()), p1: c.m.centroid.clone() }));

      // pair loose fragments with the cells of the new phrase, left to right
      const cur = [...this.pieces].sort((a, b) => a.mesh.position.x - b.mesh.position.x);
      targets.sort((a, b) => a.p1.x - b.p1.x);
      const bulge = () => V((Math.random() - 0.5) * 1.2 * u, (Math.random() - 0.5) * 1.2 * u, (1 + Math.random() * 1.6) * u);
      const tasks = [];
      const paired = Math.min(cur.length, targets.length);
      for (let i = 0; i < paired; i++) {
        tasks.push({ mode: 'move', piece: cur[i], p1: targets[i].p1, geo: targets[i].geo, bulge: bulge() });
      }
      // more fragments than cells: the extras get carried over and dissolve into the build
      for (let i = paired; i < cur.length; i++) {
        tasks.push({ mode: 'vanish', piece: cur[i], p1: targets[Math.floor(Math.random() * targets.length)].p1.clone(), geo: null, bulge: bulge() });
      }
      // more cells than fragments: a cursor draws the missing ones in place
      for (let i = paired; i < targets.length; i++) {
        tasks.push({ mode: 'spawn', piece: null, p1: targets[i].p1, geo: targets[i].geo, bulge: null });
      }
      tasks.sort((a, b) => a.p1.x - b.p1.x);     // the phrase builds left to right
      this.queue = tasks;
      this.built = [];
      this.remaining = tasks.length;
      this.angled = false;
      this.launchSwarm(tasks.length);
    }, 30);
  }

  /* ---- the swarm ---- */
  toScreen(v) {
    const p = v.clone().project(this.camera);
    return { x: (p.x + 1) / 2 * innerWidth, y: (1 - p.y) / 2 * innerHeight };
  }

  launchSwarm(taskCount) {
    const count = Math.min(this.swarmSize, Math.max(3, taskCount));
    const w = innerWidth, h = innerHeight, now = nowSec();
    const palette = Math.floor(Math.random() * AGENT_COLORS.length);
    for (let i = 0; i < count; i++) {
      // each cursor flies in from a random point just outside the window
      const side = Math.floor(Math.random() * 4), r = Math.random();
      const x = side === 0 ? -40 : side === 1 ? w + 40 : r * w;
      const y = side === 2 ? -40 : side === 3 ? h + 40 : r * h;
      const fast = Math.random() < 0.2;
      const el = document.createElement('div');
      el.className = 'agent';
      el.innerHTML = '<svg width="28" height="28" viewBox="0 0 28 28"></svg>';
      swarmEl.appendChild(el);
      this.agents.push({
        el, svg: el.firstChild, drawn: '', shape: 'arrow',
        color: AGENT_COLORS[(palette + i * 5) % AGENT_COLORS.length],
        x, y, vx: 0, vy: 0, angle: 0, press: 0, alpha: 0,
        speed: fast ? rand(1500, 2000) : rand(750, 1200),
        agility: rand(5, 9), curl: rand(-1, 1), tempo: rand(0.85, 1.25),
        state: 'seek', stateT: now, wake: now + i * 0.04 + Math.random() * 0.15,
        task: null, gx: 0, gy: 0,
      });
    }
  }

  // where a cursor has to be to start on a task (screen px); null = nothing left to do
  pickup(t) {
    if (t.mode !== 'spawn' && !this.pieces.includes(t.piece)) {
      if (t.mode === 'vanish') return null;
      t.mode = 'spawn';                        // the fragment is gone, so draw the cell in place
    }
    if (t.mode === 'spawn') {
      const s = this.toScreen(t.p1);
      return { x: s.x - 16, y: s.y - 16 };     // drag out the box from its top-left corner
    }
    return this.toScreen(t.piece.mesh.position);
  }

  // the nearest of the next few tasks in the left-to-right queue
  claim(a) {
    while (this.queue.length) {
      const head = Math.min(6, this.queue.length);
      let best = -1, bd = Infinity, dropped = false;
      for (let i = 0; i < head; i++) {
        const g = this.pickup(this.queue[i]);
        if (!g) { this.queue.splice(i, 1); this.remaining--; dropped = true; break; }
        const d = (g.x - a.x) ** 2 + (g.y - a.y) ** 2;
        if (d < bd) { bd = d; best = i; }
      }
      if (dropped) continue;
      return this.queue.splice(best, 1)[0];
    }
    return null;
  }

  // steer toward a point: curved, eased approach, with a bit of personal space
  steer(a, tx, ty, dt, boost = 1) {
    const dx = tx - a.x, dy = ty - a.y, dist = Math.hypot(dx, dy) || 1e-6;
    const nx = dx / dist, ny = dy / dist;
    const bend = a.curl * 0.55 * Math.min(1, dist / 260);
    const ux = nx - ny * bend, uy = ny + nx * bend, ul = Math.hypot(ux, uy) || 1;
    const sp = a.speed * boost * Math.min(1, 0.22 + dist / 220);
    const k = Math.min(1, a.agility * dt);
    a.vx += (ux / ul * sp - a.vx) * k;
    a.vy += (uy / ul * sp - a.vy) * k;
    for (const o of this.agents) {
      if (o === a) continue;
      const ox = a.x - o.x, oy = a.y - o.y, d = Math.hypot(ox, oy);
      if (d > 0.01 && d < 26) {
        const push = (1 - d / 26) * 380 * dt;
        a.vx += ox / d * push; a.vy += oy / d * push;
      }
    }
    a.x += a.vx * dt; a.y += a.vy * dt;
  }

  // glue the cursor to a point (it is holding something)
  hold(a, x, y, dt) {
    const d = Math.max(dt, 1e-3);
    a.vx += ((x - a.x) / d - a.vx) * 0.3;
    a.vy += ((y - a.y) / d - a.vy) * 0.3;
    a.x = x; a.y = y;
  }

  leave(a, now) {
    a.state = 'exit'; a.stateT = now; a.shape = 'arrow';
    const dx = a.x - innerWidth / 2, dy = a.y - innerHeight / 2;
    const ang = Math.atan2(dy, dx) + rand(-0.8, 0.8), far = Math.max(innerWidth, innerHeight);
    a.gx = a.x + Math.cos(ang) * far;
    a.gy = a.y + Math.sin(ang) * far;
  }

  kill(a) {
    a.el.remove();
    const i = this.agents.indexOf(a);
    if (i >= 0) this.agents.splice(i, 1);
  }

  beginTask(a, now) {
    const t = a.task;
    a.stateT = now;
    t.t0 = now;
    if (t.mode === 'spawn') {
      t.mesh = this.makeMesh(t.geo);
      t.mesh.position.copy(t.p1);
      t.mesh.scale.setScalar(0.001);
      this.built.push(t.mesh);
      t.dur = 0.45 / a.tempo;
      a.state = 'draw';
      return;
    }
    // pick the fragment up: it leaves the physics world and follows the cursor
    const piece = t.piece, tr = piece.body.translation(), r = piece.body.rotation();
    t.p0 = V(tr.x, tr.y, tr.z);
    t.q0 = new THREE.Quaternion(r.x, r.y, r.z, r.w);
    this.world.removeRigidBody(piece.body);
    this.pieces.splice(this.pieces.indexOf(piece), 1);
    t.mesh = piece.mesh;
    t.swapped = false;
    if (t.mode === 'move') this.built.push(t.mesh);
    const s0 = this.toScreen(t.p0), s1 = this.toScreen(t.p1);
    t.dur = clamp(0.38 + Math.hypot(s1.x - s0.x, s1.y - s0.y) / 1500, 0.45, 0.95) / a.tempo;
    a.state = 'carry';
  }

  tickAgent(a, dt, now) {
    if (now < a.wake) return;
    a.alpha = a.state === 'exit' ? a.alpha : Math.min(1, a.alpha + dt * 5);
    switch (a.state) {
      case 'seek': {
        if (!a.task) {
          a.task = this.claim(a);
          if (!a.task) { this.leave(a, now); return; }
        }
        const g = this.pickup(a.task);
        if (!g) { this.remaining--; a.task = null; return; }
        a.shape = a.task.mode === 'spawn' ? 'cross' : 'arrow';
        this.steer(a, g.x, g.y, dt);
        if (Math.hypot(g.x - a.x, g.y - a.y) < 10 || now - a.stateT > 4) {
          a.x = g.x; a.y = g.y;
          this.beginTask(a, now);
        }
        break;
      }
      case 'carry': {
        const t = a.task, k = clamp((now - t.t0) / t.dur, 0, 1), e = ease(k), mesh = t.mesh;
        mesh.position.lerpVectors(t.p0, t.p1, e).addScaledVector(t.bulge, Math.sin(Math.PI * e));
        mesh.quaternion.copy(t.q0).slerp(IDENT, e);
        let s;
        if (t.mode === 'vanish') s = Math.max(0.001, 1 - e);
        else {
          s = 1 - 0.55 * Math.sin(Math.PI * e);
          if (!t.swapped && e >= 0.5) { mesh.geometry.dispose(); mesh.geometry = t.geo; t.swapped = true; }
        }
        mesh.scale.setScalar(s);
        const p = this.toScreen(mesh.position);
        this.hold(a, p.x, p.y, dt);
        a.press = Math.min(1, a.press + dt * 10);
        if (k >= 1) {
          if (t.mode === 'vanish') { this.scene.remove(mesh); mesh.geometry.dispose(); }
          else mesh.scale.setScalar(1);
          a.state = 'settle'; a.stateT = now;
        }
        break;
      }
      case 'draw': {
        const t = a.task, k = clamp((now - t.t0) / t.dur, 0, 1), e = easeOut(k);
        t.mesh.scale.setScalar(Math.max(0.001, e));
        const c = this.toScreen(t.p1);
        this.hold(a, c.x - 16 + 32 * e, c.y - 16 + 32 * e, dt);   // the crosshair drags the box out
        a.press = Math.min(1, a.press + dt * 10);
        if (k >= 1) { a.state = 'settle'; a.stateT = now; }
        break;
      }
      case 'settle': {
        a.press = Math.max(0, a.press - dt * 12);
        a.vx *= 0.8; a.vy *= 0.8;
        if (now - a.stateT > 0.07) {
          this.remaining--;
          a.task = null; a.state = 'seek'; a.stateT = now;
        }
        break;
      }
      case 'exit': {
        this.steer(a, a.gx, a.gy, dt, 1.4);
        if (now - a.stateT > 0.8) a.alpha -= dt * 3;
        if (a.alpha <= 0 || a.x < -80 || a.y < -80 || a.x > innerWidth + 80 || a.y > innerHeight + 80) this.kill(a);
        break;
      }
    }
  }

  renderAgents() {
    for (const a of this.agents) {
      const sh = AGENT_SHAPES[a.shape], key = a.shape + a.color;
      if (a.drawn !== key) {
        a.svg.innerHTML = sh.svg(a.color);
        a.svg.style.transformOrigin = `${sh.hot[0]}px ${sh.hot[1]}px`;
        a.drawn = key;
      }
      const tilt = a.shape === 'arrow' ? clamp(a.vx * 0.014, -20, 20) : 0;
      a.angle += (tilt - a.angle) * 0.2;
      a.el.style.opacity = a.alpha;
      a.el.style.transform = `translate(${a.x.toFixed(1)}px,${a.y.toFixed(1)}px)`;
      a.svg.style.transform = `translate(${-sh.hot[0]}px,${-sh.hot[1]}px) rotate(${a.angle.toFixed(1)}deg) scale(${(1 - a.press * 0.14).toFixed(3)})`;
    }
  }

  updateSwarm(dt) {
    if (!this.agents.length) return;
    this.camera.updateMatrixWorld();
    const now = nowSec();
    for (const a of [...this.agents]) this.tickAgent(a, dt, now);
    if (this.state === 'reassembling' && this.nextParts && this.remaining <= 0) this.finishReassembly();
    this.renderAgents();
  }

  finishReassembly() {
    for (const m of this.built) { this.scene.remove(m); m.geometry.dispose(); }
    this.built = [];
    this.queue = [];
    this.phraseIdx = (this.phraseIdx + 1) % this.phrases.length;
    this.spawnIntact(this.nextParts);
    this.nextParts = null;
    this.angled = false;
    const now = nowSec();
    for (const a of this.agents) if (a.state !== 'exit') this.leave(a, now);
    this.setState('intact');
  }

  /* ---- per frame ---- */
  step() {
    this.world.step();
    for (const p of [...this.pieces]) {
      const t = p.body.translation(), r = p.body.rotation();
      if (Math.abs(t.x) > 400 || Math.abs(t.z) > 400 || t.y > 400) { this.removePiece(p); continue; }
      p.mesh.position.set(t.x, t.y, t.z);
      p.mesh.quaternion.set(r.x, r.y, r.z, r.w);
    }
    if (this.pending.length) {
      const now = nowSec();
      for (let i = this.pending.length - 1; i >= 0; i--) {
        const r = this.pending[i];
        if (now < r.at) continue;
        this.pending.splice(i, 1);
        r.body.setBodyType(RAPIER.RigidBodyType.Dynamic, true);
        r.body.setLinearDamping(0.03);
        r.body.setAngularDamping(0.5);
        r.body.applyImpulse(r.imp, true);
        r.body.applyTorqueImpulse(r.tq, true);
      }
    }
  }

  render(dt) {
    if (this.kind === 'hero') {
      this.camTarget.set(this.angled ? -8 : 0, this.angled ? 5 : 0, 20);
      this.camera.position.lerp(this.camTarget, 0.07);
      this.camera.lookAt(0, 0, 0);
    } else {
      this.camera.position.copy(this.baseView);
      this.camera.lookAt(this.baseView.x, this.baseView.y, 0);
    }
    this.updateSwarm(dt);
    renderer.clearDepth();
    renderer.render(this.scene, this.camera);
  }
}

/* ------------------------------------------------------------------ *
 *  The page: a hero block and a logo block
 * ------------------------------------------------------------------ */
const hero = new TextBlock({ kind: 'hero', phrases: HERO_PHRASES, width: HERO_WIDTH, cells: 72, swarmSize: 20 });
const logo = new TextBlock({ kind: 'logo', phrases: LOGO_PHRASES, width: LOGO_WIDTH, cells: 30, swarmSize: 7 });
const blocks = [hero, logo];

function layoutAll() {
  renderer.setSize(innerWidth, innerHeight);
  hero.layout();
  logo.layout(hero.camera.zoom);
}

/* ------------------------------------------------------------------ *
 *  Interaction: click the text to break it, click again to send the swarm in
 * ------------------------------------------------------------------ */
function hoveredBlock(x, y) {
  for (const b of [logo, hero]) if (b.state === 'intact' && b.hits(x, y)) return b;
  return null;
}

let downAt = null;
renderer.domElement.addEventListener('pointerdown', e => { downAt = { x: e.clientX, y: e.clientY }; });
renderer.domElement.addEventListener('pointerup', e => {
  const moved = downAt ? Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y) : 99;
  downAt = null;
  if (moved > 10) return;
  const hb = hoveredBlock(e.clientX, e.clientY);
  if (hb) hb.breakAll(hb.pointerToWorld(e.clientX, e.clientY));
  else for (const b of blocks) if (b.state === 'fractured') b.startReassembly();
});

addEventListener('resize', layoutAll);

/* ------------------------------------------------------------------ *
 *  Start (wait for Satoshi so the traced outlines match it)
 * ------------------------------------------------------------------ */
async function prepFont() {
  try {
    const link = document.querySelector('link[href*="fontshare"][rel="stylesheet"]');
    if (link) {
      link.media = 'all';
      if (!link.sheet) await new Promise(r => {
        link.addEventListener('load', r, { once: true });
        link.addEventListener('error', r, { once: true });
      });
    }
    const faces = await document.fonts.load('700 200px Satoshi', 'ux is dead. zack.cx');
    return faces.length > 0;
  } catch { return false; }
}
await Promise.race([prepFont(), new Promise(r => setTimeout(() => r(false), 6000))]);

for (const b of blocks) {
  const parts = phraseParts(b.phrases[0], b.width, b.depth);
  if (!parts) {
    errEl.style.display = 'grid';
    errEl.textContent = 'Could not draw the text in this browser.';
    throw new Error('trace failed');
  }
  b.spawnIntact(parts);
}
layoutAll();

/* ------------------------------------------------------------------ *
 *  Loop
 * ------------------------------------------------------------------ */
const clock = new THREE.Clock();
let acc = 0;
const STEP = 1 / 60;
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05);
  acc += dt;
  while (acc >= STEP) { for (const b of blocks) b.step(); acc -= STEP; }
  renderer.clear();
  hero.render(dt);
  logo.render(dt);   // drawn last so it stays on top
}
frame();
</script>
