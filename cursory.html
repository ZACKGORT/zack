<style>

#aud{left:542px;cursor:pointer}#loc{left:706px}#inq{right:16px;text-align:right}

ond. It is our signal.  Here, you stand by your signal; you may not edit your signal; you may not delete your signal",0,0,[["(though, you may draft/publish it once you are confident in your signal)",0,0,[["_but once the signal is sent, it's sent — capiche?_",0,0,[]]]]]]]]],[],"NEVEREVER"],["R&D — Exhibit #3","ifimaybefrank.com","A read & write surface — where format empowers form.",0,0,0,["#2b2b2b","#e8d9b0","#f6f1e4"],[["Type",["R&D"]],["Link",["ifimaybefrank.com"]],["Thesis",["a read & write surface — where format empowers form."]]],"",[["# a read & write surface — where format empowers form.",0,1,[["here, we do not write into a blank page that later gets formatted.",0,0,[["Nay, here we write into a hierarchical, spatial system that becomes the article.",0,0,[]]]]]],["(https://ifimaybefrank.com)",0,0,[["https://ifimaybefrank.com",0,0,[]],["Reader:Writer — a prose platform.",0,0,[]],["Structure is the first act of writing. The reading surface is simply what that structure becomes.",0,0,[]],["authorship and provenance over reach.","#8e8e93",0,[]]]]],[],"FRANKLY"],["R&D — Exhibit #4","Frankly Classic","A personal, but public space. Provenance over polish.",0,0,0,["#3d3d3d","#c8a46a","#efe7d6"],[["Type",["R&D"]],["Link",["ifimaybefrank.com/classic"]],["Thesis",["a personal, but public space."]]],"",[["# a personal, but public space.",0,1,[]],["(https://ifimaybefrank.com/classic)",0,0,[["https://ifimaybefrank.com/classic",0,0,[]],["The original permutation of my Frankly system; a proof of concept with potential to scale.",0,0,[["thinking of themes of provenance over polish.",0,0,[]]]],["\"the basic premise was writing with micro & macro intentionality\"","#8e4ec6",1,[]]]]],[],"FRANKLY CLASSIC"],["R&D — Exhibit #5","emdash.click","A satirical storefront making the case that it’s okay to still use the em dash.",0,0,0,["#111","#ffd60a","#fffbe6"],[["Type",["R&D"]],["Link",["emdash.click"]],["Thesis",["fight the good fight, folks"]]],"",[["# fight the good fight, folks",0,
