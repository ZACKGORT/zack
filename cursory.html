<style>
:root{--sans:Satoshi,"Helvetica Neue",Arial,sans-serif;--mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;--brand:#111;--bg:#f2f2f2;--fg:#111;--mute:rgba(17,17,17,.62);--ghost:rgba(17,17,17,.28);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root{--pink:#FF8DA1}

const P=[["Work — Publicis Sapient","BNY Mellon — Pershing X","Disparate legacy applications brought into one intelligent dashboard — pre-A.I.",0,0,0,["#0091ff","#111","#dcecff"],[["Role",["Senior UX Designer","Product Design Lead (IA / flows)"]],["Agency",["Publicis Sapient"]],["Client",["BNY Mellon — Pershing X"]]],"https://raw.githubusercontent.com/ZACKGORT/never/main/images/avif/1-Oen-HCQm-Ga10wp-Cz-R8o9-Pt-A.avif",[["Wove.",0,0,[["Design systems, dashboards, data, & due diligence.",0,0,[["Client: BNY Mellon — Pershing X","#0091ff",0,[]],["Agency: Publicis Sapient","#0091ff",0,[]],["Role: Senior UX Designer, Product Design Lead (IA / flows)","#0091ff",0,[]]]]]],["Disparate legacy applications brought into an intelligent dashboard, pre-A.I.",0,0,[["Advisors worked across a tangle of disconnected tools.",0,0,[]],["Context was lost at every handoff.",0,0,[]],["Data had to be re-entered, again and again.",0,0,[]],["So we flattened it.",0,0,[["One dashboard. Interconnected.",0,0,[]],["A client's full financial picture in one place.",0,0,[]],["Work moves across modules without re-entry.",0,0,[]]]]]],["That's Wove.",0,0,[["An industry-first platform.",0,0,[]],["Built with BNY Mellon power, scale, and security.",0,0,[]],["Advisors work faster. They serve more clients.",0,0,[]]]],["My piece:",0,0,[["Information architecture.",0,0,[]],["Task and flow mapping.",0,0,[]],["Cross-module navigation.",0,0,[]],["Component patterns that keep data alive across steps.",0,0,[]]]],["One more thing.","#e93d82",0,[["No Artificial Intelligence Here.","#e93d82",0,[["This was 2023 into 2024. Before the buzzword craze and the subsequent hype.",0,0,[["The world was getting distracted by the wow-factor of AI developments. AI had ZERO part in any of this.",0,0,[]],["It was human blood, sweat, and copious amounts of caffeine.",0,0,[]]]],["We analyzed every individual legacy application. Mapped it. Socialized it with the team. Shipped it.",0,0,[]]]],["A viable, modernized financial product ecosystem. To one of the largest banking entities in the world.",0,0,[]]]]],[["Account Opening","https://i.ibb.co/HGv7ymj/4.jpg"],["BNY 1","https://raw.githubusercontent.com/ZACKGORT/never/main/images/avif/bny1.avif"],["BNY 2","https://raw.githubusercontent.com/ZACKGORT/never/main/images/avif/bny2.avif"],["BNY 3","https://raw.githubusercontent.com/ZACKGORT/never/main/images/avif/bny3.avif"],["BNY 4","https://raw.githubusercontent.com/ZACKGORT/never/main/images/avif/bny4.avif"]],"BNY / WOVE"],["Work — Elva Design Group","General Nutrition Centers","A ~$500M/year post-bankruptcy recovery, courtesy of a mobile-first marketplace.",0,0,0,["#e5484d","#8e4ec6","#ffe4e4"],[["Role",["Senior UX Designer"]],["Agency",["Elva Design Group"]],["Client",["General Nutrition Centers (GNC)"]]],"https://i.ibb.co/7N2rDqrN/8.webp",[["This is the Whey.",0,0,[["Client: General Nutrition Centers (GNC)","#e5484d",0,[]],["Agency: Elva Design Group","#e5484d",0,[]],["Role: Senior UX Designer","#e5484d",0,[]]]],["A 500m/year post-bankruptcy recovery, courtesy of a mobile-first marketplace.",0,0,[["GNC had just come through a bankruptcy.",0,0,[["They asked us to shake things up.",0,0,[["A total overhaul.",0,0,[]],["A modern, modular e-commerce solution.",0,0,[]],["A ground-up build on the Shopify platform.",0,0,[]]]]]],["{We} dove deep.",0,0,[["Market research.",0,0,[]],["[Client-supplied] user data.",0,0,[]],["Wireframe feature prototyping.",0,0,[]],["A modular, component-based design system — optimized for continued optimization.",0,0,[]]]],["Heavy lift. Huge gains.",0,0,[["Lead UX: IA, UI prototypes, design systems.",0,0,[]],["Paired with PM, Dev Lead, Design Team, Client-Side Stakeholders.",0,0,[]],["12-week engagement. Tight cadence. Fast-on-our-feet design + strategy.",0,0,[]],["Weekly exec reviews.",0,0,[]]]]]],["What we shipped:",0,1,[["A modern, mobile-first navigation schema.",0,0,[]],["A retail taxonomy strategy that separated GNC from its competition.",0,0,[]],["Not just from its competition — from the whole e-retail space.",0,0,[]]]],["The result helped GNC reclaim ~$500M in annual revenue.","#8e4ec6",1,[["if the bar ain't bending, you're just pretending.","#8e8e93",0,[]]]]],[["Handheld","https://i.ibb.co/cSQCgNQY/work1.webp"],["Mobile Overview","https://i.ibb.co/pBMMxY1Z/11.webp"],["Mobile Closeup","https://i.ibb.co/7N2rDqrN/8.webp"],["Desktop Navigation","https://i.ibb.co/vx76zjgf/10.webp"],["Desktop Homepage","https://i.ibb.co/rft2bf0T/9.webp"],["Mobile Commerce","https://i.ibb.co/cXg5Phdc/3.webp"],["Product Detail Page","https://i.ibb.co/99h2bQMh/6.webp"],["Rewards Program","https://i.ibb.co/yB4RwkTf/7.webp"],["Research","https://i.ibb.co/spHgPH6N/1.webp"]],"GNC"],["Work — LiveArea","Hardinge Inc. — B2B SAP Hybris","What the heck is a 5C Collet? Gamifying requirements for a B2B SAP Hybris build.",0,0,0,["#f76b15","#111","#ffe8d6"],[["Role",["Principal UX","UX Manager"]],["Agency",["LiveArea"]],["Client",["Hardinge Inc."]]],"https://raw.githubusercontent.com/ZACKGORT/never/main/images/avif/herohardinge-Plbu-Hi-Swg-Qd-Ruqc-Ni-Ulf.avif",[["What the heck is a 5C Collet?",0,0,[["Client: Hardinge Inc.","#f76b15",0,[]],["Agency: LiveArea","#f76b15",0,[]],["Role: Principal UX · UX Manager","#f76b15",0,[]]]],["Cards Against Humanity",0,0,[["Board-level visibility.",0,0,[]],["SAP Hybris.",0,0,[]],["A client so unfamiliar with the design process that jargon-laden spreadsheets nearly cost us the contract.",0,0,[]],["Navigation was slated as a Drop 1 deliverable.",0,0,[["The actual taxonomy review was months away.",0,0,[]]]]]],["So, I gamified our requirements gathering process:",0,0,[["Cards Against Bad UX™",0,0,[["Shifted the conversation away from jargon and toward user-centric thinking.",0,0,[]],["Simple visual cards:",0,0,[["“As a shopper,”",0,0,[]],["“As a content manager,”",0,0,[]],["“As a guest user.”",0,0,[]]]],["Stakeholders learned to empathize with their end users.",0,0,[]],["Approved on the first call. Two modest feedback adjustments.",0,0,[]]]]]],["Drop 1 scope (partial):",0,0,[["Style guide.",0,0,[]],["Header — Default / Guest / Authenticated.",0,0,[]],["Type-ahead / search suggestions.",0,0,[]],["Tools (B2B) menu.",0,0,[]],["Category navigation.",0,0,[]],["My Account.",0,0,[]],["Account registration.",0,0,[]],["Guest order history lookup.",0,0,[]],["Cookies / tracking consent.",0,0,[]],["Footer.",0,0,[]],["Homepage.",0,0,[]]]],["The override.","#e93d82",0,[["A ranking teammate insisted their version ship the night before the presentation.",0,0,[]],["I stayed up all night and made both happen.",0,0,[]],["We showed their version first. The client was pleased — but asked if we had anything else.",0,0,[]],["Minutes into mine: enthusiastic approval, on the spot.","#e93d82",0,[]]]],["PDP: Perspective, Diligence & Payoff.",0,0,[["One week. Single purchase, variable purchase, kit & bundled items.",0,0,[]],["Iterated in both desktop and mobile. That's normal fare.",0,0,[]],["The quirk:",0,0,[["The PM and Solutions Architect wanted to force it to dev sight-unseen.",0,0,[]],["Obviously the client wanted to see it. We showed. They responded.",0,0,[]]]]]],["Some people take notes on the call. Some are in the call.","#8e4ec6",1,[["Gauging vocal inflections. Reading between the lines.","#8e8e93",0,[]],["I am a user experience designer.","#8e8e93",0,[]]]]],[["PDP — Desktop, Single Purchase Item","https://raw.githubusercontent.com/ZACKGORT/never/main/images/avif/switchtodroppdpconceptsyrf-TSes-HS.avif"],["PDP — Mobile, Variable & Kit Items","https://raw.githubusercontent.com/ZACKGORT/never/main/images/avif/dropmyinterpretationp-SXi-Ii-YKYBGt.avif"],["Drop 1 — Navigation, Header & Search","https://raw.githubusercontent.com/ZACKGORT/never/main/images/avif/dropnavigation-Oz-Dt-Hno-Ngy-Ckoww-Dg-K.avif"],["ShopHardinge.com — High-Fidelity UI","https://raw.githubusercontent.com/ZACKGORT/never/main/images/avif/finalizednavigationfmb-YVOjfy-CHcf.avif"],["Final Deliverables 1","https://raw.githubusercontent.com/ZACKGORT/never function node(n,d){const[t,c,s,k]=n;return `<div class="n d${Math.min(d,3)}${s?' sh':''}"${c?` style="color:${c}"`:''}>${lk(t.replace(/^#+\s*/,''))}</div>`+(k&&k.length?`<div class="kids">${k.map(x=>node(x,d+1)).join('')}</div>`:'')}
function shotsOf(i){const p=P[i],out=[],seen=new Set(),add=(src,cap)=>{if(!src||seen.has(src))return;seen.add(src);out.push([cap||'',src])};
 if(p[8])add(p[8],p[1]);(p[10]||[]).forEach(g=>add(g[1],g[0]));
 if(!out.length&&CI[i])add('https://raw.githubusercontent.com/ZACKGORT/zack/main/media/'+CI[i]+'.png',p[1]);
 return out}
function metaHTML(rows){return (rows||[]).map(r=>`<div class="cs-row"><span class="k">${esc(r[0])}</span><div class="v">${r[1].map(v=>{const s=String(v);if(/^(https?:\/\/)?[a-z0-9.-]+\.[a-z]{2,}(\/\S*)?$/i.test(s)){const href=/^https?:\/\//i.test(s)?s:'https://'+s;return `<a class="lk" href="${esc(href)}" target="_blank" rel="noopener">${esc(s.replace(/^https?:\/\//,''))} ↗</a>`}return esc(s)}).join('<br>')}</div></div>`).join('')}
const CASE_W=.64,CASE_H=.8,CASE_MAXW=1280; // case-study widget size as a fraction of the viewport (desktop, landscape ~4:3 at normal sizes; width capped on very wide screens). Under 900px it stays a full-width sheet
function openCase(i){const p=P[i];
 let w=FW.find(x=>x.dataset.k==='c'+i);if(w){fwFocus(w);return}
 const big=innerWidth>=900,shots=shotsOf(i),nxt=(i+1)%P.length,np=P[nxt];
 const accent=(p[6]&&p[6][0])||'var(--brand)',naccent=(np[6]&&np[6][0])||accent;
 w=fwMake('c'+i,p[1],'ic',big?Math.round(Math.max(440,Math.min(CASE_MAXW,innerWidth*CASE_W))):innerWidth-8,big?Math.round(Math.max(380,innerHeight*CASE_H)):innerHeight-48,EMB[i]||'');
 const fb=w.querySelector('.fb');
 const figs=shots.map((g,k)=>`<figure class="cs-shot" data-s="${k}"><img loading="lazy" decoding="async" referrerpolicy="no-referrer" alt="${esc(g[0]||p[1]).replace(/"/g,'&quot;')}" src="${g[1]}">${g[0]?`<figcaption>${esc(g[0])}</figcaption>`:''}</figure>`).join('');
 const map=shots.length?`<div class="cs-map" aria-label="Project images">${shots.map((g,k)=>`<button type="button" data-s="${k}" aria-label="${esc(g[0]||('Image '+(k+1))).replace(/"/g,'&quot;')}"><img alt="" src="${g[1]}"></button>`).join('')}</div>`:'';
 const essay=p[9]&&p[9].length?`<div class="cs-copy">${p[9].map(n=>node(n,0)).join('')}</div>`:'';
 const full=EMB[i]?`<a class="cs-full" href="${esc(EMB[i])}" target="_blank" rel="noopener">Full showcase →</a>`:'';
 const metaRows=(p[7]||[]).map(r=>`<div class="row"><span class="k">${esc(r[0])}</span><div class="v">${r[1].map(v=>{const s=String(v);if(/^(https?:\/\/)?[a-z0-9.-]+\.[a-z]{2,}(\/\S*)?$/i.test(s)){const href=/^https?:\/\//i.test(s)?s:'https://'+s;return `<a href="${esc(href)}" target="_blank" rel="noopener">${esc(s.replace(/^https?:\/\//,''))} ↗</a>`}return esc(s)}).join('<br>')}</div></div>`).join('');
 const metaBar=(p[7]||[]).map(r=>`<div class="row"><span class="k">${esc(r[0])}</span><span class="v">${r[1].map(v=>{const s=String(v);if(/^(https?:\/\/)?[a-z0-9.-]+\.[a-z]{2,}(\/\S*)?$/i.test(s)){const href=/^https?:\/\//i.test(s)?s:'https://'+s;return `<a href="${esc(href)}" target="_blank" rel="noopener">${esc(s.replace(/^https?:\/\//,''))}</a>`}return esc(s)}).join(' · ')}</span></div>`).join('');
 // progressive blur bands inside the case study
 const blurBands=(matchMedia('(pointer:coarse)').matches||innerWidth<=900)?[6,16]:[3,8,18];
 const blurHTML=[['top','to top','left:0;right:0;top:0;height:min(18cqh,140px)'],['bottom','to bottom','left:0;right:0;bottom:0;height:min(22cqh,180px)']].map(([n,dir,pos])=>{
  return blurBands.map((b,i)=>{const N=blurBands.length,st=[i,i+1,i+2,i+3].map(k=>k/N*100).filter(v=>v<=100.01);
   const g=`linear-gradient(${dir},rgba(0,0,0,0) ${st[0]}%,#000 ${st[1]}%${st[2]!==undefined?`,#000 ${st[2]}%`:''}${st[3]!==undefined?`,rgba(0,0,0,0) ${st[3]}%`:''})`;
   return `<i style="${pos};backdrop-filter:blur(${b}px);-webkit-backdrop-filter:blur(${b}px);-webkit-mask-image:${g};mask-image:${g}"></i>`}).join('')}).join('');
 fb.innerHTML=`<article class="cs" style="--cs-accent:${accent};--cs-next:${naccent}">
  <div class="cs-blur" aria-hidden="true">${blurHTML}</div>
  <div class="cs-scroll">
   <div class="cs-sticky"><div class="cs-panel" data-movable="meta"><div class="cs-panel-inner">${metaRows}</div></div></div>
   <div class="cs-article">
    <header class="cs-hero">
     <p class="cs-kicker">${esc(p[0])}</p>
     <h1 class="cs-h1">${esc(p[1])}</h1>
     <p class="cs-lede">${esc(p[2])}</p>
     <div class="cs-meta-bar">${metaBar}${full?`<div class="row">${full}</div>`:''}</div>
    </header>
    ${figs}
    ${essay}
   </div>
   <div class="cs-next"><p class="k">Next project</p><button type="button" class="cs-nx">${esc(np[1])}<i aria-hidden="true"></i></button></div>
  </div>
  ${map}
 </article>`;
 const sc=fb.querySelector('.cs-scroll'),sticky=fb.querySelector('.cs-sticky'),panel=fb.querySelector('.cs-panel'),shotEls=[...fb.querySelectorAll('.cs-shot')],mapBtns=[...fb.querySelectorAll('.cs-map button')];
 const topOf=el=>el.getBoundingClientRect().top-sc.getBoundingClientRect().top+sc.scrollTop;
 // fade sticky meta + liquid soft parallax on images as user scrolls
 const sync=()=>{const y=sc.scrollTop,h=sc.clientHeight||1;
  const t=Math.max(0,Math.min(1,(y-40)/220));
  sticky.style.opacity=String(1-t);
  sticky.style.transform=`translateY(${-t*12}px)`;
  sticky.style.pointerEvents=t>.92?'none':'auto';
  // subtle liquid scale on shots near center
  shotEls.forEach(el=>{if(el.classList.contains('x'))return;const mid=topOf(el)+el.offsetHeight*.5,d=Math.abs(mid-(y+h*.45))/(h*.55);const s=1-.02*Math.min(1,d);el.style.transform=`scale(${s.toFixed(4)})`;el.style.transition='transform .4s ease-out'});
  if(shotEls.length){const mid=y+h*.46;let best=0,bd=1e9;shotEls.filter(el=>!el.classList.contains('x')).forEach(el=>{const d=Math.abs(topOf(el)+el.offsetHeight*.5-mid);if(d<bd){bd=d;best=+el.dataset.s}});mapBtns.forEach(b=>b.classList.toggle('on',+b.dataset.s===best))}};
 sc.addEventListener('scroll',sync,{passive:true});
 mapBtns.forEach(b=>b.onclick=()=>{const el=shotEls[+b.dataset.s];if(el)el.scrollIntoView({behavior:RM?'auto':'smooth',block:'center'})});
 fb.querySelectorAll('.cs-shot img').forEach(im=>{im.onerror=()=>{const f=im.closest('.cs-shot');if(!f)return;f.classList.add('x');const b=fb.querySelector('.cs-map [data-s="'+f.dataset.s+'"]');if(b)b.remove();sync()}});
 const nx=fb.querySelector('.cs-nx');nx.onclick=()=>{w.remove();const k=FW.indexOf(w);if(k>-1)FW.splice(k,1);fwZ();openCase(nxt)};
 // movable meta panel (desktop): same gesture language as homepage widgets
 (()=>{if(matchMedia('(pointer:coarse)').matches||innerWidth<900)return;
  const key='csmeta.'+i;let pos=null;try{pos=JSON.parse(localStorage.getItem(key))}catch(e){}
  if(pos&&typeof pos.x==='number'){panel.style.position='relative';panel.style.translate=pos.x+'px '+pos.y+'px'}
  const h=document.createElement('div');h.className='gh';h.setAttribute('role','button');h.tabIndex=0;
  h.setAttribute('aria-label','Move details: drag, double-click to reset');h.style.zIndex='8';
  document.body.appendChild(h);
  const place=()=>{const r=panel.getBoundingClientRect();if(!r.width){h.style.display='none';return}h.style.zIndex=w.style.zIndex||10;
   h.style.display='block';h.style.transform=`translate(${Math.max(0,r.left)}px,${Math.max(0,r.top-14)}px)`};
  let drag=null,hide=0,lastT=0;
  const show=()=>{clearTimeout(hide);place();h.classList.add('on')};
  const later=()=>{clearTimeout(hide);hide=setTimeout(()=>{if(!drag&&document.activeElement!==h)h.classList.remove('on')},400)};
  panel.addEventListener('pointerenter',show);panel.addEventListener('pointerleave',later);
  h.addEventListener('pointerenter',show);h.addEventListener('pointerleave',later);
  h.addEventListener('pointerdown',e=>{if(e.button)return;e.stopPropagation();e.preventDefault();h.setPointerCapture(e.pointerId);
   const tr=panel.style.translate?panel.style.translate.split(' ').map(v=>parseFloat(v)||0):[0,0];
   drag={x:e.clientX,y:e.clientY,px:tr[0],py:tr[1],moved:false};panel.classList.add('mvd');
   sticky.style.position='static';panel.style.position='relative'});
  h.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(!drag.moved&&Math.abs(dx)+Math.abs(dy)<3)return;
   drag.moved=true;panel.style.position='relative';panel.style.translate=(drag.px+dx)+'px '+(drag.py+dy)+'px';place()});
  const up=()=>{if(!drag)return;const moved=drag.moved;drag=null;panel.classList.remove('mvd');
   if(moved){const tr=panel.style.translate.split(' ').map(v=>parseFloat(v)||0);try{localStorage.setItem(key,JSON.stringify({x:tr[0],y:tr[1]}))}catch(e){}}
   else{const n=performance.now();if(n-lastT<400){panel.style.translate='';sticky.style.position='';try{localStorage.removeItem(key)}catch(e){}place();lastT=0}else lastT=n}
   later()};
  h.addEventListener('pointerup',up);h.addEventListener('pointercancel',up);
  // cleanup when widget closes
  const obs=new MutationObserver(()=>{if(!document.body.contains(w)){h.remove();obs.disconnect()}});
  obs.observe(document.body,{childList:true});
  place();
 })();
 sync();w.querySelector('.fx').focus({preventScroll:true})}

$('#reel').onclick=()=>openCase(cur);
$('#esc').onclick=()=>{if(FW.length){FW.pop().remove();fwZ()}};
addEventListener('keydown',e=>{if(e.key==='Escape'){if(e.repeat)return;if($('#modal').classList.contains('on'))$('#x').click();else if(FW.length){const t=FW[FW.length-1];t.remove();FW.pop();fwZ()}}if(e.key==='Enter'&&e.target===document.body&&!$('#case').classList.contains('on'))openCase(cur)});

// movable widgets: logo, menu, project list, title, details. Offsets are applied with the independent `translate` property (composes with each widget's own transform) and remembered per layout (desktop / mobile).
(()=>{
 const LK='cursory.layout.v2',coarse=matchMedia('(pointer:coarse)').matches,mq=matchMedia('(max-width:900px)'),M=48;
 const defs=[['logo','#logo','logo'],['menu','#nv','menu'],['list','#idx','project list'],['title','#desc','title'],['details','#meta','details']];
 let store={};try{store=JSON.parse(localStorage.getItem(LK))||{}}catch(e){}
 const mode=()=>mq.matches?'m':'d',save=()=>{try{localStorage.setItem(LK,JSON.stringify(store))}catch(e){}};
 // default arrangement (desktop): offsets from each widget's native spot, as fractions of the viewport; details line up under the title's left edge
 const DEF={logo:[.0497,.130],menu:[.0497,.160],list:[.0497,.194],title:[-.1036,-.022]};
 const def=k=>{if(mq.matches)return[0,0];if(k==='details'){/* offsets are relative to #meta's native spot (bottom-right, bottom:48px): same x-shift as the title so left edges align, y lands ~28px under the description */const y=Math.round(innerHeight/2+64+DEF.title[1]*innerHeight+28-(innerHeight-48-66));return[Math.round(DEF.title[0]*innerWidth),y]}
  const f=DEF[k];return[Math.round(f[0]*innerWidth),Math.round(f[1]*innerHeight)]};
 const get=k=>(store[mode()]||{})[k]||def(k);
 const put=(k,v)=>{const m=mode();store[m]=store[m]||{};if(v)store[m][k]=v;else delete store[m][k]};
 const apply=(w,v)=>{w.pos=v;w.el.style.translate=(v[0]||v[1])?v[0]+'px '+v[1]+'px':''};
 function clamp(w){const r=w.el.getBoundingClientRect();if(!r.width||!r.height)return;let[x,y]=w.pos,o=[x,y];
  if(r.left>innerWidth-M)x-=r.left-(innerWidth-M);if(r.right<M)x+=M-r.right;if(r.top>innerHeight-M)y-=r.top-(innerHeight-M);if(r.top<0)y-=r.top;
  if(x!==o[0]||y!==o[1])apply(w,[x,y])}
 function place(w){const r=w.el.getBoundingClientRect(),h=w.h;if(!r.width||!r.height){h.style.display='none';return}
  h.style.display='block';const x=Math.max(0,Math.min(innerWidth-h.offsetWidth,r.left)),y=Math.max(0,r.top-h.offsetHeight);h.style.transform=`translate(${x}px,${y}px)`}
 const W=defs.map(([k,sel,label])=>{const el=$(sel),h=document.createElement('div');
  h.className='gh'+(coarse?' co':'');h.setAttribute('role','button');h.tabIndex=0;
  h.setAttribute('aria-label','Move '+label+': drag, or use arrow keys. Double-click to reset.');document.body.appendChild(h);
  const w={k,el,h,pos:[0,0],t:0,hide:0,drag:null};
  const show=()=>{clearTimeout(w.hide);place(w);h.classList.add('on')};
  const later=()=>{clearTimeout(w.hide);w.hide=setTimeout(()=>{if(!w.drag&&document.activeElement!==h)h.classList.remove('on')},450)};
  if(!coarse){el.addEventListener('pointerenter',show);el.addEventListener('pointerleave',later);h.addEventListener('pointerenter',show);h.addEventListener('pointerleave',later)}
  h.addEventListener('focus',()=>{place(w);h.classList.add('on')});h.addEventListener('blur',later);
  h.addEventListener('pointerdown',e=>{if(e.button)return;e.stopPropagation();e.preventDefault();h.setPointerCapture(e.pointerId);
   w.drag={x:e.clientX,y:e.clientY,p:w.pos.slice(),moved:false};el.classList.add('mvd');document.body.style.userSelect='none';h.classList.add('on')});
  h.addEventListener('pointermove',e=>{const d=w.drag;if(!d)return;const dx=e.clientX-d.x,dy=e.clientY-d.y;if(!d.moved&&Math.abs(dx)+Math.abs(dy)<3)return;
   d.moved=true;apply(w,[d.p[0]+dx,d.p[1]+dy]);clamp(w);place(w)});
  const up=()=>{const d=w.drag;if(!d)return;w.drag=null;el.classList.remove('mvd');document.body.style.userSelect='';
   if(d.moved){put(k,w.pos.slice());save();refresh();if(!coarse)later()}
   else{const n=performance.now();if(n-w.t<400){apply(w,def(k));put(k,null);save();place(w);refresh();w.t=0}else w.t=n}};
  h.addEventListener('pointerup',up);h.addEventListener('pointercancel',up);
  h.addEventListener('keydown',e=>{const st=e.shiftKey?40:10,m={ArrowLeft:[-st,0],ArrowRight:[st,0],ArrowUp:[0,-st],ArrowDown:[0,st]}[e.key];
   if(m){e.preventDefault();e.stopPropagation();apply(w,[w.pos[0]+m[0],w.pos[1]+m[1]]);clamp(w);put(k,w.pos.slice());save();place(w);refresh()}
   else if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();e.stopPropagation();apply(w,def(k));put(k,null);save();place(w);refresh()}});
  if(window.ResizeObserver)new ResizeObserver(()=>place(w)).observe(el);
  return w});
 const rl=$('#rl');
 const refresh=()=>{const mod=W.some(w=>{const d=def(w.k);return Math.abs(w.pos[0]-d[0])>1||Math.abs(w.pos[1]-d[1])>1});rl.setAttribute('aria-pressed',mod);rl.disabled=!mod};
 rl.onclick=()=>{if(rl.disabled)return;store[mode()]={};save();W.forEach(w=>{apply(w,def(w.k))});W.forEach(w=>{clamp(w);place(w)});refresh()};
 let raf=0;const sync=()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{W.forEach(w=>{apply(w,get(w.k))});W.forEach(w=>{clamp(w);place(w)});refresh()})};
 addEventListener('resize',sync);sync();
})();
/* ---------- oval cursor (from text-particles; sleeps when idle) ---------- */
(()=>{if(!matchMedia('(pointer:fine)').matches||matchMedia('(prefers-reduced-motion:reduce)').matches)return;
document.documentElement.classList.add('hc');
const gc=document.createElement('div');gc.className='gc';gc.setAttribute('aria-hidden','true');document.body.append(gc);
const HOT='a[href],button,[role=button],nav li,.fh,.fx,.fo,.rz,#reel,#x,#esc,.gh';
addEventListener('pointermove',e=>{if(e.pointerType!=='mouse'&&e.pointerType!=='pen')return;gc.style.translate=`${e.clientX}px ${e.clientY}px`;gc.style.opacity=1},{passive:true});
/* hand the pointer back to the system cursor over iframes (the page can't see moves inside them) and when it leaves the window */
document.addEventListener('pointerover',e=>{const t=e.target;if(t.tagName==='IFRAME'){gc.style.opacity=0;return}gc.classList.toggle('h',!!(t.closest&&t.closest(HOT)))});
document.documentElement.addEventListener('pointerleave',()=>{gc.style.opacity=0});
})();
</script></body></html>
