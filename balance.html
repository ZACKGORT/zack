function navigate(id) {
  if (id === currentView) return;
  wipe.className = 'in';
  setTimeout(() => {
    showView(id);
    wipe.className = 'out';
    setTimeout(() => { wipe.className = ''; }, 450);
  }, 380);
}

function showView(id) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  const el = document.getElementById('view-' + id);
  if (!el) return;
  el.classList.add('active');
  window.scrollTo(0, 0);
  currentView = id;
  toolbarState.size = defaultSizeForView(id);
  tbApplySize(toolbarState.size);
  // Reset page-scale when leaving about/contracts; tbApplySize will set it correctly for those views
  if (id !== 'about' && id !== 'contracts') {
    root.style.setProperty('--page-scale', '1');
  }
  if (!['bny','gnc','hardinge','kent','dana','power','wovn'].includes(id)) {
    root.style.setProperty('--cs-scale', '1');
  }
  document.getElementById('bc-label').textContent = VIEWS[id]?.bcLabel || id;
  document.querySelectorAll('.nav-tab[data-view]').forEach(t => {
    t.classList.toggle('active', t.dataset.view === (VIEWS[id]?.navTab || id));
  });
  initParticleHero(el);
  initAllNarrativeParticles(el);
  if (id === 'index' && typeof window._portraitRebuild === 'function') {
    setTimeout(() => window._portraitRebuild(true), 460);
  }
  if (typeof window._placeGlyphMetrics === 'function') {
    requestAnimationFrame(() => requestAnimationFrame(window._placeGlyphMetrics));
  }
  if (id === 'about' && typeof window._lettersOnShow === 'function') {
    window._lettersOnShow();
  }
  if (id === 'generalassembly' && typeof window._gaOnShow === 'function') {
    window._gaOnShow();
  }
  if (typeof window._updateBackToTop === 'function') {
    window._updateBackToTop();
  }
  setupReveal(el);
}

// ── SCROLL REVEAL ─────────────────────────────────────────────────────────
function setupReveal(container) {
  if (!container) return;
  const els = container.querySelectorAll('.reveal');
  els.forEach(e => e.classList.remove('in'));
  const obs = new IntersectionObserver(entries => {
    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); obs.unobserve(e.target); } });
  }, { threshold: 0.04 });
  els.forEach(e => obs.observe(e));
}
setupReveal(document.getElementById('view-index'));

// ── CS PARTICLE ENGINE ─────────────────────────────────────────────────────
const TETHER_K_CS  = 0.028;
const DAMP_CS      = 0.72;
const BLOB_LERP_CS = 0.08;
const FLOAT_SPD_CS = 0.007;
const FLOAT_AX_CS  = 4.5;
const FLOAT_AY_CS  = 3;

const activeInstances = new Map();
window._activeInstances = activeInstances;

function initParticleHero(viewEl) {
  const viewId = viewEl.id;
  if (activeInstances.has(viewId)) {
    activeInstances.get(viewId).dead = true;
    activeInstances.delete(viewId);
  }
  if (viewId === 'view-index') return;

  const section = viewEl.querySelector('.cs-particle-hero');
  if (!section) return;
  const canvas = section.querySelector('.cs-hero-canvas');
  const line1  = section.dataset.cs    || '';
  const line2  = section.dataset.csSub || '';
  const ctx    = canvas.getContext('2d');

  let W, H, DPR;
  let mx = -400, my = -400;
  let bX = -400, bY = -400;
  let floatT = Math.random() * Math.PI * 2;
  let particles = [];
  const inst = { dead: false };
  activeInstances.set(viewId, inst);
  inst.resize = () => resize();

  function heroFontSize1() {
    return 48; // fixed — not coupled to the size scaler
  }
  function heroFontSize2(fs1) { return Math.round(fs1 * 0.32); }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W   = window.innerWidth;
    const fs1  = heroFontSize1();
    const fs2  = heroFontSize2(fs1);
    const padT = Math.round(fs1 * 0.55);
    const padB = Math.round(fs1 * 1.6);
    const gap  = Math.round(fs1 * 0.18);
    H = padT + fs1 + gap + fs2 + padB;
    canvas.width        = W * DPR;
    canvas.height       = H * DPR;
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    build(fs1, fs2, padT, gap);
  }

  function build(fs1, fs2, padT, gap) {
    const csFont = getComputedStyle(viewEl).getPropertyValue('--cs-font').trim() || "'Inter','Helvetica Neue',Helvetica,Arial,sans-serif";
    const font1  = `900 ${fs1}px ${csFont}`;
    const font2  = `300 ${fs2}px 'Inter','Helvetica Neue',Helvetica,Arial,sans-serif`;
    const PAD_L  = 16;
    const prev   = particles;
    particles    = [];

    function pushLine(text, font, baseY, baseOp) {
      ctx.font = font;
      let cx = PAD_L;
      for (const ch of text) {
        const w = ctx.measureText(ch).width;
        const p = prev.find(p => p.ch === ch && Math.abs(p.restX - cx) < 6);
        particles.push({
          ch, font,
          restX: cx, restY: baseY,
          x:  p ? p.x  : cx + (Math.random() - .5) * W * 0.65,
          y:  p ? p.y  : baseY + (Math.random() - .5) * H * 1.1,
          vx: p ? p.vx : 0,
          vy: p ? p.vy : 0,
          baseOp,
        });
        cx += w;
      }
    }

    const y1 = padT + fs1;
    const y2 = y1 + gap + fs2;
    pushLine(line1, font1, y1, 1);
    pushLine(line2, font2, y2, 1);
  }

  function loop() {
    if (inst.dead) return;
    requestAnimationFrame(loop);
    if (!viewEl.classList.contains('active')) return;

    bX += (mx - bX) * BLOB_LERP_CS;
    bY += (my - bY) * BLOB_LERP_CS;
    floatT += FLOAT_SPD_CS;

    const fdx = Math.sin(floatT) * FLOAT_AX_CS + Math.sin(floatT * 1.7) * FLOAT_AX_CS * 0.28;
    const fdy = Math.sin(floatT * 0.8 + 1) * FLOAT_AY_CS + Math.sin(floatT * 1.3 + 2) * FLOAT_AY_CS * 0.3;

    ctx.clearRect(0, 0, W, H);
    const bgColor = window._heroBg || '#0a0a0a';
    ctx.fillStyle = bgColor;
    ctx.fillRect(0, 0, W, H);
    ctx.textBaseline = 'alphabetic';

    const repelR = window._repelR || 155;

    for (const p of particles) {
      p.vx += (p.restX + fdx - p.x) * TETHER_K_CS;
      p.vy += (p.restY + fdy - p.y) * TETHER_K_CS;

      const dx = p.x - bX, dy = p.y - bY;
      const d  = Math.sqrt(dx * dx + dy * dy);
      if (d < repelR && d > 0.5) {
        const f = 1 - d / repelR;
        p.vx += (dx / d) * f * f * 20;
        p.vy += (dy / d) * f * f * 20;
      }

      p.vx *= DAMP_CS; p.vy *= DAMP_CS;
      p.x  += p.vx;   p.y  += p.vy;

      const prox  = d < 20 ? 0 : Math.min(1, (d - 16) / 72);
      const alpha = p.baseOp * prox;
      if (alpha > 0.006) {
        ctx.font = p.font;
        const isDark = (window._heroBg || '#0a0a0a') === '#0a0a0a';
        const pColor = isDark ? '255,255,255' : '10,10,10';
        ctx.fillStyle = `rgba(${pColor},${alpha.toFixed(3)})`;
        ctx.fillText(p.ch, p.x, p.y);
      }
    }

    const bgR = bgColor === '#0a0a0a' ? '10,10,10' : '255,255,255';
    const vg  = ctx.createLinearGradient(0, H * 0.75, 0, H);
    vg.addColorStop(0, `rgba(${bgR},0)`);
    vg.addColorStop(1, `rgba(${bgR},1)`);
    ctx.fillStyle = vg;
    ctx.fillRect(0, H * 0.75, W, H * 0.25);
    const tg = ctx.createLinearGradient(0, 0, 0, 52);
    tg.addColorStop(0, `rgba(${bgR},1)`);
    tg.addColorStop(1, `rgba(${bgR},0)`);
    ctx.fillStyle = tg;
    ctx.fillRect(0, 0, W, 52);
  }

  window.addEventListener('mousemove', e => {
    if (inst.dead) return;
    const r = canvas.getBoundingClientRect();
    mx = e.clientX - r.left;
    my = e.clientY - r.top;
  });

  window.addEventListener('resize', () => { if (!inst.dead) resize(); });

  document.fonts.ready.then(() => {
    const csFont      = getComputedStyle(viewEl).getPropertyValue('--cs-font').trim();
    const loadPromise = csFont
      ? document.fonts.load(`900 ${heroFontSize1()}px ${csFont}`).catch(() => {})
      : Promise.resolve();
    loadPromise.then(() => { resize(); loop(); });
  });
}

// ── NARRATIVE PARTICLE TEXT (fs-narrative blocks) ───────────────────────────
// Mirrors the index portrait hero: a tiled character grid scaled by the
// shared --work-font-size slider, with mouse-proximity fade.
const NARR_TETHER = 0.014;
const NARR_DAMP   = 0.76;
const NARR_LERP   = 0.11;

function narrParticleSize() {
  const base = 13;
  const CS_VIEWS = ['bny','gnc','hardinge','kent','dana','power','wovn'];
  if (currentView === 'about') {
    const ps = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--page-scale')) || 1;
    return Math.round(base * ps);
  }
  if (CS_VIEWS.includes(currentView)) {
    const cs = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--cs-scale')) || 1;
    return Math.round(base * cs);
  }
  return base;
}

function initNarrativeParticles(wrap) {
  const canvas = wrap.querySelector('canvas');
  const srText = wrap.querySelector('.fs-narrative-sr');
  if (!canvas || !srText) return;
  // Split on <br> markers so paragraph breaks survive into the tiled grid —
  // read as an author's note, not one flattened run-on string.
  const paragraphs = srText.innerHTML
    .split(/<br\s*\/?>/i)
    .map(s => s.replace(/<[^>]+>/g, '').replace(/&amp;/g, '&').replace(/\s+/g, ' ').trim())
    .filter(s => s.length);
  const ctx  = canvas.getContext('2d');
  // Allow per-block size override via data-narrative-scale (e.g. "4" = 4× base)
  const scaleMult = parseFloat(wrap.dataset.narrativeScale) || 1;

  let FONT_SIZE = Math.round(narrParticleSize() * scaleMult);
  let CHAR_W = FONT_SIZE * 0.602;
  const isHeadingBlock = wrap.dataset.narrativeFont === 'heading';
  let LINE_H = FONT_SIZE * (isHeadingBlock ? 1.02 : 1.45);
  let W, H, DPR;
  let mX = -999, mY = -999;
  let bX = -999, bY = -999;
  let allChars = [];
  let loaded = false;
  const inst = { dead: false, started: false };
  inst.resize = () => rebuild();

  function isDarkMode() { return (window._heroBg || '#0a0a0a') === '#0a0a0a'; }

  function currentFont() {
    // Heading canvases (data-narrative-font="heading") use a font fixed per letter
    // via data-heading-font on the wrap. Body/narrative canvases always use Inter.
    if (wrap.dataset.narrativeFont === 'heading') {
      return wrap.dataset.headingFont || "'Syne', sans-serif";
    }
    return "'Inter','Helvetica Neue',sans-serif";
  }

  function measureCharW(font, size) {
    // Measure the average advance width for this font at this size using
    // a representative sample of characters — proportional fonts vary wildly
    // from the fixed 0.602 monospace estimate, causing layout overflow.
    const sample = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789 ';
    ctx.font = `${isDarkMode() ? '300' : '500'} ${size}px ${font}`;
    return ctx.measureText(sample).width / sample.length;
  }

  function buildGrid() {
    const cw = measureCharW(currentFont(), FONT_SIZE);
    return { cols: Math.max(4, Math.floor(W / cw)), charW: cw };
  }

  // Lay out paragraph-by-paragraph with word-aware wrapping so we never
  // break in the middle of a word like "org s\ntructure".
  function layoutRows(cols) {
    const rows = [];
    paragraphs.forEach((para, pi) => {
      const words = para.split(' ');
      let row = '';
      words.forEach(word => {
        const candidate = row.length === 0 ? word : row + ' ' + word;
        if (candidate.length <= cols) {
          row = candidate;
        } else {
          if (row.length > 0) rows.push(row);
          // If the word itself is longer than cols, break it with a hyphen
          if (word.length > cols) {
            let w = word;
            while (w.length > cols) {
              rows.push(w.slice(0, cols - 1) + '-');
              w = w.slice(cols - 1);
            }
            row = w;
          } else {
            row = word;
          }
        }
      });
      if (row.length > 0) rows.push(row);
      if (pi < paragraphs.length - 1) rows.push('');
    });
    return rows.length ? rows : [''];
  }

  // Per-character width cache: font+size+char -> px
  const _charWidthCache = {};
  function charAdvance(ch) {
    const key = `${currentFont()}|${FONT_SIZE}|${ch}`;
    if (_charWidthCache[key] !== undefined) return _charWidthCache[key];
    ctx.font = `${isDarkMode() ? '300' : '500'} ${FONT_SIZE}px ${currentFont()}`;
    const w = ctx.measureText(ch).width;
    _charWidthCache[key] = w;
    return w;
  }

  function buildChars() {
    const { cols } = buildGrid();
    const rows = layoutRows(cols);
    const prev = allChars;
    const next = [];
    let idx = 0;
    rows.forEach((row, r) => {
      const baseY = r * LINE_H;
      let x = 0;
      // Place each character at its actual measured advance width
      for (let c = 0; c < row.length; c++) {
        const ch = row[c];
        const p = prev[idx];
        next.push({
          ch,
          restX: x, restY: baseY,
          x:  p ? p.x : x,
          y:  p ? p.y : baseY,
          vx: p ? p.vx : 0,
          vy: p ? p.vy : 0,
          baseOpacity: 1,
        });
        x += charAdvance(ch);
        idx++;
      }
    });
    return next;
  }

  function rebuild() {
    FONT_SIZE = Math.round(narrParticleSize() * scaleMult);
    CHAR_W    = FONT_SIZE * 0.602;
    LINE_H    = FONT_SIZE * (isHeadingBlock ? 1.02 : 1.45);
    // Clear per-char width cache so new font/size is measured fresh
    Object.keys(_charWidthCache).forEach(k => delete _charWidthCache[k]);
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = wrap.clientWidth;
    const { cols } = buildGrid();
    const rows = layoutRows(cols).length;
    H = Math.round(rows * LINE_H + LINE_H * 0.4);
    canvas.width  = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    allChars = buildChars();
    loaded = true;
  }

  function loop() {
    if (inst.dead) return;
    requestAnimationFrame(loop);
    if (!wrap.closest('.view.active')) return;

    bX += (mX - bX) * NARR_LERP;
    bY += (mY - bY) * NARR_LERP;

    ctx.clearRect(0, 0, W, H);
    if (!loaded) return;

    const dark = isDarkMode();
    ctx.font = `${dark ? '300' : '500'} ${FONT_SIZE}px ${currentFont()}`;
    ctx.textBaseline = 'top';
    const rgbStr = dark ? '255,255,255' : '0,0,0';
    let lastAlphaBucket = -1;

    for (const p of allChars) {
      if (p.x < -CHAR_W || p.x > W + CHAR_W || p.y < -LINE_H || p.y > H + LINE_H) continue;
      const dx = p.x - bX, dy = p.y - bY;
      const dSq = dx * dx + dy * dy;

      p.vx += (p.restX - p.x) * NARR_TETHER;
      p.vy += (p.restY - p.y) * NARR_TETHER;

      // Use a gentler, fixed repel radius for inline narrative text —
      // independent of the global _ptRepel (which is tuned for full-page heroes)
      const repelNarr = 55;
      const repelNarrSq = repelNarr * repelNarr;
      if (dSq < repelNarrSq && dSq > 0.25) {
        const d     = Math.sqrt(dSq);
        const f     = 1 - d / repelNarr;
        const scale = f * f * 6 / d;  // gentler force than the hero (was 16)
        p.vx += dx * scale;
        p.vy += dy * scale;
      }

      p.vx *= NARR_DAMP; p.vy *= NARR_DAMP;
      p.x  += p.vx;     p.y  += p.vy;

      // Clamp to canvas bounds so characters can never escape off-screen
      p.x = Math.max(-CHAR_W * 0.5, Math.min(W + CHAR_W * 0.5, p.x));
      p.y = Math.max(-LINE_H * 0.5, Math.min(H + LINE_H * 0.5, p.y));

      const dFade = dSq > 0.25 ? Math.sqrt(dSq) : 0;
      const alpha = p.baseOpacity * Math.min(1, Math.max(0, (dFade - 14) / 30));
      if (alpha > 0.008) {
        const bucket = (alpha * 64 + 0.5) | 0;
        if (bucket !== lastAlphaBucket) {
          ctx.fillStyle = `rgba(${rgbStr},${(bucket / 64).toFixed(2)})`;
          lastAlphaBucket = bucket;
        }
        ctx.fillText(p.ch, p.x, p.y);
      }
    }
  }

  function onMove(e) {
    if (inst.dead) return;
    const r = canvas.getBoundingClientRect();
    mX = e.clientX - r.left;
    mY = e.clientY - r.top;
  }
  window.addEventListener('mousemove', onMove);
  window.addEventListener('resize', () => { if (!inst.dead) rebuild(); });

  function start() {
    if (inst.started) return;
    inst.started = true;
    if (window._activeInstances) window._activeInstances.set('narrative-' + Math.random().toString(36).slice(2), inst);
    const fontToLoad = currentFont();
    const loadPromise = fontToLoad.includes('DM Mono')
      ? document.fonts.ready
      : document.fonts.load(`${isDarkMode() ? '300' : '500'} ${FONT_SIZE}px ${fontToLoad}`)
          .catch(() => {}).then(() => document.fonts.ready);
    loadPromise.then(() => { rebuild(); loop(); });
  }

  const obs = new IntersectionObserver(entries => {
    entries.forEach(en => { if (en.isIntersecting) { start(); obs.disconnect(); } });
  }, { threshold: 0.05, rootMargin: '200px 0px' });
  obs.observe(wrap);

  wrap._narrInst = inst;
}

function initAllNarrativeParticles(container) {
  (container || document).querySelectorAll('[data-narrative-particles]').forEach(wrap => {
    if (wrap._narrInst) { wrap._narrInst.dead = true; }
    initNarrativeParticles(wrap);
  });
}

// ── CUSTOM SCROLL INDICATOR ─────────────────────────────────────────────────
(function initScrollIndicator() {
  const ind   = document.getElementById('scroll-indicator');
  const thumb = document.getElementById('scroll-thumb');
  if (!ind || !thumb) return;

  let fadeTimer = null;

  function update() {
    const scrollEl  = document.scrollingElement || document.documentElement;
    const scrollTop = scrollEl.scrollTop;
    const scrollH   = scrollEl.scrollHeight - scrollEl.clientHeight;
    if (scrollH <= 0) { ind.classList.remove('visible'); return; }

    const viewH    = window.innerHeight;
    const ratio    = scrollTop / scrollH;
    const thumbH   = Math.max(32, (viewH / scrollEl.scrollHeight) * viewH);
    const thumbTop = ratio * (viewH - thumbH);

    thumb.style.height = thumbH + 'px';
    thumb.style.top    = thumbTop + 'px';

    ind.classList.add('visible', 'active');
    clearTimeout(fadeTimer);
    fadeTimer = setTimeout(() => { ind.classList.remove('active'); }, 800);
    fadeTimer = setTimeout(() => { ind.classList.remove('visible'); }, 1800);
  }

  window.addEventListener('scroll', update, { passive: true });
  window.addEventListener('resize', update, { passive: true });
  update();
})();


// Native viewport pinch-zoom is disabled (see <meta viewport> maximum-scale=1,
// user-scalable=no) so this two-finger gesture can drive the same type-ramp
// scaler as the toolbar slider / Shift+Scroll, instead of zooming the page.
(function initPinchZoomScaler() {
  let startDist = null;
  let startSize = 28;

  function touchDist(touches) {
    const dx = touches[0].clientX - touches[1].clientX;
    const dy = touches[0].clientY - touches[1].clientY;
    return Math.sqrt(dx * dx + dy * dy);
  }

  window.addEventListener('touchstart', e => {
    if (e.touches.length === 2) {
      startDist = touchDist(e.touches);
      startSize = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--work-font-size')) || 28;
    }
  }, { passive: true });

  window.addEventListener('touchmove', e => {
    if (e.touches.length !== 2 || startDist === null) return;
    e.preventDefault(); // suppress any residual native zoom/scroll during the pinch
    const dist  = touchDist(e.touches);
    const ratio = dist / startDist;
    const next  = Math.min(72, Math.max(28, Math.round(startSize * ratio)));
    tbApplySize(next);
    toolbarState.size = next;
  }, { passive: false });

  window.addEventListener('touchend', e => {
    if (e.touches.length < 2) startDist = null;
  }, { passive: true });
})();

// ── GLYPH METRIC LINES ─────────────────────────────────────────────────────
(function positionMetricLines() {
  function fitHero(panel, heroEl) {
    const len = heroEl.dataset.glyphLen;
    if (!len || len === '1') return;
    heroEl.style.fontSize = '';
    const cs2 = window.getComputedStyle(panel);
    const padH = parseFloat(cs2.paddingLeft) + parseFloat(cs2.paddingRight);
    const maxW = panel.clientWidth - padH;
    let guard = 0;
    // Temporarily unhide overflow so getBoundingClientRect returns the true
    // unclipped width, then restore — this is the only reliable cross-browser
    // method when the parent has overflow:hidden.
    const prevOverflow = panel.style.overflow;
    panel.style.overflow = 'visible';
    while (heroEl.getBoundingClientRect().width > maxW && guard < 60) {
      const cs = window.getComputedStyle(heroEl);
      const cur = parseFloat(cs.fontSize);
      if (!cur || cur <= 10) break;
      heroEl.style.fontSize = Math.max(10, cur * 0.94) + 'px';
      guard++;
    }
    panel.style.overflow = prevOverflow || '';
  }

  function place() {
    const panels = document.querySelectorAll('.fs-glyph-left');
    if (!panels.length) return;
    const cvs = document.createElement('canvas');
    const ctx  = cvs.getContext('2d');

    panels.forEach(panel => {
      const heroEl    = panel.querySelector('.fs-glyph-hero');
      const metricsEl = panel.querySelector('.fs-glyph-metrics');
      if (!heroEl || !metricsEl) return;

      fitHero(panel, heroEl);

      const panelRect = panel.getBoundingClientRect();
      const heroRect  = heroEl.getBoundingClientRect();
      if (panelRect.width === 0 || panelRect.height === 0) return;

      const cs         = window.getComputedStyle(heroEl);
      const fontSize   = parseFloat(cs.fontSize);
      const fontFamily = cs.fontFamily;
      const fontWeight = cs.fontWeight;
      ctx.font = `${fontWeight} ${fontSize}px ${fontFamily}`;

      const capM  = ctx.measureText('H');
      const xM    = ctx.measureText('x');
      const descM = ctx.measureText('p');

      const capAscent  = capM.actualBoundingBoxAscent  || fontSize * 0.718;
      const xAscent    = xM.actualBoundingBoxAscent    || fontSize * 0.527;
      const descDepth  = descM.actualBoundingBoxDescent || fontSize * 0.193;

      const fontAscent  = capM.fontBoundingBoxAscent  || fontSize * 0.8;
      const fontDescent = capM.fontBoundingBoxDescent || fontSize * 0.2;
      const lineBoxH    = heroRect.height;
      const baselinePx  = (heroRect.top - panelRect.top)
                        + (lineBoxH + fontAscent - fontDescent) / 2;

      const offsets = {
        cap:       baselinePx - capAscent,
        xheight:   baselinePx - xAscent,
        baseline:  baselinePx,
        descender: baselinePx + descDepth,
      };

      metricsEl.querySelectorAll('[data-metric]').forEach(line => {
        const px = offsets[line.dataset.metric];
        if (px !== undefined) line.style.top = px + 'px';
      });
    });
  }

  window._placeGlyphMetrics = place;
  document.fonts.ready.then(() => requestAnimationFrame(() => requestAnimationFrame(place)));
  window.addEventListener('resize', () => requestAnimationFrame(place));

  // Catches column-drag resizes, toolbar font-size changes, and any other
  // layout shift that doesn't fire a window resize event.
  if ('ResizeObserver' in window) {
    let raf = null;
    const ro = new ResizeObserver(() => {
      if (raf) cancelAnimationFrame(raf);
      raf = requestAnimationFrame(place);
    });
    document.querySelectorAll('.fs-glyph-left').forEach(p => ro.observe(p));
  }
})();

// ── GLYPH LETTER SELECT (click a highlighted letter to swap the hero word) ──
(function glyphLetterSelect() {
  function initPanel(panel) {
    if (panel._selectInit) return;
    panel._selectInit = true;

    const heroEl = panel.querySelector('.fs-glyph-hero');
    const container = panel.closest('.fs-glyphs');
    if (!heroEl || !container) return;

    const defaultWord = heroEl.textContent;
    const defaultLen  = heroEl.dataset.glyphLen;

    let caption = panel.querySelector('.fs-glyph-caption');
    if (!caption) {
      caption = document.createElement('div');
      caption.className = 'fs-glyph-caption';
      panel.appendChild(caption);
    }

    const cells = container.querySelectorAll('.fs-glyph-cell.hi[data-glyph-word]');

    function refit() {
      if (window._placeGlyphMetrics) requestAnimationFrame(window._placeGlyphMetrics);
    }

    function setHeroWord(word, len) {
      clearTimeout(heroEl._swapTimer);
      heroEl.classList.add('swapping');
      heroEl._swapTimer = setTimeout(() => {
        heroEl.textContent = word;
        heroEl.dataset.glyphLen = String(len);
        refit();
        requestAnimationFrame(() => heroEl.classList.remove('swapping'));
      }, 110);
    }

    function selectCell(cell) {
      cells.forEach(c => c.classList.remove('selected'));
      cell.classList.add('selected');
      const word = cell.dataset.glyphWord || cell.textContent;
      const tip  = cell.dataset.glyphTip || '';
      setHeroWord(word, word.length);
      caption.innerHTML = `<span class="fgc-letter">${cell.textContent}</span>${tip}<span class="fgc-hint">Click the letter again to return to ${defaultWord}</span>`;
      caption.classList.add('visible');
    }

    function reset() {
      cells.forEach(c => c.classList.remove('selected'));
      setHeroWord(defaultWord, defaultLen);
      caption.classList.remove('visible');
    }

    cells.forEach(cell => {
      cell.setAttribute('tabindex', '0');
      cell.setAttribute('role', 'button');
      cell.setAttribute('aria-pressed', 'false');
      cell.addEventListener('click', () => {
        const wasSelected = cell.classList.contains('selected');
        if (wasSelected) {
          reset();
        } else {
          selectCell(cell);
        }
        cells.forEach(c => c.setAttribute('aria-pressed', c.classList.contains('selected') ? 'true' : 'false'));
      });
      cell.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          cell.click();
        }
      });
    });
  }

  function initAll() {
    document.querySelectorAll('.fs-glyph-left').forEach(initPanel);
  }

  initAll();
  const obs = new MutationObserver(initAll);
  obs.observe(document.body, { childList: true, subtree: true });
})();

// ── GLYPH HERO MAGNETIC CURSOR ───────────────────────────────────────────────
(function magneticGlyphHero() {
  const MAG_RADIUS  = 260;   // px — influence radius from panel center
  const MAG_STRENGTH = 0.32; // how far the letters travel toward the cursor (0-1)
  const MAG_LERP     = 0.12; // easing speed toward target

  function initPanel(panel) {
    const wrap = panel.querySelector('.fs-glyph-hero-wrap');
    if (!wrap || wrap._magInit) return;
    wrap._magInit = true;

    let targetX = 0, targetY = 0;
    let curX = 0, curY = 0;
    let raf = null;

    function onMove(e) {
      const r = panel.getBoundingClientRect();
      const cx = r.left + r.width / 2;
      const cy = r.top + r.height / 2;
      const dx = e.clientX - cx;
      const dy = e.clientY - cy;
      const dist = Math.sqrt(dx * dx + dy * dy);

      if (dist < MAG_RADIUS) {
        const pull = (1 - dist / MAG_RADIUS) * MAG_STRENGTH;
        targetX = dx * pull;
        targetY = dy * pull;
      } else {
        targetX = 0;
        targetY = 0;
      }
      ensureLoop();
    }

    function onLeave() {
      targetX = 0;
      targetY = 0;
      ensureLoop();
    }

    function ensureLoop() {
      if (raf) return;
      tick();
    }

    function tick() {
      curX += (targetX - curX) * MAG_LERP;
      curY += (targetY - curY) * MAG_LERP;
      wrap.style.transform = `translate(${curX.toFixed(2)}px, ${curY.toFixed(2)}px)`;

      if (Math.abs(targetX - curX) > 0.05 || Math.abs(targetY - curY) > 0.05 ||
          Math.abs(curX) > 0.05 || Math.abs(curY) > 0.05) {
        raf = requestAnimationFrame(tick);
      } else {
        curX = 0; curY = 0;
        wrap.style.transform = 'translate(0px, 0px)';
        raf = null;
      }
    }

    window.addEventListener('mousemove', onMove);
    panel.addEventListener('mouseleave', onLeave);
  }

  function initAll() {
    document.querySelectorAll('.fs-glyph-left').forEach(initPanel);
  }

  initAll();
})();

// ── INDEX FOOTER COLUMN RESIZER (drag to resize ice-tray / iframe split) ────
(function indexFooterResizer() {
  const resizer = document.getElementById('ic-resizer');
  const container = document.querySelector('.index-contact-wrap');
  if (!resizer || !container) return;

  const MIN_LEFT = 320;  // ice-tray column never gets crushed below this
  const MIN_RIGHT = 280; // iframe column never gets crushed below this

  function clamp(px) {
    const total = container.getBoundingClientRect().width;
    const max = total - MIN_LEFT - 10;
    return Math.max(MIN_RIGHT, Math.min(max, px));
  }

  function setSplit(px) {
    container.style.setProperty('--ic-split', clamp(px) + 'px');
    if (window._updateHoopScale) window._updateHoopScale();
  }

  let dragging = false;

  resizer.addEventListener('pointerdown', (e) => {
    dragging = true;
    resizer.classList.add('dragging');
    resizer.setPointerCapture && resizer.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  resizer.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const rect = container.getBoundingClientRect();
    setSplit(rect.right - e.clientX); // width measured from the container's right edge
  });
  function endDrag(e) {
    if (!dragging) return;
    dragging = false;
    resizer.classList.remove('dragging');
    resizer.releasePointerCapture && resizer.releasePointerCapture(e.pointerId);
  }
  resizer.addEventListener('pointerup', endDrag);
  resizer.addEventListener('pointercancel', endDrag);
  resizer.addEventListener('dblclick', () => {
    container.style.removeProperty('--ic-split');
    if (window._updateHoopScale) window._updateHoopScale();
  });
  resizer.addEventListener('keydown', (e) => {
    const rightEl = document.querySelector('.ic-hoop-wrap');
    const cur = rightEl.getBoundingClientRect().width;
    if (e.key === 'ArrowLeft') { setSplit(cur + 16); e.preventDefault(); }
    if (e.key === 'ArrowRight') { setSplit(cur - 16); e.preventDefault(); }
  });
})();

// ── HOOP IFRAME SCALE (the embedded page has its own fixed/native layout —
//    rather than stretching it to 100% and letting its content render tiny
//    or cropped inside a narrow column, the iframe renders at a fixed
//    "native" size and this uniformly scales the whole thing down/up to
//    fill whatever width the column actually has, recalculated on resize
//    and whenever the draggable divider moves) ──────────────────────────────
(function initHoopScale() {
  const wrap = document.querySelector('.ic-hoop-wrap');
  const frame = document.querySelector('.ic-hoop-frame');
  if (!wrap || !frame) return;
  const NATIVE_W = 960;
  const NATIVE_H = 720;

  function update() {
    const w = wrap.clientWidth || NATIVE_W;
    const h = wrap.clientHeight || NATIVE_H;
    // Math.min ("contain") instead of Math.max ("cover") — cover was cropping
    // whichever edge didn't match the container's aspect ratio (the bottom,
    // in a narrow tall column). Contain guarantees nothing is ever clipped,
    // at the cost of possibly letterboxing empty space on one axis — which
    // is why the frame is also centered below rather than pinned top-left.
    const scale = Math.min(w / NATIVE_W, h / NATIVE_H);
    const scaledW = NATIVE_W * scale;
    const scaledH = NATIVE_H * scale;
    frame.style.transform = `scale(${scale})`;
    frame.style.left = Math.round((w - scaledW) / 2) + 'px';
    frame.style.top = Math.round((h - scaledH) / 2) + 'px';
  }
  window._updateHoopScale = update;
  window.addEventListener('resize', update);
  new ResizeObserver(update).observe(wrap);
  update();
})();

// ── GLYPH COLUMN RESIZER (drag to resize word / grid split) ─────────────────
(function glyphColumnResizer() {
  const MIN_LEFT = 200;
  const MIN_RIGHT = 340;

  function initResizer(resizer) {
    if (resizer._resizeInit) return;

    const container = resizer.closest('.fs-glyphs');
    if (!container) return;

    function clamp(px) {
      const total = container.getBoundingClientRect().width;
      const max = total - MIN_RIGHT - 10;
      return Math.max(MIN_LEFT, Math.min(max, px));

    function setSplit(px) {

      if (!dragging) return;
      const rect = container.getBoundingClientRect();

      if (e.key === 'ArrowRight') { setSplit(cur + 16); e.preventDefault(); }
    }

    resizer.addEventListener('pointerdown', onPointerDown);
    resizer.addEventListener('pointermove', onPointerMove);
    resizer.addEventListener('pointerup', onPointerUp);
    resizer.addEventListener('pointercancel', onPointerUp);

    document.querySelectorAll('.fs-glyph-resizer').forEach(initResizer);

  initAll();
  const obs = new MutationObserver(initAll);
  obs.observe(document.body, { childList: true, subtree: true });
})();


// ── GENERAL ASSEMBLY — infinite canvas photo wall (ported, trimmed to just

(function initGeneralAssembly() {
  const GA_PHOTOS = [

  "https://i.ibb.co/Kph6fp3M/603a967a6a41f4d56ca33b1a-ZAX00794.webp",

  "https://i.ibb.co/Y4cz47NK/603a967916b10d5bef5a6dd8-ZAX02712-1.jpg",

  "https://i.ibb.co/vxkSqfr5/603a967a5dc3e982f571b744-ZAX00968.jpg",
  "https://i.ibb.co/xt9M8KB9/603a95ee83ba30ff4ac9bc6a-DSC00423-1.jpg",

  "https://i.ibb.co/G39jGrk4/603a95edd9a3b56723de7edc-DSC00910.jpg",
  "https://i.ibb.co/ch9YMGNW/603a93f0e815e830d1783e07-IMG-2033.jpg",
  "https://i.ibb.co/JWb6r4zD/603a93efdfd184c21ef2d238-IMG-3352.jpg",
  "https://i.ibb.co/Dgm1cLry/603a93eedcd3ab4b2e64fcbc-IMG-4204.jpg",
  "https://i.ibb.co/tpvRzKWF/603a93eea83b1aab7a98c35b-DSC08228.jpg",
  "https://i.ibb.co/S4DSwGfN/603a93eddcd3ab104d64fcbb-ZAX09767.jpg",
  "https://i.ibb.co/bHsf63Q/2269150474215204867-5144774570.jpg",
  "https://i.ibb.co/dm7tbgT/2271583407791011962-5144774570.jpg",
  "https://i.ibb.co/q5RfpTN/2285423996827355910-5144774570.jpg",
  "https://i.ibb.co/j5jQ4BC/2319420263505008414-5144774570.jpg",
  "https://i.ibb.co/8rSqrMm/2422385189923424060-5144774570.jpg",
  "https://i.ibb.co/WP03r4g/2285335292767225477-5144774570.jpg",
  "https://i.ibb.co/RcN0rLM/2302765161788654866-5144774570.jpg",
  "https://i.ibb.co/0ZWH7cT/2321673929708515123-5144774570.jpg",
  "https://i.ibb.co/Bt17HTb/2328203887297603696-5144774570.jpg",
  "https://i.ibb.co/nDBk8sS/2439406711833686741-5144774570.jpg"
  ];
  const GA_CAPTIONS = ["Somewhere, recently.", "One of the ones worth keeping.", "No caption necessary.", "Shot on the way to somewhere else.", "Kept for the light, not the subject."];

  const GA_POOL = GA_PHOTOS.map((url, i) => ({
    tag: "Field notes · " + String(i + 1).padStart(2, "0"),
    meta: GA_CAPTIONS[i % GA_CAPTIONS.length],
    img: url,
  }));

  // Consecutive integers are always coprime, so stepping by (length-1) each
  // lap guarantees every rotation is distinct until all of them are used —
  // no fixed pool size can cause two laps to realign and repeat a row.
  const viewport = document.getElementById('gaCanvasViewport');
  const track = document.getElementById('gaCanvasTrack');
  if (!viewport || !track) return;

  let COLS = 8;
  const ROWS = 6;
  let baseFontPx = 13;
  let marginMult = 0.2;
  let TW = 220, TH = 170, GAP = 6, setW = COLS * (TW + GAP), setH = ROWS * (TH + GAP);
  let copiesX = 1, copiesY = 1;

  function computeCols() {
    // Fixed at 8 to match ROWS=6 for exactly 48 cells = the full photo pool,
    // so a single tile can show every photo once with zero repeats.
    return 8;
  }

  function recomputeDims() {
    COLS = computeCols();
    const scale = baseFontPx / 16;
    TW = Math.round(300 * scale); TH = Math.round(236 * scale); GAP = Math.round(16 * scale * marginMult);
    setW = COLS * (TW + GAP); setH = ROWS * (TH + GAP);
    const vw = viewport.clientWidth || window.innerWidth;
    const vh = viewport.clientHeight || window.innerHeight;
    // +1 ring of buffer copies is enough given the modulo-wrapped transform;
    // +2 (the previous value) was rendering roughly double the DOM/image
    // nodes for no visible benefit, which was the main source of jank.
    copiesX = Math.max(1, Math.ceil(vw / setW)) + 1;
    copiesY = Math.max(1, Math.ceil(vh / setH)) + 1;
  }

  // Deterministic per-tile shuffle: each tile copy (dxi, dyi) gets its own
  // seeded, fully-shuffled permutation of the whole pool. Since COLS*ROWS
  // equals the pool size exactly, every single tile is guaranteed to show
  // every photo exactly once — no repeats anywhere within one screen —
  // while neighboring tiles get a different shuffle from each other.
  function mulberry32(seed) {
    let t = seed >>> 0;
    return function () {
      t += 0x6D2B79F5;
      let x = Math.imul(t ^ (t >>> 15), 1 | t);
      x ^= x + Math.imul(x ^ (x >>> 7), 61 | x);
      return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
    };
  }
  function shuffledOrderForTile(dxi, dyi, n) {
    const seed = (((dxi * 374761393 + dyi * 668265263) % 4294967296) + 4294967296) % 4294967296;
    const rand = mulberry32(seed);
    const arr = Array.from({ length: n }, (_, i) => i);
    for (let i = n - 1; i > 0; i--) {
      const j = Math.floor(rand() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function buildTiles() {
    track.innerHTML = '';
    const frag = document.createDocumentFragment();
    const N = GA_POOL.length || 1;
    const cellsPerTile = COLS * ROWS;
    for (let dxi = -copiesX; dxi <= copiesX; dxi++) {
      for (let dyi = -copiesY; dyi <= copiesY; dyi++) {
        const order = shuffledOrderForTile(dxi, dyi, Math.min(N, cellsPerTile));
        for (let row = 0; row < ROWS; row++) {
          for (let col = 0; col < COLS; col++) {
            const cellIndex = row * COLS + col;
            const idx = order[cellIndex % order.length] % N;
            const c = GA_POOL[idx];
            const left = dxi * setW + col * (TW + GAP);
            const top = dyi * setH + row * (TH + GAP);
            const tile = document.createElement('div');
            tile.className = 'ga-photo-tile';
            tile.style.left = left + 'px'; tile.style.top = top + 'px';
            tile.style.width = TW + 'px'; tile.style.height = TH + 'px';
            tile.dataset.tag = c.tag;
            tile.dataset.body = (c.meta || '').replace(/"/g, '&quot;');
            tile.dataset.img = c.img;
            tile.innerHTML = '<img src="' + c.img + '" alt="" loading="lazy" decoding="async" draggable="false"><span class="ga-photo-idx">' + String(idx + 1).padStart(2, '0') + '</span>';
            frag.appendChild(tile);
          }
        }
      }
    }
    track.appendChild(frag);
  }

  let panX = 0, panY = 0, velX = 0, velY = 0;
  let ambTargetX = 0, ambTargetY = 0, ambX = 0, ambY = 0;
  let dragging = false, moved = false, startX = 0, startY = 0, lastX = 0, lastY = 0, pid = null;
  let loopRunning = false;

  function mod(n, m) { return ((n % m) + m) % m; }
  function applyTransform() {
    const rx = mod(panX, setW) - setW;
    const ry = mod(panY, setH) - setH;
    track.style.transform = 'translate3d(' + (rx + ambX).toFixed(2) + 'px,' + (ry + ambY).toFixed(2) + 'px,0)';
  }
  function centerPan() {
    const vw = viewport.clientWidth || window.innerWidth;
    const vh = viewport.clientHeight || window.innerHeight;
    panX = vw / 2 - setW / 2;
    panY = vh / 2 - setH / 2;
    velX = 0; velY = 0;
  }
  function rebuildAndCenter() {
    recomputeDims();
    buildTiles();
    centerPan();
    applyTransform();
  }

  const AMB_LERP = 0.07;
  const INERTIA_FRICTION = 0.935;
  const INERTIA_THRESHOLD = 0.08;

  function startLoop() {
    if (loopRunning) return;
    loopRunning = true;
    (function tick() {
      let needsMore = false;
      if (!dragging && (Math.abs(velX) > INERTIA_THRESHOLD || Math.abs(velY) > INERTIA_THRESHOLD)) {
        velX *= INERTIA_FRICTION;
        velY *= INERTIA_FRICTION;
        panX += velX;
        panY += velY;
        needsMore = true;
      }
      const dAmbX = ambTargetX - ambX, dAmbY = ambTargetY - ambY;
      if (Math.abs(dAmbX) > 0.02 || Math.abs(dAmbY) > 0.02) {
        ambX += dAmbX * AMB_LERP;
        ambY += dAmbY * AMB_LERP;
        needsMore = true;
      } else {
        ambX = ambTargetX; ambY = ambTargetY;
      }
      applyTransform();
      if (needsMore || dragging) { requestAnimationFrame(tick); }
      else { loopRunning = false; }
    })();
  }
  function stopInertia() { velX = 0; velY = 0; }

  viewport.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    e.preventDefault();
    stopInertia();
    dragging = true; moved = false;
    startX = lastX = e.clientX; startY = lastY = e.clientY;
    pid = e.pointerId;
    try { viewport.setPointerCapture(pid); } catch (err) {}

    velX = 0; velY = 0;
    startLoop();

    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    if (Math.abs(e.clientX - startX) > 5 || Math.abs(e.clientY - startY) > 5) moved = true;
    panX += dx; panY += dy;
    velX = velX * 0.72 + dx * 0.28; velY = velY * 0.72 + dy * 0.28;
    lastX = e.clientX; lastY = e.clientY;

    // dragging) renders once per animation frame instead of once per raw
    // pointermove, which can fire far more often than the screen repaints.
  });

  const gaPostcardOverlay = document.getElementById('gaPostcardOverlay');
  const gaPostcard = document.getElementById('gaPostcard');
  function openGaPostcard(card) {
    if (!gaPostcard) return;
    const img = card.dataset.img || card.querySelector('img')?.src || '';
    const tag = card.dataset.tag || '';
    const caption = card.dataset.body || '';
    document.getElementById('gaPostcardMedia').innerHTML = img ? '<img src="' + img + '" alt="">' : '';
    document.getElementById('gaPostcardKicker').textContent = tag;
    document.getElementById('gaPostcardCaption').textContent = caption;
    document.getElementById('gaPostcardFootLabel').textContent = 'Balance';
    gaPostcardOverlay.classList.add('open');
    gaPostcard.classList.add('open');
  }
  function closeGaPostcard() {
    if (!gaPostcard) return;
    gaPostcardOverlay.classList.remove('open');
    gaPostcard.classList.remove('open');
  }
  document.getElementById('gaPostcardClose')?.addEventListener('click', closeGaPostcard);
  gaPostcardOverlay?.addEventListener('click', closeGaPostcard);

  function endDrag(e) {
    if (!dragging) return;
    dragging = false;
    viewport.classList.remove('panning');
    try { if (pid != null) viewport.releasePointerCapture(pid); } catch (err) {}

      startLoop();
    } else if (e) {
      const hit = document.elementFromPoint(e.clientX, e.clientY);
      const card = hit && hit.closest('.ga-photo-tile');
      if (card) openGaPostcard(card);
    }
    pid = null;
  }
  viewport.addEventListener('pointerup', endDrag);
  viewport.addEventListener('pointercancel', endDrag);

  viewport.addEventListener('mousemove', e => {
    if (dragging) return;
    const r = viewport.getBoundingClientRect();
    const nx = (e.clientX - r.left) / r.width - 0.5;
    const ny = (e.clientY - r.top) / r.height - 0.5;
    ambTargetX = -nx * 26; ambTargetY = -ny * 26;
    startLoop();
  });
  viewport.addEventListener('mouseleave', () => { ambTargetX = 0; ambTargetY = 0; startLoop(); });

  let resizeTimer;
  window.addEventListener('resize', () => {
    if (currentView !== 'generalassembly') return;
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(rebuildAndCenter, 150);
  });

  const scaleSlider = document.getElementById('gaScaleSlider');
  const scaleLabel = document.getElementById('gaScaleLabel');
  let scaleRebuildQueued = false;
  function setBaseFont(px) {
    baseFontPx = Math.min(24, Math.max(11, px));
    if (scaleSlider) scaleSlider.value = String(baseFontPx);
    if (scaleLabel) scaleLabel.textContent = Math.round(baseFontPx) + 'px';
    stopInertia();
    // A slider drag can fire many 'input' events between animation frames;
    // rebuilding the whole tile grid (hundreds of DOM/image nodes) on every
    // single one of them was the main source of stutter while adjusting it.
    // Coalesce to at most one rebuild per frame instead.
    if (!scaleRebuildQueued) {
      scaleRebuildQueued = true;
      requestAnimationFrame(() => {
        scaleRebuildQueued = false;
        rebuildAndCenter();
      });
    }
  }
  if (scaleSlider) scaleSlider.addEventListener('input', () => setBaseFont(parseFloat(scaleSlider.value)));
  viewport.addEventListener('wheel', e => {
    if (!e.shiftKey) return;
    e.preventDefault();
    e.stopPropagation();
    setBaseFont(baseFontPx + (e.deltaY < 0 ? 1 : -1));
  }, { passive: false });

  const marginSlider = document.getElementById('gaMarginSlider');
  let marginRebuildQueued = false;
  if (marginSlider) {
    marginSlider.addEventListener('input', () => {
      marginMult = parseFloat(marginSlider.value);
      if (!marginRebuildQueued) {
        marginRebuildQueued = true;
        requestAnimationFrame(() => {
          marginRebuildQueued = false;
          recomputeDims(); buildTiles(); centerPan(); applyTransform();
        });
      }
    });
  }

  const hud = document.getElementById('gaHud');
  const hudHandle = document.getElementById('gaHudHandle');
  if (hudHandle && hud) hudHandle.addEventListener('click', () => hud.classList.toggle('open'));

  let hasInitialized = false;
  window._gaOnShow = function () {
    if (!hasInitialized) {
      hasInitialized = true;
      requestAnimationFrame(() => requestAnimationFrame(rebuildAndCenter));
    } else {
      requestAnimationFrame(rebuildAndCenter);
    }
  };

  // This standalone page has no navigate()/showView() to call _gaOnShow
  // automatically on visiting the page — trigger it directly.
  window._gaOnShow();

  // The parent page can resize this iframe's width (e.g. dragging the split
  // handle between the gallery and the brief panel in foundry.html) — that
  // resizes this iframe's own viewport too, firing a native 'resize' event
  // in here automatically. No cross-frame messaging needed; just react to it.
  let resizeDebounce;
  window.addEventListener('resize', () => {
    clearTimeout(resizeDebounce);
    resizeDebounce = setTimeout(rebuildAndCenter, 150);
  });
})();</script>
