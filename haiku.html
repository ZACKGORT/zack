<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Zack Gort</title>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,100..1000&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#0a0a0a;--fg:#f4f2ee;--mute:rgba(244,242,238,.62);--ghost:rgba(244,242,238,.3);--brand:#ff8da1;--sep:rgba(244,242,238,.28);color-scheme:dark;
      --sans:Figtree,Satoshi,"Helvetica Neue",Arial,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace}
    :root[data-theme=light]{--bg:#f4f2ee;--fg:#141414;--mute:rgba(20,20,20,.62);--ghost:rgba(20,20,20,.3);--brand:#d6336c;--sep:rgba(20,20,20,.28);color-scheme:light}
    :root[data-theme=pink]{--bg:#ff8da1;--fg:#1a0a0e;--mute:rgba(26,10,14,.65);--ghost:rgba(26,10,14,.3);--brand:#fff;--sep:rgba(26,10,14,.3);color-scheme:light}
    html,body{width:100%;height:100%;background:var(--bg);color:var(--fg);overflow:hidden;--ph:max(250px,32svh);touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:background .4s,color .4s}
    body{font-family:var(--sans);-webkit-font-smoothing:antialiased;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
    #scroller{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none;scroll-behavior:smooth;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
    #scroller::-webkit-scrollbar{display:none}
    .spacer{height:calc(50svh - var(--ph)/2)}
    .page{height:var(--ph);width:100%;max-width:900px;margin:0 auto;padding:0 24px;display:flex;flex-direction:column;justify-content:center;scroll-snap-align:center;scroll-snap-stop:always;cursor:pointer;opacity:.3;transform:scale(.82);filter:blur(1.5px);transition:opacity .5s,transform .5s cubic-bezier(.22,1,.36,1),filter .5s}
    .page.cur{opacity:1;transform:none;filter:none;cursor:auto}
    .page:not(.cur) .lw,.page:not(.cur) .vdots{pointer-events:none}
    .page:not(.cur) .vdots{opacity:0}
    .vdots{transition:opacity .3s}
    .edge{position:fixed;left:0;right:0;height:26svh;z-index:5;pointer-events:none}
    #eT{top:0}#eB{bottom:0}
    .edge i{position:absolute;inset:0}
    .edge b{position:absolute;inset:0}
    #eT b{background:linear-gradient(to bottom,var(--bg),transparent)}
    #eB b{background:linear-gradient(to top,var(--bg),transparent)}
    .lw{position:relative;height:1.2em;font-size:clamp(24px,6.2vw,48px);display:flex;align-items:center;justify-content:center;border-radius:999px;outline:none}
    .lw:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
    .raw{position:absolute;text-align:center;font-weight:500;font-size:1em;line-height:1;letter-spacing:-.025em;color:var(--fg);white-space:nowrap;transition:opacity .35s ease,filter .35s ease,transform .35s ease}
    .raw.it{color:var(--brand);font-weight:600}
    .lw.open .raw{opacity:0;filter:blur(6px);transform:scale(.97);pointer-events:none}
    .bk{position:absolute;display:flex;align-items:center;width:max-content;left:50%;transform:translateX(-50%);opacity:0;pointer-events:none;transition:opacity .2s ease,column-gap .55s cubic-bezier(.22,1,.36,1)}
    .lw.open .bk{opacity:1;pointer-events:auto;column-gap:clamp(8px,2vw,20px)}
    .syl{display:flex;flex-direction:column;align-items:center;gap:6px;opacity:0;transform:translateY(5px);transition:opacity .28s ease,transform .28s ease}
    .lw.open .syl{opacity:1;transform:none}
    .syl-t{font-size:.62em;font-weight:500;letter-spacing:-.02em;line-height:1;color:var(--fg)}
    .syl-t.r{color:var(--brand);font-weight:600}
    .syl-n{font:400 11px/1 var(--mono);color:var(--ghost)}
    .syl-n.r{color:var(--brand);opacity:.7}
    .sep{width:2px;height:.6em;border-radius:2px;flex-shrink:0;background:var(--sep);transform:scaleY(0);transition:transform .3s cubic-bezier(.4,0,.15,1)}
    .sep.r{background:var(--brand);opacity:.5}
    .lw.open .sep{transform:scaleY(1)}
    .bdg{min-width:26px;height:26px;border-radius:50%;background:var(--ghost);display:flex;align-items:center;justify-content:center;font:500 12px/1 var(--mono);color:var(--fg);margin-left:14px;flex-shrink:0;opacity:0;transform:scale(.5);transition:opacity .3s ease,transform .3s ease}
    .bdg.r{background:var(--brand);color:var(--bg)}
    .lw.open .bdg{opacity:1;transform:none}
    .sep-h{height:.35em;font-size:clamp(24px,6.2vw,48px)}
    .lw[data-href]{cursor:pointer}
    .lw[data-href] .raw{text-decoration:underline;text-decoration-color:var(--ghost);text-decoration-thickness:2px;text-underline-offset:.18em}
    .lw[data-href]:hover .raw{text-decoration-color:var(--brand)}
    #hint{z-index:6;position:fixed;left:0;right:0;bottom:calc(22px + env(safe-area-inset-bottom));text-align:center;font:400 13px/1 var(--mono);color:var(--mute);pointer-events:none;transition:opacity .8s;animation:hin 1s 1.2s backwards}
    #hint.gone{opacity:0}
    @keyframes hin{from{opacity:0}to{opacity:1}}
    .vdots{display:flex;justify-content:center;gap:4px;margin-top:.5em}
    .vd{padding:10px 4px;cursor:pointer;background:none;border:0;display:block}
    .vd i{display:block;width:8px;height:8px;border-radius:8px;background:var(--ghost);transition:width .35s cubic-bezier(.22,1,.36,1),background .25s}
    .vd:hover i{background:var(--mute)}
    .vd.on i{width:26px;background:var(--brand)}
    .vd:focus-visible{outline:2px solid var(--fg);outline-offset:-4px;border-radius:8px}
    #logo{position:fixed;z-index:7;top:calc(16px + env(safe-area-inset-top));left:calc(18px + env(safe-area-inset-left));color:var(--fg);text-decoration:none;font-family:'Roboto Flex',var(--sans);font-optical-sizing:auto;padding:6px 4px 6px 0}
    #lt{display:flex;white-space:nowrap;line-height:1;font-size:22px;letter-spacing:-.06em;font-weight:300;user-select:none}
    #lt span{display:inline-block}
    #logo:focus-visible,#cvBtn:focus-visible,#cvGo:focus-visible,#themes button:focus-visible{outline:2px solid var(--fg);outline-offset:3px;border-radius:999px}
    #themes{position:fixed;z-index:7;top:calc(16px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;gap:2px}
    #themes button{width:22px;height:26px;display:flex;align-items:center;justify-content:center;background:none;border:0;padding:0;cursor:pointer}
    #themes button::before{content:"";width:12px;height:12px;border-radius:50%;border:1px solid var(--ghost);transition:transform .15s,box-shadow .15s}
    #themes button[data-t=dark]::before{background:#0a0a0a;border-color:rgba(244,242,238,.45)}
    #themes button[data-t=light]::before{background:#f4f2ee;border-color:rgba(20,20,20,.3)}
    #themes button[data-t=pink]::before{background:#ff8da1;border-color:rgba(26,10,14,.25)}
    #themes button:hover::before{transform:scale(1.2)}
    #themes button[aria-pressed=true]::before{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--fg);transform:scale(1.1)}
    #cv{position:fixed;z-index:7;top:calc(16px + env(safe-area-inset-top));right:calc(18px + env(safe-area-inset-right));display:flex;flex-direction:column;align-items:flex-end;gap:8px;max-width:calc(100vw - 36px)}
    #cvBtn{display:flex;align-items:center;gap:8px;padding:9px 12px 9px 14px;border-radius:999px;border:1px solid var(--ghost);background:var(--bg);color:var(--fg);font:500 12px/1 var(--mono);cursor:pointer;transition:border-color .2s}
    #cvBtn:hover{border-color:var(--brand)}
    #cvBtn svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .35s}
    #cv[data-open=false] #cvBtn svg{transform:rotate(180deg)}
    #cvPanel{display:grid;grid-template-rows:1fr;width:min(340px,calc(100vw - 36px));transition:grid-template-rows .45s cubic-bezier(.22,1,.36,1),opacity .3s,visibility .45s}
    #cv[data-open=false] #cvPanel{grid-template-rows:0fr;opacity:0;visibility:hidden}
    .cv-in{min-height:0;overflow:hidden;border-radius:18px;background:var(--bg);box-shadow:0 0 0 1px var(--ghost),0 22px 44px -18px rgba(0,0,0,.55)}
    .cv-h{display:flex;align-items:center;padding:10px 14px;border-bottom:1px solid var(--ghost);font:400 12px/1 var(--mono)}
    #cvGo{color:var(--fg);text-decoration:none}
    #cvGo:hover{color:var(--brand)}
    #cvF{display:block;width:100%;height:min(420px,52svh);border:0;background:#fff}
    @media (max-width:600px){#lt{font-size:17px}#cvBtn{padding:8px 10px 8px 12px;font-size:11px}}
    @media (prefers-reduced-motion:reduce){#scroller{scroll-behavior:auto}*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}}
    </style>
</head>
<body>
  <main id="scroller"><div id="stage"></div></main>
  <div class="edge" id="eT"></div><div class="edge" id="eB"></div>
  <a id="logo" href="https://zack.cx/haiku" target="_blank" rel="noopener" aria-label="zack.cx/haiku"><span id="lt" aria-hidden="true"></span></a>
  <div id="themes" role="group" aria-label="Theme">
    <button data-t="dark" aria-label="Dark theme"></button><button data-t="light" aria-label="Light theme"></button><button data-t="pink" aria-label="Pink theme"></button>
  </div>
  <div id="cv" data-open="true">
    <button id="cvBtn" aria-expanded="true" aria-controls="cvPanel"><span>zack.cx/cv</span><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 8l4-4 4 4"/></svg></button>
    <div id="cvPanel"><div class="cv-in">
      <div class="cv-h"><a id="cvGo" href="https://zack.cx/cv" target="_blank" rel="noopener">zack.cx/cv &#8599;</a></div>
      <iframe id="cvF" src="https://zack.cx/cv" title="Preview of zack.cx/cv" referrerpolicy="no-referrer"></iframe>
    </div></div>
  </div>
  <p id="hint">scroll, tap or use arrow keys</p>
<script>
const P=[
  {fixed:[
    {raw:"Hi! Got a minute?",syls:["Hi!","Got","a","min","ute"]},
    {raw:"I'm Zack Gort & I design",syls:["I'm","Zack","Gort","&","I","des","ign"]},
  ],variants:[
    {raw:"experiences.",syls:["ex","per","i","en","ces"]},
    {raw:"web interfaces.",syls:["web","int","er","face","es"]},
    {raw:"for any device.",syls:["for","a","ny","de","vice"]},
  ]},
  {fixed:[
    {raw:"Everything from",syls:["Ev","er","y","thing","from"]},
    {raw:"creative ideation",syls:["cre","at","ive","I","de","a","tion"]},
  ],variants:[
    {raw:"to big red buttons.",syls:["to","big","red","but","tons"]},
    {raw:"— responsive websites",syls:["res","pon","sive","web","sites"]},
    {raw:"— intuitive forms",syls:["in","tu","i","tive","forms"]},
  ]},
  {fixed:[
    {raw:"People I work with",syls:["Peop","le","I","work","with"]},
    {raw:"say I have a good mind for",syls:["Say","I","have","a","good","mind","for"]},
  ],variants:[
    {raw:"functional design.",syls:["func","tion","a","de","sign"]},
    {raw:"clean typography.",syls:["clean","ty","po","gra","phy"]},
    {raw:"usability.",syls:["us","a","bi","li","t","y"]},
  ]},
  {fixed:[
    {raw:"Ideas aren't pulled",syls:["I","de","as","aren't","pulled"]},
    {raw:"from thin air, but founded in:",syls:["from","thin","air,","but","found","ed","in"]},
  ],variants:[
    {raw:"whiteboard discussions.",syls:["white","board","dis","cus","sions"]},
    {raw:"AB split-testing.",syls:["A","B","split\u2013","test","ing"]},
    {raw:"trial and error.",syls:["tri","al","and","er","ror"]},
  ]},
  {contact:true,lines:[
    {raw:"You can email me",syls:["You","can","em","ail","me"],href:"mailto:zckgrt@gmail.com"},
    {raw:"get connected on LinkedIn",syls:["get","con","nect","ed","on","Linked","In"],href:"https://www.linkedin.com/in/zackgort/"},
    {raw:"or check out my site",syls:["or","check","out","my","site"],href:"https://zack.cx"},
  ]},
];

function bkHtml(syls,r){
  const rc=r?' r':''; let h='';
  syls.forEach((s,i)=>{
    h+=`<div class="syl" style="transition-delay:${i*32}ms"><span class="syl-t${rc}">${s}</span><span class="syl-n${rc}">${i+1}</span></div>`;
    if(i<syls.length-1)h+=`<div class="sep${rc}" style="transition-delay:${i*32+55}ms"></div>`;
  });
  return h+`<div class="bdg${rc}" style="transition-delay:${syls.length*32+80}ms">${syls.length}</div>`;
}
function linel(line,r,link){
  const attr=link?` data-href="${line.href}" role="link" tabindex="0"`:'';
  return `<div class="lw"${attr}><p class="raw${r?' it':''}">${line.raw}</p><div class="bk" aria-hidden="true">${bkHtml(line.syls,r)}</div></div>`;
}
let cp=0;const vs=P.map(()=>0);
const stage=document.getElementById('stage'),hint=document.getElementById('hint'),scroller=document.getElementById('scroller');
stage.innerHTML=P.map((pg,pi)=>{
  let h='';
  if(pg.contact)h=pg.lines.map(l=>linel(l,false,true)).join('<div class="sep-h"></div>');
  else{
    h=pg.fixed.map(f=>linel(f,false,false)).join('')+`<div class="sep-h"></div>`;
    pg.variants.forEach((v,vi)=>{h+=`<div id="v${pi}_${vi}"${vi?' style="display:none"':''}>${linel(v,true,false)}</div>`;});
    h+=`<div class="vdots" role="group" aria-label="Choose a line">`+pg.variants.map((_,vi)=>`<button class="vd${vi?'':' on'}" data-pi="${pi}" data-vi="${vi}" aria-label="Option ${vi+1} of ${pg.variants.length}"><i></i></button>`).join('')+`</div>`;
  }
  return `<section class="page${pi?'':' cur'}" id="pg${pi}" aria-label="Haiku ${pi+1} of ${P.length}">${h}</section>`;
}).join('');
stage.insertAdjacentHTML('afterbegin','<div class="spacer"></div>');
stage.insertAdjacentHTML('beforeend','<div class="spacer"></div>');
document.querySelectorAll('.vd').forEach(d=>{
  d.addEventListener('click',e=>{e.stopPropagation();used();if(+d.dataset.pi===cp){cv=+d.dataset.vi;setV(cp,cv);}});
  d.addEventListener('touchend',e=>e.stopPropagation(),{passive:true});
  d.addEventListener('keydown',e=>e.stopPropagation());
});
document.querySelectorAll('.vd').forEach(d=>{
  d.addEventListener('click',e=>{e.stopPropagation();used();const pi=+d.dataset.pi;if(pi===cp){vs[pi]=+d.dataset.vi;setV(pi);}});
  d.addEventListener('keydown',e=>e.stopPropagation());
});
const go=h=>window.open(h,'_blank','noopener');
stage.querySelectorAll('.lw').forEach(lw=>{
  lw.addEventListener('mouseenter',()=>lw.classList.add('open'));
  lw.addEventListener('mouseleave',()=>lw.classList.remove('open'));
  lw.addEventListener('focus',()=>lw.classList.add('open'));
  lw.addEventListener('blur',()=>lw.classList.remove('open'));
  lw.addEventListener('keydown',e=>{if(e.key==='Enter'&&lw.dataset.href){e.stopPropagation();go(lw.dataset.href);}});
  lw.addEventListener('click',e=>{e.stopPropagation();if(lw.dataset.href)go(lw.dataset.href);else if(matchMedia('(hover:none)').matches)lw.classList.toggle('open');});
});
function setV(pi){
  if(!P[pi].variants)return;
  P[pi].variants.forEach((_,i)=>{
    const el=document.getElementById(`v${pi}_${i}`);
    el.style.display=i===vs[pi]?'':'none';
    if(i!==vs[pi])el.querySelectorAll('.lw').forEach(l=>l.classList.remove('open'));
  });
  document.querySelectorAll(`.vd[data-pi="${pi}"]`).forEach(d=>d.classList.toggle('on',+d.dataset.vi===vs[pi]));
}
function used(){hint.classList.add('gone');}
const pages=[...document.querySelectorAll('.page')];
function toPage(i){pages[i].scrollIntoView({block:'center'});}
function goNext(){used();const pg=P[cp];
  if(pg.variants&&vs[cp]<pg.variants.length-1){vs[cp]++;setV(cp);}
  else if(cp<P.length-1){vs[cp+1]=0;setV(cp+1);toPage(cp+1);}}
function goPrev(){used();
  if(vs[cp]>0){vs[cp]--;setV(cp);}
  else if(cp>0){const p=cp-1;vs[p]=P[p].variants?P[p].variants.length-1:0;setV(p);toPage(p);}}
// which haiku is centered: follows the scroll
let raf=0;
function sync(){
  raf=0;const mid=innerHeight/2;let best=0,bd=1e9;
  pages.forEach((p,i)=>{const r=p.getBoundingClientRect(),d=Math.abs(r.top+r.height/2-mid);if(d<bd){bd=d;best=i;}});
  if(best!==cp){pages[cp].querySelectorAll('.lw.open').forEach(l=>l.classList.remove('open'));cp=best;used();}
  pages.forEach((p,i)=>p.classList.toggle('cur',i===cp));
}
scroller.addEventListener('scroll',()=>{if(!raf)raf=requestAnimationFrame(sync);},{passive:true});
// previews are clickable: jump to that haiku
pages.forEach((p,i)=>p.addEventListener('click',e=>{if(i!==cp){e.stopPropagation();used();toPage(i);}}));
// progressive blur at the top and bottom edges
function edge(id,dir){
  const el=document.getElementById(id),N=7;let h='';
  for(let k=1;k<=N;k++){
    const b=(k*1.7).toFixed(1),a=((N-k)/N*100).toFixed(1),z=((N-k+1)/N*100).toFixed(1);
    const m=`linear-gradient(${dir},#000 ${a}%,transparent ${z}%)`;
    h+=`<i style="backdrop-filter:blur(${b}px);-webkit-backdrop-filter:blur(${b}px);-webkit-mask-image:${m};mask-image:${m}"></i>`;
  }
  el.innerHTML=h+'<b></b>';
}
edge('eT','to bottom');edge('eB','to top');
// theme: follows system, press T to cycle dark / light / pink
const themes=['dark','light','pink'];
let ti=-1;try{ti=themes.indexOf(localStorage.getItem('hk-theme'));}catch(e){}
if(ti<0)ti=matchMedia('(prefers-color-scheme: light)').matches?1:0;
function applyTheme(){document.documentElement.dataset.theme=themes[ti];document.querySelectorAll('#themes button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.t===themes[ti]));try{localStorage.setItem('hk-theme',themes[ti]);}catch(e){}}
applyTheme();
document.querySelectorAll('#themes button').forEach(b=>b.addEventListener('click',()=>{ti=themes.indexOf(b.dataset.t);applyTheme();}));
// tap: left third = back, the rest = forward. Scroll or swipe moves between haikus.
document.addEventListener('click',e=>{if(e.clientX<innerWidth/3)goPrev();else goNext();});
document.addEventListener('keydown',e=>{
  if(e.target.closest&&e.target.closest('.lw')&&e.key===' ')e.preventDefault();
  if(['ArrowDown','ArrowRight',' ','PageDown'].includes(e.key)){e.preventDefault();goNext();}
  if(['ArrowUp','ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();goPrev();}
  if(e.key==='t'||e.key==='T'){ti=(ti+1)%3;applyTheme();}
});
// corner links shouldn't also advance the haiku
['logo','cv','themes'].forEach(id=>document.getElementById(id).addEventListener('click',e=>e.stopPropagation()));
// logo: text-pressure effect. Letters swell in weight and width near the pointer, and ripple on their own when it's away.
(function(){
  const box=document.getElementById('logo'),lt=document.getElementById('lt');
  const chars=Array.from('zack.cx/haiku'),spans=chars.map(c=>{const s=document.createElement('span');s.textContent=c;lt.appendChild(s);return s;});
  const rm=matchMedia('(prefers-reduced-motion: reduce)');
  const cur={x:-1e4,y:-1e4,seen:false},m={x:-1e4,y:-1e4};
  addEventListener('mousemove',e=>{cur.x=e.clientX;cur.y=e.clientY;cur.seen=true;});
  addEventListener('touchstart',e=>{const t=e.touches[0];if(t){cur.x=t.clientX;cur.y=t.clientY;cur.seen=true;}},{passive:true});
  document.documentElement.addEventListener('mouseleave',()=>cur.seen=false);
  let last=0,clock=0,engage=0;
  function tick(now){
    requestAnimationFrame(tick);
    if(document.hidden)return;
    const dt=last?Math.min(now-last,64):16;last=now;
    const f=1-Math.exp(-dt/120);m.x+=(cur.x-m.x)*f;m.y+=(cur.y-m.y)*f;
    const r=lt.getBoundingClientRect(),near=cur.seen&&cur.x>r.left-80&&cur.x<r.right+80&&cur.y>r.top-80&&cur.y<r.bottom+80;
    engage+=((near||rm.matches?1:0)-engage)*(1-Math.exp(-dt/320));
    if(engage<1&&!rm.matches)clock+=dt/1000;
    const reach=Math.max(r.width*.9,60);
    spans.forEach((sp,i)=>{
      const b=sp.getBoundingClientRect(),cx=b.left+b.width/2,cy=b.top+b.height/2;
      let p=Math.max(0,1-Math.hypot(m.x-cx,m.y-cy)/reach);
      const crest=.5+.5*Math.cos(Math.PI*2*(i/chars.length-clock/3.2)),idle=crest*crest*.7;
      p=idle+(p-idle)*engage;
      sp.style.fontVariationSettings=`'wght' ${Math.round(250+750*p)}, 'wdth' ${Math.round(50+90*p)}`;
    });
  }
  requestAnimationFrame(tick);
})();
// cv preview panel: open by default on roomy screens, toggle with the pill
(function(){
  const cv=document.getElementById('cv'),btn=document.getElementById('cvBtn');
  const set=o=>{cv.dataset.open=o;btn.setAttribute('aria-expanded',o);};
  set(innerWidth>900&&innerHeight>560);
  btn.addEventListener('click',()=>set(cv.dataset.open!=='true'));
})();
toPage(0);sync();
</script>
</body>
</html>
