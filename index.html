<style>
:root{
  color-scheme:dark;
  --glass:#000000f2;
  --line:#ffffff26;--line-2:#ffffff33;--line-3:#ffffff1a;
  --fg:#ffffff;--mut:#8a8a8a;--k:#ffffff;--bg:#000000;
  --tint:#ffffff;
  --mob-bg:#000000;--mob-fg:#ffffff;
  box-sizing:border-box;
}
:root[data-theme="light"]{
  color-scheme:light;
  --glass:#fffffff2;
  --line:#00000026;--line-2:#00000033;--line-3:#0000001a;
  --fg:#000000;--mut:#767676;--k:#000000;--bg:#ffffff;
  --tint:#000000;
  --mob-bg:#ffffff;--mob-fg:#000000;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);font:14px/1.5 Inter,system-ui,-apple-system,sans-serif;color:var(--fg);-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0;touch-action:pan-y;cursor:grab}
#track{position:absolute;inset:0;perspective:800px}
#canvasLayer{position:fixed;inset:0;z-index:5;pointer-events:none}
#canvasLayer .it{pointer-events:auto}

.it{position:absolute;left:0;top:0;display:flex;cursor:pointer;white-space:nowrap;text-decoration:none;user-select:none;-webkit-user-drag:none;will-change:transform,opacity,filter;outline:none;
 background:color-mix(in srgb,var(--acc) calc(var(--hl,0)*100%),var(--fill));color:color-mix(in srgb,var(--onacc) calc(var(--hl,0)*100%),var(--ink));
 border:1px solid var(--bd);border-radius:var(--r);padding:var(--pad);font-size:var(--fs);transition:background .5s,color .5s}
.it .in{display:flex;align-items:center;filter:grayscale(var(--g,0))}
.it .tx{display:inline-block;position:relative;font-weight:700;letter-spacing:-.025em;line-height:1}
.it .tx-text{display:block;white-space:nowrap;color:inherit}
.it:focus-visible{box-shadow:0 0 0 2px var(--k)}
.swap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.slot{position:relative;flex:none}
.slot .it{left:50%;top:50%;transform:translate(-50%,-50%);transition:opacity .6s,background .5s,color .5s}

.drag-grip{
  position:absolute;
  bottom:-22px;
  left:50%;
  transform:translateX(-50%) translateY(-4px);
  width:24px;height:14px;
  display:grid;place-items:center;
  color:var(--mut);
  opacity:0;
  pointer-events:none;
  transition:opacity .25s ease, transform .25s ease, color .18s ease;
  cursor:grab;
}
.drag-grip::before{
  content:"";
  width:18px;height:2px;border-radius:1px;
  background:currentColor;
}
.it.is-focus-settled .drag-grip{opacity:.55;transform:translateX(-50%) translateY(0)}
.it.is-focus-settled:hover .drag-grip{opacity:1;color:var(--fg)}
.it.is-pulling .drag-grip{opacity:1;color:var(--fg);transform:translateX(-50%) translateY(0)}
.it.is-detached{cursor:grab}
.it.is-detached:active{cursor:grabbing}
.it.is-detached .drag-grip{display:none}

.park-close{
  position:absolute;top:-8px;right:-8px;width:22px;height:22px;
  border-radius:50%;background:var(--bg);border:1px solid var(--line);
  color:var(--mut);display:none;place-items:center;cursor:pointer;
  padding:0;font-family:inherit;
  transition:color .18s, background .18s, opacity .2s;
  opacity:0;
}
.park-close::before,.park-close::after{
  content:"";position:absolute;top:50%;left:50%;
  width:9px;height:1px;background:currentColor;
  transform:translate(-50%,-50%) rotate(45deg);
}
.park-close::after{transform:translate(-50%,-50%) rotate(-45deg)}
.it.is-detached .park-close{display:grid}
.it.is-detached:hover .park-close{opacity:1}
.park-close:hover{color:var(--fg);background:color-mix(in srgb, var(--fg) 8%, var(--bg))}

#railGhost{
  position:fixed;z-index:4;pointer-events:none;
  background:var(--fg);opacity:0;
  transition:opacity .18s ease;
}
#railGhost.on{opacity:.5}

@keyframes chroma-r{0%,100%{transform:translate(-0.09em,0)}22%{transform:translate(-0.15em,0.03em)}48%{transform:translate(-0.07em,-0.03em)}74%{transform:translate(-0.13em,0.02em)}}
@keyframes chroma-g{0%,100%{transform:translate(0.01em,0)}32%{transform:translate(0.02em,-0.025em)}66%{transform:translate(-0.01em,0.025em)}}
@keyframes chroma-b{0%,100%{transform:translate(0.09em,0)}22%{transform:translate(0.15em,-0.03em)}48%{transform:translate(0.07em,0.03em)}74%{transform:translate(0.13em,-0.02em)}}
.chroma{position:absolute;inset:0;pointer-events:none}
.chroma__ch{position:absolute;top:0;left:0;display:inline-block;white-space:nowrap;font:inherit;letter-spacing:inherit;line-height:inherit;will-change:transform,opacity;opacity:var(--ci,0);transition:opacity .35s ease;color:transparent}
.chroma__ch--r{color:#ff2d55;mix-blend-mode:screen;animation:chroma-r 4.2s ease-in-out infinite}
.chroma__ch--g{color:#00ff5a;mix-blend-mode:screen;animation:chroma-g 5.6s ease-in-out infinite}
.chroma__ch--b{color:#2d9aff;mix-blend-mode:screen;animation:chroma-b 4.8s ease-in-out infinite}
:root[data-theme="light"] .chroma__ch{mix-blend-mode:multiply}

@keyframes zackChroma{0%,100%{text-shadow:-0.09em 0 #ff2d55,0.09em 0 #2d9aff}25%{text-shadow:-0.15em 0.02em #ff2d55,0.13em -0.02em #2d9aff}50%{text-shadow:-0.07em -0.02em #ff2d55,0.07em 0.02em #2d9aff}75%{text-shadow:-0.13em 0 #ff2d55,0.14em 0 #2d9aff}}

#tip{position:fixed;left:0;top:0;z-index:20;pointer-events:none;opacity:0;transition:opacity .2s ease,filter .12s ease;background:none;border:none;padding:0;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;max-width:340px;will-change:transform,filter}
#tip.on{opacity:1}
#tip .tip-name{display:block;font-family:'Inter',sans-serif;font-weight:700;font-size:16px;letter-spacing:-.025em;line-height:1.08;color:var(--fg);margin:0 0 10px;white-space:nowrap}
#tip .tip-rule{display:block;width:22px;height:1px;background:var(--fg);opacity:.4;margin:0 0 9px}
#tip .tip-meta{display:block;font-family:'Inter',sans-serif;font-size:9.5px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;line-height:1.4;color:var(--mut);white-space:nowrap}
#tip .tip-span{color:var(--fg);opacity:.72;font-variant-numeric:tabular-nums}
#tip .tip-sep{opacity:.35;margin:0 .7em}
#tip .tip-cat{color:var(--mut)}
#zackMark{position:fixed;top:calc(env(safe-area-inset-top,0px) + 20px);left:calc(env(safe-area-inset-left,0px) + 24px);z-index:55;font-family:'Roboto Flex',Inter,sans-serif;font-weight:500;font-size:17px;letter-spacing:-.015em;color:var(--fg);text-decoration:none;cursor:pointer;user-select:none;line-height:1;display:inline-block;opacity:.85;transition:opacity .25s ease}
#zackMark:hover{opacity:1;animation:zackChroma 3.2s ease-in-out infinite}
#zackMark .pc{display:inline-block;will-change:font-variation-settings}
#notifStack{position:fixed;right:0;top:0;bottom:0;z-index:30;width:min(460px,100vw);display:none;flex-direction:column;pointer-events:none;padding-top:calc(env(safe-area-inset-top,0px) + 56px)}
#notifStack.on{display:flex}
.stack-head{pointer-events:auto;flex:none;display:flex;align-items:center;gap:14px;padding:14px 32px 12px;background:none;backdrop-filter:none;-webkit-backdrop-filter:none;border-bottom:1px solid var(--line);font-family:'Inter',sans-serif;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);font-weight:500}
.stack-head .brand-mark{flex:1;min-width:0;display:flex;align-items:baseline;gap:10px;overflow:hidden}
.stack-head .bm-name{color:var(--fg);font-size:13px;font-weight:600;letter-spacing:-.01em;text-transform:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stack-head .bm-cat{color:var(--mut);font-size:10px;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stack-head .count{color:var(--mut);font-family:'Inter',sans-serif;font-size:10px;letter-spacing:.1em;font-variant-numeric:tabular-nums;white-space:nowrap;flex:none}
.stack-head .stack-btns{display:flex;gap:2px;align-items:center;flex:none;margin-left:2px}
.stack-btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;color:var(--mut);transition:color .18s,background .18s}
.stack-btn:hover{color:var(--fg);background:color-mix(in srgb, var(--fg) 5%, transparent)}
.stack-btn:focus-visible{outline:2px solid var(--k);outline-offset:1px}
.stack-btn svg{width:13px;height:13px;display:block;stroke-width:1.6}
.stack-body{pointer-events:auto;flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;-ms-overflow-style:none;padding:0 0 180px;mask-image:linear-gradient(to bottom,#000 0,#000 calc(100% - 140px),transparent 100%);-webkit-mask-image:linear-gradient(to bottom,#000 0,#000 calc(100% - 140px),transparent 100%)}
.stack-body::-webkit-scrollbar{display:none}
.notif{position:relative;padding:24px 32px 26px;border-top:1px solid var(--line);animation:slideIn .45s cubic-bezier(.2,.9,.3,1) both;transition:opacity .42s cubic-bezier(.4,0,.2,1),transform .42s cubic-bezier(.4,0,.2,1),max-height .42s cubic-bezier(.4,0,.2,1),padding .42s cubic-bezier(.4,0,.2,1),border-top-color .4s;will-change:transform,opacity;max-height:2400px}
.notif:first-child{border-top:none}
@keyframes slideIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.notif.dismissed{opacity:0;transform:translateX(24px);max-height:0;padding-top:0;padding-bottom:0;border-top-color:transparent;pointer-events:none;overflow:hidden}
.notif .n-kicker{display:block;font-family:'Inter',sans-serif;font-size:10px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);margin:0 0 14px}
.notif .n-title{font-family:'Inter',sans-serif;font-weight:600;font-size:18px;letter-spacing:-.02em;line-height:1.24;color:var(--fg);margin:0 0 10px;text-wrap:pretty;padding-right:22px}
.notif .n-msg{font-family:'Inter',sans-serif;font-size:14px;font-weight:400;line-height:1.55;color:color-mix(in srgb, var(--fg) 82%, var(--bg));margin:0;text-wrap:pretty}
.notif .n-msg b{color:var(--fg);font-weight:600}
.notif .n-msg em{color:color-mix(in srgb, var(--fg) 90%, var(--bg));font-style:italic}
.notif .n-media{display:block;margin-top:18px;cursor:zoom-in;transition:opacity .25s ease}
.notif .n-media:hover{opacity:.94}
.notif .n-media img{display:block;width:100%;height:auto;max-width:100%;background:color-mix(in srgb, var(--fg) 8%, var(--bg));border-radius:2px}
.notif .n-media-cap{display:block;margin-top:8px;font-family:'Inter',sans-serif;font-size:10px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.notif .n-media-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:18px}
.notif .n-media-grid.n-2{grid-template-columns:repeat(2,1fr)}
.notif .n-media-grid.n-4{grid-template-columns:repeat(2,1fr)}
.notif .n-media-grid .n-thumb{display:block;aspect-ratio:1/1;overflow:hidden;border-radius:2px;background:color-mix(in srgb, var(--fg) 8%, var(--bg));cursor:zoom-in;transition:opacity .2s}
.notif .n-media-grid .n-thumb:hover{opacity:.85}
.notif .n-media-grid .n-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.notif details.n-more{margin-top:16px}
.notif details.n-more summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:8px;padding:6px 0;font-family:'Inter',sans-serif;font-size:10.5px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);user-select:none;transition:color .2s}
.notif details.n-more summary::-webkit-details-marker{display:none}
.notif details.n-more summary::after{content:'';display:inline-block;width:10px;height:10px;border-right:1px solid currentColor;border-bottom:1px solid currentColor;transform:rotate(45deg) translate(-2px,-2px);transition:transform .25s ease}
.notif details.n-more[open] summary::after{transform:rotate(-135deg) translate(-2px,0)}
.notif details.n-more summary:hover{color:var(--fg)}
.notif details.n-more .n-details{margin-top:6px;padding:14px 0 0;border-top:1px solid var(--line-3);font-family:'Inter',sans-serif;font-size:13.5px;line-height:1.65;color:color-mix(in srgb, var(--fg) 78%, var(--bg))}
.notif details.n-more .n-details p{margin:0 0 10px}
.notif details.n-more .n-details p:last-child{margin-bottom:0}
.notif .n-close{all:unset;position:absolute;top:22px;right:28px;width:22px;height:22px;display:grid;place-items:center;cursor:pointer;color:var(--mut);transition:color .2s}
.notif .n-close::before,
.notif .n-close::after{content:'';position:absolute;top:50%;left:50%;width:11px;height:1px;background:currentColor;transform:translate(-50%,-50%) rotate(45deg);transition:transform .25s ease}
.notif .n-close::after{transform:translate(-50%,-50%) rotate(-45deg)}
.notif .n-close:hover{color:var(--fg)}
.notif .n-close:hover::before{transform:translate(-50%,-50%) rotate(135deg)}
.notif .n-close:hover::after{transform:translate(-50%,-50%) rotate(45deg)}
.notif .n-close:focus-visible{outline:2px solid var(--k);outline-offset:3px;border-radius:4px}

#lightbox{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;background:color-mix(in srgb, var(--bg) 90%, transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding:48px;cursor:zoom-out;animation:lbIn .25s ease both}
#lightbox.on{display:flex}
@keyframes lbIn{from{opacity:0}to{opacity:1}}
#lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:3px;box-shadow:0 30px 80px color-mix(in srgb, var(--fg) 40%, transparent);animation:lbImgIn .35s cubic-bezier(.2,.9,.3,1) both}
@keyframes lbImgIn{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
#lightbox .lb-close{position:absolute;top:24px;right:24px;width:40px;height:40px;border-radius:50%;background:color-mix(in srgb, var(--fg) 5%, transparent);border:1px solid var(--line);color:var(--fg);display:grid;place-items:center;cursor:pointer;transition:background .2s,transform .2s;font-family:inherit;padding:0;position:relative}
#lightbox .lb-close::before,
#lightbox .lb-close::after{content:'';position:absolute;top:50%;left:50%;width:14px;height:1px;background:currentColor;transform:translate(-50%,-50%) rotate(45deg)}
#lightbox .lb-close::after{transform:translate(-50%,-50%) rotate(-45deg)}
#lightbox .lb-close:hover{background:color-mix(in srgb, var(--fg) 12%, transparent);transform:scale(1.05)}

#cw{position:fixed;left:max(16px,env(safe-area-inset-left));bottom:max(16px,env(safe-area-inset-bottom));z-index:40;display:flex;flex-direction:column;gap:8px}
#themeToggle,#gear{all:unset;cursor:pointer;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb, var(--fg) 5%, transparent);border:1px solid var(--line);color:var(--mut);transition:.2s;backdrop-filter:blur(10px)}
#themeToggle:hover,#gear:hover,#cw.open #gear{color:var(--fg);background:color-mix(in srgb, var(--fg) 9%, transparent)}
#themeToggle svg{width:17px;height:17px;display:block}
#themeToggle .i-sun{display:none}
#themeToggle .i-moon{display:block}
:root[data-theme="light"] #themeToggle .i-sun{display:block}
:root[data-theme="light"] #themeToggle .i-moon{display:none}
#gear svg{width:18px;height:18px;transition:transform .4s}#cw.open #gear svg{transform:rotate(90deg)}
#pn{position:absolute;left:0;bottom:calc(100% + 8px);width:290px;max-height:min(70vh,560px);overflow:auto;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:16px;padding:6px 14px;opacity:0;transform:translateY(8px) scale(.98);transform-origin:bottom left;pointer-events:none;transition:.22s;box-shadow:0 20px 50px color-mix(in srgb, var(--fg) 30%, transparent)}
#cw.open #pn{opacity:1;transform:none;pointer-events:auto}
details.cfg{border-bottom:1px solid var(--line);padding:8px 0}details.cfg:last-child{border:0}
summary{cursor:pointer;list-style:none;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);font-weight:600;display:flex;justify-content:space-between}
summary::after{content:"+"}details[open] summary::after{content:"–"}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;font-size:12.5px;color:color-mix(in srgb, var(--fg) 82%, var(--bg))}
.row input[type=range]{width:96px;accent-color:var(--k)}
.row output{width:34px;text-align:right;font-variant-numeric:tabular-nums;font-size:11.5px;color:var(--mut)}
.row select{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:7px;padding:4px 6px;font:inherit;max-width:130px}
.row input[type=color]{width:38px;height:24px;padding:1px;border:1px solid var(--line);border-radius:6px;background:none}
.row input[type=checkbox]{accent-color:var(--k);width:16px;height:16px}
.rv{display:flex;align-items:center;gap:6px}

#mobileWrap{display:none}

@media (max-width: 767px) {
  html, body {
    height: auto; min-height: 100%;
    overflow-x: hidden; overflow-y: auto;
    background: var(--mob-bg); color: var(--mob-fg);
    overscroll-behavior-y: auto;
    -webkit-text-size-adjust: 100%;
  }
  #stage, #tip, #zackMark, #notifStack, #cw, #canvasLayer, #railGhost { display: none !important; }
  #lightbox { padding: 20px; }
  #lightbox .lb-close { top: 14px; right: 14px; width: 36px; height: 36px; }

  #mobileWrap {
    display: block;
    --bg: var(--mob-bg);
    --fg: var(--mob-fg);
    --muted: color-mix(in srgb, var(--fg) 40%, var(--bg));
    --body: color-mix(in srgb, var(--fg) 72%, var(--bg));
    --line: color-mix(in srgb, var(--fg) 14%, transparent);
    --font: "Inter", "Helvetica Neue", Arial, system-ui, sans-serif;
    --title-weight: 400;
    --open-ms: 650ms; --close-ms: 450ms;
    --ease: cubic-bezier(.65, 0, .15, 1);
    --pad: clamp(20px, 5vw, 38px);
    background: var(--bg); color: var(--fg);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    min-height: 100vh; min-height: 100dvh;
  }
  #mobileWrap * { box-sizing: border-box; }

  .acc {
    padding: clamp(28px, 8vw, 56px) 0 clamp(60px, 14vw, 80px);
    padding-bottom: max(140px, 50vh);
    max-width: 640px; margin: 0 auto;
  }
  .acc__head {
    padding: 0 var(--pad);
    display: grid; grid-template-columns: 1fr;
    align-items: start; gap: 20px;
    margin-bottom: clamp(32px, 8vw, 64px);
  }
  .acc__eyebrow {
    display: flex; align-items: center; gap: 12px;
    font-size: 12px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--body); margin: 0 0 16px; font-weight: 500;
  }
  .acc__eyebrow i {
    width: 22px; height: 22px; border-radius: 50%;
    border: 1.5px solid var(--body); flex: none; display: block;
  }
  .acc__heading {
    margin: 0; font-weight: 400;
    font-size: clamp(56px, 20vw, 96px);
    line-height: .92; letter-spacing: -.04em;
    text-transform: uppercase; color: var(--fg);
  }
  .acc__side {
    margin: 0; max-width: 34ch; text-align: left;
    font-size: 12px; line-height: 1.7;
    letter-spacing: .08em; text-transform: uppercase;
    color: var(--body); font-weight: 400;
  }

  .m-marquee-wrap { position: relative; margin: 0 0 clamp(32px, 8vw, 56px); }

  .m-marquee {
    display: flex; align-items: center;
    gap: clamp(24px, 7vw, 48px);
    padding: 10px 0 8px;

      const sr=span.getBoundingClientRect();

    <span class="chroma__ch chroma__ch--g">${t}</span>

}

function reinsert(el){

stage.addEventListener('pointerdown', e=>{

    pullReady = false;

    const perpRaw = H ? dy : dx;
    const alongRaw = H ? dx : dy;

    const th = Math.max(20, C.pullThreshold);
    pullVisualY = th * Math.tanh(perpRaw / th);

    const dwellZone = th * 0.85;

    }

    pullDwellStart = 0; pullReady = false;

let sy=scrollY;
addEventListener('scroll',()=>{const d=Math.abs(scrollY-sy);sy=scrollY;inertia=clamp(inertia+(C.dir==='reverse'?1:-1)*clamp(d,0,80)*C.scrollPush*2.2,-1800,1800)},{passive:true});

addEventListener('wheel', e => {

      if ((goingUp && !atTop) || (goingDown && !atBottom)) return;

  }

  inertia = clamp(inertia + (C.dir === 'reverse' ? 1 : -1) * d * C.scrollPush * 1.4, -1800, 1800);

}, { passive: true });

const stackEl=$('#notifStack');
let currentBrandIdx=-1;
let dismissedSet=new Set();

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function mediaHTML(n){
  let html='';
  if(n.image){
    html+=`<span class="n-media" data-lb="${n.image}">
      <img src="${n.image}" alt="" loading="lazy" draggable="false">
    </span>`;
    if(n.imageTag) html+=`<span class="n-media-cap">${esc(n.imageTag)}</span>`;
  }
  if(n.images&&n.images.length){
    const cls=n.images.length===2?'n-2':n.images.length===4?'n-4':'';
    html+=`<div class="n-media-grid ${cls}">${
      n.images.map(src=>`<span class="n-thumb" data-lb="${src}"><img src="${src}" alt="" loading="lazy" draggable="false"></span>`).join('')
    }</div>`;
  }
  return html;
}

function openNotifStack(idx){
  const brand=B[idx];
  const [,ty,g,col,cat,span,notifs]=brand;
  const [name]=brand;

  if(currentBrandIdx===idx && stackEl.classList.contains('on')) return;

  currentBrandIdx=idx;
  dismissedSet=new Set();

  const head=document.createElement('div');
  head.className='stack-head';
  head.innerHTML=`
    <div class="brand-mark">
      <span class="bm-name">${esc(name)}</span>
      <span class="bm-cat">${esc(cat)}</span>
    </div>
    <span class="count" data-count></span>
    <span class="stack-btns">
      <button class="stack-btn" data-restore-all aria-label="Restore all">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15.5-6.4L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.5 6.4L3 16"/><path d="M3 21v-5h5"/></svg>
      </button>
      <button class="stack-btn" data-close aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M6 6l12 12M18 6l-12 12"/></svg>
      </button>
    </span>
  `;

  const body=document.createElement('div');
  body.className='stack-body';

  notifs.forEach((n,i)=>{
    const card=document.createElement('article');
    card.className='notif';
    card.dataset.idx=i;
    card.innerHTML=`
      ${n.kicker?`<span class="n-kicker">${esc(n.kicker)}</span>`:''}
      <h3 class="n-title">${esc(n.title)}</h3>
      <p class="n-msg">${n.message}</p>
      ${mediaHTML(n)}
      ${n.details?`<details class="n-more"><summary>View details</summary><div class="n-details">${n.details.split('\n\n').map(p=>`<p>${p}</p>`).join('')}</div></details>`:''}
      <button class="n-close" aria-label="Dismiss"></button>
    `;
    card.querySelector('.n-close').addEventListener('click',e=>{
      e.stopPropagation();
      dismissNotif(i,card);
    });
    card.querySelectorAll('[data-lb]').forEach(el=>{
      el.addEventListener('click',e=>{
        e.stopPropagation();
        openLightbox(el.getAttribute('data-lb'));
      });
    });
    body.appendChild(card);
  });

  stackEl.innerHTML='';
  stackEl.appendChild(head);
  stackEl.appendChild(body);
  stackEl.classList.add('on');

  head.querySelector('[data-close]').addEventListener('click',closeStack);
  head.querySelector('[data-restore-all]').addEventListener('click',restoreAll);

  updateCount();
  [...body.children].forEach((c,i)=>{c.style.animationDelay=(i*0.05)+'s'});
}

function dismissNotif(i,card){
  dismissedSet.add(i);
  card.classList.add('dismissed');
  updateCount();
  if(dismissedSet.size===B[currentBrandIdx][6].length){
    setTimeout(()=>{
      if(dismissedSet.size===B[currentBrandIdx][6].length && stackEl.classList.contains('on')){
        closeStack();
      }
    },900);
  }
}

function restoreAll(){
  dismissedSet.clear();
  stackEl.querySelectorAll('.notif').forEach(c=>c.classList.remove('dismissed'));
  updateCount();
}

function updateCount(){
  if(currentBrandIdx<0)return;
  const total=B[currentBrandIdx][6].length;
  const shown=total-dismissedSet.size;
  const el=stackEl.querySelector('[data-count]');
  if(el) el.textContent=shown+' / '+total;
}

function closeStack(){
  stackEl.classList.remove('on');
  currentBrandIdx=-1;
  dismissedSet=new Set();
  setTimeout(()=>{ if(!stackEl.classList.contains('on')) stackEl.innerHTML=''; },420);
}

addEventListener('keydown',e=>{
  if(e.key==='Escape' && stackEl.classList.contains('on') && !lbEl.classList.contains('on')) closeStack();
});

let last=0;
function frame(ts){
 raf=0;if(!visible||document.hidden||mode==='swap'){last=0;return}
 const dt=Math.min(.05,last?(ts-last)/1000:0);last=ts;clock+=dt;
 const hovering = (C.hover && !!hov) || dragging;
 let target;
 if(hovering){
   target = 0;
   hoverReleaseAt = 0;
 } else if(hoverReleaseAt){
   const elapsed = (ts - hoverReleaseAt) / 1000;
   target = elapsed < C.resumeDelay ? 0 : 1;
   if(elapsed >= C.resumeDelay) hoverReleaseAt = 0;
 } else {
   target = 1;
 }
 hoverF += (target - hoverF) * Math.min(1, dt*8);
 const frozen = (dragMode === 'pull') || (dragMode === 'detach') || (dragMode === 'parked');
 if(glide){off+=(glide.to-off)*Math.min(1,dt*7);inertia=0;if(Math.abs(glide.to-off)<.8){off=glide.to;const cb=glide.cb;glide=null;cb&&cb()}}
 else if(!dragging && !frozen){off+=((C.dir==='reverse'?1:-1)*C.speed*hoverF+inertia)*dt;inertia*=Math.exp(-dt*2.5)}
 update();raf=requestAnimationFrame(frame);
}
function run(){if(!raf&&visible&&!document.hidden&&mode!=='swap'){last=0;raf=requestAnimationFrame(frame)}}
new IntersectionObserver(e=>{visible=e[0].isIntersecting;run()}).observe(stage);
document.addEventListener('visibilitychange',run);

   else if(t==='col')inp.value=C[k].slice(0,7);else inp.checked=C[k]}

 pn.append(d)});

(function buildMobile(){
  const list = document.getElementById('mobileList');
  const marquee = document.getElementById('mMarquee');
  const prevBtn = document.getElementById('mPrev');
  const nextBtn = document.getElementById('mNext');
  if(!list || !marquee) return;

  const pad2 = n => String(n + 1).padStart(2, '0');
  const arrowSVG = '<svg class="m-item__arrow" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 4v23M6 17l10 10 10-10"/></svg>';

  function renderNotif(n){
    let media = '';
    if(n.image){
      media += `<div class="m-notif__media" data-lb="${n.image}"><img src="${n.image}" alt="" loading="lazy" draggable="false"></div>`;
      if(n.imageTag) media += `<div class="m-notif__cap">${esc(n.imageTag)}</div>`;
    }
    if(n.images && n.images.length){
      const cls = n.images.length === 2 ? 'g-2' : n.images.length === 4 ? 'g-4' : '';
      media = `<div class="m-notif__grid ${cls}">${n.images.map(src => `<div class="m-thumb" data-lb="${src}"><img src="${src}" alt="" loading="lazy" draggable="false"></div>`).join('')}</div>`;
    }
    const details = n.details
      ? `<details class="m-notif__more"><summary>View details</summary><div class="m-notif__detail">${n.details.split('\n\n').map(p => `<p>${p}</p>`).join('')}</div></details>`
      : '';
    return `
      <div class="m-notif">
        ${n.kicker ? `<div class="m-notif__kicker">${esc(n.kicker)}</div>` : ''}
        <h4 class="m-notif__title">${esc(n.title)}</h4>
        <p class="m-notif__msg">${n.message}</p>
        ${media}
        ${details}
      </div>
    `;
  }

  marquee.innerHTML = B.map((brand, i) => {
    const name = brand[0];
    return `<button class="m-mq" type="button" data-idx="${i}" aria-label="${esc(name)}">
      <span class="tx" style="font:inherit;letter-spacing:inherit;line-height:inherit">${chromaHTML(name)}</span>
    </button>`;
  }).join('');

  const mqButtons = [...marquee.querySelectorAll('.m-mq')];

  let paintRaf = 0;
  function paintMarquee(){
    paintRaf = 0;
    const wrapR = marquee.getBoundingClientRect();
    const cx = wrapR.left + wrapR.width / 2;
    const maxDist = Math.max(160, wrapR.width / 2);
    mqButtons.forEach(btn => {
      const r = btn.getBoundingClientRect();
      const ecx = r.left + r.width / 2;
      const d = Math.min(1, Math.abs(ecx - cx) / maxDist);
      const f = 1 - (d * d * (3 - 2 * d));
      btn.style.filter = d > 0.02 ? `blur(${(d * 6).toFixed(2)}px)` : 'none';
      btn.style.opacity = (0.14 + 0.86 * f).toFixed(3);
      btn.classList.toggle('is-active', d < 0.16);
    });
    if(prevBtn && nextBtn){
      const max = Math.max(1, marquee.scrollWidth - marquee.clientWidth);
      const x = marquee.scrollLeft;
      prevBtn.disabled = x <= 2;
      nextBtn.disabled = x >= max - 2;
    }
  }
  function schedulePaint(){
    if(paintRaf) return;
    paintRaf = requestAnimationFrame(paintMarquee);
  }
  marquee.addEventListener('scroll', schedulePaint, { passive: true });
  window.addEventListener('resize', schedulePaint);
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>{ schedulePaint(); requestAnimationFrame(()=>centerIndex(0,false)); });
  paintMarquee();

  function centerIndex(idx, smooth){
    const btn = mqButtons[idx];
    if(!btn) return;
    const wrapR = marquee.getBoundingClientRect();
    const btnR = btn.getBoundingClientRect();
    const delta = (btnR.left + btnR.width/2) - (wrapR.left + wrapR.width/2);
    const target = marquee.scrollLeft + delta;
    if(smooth) marquee.scrollTo({ left: target, behavior: 'smooth' });
    else marquee.scrollLeft = target;
  }

  function currentCentered(){
    let best = 0, bd = Infinity;
    const wrapR = marquee.getBoundingClientRect();
    const cx = wrapR.left + wrapR.width / 2;
    mqButtons.forEach((b, i) => {
      const r = b.getBoundingClientRect();
      const d = Math.abs(r.left + r.width / 2 - cx);
      if(d < bd){ bd = d; best = i; }
    });
    return best;
  }
  function step(delta){
    const cur = currentCentered();
    const target = Math.max(0, Math.min(mqButtons.length - 1, cur + delta));
    if(target === cur) return;
    centerIndex(target, true);
    paintMarquee();
  }
  if(prevBtn) prevBtn.addEventListener('click', () => step(-1));
  if(nextBtn) nextBtn.addEventListener('click', () => step(1));

  list.innerHTML = B.map((brand, i) => {
    const [name, ty, g, col, cat, span, notifs] = brand;
    const notifHTML = notifs.map(renderNotif).join('');
    return `
      <li class="m-item" data-idx="${i}">
        <h3 style="margin:0">
          <button class="m-item__btn" type="button" id="mh${i}" aria-expanded="false" aria-controls="mp${i}">
            <span class="m-item__num">${pad2(i)}</span>
            <span class="m-item__title-wrap">
              <span class="m-item__title" data-text="${esc(name)}">${esc(name)}</span>
              <span class="m-item__cat">${esc(cat)}</span>
            </span>
            ${arrowSVG}
          </button>
        </h3>
        <div class="m-item__panel" id="mp${i}" role="region" aria-labelledby="mh${i}">
          <div class="m-item__clip">
            <div class="m-item__content">${notifHTML}</div>
          </div>
        </div>
      </li>
    `;
  }).join('');

  const mItems = [...list.querySelectorAll('.m-item')];

  function setOpen(item, open){
    item.classList.toggle('is-open', open);
    const btn = item.querySelector('.m-item__btn');
    btn.setAttribute('aria-expanded', open);
    const clip = item.querySelector('.m-item__clip');
    if(clip) clip.inert = !open;
  }
  mItems.forEach(el => setOpen(el, false));

  function openMobileItem(idx, scroll){
    const item = list.querySelector(`.m-item[data-idx="${idx}"]`);
    if(!item) return;
    const alreadyOpen = item.classList.contains('is-open');
    mItems.forEach(o => { if(o !== item) setOpen(o, false); });
    setOpen(item, !alreadyOpen ? true : false);
    if(scroll && !alreadyOpen){
      window.setTimeout(() => {
        const r = item.getBoundingClientRect();
        const y = Math.max(0, r.top + window.scrollY - 90);
        window.scrollTo({ top: y, behavior: 'smooth' });
      }, 720);
    }
  }

  list.addEventListener('click', e => {
    const lbTarget = e.target.closest('[data-lb]');
    if(lbTarget){
      e.stopPropagation();
      openLightbox(lbTarget.getAttribute('data-lb'));
      return;
    }
    const btn = e.target.closest('.m-item__btn');
    if(!btn) return;
    const item = btn.closest('.m-item');
    const idx = parseInt(item.dataset.idx, 10);
    if(isNaN(idx)) return;
    openMobileItem(idx, false);
    centerIndex(idx, true);
    paintMarquee();
  });

  list.addEventListener('keydown', e => {
    const btns = [...list.querySelectorAll('.m-item__btn')];
    const i = btns.indexOf(document.activeElement);
    if(i < 0) return;
    const next = { ArrowDown: i + 1, ArrowUp: i - 1, Home: 0, End: btns.length - 1 }[e.key];
    if(next === undefined) return;
    e.preventDefault();
    btns[(next + btns.length) % btns.length].focus();
  });

  let downX = 0, downY = 0, tappedMoved = false;
  marquee.addEventListener('pointerdown', e => {
    downX = e.clientX; downY = e.clientY; tappedMoved = false;
  }, { passive: true });
  marquee.addEventListener('pointermove', e => {
    if(tappedMoved) return;
    if(Math.hypot(e.clientX - downX, e.clientY - downY) > 8) tappedMoved = true;
  }, { passive: true });
  marquee.addEventListener('click', e => {
    if(tappedMoved) return;
    const btn = e.target.closest('.m-mq');
    if(!btn) return;
    const idx = parseInt(btn.dataset.idx, 10);
    if(isNaN(idx)) return;
    centerIndex(idx, true);
    openMobileItem(idx, true);
  });

  requestAnimationFrame(() => { centerIndex(0, false); paintMarquee(); });
})();

document.fonts.ready.then(()=>{ if(innerWidth > 767) rebuild(); });
</script>
