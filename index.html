# Zack Gort — craft.experience (https://zack.cx)

> Senior User Experience / Product Designer. Thesis: "UX is dead. ¡Viva la CX!" (craft experience). Thinks about design and data as systems, writes to find out what he actually thinks, then makes the thing. Mostly websites where people find money, spend money, or invest it. Left-handed, self-taught, still curious about how things fit together.

Contact: if a creative team is hiring, LinkedIn is the quickest route — https://www.linkedin.com/in/zackgort/

## Case studies

- TikTok For Business (https://zack.cx/tiktok) — via Code & Theory. Senior UX Designer on the web ecosystem. Headless content architecture and intent-led journeys merged a fragmented network of B2B sites into one unified experience. Outcome: 80% lift in click-through for SMBs starting to advertise; 33% rise in views for inspiration and case-study sections; 18.5% increase in blog views.
- BNY Mellon — Pershing X / Wove (https://zack.cx/bny) — via Publicis Sapient. Senior UX Designer, Product Design Lead (IA/flows) for Wove's advisor experience. Unified dashboard connecting disconnected advisor tools so data isn't re-entered across modules. Human-only due diligence: every legacy application analyzed and mapped by hand (2023–2024); AI had no part in the project.
- General Nutrition Centers, GNC (https://zack.cx/gnc) — via Elva Design Group. Senior UX Designer; led UX, IA and design-system side of a 12-week, ground-up Shopify rebuild after bankruptcy (mobile-first navigation, retail taxonomy, modular design system). Outcome: helped GNC reclaim ~$500M in annual revenue (a team win).

## More work

- Résumé: https://zack.cx/cv (also downloadable as .docx from the page)
- Dana: https://zack.cx/dana
- Inc: https://zack.cx/inc
- PX: https://zack.cx/px

## Specializations, tools, currently

- Specializations: User Experience Design, Visual Interface Design, Accessibility Compliance, UX Research & Strategy, Information Architecture, Experience Architecture, Interaction Design, Design Systems, Enterprise Product Design, E-commerce Architecture, Front-end Development, Human-AI Interaction, Prototyping & Creative Coding
- Tools: Figma, Adobe CS, HTML/CSS/JS, pen & paper, whiteboard
- Currently: AI + creative coding, design systems & workflows

## R&D (experiments, built by hand, left running in public)

Independently conceived, designed and implemented. Functional public sites, not static portfolio concepts; this page itself is a single hand-built HTML/CSS/JS file.

- https://ifimaybefrank.com — a prose platform (writing done without AI; em dashes intact)
- https://ifimaybefrank.com/classic — a personal writing tool
- https://neverever.land — personal provenance
- https://intoview.pro — professional provenance
- https://emdash.click — in defense of the em dash

## How the page works

Hero
- Full-bleed hero: "UX IS DEAD" in Satoshi, drawn on a canvas (a port of the React Bits TechText effect). A selection frame sweeps across the letters on its own and follows the pointer; the letter under it flips to a dashed outline with a tiny spinner. Drag a letter and it springs home; click one and it hops.
- The period is a circle with an arrow. Hover it and a hop ripples through the letters from the circle outward while the page peeks down as a teaser. Click it and the ripple runs again as the page scrolls on.
- On a first visit a movable, resizable title card opens by itself with a 7-second countdown line along its top edge. Hovering pauses it; any click or drag cancels it. It belongs to the hero and closes when you scroll away.

Scrolling and navigation
- One jump function handles every jump: links, number keys, Space/J/K stepping, [ and ] section hops, Home/End, the right-click index, edge hotspots, and deep links like /#work. It keeps re-aiming while lazy images change page height, then parks keyboard focus on the destination.
- Edge hotspots: near the top or bottom of the screen a label fades in with proximity; clicking steps to the previous or next stop.
- Scroll progress readout; blurred edges switch on once the hero leaves view.
- Collapsible key legend in the lower right; ? opens the full list of shortcuts.
- Idle nudge: if you stall, the page nudges you, and the scroll toast hands off to a #cursory link.
- Keyboard and focus handling is treated as a feature, including a Tab loop-back.

Content
- About: short, confident copy ("I think. I make.") followed by a deliberately cheeky tooltip: "user is kind of implied, no?"
- Case studies open as accordions over a fixed full-viewport backdrop image with input-driven parallax. Clicking a gallery thumbnail makes it the new backdrop. A live iframe of the case-study page loads the first time a panel opens.
- Skills: hover or tap previews show a GIF or image for each specialization and tool.
- R&D_sandbox: a discreet note in About opens a dockable card linking to the other projects listed above.

Widgets
- Hero links and header nav items open as movable, scalable iframe widgets, rendered at 1600x1000 and scaled to fit. Drag them, pull them out of a magnetic dock against elastic resistance, resize from a corner, double-click the header for 1:1 scale. Desktop / mobile toggles in each widget header switch the frame between a 1600x1000 and a 390x844 viewport; the default follows the device (narrow screens open in mobile view). Esc closes one widget per press.
- A "view all" grid shows live pages, so the work itself is the demo rather than a screenshot.
- Also on the page: a SoundCloud player for works in progress, confetti, and a theme toggle (dark default, pink).

## About this page

A single-file, keyboard-navigable portfolio: scroll-driven image stages, live embedded previews of the case-study sites, draggable windows, and a three-swatch theme switcher (dark, light, pink). Press Esc to return to the top; T cycles themes; number keys jump to sections.

void main(){

const setI=v=>{v=Math.round(clampI(v));if(v===st.i)return;st.i=v;if(!st.on&&v>0){st.on=true;apply()}else{vars();save();kick()}sync()};
const place=()=>{const r=btn.getBoundingClientRect();sl.style.left=(r.left+r.width/2)+'px';sl.style.top=(r.bottom+4)+'px'};
const showS=()=>{if(w)return;clearTimeout(hideT);place();sync();sl.classList.add('on')};
const hideS=()=>{clearTimeout(hideT);hideT=setTimeout(()=>{if(held||drag||hov>0)return;sl.classList.remove('on')},260)};
const mouse=e=>e.pointerType!=='touch';
[btn,sl].forEach(el=>{el.addEventListener('pointerenter',e=>{if(!mouse(e))return;hov++;showS()});el.addEventListener('pointerleave',e=>{if(!mouse(e))return;hov=Math.max(0,hov-1);hideS()})});
btn.addEventListener('focus',()=>{if(btn.matches(':focus-visible'))showS()});btn.addEventListener('blur',hideS);
const fromY=e=>{const r=sl.querySelector('.lt').getBoundingClientRect();fv=clampI(100*(1-(e.clientY-r.top)/r.height));setI(fv)};
sl.addEventListener('pointerdown',e=>{if(e.button)return;e.preventDefault();drag=true;sl.setPointerCapture(e.pointerId);fromY(e)});
sl.addEventListener('pointermove',e=>{if(drag)fromY(e)});
['pointerup','pointercancel'].forEach(n=>sl.addEventListener(n,()=>{drag=false;hideS()}));
sl.addEventListener('contextmenu',e=>{e.preventDefault();e.stopPropagation()});
/* hold the leaf + scroll: wheel nudges the same slider, and the page doesn't scroll while it's held */
btn.addEventListener('pointerdown',e=>{if(!mouse(e)||e.button)return;held=true;wheeled=false;fv=st.i;showS()});
['pointerup','pointercancel'].forEach(n=>addEventListener(n,()=>{if(!held)return;held=false;hideS()},true));
addEventListener('wheel',e=>{if(!held)return;e.preventDefault();e.stopImmediatePropagation();wheeled=true;
 const k=e.deltaMode===1?33:e.deltaMode===2?200:1;fv=clampI(fv-e.deltaY*k*.08);setI(fv);showS()},{passive:false,capture:true});
addEventListener('resize',()=>{if(sl.classList.contains('on'))place()});
/* cursor parallax (from leaf.html): the eased pointer shifts the whole window + leaves opposite the cursor, the near beam most and the far penumbra least (in the shader, uPar). mouse / pen only, skipped for reduced motion */
const rm=matchMedia('(prefers-reduced-motion: reduce)').matches;
let tx=0,ty=0,cx=0,cy=0;
const aim=(x,y)=>{tx=x;ty=y;kick()};
if(!rm){addEventListener('pointermove',e=>{if(!st.on||!st.p||e.pointerType==='touch')return;aim(e.clientX/innerWidth*2-1,e.clientY/innerHeight*2-1)},{passive:true});root.addEventListener('mouseleave',()=>aim(0,0))}
sync();
window.zcxLeaf={toggle,open};
apply()})();
</script>
