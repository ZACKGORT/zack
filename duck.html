<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Duck Hunt 3D</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0b0b10}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
body{display:grid;place-items:center;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);box-sizing:border-box}
#wrap{position:relative;width:min(100vw,calc(100dvh*256/240));aspect-ratio:256/240;cursor:none;touch-action:none;user-select:none;overflow:hidden;background:#000}
#wrap canvas{position:absolute;inset:0;width:100%;height:100%}
#game{image-rendering:pixelated}
#crt{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(0,0,0,.14) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.45) 100%)}
#gun{pointer-events:none}
#ret{position:absolute;width:3.2%;aspect-ratio:1;border:2px solid rgba(255,60,40,.85);border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;left:50%;top:55%;box-shadow:0 0 6px rgba(255,60,40,.6)}
#ret::after{content:"";position:absolute;inset:42%;background:rgba(255,60,40,.9);border-radius:50%}
</style></head><body>
<div id="wrap"><canvas id="game"></canvas><div id="crt"></div><canvas id="gun"></canvas><div id="ret"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=s=>document.querySelector(s),wrap=$('#wrap'),ret=$('#ret');
const cv=$('#game'),ctx=cv.getContext('2d');cv.width=256;cv.height=240;
const R=(c,x,y,w,h,col)=>{c.fillStyle=col;c.fillRect(x,y,w,h)},r=(...a)=>R(ctx,...a);
const blob=(c,cx,cy,rad,col)=>{c.fillStyle=col;for(let d=-rad;d<=rad;d++){const w=Math.floor(Math.sqrt(rad*rad-d*d));c.fillRect(cx-w,cy+d,w*2,1)}};
const mk=()=>{const e=document.createElement('canvas');e.width=256;e.height=240;return e};
/* ---------- scenery ---------- */
const bg=mk(),b=bg.getContext('2d');
R(b,0,0,256,240,'#3cbcfc');R(b,0,158,256,40,'#58d800');R(b,0,158,256,3,'#80d010');
R(b,33,84,7,88,'#a04000');R(b,33,84,2,88,'#c86010');
[[36,66,11],[52,80,9],[24,90,9],[40,88,9],[58,96,6]].forEach(([x,y,q])=>{blob(b,x,y,q,'#00a800');blob(b,x-1,y-1,q-2,'#58d800')});
[[205,158,13],[222,161,9],[188,162,9]].forEach(([x,y,q])=>{blob(b,x,y,q,'#00a800');blob(b,x-1,y-2,q-3,'#58d800')});
const fg=mk(),f=fg.getContext('2d');
R(f,0,172,256,22,'#00a800');R(f,0,182,256,1,'#006800');
for(let x=0;x<256;x+=3){const h=3+((x*37)%11);R(f,x,172-h,2,h+2,'#00a800');R(f,x,172-h,1,2,'#80d010')}
R(f,0,192,256,2,'#a04000');R(f,0,194,256,46,'#e8a038');
for(let i=0;i<60;i++)R(f,(i*53)%256,196+(i*29)%44,2,1,'#c07820');
/* ---------- audio ---------- */
let ac;const A=()=>ac||(ac=new(window.AudioContext||window.webkitAudioContext)());
function tone(fr,d,type='square',v=.05,f2=fr,dl=0){try{const a=A(),o=a.createOscillator(),g=a.createGain(),t=a.currentTime+dl;o.type=type;o.frequency.setValueAtTime(fr,t);o.frequency.exponentialRampToValueAtTime(Math.max(30,f2),t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d)}catch(e){}}
function noise(d,v){try{const a=A(),n=a.sampleRate*d|0,bf=a.createBuffer(1,n,a.sampleRate),s=bf.getChannelData(0);for(let i=0;i<n;i++)s[i]=(Math.random()*2-1)*(1-i/n);const o=a.createBufferSource(),g=a.createGain();g.gain.value=v;o.buffer=bf;o.connect(g).connect(a.destination);o.start()}catch(e){}}
const jingle=()=>[392,494,587,784].forEach((q,i)=>tone(q,.14,'square',.05,q,i*.13));
const laugh=()=>{for(let i=0;i<6;i++)tone(i%2?260:330,.1,'square',.05,i%2?230:300,i*.12)};
/* ---------- game state ---------- */
const PAL=[{c:'#202020',p:500},{c:'#2038ec',p:1000},{c:'#d82800',p:1500}];
let S;
function reset(){S={mode:'title',t:0,round:1,score:0,next:0,hits:Array(10).fill(0),shots:3,ducks:[],wt:0,blk:0,dog:{x:-34,y:146,m:'walk',f:0},rm:'',held:[],lx:128}}
reset();
const go=m=>{S.mode=m;S.t=0};
const need=()=>Math.min(10,6+Math.floor((S.round-1)/3));
function startWave(){
  const n=(S.round>=3&&S.next<=8&&S.next%2==0)?2:1;S.ducks=[];
  for(let i=0;i<n;i++){const ti=Math.min(2,Math.floor(Math.random()*(1+S.round/3))),sp=55+S.round*9;
    S.ducks.push({id:S.next++,x:50+Math.random()*150,y:150,vx:0,vy:0,dir:1,st:'fly',t:0,tt:1,col:PAL[ti],sp,caught:false});aimDuck(S.ducks[i],true)}
  S.shots=3;S.wt=0;go('fly');tone(900,.08,'square',.04,1400)}
function aimDuck(d,first){const a=(20+Math.random()*50)*Math.PI/180,s=Math.random()<.5?-1:1,up=first||d.y>70||Math.random()<.5;
  d.vx=Math.cos(a)*d.sp*s;d.vy=(up?-1:1)*Math.sin(a)*d.sp;d.tt=.7+Math.random()}
function shoot(gx,gy){
  if(S.mode!=='fly'||S.shots<=0)return;S.shots--;S.blk=.035;noise(.16,.3);tone(200,.12,'sawtooth',.08,40);kick();
  S.ducks.forEach(d=>{if(d.st==='fly'&&Math.abs(gx-d.x)<15&&Math.abs(gy-d.y)<12){d.st='hit';d.t=0;d.caught=true;S.hits[d.id]=1;S.score+=d.col.p;tone(700,.3,'square',.05,120)}})}
function update(dt){
  S.t+=dt;if(S.blk>0)S.blk-=dt;const t=S.t;
  if(S.mode==='intro'){const d=S.dog;
    if(t<2.4){d.x=-34+t*57;d.y=146;d.m='walk';d.f=Math.floor(t*6)%2}
    else if(t<3.1){const u=(t-2.4)/.7;d.m='jump';d.x=102+u*26;d.y=146-Math.sin(Math.PI*u)*40+(u>.5?(u-.5)*68:0)}
    else go('card')}
  else if(S.mode==='card'){if(t>1.6)startWave()}
  else if(S.mode==='fly'){
    S.wt+=dt;const lim=Math.max(4.5,7-S.round*.25);
    const live=S.ducks.some(d=>d.st==='fly');
    if(live&&(S.shots<=0||S.wt>lim))S.ducks.forEach(d=>{if(d.st==='fly'){d.st='escape';d.vy=-110;S.hits[d.id]=2}});
    S.ducks.forEach(d=>{d.t+=dt;
      if(d.st==='fly'){d.x+=d.vx*dt;d.y+=d.vy*dt;if(d.vx)d.dir=d.vx<0?-1:1;
        if(d.x<10){d.x=10;d.vx=Math.abs(d.vx)}if(d.x>246){d.x=246;d.vx=-Math.abs(d.vx)}
        if(d.y<12){d.y=12;d.vy=Math.abs(d.vy)}if(d.y>132){d.y=132;d.vy=-Math.abs(d.vy)}
        if((d.tt-=dt)<=0)aimDuck(d)}
      else if(d.st==='hit'){if(d.t>.35){d.st='fall';d.vy=150;tone(900,.5,'square',.04,200)}}
      else if(d.st==='fall'){d.y+=d.vy*dt;if(d.y>158){d.st='gone';S.lx=d.x;tone(90,.1,'square',.08,50)}}
      else if(d.st==='escape'){d.y+=d.vy*dt;d.x+=d.vx*.25*dt;if(d.y<-24)d.st='gone'}});
    if(S.ducks.every(d=>d.st==='gone')){
      S.held=S.ducks.filter(d=>d.caught);S.rm=S.held.length?'hold':'laugh';
      S.held.length?jingle():laugh();go('result')}}
  else if(S.mode==='result'&&t>1.9){
    if(S.next<10)startWave();
    else if(S.hits.filter(h=>h==1).length>=need()){S.round++;S.next=0;S.hits.fill(0);go('card');jingle()}
    else{go('over');laugh()}}
}
/* ---------- drawing ---------- */
function txt(s,x,y,col='#fff',sz=8,al='left'){ctx.font=sz+'px "Press Start 2P",monospace';ctx.textAlign=al;ctx.textBaseline='top';ctx.fillStyle='#000';ctx.fillText(s,x+1,y+1);ctx.fillStyle=col;ctx.fillText(s,x,y)}
function duck(d){
  const fr=Math.floor(d.t*11)%3,dead=d.st==='fall',hit=d.st==='hit',W='#fcd8a8';
  ctx.save();ctx.translate(Math.round(d.x),Math.round(d.y));ctx.scale(d.dir<0?-1:1,dead?-1:1);
  r(-11,-1,4,3,d.col.c);r(-8,-3,15,8,hit?'#fcfcfc':d.col.c);r(-6,3,11,3,W);
  r(5,-8,7,7,'#00a800');r(11,-5,5,3,'#fc9838');r(9,-6,2,2,'#fff');
  if(hit){r(9,-6,2,2,'#000')}
  else if(fr==0)r(-6,-12,8,9,W);else if(fr==1)r(-6,-4,10,3,W);else r(-6,4,8,7,W);
  ctx.restore()}
function dog(){
  const T='#fc9838',B='#a04000',d=S.dog;
  if(S.mode==='intro'||S.mode==='card'&&false){const{x,y,m,f}=d;
    r(x,y+8,22,9,T);r(x+19,y+2,11,10,T);r(x+29,y+5,3,3,'#000');r(x+16,y+2,4,10,B);r(x+24,y+4,2,2,'#000');r(x-4,y+7,5,3,T);
    if(m==='walk'){r(x+2+f*3,y+17,4,6,T);r(x+15-f*3,y+17,4,6,T)}else{r(x+2,y+17,4,4,T);r(x+16,y+17,4,4,T)}}
  else if(S.mode==='result'){
    const u=S.t,x0=S.rm==='hold'?Math.max(24,Math.min(232,S.lx)):128;
    const y=u<.4?172-u/.4*38:u<1.5?134:134+(u-1.5)/.4*38,x=x0+(S.rm==='laugh'?(Math.floor(u*16)%2?-1:1):0);
    r(x-9,y+23,18,16,T);r(x-9,y+8,18,15,T);r(x-13,y+6,5,14,B);r(x+8,y+6,5,14,B);
    r(x-5,y+12,2,2,'#000');r(x+3,y+12,2,2,'#000');r(x-2,y+16,4,3,'#000');
    if(S.rm==='laugh'){r(x-6,y+20,12,5,'#a00000');r(x-5,y+20,10,2,'#fff')}
    else S.held.forEach((h,i)=>duck({x:x+(S.held.length>1?(i?13:-13):0),y:y-6,dir:1,st:'fall',t:0,col:h.col}))}}
function hud(){
  const P=(x,y,w,h)=>{r(x,y,w,h,'#fff');r(x+1,y+1,w-2,h-2,'#000')};
  P(14,198,44,34);for(let i=0;i<3;i++)if(i<S.shots){r(20+i*12,204,7,12,'#fcd8a8');r(20+i*12,201,7,3,'#fc9838')}
  txt('SHOT',17,221,'#3cbcfc',6);
  P(64,198,114,34);txt('HIT',70,203,'#3cbcfc',6);txt('R='+S.round,70,221,'#fcfcfc',6);
  for(let i=0;i<10;i++){const v=S.hits[i];r(104+i*7,204,5,5,v==1?'#d82800':v==2?'#fcfcfc':'#6c6c6c');r(106+i*7,209,1,3,'#6c6c6c')}
  txt('NEED '+need(),104,221,'#80d010',6);
  P(184,198,60,34);txt(String(S.score).padStart(6,'0'),190,205,'#fff',7);txt('SCORE',190,221,'#3cbcfc',6)}
function draw(){
  if(S.blk>0){r(0,0,256,240,'#000');return}
  ctx.drawImage(bg,0,0);dog();S.ducks.forEach(d=>d.st!=='gone'&&duck(d));ctx.drawImage(fg,0,0);hud();
  const blink=Math.floor(performance.now()/450)%2;
  if(S.mode==='card'){r(92,50,72,34,'#000');r(94,52,68,30,'#3cbcfc');r(96,54,64,26,'#000');txt('ROUND',128,58,'#fff',8,'center');txt(String(S.round),128,70,'#fff',8,'center')}
  if(S.mode==='title'){r(28,40,200,86,'#000');r(30,42,196,82,'#d82800');r(33,45,190,76,'#000');
    txt('DUCK HUNT',128,58,'#fc9838',16,'center');txt('3D ZAPPER EDITION',128,84,'#3cbcfc',7,'center');if(blink)txt('CLICK TO START',128,102,'#fff',8,'center')}
  if(S.mode==='over'){r(48,50,160,60,'#000');r(50,52,156,56,'#3cbcfc');r(52,54,152,52,'#000');
    txt('GAME OVER',128,62,'#d82800',12,'center');txt('SCORE '+S.score,128,82,'#fff',7,'center');if(blink)txt('CLICK TO RETRY',128,94,'#fff',7,'center')}}
/* ---------- 3D zapper ---------- */
const gl=new THREE.WebGLRenderer({canvas:$('#gun'),alpha:true,antialias:true});
const sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(45,256/240,.1,50);
sc.add(new THREE.AmbientLight(0xffffff,.7));
const dl=new THREE.DirectionalLight(0xffffff,.9);dl.position.set(-1.5,3,2);sc.add(dl);
const rim=new THREE.DirectionalLight(0x8ab4ff,.45);rim.position.set(2,0,-1);sc.add(rim);
const mat=(c,m=.25,ro=.45)=>new THREE.MeshStandardMaterial({color:c,metalness:m,roughness:ro});
const pivot=new THREE.Group(),gun=new THREE.Group();pivot.add(gun);pivot.position.set(.42,-.62,-1.25);sc.add(pivot);
const box=(w,h,d,x,y,z,c,rx=0)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),c);m.position.set(x,y,z);m.rotation.x=rx;gun.add(m)};
const gray=mat(0xdadade),dark=mat(0x26262c,.5,.4),org=mat(0xff6a1a,.1,.5);
box(.15,.19,.62,0,0,.05,gray);box(.13,.13,.3,0,.01,.5,gray);box(.14,.14,.07,0,.01,.7,org);
box(.152,.03,.34,0,.07,.08,dark);box(.12,.34,.15,0,-.24,-.12,gray,-.25);
box(.12,.03,.14,0,-.13,.12,dark);box(.03,.09,.03,0,-.1,.08,dark,.3);
box(.06,.04,.06,0,.115,-.15,dark);box(.025,.05,.025,0,.1,.6,dark);
const flash=new THREE.Mesh(new THREE.SphereGeometry(.09,12,8),new THREE.MeshBasicMaterial({color:0xffe27a,transparent:true,opacity:.9}));
flash.position.set(0,.01,.8);flash.visible=false;gun.add(flash);
const aim={x:.5,y:.55},sm={x:.5,y:.55};let recoil=0,fl=0;
function kick(){recoil=1;fl=.06}
function gun3(dt,t){
  const k=Math.min(1,dt*18);sm.x+=(aim.x-sm.x)*k;sm.y+=(aim.y-sm.y)*k;
  const hh=Math.tan(22.5*Math.PI/180)*4,hw=hh*cam.aspect;
  pivot.lookAt((sm.x*2-1)*hw,-(sm.y*2-1)*hh,-4);
  recoil=Math.max(0,recoil-dt*7);pivot.rotateX(-recoil*.3);gun.position.z=-recoil*.12;gun.position.y=Math.sin(t*1.6)*.006;
  fl-=dt;flash.visible=fl>0;gl.render(sc,cam)}
function resize(){const w=wrap.clientWidth,h=wrap.clientHeight;gl.setPixelRatio(Math.min(devicePixelRatio,2));gl.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
/* ---------- input ---------- */
function pos(e){const q=wrap.getBoundingClientRect();aim.x=Math.min(1,Math.max(0,(e.clientX-q.left)/q.width));aim.y=Math.min(1,Math.max(0,(e.clientY-q.top)/q.height));ret.style.left=aim.x*100+'%';ret.style.top=aim.y*100+'%'}
wrap.addEventListener('pointermove',pos);
wrap.addEventListener('pointerdown',e=>{pos(e);try{A().resume()}catch(_){}
  if(S.mode==='title'){go('intro')}else if(S.mode==='over'){reset();go('intro')}else shoot(aim.x*256,aim.y*240)});
let last=performance.now();
(function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;update(dt);draw();gun3(dt,n/1000);requestAnimationFrame(loop)})(last);
</script></body></html>
