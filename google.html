<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Google</title>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@300;400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --blue:        #1a73e8;
  --blue-hover:  #1765cc;
  --visited:     #681da8;
  --url:         #0d652d;
  --red:         #ea4335;
  --yellow:      #fbbc04;
  --green:       #34a853;
  --surface:     #ffffff;
  --surface-alt: #f8f9fa;
  --fg:          #202124;
  --muted:       #70757a;
  --border:      #dfe1e5;
  --border-focus:#4285f4;
  --shadow-sm:   0 1px 3px rgba(0,0,0,.12), 0 1px 2px rgba(0,0,0,.14);
  --shadow-md:   0 4px 6px rgba(0,0,0,.07), 0 1px 3px rgba(0,0,0,.08);
  --shadow-lg:   0 8px 24px rgba(0,0,0,.15);
  --sans:        'Google Sans', sans-serif;
  --body:        'Roboto', sans-serif;
  --mono:        'Roboto Mono', monospace;
  --sheet-peek:  72px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
body.dark {
  --surface:     #202124;
  --surface-alt: #303134;
  --fg:          #e8eaed;
  --muted:       #9aa0a6;
  --border:      #3c4043;
  --url:         #5bb974;
  --visited:     #c58af9;
  --blue:        #8ab4f8;
  --blue-hover:  #aecbfa;
}
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; overflow:hidden; }
body {
  background:var(--surface);
  color:var(--fg);
  font-family:var(--body);
  transition:background 0.2s,color 0.2s;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}

/* ──────────────── CUSTOM CURSOR (desktop only) ──────────────── */
@media (hover:hover) and (pointer:fine) {
  body { cursor: none; }
  button, a, input { cursor: none; }
}
#cursor-canvas {
  position:fixed; inset:0; pointer-events:none; z-index:9999;
  display:none;
}
@media (hover:hover) and (pointer:fine) {
  #cursor-canvas { display:block; }
}

/* ──────────────── LOGO ──────────────── */
.g-logo { font-family:var(--sans); font-size:1em; font-weight:400; letter-spacing:-0.5px; user-select:none; }
.g-logo .g  { color:var(--blue); }
.g-logo .o1 { color:var(--red); }
.g-logo .o2 { color:var(--yellow); }
.g-logo .g2 { color:var(--blue); }
.g-logo .l  { color:var(--green); }
.g-logo .e  { color:var(--red); }

/* ──────────────── PAGE SHELL ──────────────── */
#page-home    { display:flex; flex-direction:column; height:100%; background:var(--surface); overflow:auto; }
#page-results { display:none; flex-direction:column; height:100%; position:relative; }

/* ══════════════════════════════════════════
   HOME PAGE
══════════════════════════════════════════ */
#home-nav {
  display:flex; justify-content:flex-end; align-items:center;
  padding:14px 16px; gap:12px; flex-shrink:0;
}
.hnav-link { font-family:var(--body); font-size:13px; color:var(--fg); text-decoration:none; padding:6px 4px; }
.hnav-link:hover { text-decoration:underline; }
.hnav-signin {
  font-family:var(--sans); font-size:14px; font-weight:500;
  color:#fff; background:var(--blue); border:none;
  border-radius:4px; padding:9px 20px;
  transition:background 0.15s,box-shadow 0.15s;
  box-shadow:var(--shadow-sm); min-height:44px;
}
.hnav-signin:hover { background:var(--blue-hover); }

#home-center {
  flex:1; display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  padding:0 16px 80px;
}
#home-wordmark {
  font-family:var(--sans); font-size:clamp(64px,20vw,92px);
  font-weight:400; letter-spacing:-2px; margin-bottom:24px; user-select:none;
}

/* Home search bar */
#home-search-row {
  width:100%; max-width:560px; position:relative; margin-bottom:20px;
}
#home-input {
  width:100%; background:var(--surface); border:1px solid var(--border);
  border-radius:9999px; padding:14px 56px 14px 52px;
  font-family:var(--body); font-size:16px; color:var(--fg); outline:none;
  box-shadow:var(--shadow-sm); transition:box-shadow 0.15s,border-color 0.15s;
  min-height:52px; -webkit-appearance:none;
}
#home-input:hover { box-shadow:var(--shadow-md); }
#home-input:focus { border-color:transparent; box-shadow:0 4px 12px rgba(0,0,0,.15); }
#home-input::placeholder { color:var(--muted); }
.home-input-icon {
  position:absolute; left:18px; top:50%; transform:translateY(-50%);
  color:var(--muted); font-size:20px; pointer-events:none;
}
.home-input-actions {
  position:absolute; right:12px; top:50%; transform:translateY(-50%);
  display:flex; gap:4px; align-items:center;
}
.home-mic-btn,.home-lens-btn {
  background:none; border:none; color:var(--muted); font-size:20px;
  padding:6px; transition:color 0.15s; min-width:44px; min-height:44px;
  display:flex; align-items:center; justify-content:center;
}
.home-mic-btn:active,.home-lens-btn:active { color:var(--fg); }

#home-btns { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
.hbtn {
  font-family:var(--body); font-size:14px; color:var(--fg);
  background:var(--surface-alt); border:1px solid var(--surface-alt);
  border-radius:4px; padding:10px 20px; min-height:44px;
  transition:border-color 0.15s,box-shadow 0.15s;
}
.hbtn:hover { border-color:var(--border); box-shadow:var(--shadow-sm); }

#home-language { margin-top:24px; font-size:13px; color:var(--muted); text-align:center; }
#home-language a { color:var(--blue); text-decoration:none; }
#home-language a:hover { text-decoration:underline; }

#home-footer {
  border-top:1px solid var(--border); background:var(--surface-alt);
  padding:14px 16px; flex-shrink:0;
}
.hfooter-inner {
  display:flex; flex-wrap:wrap; gap:8px 16px; justify-content:center;
}
.hfooter-link {
  font-size:13px; color:var(--muted); text-decoration:none; padding:4px 0;
}
.hfooter-link:hover { color:var(--fg); text-decoration:underline; }

/* ══════════════════════════════════════════
   RESULTS PAGE — TOP BAR
══════════════════════════════════════════ */
#results-topbar {
  position:sticky; top:0; z-index:200;
  background:var(--surface); border-bottom:1px solid var(--border);
  flex-shrink:0;
}
#results-row1 {
  display:flex; align-items:center; gap:10px; padding:8px 12px;
}
#results-wordmark {
  font-family:var(--sans); font-size:26px; font-weight:400;
  letter-spacing:-1px; user-select:none; flex-shrink:0;
}
#results-search-wrap { flex:1; position:relative; min-width:0; }
#results-input {
  width:100%; background:var(--surface); border:1px solid var(--border);
  border-radius:9999px; padding:9px 44px 9px 16px;
  font-family:var(--body); font-size:15px; color:var(--fg); outline:none;
  transition:border-color 0.15s,box-shadow 0.15s;
  min-height:44px; -webkit-appearance:none;
}
#results-input:focus { border-color:transparent; box-shadow:0 2px 10px rgba(0,0,0,.15); }
.results-input-icon {
  position:absolute; right:12px; top:50%; transform:translateY(-50%);
  color:var(--blue); font-size:20px; background:none; border:none;
  min-width:40px; min-height:40px; display:flex; align-items:center; justify-content:center;
}
.rtopbar-actions { display:flex; gap:6px; align-items:center; flex-shrink:0; }
.rtop-btn {
  font-family:var(--body); font-size:13px; color:var(--muted);
  background:none; border:1px solid var(--border); border-radius:4px;
  padding:5px 10px; min-height:36px; transition:color 0.15s,border-color 0.15s;
}
.rtop-btn:hover { color:var(--fg); }
.rtop-btn.primary { color:#fff; background:var(--blue); border-color:var(--blue); }

/* Hide "Sign in" text on mobile, show icon */
.rtop-btn.primary .btn-text-full { display:inline; }
.rtop-btn.primary .btn-text-short { display:none; }
@media(max-width:480px) {
  .rtop-btn.primary .btn-text-full { display:none; }
  .rtop-btn.primary .btn-text-short { display:inline; }
  #results-wordmark { font-size:22px; }
}

/* Tabs row */
#results-tabs-row {
  display:flex; overflow-x:auto; scrollbar-width:none;
  padding:0 0 0 12px; /* no huge left indent on mobile */
  -webkit-overflow-scrolling:touch;
}
#results-tabs-row::-webkit-scrollbar { display:none; }
.rtab {
  font-family:var(--body); font-size:13px; color:var(--muted);
  background:none; border:none; border-bottom:3px solid transparent;
  padding:10px 14px; white-space:nowrap; display:flex;
  align-items:center; gap:5px; transition:color 0.15s; min-height:44px;
}
.rtab:hover { color:var(--fg); }
.rtab.on { color:var(--blue); border-bottom-color:var(--blue); font-weight:500; }
.rtab-icon { font-size:14px; opacity:0.7; }

/* ══════════════════════════════════════════
   RESULTS BODY — SCROLLABLE MAIN AREA
══════════════════════════════════════════ */
#results-body {
  flex:1; overflow:hidden; position:relative; display:flex; flex-direction:column;
}

/* Main scroll area — leaves room for the bottom sheet peek */
#results-main {
  flex:1; overflow-y:auto; padding:16px 16px 0;
  -webkit-overflow-scrolling:touch;
  /* bottom padding = sheet peek + safe area so content is not hidden */
  padding-bottom:calc(var(--sheet-peek) + 20px + var(--safe-bottom));
}

/* Desktop: side by side */
@media(min-width:960px) {
  #results-body { flex-direction:row; }
  #results-main {
    width:660px; flex-shrink:0; padding:20px 0 60px 162px;
    padding-bottom:60px !important;
  }
}

#results-count { font-family:var(--body); font-size:13px; color:var(--muted); margin-bottom:16px; }

/* Search result items */
.sri { margin-bottom:28px; position:relative; }
.sri-site-row { display:flex; align-items:center; gap:8px; margin-bottom:4px; }
.sri-favicon {
  width:18px; height:18px; border-radius:50%;
  background:var(--surface-alt); border:1px solid var(--border);
  display:flex; align-items:center; justify-content:center;
  font-family:var(--sans); font-size:8px; font-weight:700;
  color:var(--muted); flex-shrink:0; overflow:hidden;
}
.sri-domain { font-family:var(--body); font-size:14px; color:var(--fg); }
.sri-crumb { font-family:var(--body); font-size:13px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sri-title-wrap { position:relative; margin-bottom:3px; }
.sri-title {
  font-family:var(--sans); font-size:19px; font-weight:400;
  line-height:1.3; color:var(--blue); text-decoration:none;
  display:inline; transition:color 0.08s;
}
@media(max-width:600px) {
  .sri-title { font-size:17px; }
}
.sri-title-wrap.particles-active .sri-title { color:transparent !important; }
.sri-title:visited { color:var(--visited); }
.sri-snippet { font-family:var(--body); font-size:14px; line-height:1.58; color:var(--muted); }
.sri-snippet b { color:var(--fg); font-weight:500; }
.sri-date { font-family:var(--body); font-size:13px; color:var(--muted); }
.sri-sitelinks { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
.sitelink {
  font-family:var(--body); font-size:13px; color:var(--blue);
  border:1px solid var(--border); border-radius:4px;
  padding:6px 12px; text-decoration:none; min-height:36px;
  display:flex; align-items:center;
  transition:background 0.12s,border-color 0.12s;
}
.sitelink:hover { background:var(--surface-alt); }
.sri-actions { display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
.sri-action-chip {
  font-family:var(--body); font-size:12px; color:var(--muted);
  border:1px solid var(--border); border-radius:9999px; padding:5px 12px;
  min-height:32px; display:flex; align-items:center;
  transition:background 0.12s;
}
.sri-action-chip:hover { background:var(--surface-alt); color:var(--fg); }

/* Pagination */
#results-pages { display:flex; align-items:center; gap:4px; padding:20px 0 40px; }
.pword {
  font-family:var(--sans); font-size:14px; color:var(--blue);
  padding:8px 14px; border-radius:4px; background:none; border:none;
  font-weight:500; min-height:44px;
}
.pword:hover { background:var(--surface-alt); }
.pnum {
  font-family:var(--sans); font-size:13px; min-width:36px; height:36px;
  display:flex; align-items:center; justify-content:center;
  border-radius:50%; color:var(--blue); background:none; border:none;
}
.pnum:hover { background:var(--surface-alt); }
.pnum.on { background:var(--blue); color:#fff; }

/* ══════════════════════════════════════════
   DESKTOP AI PANEL (side panel ≥960px)
══════════════════════════════════════════ */
#ai-panel-desktop {
  display:none;
  flex:1; min-width:0; padding:20px 28px 60px 20px;
  overflow-y:auto;
}
@media(min-width:960px) {
  #ai-panel-desktop { display:block; }
}
#ai-panel-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
#ai-panel-label {
  font-family:var(--sans); font-size:12px; font-weight:500;
  letter-spacing:0.08em; text-transform:uppercase; color:var(--muted);
  display:flex; align-items:center; gap:8px;
}
.ai-gemini-dot {
  width:16px; height:16px;
  background:linear-gradient(135deg,var(--blue),var(--green));
  border-radius:50%; flex-shrink:0;
  animation:geminiPulse 3s ease-in-out infinite;
}
@keyframes geminiPulse {
  0%,100% { opacity:1; transform:scale(1); }
  50% { opacity:0.7; transform:scale(0.9); }
}
#ai-panel-hide-btn {
  font-family:var(--body); font-size:12px; color:var(--muted);
  background:none; border:1px solid var(--border); border-radius:9999px;
  padding:3px 12px;
}
#ai-panel-hide-btn:hover { color:var(--fg); border-color:var(--muted); }

/* Bento grid */
#bento-desktop { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
#bento-sheet   { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
@media(max-width:400px) {
  #bento-sheet { grid-template-columns:1fr; }
}

/* Bento tiles */
.bt {
  background:var(--surface); border:1px solid var(--border);
  border-radius:12px; padding:15px 16px; overflow:hidden;
  transition:box-shadow 0.15s;
}
.bt:hover { box-shadow:var(--shadow-md); }
.bt.wide { grid-column:span 2; }
@media(max-width:400px) { .bt.wide { grid-column:span 1; } }
.bt.tall { grid-row:span 2; }
.bt-chip {
  display:inline-flex; align-items:center; gap:5px;
  font-family:var(--sans); font-size:10px; font-weight:500;
  letter-spacing:0.08em; text-transform:uppercase; color:var(--muted);
  margin-bottom:10px;
}
.bt-chip-dot { width:6px; height:6px; border-radius:50%; flex-shrink:0; }
.bt-chip-dot.blue   { background:var(--blue); }
.bt-chip-dot.red    { background:var(--red); }
.bt-chip-dot.green  { background:var(--green); }
.bt-chip-dot.yellow { background:var(--yellow); }
.bt-title { font-family:var(--sans); font-size:14px; font-weight:500; color:var(--fg); line-height:1.3; margin-bottom:7px; }
.bt-body  { font-family:var(--body); font-size:13px; color:var(--muted); line-height:1.6; }
.bt-body b { color:var(--fg); font-weight:500; }
.bt-stats { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.bt-stat { background:var(--surface-alt); border-radius:8px; padding:12px; }
.bt-stat-n { font-family:var(--sans); font-size:22px; font-weight:500; color:var(--fg); letter-spacing:-0.5px; line-height:1; }
.bt-stat-l { font-family:var(--body); font-size:11px; color:var(--muted); margin-top:3px; }
.bt-bar { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
.bt-bar-lbl { font-family:var(--body); font-size:11px; color:var(--muted); min-width:62px; flex-shrink:0; }
.bt-bar-track { flex:1; height:6px; background:var(--border); border-radius:3px; overflow:hidden; }
.bt-bar-fill { height:100%; border-radius:3px; transition:width .6s cubic-bezier(.23,1,.32,1); }
.bt-bar-fill.blue   { background:var(--blue); }
.bt-bar-fill.green  { background:var(--green); }
.bt-bar-fill.yellow { background:var(--yellow); }
.bt-bar-fill.red    { background:var(--red); }
.bt-bar-val { font-family:var(--mono); font-size:11px; color:var(--muted); min-width:30px; text-align:right; }
.bt-tl { display:flex; gap:10px; margin-bottom:10px; align-items:flex-start; }
.bt-tl:last-child { margin-bottom:0; }
.bt-tl-side { display:flex; flex-direction:column; align-items:center; flex-shrink:0; }
.bt-tl-year { font-family:var(--mono); font-size:10px; color:var(--muted); min-width:30px; text-align:center; margin-bottom:4px; }
.bt-tl-line-dot { width:8px; height:8px; border-radius:50%; border:2px solid var(--blue); background:var(--surface); flex-shrink:0; }
.bt-tl-connector { width:2px; flex:1; background:var(--border); min-height:16px; }
.bt-tl-text { font-family:var(--body); font-size:12px; color:var(--muted); line-height:1.5; padding-top:1px; }
.bt-tl-text b { color:var(--fg); font-weight:500; }
.bt-pill {
  display:inline-block; font-family:var(--body); font-size:12px;
  color:var(--blue); border:1px solid var(--border); border-radius:9999px;
  padding:5px 12px; margin:3px 3px 0 0; min-height:32px;
  transition:background .12s,border-color .12s;
}
.bt-pill:hover { background:var(--surface-alt); border-color:var(--blue); }
.bt-entity-head { display:flex; gap:12px; align-items:flex-start; margin-bottom:12px; }
.bt-entity-avatar {
  width:48px; height:48px; border-radius:8px;
  background:linear-gradient(135deg,var(--blue),var(--green));
  display:flex; align-items:center; justify-content:center;
  font-family:var(--sans); font-size:14px; font-weight:700; color:#fff; flex-shrink:0;
}
.bt-entity-name { font-family:var(--sans); font-size:15px; font-weight:500; color:var(--fg); }
.bt-entity-sub { font-family:var(--body); font-size:12px; color:var(--muted); margin-top:2px; }
.bt-kv { display:flex; justify-content:space-between; align-items:baseline; padding:5px 0; border-bottom:1px solid var(--border); }
.bt-kv:last-child { border-bottom:none; }
.bt-kv-k { font-family:var(--body); font-size:12px; color:var(--muted); }
.bt-kv-v { font-family:var(--body); font-size:12px; color:var(--fg); font-weight:500; }
.bt-ask-wrap { position:relative; margin-top:10px; }
.bt-ask-input {
  width:100%; background:var(--surface-alt); border:1px solid var(--border);
  border-radius:9999px; padding:10px 40px 10px 16px;
  font-family:var(--body); font-size:13px; color:var(--fg); outline:none;
  min-height:44px; -webkit-appearance:none;
  transition:border-color .15s,box-shadow .15s;
}
.bt-ask-input:focus { border-color:var(--blue); box-shadow:0 0 0 2px rgba(26,115,232,.12); }
.bt-ask-input::placeholder { color:var(--muted); }
.bt-ask-send {
  position:absolute; right:10px; top:50%; transform:translateY(-50%);
  background:none; border:none; color:var(--blue); font-size:16px;
  min-width:36px; min-height:36px; display:flex; align-items:center; justify-content:center;
}
.bt-suggestion {
  display:flex; align-items:center; gap:10px; padding:9px 4px;
  border-bottom:1px solid var(--border); min-height:44px;
  transition:background .1s; border-radius:0;
}
.bt-suggestion:last-child { border-bottom:none; }
.bt-suggestion:hover { background:var(--surface-alt); border-radius:4px; }
.bt-sug-icon { font-size:14px; color:var(--muted); flex-shrink:0; }
.bt-sug-text { font-family:var(--body); font-size:13px; color:var(--fg); }
.bt-src { display:flex; align-items:center; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--border); }
.bt-src:last-child { border-bottom:none; }
.bt-src-name { font-family:var(--body); font-size:12px; color:var(--fg); }
.bt-src-url  { font-family:var(--mono); font-size:10px; color:var(--muted); }
.bt-src-stars { display:flex; gap:2px; }
.bt-star { font-size:12px; color:var(--yellow); }
.bt-star.empty { color:var(--border); }

/* ══════════════════════════════════════════
   MOBILE BOTTOM SHEET (AI HYBRID SURFACE)
   Hidden on desktop ≥960px
══════════════════════════════════════════ */
#ai-bottom-sheet {
  display:none; /* shown on mobile */
  position:absolute; bottom:0; left:0; right:0;
  background:var(--surface);
  border-top-left-radius:20px; border-top-right-radius:20px;
  box-shadow:0 -4px 32px rgba(0,0,0,.14);
  z-index:300;
  transform:translateY(calc(100% - var(--sheet-peek)));
  transition:transform 0.35s cubic-bezier(0.32,0.72,0,1);
  will-change:transform;
  /* max height so it doesn't cover the whole screen */
  max-height:calc(100% - 56px);
  display:flex; flex-direction:column;
  /* Initially hidden properly */
}
@media(max-width:959px) {

<script>
/* ──────────────── CURSOR (desktop only) ──────────────── */
const cursorCanvas=document.getElementById('cursor-canvas');
const cCtx=cursorCanvas.getContext('2d');
let CW=cursorCanvas.width=window.innerWidth,CH=cursorCanvas.height=window.innerHeight;
let mx=CW/2,my=CH/2,bX=CW/2,bY=CH/2,eX=CW/2,eY=CH/2,eVX=0,eVY=0;
const isTouchDevice = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
if(!isTouchDevice){
  document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;});
  document.addEventListener('mouseleave',()=>{mx=-300;my=-300;});
  window.addEventListener('resize',()=>{CW=cursorCanvas.width=window.innerWidth;CH=cursorCanvas.height=window.innerHeight;});
  function cursorLoop(){
    requestAnimationFrame(cursorLoop);
    bX+=(mx-bX)*0.11;bY+=(my-bY)*0.11;
    eVX=(mx-eX)*0.10;eVY=(my-eY)*0.10;
    eX+=(eVX*=0.68);eY+=(eVY*=0.68);
    const isDark=document.body.classList.contains('dark');
    const rgb=isDark?'232,228,220':'10,10,10';
    cCtx.clearRect(0,0,CW,CH);
    const grad=cCtx.createRadialGradient(bX,bY,0,bX,bY,90);
    grad.addColorStop(0,`rgba(${rgb},${isDark?0.04:0.01})`);
    grad.addColorStop(1,`rgba(${rgb},0)`);
    cCtx.fillStyle=grad;
    cCtx.beginPath();cCtx.arc(bX,bY,90,0,Math.PI*2);cCtx.fill();
    cCtx.fillStyle=`rgba(${rgb},0.35)`;
    cCtx.beginPath();cCtx.arc(eX,eY,3.5,0,Math.PI*2);cCtx.fill();
    cCtx.fillStyle=`rgb(${rgb})`;
    cCtx.beginPath();cCtx.arc(mx,my,1.2,0,Math.PI*2);cCtx.fill();
  }
  cursorLoop();
}

/* ──────────────── PARTICLE SYSTEM (desktop only) ──────────────── */
const TETHER_K=0.018,DAMP=0.72,REPEL_R=60,REPEL_F=14;
const FLOAT_SPD=0.011,FLOAT_AX=2.8,FLOAT_AY=1.6;
class HeadlineParticleSystem{
  constructor(el,text,fontSize){
    this.el=el;this.text=text;this.fontSize=fontSize||20;
    this.canvas=document.createElement('canvas');
    this.canvas.style.cssText='position:absolute;inset:0;pointer-events:none;';
    this.ctx=this.canvas.getContext('2d');
    this.particles=[];this.floatT=Math.random()*Math.PI*2;
    this.active=false;this.raf=null;
    el.style.position='relative';
    el.appendChild(this.canvas);
  }
  build(){
    const rect=this.el.getBoundingClientRect();
    const dpr=window.devicePixelRatio||1;
    this.canvas.width=rect.width*dpr;this.canvas.height=rect.height*dpr;
    this.canvas.style.width=rect.width+'px';this.canvas.style.height=rect.height+'px';
    this.ctx.scale(dpr,dpr);
    this.W=rect.width;this.H=rect.height;this.rect=rect;
    const font=`400 ${this.fontSize}px 'Google Sans', sans-serif`;
    this.ctx.font=font;
    this.particles=[];
    const words=this.text.split(' ');
    let lines=[],line='';
    for(const w of words){
      const test=line?line+' '+w:w;
      if(this.ctx.measureText(test).width>this.W&&line){lines.push(line);line=w;}else line=test;
    }
    if(line)lines.push(line);
    const lh=this.fontSize*1.3;
    lines.forEach((l,li)=>{
      const y=li*lh+this.fontSize;let cx=0;
      for(const ch of l){
        const cw=this.ctx.measureText(ch).width;
        this.particles.push({ch,restX:cx,restY:y,x:cx+(Math.random()-.5)*6,y:y+(Math.random()-.5)*6,vx:0,vy:0,font,op:0.9+Math.random()*.1});
        cx+=cw;
      }
    });
  }
  start(){
    this.active=true;this.build();this.canvas.style.opacity='1';
    this.el.classList.add('particles-active');
    if(this.raf)cancelAnimationFrame(this.raf);
    this._loop();
  }
  stop(){
    this.active=false;this.canvas.style.opacity='0';
    this.el.classList.remove('particles-active');
    if(this.raf)cancelAnimationFrame(this.raf);
    this.raf=null;
    this.ctx.clearRect(0,0,this.canvas.width,this.canvas.height);
  }
  _loop(){if(!this.active)return;this.raf=requestAnimationFrame(()=>this._loop());this._draw();}
  _draw(){
    const ctx=this.ctx;
    ctx.clearRect(0,0,this.W,this.H);
    const isDark=document.body.classList.contains('dark');
    const rgb=isDark?'138,180,248':'26,115,232';
    const rect=this.rect||this.el.getBoundingClientRect();
    const lx=mx-rect.left,ly=my-rect.top;
    this.floatT+=FLOAT_SPD;
    const fdx=Math.sin(this.floatT)*FLOAT_AX+Math.sin(this.floatT*1.7+.9)*FLOAT_AX*.3;
    const fdy=Math.sin(this.floatT*.8+1.2)*FLOAT_AY+Math.sin(this.floatT*1.3+2.1)*FLOAT_AY*.3;
    for(const p of this.particles){
      const fbX=p.restX+fdx,fbY=p.restY+fdy;
      p.vx+=(fbX-p.x)*TETHER_K;p.vy+=(fbY-p.y)*TETHER_K;
      const dx=p.x-lx,dy=p.y-ly,d=Math.sqrt(dx*dx+dy*dy);
      if(d<REPEL_R&&d>.5){const f=(1-d/REPEL_R);p.vx+=(dx/d)*f*f*REPEL_F;p.vy+=(dy/d)*f*f*REPEL_F;}
      p.vx*=DAMP;p.vy*=DAMP;p.x+=p.vx;p.y+=p.vy;
      const alpha=p.op*Math.min(1,Math.max(0,(d-12)/36));
      if(alpha>.01){ctx.font=p.font;ctx.textBaseline='alphabetic';ctx.fillStyle=`rgba(${rgb},${alpha.toFixed(3)})`;ctx.fillText(p.ch,p.x,p.y);}
    }
  }
}

/* ──────────────── BOTTOM SHEET LOGIC ──────────────── */
const sheet=document.getElementById('ai-bottom-sheet');
const scrim=document.getElementById('sheet-scrim');
let sheetOpen=false;

function openSheet(){
  sheetOpen=true;
  sheet.classList.add('sheet-open');
  scrim.style.display='block';
  setTimeout(()=>scrim.classList.add('visible'),10);
  document.getElementById('sheet-peek-bar').querySelector('.sheet-ai-sublabel').textContent='Tap to close';
}
function closeSheet(){
  sheetOpen=false;
  sheet.classList.remove('sheet-open');
  scrim.classList.remove('visible');
  setTimeout(()=>{ scrim.style.display='none'; },300);
  document.getElementById('sheet-peek-bar').querySelector('.sheet-ai-sublabel').textContent='Tap to expand';
}
function toggleSheet(){ sheetOpen ? closeSheet() : openSheet(); }

/* Touch drag on handle */
let dragStartY=0,dragStartTransform=0;
const handleArea=document.getElementById('sheet-handle-area');
handleArea.addEventListener('touchstart',e=>{
  dragStartY=e.touches[0].clientY;
}, {passive:true});
handleArea.addEventListener('touchmove',e=>{
  const dy=e.touches[0].clientY-dragStartY;
  const peekH=72; // --sheet-peek
  if(sheetOpen && dy>0){
    const pct=Math.min(dy,200);
    sheet.style.transition='none';
    sheet.style.transform=`translateY(${pct}px)`;
    scrim.style.opacity=Math.max(0,0.3-pct/600);
  }
  if(!sheetOpen && dy<0){
    const pct=Math.max(dy,-200);
    sheet.style.transition='none';
    sheet.style.transform=`translateY(calc(100% - ${peekH}px + ${pct}px))`;
  }
}, {passive:true});
handleArea.addEventListener('touchend',e=>{
  const dy=e.changedTouches[0].clientY-dragStartY;
  sheet.style.transition='';
  sheet.style.transform='';
  if(sheetOpen && dy>60) closeSheet();
  else if(!sheetOpen && dy<-60) openSheet();
  else if(sheetOpen) { sheet.style.transform=''; scrim.style.opacity=''; }
  else closeSheet(), openSheet(); // snap back
  scrim.style.opacity='';
}, {passive:true});

/* ──────────────── BUILD RESULTS ──────────────── */
function buildResults(){
  const list=document.getElementById('results-list');
  list.innerHTML='';
  RESULTS.forEach(r=>{
    const div=document.createElement('div');
    div.className='sri';
    let extra='';
    if(r.sitelinks) extra+=`<div class="sri-sitelinks">${r.sitelinks.map(s=>`<a class="sitelink" href="#">${s}</a>`).join('')}</div>`;
    if(r.chips&&r.chips.length) extra+=`<div class="sri-actions">${r.chips.map(c=>`<span class="sri-action-chip">${c}</span>`).join('')}</div>`;
    div.innerHTML=`
      <div class="sri-site-row">
        <div class="sri-favicon">${r.fav}</div>
        <span class="sri-domain">${r.domain}</span>
        <span class="sri-crumb">${r.crumb}</span>
      </div>
      <div class="sri-title-wrap">
        <a class="sri-title" href="#">${r.title}</a>
      </div>
      ${r.date?`<div class="sri-date">${r.date} — </div>`:''}
      <div class="sri-snippet">${r.snippet}</div>
      ${extra}
    `;
    /* Particle system — desktop hover only */
    if(!isTouchDevice){
      const wrap=div.querySelector('.sri-title-wrap');
      const sys=new HeadlineParticleSystem(wrap,r.title,20);
      wrap.addEventListener('mouseenter',()=>{
        if(activePS&&activePS!==sys)activePS.stop();
        activePS=sys;sys.start();
      });
      wrap.addEventListener('mouseleave',()=>{
        sys.stop();if(activePS===sys)activePS=null;
      });
    }
    list.appendChild(div);
  });

  /* Pagination */
  const pages=document.getElementById('results-pages');
  pages.innerHTML='';
  const prev=document.createElement('button');prev.className='pword';prev.textContent='← Prev';pages.appendChild(prev);
  [1,2,3,4,5,'...',9,10].forEach(n=>{
    const b=document.createElement('button');
    b.className='pnum'+(n===1?' on':'');b.textContent=n;
    b.addEventListener('click',function(){document.querySelectorAll('.pnum').forEach(x=>x.classList.remove('on'));this.classList.add('on');});
    pages.appendChild(b);
  });
  const next=document.createElement('button');next.className='pword';next.textContent='Next →';pages.appendChild(next);
}

/* ──────────────── BUILD BENTO ──────────────── */
function buildBento(){
  ['bento-desktop','bento-sheet'].forEach(id=>{
    const b=document.getElementById(id);b.innerHTML='';
    BENTO.forEach(tile=>{
      const d=document.createElement('div');d.className=tile.cls;
      d.innerHTML=`<div class="bt-chip"><span class="bt-chip-dot ${tile.chipColor}"></span>${tile.chip}</div>${tile.html}`;
      b.appendChild(d);
    });
  });
}

/* ──────────────── NAV ──────────────── */
function doSearch(){
  const q=document.getElementById('home-input').value.trim()||
          document.getElementById('results-input').value.trim()||
          'history of the internet';
  document.getElementById('home-input').value=q;
  document.getElementById('results-input').value=q;
  document.getElementById('results-count').textContent=`About 2,340,000,000 results (0.42 seconds)`;
  if(activePS){activePS.stop();activePS=null;}
  document.getElementById('page-home').style.display='none';
  document.getElementById('page-results').style.display='flex';
  buildResults();
  buildBento();
  document.querySelectorAll('.rtab').forEach((t,i)=>t.classList.toggle('on',i===0));
  /* On mobile, sheet starts in peek state (don't auto-open) */
  closeSheet();
}

function goHome(){
  document.getElementById('page-home').style.display='flex';
  document.getElementById('page-results').style.display='none';
  document.getElementById('home-input').value='';
  if(activePS){activePS.stop();activePS=null;}
  closeSheet();
}

function toggleTheme(){
  document.body.classList.toggle('dark');
  const d=document.body.classList.contains('dark');
  document.getElementById('btn-theme-home').textContent=d?'Light':'Dark';
  document.getElementById('btn-theme-results').textContent=d?'Light':'Dark';
  if(activePS){activePS.stop();activePS=null;}
}

/* Keyboard enter on home input */
document.getElementById('home-input').addEventListener('keydown',e=>{if(e.key==='Enter')doSearch();});

/* Tabs */
document.querySelectorAll('.rtab').forEach(t=>t.addEventListener('click',function(){
  document.querySelectorAll('.rtab').forEach(x=>x.classList.remove('on'));
  this.classList.add('on');
}));

/* Desktop AI panel hide button */
document.getElementById('ai-panel-hide-btn').addEventListener('click',function(){
  const panel=document.getElementById('ai-panel-desktop');
  const hidden=panel.style.display==='none';
  panel.style.display=hidden?'block':'none';
  this.textContent=hidden?'Hide':'Show AI';
});
</script>
