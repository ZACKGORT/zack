<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Google</title>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@300;400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --blue:        #1a73e8;
  --blue-hover:  #1765cc;
  --visited:     #681da8;
  --url:         #0d652d;
  --red:         #ea4335;
  --yellow:      #fbbc04;
  --green:       #34a853;
  --surface:     #ffffff;
  --surface-alt: #f8f9fa;
  --fg:          #202124;
  --muted:       #70757a;
  --border:      #dfe1e5;
  --border-focus:#4285f4;
  --shadow-sm:   0 1px 3px rgba(0,0,0,.12), 0 1px 2px rgba(0,0,0,.14);
  --shadow-md:   0 4px 6px rgba(0,0,0,.07), 0 1px 3px rgba(0,0,0,.08);
  --shadow-lg:   0 8px 24px rgba(0,0,0,.1);
  --sans:        'Google Sans', sans-serif;
  --body:        'Roboto', sans-serif;
  --mono:        'Roboto Mono', monospace;
  --top-h:       60px;
}
body.dark {
  --surface:     #202124;
  --surface-alt: #303134;
  --fg:          #e8eaed;
  --muted:       #9aa0a6;
  --border:      #3c4043;
  --url:         #5bb974;
  --visited:     #c58af9;
  --blue:        #8ab4f8;
  --blue-hover:  #aecbfa;
}
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--surface); color:var(--fg); font-family:var(--body); cursor:none; transition:background 0.2s,color 0.2s; }
#cursor-canvas { position:fixed; inset:0; pointer-events:none; z-index:9999; }
.g-logo { font-family:var(--sans); font-size:1em; font-weight:400; letter-spacing:-0.5px; user-select:none; }
.g-logo .g  { color:var(--blue); }
.g-logo .o1 { color:var(--red); }
.g-logo .o2 { color:var(--yellow); }
.g-logo .g2 { color:var(--blue); }
.g-logo .l  { color:var(--green); }
.g-logo .e  { color:var(--red); }
#page-home { display:flex; flex-direction:column; min-height:100vh; background:var(--surface); }
#page-results { display:none; flex-direction:column; min-height:100vh; }
#home-nav { display:flex; justify-content:flex-end; align-items:center; padding:14px 24px; gap:16px; }
.hnav-link { font-family:var(--body); font-size:13px; color:var(--fg); text-decoration:none; }
.hnav-link:hover { text-decoration:underline; }
.hnav-signin { font-family:var(--sans); font-size:14px; font-weight:500; color:#fff; background:var(--blue); border:none; border-radius:4px; padding:9px 23px; cursor:none; transition:background 0.15s,box-shadow 0.15s; box-shadow:var(--shadow-sm); }
.hnav-signin:hover { background:var(--blue-hover); box-shadow:var(--shadow-md); }
#home-center { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding-bottom:120px; }
#home-wordmark { font-family:var(--sans); font-size:92px; font-weight:400; letter-spacing:-2px; margin-bottom:28px; user-select:none; }
#home-search-row { width:560px; max-width:92vw; position:relative; margin-bottom:22px; }
#home-input { width:100%; background:var(--surface); border:1px solid var(--border); border-radius:9999px; padding:13px 50px 13px 52px; font-family:var(--body); font-size:16px; color:var(--fg); outline:none; box-shadow:var(--shadow-sm); transition:box-shadow 0.15s,border-color 0.15s; }
#home-input:hover { box-shadow:var(--shadow-md); }
#home-input:focus { border-color:transparent; box-shadow:0 4px 12px rgba(0,0,0,.15); }
#home-input::placeholder { color:var(--muted); }
.home-input-icon { position:absolute; left:18px; top:50%; transform:translateY(-50%); color:var(--muted); font-size:20px; pointer-events:none; }
.home-input-actions { position:absolute; right:14px; top:50%; transform:translateY(-50%); display:flex; gap:8px; align-items:center; }
.home-mic-btn,.home-lens-btn { background:none; border:none; cursor:none; color:var(--muted); font-size:20px; padding:2px; transition:color 0.15s; }
.home-mic-btn:hover,.home-lens-btn:hover { color:var(--fg); }
#home-btns { display:flex; gap:12px; }
.hbtn { font-family:var(--body); font-size:14px; color:var(--fg); background:var(--surface-alt); border:1px solid var(--surface-alt); border-radius:4px; padding:10px 20px; cursor:none; transition:border-color 0.15s,box-shadow 0.15s; }
.hbtn:hover { border-color:var(--border); box-shadow:var(--shadow-sm); }
#home-language { margin-top:26px; font-size:13px; color:var(--muted); }
#home-language a { color:var(--blue); text-decoration:none; }
#home-language a:hover { text-decoration:underline; }
#home-footer { border-top:1px solid var(--border); background:var(--surface-alt); display:flex; justify-content:space-between; padding:14px 24px; }
.hfooter-group { display:flex; gap:20px; }
.hfooter-link { font-size:13px; color:var(--muted); text-decoration:none; transition:color 0.15s; }
.hfooter-link:hover { color:var(--fg); text-decoration:underline; }
#results-topbar { position:sticky; top:0; z-index:200; background:var(--surface); border-bottom:1px solid var(--border); }
#results-row1 { display:flex; align-items:center; gap:20px; padding:8px 24px; }
#results-wordmark { font-family:var(--sans); font-size:28px; font-weight:400; letter-spacing:-1px; cursor:none; user-select:none; flex-shrink:0; }
#results-search-wrap { flex:1; max-width:620px; position:relative; }
#results-input { width:100%; background:var(--surface); border:1px solid var(--border); border-radius:9999px; padding:9px 48px 9px 20px; font-family:var(--body); font-size:15px; color:var(--fg); outline:none; transition:border-color 0.15s,box-shadow 0.15s; }
#results-input:hover { border-color:var(--muted); }
#results-input:focus { border-color:transparent; box-shadow:0 2px 10px rgba(0,0,0,.15); }
.results-input-icon { position:absolute; right:14px; top:50%; transform:translateY(-50%); color:var(--blue); font-size:20px; cursor:none; background:none; border:none; transition:color 0.15s; }
.rtopbar-actions { margin-left:auto; display:flex; gap:10px; align-items:center; flex-shrink:0; }
.rtop-btn { font-family:var(--body); font-size:13px; color:var(--muted); background:none; border:1px solid var(--border); border-radius:4px; padding:5px 12px; cursor:none; transition:color 0.15s,border-color 0.15s; }
.rtop-btn:hover { color:var(--fg); border-color:var(--muted); }
.rtop-btn.primary { color:#fff; background:var(--blue); border-color:var(--blue); }
.rtop-btn.primary:hover { background:var(--blue-hover); border-color:var(--blue-hover); }
#results-tabs-row { display:flex; padding:0 0 0 162px; overflow-x:auto; scrollbar-width:none; }
#results-tabs-row::-webkit-scrollbar { display:none; }
.rtab { font-family:var(--body); font-size:13px; color:var(--muted); background:none; border:none; border-bottom:3px solid transparent; padding:10px 16px; cursor:none; white-space:nowrap; display:flex; align-items:center; gap:6px; transition:color 0.15s; font-weight:400; }
.rtab:hover { color:var(--fg); }
.rtab.on { color:var(--blue); border-bottom-color:var(--blue); font-weight:500; }
.rtab-icon { font-size:15px; opacity:0.7; }
#results-body { display:flex; max-width:1400px; }
#results-main { flex:0 0 auto; width:660px; padding:20px 0 60px 162px; min-width:0; }
#results-count { font-family:var(--body); font-size:13px; color:var(--muted); margin-bottom:18px; }
.sri { margin-bottom:30px; max-width:470px; position:relative; }
.sri-site-row { display:flex; align-items:center; gap:8px; margin-bottom:4px; }
.sri-favicon { width:18px; height:18px; border-radius:50%; background:var(--surface-alt); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-family:var(--sans); font-size:8px; font-weight:700; color:var(--muted); flex-shrink:0; overflow:hidden; }
.sri-domain { font-family:var(--body); font-size:14px; color:var(--fg); }
.sri-crumb { font-family:var(--body); font-size:14px; color:var(--muted); }

/* THE FIX: title-wrap is the particle container; the anchor text
   transitions to transparent on hover so only the canvas renders */
.sri-title-wrap { position:relative; cursor:none; margin-bottom:3px; }
.sri-title {
  font-family:var(--sans); font-size:20px; font-weight:400; line-height:1.3;
  color:var(--blue); text-decoration:none; display:inline;
  transition:color 0.08s;
}
.sri-title-wrap.particles-active .sri-title { color:transparent !important; text-decoration:none; }
.sri-title:visited { color:var(--visited); }

.sri-snippet { font-family:var(--body); font-size:14px; line-height:1.58; color:var(--muted); }
.sri-snippet b { color:var(--fg); font-weight:500; }
.sri-date { font-family:var(--body); font-size:13px; color:var(--muted); }
.sri-sitelinks { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
.sitelink { font-family:var(--body); font-size:13px; color:var(--blue); border:1px solid var(--border); border-radius:4px; padding:4px 12px; text-decoration:none; cursor:none; transition:background 0.12s,border-color 0.12s; }
.sitelink:hover { background:var(--surface-alt); border-color:var(--muted); text-decoration:underline; }
.sri-actions { display:flex; gap:8px; margin-top:8px; }
.sri-action-chip { font-family:var(--body); font-size:12px; color:var(--muted); border:1px solid var(--border); border-radius:9999px; padding:3px 10px; cursor:none; transition:background 0.12s; }
.sri-action-chip:hover { background:var(--surface-alt); color:var(--fg); }
#results-pages { display:flex; align-items:center; gap:4px; padding:20px 0 0 0; }
.pword { font-family:var(--sans); font-size:14px; color:var(--blue); cursor:none; padding:8px 16px; border-radius:4px; transition:background 0.12s; background:none; border:none; font-weight:500; }
.pword:hover { background:var(--surface-alt); }
.pnum { font-family:var(--sans); font-size:13px; min-width:34px; height:34px; display:flex; align-items:center; justify-content:center; border-radius:50%; cursor:none; color:var(--blue); background:none; border:none; transition:background 0.12s; }
.pnum:hover { background:var(--surface-alt); }
.pnum.on { background:var(--blue); color:#fff; }
#ai-panel { flex:1; min-width:0; padding:20px 32px 60px 24px; }
#ai-panel-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
#ai-panel-label { font-family:var(--sans); font-size:12px; font-weight:500; letter-spacing:0.08em; text-transform:uppercase; color:var(--muted); display:flex; align-items:center; gap:8px; }
.ai-gemini-dot { width:16px; height:16px; background:linear-gradient(135deg,var(--blue),var(--green)); border-radius:50%; flex-shrink:0; }
#ai-panel-hide { font-family:var(--body); font-size:12px; color:var(--muted); background:none; border:1px solid var(--border); border-radius:9999px; padding:3px 12px; cursor:none; transition:color 0.15s,border-color 0.15s; }
#ai-panel-hide:hover { color:var(--fg); border-color:var(--muted); }
#bento { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.bt { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px 18px; overflow:hidden; transition:box-shadow 0.15s; }
.bt:hover { box-shadow:var(--shadow-md); }
.bt.wide { grid-column:span 2; }
.bt.tall { grid-row:span 2; }
.bt-chip { display:inline-flex; align-items:center; gap:5px; font-family:var(--sans); font-size:10px; font-weight:500; letter-spacing:0.08em; text-transform:uppercase; color:var(--muted); margin-bottom:10px; }
.bt-chip-dot { width:6px; height:6px; border-radius:50%; flex-shrink:0; }
.bt-chip-dot.blue { background:var(--blue); } .bt-chip-dot.red { background:var(--red); } .bt-chip-dot.green { background:var(--green); } .bt-chip-dot.yellow { background:var(--yellow); }
.bt-title { font-family:var(--sans); font-size:14px; font-weight:500; color:var(--fg); line-height:1.3; margin-bottom:7px; }
.bt-body { font-family:var(--body); font-size:13px; color:var(--muted); line-height:1.6; }
.bt-body b { color:var(--fg); font-weight:500; }
.bt-stats { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.bt-stat { background:var(--surface-alt); border-radius:8px; padding:12px; }
.bt-stat-n { font-family:var(--sans); font-size:22px; font-weight:500; color:var(--fg); letter-spacing:-0.5px; line-height:1; }
.bt-stat-l { font-family:var(--body); font-size:11px; color:var(--muted); margin-top:3px; }
.bt-bar { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
.bt-bar-lbl { font-family:var(--body); font-size:11px; color:var(--muted); min-width:62px; flex-shrink:0; }
.bt-bar-track { flex:1; height:6px; background:var(--border); border-radius:3px; overflow:hidden; }
.bt-bar-fill { height:100%; border-radius:3px; transition:width .6s cubic-bezier(.23,1,.32,1); }
.bt-bar-fill.blue { background:var(--blue); } .bt-bar-fill.green { background:var(--green); } .bt-bar-fill.yellow { background:var(--yellow); } .bt-bar-fill.red { background:var(--red); }
.bt-bar-val { font-family:var(--mono); font-size:11px; color:var(--muted); min-width:30px; text-align:right; }
.bt-tl { display:flex; gap:10px; margin-bottom:10px; align-items:flex-start; }
.bt-tl:last-child { margin-bottom:0; }
.bt-tl-side { display:flex; flex-direction:column; align-items:center; flex-shrink:0; }
.bt-tl-year { font-family:var(--mono); font-size:10px; color:var(--muted); min-width:30px; text-align:center; margin-bottom:4px; }
.bt-tl-line-dot { width:8px; height:8px; border-radius:50%; border:2px solid var(--blue); background:#fff; flex-shrink:0; }
.bt-tl-connector { width:2px; flex:1; background:var(--border); min-height:16px; }
.bt-tl-text { font-family:var(--body); font-size:12px; color:var(--muted); line-height:1.5; padding-top:1px; }
.bt-tl-text b { color:var(--fg); font-weight:500; }
.bt-pill { display:inline-block; font-family:var(--body); font-size:12px; color:var(--blue); border:1px solid var(--border); border-radius:9999px; padding:4px 12px; margin:3px 3px 0 0; cursor:none; transition:background .12s,border-color .12s; }
.bt-pill:hover { background:var(--surface-alt); border-color:var(--blue); }
.bt-entity-head { display:flex; gap:12px; align-items:flex-start; margin-bottom:12px; }
.bt-entity-avatar { width:48px; height:48px; border-radius:8px; background:linear-gradient(135deg,var(--blue),var(--green)); display:flex; align-items:center; justify-content:center; font-family:var(--sans); font-size:14px; font-weight:700; color:#fff; flex-shrink:0; }
.bt-entity-name { font-family:var(--sans); font-size:15px; font-weight:500; color:var(--fg); }
.bt-entity-sub { font-family:var(--body); font-size:12px; color:var(--muted); margin-top:2px; }
.bt-kv { display:flex; justify-content:space-between; align-items:baseline; padding:5px 0; border-bottom:1px solid var(--border); }
.bt-kv:last-child { border-bottom:none; }
.bt-kv-k { font-family:var(--body); font-size:12px; color:var(--muted); }
.bt-kv-v { font-family:var(--body); font-size:12px; color:var(--fg); font-weight:500; }
.bt-ask-wrap { position:relative; margin-top:10px; }
.bt-ask-input { width:100%; background:var(--surface-alt); border:1px solid var(--border); border-radius:9999px; padding:9px 40px 9px 16px; font-family:var(--body); font-size:13px; color:var(--fg); outline:none; transition:border-color .15s,box-shadow .15s; }
.bt-ask-input:focus { border-color:var(--blue); box-shadow:0 0 0 2px rgba(26,115,232,.12); }
.bt-ask-input::placeholder { color:var(--muted); }
.bt-ask-send { position:absolute; right:10px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:none; color:var(--blue); font-size:16px; transition:color .15s; }
.bt-ask-send:hover { color:var(--blue-hover); }
.bt-suggestion { display:flex; align-items:center; gap:10px; padding:8px 4px; border-bottom:1px solid var(--border); cursor:none; transition:background .1s; border-radius:0; }
.bt-suggestion:last-child { border-bottom:none; }
.bt-suggestion:hover { background:var(--surface-alt); border-radius:4px; }
.bt-sug-icon { font-size:14px; color:var(--muted); flex-shrink:0; }
.bt-sug-text { font-family:var(--body); font-size:13px; color:var(--fg); }
.bt-src { display:flex; align-items:center; justify-content:space-between; padding:5px 0; border-bottom:1px solid var(--border); }
.bt-src:last-child { border-bottom:none; }
.bt-src-name { font-family:var(--body); font-size:12px; color:var(--fg); }
.bt-src-url { font-family:var(--mono); font-size:10px; color:var(--muted); }
.bt-src-stars { display:flex; gap:2px; }
.bt-star { font-size:12px; color:var(--yellow); }
.bt-star.empty { color:var(--border); }
@media(max-width:960px){ #ai-panel{display:none;} }
@media(max-width:680px){ #results-main{padding-left:16px;width:100%;} #results-tabs-row{padding-left:16px;} }
</style>
</head>
<body>
<canvas id="cursor-canvas"></canvas>
<div id="page-home">
  <div id="home-nav">
    <a class="hnav-link" href="#">Gmail</a>
    <a class="hnav-link" href="#">Images</a>
    <button class="rtop-btn" id="btn-theme-home" onclick="toggleTheme()">Dark</button>
    <button class="hnav-signin">Sign in</button>
  </div>
  <div id="home-center">
    <div id="home-wordmark"><span class="g-logo"><span class="g">G</span><span class="o1">o</span><span class="o2">o</span><span class="g2">g</span><span class="l">l</span><span class="e">e</span></span></div>
    <div id="home-search-row">
      <span class="home-input-icon">🔍</span>
      <input id="home-input" type="text" placeholder="Search Google or type a URL" autocomplete="off" spellcheck="false">
      <div class="home-input-actions">
        <button class="home-mic-btn">🎤</button>
        <button class="home-lens-btn">📷</button>
      </div>
    </div>
    <div id="home-btns">
      <button class="hbtn" onclick="doSearch()">Google Search</button>
      <button class="hbtn" onclick="doSearch()">I'm Feeling Lucky</button>
    </div>
    <div id="home-language">Google offered in: <a href="#">Español</a> &nbsp;<a href="#">中文</a> &nbsp;<a href="#">हिन्दी</a></div>
  </div>
  <div id="home-footer">
    <div class="hfooter-group"><a class="hfooter-link" href="#">United States</a></div>
    <div class="hfooter-group">
      <a class="hfooter-link" href="#">Advertising</a>
      <a class="hfooter-link" href="#">Business</a>
      <a class="hfooter-link" href="#">How Search works</a>
    </div>
    <div class="hfooter-group">
      <a class="hfooter-link" href="#">Privacy</a>
      <a class="hfooter-link" href="#">Terms</a>
      <a class="hfooter-link" href="#">Settings</a>
    </div>
  </div>
</div>

<div id="page-results">
  <div id="results-topbar">
    <div id="results-row1">
      <div id="results-wordmark" onclick="goHome()"><span class="g-logo"><span class="g">G</span><span class="o1">o</span><span class="o2">o</span><span class="g2">g</span><span class="l">l</span><span class="e">e</span></span></div>
      <div id="results-search-wrap">
        <input id="results-input" type="text" autocomplete="off" spellcheck="false" onkeydown="if(event.key==='Enter')doSearch()">
        <button class="results-input-icon" onclick="doSearch()">🔍</button>
      </div>
      <div class="rtopbar-actions">
        <button class="rtop-btn" id="btn-theme-results" onclick="toggleTheme()">Dark</button>
        <button class="rtop-btn" id="ai-toggle-btn" onclick="togglePanel()">Hide AI</button>
        <button class="rtop-btn primary">Sign in</button>
      </div>
    </div>
    <div id="results-tabs-row">
      <button class="rtab on"><span class="rtab-icon">🔍</span>All</button>
      <button class="rtab"><span class="rtab-icon">🖼</span>Images</button>
      <button class="rtab"><span class="rtab-icon">📰</span>News</button>
      <button class="rtab"><span class="rtab-icon">🗺</span>Maps</button>
      <button class="rtab"><span class="rtab-icon">🛒</span>Shopping</button>
      <button class="rtab"><span class="rtab-icon">🎬</span>Videos</button>
      <button class="rtab"><span class="rtab-icon">📚</span>Books</button>
      <button class="rtab" style="margin-left:auto;"><span class="rtab-icon">⚙️</span>Tools</button>
    </div>
  </div>
  <div id="results-body">
    <div id="results-main">
      <div id="results-count"></div>
      <div id="results-list"></div>
      <div id="results-pages"></div>
    </div>
    <div id="ai-panel">
      <div id="ai-panel-header">
        <span id="ai-panel-label"><span class="ai-gemini-dot"></span>AI Overview</span>
        <button id="ai-panel-hide" onclick="togglePanel()">Hide</button>
      </div>
      <div id="bento"></div>
    </div>
  </div>
</div>

<script>
// CURSOR
const cursorCanvas=document.getElementById('cursor-canvas');
const cCtx=cursorCanvas.getContext('2d');
let CW=cursorCanvas.width=window.innerWidth,CH=cursorCanvas.height=window.innerHeight;
let mx=CW/2,my=CH/2,bX=CW/2,bY=CH/2,eX=CW/2,eY=CH/2,eVX=0,eVY=0;
document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;});
document.addEventListener('mouseleave',()=>{mx=-300;my=-300;});
window.addEventListener('resize',()=>{CW=cursorCanvas.width=window.innerWidth;CH=cursorCanvas.height=window.innerHeight;});
function cursorLoop(){
  requestAnimationFrame(cursorLoop);
  bX+=(mx-bX)*0.11;bY+=(my-bY)*0.11;
  eVX=(mx-eX)*0.10;eVY=(my-eY)*0.10;
  eX+=(eVX*=0.68);eY+=(eVY*=0.68);
  const isDark=document.body.classList.contains('dark');
  const rgb=isDark?'232,228,220':'10,10,10';
  cCtx.clearRect(0,0,CW,CH);
  const grad=cCtx.createRadialGradient(bX,bY,0,bX,bY,90);
  grad.addColorStop(0,`rgba(${rgb},${isDark?0.04:0.01})`);
  grad.addColorStop(1,`rgba(${rgb},0)`);
  cCtx.fillStyle=grad;
  cCtx.beginPath();cCtx.arc(bX,bY,90,0,Math.PI*2);cCtx.fill();
  cCtx.fillStyle=`rgba(${rgb},0.35)`;
  cCtx.beginPath();cCtx.arc(eX,eY,3.5,0,Math.PI*2);cCtx.fill();
  cCtx.fillStyle=`rgb(${rgb})`;
  cCtx.beginPath();cCtx.arc(mx,my,1.2,0,Math.PI*2);cCtx.fill();
}
cursorLoop();

// PARTICLE SYSTEM
const TETHER_K=0.018,DAMP=0.72,REPEL_R=60,REPEL_F=14;
const FLOAT_SPD=0.011,FLOAT_AX=2.8,FLOAT_AY=1.6;

class HeadlineParticleSystem{
  constructor(el,text,fontSize){
    this.el=el;this.text=text;this.fontSize=fontSize||20;
    this.canvas=document.createElement('canvas');
    this.canvas.style.cssText='position:absolute;inset:0;pointer-events:none;';
    this.ctx=this.canvas.getContext('2d');
    this.particles=[];this.floatT=Math.random()*Math.PI*2;
    this.active=false;this.raf=null;
    el.style.position='relative';
    el.appendChild(this.canvas);
  }
  build(){
    const rect=this.el.getBoundingClientRect();
    const dpr=window.devicePixelRatio||1;
    this.canvas.width=rect.width*dpr;this.canvas.height=rect.height*dpr;
    this.canvas.style.width=rect.width+'px';this.canvas.style.height=rect.height+'px';
    this.ctx.scale(dpr,dpr);
    this.W=rect.width;this.H=rect.height;this.rect=rect;
    const font=`400 ${this.fontSize}px 'Google Sans', sans-serif`;
    this.ctx.font=font;
    this.particles=[];
    const words=this.text.split(' ');
    let lines=[],line='';
    for(const w of words){
      const test=line?line+' '+w:w;
      if(this.ctx.measureText(test).width>this.W&&line){lines.push(line);line=w;}else line=test;
    }
    if(line)lines.push(line);
    const lh=this.fontSize*1.3;
    lines.forEach((l,li)=>{
      const y=li*lh+this.fontSize;let cx=0;
      for(const ch of l){
        const cw=this.ctx.measureText(ch).width;
        this.particles.push({ch,restX:cx,restY:y,x:cx+(Math.random()-.5)*6,y:y+(Math.random()-.5)*6,vx:0,vy:0,font,op:0.9+Math.random()*.1});
        cx+=cw;
      }
    });
  }
  start(){
    this.active=true;this.build();this.canvas.style.opacity='1';
    // Hide underlying anchor text so only canvas renders
    this.el.classList.add('particles-active');
    if(this.raf)cancelAnimationFrame(this.raf);
    this._loop();
  }
  stop(){
    this.active=false;this.canvas.style.opacity='0';
    // Restore underlying anchor text
    this.el.classList.remove('particles-active');
    if(this.raf)cancelAnimationFrame(this.raf);
    this.raf=null;
    this.ctx.clearRect(0,0,this.canvas.width,this.canvas.height);
  }
  _loop(){if(!this.active)return;this.raf=requestAnimationFrame(()=>this._loop());this._draw();}
  _draw(){
    const ctx=this.ctx;
    ctx.clearRect(0,0,this.W,this.H);
    const isDark=document.body.classList.contains('dark');
    const rgb=isDark?'138,180,248':'26,115,232';
    const rect=this.rect||this.el.getBoundingClientRect();
    const lx=mx-rect.left,ly=my-rect.top;
    this.floatT+=FLOAT_SPD;
    const fdx=Math.sin(this.floatT)*FLOAT_AX+Math.sin(this.floatT*1.7+.9)*FLOAT_AX*.3;
    const fdy=Math.sin(this.floatT*.8+1.2)*FLOAT_AY+Math.sin(this.floatT*1.3+2.1)*FLOAT_AY*.3;
    for(const p of this.particles){
      const fbX=p.restX+fdx,fbY=p.restY+fdy;
      p.vx+=(fbX-p.x)*TETHER_K;p.vy+=(fbY-p.y)*TETHER_K;
      const dx=p.x-lx,dy=p.y-ly,d=Math.sqrt(dx*dx+dy*dy);
      if(d<REPEL_R&&d>.5){const f=(1-d/REPEL_R);p.vx+=(dx/d)*f*f*REPEL_F;p.vy+=(dy/d)*f*f*REPEL_F;}
      p.vx*=DAMP;p.vy*=DAMP;p.x+=p.vx;p.y+=p.vy;
      const alpha=p.op*Math.min(1,Math.max(0,(d-12)/36));
      if(alpha>.01){ctx.font=p.font;ctx.textBaseline='alphabetic';ctx.fillStyle=`rgba(${rgb},${alpha.toFixed(3)})`;ctx.fillText(p.ch,p.x,p.y);}
    }
  }
}

function buildResults(){
  const list=document.getElementById('results-list');
  list.innerHTML='';
  RESULTS.forEach(r=>{
    const div=document.createElement('div');
    div.className='sri';
    let extra='';
    if(r.sitelinks)extra+=`<div class="sri-sitelinks">${r.sitelinks.map(s=>`<a class="sitelink" href="#">${s}</a>`).join('')}</div>`;
    if(r.chips&&r.chips.length)extra+=`<div class="sri-actions">${r.chips.map(c=>`<span class="sri-action-chip">${c}</span>`).join('')}</div>`;
    div.innerHTML=`
      <div class="sri-site-row">
        <div class="sri-favicon">${r.fav}</div>
        <span class="sri-domain">${r.domain}</span>
        <span class="sri-crumb">${r.crumb}</span>
      </div>
      <div class="sri-title-wrap">
        <a class="sri-title" href="#">${r.title}</a>
      </div>
      ${r.date?`<div class="sri-date">${r.date} — </div>`:''}
      <div class="sri-snippet">${r.snippet}</div>
      ${extra}
    `;
    const wrap=div.querySelector('.sri-title-wrap');
    const sys=new HeadlineParticleSystem(wrap,r.title,20);
    wrap.addEventListener('mouseenter',()=>{
      if(activePS&&activePS!==sys)activePS.stop();
      activePS=sys;sys.start();
    });
    wrap.addEventListener('mouseleave',()=>{
      sys.stop();if(activePS===sys)activePS=null;
    });
    list.appendChild(div);
  });
  const pages=document.getElementById('results-pages');
  pages.innerHTML='';
  const prev=document.createElement('button');prev.className='pword';prev.textContent='← Prev';pages.appendChild(prev);
  [1,2,3,4,5,'...',9,10].forEach(n=>{
    const b=document.createElement('button');
    b.className='pnum'+(n===1?' on':'');b.textContent=n;
    b.addEventListener('click',function(){document.querySelectorAll('.pnum').forEach(x=>x.classList.remove('on'));this.classList.add('on');});
    pages.appendChild(b);
  });
  const next=document.createElement('button');next.className='pword';next.textContent='Next →';pages.appendChild(next);
}

function buildBento(){
  const b=document.getElementById('bento');b.innerHTML='';
  BENTO.forEach(tile=>{

    d.innerHTML=`<div class="bt-chip"><span class="bt-chip-dot ${tile.chipColor}"></span>${tile.chip}</div>${tile.html}`;
    b.appendChild(d);
  });
}

function doSearch(){
  const q=document.getElementById('home-input').value.trim()||document.getElementById('results-input').value.trim()||'history of the internet';
  document.getElementById('home-input').value=q;
  document.getElementById('results-input').value=q;
