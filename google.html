<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Google</title>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@300;400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --blue:        #1a73e8;
  --blue-hover:  #1765cc;
  --visited:     #681da8;
  --url:         #0d652d;
  --red:         #ea4335;
  --yellow:      #fbbc04;
  --green:       #34a853;
  --surface:     #ffffff;
  --surface-alt: #f8f9fa;
  --fg:          #202124;
  --muted:       #70757a;
  --border:      #dfe1e5;
  --border-focus:#4285f4;
  --shadow-sm:   0 1px 3px rgba(0,0,0,.12), 0 1px 2px rgba(0,0,0,.14);
  --shadow-md:   0 4px 6px rgba(0,0,0,.07), 0 1px 3px rgba(0,0,0,.08);
  --shadow-lg:   0 8px 24px rgba(0,0,0,.15);
  --sans:        'Google Sans', sans-serif;
  --body:        'Roboto', sans-serif;
  --mono:        'Roboto Mono', monospace;
  --sheet-peek:  72px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
body.dark {
  --surface:     #202124;
  --surface-alt: #303134;
  --fg:          #e8eaed;
  --muted:       #9aa0a6;
  --border:      #3c4043;
  --url:         #5bb974;
  --visited:     #c58af9;
  --blue:        #8ab4f8;
  --blue-hover:  #aecbfa;
}
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; overflow:hidden; }
body {
  background:var(--surface);
  color:var(--fg);
  font-family:var(--body);
  transition:background 0.2s,color 0.2s;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}

/* ── CUSTOM CURSOR (desktop only) ── */
@media (hover:hover) and (pointer:fine) {
  *, *::before, *::after { cursor: none !important; }
}
#cursor-canvas {
  position:fixed; inset:0; pointer-events:none; z-index:10000;
  display:none;
}
@media (hover:hover) and (pointer:fine) {
  #cursor-canvas { display:block; }
}

/* ── LOGO ── */
.g-logo { font-family:var(--sans); font-size:1em; font-weight:400; letter-spacing:-0.5px; user-select:none; }
.g-logo .g  { color:var(--blue); }
.g-logo .o1 { color:var(--red); }
.g-logo .o2 { color:var(--yellow); }
.g-logo .g2 { color:var(--blue); }
.g-logo .l  { color:var(--green); }
.g-logo .e  { color:var(--red); }

/* ── PAGE SHELL ── */
#page-home    { display:flex; flex-direction:column; height:100%; background:var(--surface); overflow:auto; }
#page-results { display:none; flex-direction:column; height:100%; position:relative; }

/* ══ HOME PAGE ══ */
#home-nav {
  display:flex; justify-content:flex-end; align-items:center;
  padding:14px 16px; gap:12px; flex-shrink:0;
}
.hnav-link { font-family:var(--body); font-size:13px; color:var(--fg); text-decoration:none; padding:6px 4px; }
.hnav-link:hover { text-decoration:underline; }
.hnav-signin {
  font-family:var(--sans); font-size:14px; font-weight:500;
  color:#fff; background:var(--blue); border:none;
  border-radius:4px; padding:9px 20px;
  transition:background 0.15s,box-shadow 0.15s;
  box-shadow:var(--shadow-sm); min-height:44px;
}
.hnav-signin:hover { background:var(--blue-hover); }
#home-center {
  flex:1; display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  padding:0 16px 80px;
}
#home-wordmark {
  font-family:var(--sans); font-size:clamp(64px,20vw,92px);
  font-weight:400; letter-spacing:-2px; margin-bottom:24px; user-select:none;
}
#home-search-row { width:100%; max-width:560px; position:relative; margin-bottom:20px; }
#home-input {
  width:100%; background:var(--surface); border:1px solid var(--border);
  border-radius:9999px; padding:14px 56px 14px 52px;
  font-family:var(--body); font-size:16px; color:var(--fg); outline:none;
  box-shadow:var(--shadow-sm); transition:box-shadow 0.15s,border-color 0.15s;
  min-height:52px; -webkit-appearance:none;
}
#home-input:hover { box-shadow:var(--shadow-md); }
#home-input:focus { border-color:transparent; box-shadow:0 4px 12px rgba(0,0,0,.15); }
#home-input::placeholder { color:var(--muted); }
.home-input-icon { position:absolute; left:18px; top:50%; transform:translateY(-50%); color:var(--muted); font-size:20px; pointer-events:none; }
.home-input-actions { position:absolute; right:12px; top:50%; transform:translateY(-50%); display:flex; gap:4px; align-items:center; }
.home-mic-btn,.home-lens-btn {
  background:none; border:none; color:var(--muted); font-size:20px;
  padding:6px; transition:color 0.15s; min-width:44px; min-height:44px;
  display:flex; align-items:center; justify-content:center;
}
.home-mic-btn:active,.home-lens-btn:active { color:var(--fg); }
#home-btns { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
.hbtn {
  font-family:var(--body); font-size:14px; color:var(--fg);
  background:var(--surface-alt); border:1px solid var(--surface-alt);
  border-radius:4px; padding:10px 20px; min-height:44px;
  transition:border-color 0.15s,box-shadow 0.15s;
}
.hbtn:hover { border-color:var(--border); box-shadow:var(--shadow-sm); }
#home-language { margin-top:24px; font-size:13px; color:var(--muted); text-align:center; }
#home-language a { color:var(--blue); text-decoration:none; }
#home-language a:hover { text-decoration:underline; }
#home-footer { border-top:1px solid var(--border); background:var(--surface-alt); padding:14px 16px; flex-shrink:0; }
.hfooter-inner { display:flex; flex-wrap:wrap; gap:8px 16px; justify-content:center; }
.hfooter-link { font-size:13px; color:var(--muted); text-decoration:none; padding:4px 0; }
.hfooter-link:hover { color:var(--fg); text-decoration:underline; }

/* ══ RESULTS TOP BAR ══ */
#results-topbar { position:sticky; top:0; z-index:200; background:var(--surface); border-bottom:1px solid var(--border); flex-shrink:0; }
#results-row1 { display:flex; align-items:center; gap:10px; padding:8px 12px; }
#results-wordmark { font-family:var(--sans); font-size:26px; font-weight:400; letter-spacing:-1px; user-select:none; flex-shrink:0; }
#results-search-wrap { flex:1; position:relative; min-width:0; }
#results-input {
  width:100%; background:var(--surface); border:1px solid var(--border);
  border-radius:9999px; padding:9px 44px 9px 16px;
  font-family:var(--body); font-size:15px; color:var(--fg); outline:none;
  transition:border-color 0.15s,box-shadow 0.15s;
  min-height:44px; -webkit-appearance:none;
}
#results-input:focus { border-color:transparent; box-shadow:0 2px 10px rgba(0,0,0,.15); }
.results-input-icon {
  position:absolute; right:12px; top:50%; transform:translateY(-50%);
  color:var(--blue); font-size:20px; background:none; border:none;
  min-width:40px; min-height:40px; display:flex; align-items:center; justify-content:center;
}
.rtopbar-actions { display:flex; gap:6px; align-items:center; flex-shrink:0; }
.rtop-btn {
  font-family:var(--body); font-size:13px; color:var(--muted);
  background:none; border:1px solid var(--border); border-radius:4px;
  padding:5px 10px; min-height:36px; transition:color 0.15s,border-color 0.15s;
}
.rtop-btn:hover { color:var(--fg); }
.rtop-btn.primary { color:#fff; background:var(--blue); border-color:var(--blue); }
.rtop-btn.primary .btn-text-full { display:inline; }
.rtop-btn.primary .btn-text-short { display:none; }
@media(max-width:480px) {
  .rtop-btn.primary .btn-text-full { display:none; }
  .rtop-btn.primary .btn-text-short { display:inline; }
  #results-wordmark { font-size:22px; }
}
#results-tabs-row { display:flex; overflow-x:auto; scrollbar-width:none; padding:0 0 0 12px; -webkit-overflow-scrolling:touch; }
#results-tabs-row::-webkit-scrollbar { display:none; }
.rtab {
  font-family:var(--body); font-size:13px; color:var(--muted);
  background:none; border:none; border-bottom:3px solid transparent;
  padding:10px 14px; white-space:nowrap; display:flex;
  align-items:center; gap:5px; transition:color 0.15s; min-height:44px;
}
.rtab:hover { color:var(--fg); }
.rtab.on { color:var(--blue); border-bottom-color:var(--blue); font-weight:500; }
.rtab-icon { font-size:14px; opacity:0.7; }

/* ══ RESULTS BODY ══ */
#results-body { flex:1; overflow:hidden; position:relative; display:flex; flex-direction:column; }
#results-inner { flex:1; overflow:hidden; display:flex; flex-direction:column; }
#results-main {
  flex:1; overflow-y:auto; padding:16px 16px 0;
  -webkit-overflow-scrolling:touch;
  padding-bottom:calc(var(--sheet-peek) + 20px + var(--safe-bottom));
}
@media(min-width:960px) {
  #results-inner { flex-direction:row; }
  #results-main { width:660px; flex-shrink:0; padding:20px 0 60px 40px; padding-bottom:60px !important; }
}
#results-count { font-family:var(--body); font-size:13px; color:var(--muted); margin-bottom:16px; }

/* Result items */
.sri { margin-bottom:28px; position:relative; }
.sri-site-row { display:flex; align-items:center; gap:8px; margin-bottom:4px; }
.sri-favicon { width:18px; height:18px; border-radius:50%; background:var(--surface-alt); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-family:var(--sans); font-size:8px; font-weight:700; color:var(--muted); flex-shrink:0; overflow:hidden; }
.sri-domain { font-family:var(--body); font-size:14px; color:var(--fg); }
.sri-crumb { font-family:var(--body); font-size:13px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sri-title-wrap { position:relative; margin-bottom:3px; }
.sri-title { font-family:var(--sans); font-size:19px; font-weight:400; line-height:1.3; color:var(--blue); text-decoration:none; display:inline; transition:color 0.08s; }
@media(max-width:600px) { .sri-title { font-size:17px; } }
/* sri-title color handled by global float system */
.sri-title-wrap[style*="transparent"] .sri-title { color: transparent !important; }
.sri-title:visited { color:var(--visited); }
.sri-snippet { font-family:var(--body); font-size:14px; line-height:1.58; color:var(--muted); }
.sri-snippet b { color:var(--fg); font-weight:500; }
/* When parent color is made transparent by the float system, force children to inherit */
.sri-snippet[style*="transparent"] b,
.bt-body[style*="transparent"] b,
.bt-tl-text[style*="transparent"] b { color: transparent !important; }
.sri-date { font-family:var(--body); font-size:13px; color:var(--muted); }
.sri-sitelinks { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
.sitelink { font-family:var(--body); font-size:13px; color:var(--blue); border:1px solid var(--border); border-radius:4px; padding:6px 12px; text-decoration:none; min-height:36px; display:flex; align-items:center; transition:background 0.12s; }
.sitelink:hover { background:var(--surface-alt); }
.sri-actions { display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
.sri-action-chip { font-family:var(--body); font-size:12px; color:var(--muted); border:1px solid var(--border); border-radius:9999px; padding:5px 12px; min-height:32px; display:flex; align-items:center; transition:background 0.12s; }
.sri-action-chip:hover { background:var(--surface-alt); color:var(--fg); }

/* Pagination */
#results-pages { display:flex; align-items:center; gap:4px; padding:20px 0 40px; }
.pword { font-family:var(--sans); font-size:14px; color:var(--blue); padding:8px 14px; border-radius:4px; background:none; border:none; font-weight:500; min-height:44px; }
.pword:hover { background:var(--surface-alt); }
.pnum { font-family:var(--sans); font-size:13px; min-width:36px; height:36px; display:flex; align-items:center; justify-content:center; border-radius:50%; color:var(--blue); background:none; border:none; }
.pnum:hover { background:var(--surface-alt); }
.pnum.on { background:var(--blue); color:#fff; }

/* ══ DESKTOP AI PANEL ══ */
#ai-panel-desktop { display:none; flex:1; min-width:0; padding:28px 32px 60px 24px; overflow-y:auto; }
@media(min-width:960px) { #ai-panel-desktop { display:block; } }
#ai-panel-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; }
#ai-panel-label { font-family:var(--sans); font-size:12px; font-weight:500; letter-spacing:0.08em; text-transform:uppercase; color:var(--muted); display:flex; align-items:center; gap:8px; }
.ai-gemini-dot { width:16px; height:16px; background:linear-gradient(135deg,var(--blue),var(--green)); border-radius:50%; flex-shrink:0; animation:geminiPulse 3s ease-in-out infinite; }
@keyframes geminiPulse { 0%,100%{opacity:1;transform:scale(1);} 50%{opacity:0.7;transform:scale(0.9);} }
#ai-panel-hide-btn { font-family:var(--body); font-size:12px; color:var(--muted); background:none; border:1px solid var(--border); border-radius:9999px; padding:3px 12px; }
#ai-panel-hide-btn:hover { color:var(--fg); border-color:var(--muted); }
#bento-desktop { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:20px; }
#bento-sheet   { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
@media(max-width:400px) { #bento-sheet { grid-template-columns:1fr; } }

/* Bento tiles */
.bt { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:20px 18px; overflow:hidden; transition:box-shadow 0.15s; }
.bt:hover { box-shadow:var(--shadow-md); }
.bt.wide { grid-column:span 2; }
@media(max-width:400px) { .bt.wide { grid-column:span 1; } }
.bt.tall { grid-row:span 2; }
.bt-chip { display:inline-flex; align-items:center; gap:5px; font-family:var(--sans); font-size:10px; font-weight:500; letter-spacing:0.08em; text-transform:uppercase; color:var(--muted); margin-bottom:10px; }
.bt-chip-dot { width:6px; height:6px; border-radius:50%; flex-shrink:0; }
.bt-chip-dot.blue{background:var(--blue);} .bt-chip-dot.red{background:var(--red);} .bt-chip-dot.green{background:var(--green);} .bt-chip-dot.yellow{background:var(--yellow);}
.bt-title { font-family:var(--sans); font-size:14px; font-weight:500; color:var(--fg); line-height:1.3; margin-bottom:7px; }
.bt-body { font-family:var(--body); font-size:13px; color:var(--muted); line-height:1.6; }
.bt-body b { color:var(--fg); font-weight:500; }
.bt-body[style*="transparent"] b { color: transparent !important; }
.bt-stats { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.bt-stat { background:var(--surface-alt); border-radius:8px; padding:12px; }
.bt-stat-n { font-family:var(--sans); font-size:22px; font-weight:500; color:var(--fg); letter-spacing:-0.5px; line-height:1; }
.bt-stat-l { font-family:var(--body); font-size:11px; color:var(--muted); margin-top:3px; }
.bt-bar { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
.bt-bar-lbl { font-family:var(--body); font-size:11px; color:var(--muted); min-width:62px; flex-shrink:0; }
.bt-bar-track { flex:1; height:6px; background:var(--border); border-radius:3px; overflow:hidden; }
.bt-bar-fill { height:100%; border-radius:3px; transition:width .6s cubic-bezier(.23,1,.32,1); }
.bt-bar-fill.blue{background:var(--blue);} .bt-bar-fill.green{background:var(--green);} .bt-bar-fill.yellow{background:var(--yellow);} .bt-bar-fill.red{background:var(--red);}
.bt-bar-val { font-family:var(--mono); font-size:11px; color:var(--muted); min-width:30px; text-align:right; }
.bt-tl { display:flex; gap:10px; margin-bottom:10px; align-items:flex-start; }
.bt-tl:last-child { margin-bottom:0; }
.bt-tl-side { display:flex; flex-direction:column; align-items:center; flex-shrink:0; }
.bt-tl-year { font-family:var(--mono); font-size:10px; color:var(--muted); min-width:30px; text-align:center; margin-bottom:4px; }
.bt-tl-line-dot { width:8px; height:8px; border-radius:50%; border:2px solid var(--blue); background:var(--surface); flex-shrink:0; }
.bt-tl-connector { width:2px; flex:1; background:var(--border); min-height:16px; }
.bt-tl-text { font-family:var(--body); font-size:12px; color:var(--muted); line-height:1.5; padding-top:1px; }
.bt-tl-text b { color:var(--fg); font-weight:500; }
.bt-tl-text[style*="transparent"] b { color: transparent !important; }
.bt-pill { display:inline-block; font-family:var(--body); font-size:12px; color:var(--blue); border:1px solid var(--border); border-radius:9999px; padding:5px 12px; margin:3px 3px 0 0; min-height:32px; transition:background .12s,border-color .12s; }
.bt-pill:hover { background:var(--surface-alt); border-color:var(--blue); }
.bt-entity-head { display:flex; gap:12px; align-items:flex-start; margin-bottom:12px; }
.bt-entity-avatar { width:48px; height:48px; border-radius:8px; background:linear-gradient(135deg,var(--blue),var(--green)); display:flex; align-items:center; justify-content:center; font-family:var(--sans); font-size:14px; font-weight:700; color:#fff; flex-shrink:0; }
.bt-entity-name { font-family:var(--sans); font-size:15px; font-weight:500; color:var(--fg); }
.bt-entity-sub { font-family:var(--body); font-size:12px; color:var(--muted); margin-top:2px; }
.bt-kv { display:flex; justify-content:space-between; align-items:baseline; padding:5px 0; border-bottom:1px solid var(--border); }
.bt-kv:last-child { border-bottom:none; }
.bt-kv-k { font-family:var(--body); font-size:12px; color:var(--muted); }
.bt-kv-v { font-family:var(--body); font-size:12px; color:var(--fg); font-weight:500; }
.bt-ask-wrap { position:relative; margin-top:10px; }
.bt-ask-input { width:100%; background:var(--surface-alt); border:1px solid var(--border); border-radius:9999px; padding:10px 40px 10px 16px; font-family:var(--body); font-size:13px; color:var(--fg); outline:none; min-height:44px; -webkit-appearance:none; transition:border-color .15s,box-shadow .15s; }
.bt-ask-input:focus { border-color:var(--blue); box-shadow:0 0 0 2px rgba(26,115,232,.12); }
.bt-ask-input::placeholder { color:var(--muted); }
.bt-ask-send { position:absolute; right:10px; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--blue); font-size:16px; min-width:36px; min-height:36px; display:flex; align-items:center; justify-content:center; }
.bt-suggestion { display:flex; align-items:center; gap:10px; padding:9px 4px; border-bottom:1px solid var(--border); min-height:44px; transition:background .1s; }
.bt-suggestion:last-child { border-bottom:none; }
.bt-suggestion:hover { background:var(--surface-alt); border-radius:4px; }
.bt-sug-icon { font-size:14px; color:var(--muted); flex-shrink:0; }
.bt-sug-text { font-family:var(--body); font-size:13px; color:var(--fg); }
.bt-src { display:flex; align-items:center; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--border); }
.bt-src:last-child { border-bottom:none; }
.bt-src-name { font-family:var(--body); font-size:12px; color:var(--fg); }
.bt-src-url { font-family:var(--mono); font-size:10px; color:var(--muted); }
.bt-src-stars { display:flex; gap:2px; }
.bt-star { font-size:12px; color:var(--yellow); }
.bt-star.empty { color:var(--border); }

/* ══ INLINE INTENT ROW ══ */
.intent-row-inner {
  display:flex; flex-wrap:wrap; align-items:center; gap:8px;
  padding:14px 0 18px;
  padding:0 0 14px; border-bottom:1px solid var(--border); margin-bottom:14px;
}
/* desktop panel version — hidden on mobile */
#intent-row { display:none; }
@media(min-width:960px) { #intent-row { display:flex; } }
/* sheet version — hidden on desktop */
#intent-row-sheet { display:flex; }
@media(min-width:960px) { #intent-row-sheet { display:none; } }
/* same for enablement rails */
#enablement-rail { display:none; }
#enablement-rail.visible { display:none; }
@media(min-width:960px) { #enablement-rail.visible { display:flex; } }
#enablement-rail-sheet { display:none; }
#enablement-rail-sheet.visible { display:flex; }
@media(min-width:960px) { #enablement-rail-sheet.visible { display:none; } }
.ir-label {
  font-family:var(--body); font-size:12px; color:var(--muted);
  width:100%; margin-bottom:8px;
}
.ir-chip {
  display:flex; align-items:center; gap:6px;
  font-family:var(--body); font-size:13px; color:var(--fg);
  background:var(--surface-alt); border:1px solid var(--border);
  border-radius:9999px; padding:6px 14px; white-space:nowrap;
  transition:border-color 0.12s, background 0.12s;
  min-height:34px; flex-shrink:0;
}
.ir-chip:hover { border-color:var(--blue); background:rgba(26,115,232,0.05); }
.ir-chip.selected { border-color:var(--blue); background:rgba(26,115,232,0.08); color:var(--blue); font-weight:500; }
.ir-chip-icon { font-size:14px; }
.en-label {
  font-family:var(--sans); font-size:10px; font-weight:600;
  letter-spacing:0.1em; text-transform:uppercase; color:var(--muted);
  width:100%; margin-bottom:2px;
}
.en-action {
  display:flex; align-items:center; gap:7px;
  font-family:var(--body); font-size:13px; color:var(--fg);
  background:var(--surface-alt); border:1px solid var(--border);
  border-radius:9999px; padding:7px 14px; white-space:nowrap;
  transition:border-color 0.15s, background 0.15s;
  min-height:36px; flex-shrink:0;
}
.en-action:hover { border-color:var(--blue); background:rgba(26,115,232,0.05); }
.en-action-icon { font-size:14px; }

/* ══ MOBILE BOTTOM SHEET ══ */
#ai-bottom-sheet {
  display:none;
  position:absolute; bottom:0; left:0; right:0;
  background:var(--surface);
  border-top-left-radius:20px; border-top-right-radius:20px;
  box-shadow:0 -4px 32px rgba(0,0,0,.14);
  z-index:300;
  transform:translateY(calc(100% - var(--sheet-peek)));
  transition:transform 0.35s cubic-bezier(0.32,0.72,0,1);
  will-change:transform;
  max-height:calc(100% - 56px);
  flex-direction:column;
}
@media(max-width:959px) { #ai-bottom-sheet { display:flex; } }
#ai-bottom-sheet.sheet-open { transform:translateY(0); }
#sheet-handle-area { padding:10px 0 0; flex-shrink:0; display:flex; flex-direction:column; align-items:center; touch-action:none; }
#sheet-drag-handle { width:36px; height:4px; border-radius:2px; background:var(--border); margin-bottom:10px; }
#sheet-peek-bar { display:flex; align-items:center; justify-content:space-between; padding:0 16px 12px; flex-shrink:0; }
.sheet-ai-label { display:flex; align-items:center; gap:8px; font-family:var(--sans); font-size:13px; font-weight:500; color:var(--fg); }
.sheet-ai-label .ai-gemini-dot { width:14px; height:14px; }
.sheet-ai-sublabel { font-family:var(--body); font-size:12px; color:var(--muted); margin-left:auto; }
#sheet-toggle-btn { font-family:var(--sans); font-size:12px; font-weight:500; color:var(--blue); background:none; border:1px solid var(--border); border-radius:9999px; padding:5px 14px; min-height:32px; }
#sheet-toggle-btn:active { background:var(--surface-alt); }
#sheet-content { flex:1; overflow-y:auto; padding:0 14px; -webkit-overflow-scrolling:touch; padding-bottom:calc(40px + var(--safe-bottom)); }
#sheet-scrim { display:none; position:absolute; inset:0; z-index:299; background:rgba(0,0,0,0.3); opacity:0; transition:opacity 0.3s; }
#sheet-scrim.visible { opacity:1; }
.sheet-chevron { font-size:16px; color:var(--muted); transition:transform 0.3s; display:inline-block; }
#ai-bottom-sheet.sheet-open .sheet-chevron { transform:rotate(180deg); }

/* ══ CUSTOM SCROLL INDICATORS ══ */
#results-main,
#ai-panel-desktop,
#sheet-content,
#page-home { scrollbar-width: none; }
#results-main::-webkit-scrollbar,
#ai-panel-desktop::-webkit-scrollbar,
#sheet-content::-webkit-scrollbar,
#page-home::-webkit-scrollbar { display:none; }

/* Reading progress — top of viewport */
#read-progress {
  position: fixed;
  top: 0; left: 0;
  height: 2px;
  width: 0%;
  z-index: 9998;
  pointer-events: none;
  background: linear-gradient(90deg,
    var(--blue)   0%,
    var(--red)   33%,
    var(--yellow) 66%,
    var(--green) 100%);
  background-size: 200% 100%;
  transition: width 0.08s linear, opacity 0.4s;
  opacity: 0;
  border-radius: 0 1px 1px 0;
}
#read-progress.active { opacity: 1; }

/* Scroll thumb — injected per-container */
.sc-wrap {
  position: absolute;
  right: 2px; top: 0; bottom: 0;
  width: 3px;
  pointer-events: none;
  z-index: 50;
  opacity: 0;
  transition: opacity 0.5s ease;
}
.sc-wrap.sc-visible { opacity: 1; transition: opacity 0.1s ease; }
.sc-thumb {
  position: absolute;
  left: 0; right: 0;
  min-height: 28px;
  border-radius: 3px;
  will-change: top, height;
}
/* four-color Google gradient that cycles with scroll */
.sc-thumb::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 3px;
  background: linear-gradient(180deg,
    var(--blue)   0%,
    var(--red)   40%,
    var(--yellow) 70%,
    var(--green) 100%);
  opacity: 0.55;
}
body.dark .sc-thumb::before { opacity: 0.7; }

</style>

<script>
/* ── CURSOR (desktop only) ── */
const cursorCanvas=document.getElementById('cursor-canvas');
const cCtx=cursorCanvas.getContext('2d');
let CW=cursorCanvas.width=window.innerWidth,CH=cursorCanvas.height=window.innerHeight;
let mx=CW/2,my=CH/2,bX=CW/2,bY=CH/2,eX=CW/2,eY=CH/2,eVX=0,eVY=0;
const isTouchDevice=!window.matchMedia('(hover:hover) and (pointer:fine)').matches;
if(!isTouchDevice){
  document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;});
  document.addEventListener('mouseleave',()=>{mx=-300;my=-300;});
  window.addEventListener('resize',()=>{CW=cursorCanvas.width=window.innerWidth;CH=cursorCanvas.height=window.innerHeight;});
  function cursorLoop(){
    requestAnimationFrame(cursorLoop);
    bX+=(mx-bX)*0.11; bY+=(my-bY)*0.11;
    eVX=(mx-eX)*0.10; eVY=(my-eY)*0.10;
    eX+=(eVX*=0.68); eY+=(eVY*=0.68);
    const isDark=document.body.classList.contains('dark');
    const rgb=isDark?'232,228,220':'10,10,10';
    cCtx.clearRect(0,0,CW,CH);
    // soft glow
    const grad=cCtx.createRadialGradient(bX,bY,0,bX,bY,90);
    grad.addColorStop(0,`rgba(${rgb},${isDark?0.04:0.01})`);
    grad.addColorStop(1,`rgba(${rgb},0)`);
    cCtx.fillStyle=grad;
    cCtx.beginPath(); cCtx.arc(bX,bY,90,0,Math.PI*2); cCtx.fill();
    // trailing ring
    cCtx.strokeStyle=`rgba(${rgb},0.45)`;
    cCtx.lineWidth=1.5;
    cCtx.beginPath(); cCtx.arc(eX,eY,10,0,Math.PI*2); cCtx.stroke();
    // sharp dot
    cCtx.fillStyle=`rgb(${rgb})`;
    cCtx.beginPath(); cCtx.arc(mx,my,4,0,Math.PI*2); cCtx.fill();
  }
  cursorLoop();
}

/* ── GLOBAL FLOATING TEXT PARTICLES (desktop only) ── */
const TETHER_K=0.035,DAMP=0.68,REPEL_R=55,REPEL_F=10,FLOAT_SPD=0.008,FLOAT_AX=1.2,FLOAT_AY=0.7;

// ── LEAF-ONLY selectors: only target elements that don't contain other floated text children
// This avoids double-rendering parent+child (e.g. .sri-snippet AND .sri-snippet b)
const FLOAT_SELECTORS = [
  // Result list — block wrappers with correct rect
  '.sri-title-wrap',
  '.sri-domain',
  '.sri-crumb',
  '.sri-date',
  '.sri-snippet',
  'a.sitelink',
  // Nav / count
  '.hnav-link',
  '#results-count',
  // Bento tiles — leaf text nodes only
  '.bt-chip',
  '.bt-title',
  '.bt-body',
  '.bt-stat-n',
  '.bt-stat-l',
  '.bt-bar-lbl',
  '.bt-bar-val',
  '.bt-tl-year',
  '.bt-tl-text',
  '.bt-entity-name',
  '.bt-entity-sub',
  '.bt-kv-k',
  '.bt-kv-v',
  '.bt-src-name',
  '.bt-src-url',
  '.bt-sug-text',
  '.bt-pill',
  // Intent / AI panel labels
  '.ir-label',
  '.en-label',
  // Pagination
  '.pword',
  '.pnum',
  // Footer
  '.hfooter-link',
  // Home language links only (not the wrapper which has mixed text+links)
  '#home-language a',
];

function getParticleColor(el, isDark) {
  const c = el.classList;
  if (c.contains('sri-title-wrap') || c.contains('sri-title') || (el.tagName === 'A' && (c.contains('sitelink') || el.closest('#home-language'))) || c.contains('bt-pill') || c.contains('hfooter-link') || c.contains('hnav-link'))
    return isDark ? '138,180,248' : '26,115,232';
  if (c.contains('sri-snippet') || c.contains('sri-crumb') || c.contains('sri-date') || c.contains('bt-body') || c.contains('bt-tl-text') || c.contains('bt-bar-lbl') || c.contains('bt-bar-val') || c.contains('bt-src-url') || c.contains('bt-entity-sub') || c.contains('bt-kv-k') || c.contains('ir-label') || c.contains('en-label') || c.contains('bt-chip') || c.contains('pword') || c.contains('pnum'))
    return isDark ? '154,160,166' : '112,117,122';
  return isDark ? '232,234,237' : '32,33,36';
}

// Returns the tightest clip rect for a particle — nearest .sri or .bt ancestor first,
// then falls back to the scroll container. All coords are viewport-relative.
function getClipBox(el) {
  const TIGHT_CLASSES = ['sri','bt-suggestion','bt']; // clip to result item, suggestion row, or bento tile
  const SCROLL_IDS   = new Set(['results-main','ai-panel-desktop','sheet-content','page-home']);

  let tightRect  = null;
  let scrollRect = null;

  let node = el.parentElement;
  while (node && node !== document.body) {
    if (!scrollRect && SCROLL_IDS.has(node.id)) {
      const r = node.getBoundingClientRect();
      scrollRect = { x: r.left, y: r.top, w: r.width, h: r.height };
      // Once we hit the scroll container we're done walking
      break;
    }
    if (!tightRect && node.classList) {
      for (const cls of TIGHT_CLASSES) {
        if (node.classList.contains(cls)) {
          const r = node.getBoundingClientRect();
          tightRect = { x: r.left - 2, y: r.top - 2, w: r.width + 4, h: r.height + 4 };
          break;
        }
      }
    }
    node = node.parentElement;
  }

  // Prefer the tighter of the two; if both exist intersect them
  if (tightRect && scrollRect) {
    const x = Math.max(tightRect.x, scrollRect.x);
    const y = Math.max(tightRect.y, scrollRect.y);
    const x2 = Math.min(tightRect.x + tightRect.w, scrollRect.x + scrollRect.w);
    const y2 = Math.min(tightRect.y + tightRect.h, scrollRect.y + scrollRect.h);
    return { x, y, w: Math.max(0, x2 - x), h: Math.max(0, y2 - y) };
  }
  return tightRect || scrollRect || null;
}

class GlobalFloatSystem {
  constructor() {
    this.canvas = document.createElement('canvas');
    this.canvas.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:500;';
    // Insert before cursor canvas so cursor always renders on top
    const cursorEl = document.getElementById('cursor-canvas');
    document.body.insertBefore(this.canvas, cursorEl || document.body.firstChild);
    this.ctx = this.canvas.getContext('2d');
    this.dpr = window.devicePixelRatio || 1;
    // groups: array of { clip: {x,y,w,h}|null, particles: [...] }
    this.groups = [];
    this.floatT = 0;
    this.dirty = true;
    this._hiddenEls = new Set();
    this._offCtx = document.createElement('canvas').getContext('2d');

    window.addEventListener('resize', () => { this._resize(); this.dirty = true; });
    ['results-main','ai-panel-desktop','sheet-content','page-home'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.addEventListener('scroll', () => { this.dirty = true; }, { passive: true });
    });

    this._resize();
    this._loop();
  }

  _resize() {
    this.canvas.width  = window.innerWidth  * this.dpr;
    this.canvas.height = window.innerHeight * this.dpr;
    this.canvas.style.width  = window.innerWidth  + 'px';
    this.canvas.style.height = window.innerHeight + 'px';
    this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
  }

  scheduleRebuild() { this.dirty = true; }

  _getFont(el) {
    const cs = window.getComputedStyle(el);
    return {
      size:   parseFloat(cs.fontSize) || 14,
      weight: cs.fontWeight || '400',
      family: cs.fontFamily || 'Roboto, sans-serif',
      get str() { return `${this.weight} ${this.size}px ${this.family}`; }
    };
  }

  _isVisible(el) {
    const cs = getComputedStyle(el);
    if (cs.display === 'none' || cs.visibility === 'hidden' || cs.opacity === '0') return false;
    // Check ancestors too
    let node = el.parentElement;
    while (node && node !== document.body) {
      const ns = getComputedStyle(node);
      if (ns.display === 'none' || ns.visibility === 'hidden') return false;
      node = node.parentElement;
    }
    return true;
  }

  _buildParticles() {
    // Restore previously hidden elements
    this._hiddenEls.forEach(el => { el.style.color = ''; });
    this._hiddenEls.clear();
    this.groups = [];

    const isDark  = document.body.classList.contains('dark');
    const VW = window.innerWidth, VH = window.innerHeight;
    const offCtx  = this._offCtx;
    const seen    = new Set();

    // Collect unique elements in DOM order
    const allEls = [];
    FLOAT_SELECTORS.forEach(sel => {
      try { document.querySelectorAll(sel).forEach(el => { if (!seen.has(el)) { seen.add(el); allEls.push(el); } }); }
      catch(e) {}
    });

    // Group particles by clip region key so we can use canvas clipping
    const groupMap = new Map(); // clipKey -> { clip, particles }

    allEls.forEach(el => {
      if (!this._isVisible(el)) return;
      const rect = el.getBoundingClientRect();
      if (rect.width < 2 || rect.height < 2) return;
      // Must intersect viewport
      if (rect.bottom < 0 || rect.top > VH || rect.right < 0 || rect.left > VW) return;

      const text = el.textContent.trim();
      if (!text) return;

      const clipBox = getClipBox(el);

      // If element is completely outside its clip box, skip
      if (clipBox) {
        if (rect.top > clipBox.y + clipBox.h || rect.bottom < clipBox.y ||
            rect.left > clipBox.x + clipBox.w || rect.right < clipBox.x) return;
      }

      const font = this._getFont(el);
      const rgb  = getParticleColor(el, isDark);
      offCtx.font = font.str;

      // Only re-flow text for known multi-line paragraph elements.
      // Everything else renders on a SINGLE line at the measured width —
      // this prevents mismatched wrapping between canvas and DOM.
      const MULTILINE = new Set(['.sri-snippet','.bt-body','.bt-tl-text','.sri-title-wrap']);
      const isMultiline = FLOAT_SELECTORS.some(s => {
        if (!MULTILINE.has(s)) return false;
        try { return el.matches(s); } catch(e) { return false; }
      });

      // Hide DOM text
      el.style.color = 'transparent';
      this._hiddenEls.add(el);

      const maxW = rect.width;
      const lh   = font.size * 1.38;
      let lines = [];

      if (isMultiline) {
        // Word-wrap to match browser layout
        const segs = text.split(/(\s+)/);
        let curLine = '', curX = 0;
        for (const seg of segs) {
          const sw = offCtx.measureText(seg).width;
          if (curLine && seg.trim() && curX + sw > maxW) {
            lines.push(curLine); curLine = seg.trim(); curX = offCtx.measureText(curLine).width;
          } else { curLine += seg; curX += sw; }
        }
        if (curLine.trim()) lines.push(curLine);
      } else {
        // Single line — use actual measured text width, never re-wrap
        lines = [text];
      }

      // Each element gets its own group so clip rects are never shared across items
      const groupKey = allEls.indexOf(el);
      if (!groupMap.has(groupKey)) groupMap.set(groupKey, { clip: clipBox, particles: [] });
      const group = groupMap.get(groupKey);

      lines.forEach((lineText, li) => {
        const baseY = rect.top + font.size + li * lh;
        // Skip lines that are completely outside the clip box
        if (clipBox && (baseY - font.size > clipBox.y + clipBox.h || baseY < clipBox.y)) return;
        let cx = rect.left;
        for (const ch of lineText) {
          const cw = offCtx.measureText(ch).width;
          if (cx > rect.left + maxW) break;
          group.particles.push({
            ch, font: font.str,
            restX: cx, restY: baseY,
            x: cx + (Math.random()-.5)*1,
            y: baseY + (Math.random()-.5)*1,
            vx: 0, vy: 0,
            rgb,
            op: 0.88 + Math.random()*0.12,
            floatOff: Math.random()*Math.PI*2,
            // Hard bounds — never leave the element's rendered area
            minX: rect.left - 1,
            maxX: rect.left + maxW + 1,
            minY: rect.top,
            maxY: rect.top + Math.max(rect.height, lh * lines.length) + 2,
          });
          cx += cw;
        }
      });
    });

    this.groups = [...groupMap.values()];
    this.dirty = false;
  }

  _loop() {
    requestAnimationFrame(() => this._loop());
    if (this.dirty) this._buildParticles();
    this._draw();
  }

  _draw() {
    const ctx = this.ctx;
    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    this.floatT += FLOAT_SPD;

    const fdx = Math.sin(this.floatT)*FLOAT_AX + Math.sin(this.floatT*1.7+.9)*FLOAT_AX*.3;
    const fdy = Math.sin(this.floatT*.8+1.2)*FLOAT_AY + Math.sin(this.floatT*1.3+2.1)*FLOAT_AY*.3;

    for (const group of this.groups) {
      // Apply canvas clip rectangle for this group
      ctx.save();
      if (group.clip) {
        ctx.beginPath();
        ctx.rect(group.clip.x - 2, group.clip.y - 2, group.clip.w + 4, group.clip.h + 4);
        ctx.clip();
      }

      for (const p of group.particles) {
        const fbX = p.restX + fdx + Math.sin(this.floatT + p.floatOff)*.6;
        const fbY = p.restY + fdy + Math.cos(this.floatT*.9 + p.floatOff)*.4;
        p.vx += (fbX - p.x)*TETHER_K;
        p.vy += (fbY - p.y)*TETHER_K;
        const dx = p.x - mx, dy = p.y - my;
        const d  = Math.sqrt(dx*dx + dy*dy);
        if (d < REPEL_R && d > .5) {
          const f = (1-d/REPEL_R);
          p.vx += (dx/d)*f*f*REPEL_F;
          p.vy += (dy/d)*f*f*REPEL_F;
        }
        p.vx *= DAMP; p.vy *= DAMP;
        p.x += p.vx; p.y += p.vy;

        // Hard clamp — never let a particle leave its source element's rect
        if (p.x < p.minX) { p.x = p.minX; p.vx = Math.abs(p.vx) * 0.3; }
        if (p.x > p.maxX) { p.x = p.maxX; p.vx = -Math.abs(p.vx) * 0.3; }
        if (p.y < p.minY) { p.y = p.minY; p.vy = Math.abs(p.vy) * 0.3; }
        if (p.y > p.maxY) { p.y = p.maxY; p.vy = -Math.abs(p.vy) * 0.3; }

        ctx.font = p.font;
        ctx.textBaseline = 'alphabetic';
        ctx.fillStyle = `rgba(${p.rgb},${p.op.toFixed(3)})`;
        ctx.fillText(p.ch, p.x, p.y);
      }

      ctx.restore();
    }
  }
}

(function(){
  // Reading progress bar
  const bar = document.createElement('div');
  bar.id = 'read-progress';
  document.body.appendChild(bar);
  let barFade;
  function updateBar() {
    const m = document.getElementById('results-main');
    if(!m || m.style.display==='none') return;
    const pct = m.scrollHeight <= m.clientHeight ? 0 : m.scrollTop / (m.scrollHeight - m.clientHeight);
    bar.style.width = (pct * 100).toFixed(2) + '%';
    bar.classList.add('active');
    clearTimeout(barFade);
    barFade = setTimeout(() => bar.classList.remove('active'), 1400);
  }

  // Per-container custom thumb
  function attachThumb(el) {
    if(!el || el._scAttached) return;
    el._scAttached = true;
    const parent = el.parentElement;
    if(getComputedStyle(parent).position === 'static') parent.style.position = 'relative';

    const wrap  = document.createElement('div'); wrap.className = 'sc-wrap';
    const thumb = document.createElement('div'); thumb.className = 'sc-thumb';
    wrap.appendChild(thumb);
    parent.appendChild(wrap);

    let fadeTimer;
    function update() {
      const sh = el.scrollHeight, ch = el.clientHeight;
      if(sh <= ch) { wrap.classList.remove('sc-visible'); return; }
      const pct      = el.scrollTop / (sh - ch);
      const thumbH   = Math.max(28, (ch / sh) * ch);
      const thumbTop = pct * (ch - thumbH);
      thumb.style.height = thumbH + 'px';
      thumb.style.top    = thumbTop + 'px';
      wrap.classList.add('sc-visible');
      clearTimeout(fadeTimer);
      fadeTimer = setTimeout(() => wrap.classList.remove('sc-visible'), 1400);
    }

    el.addEventListener('scroll', () => { update(); updateBar(); }, { passive: true });
    new ResizeObserver(update).observe(el);
    el._scUpdate = update;
  }

  // Attach to panels that exist at load time
  ['results-main','ai-panel-desktop','sheet-content','page-home'].forEach(id => {
    const el = document.getElementById(id);
    if(el) attachThumb(el);
  });

  // Re-attach after search (in case elements were recreated)
  const _orig = window.doSearch;
  window.doSearch = function() {
    _orig && _orig.apply(this, arguments);
    requestAnimationFrame(() => {
      ['results-main','ai-panel-desktop','sheet-content'].forEach(id => {
        const el = document.getElementById(id);
        if(el) { el._scAttached = false; attachThumb(el); }
      });
    });
  };
})();

</script>
</body>
</html>
