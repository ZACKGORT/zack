function initParticleHero(viewEl) {
  const viewId = viewEl.id;
  if (activeInstances.has(viewId)) {
    activeInstances.get(viewId).dead = true;
    activeInstances.delete(viewId);
  }
  if (viewId === 'view-index') return;

  const section = viewEl.querySelector('.cs-particle-hero');
  if (!section) return;
  const canvas = section.querySelector('.cs-hero-canvas');
  const line1  = section.dataset.cs    || '';
  const line2  = section.dataset.csSub || '';
  const ctx    = canvas.getContext('2d');

  let W, H, DPR;
  let mx = -400, my = -400;
  let bX = -400, bY = -400;
  let floatT = Math.random() * Math.PI * 2;
  let particles = [];
  const inst = { dead: false };
  activeInstances.set(viewId, inst);
  inst.resize = () => resize();

  function heroFontSize1() {
    return 48; // fixed — not coupled to the size scaler
  }
  function heroFontSize2(fs1) { return Math.round(fs1 * 0.32); }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W   = window.innerWidth;
    const fs1  = heroFontSize1();
    const fs2  = heroFontSize2(fs1);
    const padT = Math.round(fs1 * 0.55);
    const padB = Math.round(fs1 * 1.6);
    const gap  = Math.round(fs1 * 0.18);
    H = padT + fs1 + gap + fs2 + padB;
    canvas.width        = W * DPR;
    canvas.height       = H * DPR;
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    build(fs1, fs2, padT, gap);
  }

  function build(fs1, fs2, padT, gap) {
    const csFont = getComputedStyle(viewEl).getPropertyValue('--cs-font').trim() || "'Inter','Helvetica Neue',Helvetica,Arial,sans-serif";
    const font1  = `900 ${fs1}px ${csFont}`;
    const font2  = `300 ${fs2}px 'Inter','Helvetica Neue',Helvetica,Arial,sans-serif`;
    const PAD_L  = 16;
    const prev   = particles;
    particles    = [];

    function pushLine(text, font, baseY, baseOp) {
      ctx.font = font;
      let cx = PAD_L;
      for (const ch of text) {
        const w = ctx.measureText(ch).width;
        const p = prev.find(p => p.ch === ch && Math.abs(p.restX - cx) < 6);
        particles.push({
          ch, font,
          restX: cx, restY: baseY,
          x:  p ? p.x  : cx + (Math.random() - .5) * W * 0.65,
          y:  p ? p.y  : baseY + (Math.random() - .5) * H * 1.1,
          vx: p ? p.vx : 0,
          vy: p ? p.vy : 0,
          baseOp,
        });
        cx += w;
      }
    }

    const y1 = padT + fs1;
    const y2 = y1 + gap + fs2;
    pushLine(line1, font1, y1, 1);
    pushLine(line2, font2, y2, 1);
  }

  function loop() {
    if (inst.dead) return;
    requestAnimationFrame(loop);
    if (!viewEl.classList.contains('active')) return;

    bX += (mx - bX) * BLOB_LERP_CS;
    bY += (my - bY) * BLOB_LERP_CS;
    floatT += FLOAT_SPD_CS;

    const fdx = Math.sin(floatT) * FLOAT_AX_CS + Math.sin(floatT * 1.7) * FLOAT_AX_CS * 0.28;
    const fdy = Math.sin(floatT * 0.8 + 1) * FLOAT_AY_CS + Math.sin(floatT * 1.3 + 2) * FLOAT_AY_CS * 0.3;

    ctx.clearRect(0, 0, W, H);
    const bgColor = window._heroBg || '#0a0a0a';
    ctx.fillStyle = bgColor;
    ctx.fillRect(0, 0, W, H);
    ctx.textBaseline = 'alphabetic';

    const repelR = window._repelR || 155;

    for (const p of particles) {
      p.vx += (p.restX + fdx - p.x) * TETHER_K_CS;
      p.vy += (p.restY + fdy - p.y) * TETHER_K_CS;

      const dx = p.x - bX, dy = p.y - bY;
      const d  = Math.sqrt(dx * dx + dy * dy);
      if (d < repelR && d > 0.5) {
        const f = 1 - d / repelR;
        p.vx += (dx / d) * f * f * 20;
        p.vy += (dy / d) * f * f * 20;
      }

      p.vx *= DAMP_CS; p.vy *= DAMP_CS;
      p.x  += p.vx;   p.y  += p.vy;

      const prox  = d < 20 ? 0 : Math.min(1, (d - 16) / 72);
      const alpha = p.baseOp * prox;
      if (alpha > 0.006) {
        ctx.font = p.font;
        const isDark = (window._heroBg || '#0a0a0a') === '#0a0a0a';
        const pColor = isDark ? '255,255,255' : '10,10,10';
        ctx.fillStyle = `rgba(${pColor},${alpha.toFixed(3)})`;
        ctx.fillText(p.ch, p.x, p.y);
      }
    }

    const bgR = bgColor === '#0a0a0a' ? '10,10,10' : '255,255,255';
    const vg  = ctx.createLinearGradient(0, H * 0.75, 0, H);
    vg.addColorStop(0, `rgba(${bgR},0)`);
    vg.addColorStop(1, `rgba(${bgR},1)`);
    ctx.fillStyle = vg;
    ctx.fillRect(0, H * 0.75, W, H * 0.25);
    const tg = ctx.createLinearGradient(0, 0, 0, 52);
    tg.addColorStop(0, `rgba(${bgR},1)`);
    tg.addColorStop(1, `rgba(${bgR},0)`);
    ctx.fillStyle = tg;
    ctx.fillRect(0, 0, W, 52);
  }

  window.addEventListener('mousemove', e => {
    if (inst.dead) return;
    const r = canvas.getBoundingClientRect();
    mx = e.clientX - r.left;
    my = e.clientY - r.top;
  });

  window.addEventListener('resize', () => { if (!inst.dead) resize(); });

  document.fonts.ready.then(() => {
    const csFont      = getComputedStyle(viewEl).getPropertyValue('--cs-font').trim();
    const loadPromise = csFont
      ? document.fonts.load(`900 ${heroFontSize1()}px ${csFont}`).catch(() => {})
      : Promise.resolve();
    loadPromise.then(() => { resize(); loop(); });
  });
}

// ── NARRATIVE PARTICLE TEXT (fs-narrative blocks) ───────────────────────────
// Mirrors the index portrait hero: a tiled character grid scaled by the
// shared --work-font-size slider, with mouse-proximity fade.
const NARR_TETHER = 0.014;
const NARR_DAMP   = 0.76;
const NARR_LERP   = 0.11;

function narrParticleSize() {
  const base = 13;
  const CS_VIEWS = ['bny','gnc','hardinge','kent','dana','power','wovn'];
  if (currentView === 'about') {
    const ps = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--page-scale')) || 1;
    return Math.round(base * ps);
  }
  if (CS_VIEWS.includes(currentView)) {
    const cs = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--cs-scale')) || 1;
    return Math.round(base * cs);
  }
  return base;
}

function initNarrativeParticles(wrap) {
  const canvas = wrap.querySelector('canvas');
  const srText = wrap.querySelector('.fs-narrative-sr');
  if (!canvas || !srText) return;
  // Split on <br> markers so paragraph breaks survive into the tiled grid —
  // read as an author's note, not one flattened run-on string.
  const paragraphs = srText.innerHTML
    .split(/<br\s*\/?>/i)
    .map(s => s.replace(/<[^>]+>/g, '').replace(/&amp;/g, '&').replace(/\s+/g, ' ').trim())
    .filter(s => s.length);
  const ctx  = canvas.getContext('2d');
  // Allow per-block size override via data-narrative-scale (e.g. "4" = 4× base)
  const scaleMult = parseFloat(wrap.dataset.narrativeScale) || 1;

  let FONT_SIZE = Math.round(narrParticleSize() * scaleMult);
  let CHAR_W = FONT_SIZE * 0.602;
  const isHeadingBlock = wrap.dataset.narrativeFont === 'heading';
  let LINE_H = FONT_SIZE * (isHeadingBlock ? 1.02 : 1.45);
  let W, H, DPR;
  let mX = -999, mY = -999;
  let bX = -999, bY = -999;
  let allChars = [];
  let loaded = false;
  const inst = { dead: false, started: false };
  inst.resize = () => rebuild();

  function isDarkMode() { return (window._heroBg || '#0a0a0a') === '#0a0a0a'; }

  function currentFont() {
    // Heading canvases (data-narrative-font="heading") use a font fixed per letter
    // via data-heading-font on the wrap. Body/narrative canvases always use Inter.
    if (wrap.dataset.narrativeFont === 'heading') {
      return wrap.dataset.headingFont || "'Syne', sans-serif";
    }
    return "'Inter','Helvetica Neue',sans-serif";
  }

  function measureCharW(font, size) {
    // Measure the average advance width for this font at this size using
    // a representative sample of characters — proportional fonts vary wildly
    // from the fixed 0.602 monospace estimate, causing layout overflow.
    const sample = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789 ';
    ctx.font = `${isDarkMode() ? '300' : '500'} ${size}px ${font}`;
    return ctx.measureText(sample).width / sample.length;
  }

  function buildGrid() {
    const cw = measureCharW(currentFont(), FONT_SIZE);
    return { cols: Math.max(4, Math.floor(W / cw)), charW: cw };
  }

  // Lay out paragraph-by-paragraph with word-aware wrapping so we never
  // break in the middle of a word like "org s\ntructure".
  function layoutRows(cols) {
    const rows = [];
    paragraphs.forEach((para, pi) => {
      const words = para.split(' ');
      let row = '';
      words.forEach(word => {
        const candidate = row.length === 0 ? word : row + ' ' + word;
        if (candidate.length <= cols) {
          row = candidate;
        } else {
          if (row.length > 0) rows.push(row);
          // If the word itself is longer than cols, break it with a hyphen
          if (word.length > cols) {
            let w = word;
            while (w.length > cols) {
              rows.push(w.slice(0, cols - 1) + '-');
              w = w.slice(cols - 1);
            }
            row = w;
          } else {
            row = word;
          }
        }
      });
      if (row.length > 0) rows.push(row);
      if (pi < paragraphs.length - 1) rows.push('');
    });
    return rows.length ? rows : [''];
  }

  // Per-character width cache: font+size+char -> px
  const _charWidthCache = {};
  function charAdvance(ch) {
    const key = `${currentFont()}|${FONT_SIZE}|${ch}`;
    if (_charWidthCache[key] !== undefined) return _charWidthCache[key];
    ctx.font = `${isDarkMode() ? '300' : '500'} ${FONT_SIZE}px ${currentFont()}`;
    const w = ctx.measureText(ch).width;
    _charWidthCache[key] = w;
    return w;
  }

  function buildChars() {
    const { cols } = buildGrid();
    const rows = layoutRows(cols);
    const prev = allChars;
    const next = [];
    let idx = 0;
    rows.forEach((row, r) => {
      const baseY = r * LINE_H;
      let x = 0;
      // Place each character at its actual measured advance width
      for (let c = 0; c < row.length; c++) {
        const ch = row[c];
        const p = prev[idx];
        next.push({
          ch,
          restX: x, restY: baseY,
          x:  p ? p.x : x,
          y:  p ? p.y : baseY,
          vx: p ? p.vx : 0,
          vy: p ? p.vy : 0,
          baseOpacity: 1,
        });
        x += charAdvance(ch);
        idx++;
      }
    });
    return next;
  }

  function rebuild() {
    FONT_SIZE = Math.round(narrParticleSize() * scaleMult);
    CHAR_W    = FONT_SIZE * 0.602;
    LINE_H    = FONT_SIZE * (isHeadingBlock ? 1.02 : 1.45);
    // Clear per-char width cache so new font/size is measured fresh
    Object.keys(_charWidthCache).forEach(k => delete _charWidthCache[k]);
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = wrap.clientWidth;
    const { cols } = buildGrid();
    const rows = layoutRows(cols).length;
    H = Math.round(rows * LINE_H + LINE_H * 0.4);
    canvas.width  = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    allChars = buildChars();
    loaded = true;
  }

  function loop() {
    if (inst.dead) return;
    requestAnimationFrame(loop);
    if (!wrap.closest('.view.active')) return;

    bX += (mX - bX) * NARR_LERP;
    bY += (mY - bY) * NARR_LERP;

    ctx.clearRect(0, 0, W, H);
    if (!loaded) return;

    const dark = isDarkMode();
    ctx.font = `${dark ? '300' : '500'} ${FONT_SIZE}px ${currentFont()}`;
    ctx.textBaseline = 'top';
    const rgbStr = dark ? '255,255,255' : '0,0,0';
    let lastAlphaBucket = -1;

    for (const p of allChars) {
      if (p.x < -CHAR_W || p.x > W + CHAR_W || p.y < -LINE_H || p.y > H + LINE_H) continue;
      const dx = p.x - bX, dy = p.y - bY;
      const dSq = dx * dx + dy * dy;

      p.vx += (p.restX - p.x) * NARR_TETHER;
      p.vy += (p.restY - p.y) * NARR_TETHER;

      // Use a gentler, fixed repel radius for inline narrative text —
      // independent of the global _ptRepel (which is tuned for full-page heroes)
      const repelNarr = 55;
      const repelNarrSq = repelNarr * repelNarr;
      if (dSq < repelNarrSq && dSq > 0.25) {
        const d     = Math.sqrt(dSq);
        const f     = 1 - d / repelNarr;
        const scale = f * f * 6 / d;  // gentler force than the hero (was 16)
        p.vx += dx * scale;
        p.vy += dy * scale;
      }

      p.vx *= NARR_DAMP; p.vy *= NARR_DAMP;
      p.x  += p.vx;     p.y  += p.vy;

      // Clamp to canvas bounds so characters can never escape off-screen
      p.x = Math.max(-CHAR_W * 0.5, Math.min(W + CHAR_W * 0.5, p.x));
      p.y = Math.max(-LINE_H * 0.5, Math.min(H + LINE_H * 0.5, p.y));

      const dFade = dSq > 0.25 ? Math.sqrt(dSq) : 0;
      const alpha = p.baseOpacity * Math.min(1, Math.max(0, (dFade - 14) / 30));
      if (alpha > 0.008) {
        const bucket = (alpha * 64 + 0.5) | 0;
        if (bucket !== lastAlphaBucket) {
          ctx.fillStyle = `rgba(${rgbStr},${(bucket / 64).toFixed(2)})`;
          lastAlphaBucket = bucket;
        }
        ctx.fillText(p.ch, p.x, p.y);
      }
    }
  }

  function onMove(e) {
    if (inst.dead) return;
    const r = canvas.getBoundingClientRect();
    mX = e.clientX - r.left;
    mY = e.clientY - r.top;
  }
  window.addEventListener('mousemove', onMove);
  window.addEventListener('resize', () => { if (!inst.dead) rebuild(); });

  function start() {
    if (inst.started) return;
    inst.started = true;
    if (window._activeInstances) window._activeInstances.set('narrative-' + Math.random().toString(36).slice(2), inst);
    const fontToLoad = currentFont();
    const loadPromise = fontToLoad.includes('DM Mono')
      ? document.fonts.ready
      : document.fonts.load(`${isDarkMode() ? '300' : '500'} ${FONT_SIZE}px ${fontToLoad}`)
          .catch(() => {}).then(() => document.fonts.ready);
    loadPromise.then(() => { rebuild(); loop(); });
  }

  const obs = new IntersectionObserver(entries => {
    entries.forEach(en => { if (en.isIntersecting) { start(); obs.disconnect(); } });
  }, { threshold: 0.05, rootMargin: '200px 0px' });
  obs.observe(wrap);

  wrap._narrInst = inst;
}

function initAllNarrativeParticles(container) {
  (container || document).querySelectorAll('[data-narrative-particles]').forEach(wrap => {
    if (wrap._narrInst) { wrap._narrInst.dead = true; }
    initNarrativeParticles(wrap);
  });
}

// ── PORTRAIT HERO (index) ──────────────────────────────────────────────────

// ── CUSTOM SCROLL INDICATOR ─────────────────────────────────────────────────
(function initScrollIndicator() {
  const ind   = document.getElementById('scroll-indicator');
  const thumb = document.getElementById('scroll-thumb');
  if (!ind || !thumb) return;

  let fadeTimer = null;

  function update() {
    const scrollEl  = document.scrollingElement || document.documentElement;
    const scrollTop = scrollEl.scrollTop;
    const scrollH   = scrollEl.scrollHeight - scrollEl.clientHeight;
    if (scrollH <= 0) { ind.classList.remove('visible'); return; }

    const viewH    = window.innerHeight;
    const ratio    = scrollTop / scrollH;
    const thumbH   = Math.max(32, (viewH / scrollEl.scrollHeight) * viewH);
    const thumbTop = ratio * (viewH - thumbH);

    thumb.style.height = thumbH + 'px';
    thumb.style.top    = thumbTop + 'px';

    ind.classList.add('visible', 'active');
    clearTimeout(fadeTimer);
    fadeTimer = setTimeout(() => { ind.classList.remove('active'); }, 800);
    fadeTimer = setTimeout(() => { ind.classList.remove('visible'); }, 1800);
  }

  window.addEventListener('scroll', update, { passive: true });
  window.addEventListener('resize', update, { passive: true });
  update();
})();


// Native viewport pinch-zoom is disabled (see <meta viewport> maximum-scale=1,
// user-scalable=no) so this two-finger gesture can drive the same type-ramp
// scaler as the toolbar slider / Shift+Scroll, instead of zooming the page.
(function initPinchZoomScaler() {
  let startDist = null;
  let startSize = 28;

  function touchDist(touches) {
    const dx = touches[0].clientX - touches[1].clientX;
    const dy = touches[0].clientY - touches[1].clientY;
    return Math.sqrt(dx * dx + dy * dy);
  }

  window.addEventListener('touchstart', e => {
    if (e.touches.length === 2) {
      startDist = touchDist(e.touches);
      startSize = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--work-font-size')) || 28;
    }
  }, { passive: true });

  window.addEventListener('touchmove', e => {
    if (e.touches.length !== 2 || startDist === null) return;
    e.preventDefault(); // suppress any residual native zoom/scroll during the pinch
    const dist  = touchDist(e.touches);
    const ratio = dist / startDist;
    const next  = Math.min(72, Math.max(28, Math.round(startSize * ratio)));
    tbApplySize(next);
    toolbarState.size = next;
  }, { passive: false });

  window.addEventListener('touchend', e => {
    if (e.touches.length < 2) startDist = null;
  }, { passive: true });
})();

// ── GLYPH METRIC LINES ─────────────────────────────────────────────────────
(function positionMetricLines() {
  function fitHero(panel, heroEl) {
    const len = heroEl.dataset.glyphLen;
    if (!len || len === '1') return;
    heroEl.style.fontSize = '';
    const cs2 = window.getComputedStyle(panel);
    const padH = parseFloat(cs2.paddingLeft) + parseFloat(cs2.paddingRight);
    const maxW = panel.clientWidth - padH;
    let guard = 0;
    // Temporarily unhide overflow so getBoundingClientRect returns the true
    // unclipped width, then restore — this is the only reliable cross-browser
    // method when the parent has overflow:hidden.
    const prevOverflow = panel.style.overflow;
    panel.style.overflow = 'visible';
    while (heroEl.getBoundingClientRect().width > maxW && guard < 60) {
      const cs = window.getComputedStyle(heroEl);
      const cur = parseFloat(cs.fontSize);
      if (!cur || cur <= 10) break;
      heroEl.style.fontSize = Math.max(10, cur * 0.94) + 'px';
      guard++;
    }
    panel.style.overflow = prevOverflow || '';
  }

  function place() {
    const panels = document.querySelectorAll('.fs-glyph-left');
    if (!panels.length) return;
    const cvs = document.createElement('canvas');
    const ctx  = cvs.getContext('2d');

    panels.forEach(panel => {
      const heroEl    = panel.querySelector('.fs-glyph-hero');
      const metricsEl = panel.querySelector('.fs-glyph-metrics');
      if (!heroEl || !metricsEl) return;

      fitHero(panel, heroEl);

      const panelRect = panel.getBoundingClientRect();
      const heroRect  = heroEl.getBoundingClientRect();
      if (panelRect.width === 0 || panelRect.height === 0) return;

      const cs         = window.getComputedStyle(heroEl);
      const fontSize   = parseFloat(cs.fontSize);
      const fontFamily = cs.fontFamily;
      const fontWeight = cs.fontWeight;
      ctx.font = `${fontWeight} ${fontSize}px ${fontFamily}`;

      const capM  = ctx.measureText('H');
      const xM    = ctx.measureText('x');
      const descM = ctx.measureText('p');

      const capAscent  = capM.actualBoundingBoxAscent  || fontSize * 0.718;
      const xAscent    = xM.actualBoundingBoxAscent    || fontSize * 0.527;
      const descDepth  = descM.actualBoundingBoxDescent || fontSize * 0.193;

      const fontAscent  = capM.fontBoundingBoxAscent  || fontSize * 0.8;
      const fontDescent = capM.fontBoundingBoxDescent || fontSize * 0.2;
      const lineBoxH    = heroRect.height;
      const baselinePx  = (heroRect.top - panelRect.top)
                        + (lineBoxH + fontAscent - fontDescent) / 2;

      const offsets = {
        cap:       baselinePx - capAscent,
        xheight:   baselinePx - xAscent,
        baseline:  baselinePx,
        descender: baselinePx + descDepth,
      };

      metricsEl.querySelectorAll('[data-metric]').forEach(line => {
        const px = offsets[line.dataset.metric];
        if (px !== undefined) line.style.top = px + 'px';
      });
    });
  }

  window._placeGlyphMetrics = place;
  document.fonts.ready.then(() => requestAnimationFrame(() => requestAnimationFrame(place)));
  window.addEventListener('resize', () => requestAnimationFrame(place));

  // Catches column-drag resizes, toolbar font-size changes, and any other
  // layout shift that doesn't fire a window resize event.
  if ('ResizeObserver' in window) {
    let raf = null;
    const ro = new ResizeObserver(() => {
      if (raf) cancelAnimationFrame(raf);
      raf = requestAnimationFrame(place);
    });
    document.querySelectorAll('.fs-glyph-left').forEach(p => ro.observe(p));
  }
})();

// ── GLYPH LETTER SELECT (click a highlighted letter to swap the hero word) ──
(function glyphLetterSelect() {
  function initPanel(panel) {
    if (panel._selectInit) return;
    panel._selectInit = true;

    const heroEl = panel.querySelector('.fs-glyph-hero');
    const container = panel.closest('.fs-glyphs');
    if (!heroEl || !container) return;

    const defaultWord = heroEl.textContent;
    const defaultLen  = heroEl.dataset.glyphLen;

    let caption = panel.querySelector('.fs-glyph-caption');
    if (!caption) {
      caption = document.createElement('div');
      caption.className = 'fs-glyph-caption';
      panel.appendChild(caption);
    }

    const cells = container.querySelectorAll('.fs-glyph-cell.hi[data-glyph-word]');

    function refit() {
      if (window._placeGlyphMetrics) requestAnimationFrame(window._placeGlyphMetrics);
    }

    function setHeroWord(word, len) {
      clearTimeout(heroEl._swapTimer);
      heroEl.classList.add('swapping');
      heroEl._swapTimer = setTimeout(() => {
        heroEl.textContent = word;
        heroEl.dataset.glyphLen = String(len);
        refit();
        requestAnimationFrame(() => heroEl.classList.remove('swapping'));
      }, 110);
    }

    function selectCell(cell) {
      cells.forEach(c => c.classList.remove('selected'));
      cell.classList.add('selected');
      const word = cell.dataset.glyphWord || cell.textContent;
      const tip  = cell.dataset.glyphTip || '';
      setHeroWord(word, word.length);
      caption.innerHTML = `<span class="fgc-letter">${cell.textContent}</span>${tip}<span class="fgc-hint">Click the letter again to return to ${defaultWord}</span>`;
      caption.classList.add('visible');
    }

    function reset() {
      cells.forEach(c => c.classList.remove('selected'));
      setHeroWord(defaultWord, defaultLen);
      caption.classList.remove('visible');
    }

    cells.forEach(cell => {
      cell.setAttribute('tabindex', '0');
      cell.setAttribute('role', 'button');
      cell.setAttribute('aria-pressed', 'false');
      cell.addEventListener('click', () => {
        const wasSelected = cell.classList.contains('selected');
        if (wasSelected) {
          reset();
        } else {
          selectCell(cell);
        }
        cells.forEach(c => c.setAttribute('aria-pressed', c.classList.contains('selected') ? 'true' : 'false'));
      });
      cell.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          cell.click();
        }
      });
    });
  }

  function initAll() {
    document.querySelectorAll('.fs-glyph-left').forEach(initPanel);
  }

  initAll();
  const obs = new MutationObserver(initAll);
  obs.observe(document.body, { childList: true, subtree: true });
})();

// ── GLYPH HERO MAGNETIC CURSOR ───────────────────────────────────────────────
(function magneticGlyphHero() {
  const MAG_RADIUS  = 260;   // px — influence radius from panel center
  const MAG_STRENGTH = 0.32; // how far the letters travel toward the cursor (0-1)
  const MAG_LERP     = 0.12; // easing speed toward target

  function initPanel(panel) {
    const wrap = panel.querySelector('.fs-glyph-hero-wrap');
    if (!wrap || wrap._magInit) return;
    wrap._magInit = true;

    let targetX = 0, targetY = 0;
    let curX = 0, curY = 0;
    let raf = null;

    function onMove(e) {
      const r = panel.getBoundingClientRect();
      const cx = r.left + r.width / 2;
      const cy = r.top + r.height / 2;
      const dx = e.clientX - cx;
      const dy = e.clientY - cy;
      const dist = Math.sqrt(dx * dx + dy * dy);

      if (dist < MAG_RADIUS) {
        const pull = (1 - dist / MAG_RADIUS) * MAG_STRENGTH;
        targetX = dx * pull;
        targetY = dy * pull;
      } else {
        targetX = 0;
        targetY = 0;
      }
      ensureLoop();
    }

    function onLeave() {
      targetX = 0;
      targetY = 0;
      ensureLoop();
    }

    function ensureLoop() {
      if (raf) return;
      tick();
    }

    function tick() {
      curX += (targetX - curX) * MAG_LERP;
      curY += (targetY - curY) * MAG_LERP;
      wrap.style.transform = `translate(${curX.toFixed(2)}px, ${curY.toFixed(2)}px)`;

      if (Math.abs(targetX - curX) > 0.05 || Math.abs(targetY - curY) > 0.05 ||
          Math.abs(curX) > 0.05 || Math.abs(curY) > 0.05) {
        raf = requestAnimationFrame(tick);
      } else {
        curX = 0; curY = 0;
        wrap.style.transform = 'translate(0px, 0px)';
        raf = null;
      }
    }

    window.addEventListener('mousemove', onMove);
    panel.addEventListener('mouseleave', onLeave);
  }

  function initAll() {
    document.querySelectorAll('.fs-glyph-left').forEach(initPanel);
  }

  initAll();
})();

// ── INDEX FOOTER COLUMN RESIZER (drag to resize ice-tray / iframe split) ────
(function indexFooterResizer() {
  const resizer = document.getElementById('ic-resizer');
  const container = document.querySelector('.index-contact-wrap');
  if (!resizer || !container) return;

  const MIN_LEFT = 320;  // ice-tray column never gets crushed below this
  const MIN_RIGHT = 280; // iframe column never gets crushed below this

  function clamp(px) {
    const total = container.getBoundingClientRect().width;
    const max = total - MIN_LEFT - 10;
    return Math.max(MIN_RIGHT, Math.min(max, px));
  }

  function setSplit(px) {
    container.style.setProperty('--ic-split', clamp(px) + 'px');
    if (window._updateHoopScale) window._updateHoopScale();
  }

  let dragging = false;

  resizer.addEventListener('pointerdown', (e) => {
    dragging = true;
    resizer.classList.add('dragging');
    resizer.setPointerCapture && resizer.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  resizer.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const rect = container.getBoundingClientRect();
    setSplit(rect.right - e.clientX); // width measured from the container's right edge
  });
  function endDrag(e) {
    if (!dragging) return;
    dragging = false;
    resizer.classList.remove('dragging');
    resizer.releasePointerCapture && resizer.releasePointerCapture(e.pointerId);
  }
  resizer.addEventListener('pointerup', endDrag);
  resizer.addEventListener('pointercancel', endDrag);
  resizer.addEventListener('dblclick', () => {
    container.style.removeProperty('--ic-split');
    if (window._updateHoopScale) window._updateHoopScale();
  });
  resizer.addEventListener('keydown', (e) => {
    const rightEl = document.querySelector('.ic-hoop-wrap');
    const cur = rightEl.getBoundingClientRect().width;
    if (e.key === 'ArrowLeft') { setSplit(cur + 16); e.preventDefault(); }
    if (e.key === 'ArrowRight') { setSplit(cur - 16); e.preventDefault(); }
  });
})();

// ── HOOP IFRAME SCALE (the embedded page has its own fixed/native layout —
//    rather than stretching it to 100% and letting its content render tiny
//    or cropped inside a narrow column, the iframe renders at a fixed
//    "native" size and this uniformly scales the whole thing down/up to
//    fill whatever width the column actually has, recalculated on resize
//    and whenever the draggable divider moves) ──────────────────────────────
(function initHoopScale() {
  const wrap = document.querySelector('.ic-hoop-wrap');
  const frame = document.querySelector('.ic-hoop-frame');
  if (!wrap || !frame) return;
  const NATIVE_W = 960;
  const NATIVE_H = 720;

  function update() {
    const w = wrap.clientWidth || NATIVE_W;
    const h = wrap.clientHeight || NATIVE_H;
    // Math.min ("contain") instead of Math.max ("cover") — cover was cropping
    // whichever edge didn't match the container's aspect ratio (the bottom,
    // in a narrow tall column). Contain guarantees nothing is ever clipped,
    // at the cost of possibly letterboxing empty space on one axis — which
    // is why the frame is also centered below rather than pinned top-left.
    const scale = Math.min(w / NATIVE_W, h / NATIVE_H);
    const scaledW = NATIVE_W * scale;
    const scaledH = NATIVE_H * scale;
    frame.style.transform = `scale(${scale})`;
    frame.style.left = Math.round((w - scaledW) / 2) + 'px';
    frame.style.top = Math.round((h - scaledH) / 2) + 'px';
  }
  window._updateHoopScale = update;
  window.addEventListener('resize', update);
  new ResizeObserver(update).observe(wrap);
  update();
})();

// ── GLYPH COLUMN RESIZER (drag to resize word / grid split) ─────────────────
(function glyphColumnResizer() {
  const MIN_LEFT = 200;
  const MIN_RIGHT = 340;

  function initResizer(resizer) {
    if (resizer._resizeInit) return;
    resizer._resizeInit = true;

    const container = resizer.closest('.fs-glyphs');
    if (!container) return;

    function clamp(px) {
      const total = container.getBoundingClientRect().width;
      const max = total - MIN_RIGHT - 10;
      return Math.max(MIN_LEFT, Math.min(max, px));
    }

    function setSplit(px) {
      container.style.setProperty('--glyph-split', clamp(px) + 'px');
      if (window._placeGlyphMetrics) requestAnimationFrame(window._placeGlyphMetrics);
    }

    let dragging = false;

    function onPointerDown(e) {
      dragging = true;
      resizer.classList.add('dragging');
      resizer.setPointerCapture && resizer.setPointerCapture(e.pointerId);
      e.preventDefault();
    }
    function onPointerMove(e) {
      if (!dragging) return;
      const rect = container.getBoundingClientRect();
      setSplit(e.clientX - rect.left);
    }
    function onPointerUp(e) {
      if (!dragging) return;
      dragging = false;
      resizer.classList.remove('dragging');
      resizer.releasePointerCapture && resizer.releasePointerCapture(e.pointerId);
    }
    function onKeyDown(e) {
      const container = resizer.closest('.fs-glyphs');
      const leftEl = container.querySelector('.fs-glyph-left');
      const cur = leftEl.getBoundingClientRect().width;
      if (e.key === 'ArrowLeft') { setSplit(cur - 16); e.preventDefault(); }
      if (e.key === 'ArrowRight') { setSplit(cur + 16); e.preventDefault(); }
    }

    resizer.addEventListener('pointerdown', onPointerDown);
    resizer.addEventListener('pointermove', onPointerMove);
    resizer.addEventListener('pointerup', onPointerUp);
    resizer.addEventListener('pointercancel', onPointerUp);
    resizer.addEventListener('dblclick', () => {
      container.style.removeProperty('--glyph-split');
      if (window._placeGlyphMetrics) requestAnimationFrame(window._placeGlyphMetrics);
    });
    resizer.addEventListener('keydown', onKeyDown);
  }

  function initAll() {
    document.querySelectorAll('.fs-glyph-resizer').forEach(initResizer);
  }

  initAll();
  const obs = new MutationObserver(initAll);
  obs.observe(document.body, { childList: true, subtree: true });
})();


// ── GENERAL ASSEMBLY — infinite canvas photo wall (ported, trimmed to just
//    what this page needs: no tabs, no multiSelect, no feed-card machinery) ──

// ── SPECIMEN WIDTH SLIDER (was completely unwired — now controls the

// ── DESIGN SYSTEM: live page-preview cards (lazy-loaded, scaled thumbnails
//    that expand into a real, full-size, interactive iframe on click) ───────
// ── LIVE PREVIEW POOL — shared infrastructure for any "scaled live iframe
//    of another page" embed anywhere on the site (currently: the Design
//    System's Macro/Micro grids). Two guarantees this makes, independent
//    of how many places on the page ask for the same page's preview:
//      1. Dedup — at most one iframe ever exists per page id. If both a

//         live iframe, physically reparented into whichever container is
//         currently visible, rather than running two WebGL contexts.
//      2. Capped — a hard ceiling on how many of these can be alive at

// ── ACCORDION (Outlook's collapsible chapter sections) ──────────────────────
(function initLetterAccordion() {

// ── "NEVER HAVE I EVER" LIST TOGGLE (numbered / bulleted) ───────────────────
(function initNeverListToggle() {
  document.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-never-mode]');
    if (!btn) return;
    const group = btn.closest('[data-never-toggle-group]');
    if (!group) return;
    const list = group.parentElement.querySelector('[data-never-list]');
    if (!list) return;

    const mode = btn.dataset.neverMode; // 'numbered' | 'bulleted'
    list.classList.toggle('is-numbered', mode === 'numbered');
    list.classList.toggle('is-bulleted', mode === 'bulleted');

    group.querySelectorAll('[data-never-mode]').forEach(b => {
      b.classList.toggle('active', b === btn);
    });
  });
})();

// ── PAGE BACK-TO-TOP (Journal + Life) ────────────────────────────────────────
(function initPageBackToTop() {
  const btn = document.getElementById('pageBackToTop');
  if (!btn) return;

  const ELIGIBLE_VIEWS = ['about', 'contracts'];
  const NEAR_BOTTOM_PX = 240; // show once within this many px of the true bottom

  function update() {
    if (!ELIGIBLE_VIEWS.includes(currentView)) {
      btn.classList.remove('visible');
      return;
    }
    const doc = document.scrollingElement || document.documentElement;
    const nearBottom = (doc.scrollTop + window.innerHeight) >= (doc.scrollHeight - NEAR_BOTTOM_PX);
    btn.classList.toggle('visible', nearBottom);
  }

  window._updateBackToTop = update;
  window.addEventListener('scroll', update, { passive: true });
  window.addEventListener('resize', update);
  update();

  btn.addEventListener('click', () => {
    (document.scrollingElement || document.documentElement).scrollTo({ top: 0, behavior: 'smooth' });
  });
})();

// ── HOOP BACK-TO-TOP OVERLAY ─────────────────────────────────────────────────
(function hoopTopBtn() {
  const wrap = document.querySelector('.ic-hoop-wrap');
  const btn  = document.getElementById('ic-hoop-top');
  if (!wrap || !btn) return;

  const obs = new IntersectionObserver(entries => {
    btn.classList.toggle('visible', entries[0].isIntersecting);
  }, { threshold: 0.1 });
  obs.observe(wrap);

  btn.addEventListener('click', () => {
    (document.scrollingElement || document.documentElement).scrollTo({ top: 0, behavior: 'smooth' });
  });
})();

// ── HASH BOOT (lets this file be embedded in an iframe and jump straight to
//    a specific page via foundry.html#work, foundry.html#balance, etc. —
//    used by the Design System page's live page-preview thumbnails) ────────
(function bootFromHash() {
  const id = (location.hash || '').replace('#', '');
  if (id && VIEWS[id] && id !== 'index') showView(id);
})();

<script type="module">
// ── CONTACT: glass ice-tray scene, ported as-is (drag/throw physics,
//    baked-in material/lights, per-facet RectAreaLight rig). The LinkedIn
//    text is a real mesh in the scene (not DOM overlay), so the cubes
//    actually distort/refract it; raycasting drives hover (cursor + a
//    matching 3D underline) and click (opens LinkedIn in a new tab).
//    Only simulates/renders while the Contact view is actually active.
import * as THREE from "three";
import { RoundedBoxGeometry } from "jsm/geometries/RoundedBoxGeometry.js";
import { RectAreaLightUniformsLib } from "jsm/lights/RectAreaLightUniformsLib.js";
import { FontLoader } from "jsm/loaders/FontLoader.js";
import { TextGeometry } from "jsm/geometries/TextGeometry.js";

const canvas = document.getElementById('contactWebgl');
if (canvas) {
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(75, 1, 0.1, 1000);
  camera.position.z = 5;

  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });

  function resize() {
    const w = canvas.clientWidth || window.innerWidth;
    const h = canvas.clientHeight || window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(w, h, false);
    layoutFacetLights();
    clampSizeScale();
    for (const cube of cubes) applyScale(cube);
  }

  // ── LinkedIn text: real 3D mesh so the cubes distort it ──────────────
  const LINKEDIN_URL = "https://linkedin.com/in/zackgort";
  const TEXT_Z = -2;
  let linkMesh = null;
  let underlineMesh = null;
  let linkHovered = false;

  const fontLoader = new FontLoader();
  fontLoader.load(
    "https://raw.githubusercontent.com/danielyl123/person/refs/heads/main/fonts/helvetiker_regular.typeface.json",
    (font) => {
      const textGeometry = new TextGeometry("in/zackgort", {
        font, size: 0.44, depth: 0, curveSegments: 5,
        bevelEnabled: true, bevelThickness: 0, bevelSize: 0, bevelOffset: 0, bevelSegments: 4,
      });
      textGeometry.computeBoundingBox();
      textGeometry.center();
      const bbox = textGeometry.boundingBox;
      const textWidth = bbox.max.x - bbox.min.x;
      const textBottom = bbox.min.y;

      const textMaterial = new THREE.MeshBasicMaterial();
      linkMesh = new THREE.Mesh(textGeometry, textMaterial);
      linkMesh.position.z = TEXT_Z;
      scene.add(linkMesh);

      const underlineGeometry = new THREE.PlaneGeometry(textWidth, 0.018);
      const underlineMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff });
      underlineMesh = new THREE.Mesh(underlineGeometry, underlineMaterial);
      underlineMesh.position.set(0, textBottom - 0.06, TEXT_Z);
      underlineMesh.visible = false;
      scene.add(underlineMesh);
    }
  );

  // ── The tray: rounded-glass ice cubes ────────────────────────────────
  const TRAY_Z = 1;
  const CONFIG = { count: 38, sizeScale: 1.6 };
  const MIN_SIZE_SCALE = 0.5;
  const MAX_SIZE_SCALE_HARD_CAP = 1.6;
  const BASE_CUBE_SIZE = 0.9;

  const cubeGeometry = new RoundedBoxGeometry(BASE_CUBE_SIZE, BASE_CUBE_SIZE, BASE_CUBE_SIZE, 6, 0.1);
  const cubeMaterial = new THREE.MeshPhysicalMaterial();
  cubeMaterial.metalness = 0;
  cubeMaterial.roughness = 0;
  cubeMaterial.iridescence = 1;
  cubeMaterial.iridescenceIOR = 1.5;
  cubeMaterial.iridescenceThicknessRange = [100, 217];
  cubeMaterial.transmission = 1;
  cubeMaterial.ior = 1.75;
  cubeMaterial.thickness = 1.325;

  const ambientLight = new THREE.AmbientLight(0xffffff, 10);
  scene.add(ambientLight);
  [[-1, 2, 0], [-1, -2, 0], [1, -2, 0], [1, 2, 0]].forEach(([x, y, z]) => {
    const pl = new THREE.PointLight(0xffffff, 10);
    pl.position.set(x, y, z);
    scene.add(pl);
  });

  RectAreaLightUniformsLib.init();
  const FACET_LIGHT_INTENSITY = 3.1;
  function makeFacetLight(color) {
    const light = new THREE.RectAreaLight(color, FACET_LIGHT_INTENSITY, 1, 1);
    scene.add(light);
    return light;
  }
  const bottomLight = makeFacetLight(0xffffff);
  const topLight = makeFacetLight(0xffffff);
  const leftLight = makeFacetLight(0xffffff);
  const rightLight = makeFacetLight(0xffffff);
  const facetLights = [bottomLight, topLight, leftLight, rightLight];

  function getBoundsAtDepth(depthZ) {
    const distance = camera.position.z - depthZ;
    const vFov = (camera.fov * Math.PI) / 180;
    const height = 2 * Math.tan(vFov / 2) * distance;
    const width = height * camera.aspect;
    return { halfW: width / 2, halfH: height / 2 };
  }

  function layoutFacetLights() {
    const { halfW, halfH } = getBoundsAtDepth(TRAY_Z);
    const margin = 0.4;
    bottomLight.width = halfW * 2; bottomLight.height = 0.6;
    bottomLight.position.set(0, -halfH - margin, TRAY_Z); bottomLight.lookAt(0, 0, TRAY_Z);
    topLight.width = halfW * 2; topLight.height = 0.6;
    topLight.position.set(0, halfH + margin, TRAY_Z); topLight.lookAt(0, 0, TRAY_Z);
    leftLight.width = 0.6; leftLight.height = halfH * 2;
    leftLight.position.set(-halfW - margin, 0, TRAY_Z); leftLight.lookAt(0, 0, TRAY_Z);
    rightLight.width = 0.6; rightLight.height = halfH * 2;
    rightLight.position.set(halfW + margin, 0, TRAY_Z); rightLight.lookAt(0, 0, TRAY_Z);
  }

  const cubes = [];

  function radiusForCube(cube) {
    const effectiveSize = BASE_CUBE_SIZE * cube.jitter * CONFIG.sizeScale;
    return (effectiveSize / 2) * Math.SQRT2;
  }
  function maxSizeScaleForTray() {
    const { halfW, halfH } = getBoundsAtDepth(TRAY_Z);
    const trayArea = halfW * 2 * (halfH * 2);
    const n = Math.max(cubes.length, 1);
    const perCubeAreaAtScale1 = BASE_CUBE_SIZE * BASE_CUBE_SIZE;
    const packingBudget = trayArea * 0.55;
    const scaleForBudget = Math.sqrt(packingBudget / (n * perCubeAreaAtScale1));
    return THREE.MathUtils.clamp(scaleForBudget, MIN_SIZE_SCALE, MAX_SIZE_SCALE_HARD_CAP);
  }
  function clampSizeScale() {
    CONFIG.sizeScale = THREE.MathUtils.clamp(CONFIG.sizeScale, MIN_SIZE_SCALE, maxSizeScaleForTray());
  }
  function applyScale(cube) {
    const s = cube.jitter * CONFIG.sizeScale;
    cube.group.scale.setScalar(s);
    cube.radius = radiusForCube(cube);
    cube.mass = Math.pow(s, 3);
  }
  function spawnCube() {
    const group = new THREE.Group();
    group.position.z = TRAY_Z;
    const mesh = new THREE.Mesh(cubeGeometry, cubeMaterial);
    group.add(mesh);
    scene.add(group);
    const cube = { group, jitter: 0.8 + Math.random() * 0.4, velocity: new THREE.Vector2(0, 0), angularVelocity: 0, radius: 0, mass: 1 };
    applyScale(cube);
    const { halfW, halfH } = getBoundsAtDepth(TRAY_Z);
    const limX = Math.max(halfW - cube.radius, 0);
    const limY = Math.max(halfH - cube.radius, 0);
    group.position.x = (Math.random() * 2 - 1) * limX;
    group.position.y = (Math.random() * 2 - 1) * limY;
    cubes.push(cube);
  }
  function removeCube() {
    const cube = cubes.pop();
    if (cube) scene.remove(cube.group);
  }
  function setCubeCount(n) {
    n = Math.max(1, Math.round(n));
    while (cubes.length < n) spawnCube();
    while (cubes.length > n) removeCube();
    clampSizeScale();
    for (const cube of cubes) applyScale(cube);
  }
  setCubeCount(CONFIG.count);
  resize();
  new ResizeObserver(resize).observe(canvas);
  window.addEventListener('resize', resize);

  // ── Drag / throw physics ──────────────────────────────────────────────
  const raycaster = new THREE.Raycaster();
  const pointerNDC = new THREE.Vector2();
  const dragPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), -TRAY_Z);
  const dragOffset = new THREE.Vector3();
  const intersection = new THREE.Vector3();

  let draggedCube = null;
  let lastPointerTime = 0;
  const sampleVelocity = new THREE.Vector2(0, 0);

  const FRICTION = 0.85;
  const ANGULAR_FRICTION = 0.9;
  const RESTITUTION = 0.82;
  const MIN_SPEED = 0.02;

  function updatePointerNDC(event) {
    const rect = canvas.getBoundingClientRect();
    pointerNDC.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
    pointerNDC.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
  }
  function getPointOnDragPlane() {
    raycaster.setFromCamera(pointerNDC, camera);
    raycaster.ray.intersectPlane(dragPlane, intersection);
    return intersection;
  }

  canvas.addEventListener('pointerdown', (event) => {
    if (!document.getElementById('view-contact').classList.contains('active')) return;
    updatePointerNDC(event);
    raycaster.setFromCamera(pointerNDC, camera);
    const meshes = cubes.map((c) => c.group.children[0]);
    const hits = raycaster.intersectObjects(meshes);
    if (hits.length === 0) return;

    const hitMesh = hits[0].object;
    draggedCube = cubes.find((c) => c.group.children[0] === hitMesh);
    if (!draggedCube) return;

    canvas.style.cursor = 'grabbing';
    draggedCube.velocity.set(0, 0);
    draggedCube.angularVelocity = 0;

    const point = getPointOnDragPlane();
    dragOffset.copy(draggedCube.group.position).sub(point);
    lastPointerTime = performance.now();
    sampleVelocity.set(0, 0);
    canvas.setPointerCapture(event.pointerId);
  });

  canvas.addEventListener('pointermove', (event) => {
    if (!draggedCube) return;
    updatePointerNDC(event);
    const point = getPointOnDragPlane();
    const now = performance.now();
    const dt = Math.max((now - lastPointerTime) / 1000, 1 / 120);
    const newPos = point.clone().add(dragOffset);
    const dx = newPos.x - draggedCube.group.position.x;
    const dy = newPos.y - draggedCube.group.position.y;
    draggedCube.group.position.x = newPos.x;
    draggedCube.group.position.y = newPos.y;
    sampleVelocity.x = sampleVelocity.x * 0.6 + (dx / dt) * 0.4;
    sampleVelocity.y = sampleVelocity.y * 0.6 + (dy / dt) * 0.4;
    draggedCube.angularVelocity = draggedCube.angularVelocity * 0.6 + (-dx / dt) * 0.15 * 0.4;
    lastPointerTime = now;
  });

  function endDrag(event) {
    if (!draggedCube) return;
    canvas.style.cursor = 'grab';
    draggedCube.velocity.copy(sampleVelocity);
    draggedCube = null;
    if (event && canvas.hasPointerCapture(event.pointerId)) {
      canvas.releasePointerCapture(event.pointerId);
    }
  }
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);
  canvas.addEventListener('pointerleave', (event) => { if (event.buttons === 0) endDrag(event); });
  canvas.style.cursor = 'grab';

  // ── LinkedIn text hover/click ──────────────────────────────────────────
  function updateLinkHover(event) {
    if (!linkMesh || draggedCube) {
      if (linkHovered) {
        linkHovered = false;
        if (underlineMesh) underlineMesh.visible = false;
        if (!draggedCube) canvas.style.cursor = 'grab';
      }
      return;
    }
    updatePointerNDC(event);
    raycaster.setFromCamera(pointerNDC, camera);
    const hits = raycaster.intersectObject(linkMesh);
    const hovered = hits.length > 0;
    if (hovered !== linkHovered) {
      linkHovered = hovered;
      if (underlineMesh) underlineMesh.visible = hovered;
      canvas.style.cursor = hovered ? 'pointer' : 'grab';
    }
  }
  canvas.addEventListener('pointermove', updateLinkHover);
  canvas.addEventListener('click', (event) => {
    if (!linkMesh || draggedCube) return;
    updatePointerNDC(event);
    raycaster.setFromCamera(pointerNDC, camera);
    const hits = raycaster.intersectObject(linkMesh);
    if (hits.length > 0) window.open(LINKEDIN_URL, '_blank', 'noopener');
  });

  // ── Scroll wheel: quantity/density; shift+scroll resizes ──────────────
  canvas.addEventListener('wheel', (event) => {
    if (!document.getElementById('view-contact').classList.contains('active')) return;
    event.preventDefault();
    if (event.shiftKey) {
      const delta = -event.deltaY * 0.0015;
      CONFIG.sizeScale = THREE.MathUtils.clamp(CONFIG.sizeScale + delta, MIN_SIZE_SCALE, maxSizeScaleForTray());
      for (const cube of cubes) applyScale(cube);
    } else {
      const delta = -event.deltaY * 0.02;
      CONFIG.count = THREE.MathUtils.clamp(Math.round(CONFIG.count + delta), 1, 40);
      setCubeCount(CONFIG.count);
    }
  }, { passive: false });

  // ── Pairwise collision resolution ──────────────────────────────────────
  function resolveCollisions() {
    for (let i = 0; i < cubes.length; i++) {
      for (let j = i + 1; j < cubes.length; j++) {
        const a = cubes[i], b = cubes[j];
        let dx = b.group.position.x - a.group.position.x;
        let dy = b.group.position.y - a.group.position.y;
        let dist = Math.sqrt(dx * dx + dy * dy);
        const minDist = a.radius + b.radius;
        if (dist >= minDist) continue;
        if (dist === 0) {
          const angle = Math.random() * Math.PI * 2;
          dx = Math.cos(angle); dy = Math.sin(angle); dist = 0.0001;
        }
        const nx = dx / dist, ny = dy / dist;
        const overlap = minDist - dist;
        const totalMass = a.mass + b.mass;
        const pushA = overlap * (b.mass / totalMass);
        const pushB = overlap * (a.mass / totalMass);
        if (a !== draggedCube) { a.group.position.x -= nx * pushA; a.group.position.y -= ny * pushA; }
        if (b !== draggedCube) { b.group.position.x += nx * pushB; b.group.position.y += ny * pushB; }
        const rvx = b.velocity.x - a.velocity.x, rvy = b.velocity.y - a.velocity.y;
        const velAlongNormal = rvx * nx + rvy * ny;
        if (velAlongNormal > 0) continue;
        const e = RESTITUTION;
        const jImpulse = (-(1 + e) * velAlongNormal) / (1 / a.mass + 1 / b.mass);
        const impulseX = jImpulse * nx, impulseY = jImpulse * ny;
        a.velocity.x -= impulseX / a.mass; a.velocity.y -= impulseY / a.mass;
        b.velocity.x += impulseX / b.mass; b.velocity.y += impulseY / b.mass;
        const tangent = -nx * impulseY + ny * impulseX;
        a.angularVelocity -= tangent * 0.05;
        b.angularVelocity += tangent * 0.05;
      }
    }
  }

  const clock = new THREE.Clock();
  function tick() {
    const dt = Math.min(clock.getDelta(), 1 / 30);
    const isContactActive = document.getElementById('view-contact').classList.contains('active');

    if (isContactActive) {
      const { halfW, halfH } = getBoundsAtDepth(TRAY_Z);
      for (const cube of cubes) {
        if (cube !== draggedCube) {
          cube.group.position.x += cube.velocity.x * dt;
          cube.group.position.y += cube.velocity.y * dt;
          const limX = Math.max(halfW - cube.radius, 0);
          const limY = Math.max(halfH - cube.radius, 0);
          if (cube.group.position.x > limX) { cube.group.position.x = limX; cube.velocity.x *= -RESTITUTION; cube.angularVelocity += cube.velocity.x * 0.2; }
          else if (cube.group.position.x < -limX) { cube.group.position.x = -limX; cube.velocity.x *= -RESTITUTION; cube.angularVelocity += cube.velocity.x * 0.2; }
          if (cube.group.position.y > limY) { cube.group.position.y = limY; cube.velocity.y *= -RESTITUTION; }
          else if (cube.group.position.y < -limY) { cube.group.position.y = -limY; cube.velocity.y *= -RESTITUTION; }
          const linDamp = Math.pow(FRICTION, dt * 60);
          cube.velocity.multiplyScalar(linDamp);
          if (cube.velocity.length() < MIN_SPEED) cube.velocity.set(0, 0);
        }
        const angDamp = Math.pow(ANGULAR_FRICTION, dt * 60);
        cube.angularVelocity *= angDamp;
        if (Math.abs(cube.angularVelocity) < 0.001) cube.angularVelocity = 0;
        cube.group.rotation.z += cube.angularVelocity * dt;
      }
      resolveCollisions();
      renderer.render(scene, camera);
    }

    requestAnimationFrame(tick);
  }
  tick();
}
</script>
