<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Zack Gort — Contact</title>
<link rel="icon" type="image/webp" href="https://raw.githubusercontent.com/ZACKGORT/ZACKGORT/main/favicon.webp">
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,300;1,400&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700;1,900&family=Space+Grotesk:wght@300;400;500;700&family=Syne:wght@400;600;700;800&family=Bebas+Neue&family=DM+Serif+Display:ital@0;1&family=Outfit:wght@900&family=Anton&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;0,9..144,900;1,9..144,400;1,9..144,600&display=swap" rel="stylesheet">

    "jsm/": "https://cdn.jsdelivr.net/npm/three@0.182.0/examples/jsm/"

}

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.module.js",
    "jsm/": "https://cdn.jsdelivr.net/npm/three@0.182.0/examples/jsm/"
  }
}
</script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0a;
  --fg:#ffffff;
  --fg-rgb:255,255,255;
  --nav-bg-rgb:10,10,10;
  --rule:rgba(255,255,255,.1);
  --faint:rgba(255,255,255,.06);
  --muted:rgba(255,255,255,.28);
  --accent:#FF3C1F;
  --nav-h:38px;
  --bc-h:28px;
  --font:'Inter','Helvetica Neue',Helvetica,Arial,sans-serif;
  --work-font-size:clamp(22px,3.6vw,48px);
  --work-align:left;

  /* ── FLUID TYPE RAMP ──────────────────────────────────────────────
     --scale-mult is set by the toolbar JS (tbApplySize), 1 = default.
     Every rung is clamp(mobile-floor, scaled-and-viewport-fluid,
     desktop-ceiling): the scaler always has a visible effect, nothing
     can overflow a narrow viewport regardless of scaler position, and
     it still flexes with viewport width before the user touches anything. */
  --scale-mult: 1;
  /* display & heading scale with slider; everything else is viewport-fluid but fixed */
  --fs-display: clamp(28px, calc(4.4vw * var(--scale-mult)), 64px);
  --fs-heading: clamp(18px, calc(2.6vw * var(--scale-mult)), 34px);
  --fs-subhead: clamp(14px, 1.7vw, 20px);
  --fs-body:    clamp(13px, 1.05vw, 16px);
  --fs-caption: clamp(11px, 0.85vw, 13px);
  --fs-micro:   clamp(8px,  0.6vw, 10px);
  --fs-nano:    clamp(7px,  0.52vw, 8.5px);
}
@media(max-width:640px){
  :root{
    --fs-display: clamp(26px, calc(9vw * var(--scale-mult)), 52px);
    --fs-heading: clamp(18px, calc(6vw * var(--scale-mult)), 28px);
    --fs-subhead: clamp(14px, 4.2vw, 18px);
    --fs-body:    clamp(13px, 3.6vw, 15px);
    --fs-caption: clamp(11px, 3.1vw, 12.5px);
    --fs-micro:   clamp(8px,  2.6vw, 9.5px);
    --fs-nano:    clamp(7px,  2.3vw, 8px);
  }
}
body.light-mode{
  --bg:#ffffff;
  --fg:#0a0a0a;
  --fg-rgb:10,10,10;
  --nav-bg-rgb:244,241,235;
  --rule:rgba(0,0,0,.1);
  --faint:rgba(0,0,0,.05);
  --muted:rgba(0,0,0,.4);
  --accent:#FF3C1F;
}
html{scroll-behavior:smooth}
body{font-family:var(--font);background:var(--bg);color:var(--fg);overflow-x:hidden;cursor:none;-webkit-font-smoothing:antialiased}

/* ── CURSOR ── */
#cursor{position:fixed;width:8px;height:8px;background:var(--fg);border-radius:50%;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);opacity:0;transition:width .14s,height .14s,opacity .2s,background .2s;left:-20px;top:-20px}
#cursor.vis{opacity:1}
#cursor.lg{width:32px;height:32px;background:rgba(var(--fg-rgb),.18)}

/* ── PAGE TRANSITION WIPE ── */
#wipe{position:fixed;inset:0;background:var(--bg);z-index:8000;transform:translateY(100%);pointer-events:none}
#wipe.in{transform:translateY(0);transition:transform .42s cubic-bezier(.76,0,.24,1)}
#wipe.out{transform:translateY(-100%);transition:transform .42s cubic-bezier(.76,0,.24,1) .05s}

/* ── VIEWS ── */
.view{display:none;min-height:100vh}
.view.active{display:block}

/* ══════════════════════════════════════════
   SHARED NAV
══════════════════════════════════════════ */
.fs-nav{
  position:fixed;top:0;left:0;right:0;z-index:200;
  height:var(--nav-h);display:flex;align-items:center;
  border-bottom:1px solid var(--rule);
  background:rgba(var(--nav-bg-rgb),.96);backdrop-filter:blur(12px);
  padding:0 16px;gap:0
}
.nav-wordmark{
  font-size:10px;font-weight:700;letter-spacing:-.01em;color:var(--fg);
  white-space:nowrap;margin-right:20px;flex-shrink:0;cursor:none;
  line-height:1;display:inline-flex;align-items:center;gap:0;
}
.nav-wordmark sup{font-size:6px;font-weight:500;vertical-align:super;opacity:.5}
.nav-logo{display:flex;align-items:center;margin-right:16px;flex-shrink:0;cursor:none}
.nav-logo img{height:24px;width:auto;display:block;object-fit:contain}
.nav-wordmark img{height:32px;width:auto;display:block;object-fit:contain}
.nav-tabs{display:flex;align-items:center;gap:2px;flex:1}
.nav-tab{height:24px;padding:0 12px;font-size:var(--fs-micro);font-weight:600;letter-spacing:.04em;color:rgba(var(--fg-rgb),.4);border-radius:3px;display:flex;align-items:center;cursor:none;transition:color .15s,background .15s;white-space:nowrap;text-decoration:none;border:none;background:none}
.nav-tab:hover{color:rgba(var(--fg-rgb),.7)}
.nav-tab.active{background:var(--fg);color:var(--bg)}
.nav-right{display:flex;align-items:center;gap:14px;margin-left:auto;flex-shrink:0}
.nav-right-link{font-size:var(--fs-micro);font-weight:500;letter-spacing:.06em;color:rgba(var(--fg-rgb),.3);cursor:none;text-decoration:none;white-space:nowrap;transition:color .15s}
.nav-link-short{display:none}
.nav-right-link:hover{color:var(--fg)}
.nav-cta{height:24px;padding:0 12px;font-size:var(--fs-micro);font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--bg);background:var(--fg);border:none;border-radius:3px;cursor:none;white-space:nowrap;display:flex;align-items:center;gap:6px;text-decoration:none;transition:opacity .15s}
.nav-cta-icon{display:none;flex-shrink:0}
.nav-cta:hover{opacity:.82}

/* ── BREADCRUMB ── */
.fs-bc{
  position:fixed;top:var(--nav-h);left:0;right:0;z-index:199;
  height:var(--bc-h);display:flex;align-items:center;
  padding:0 16px;gap:8px;
  border-bottom:1px solid var(--faint);
  background:rgba(var(--nav-bg-rgb),.96);backdrop-filter:blur(12px);
  font-size:var(--fs-micro);font-weight:500;letter-spacing:.04em;color:var(--muted);
  overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch;scrollbar-width:none;
}
.fs-bc::-webkit-scrollbar{display:none}
.bc-btn{cursor:none;transition:color .15s;background:none;border:none;color:inherit;font:inherit;letter-spacing:inherit}
.bc-btn:hover{color:rgba(var(--fg-rgb),.6)}
.bc-sep{opacity:.3}
.bc-active{color:rgba(var(--fg-rgb),.55)}

/* ── PAGE BODY OFFSET ── */
.page-body{padding-top:calc(var(--nav-h) + var(--bc-h))}

/* ══════════════════════════════════════════
   INDEX PAGE
══════════════════════════════════════════ */
#view-index{}

/* Image-text portrait hero */
#hero{position:relative;width:100%;overflow:hidden;background:var(--bg);display:block}
#hero-canvas,#hero-cc{position:absolute;top:0;left:0;width:100%;height:100%;display:block;opacity:0;transition:opacity .7s ease}
#hero-canvas.loaded,#hero-cc.loaded{opacity:1}
#hero-cc{pointer-events:none;z-index:2}
#hero-loading{
  position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;
  background:var(--bg);z-index:10;
  font-family:'DM Mono',monospace;font-size:var(--fs-micro);letter-spacing:.25em;text-transform:uppercase;
  color:var(--fg);opacity:.4;transition:opacity .6s;
}
#hero-loading.hidden{opacity:0;pointer-events:none}

/* Work index grid */
.testimonials{border-top:1px solid var(--rule);display:grid;grid-template-columns:1fr 1fr;gap:0}
.testimonial{padding:40px 32px;border-right:1px solid var(--rule)}
.testimonial:last-child{border-right:none}
.testimonial-quote{font-size:clamp(14px,1.4vw,18px);line-height:1.75;color:rgba(var(--fg-rgb),.7);margin-bottom:28px;font-style:italic}
.testimonial-attr{display:flex;flex-direction:column;gap:4px}
.testimonial-name{font-size:var(--fs-micro);font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--fg)}
.testimonial-role{font-size:var(--fs-nano);color:rgba(var(--fg-rgb),.35);line-height:1.5}
.testimonial-context{font-size:var(--fs-nano);color:rgba(var(--fg-rgb),.25);margin-top:6px;letter-spacing:.02em}
@media(max-width:640px){
  .testimonials{grid-template-columns:1fr}
  .testimonial{border-right:none;border-bottom:1px solid var(--rule)}
  .testimonial:last-child{border-bottom:none}
}


.work-row{
  border-top:1px solid var(--rule);
  display:grid;
  grid-template-columns:40px 1fr auto;
  align-items:center;
  padding:48px 24px;
  min-height:160px;
  cursor:none;
  transition:background .18s;
  gap:20px;
  position:relative;
  overflow:visible;
}
.work-row:hover{background:rgba(var(--fg-rgb),.03)}
.work-row:first-child{border-top:none}

.wr-num{font-size:var(--fs-micro);font-weight:700;letter-spacing:.08em;color:rgba(var(--fg-rgb),.18);font-variant-numeric:tabular-nums;flex-shrink:0;padding-top:4px;align-self:start}
.wr-left{display:flex;flex-direction:column;gap:12px}
.wr-client{font-size:var(--work-font-size);font-weight:900;letter-spacing:-.02em;line-height:1.05;color:var(--fg);transition:color .18s;text-align:var(--work-align,left)}
.work-row:hover .wr-client{color:var(--fg)}
.wr-sub{font-size:var(--wr-sub-size,8px);font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:rgba(var(--fg-rgb),.25)}
.wr-client-sub{
  font-size:calc(var(--work-font-size) * .38);
  font-weight:400;
  line-height:1.4;
  letter-spacing:0;
  text-transform:none;
  color:rgba(var(--fg-rgb),.4);
  text-align:var(--work-align,left);
}

.wr-sub-wrap{position:relative;display:inline-flex;align-items:center;gap:6px}
.wr-sub-wrap .wr-sub{cursor:default}
.wr-sub-badge{
  display:inline-flex;align-items:center;justify-content:center;
  width:14px;height:14px;border-radius:50%;
  border:1px solid rgba(var(--fg-rgb),.2);
  font-size:var(--fs-nano);font-weight:700;letter-spacing:0;
  color:rgba(var(--fg-rgb),.35);
  flex-shrink:0;cursor:default;
  transition:border-color .15s,color .15s;
}
.work-row:hover .wr-sub-badge{border-color:rgba(var(--fg-rgb),.6);color:var(--fg)}
/* ── LIGHTBULB TRIGGER + POSTER TOOLTIP ── */
.wr-bulb{
  position:absolute;
  bottom:16px;right:20px;
  width:36px;height:36px;
  display:flex;align-items:center;justify-content:center;
  border-radius:50%;
  border:1px solid rgba(var(--fg-rgb),.18);
  color:rgba(var(--fg-rgb),.25);
  cursor:default;
  transition:border-color .15s,color .15s,background .15s;
  z-index:10;
  flex-shrink:0;
}
.wr-bulb svg{width:18px;height:18px;display:block}
.work-row:hover .wr-bulb{border-color:rgba(var(--fg-rgb),.45);color:rgba(var(--fg-rgb),.65)}
.wr-bulb:hover,.wr-bulb.active{
  border-color:var(--fg);color:var(--fg);
  background:rgba(var(--fg-rgb),.05);
}
.wr-tooltip{
  position:absolute;
  bottom:60px;
  right:12px;
  width:clamp(280px, 28vw, 480px);
  background:var(--bg);
  border:1px solid rgba(var(--fg-rgb),.14);
  pointer-events:none;
  opacity:0;
  transition:opacity .18s ease,transform .18s ease;
  z-index:500;
  border-radius:1px;
  box-shadow:0 24px 64px rgba(0,0,0,.32);
  transform:translateY(8px);
  overflow:hidden;
}
.wr-tooltip .tip-thumb{
  display:block;
  width:100%;
  height:clamp(160px, 18vw, 300px);
  object-fit:cover;
  object-position:center top;
  border-bottom:1px solid rgba(var(--fg-rgb),.08);
  transition:opacity .2s ease;
}
.wr-tooltip .tip-thumb:not([src]),
.wr-tooltip .tip-thumb[src=""]{
  display:none;
}

.wr-tooltip .tip-head{
  display:block;
  font-size:var(--tip-head-size,7px);font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:rgba(var(--fg-rgb),.3);
  padding:14px 16px 0;
  line-height:1;
}
.wr-tooltip .tip-title{
  display:block;
  font-size:var(--tip-title-size,20px);font-weight:900;letter-spacing:-.03em;line-height:1.08;
  color:var(--fg);
  padding:6px 16px 0;
}
.wr-tooltip .tip-rule{
  display:block;
  height:1px;
  background:rgba(var(--fg-rgb),.1);
  margin:14px 16px 0;
}
.wr-tooltip .tip-body{
  display:block;
  font-size:var(--tip-body-size,10px);font-weight:400;letter-spacing:.01em;line-height:1.7;
  color:rgba(var(--fg-rgb),.55);
  padding:12px 16px 0;
}
.wr-tooltip .tip-body strong{font-weight:700;color:var(--fg)}
.wr-tooltip .tip-body em{font-style:italic;color:rgba(var(--fg-rgb),.35)}
.wr-tooltip .tip-foot{
  display:block;
  font-size:var(--tip-foot-size,8px);font-weight:500;letter-spacing:.02em;font-style:italic;
  color:rgba(var(--fg-rgb),.28);
  padding:12px 16px 16px;
  border-top:1px solid rgba(var(--fg-rgb),.07);
  margin-top:12px;
}
.wr-tooltip.visible{opacity:1;transform:translateY(0)}
.wr-meta{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0}
.wr-type{font-size:var(--fs-micro);font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:rgba(var(--fg-rgb),.25)}
.wr-year{font-size:var(--fs-micro);font-weight:700;color:rgba(var(--fg-rgb),.18)}
.wr-arrow{font-size:16px;color:rgba(var(--fg-rgb),.18);transition:color .18s,transform .18s;margin-left:16px}
.work-row:hover .wr-arrow{color:var(--fg);transform:translateX(4px)}

.work-row-career{
  border-top:1px solid var(--rule);
  display:flex;align-items:center;justify-content:space-between;
  padding:32px 16px;cursor:none;
  transition:background .18s;
}
.work-row-career:hover{background:rgba(var(--fg-rgb),.03)}
.wrc-label{font-size:var(--fs-micro);font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:rgba(var(--fg-rgb),.2)}
.wrc-title{font-size:clamp(18px,2.8vw,36px);font-weight:700;letter-spacing:-.02em;color:rgba(var(--fg-rgb),.45);transition:color .18s}
.work-row-career:hover .wrc-title{color:var(--fg)}
.wrc-arrow{font-size:14px;color:rgba(var(--fg-rgb),.18);transition:color .18s,transform .18s}
.work-row-career:hover .wrc-arrow{color:var(--fg);transform:translateX(4px)}

/* ── FOOTER TWO-COL ── */
.index-contact-wrap{
  border-top:1px solid var(--rule);
  display:grid;
  grid-template-columns:minmax(0,1fr) 10px minmax(0,var(--ic-split, 1fr));
  grid-template-rows:640px;
  --footer-size:11px;
}
.index-contact{
  padding:0;
  display:flex;flex-direction:column;
  border-right:1px solid var(--rule);
  overflow:hidden;
}
.index-contact-webgl{
  position:relative;
  width:100%;height:100%;
  background:#000;
  overflow:hidden;
}
.index-contact-canvas{
  position:absolute;top:0;left:0;
  width:100%;height:100%;
  display:block;
  touch-action:none;
}
.ic-left{font-size:var(--footer-size);font-weight:600;letter-spacing:.04em;color:rgba(var(--fg-rgb),.45)}
.ic-disclaimer{font-size:calc(var(--footer-size) * 0.82);font-weight:400;letter-spacing:.02em;color:rgba(var(--fg-rgb),.3);font-style:italic;line-height:1.9}
.ic-disclaimer a{color:rgba(var(--fg-rgb),.5);text-decoration:none;cursor:none;transition:color .15s}
.ic-disclaimer a:hover{color:var(--fg)}
.typoe-tip{position:relative;cursor:default;border-bottom:1px dotted rgba(var(--fg-rgb),.25)}
.typoe-wink{
  position:absolute;
  bottom:calc(100% + 6px);
  left:50%;
  transform:translateX(-50%) scale(.6);
  font-size:18px;
  font-style:normal;
  pointer-events:none;
  opacity:0;
  transition:opacity .15s ease, transform .15s ease;
  line-height:1;
  filter:grayscale(0);
}
.typoe-tip:hover .typoe-wink{opacity:1;transform:translateX(-50%) scale(1)}
.ic-links{display:flex;gap:20px;flex-wrap:wrap}
.ic-links a{font-size:var(--footer-size);font-weight:600;letter-spacing:.06em;color:rgba(var(--fg-rgb),.4);text-decoration:none;cursor:none;transition:color .15s}
.ic-links a:hover{color:var(--fg)}
.ic-footer-toolbar{
  display:flex;align-items:center;gap:8px;
  padding-top:14px;border-top:1px solid var(--faint);
  margin-top:auto;
}
.ic-footer-label{font-size:var(--fs-nano);font-weight:600;letter-spacing:.08em;color:rgba(var(--fg-rgb),.2);white-space:nowrap;text-transform:uppercase}
.ic-footer-slider{-webkit-appearance:none;appearance:none;width:80px;height:1px;background:rgba(var(--fg-rgb),.2);outline:none;cursor:none}
.ic-footer-slider::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;border-radius:50%;background:var(--fg);cursor:none}

/* ── HOOP IFRAME FOOTER ── */
.ic-hoop-wrap{
  position:relative;
  overflow:hidden;
  background:var(--bg);
}
.ic-hoop-label{
  position:absolute;top:0;left:0;
  font-size:var(--fs-nano);font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  color:rgba(var(--fg-rgb),.18);
  padding:8px 16px;
  z-index:2;
  pointer-events:none;
  user-select:none;
}
.ic-hoop-frame{
  display:block;
  width:960px;
  height:720px;
  border:none;
  background:transparent;
  position:absolute;
  top:0;left:0;
  transform-origin:top left;
  pointer-events:auto;
}
.ic-hoop-top{
  position:absolute;bottom:24px;right:24px;z-index:10;
  font-family:inherit;font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  color:#0a0a0a;background:#ffffff;
  border:none;border-radius:50%;
  width:72px;height:72px;
  display:flex;align-items:center;justify-content:center;
  cursor:none;
  opacity:0;pointer-events:none;
  transition:opacity .35s ease, transform .2s ease;
  box-shadow:0 4px 24px rgba(0,0,0,.55);
  white-space:nowrap;
}
.ic-hoop-top.visible{opacity:1;pointer-events:auto}
.ic-hoop-top:hover{transform:scale(1.08)}

/* ── PAGE BACK-TO-TOP (Journal + Life) — shows once you're near the
   bottom of the page, hidden everywhere else ── */
.page-back-to-top{
  position:fixed;bottom:24px;right:24px;z-index:410;
  font-family:inherit;font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  color:var(--bg);background:var(--fg);
  border:none;border-radius:50%;
  width:64px;height:64px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  opacity:0;pointer-events:none;transform:translateY(8px);
  transition:opacity .3s ease,transform .3s ease;
  box-shadow:0 4px 24px rgba(0,0,0,.4);
  white-space:nowrap;
}
.page-back-to-top.visible{opacity:1;pointer-events:auto;transform:translateY(0)}
.page-back-to-top:hover{transform:translateY(0) scale(1.08)}
@media(max-width:640px){
  .page-back-to-top{width:52px;height:52px;font-size:9px;bottom:16px;right:16px}
}

@media(max-width:640px){
  .index-contact-wrap{
    grid-template-columns:1fr;
    grid-template-rows:70vh;
  }
  .index-contact{
    border-right:none;
    padding:0;
    overflow-y:visible;
  }

.tl-tooltip{
  position:absolute;
  left:0;
  bottom:calc(100% + 4px);
  background:var(--bg);
  border:1px solid var(--rule);
  color:rgba(var(--fg-rgb),.7);
  font-size:calc(10px * var(--page-scale, 1));
  line-height:1.6;
  padding:8px 12px;
  max-width:420px;
  width:max-content;
  white-space:normal;
  pointer-events:none;
  opacity:0;
  transform:translateY(4px);
  transition:opacity .15s ease,transform .15s ease;
  z-index:100;
  border-radius:2px;
}
.tl-entry:hover .tl-tooltip{
  opacity:1;
  transform:translateY(0);
}

.fs-narrative{padding:32px 16px;border-bottom:1px solid var(--rule);display:grid;grid-template-columns:160px 1fr;gap:32px;align-items:start;background:var(--bg)}
.fs-narrative-label{font-size:var(--fs-nano);font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:rgba(var(--fg-rgb),.25);line-height:1.8;padding-top:2px}

/* ── NARRATIVE PARTICLE TEXT ── */
.fs-narrative-canvas-wrap{position:relative;width:100%;min-height:80px;cursor:default}
.fs-narrative-canvas-wrap canvas{display:block;width:100%}
.fs-narrative-sr{
  position:absolute;width:1px;height:1px;overflow:hidden;
  clip:rect(0,0,0,0);white-space:nowrap;
}

.cs-footer{border-top:1px solid var(--rule);padding:20px 16px;display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap}
.csf-left{font-size:var(--fs-micro);font-weight:600;letter-spacing:.04em;color:rgba(var(--fg-rgb),.22)}
.csf-nav{display:flex;gap:20px}
.csf-nav button{font-size:var(--fs-micro);font-weight:600;letter-spacing:.06em;color:rgba(var(--fg-rgb),.28);text-decoration:none;cursor:none;transition:color .15s;background:none;border:none;font-family:inherit}
.csf-nav button:hover{color:var(--fg)}

.reveal{opacity:0;transform:translateY(10px);transition:opacity .5s ease,transform .5s ease}
.reveal.in{opacity:1;transform:none}

/* ── WORK INDEX TOOLBAR ── */
.work-toolbar{
  display:flex;align-items:center;gap:0;
  padding:0 16px;height:32px;
  border-bottom:1px solid var(--rule);
  background:var(--bg);
  position:sticky;top:calc(var(--nav-h) + var(--bc-h));z-index:100;
}
.wt-size-label{font-size:var(--fs-micro);font-weight:700;letter-spacing:.02em;color:var(--fg);min-width:44px;font-variant-numeric:tabular-nums}
.wt-size-hint{font-size:var(--fs-nano);font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:rgba(var(--fg-rgb),.25);margin-right:14px;white-space:nowrap;transition:color .25s ease,text-shadow .25s ease}
.work-toolbar:hover .wt-size-hint,
.cs-toolbar:hover .wt-size-hint{
  color:var(--fg);
  text-shadow:0 0 10px rgba(var(--fg-rgb),.6);
}
.wt-chevron{font-size:var(--fs-micro);color:var(--muted);margin-right:8px;cursor:none;user-select:none}
.wt-slider{-webkit-appearance:none;appearance:none;width:160px;height:1px;background:rgba(var(--fg-rgb),.25);outline:none;cursor:none;margin-right:32px}
.wt-slider::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--fg);cursor:none;border:none}
.wt-align-group{display:flex;gap:14px;align-items:center;margin-right:auto}
.wt-align-btn{background:none;border:none;cursor:none;padding:0;display:flex;align-items:center;opacity:.3;transition:opacity .15s}
.wt-align-btn.active{opacity:1}
.wt-align-btn svg{width:16px;height:12px;fill:var(--fg)}
.wt-spacer{flex:1}
.wt-theme-group{display:flex;gap:10px;align-items:center;margin-right:24px}
.wt-theme-btn{width:16px;height:16px;border-radius:50%;border:1.5px solid transparent;cursor:none;transition:border-color .15s;flex-shrink:0}
.wt-theme-btn.dark-btn{background:#b8f5c0}
.wt-theme-btn.light-btn{background:transparent;border-color:rgba(128,128,128,.5);position:relative}
.wt-theme-btn.light-btn::after{content:'';position:absolute;inset:2px;border-radius:50%;background:linear-gradient(135deg,#fff 50%,#555 50%)}
.wt-theme-btn.active{outline:2px solid var(--fg);outline-offset:2px}
.wt-reset{font-size:var(--fs-micro);font-weight:700;letter-spacing:.04em;color:var(--fg);background:none;border:none;cursor:none;opacity:.5;transition:opacity .15s;white-space:nowrap}
.wt-reset:hover{opacity:1}

/* ── PER-PROJECT FONT SYSTEM ── */
[data-cs-font] .fs-weight-name,
[data-cs-font] .fs-specimen-headline,
[data-cs-font] .fs-glyph-hero,
[data-cs-font] .fs-glyph-cell,
[data-cs-font] .cs-hero-canvas-label {
  font-family: var(--cs-font);
}
#view-bny    { --cs-font: 'Playfair Display', serif; }
#view-gnc    { --cs-font: 'Syne', sans-serif; }
#view-hardinge { --cs-font: 'Bebas Neue', sans-serif; }
#view-kent   { --cs-font: 'Space Grotesk', sans-serif; }
#view-dana   { --cs-font: 'DM Serif Display', serif; }
#view-power  { --cs-font: 'Outfit', sans-serif; }
#view-wovn   { --cs-font: 'Anton', sans-serif; }

#view-bny .fs-weight-name,
#view-bny .fs-specimen-headline,
#view-bny .fs-glyph-hero { font-family: 'Playfair Display', serif; letter-spacing: -.01em; }

#view-gnc .fs-weight-name,
#view-gnc .fs-specimen-headline,
#view-gnc .fs-glyph-hero { font-family: 'Syne', sans-serif; letter-spacing: -.02em; }

#view-hardinge .fs-weight-name,
#view-hardinge .fs-specimen-headline,
#view-hardinge .fs-glyph-hero { font-family: 'Bebas Neue', sans-serif; letter-spacing: .04em; font-weight: 400; }

#view-kent .fs-weight-name,
#view-kent .fs-specimen-headline,
#view-kent .fs-glyph-hero { font-family: 'Space Grotesk', sans-serif; }

#view-dana .fs-weight-name,
#view-dana .fs-specimen-headline,
#view-dana .fs-glyph-hero { font-family: 'DM Serif Display', serif; font-weight: 400; }

#view-power .fs-weight-name,
#view-power .fs-specimen-headline,
#view-power .fs-glyph-hero { font-family: 'Outfit', sans-serif; font-weight: 900; letter-spacing: -.02em; }

#view-wovn .fs-weight-name,
#view-wovn .fs-specimen-headline,
#view-wovn .fs-glyph-hero { font-family: 'Anton', sans-serif; font-weight: 400; letter-spacing: .01em; }

.wr-font-bny    .wr-client{font-family:'Playfair Display',serif}
.wr-font-gnc    .wr-client{font-family:'Syne',sans-serif;font-weight:800;letter-spacing:-.01em}
.wr-font-hard   .wr-client{font-family:'Bebas Neue',sans-serif;font-weight:400;letter-spacing:.04em}
.wr-font-kent   .wr-client{font-family:'Space Grotesk',sans-serif;font-weight:700}
.wr-font-dana   .wr-client{font-family:'DM Serif Display',serif;font-weight:400}
.wr-font-power  .wr-client{font-family:'Outfit',sans-serif;font-weight:900;letter-spacing:-.02em}
.wr-font-wovn   .wr-client{font-family:'Anton',sans-serif;font-weight:400;letter-spacing:.01em}

@media(max-width:640px){
  .fs-nav{padding:0 10px;gap:0}
  .nav-wordmark{margin-right:10px}
  .nav-logo{margin-right:8px}
  .nav-tabs{gap:0;flex:1 1 0%;min-width:0;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .nav-tabs::-webkit-scrollbar{display:none}
  .nav-tab{padding:0 8px;flex-shrink:0}
  .nav-right{gap:6px;flex-shrink:0}
  .nav-right-link{white-space:nowrap;font-size:9px}
  .nav-link-short{display:none}
  .nav-cta{padding:0 8px}
  .nav-cta-icon{display:block}
  .nav-cta-full{display:none}
  .wr-tooltip{width:min(clamp(280px,28vw,480px), calc(100vw - 32px));right:0}
  .fs-glyph-cell[data-glyph-tip]::after{width:min(340px, calc(100vw - 32px));font-size:16px;padding:22px 22px 24px}
  .work-row{grid-template-columns:1fr;gap:8px;padding:20px 14px;min-height:unset}
  .wr-num{display:none}
  .wr-meta{align-items:flex-start}
  .wr-arrow{display:none}
  .work-toolbar{height:auto;padding:8px 14px;flex-wrap:wrap;gap:10px;top:calc(var(--nav-h) + var(--bc-h))}
  .wt-slider{width:120px}
  .wt-align-group{margin-left:0}
  .wt-spacer{display:none}
  .fs-glyphs{grid-template-columns:1fr}
  .fs-glyph-left{min-height:240px;padding:24px 16px}
  .fs-glyph-resizer{display:none}
  .fs-glyph-caption{left:16px;right:16px;bottom:12px}
  .fs-glyph-hero{font-size:clamp(100px,28vw,180px)}
  .fs-glyph-hero[data-glyph-len="2"]{font-size:clamp(56px,16vw,100px)}
  .fs-glyph-hero[data-glyph-len="3"]{font-size:clamp(38px,11vw,68px)}
  .fs-glyph-hero[data-glyph-len="4"]{font-size:clamp(28px,8vw,50px)}
  .fs-glyph-right{border-top:1px solid var(--rule)}
  .fs-glyph-grid{grid-template-columns:repeat(6,1fr)}
  .fs-glyph-cell{padding:10px 4px;font-size:11px}
  .fs-details{grid-template-columns:1fr}
  .fs-details-label-col{border-right:none;border-bottom:1px solid var(--rule)}
  .fs-details-body{grid-template-columns:1fr}
  .fs-narrative{grid-template-columns:1fr;gap:12px}
  .fs-specimen-body{columns:1}
  .fs-weight-row{grid-template-columns:1fr;min-height:unset}
  .fs-weight-add{display:none}
  .fs-weight-name{font-size:var(--work-font-size,clamp(26px,9vw,52px));overflow-wrap:break-word;word-break:break-word;max-width:100%}
  .wrc-title{font-size:var(--fs-heading)}
  .cs-footer{flex-direction:column;gap:12px}
  .csf-nav{flex-direction:row;gap:16px}
  .index-contact-wrap{grid-template-columns:1fr}
  .fs-styles-row{flex-wrap:wrap;height:auto;padding:8px 14px;gap:8px}
  .fs-styles-controls{flex-wrap:wrap;gap:10px}
  .ic-hoop-frame{min-height:240px}
  /* Larger touch targets for slider thumbs on mobile */
  .wt-slider{touch-action:none}
  .wt-slider::-webkit-slider-thumb{width:22px;height:22px}
  .wt-slider::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--fg);border:none}
  .cs-slider::-webkit-slider-thumb{width:22px;height:22px}
  .cs-slider::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--fg);border:none}
  .fs-range::-webkit-slider-thumb{width:18px;height:18px}
  .fs-range::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--fg);border:none}
}

/* ── CS PAGE TOOLBAR ── */
.cs-toolbar{
  display:flex;align-items:center;gap:0;
  padding:0 16px;height:32px;
  border-bottom:1px solid var(--rule);
  background:var(--bg);
  position:sticky;top:calc(var(--nav-h) + var(--bc-h));z-index:100;
}
body.light-mode .cs-toolbar{background:var(--bg)}
@media(max-width:640px){
  .cs-toolbar{height:auto;padding:8px 14px;flex-wrap:wrap;gap:10px}
}

/* ── LAYOUT TOGGLE ── */
.wt-layout-group{display:flex;align-items:center;gap:2px;margin-right:16px}
.wt-layout-btn{height:22px;padding:0 10px;font-size:var(--fs-micro);font-weight:600;letter-spacing:.04em;color:rgba(var(--fg-rgb),.35);border:1px solid rgba(var(--fg-rgb),.15);border-radius:2px;background:none;cursor:none;transition:color .15s,background .15s,border-color .15s;white-space:nowrap}
.wt-layout-btn:hover{color:rgba(var(--fg-rgb),.7);border-color:rgba(var(--fg-rgb),.3)}
.wt-layout-btn.active{background:rgba(var(--fg-rgb),.1);color:rgba(var(--fg-rgb),.85);border-color:rgba(var(--fg-rgb),.25)}

.masonry.layout-full{columns:1;column-gap:0;padding:0}
.masonry.layout-full .masonry-item{margin-bottom:2px;border-radius:0}

/* ── FEED LAYOUT: each photo as a scrollable post — image + a real,
   always-visible caption underneath, not a hover-reveal overlay ── */
.masonry.layout-feed{
  columns:1;column-gap:0;padding:32px 0;
  max-width:640px;margin:0 auto;
  background:var(--bg);
}
.masonry.layout-feed .masonry-item{
  break-inside:auto;
  margin-bottom:40px;
  border-radius:2px;
}
.masonry.layout-feed .masonry-item:last-child{margin-bottom:0}
.masonry.layout-feed .masonry-caption{
  position:static;
  opacity:1;
  pointer-events:auto;
  background:none;
  padding:14px 4px 0;
  color:rgba(var(--fg-rgb),.55);
  font-size:calc(12px * var(--cs-scale,1));
  font-weight:500;
  letter-spacing:.01em;
  text-transform:none;
  line-height:1.5;
}
.masonry.layout-feed .masonry-item:hover img{transform:none}
@media(max-width:640px){
  .masonry.layout-feed{max-width:100%;padding:24px 16px}
}

/* ── WORK GRID MODE ── */
.work-rows{display:contents}
.work-rows.grid-mode{display:grid;grid-template-columns:repeat(4,1fr);border-left:1px solid var(--rule)}
.work-rows.grid-mode.cols-4{grid-template-columns:repeat(4,1fr)}
.work-rows.grid-mode.cols-3{grid-template-columns:repeat(3,1fr)}
.work-rows.grid-mode.cols-2{grid-template-columns:repeat(2,1fr)}
.work-rows.grid-mode.cols-1{grid-template-columns:1fr}
/* restore wr-client to use full work-font-size — columns now adapt to contain it */
.work-rows.grid-mode .work-row{
  display:flex;flex-direction:column;justify-content:space-between;
  grid-template-columns:unset;
  padding:20px 20px 18px;min-height:220px;
  border-top:1px solid var(--rule);border-right:1px solid var(--rule);border-bottom:none;
  cursor:none;transition:background .18s;position:relative;overflow:visible;
}
.work-rows.grid-mode .work-row:hover{background:rgba(var(--fg-rgb),.03);box-shadow:inset 0 0 0 1px rgba(var(--fg-rgb),.35)}
.work-rows.grid-mode .wr-num{
  font-size:var(--fs-nano);font-weight:700;letter-spacing:.1em;color:rgba(var(--fg-rgb),.2);
  margin-bottom:12px;display:block;
}
.work-rows.grid-mode .wr-left{display:flex;flex-direction:column;gap:8px;flex:1}
.work-rows.grid-mode .wr-client{
  font-size:var(--work-font-size);line-height:1.08;
  display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden;
}
.work-rows.grid-mode .wr-client-sub{
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
}
/* bottom border: last row based on column count */
.work-rows.grid-mode.cols-4 .work-row:nth-last-child(-n+4){border-bottom:1px solid var(--rule)}
.work-rows.grid-mode.cols-3 .work-row:nth-last-child(-n+3){border-bottom:1px solid var(--rule)}
.work-rows.grid-mode.cols-2 .work-row:nth-last-child(-n+2){border-bottom:1px solid var(--rule)}
.work-rows.grid-mode.cols-1 .work-row{border-bottom:1px solid var(--rule)}
.work-rows.grid-mode .wr-sub,
.work-rows.grid-mode .wr-sub-wrap{font-size:var(--fs-micro);line-height:1.6;color:rgba(var(--fg-rgb),.3);margin-top:auto;padding-top:12px}
.work-rows.grid-mode .wr-sub-badge{display:none}
.work-rows.grid-mode .wr-meta{
  display:flex;flex-direction:row;align-items:center;justify-content:space-between;
  margin-top:14px;padding-top:12px;border-top:1px solid var(--rule);
}
.work-rows.grid-mode .wr-type{font-size:var(--fs-nano);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(var(--fg-rgb),.3)}
.work-rows.grid-mode .wr-year{font-size:var(--fs-nano);font-weight:500;letter-spacing:.06em;color:rgba(var(--fg-rgb),.25)}
.work-rows.grid-mode .wr-arrow{
  position:absolute;top:16px;right:16px;
  font-size:14px;color:rgba(var(--fg-rgb),.2);transition:color .15s,transform .15s;
}
.work-rows.grid-mode .work-row:hover .wr-arrow{color:var(--fg);transform:translateX(3px)}
.work-rows.grid-mode .wr-tooltip{
  bottom:60px;
  top:auto;
  right:12px;
  left:auto;
  transform:translateY(8px);
}
.work-rows.grid-mode .wr-tooltip.visible{transform:translateY(0)}
/* grid: force bottom row to have border-bottom */
@media(max-width:900px){.work-rows.grid-mode:not(.cols-1):not(.cols-2){grid-template-columns:repeat(2,1fr)}}
@media(max-width:900px){.work-rows.grid-mode .work-row:nth-last-child(-n+4){border-bottom:none}}
@media(max-width:900px){.work-rows.grid-mode .work-row:nth-last-child(-n+2){border-bottom:1px solid var(--rule)}}

/* ── MOBILE: grid stays a real 2-up card grid, distinct from list ── */
@media(max-width:640px){
  .work-rows.grid-mode{
    grid-template-columns:repeat(2,1fr);
  }
  .work-rows.grid-mode .work-row{
    padding:14px 14px 12px;
    min-height:160px;
  }
  .work-rows.grid-mode .wr-num{font-size:var(--fs-nano);margin-bottom:8px}
  .work-rows.grid-mode .wr-client{
    font-size:calc(var(--work-font-size) * .6);
    -webkit-line-clamp:5;
  }
  .work-rows.grid-mode .wr-sub,
  .work-rows.grid-mode .wr-sub-wrap,
  .work-rows.grid-mode .wr-client-sub{display:none}
  .work-rows.grid-mode .wr-meta{
    margin-top:10px;padding-top:8px;gap:2px;
  }
  .work-rows.grid-mode .wr-year{display:none}
  .work-rows.grid-mode .wr-type{font-size:var(--fs-nano)}
  .work-rows.grid-mode .wr-arrow{font-size:12px}
  .work-rows.grid-mode .wr-bulb{width:26px;height:26px;bottom:10px;right:10px}
  .work-rows.grid-mode .wr-bulb svg{width:13px;height:13px}
  /* kill bottom-border nth-child overrides that assumed a wider column count */
  .work-rows.grid-mode.cols-4 .work-row:nth-last-child(-n+4){border-bottom:none}
  .work-rows.grid-mode.cols-3 .work-row:nth-last-child(-n+3){border-bottom:none}
  .work-rows.grid-mode .work-row:nth-last-child(-n+2){border-bottom:1px solid var(--rule)}
}

/* ── LETTERS: bottom floating HUD (letter selector / arrows) ── */
.letters-hud{
  position:fixed;
  left:50%;bottom:24px;
  transform:translateX(-50%);
  display:flex;align-items:center;gap:14px;
  padding:10px 18px;
  background:var(--nav-bg,var(--bg));
  background:rgba(var(--nav-bg-rgb),.9);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--rule);
  border-radius:999px;
  box-shadow:0 16px 48px rgba(0,0,0,.28);
  z-index:400;
}
.letters-pager-arrow{
  width:22px;height:22px;display:flex;align-items:center;justify-content:center;
  font-size:13px;color:rgba(var(--fg-rgb),.45);background:none;border:none;cursor:pointer;
  transition:color .15s;
}
.letters-pager-arrow:hover{color:var(--fg)}
.letters-pager-dots{display:flex;align-items:center;gap:7px}
.letters-dot{
  width:6px;height:6px;border-radius:50%;padding:0;border:none;
  background:rgba(var(--fg-rgb),.2);cursor:pointer;transition:background .15s,transform .15s;
}
.letters-dot:hover{background:rgba(var(--fg-rgb),.45)}
.letters-dot.active{background:var(--fg);transform:scale(1.3)}
.letters-pager-label{
  font-size:var(--fs-caption);font-weight:700;letter-spacing:.02em;color:rgba(var(--fg-rgb),.6);
  min-width:64px;text-align:center;
}
@media(max-width:640px){
  .letters-hud{display:none}
}

/* ── LETTERS: desktop horizontal scroll-snap track ── */
.letters-viewport{position:relative;overflow:hidden}
.letters-track{
  display:flex;
  gap:20px;
  padding:0 12vw;
  overflow-x:auto;
  scroll-snap-type:x mandatory;
  scroll-behavior:smooth;
  -webkit-overflow-scrolling:touch;
  cursor:grab;
  user-select:none;
  box-sizing:border-box;
}
.letters-track.dragging{
  cursor:grabbing;
  scroll-snap-type:none;
  scroll-behavior:auto;
}
.letter-panel{
  flex:0 0 76%;
  width:76%;
  max-width:1300px; /* content inside caps at 1100px — without this, wide/ultrawide
                        viewports blow the panel out far past its own content,
                        leaving huge dead margins and making panels look sparse */
  scroll-snap-align:center;
  min-height:calc(100vh - var(--nav-h) - var(--bc-h) - 32px);
  box-sizing:border-box;
  transition:opacity .25s ease;
}
.letter-panel.letter-panel-clone{
  opacity:.45;
  pointer-events:none;
}
@media(max-width:900px){
  .letters-track{padding:0 6vw}
  .letter-panel{flex:0 0 88%;width:88%}
}

/* ── LETTERS: consistent spacing scale + responsive type ── */
:root{
  --l-sp-1:8px; --l-sp-2:16px; --l-sp-3:24px; --l-sp-4:32px; --l-sp-5:40px; --l-sp-6:56px;
  --l-hud-clearance:96px; /* room for the fixed bottom HUD so captions never sit under it */
}
.letter-panel-inner{
  max-width:1100px;margin:0 auto;
  padding:calc(var(--nav-h) + var(--bc-h) + var(--l-sp-5)) clamp(16px,3vw,32px) var(--l-sp-6);
}
.letter-card-frame{
  position:relative;
  border:1px solid var(--rule);
  padding:var(--l-sp-4) clamp(24px,4vw,var(--l-sp-5)) var(--l-hud-clearance);
  min-height:calc(100vh - var(--nav-h) - var(--bc-h) - 140px);
  display:flex;flex-direction:column;
}
.letter-card-num{
  position:absolute;top:var(--l-sp-3);left:var(--l-sp-3);
  font-size:var(--fs-nano);font-weight:700;letter-spacing:.1em;
  color:rgba(var(--fg-rgb),.2);font-variant-numeric:tabular-nums;
}
.letter-card-arrow{
  position:absolute;top:var(--l-sp-2);right:var(--l-sp-2);
  width:32px;height:32px;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;color:rgba(var(--fg-rgb),.25);
  background:none;border:none;cursor:pointer;
  transition:color .15s,transform .15s;
}
.letter-card-arrow:hover{color:var(--fg);transform:translateX(3px)}
.letter-card-arrow:disabled{opacity:.15;pointer-events:none}
.letter-card-caption{
  margin-top:auto;padding-top:var(--l-sp-4);
  font-size:var(--fs-micro);font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;color:rgba(var(--fg-rgb),.3);
}
.letter-cover{
  display:flex;flex-direction:column;gap:var(--l-sp-1);
  padding-top:var(--l-sp-1);padding-bottom:var(--l-sp-3);margin-bottom:var(--l-sp-4);
  border-bottom:1px solid var(--rule);
}
.letter-cover-kicker{
  font-size:calc(clamp(9px,.8vw,10px) * var(--page-scale,1));font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:rgba(var(--fg-rgb),.35);
}
.letter-cover-name{font-size:calc(clamp(22px,2.6vw,30px) * var(--page-scale,1));line-height:1;letter-spacing:-.01em;color:var(--fg)}
.letter-cover-deck{
  font-size:calc(clamp(12px,1.1vw,14px) * var(--page-scale,1));line-height:1.55;color:rgba(var(--fg-rgb),.5);max-width:520px;
}
.letter-heading{
  font-size:calc(clamp(40px,6vw,96px) * var(--page-scale,1));
  line-height:.98;
  letter-spacing:-.02em;
  color:var(--fg);
  margin:0;
  max-width:820px;
}
.letter-tagline{
  font-size:calc(clamp(9px,.8vw,10px) * var(--page-scale,1));font-weight:700;letter-spacing:.14em;text-transform:uppercase;

  line-height:1.5;
  color:var(--fg);
  margin:0;
}
.letter-body p{
  font-size:calc(15px * var(--page-scale,1));
  line-height:1.7;
  color:rgba(var(--fg-rgb),.62);
  margin:0 0 20px;
  max-width:820px;
}
.letter-body p:last-child{margin-bottom:0}

/* ── Long-form letter typography: headers proportioned against body copy,
   text kept to an optimal reading measure (~64ch), images allowed to
   break out to the full width of the card instead of being squeezed
   into the text column. ── */
.letter-body h2{
  font-size:calc(clamp(9px,.8vw,10px) * var(--page-scale,1));font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  font-weight:800;
  line-height:1.12;
  letter-spacing:-.01em;
  color:var(--fg);
  max-width:820px;
  margin:52px 0 18px;
}
.letter-body h2:first-child{margin-top:0}
.letter-body h3{
  font-size:calc(clamp(19px,2.1vw,24px) * var(--page-scale,1));
  font-weight:700;
  line-height:1.25;
  letter-spacing:-.005em;
  color:var(--fg);
  max-width:820px;
  margin:36px 0 14px;
}
.letter-figure{
  width:100%;
  margin:44px 0;
}
.letter-figure img,
.letter-figure video{
  display:block;
  width:100%;
  height:auto; /* native aspect ratio — never cropped */
  border-radius:2px;
}
.letter-figure figcaption{
  margin-top:12px;
  font-size:calc(12px * var(--page-scale,1));
  line-height:1.5;
  color:rgba(var(--fg-rgb),.4);
  max-width:820px;
}

/* ── Conversational pull-quote: alternating left/right, typographic —
   no bubble chrome, just scale + quote marks + alignment doing the
   "chat" reading the way a real bubble UI would. ── */
.letter-dialogue{
  display:flex;
  flex-direction:column;
  gap:36px;
  max-width:820px;
  margin:48px 0;
}
.letter-dialogue-line{
  max-width:82%;
}
.letter-dialogue-line.is-a{align-self:flex-start;text-align:left}
.letter-dialogue-line.is-b{align-self:flex-end;text-align:right}
.letter-dialogue-quote{
  display:block;
  font-family:'Playfair Display',serif;
  font-style:italic;
  font-weight:600;
  font-size:calc(clamp(20px,2.5vw,30px) * var(--page-scale,1));
  line-height:1.4;
  letter-spacing:-.005em;
  color:var(--fg);
}
/* the responder's line reads a shade quieter than the opening line — a
   subtle tonal cue that these are two different voices, not just two
   different sides of the column */
.letter-dialogue-line.is-b .letter-dialogue-quote{color:rgba(var(--fg-rgb),.8)}
.letter-dialogue-quote::before,
.letter-dialogue-quote::after{
  font-style:normal;
  font-weight:700;
  opacity:.55;
}
.letter-dialogue-quote::before{content:'\201C'}
.letter-dialogue-quote::after{content:'\201D'}
.letter-dialogue-line.is-a .letter-dialogue-quote::before,
.letter-dialogue-line.is-a .letter-dialogue-quote::after{color:var(--accent)}
.letter-dialogue-line.is-b .letter-dialogue-quote::before,
.letter-dialogue-line.is-b .letter-dialogue-quote::after{color:rgba(var(--fg-rgb),.4)}
.letter-dialogue-who{
  display:block;
  margin-top:12px;
  font-family:'DM Mono',monospace;
  font-size:calc(10px * var(--page-scale,1));
  font-weight:500;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:rgba(var(--fg-rgb),.32);
}
.letter-dialogue-who::before{content:'\2014\a0';opacity:.6}
@media(max-width:640px){
  .letter-dialogue-line{max-width:100%}
}

/* ── "Never have I ever" list: toggle between numbered/bulleted, each
   item styled at h4-level prominence with an optional smaller sub-line
   for context. ── */
.letter-never-toggle{
  display:inline-flex;align-items:center;gap:6px;
  margin-bottom:20px;
  font-family:'DM Mono',monospace;
}
.letter-never-toggle button{
  padding:5px 12px;
  border:1px solid var(--rule);
  background:none;
  color:rgba(var(--fg-rgb),.4);
  cursor:pointer;
  font-family:inherit;
  font-size:calc(10px * var(--page-scale,1));
  letter-spacing:.04em;
  text-transform:uppercase;
  border-radius:2px;
  transition:color .15s,border-color .15s,background .15s;
}
.letter-never-toggle button:hover{color:rgba(var(--fg-rgb),.7)}
.letter-never-toggle button.active{
  color:var(--fg);
  border-color:rgba(var(--fg-rgb),.3);
  background:rgba(var(--fg-rgb),.06);
}
.letter-never-list{
  list-style:none;
  display:flex;flex-direction:column;gap:26px;
  margin:0 0 44px;
  padding:0;
  max-width:820px;
  counter-reset:never-item;
}
.letter-never-item{
  display:flex;gap:16px;align-items:baseline;
  counter-increment:never-item;
}
.letter-never-marker{
  flex:0 0 auto;
  min-width:22px;
  font-family:'DM Mono',monospace;
  font-size:calc(13px * var(--page-scale,1));
  color:rgba(var(--fg-rgb),.3);
}
.letter-never-list.is-numbered .letter-never-marker::before{content:counter(never-item) "."}
.letter-never-list.is-bulleted .letter-never-marker::before{content:"—"}
.letter-never-body{flex:1;min-width:0}
.letter-never-statement{
  font-size:calc(clamp(18px,2vw,22px) * var(--page-scale,1));
  font-weight:700;
  line-height:1.3;
  letter-spacing:-.005em;
  color:var(--fg);
  margin:0;
}
.letter-never-context{
  margin:6px 0 0;
  font-size:calc(13px * var(--page-scale,1));
  line-height:1.5;
  font-style:italic;
  color:rgba(var(--fg-rgb),.45);
}

/* ── Collapsible accordion (chapter sections) ── */
.letter-accordion{
  max-width:820px;
  margin:0 0 40px;
  border-top:1px solid var(--rule);
}
.letter-accordion-item{border-bottom:1px solid var(--rule)}
.letter-accordion-trigger{
  width:100%;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:20px 0;
  background:none;border:none;cursor:pointer;
  text-align:left;
  font-family:inherit;
}
.letter-accordion-num{
  font-family:'DM Mono',monospace;
  font-size:calc(11px * var(--page-scale,1));
  color:rgba(var(--fg-rgb),.3);
  margin-right:14px;
  flex-shrink:0;
}
.letter-accordion-title{
  flex:1;
  font-size:calc(clamp(17px,1.9vw,21px) * var(--page-scale,1));
  font-weight:700;
  letter-spacing:-.005em;
  color:var(--fg);
}
.letter-accordion-icon{
  flex-shrink:0;
  width:22px;height:22px;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:400;
  color:rgba(var(--fg-rgb),.4);
  transition:transform .3s cubic-bezier(.16,1,.3,1);
}
.letter-accordion-item.is-open .letter-accordion-icon{transform:rotate(45deg)}
.letter-accordion-panel{
  display:grid;
  grid-template-rows:0fr;
  transition:grid-template-rows .35s cubic-bezier(.16,1,.3,1);
}
.letter-accordion-item.is-open .letter-accordion-panel{grid-template-rows:1fr}
.letter-accordion-panel-inner{
  overflow:hidden;
  min-height:0;
}
.letter-accordion-panel-inner p{
  font-size:calc(15px * var(--page-scale,1));
  line-height:1.7;
  color:rgba(var(--fg-rgb),.6);
  margin:0 0 20px;
  padding-bottom:4px;
}
.letter-accordion-panel-inner p:last-child{margin-bottom:0}
.letter-accordion-panel-inner{padding-top:0}
.letter-accordion-item.is-open .letter-accordion-panel-inner{padding-bottom:22px}

/* ── Checkbox list (rules you can check off) ── */
.letter-checklist{
  list-style:none;
  margin:0 0 40px;
  padding:0;
  max-width:820px;
  display:flex;flex-direction:column;gap:4px;
}
.letter-checklist-item{border-bottom:1px solid var(--rule)}
.letter-checklist-item label{
  display:flex;align-items:flex-start;gap:16px;
  padding:16px 0;
  cursor:pointer;
}
.letter-checklist-box{
  position:absolute;
  width:1px;height:1px;
  opacity:0;
  pointer-events:none;
}
.letter-checklist-mark{
  flex-shrink:0;
  width:22px;height:22px;
  margin-top:2px;
  border:1.5px solid rgba(var(--fg-rgb),.3);
  border-radius:4px;
  display:flex;align-items:center;justify-content:center;
  transition:border-color .15s,background .15s;
}
.letter-checklist-mark::after{
  content:'';
  width:12px;height:9px;
  clip-path:polygon(9% 45%, 0 63%, 35% 100%, 100% 20%, 85% 5%, 33% 70%);
  background:var(--bg);
  transform:scale(0);
  transition:transform .15s cubic-bezier(.34,1.56,.64,1);
}
.letter-checklist-box:checked ~ .letter-checklist-mark{
  background:var(--fg);border-color:var(--fg);
}
.letter-checklist-box:checked ~ .letter-checklist-mark::after{transform:scale(1)}
.letter-checklist-text{
  flex:1;
  font-size:calc(15px * var(--page-scale,1));
  line-height:1.6;
  color:rgba(var(--fg-rgb),.75);
  transition:color .2s,opacity .2s;
}
.letter-checklist-box:checked ~ .letter-checklist-text{
  color:rgba(var(--fg-rgb),.35);
  text-decoration:line-through;
  text-decoration-color:rgba(var(--fg-rgb),.3);
  opacity:.8;
}


@media(max-width:640px){
  .letter-card-frame{border:none;padding:0;min-height:0}
  .letter-card-num,.letter-card-arrow{display:none}
}
.letters-grid-mobile{display:none}
.letter-modal-overlay{display:none}

@media(max-width:640px){
  .letters-viewport{display:none}

  /* ── LETTERS: mobile grid of cards ──
     2-up by default on mobile; drops to a single-column list only on the
     smallest screens. Dividers are drawn with borders on the cards
     themselves rather than a background-color-in-the-gap trick, so the
     container can stay fully transparent (no gray bleeding through the
     padding, which is what was happening before). */
  .letters-grid-mobile{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:0;
    background:#000;
    padding:0 16px 60px;
  }
  .letter-card{
    display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;
    gap:20px;
    aspect-ratio:1/1.05;
    background:transparent;
    border:none;
    border-right:1px solid var(--rule);
    border-bottom:1px solid var(--rule);
    padding:16px;
    cursor:pointer;
    text-align:left;
  }
  .letter-card-index{
    font-size:11px;font-weight:600;letter-spacing:.08em;
    color:rgba(var(--fg-rgb),.3);
  }
  .letter-card-name{
    flex:1;
    display:flex;align-items:center;
    font-family:'Syne',sans-serif;font-weight:800;
    font-size:22px;letter-spacing:-.01em;color:var(--fg);
  }
  .letter-card-arrow-icon{align-self:flex-end;color:rgba(var(--fg-rgb),.35);font-size:18px}
  .letter-card:active .letter-card-arrow-icon{color:var(--accent)}

  /* ── LETTERS: mobile modal / bottom-sheet ── */
  .letter-modal-overlay{
    display:block;
    position:fixed;inset:0;
    background:rgba(0,0,0,.5);
    z-index:900;
    opacity:0;pointer-events:none;
    transition:opacity .25s ease;
  }
  .letter-modal-overlay.open{opacity:1;pointer-events:auto}
  .letter-modal-sheet{
    position:absolute;left:0;right:0;bottom:0;
    max-height:86vh;
    background:var(--bg);
    border-top:1px solid var(--rule);
    border-radius:16px 16px 0 0;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    transform:translateY(100%);
    transition:transform .3s cubic-bezier(.16,1,.3,1);
    padding-bottom:40px;
  }
  .letter-modal-overlay.open .letter-modal-sheet{transform:translateY(0)}
  .letter-modal-close{
    position:sticky;top:12px;left:calc(100% - 48px);
    width:32px;height:32px;
    display:flex;align-items:center;justify-content:center;
    font-size:20px;color:rgba(var(--fg-rgb),.5);
    background:rgba(var(--fg-rgb),.06);border:none;border-radius:50%;
    z-index:2;cursor:pointer;
  }
  .letter-modal-slot .letter-panel{min-height:0}
  .letter-modal-slot .letter-panel-inner{padding:8px 20px 32px}
  body.letters-modal-locked{overflow:hidden}
}
@media(max-width:512px){
  /* Below 512px: fall back to a single-column list — the 2-up grid holds
     up fine down to 512px, but gets too cramped narrower than that. */
  .letters-grid-mobile{grid-template-columns:1fr;gap:0;background:#000}
  .letter-card{
    flex-direction:row;align-items:center;justify-content:flex-start;
    aspect-ratio:auto;
    gap:16px;
    background:#000;
    border:none;border-bottom:1px solid var(--rule);margin:0;
    padding:24px 4px;
  }
  .letter-card-name{font-size:28px;flex:1}
  .letter-card-arrow-icon{align-self:center}
  .letter-card:last-child{border-bottom:none}
}

/* ── JOURNAL FOOTER: glass ice-tray scene, statement text (not a link) ── */
.journal-footer-webgl{
  position:relative;
  width:100%;
  height:480px;
  background:#000;
  overflow:hidden;
}
.journal-footer-webgl::after{
  content:'';
  position:absolute;
  inset:0;
  background:linear-gradient(0deg, rgba(0,0,0,0) 45%, var(--bg) 100%);
  pointer-events:none;
}
.journal-footer-canvas{
  position:absolute;top:0;left:0;
  width:100%;height:100%;
  display:block;
  touch-action:none;
}
@media(max-width:640px){
  .journal-footer-webgl{height:340px}
}

::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(var(--fg-rgb),.2);border-radius:2px}
::-webkit-scrollbar-thumb:hover{background:rgba(var(--fg-rgb),.45)}
*{scrollbar-width:none;scrollbar-color:rgba(var(--fg-rgb),.2) transparent}
*::-webkit-scrollbar{display:none}

/* ── CUSTOM SCROLL INDICATOR ── */
#scroll-indicator{
  position:fixed;
  top:0;right:6px;
  width:1px;
  height:100vh;
  background:rgba(var(--fg-rgb),.08);
  z-index:9998;
  pointer-events:none;
  opacity:0;
  transition:opacity .4s ease;
}
#scroll-indicator.visible{opacity:1}
#scroll-thumb{
  position:absolute;
  left:0;
  width:1px;
  min-height:32px;
  background:rgba(var(--fg-rgb),.45);
  border-radius:1px;
  transition:background .2s ease;
  will-change:top,height;
}
#scroll-indicator.active #scroll-thumb{background:rgba(var(--fg-rgb),.75)}

body.light-mode{background:var(--bg);color:var(--fg)}
body.light-mode .fs-nav{background:rgba(255,255,255,.96)}
body.light-mode .fs-bc{background:rgba(255,255,255,.96)}
body.light-mode .work-toolbar{background:var(--bg)}
body.light-mode .work-row:hover{background:rgba(0,0,0,.04)}
body.light-mode .work-row-career:hover{background:rgba(0,0,0,.04)}
.censor-word{
  display:inline-block;
  background:#fff;
  color:#fff;
  border-radius:3px;
  padding:0 2px;
  cursor:default;
  -webkit-user-select:none;
  user-select:none;
  box-shadow:0 1px 3px rgba(0,0,0,.18),0 1px 1px rgba(0,0,0,.1);
  transition:background-color .15s ease,color .15s ease,box-shadow .15s ease;
}
.censor-word:hover{
  background:#000;
  color:#fff;
  filter:blur(3px);
  box-shadow:none;
}

/* ── Very narrow phones: the ≤640px nav still gets tight with Design
   System + Contact + CV all present — shorten the longest label and
   squeeze spacing further rather than let anything overlap. ── */
@media(max-width:400px){
  .fs-nav{padding:0 8px}
  .nav-wordmark{margin-right:6px}
  .nav-logo{margin-right:5px;width:22px;height:22px}
  .nav-tab{padding:0 6px}
  .nav-right{gap:4px}
  .nav-right-link{font-size:8px}
  .nav-link-full{display:none}
  .nav-link-short{display:inline}
  .nav-cta{padding:0 6px;gap:4px}
}
</style>
</head>

.fs-specimen-body{font-size:calc(11px * var(--cs-scale,1));line-height:1.9;color:rgba(var(--fg-rgb),.28);max-width:var(--fs-specimen-width,clamp(600px,70vw,1400px))}
.fs-details-label-col{padding:16px;border-right:1px solid var(--rule);font-size:calc(8px * var(--cs-scale,1));font-weight:600;letter-spacing:.08em;color:rgba(var(--fg-rgb),.25)}
.fs-detail-row{padding:7px 0;border-bottom:1px solid var(--faint);display:flex;justify-content:space-between;align-items:baseline;font-size:calc(7px * var(--cs-scale,1))}

#toc-list a:hover{color:rgba(var(--fg-rgb),.7)}

<script>
(function(){
  // Build TOC and wire scroll spy for contracts view
  function initContracts(){
    const toc = document.getElementById('toc-list');
    const body = document.getElementById('contracts-body');
    if(!toc||!body) return;
    toc.innerHTML='';
    const sections = body.querySelectorAll('.ct-section');
    sections.forEach((sec,i)=>{
      const id = 'ct-sec-'+i;
      sec.id = id;
      const label = sec.dataset.label || sec.querySelector('.ct-heading')?.textContent || 'Section';
      const a = document.createElement('a');
      a.href='#'+id;
      a.innerHTML = '<span class="toc-num">'+String(i+1).padStart(2,'0')+'</span><span class="toc-label">'+label+'</span>';
      a.addEventListener('click',e=>{
        e.preventDefault();
        sec.scrollIntoView({behavior:'smooth',block:'start'});
      });
      toc.appendChild(a);
    });
    // scroll spy
    const obs = new IntersectionObserver(entries=>{
      entries.forEach(en=>{
        const idx = [...sections].indexOf(en.target);
        if(idx<0) return;
        const link = toc.querySelectorAll('a')[idx];
        if(!link) return;
        if(en.isIntersecting){
          toc.querySelectorAll('a').forEach(a=>a.classList.remove('toc-active'));
          link.classList.add('toc-active');
          if(window.innerWidth<=640 && typeof link.scrollIntoView==='function'){
            link.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
          }
        }
      });
    },{rootMargin:'-30% 0px -60% 0px'});
    sections.forEach(s=>obs.observe(s));
  }
  // run on navigate to contracts
  const _origShowView = window.showView;
  // patch after page load since showView defined later
  document.addEventListener('DOMContentLoaded',()=>{
    // already handled via MutationObserver approach below
  });
  // Simpler: observe view-contracts becoming active
  const viewEl = document.getElementById('view-contracts');
  if(viewEl){
    new MutationObserver(()=>{
      if(viewEl.classList.contains('active')) initContracts();
    }).observe(viewEl,{attributeFilter:['class']});
  }
})();
</script>

<script>
// ── PHYSICS CONSTANTS — declared first to avoid TDZ errors ──────────────────
const TETHER_K  = 0.028;
const DAMP      = 0.72;
const BLOB_LERP = 0.08;
const FLOAT_SPD = 0.007;
const FLOAT_AX  = 4.5;
const FLOAT_AY  = 3;
// Use window globals for repel radii so tbApplySize can write them
// before the particle engine reads them — avoids let TDZ issues.
window._repelR  = 155;  // CS particle hero repel radius
window._ptRepel = 110;  // portrait hero repel radius

// ── SHARED TOOLBAR STATE ─────────────────────────────────────────────────────
const TOOLBAR_DEFAULTS = { size: 48, align: 'left', theme: 'dark' };
let toolbarState = { ...TOOLBAR_DEFAULTS };

function defaultSizeForView(viewId) {
  const id = viewId || currentView || 'index';
  return id === 'index' ? 28 : 48;
}
let currentView = 'index';

// Registry of open "panels" (modals, sheets, etc.) that Escape should close
// before falling through to the global home-navigation behavior — anything
// that can be "open" pushes { isOpen, close } onto this once, at setup time.
// Declared this early so any feature further down the script (which may
// run before the keydown handler itself is defined) can safely push into it.
window._escPanelStack = [];
const root = document.documentElement;

function tbApplySize(px) {
  px = Math.min(72, Math.max(28, px));
  root.style.setProperty('--work-font-size', px + 'px');
  const scale = px / 48;
  // Drives the entire fluid type ramp (--fs-display ... --fs-nano).
  const scaleMult = Math.min(1.6, Math.max(0.72, scale));
  root.style.setProperty('--scale-mult', scaleMult.toFixed(3));
  // --page-scale drives About and CV page text proportionally (body, labels, timeline, h1s)
  if (currentView === 'about' || currentView === 'contracts') {
    root.style.setProperty('--page-scale', (px / 48).toFixed(3));
  }
  // --cs-scale drives case study body text, specimen, details proportionally
  const CS_VIEWS = ['bny','gnc','hardinge','kent','dana','power','wovn'];
  if (CS_VIEWS.includes(currentView)) {
    root.style.setProperty('--cs-scale', (px / 48).toFixed(3));
    // Narrative particles also scale on case study pages
    document.querySelectorAll('#view-' + currentView + ' [data-narrative-particles]').forEach(wrap => {
      if (wrap._narrInst) { wrap._narrInst.dead = true; }
      initNarrativeParticles(wrap);
    });
  }
  // Body copy gets its own clamped scale so it never drops below a readable
  // floor (~13px) or balloons past a comfortable large-print ceiling (~20px),
  // independent of how far display headlines (--work-font-size) are scaled.
  const bodyScale = Math.min(1.55, Math.max(1, scale));
  root.style.setProperty('--content-size',      (10 * bodyScale).toFixed(1) + 'px');
  root.style.setProperty('--content-size-sm',   (8  * bodyScale).toFixed(1) + 'px');
  root.style.setProperty('--content-size-body', (13 * bodyScale).toFixed(1) + 'px');
  root.style.setProperty('--wr-sub-size', Math.max(7, Math.round(8 * bodyScale)) + 'px');
  root.style.setProperty('--tip-title-size', Math.min(32, Math.max(14, Math.round(20 * scale))) + 'px');
  root.style.setProperty('--tip-body-size',  Math.min(15, Math.max(9,  Math.round(10 * bodyScale))) + 'px');
  root.style.setProperty('--tip-head-size',  Math.min(10, Math.max(7,  Math.round(7  * bodyScale))) + 'px');
  root.style.setProperty('--tip-foot-size',  Math.min(11, Math.max(8,  Math.round(8  * bodyScale))) + 'px');
  // Repel radii scale with slider — larger text = larger cursor influence zone
  window._ptRepel = Math.round(110 * scale);
  window._repelR  = Math.round(155 * scale);
  document.querySelectorAll('.wt-size-label, .cs-size-label').forEach(el => el.textContent = px + 'px');
  document.querySelectorAll('.wt-slider, .cs-slider').forEach(sl => sl.value = px);
  // On the About page, particle text scales with the slider
  if (currentView === 'about') {
    document.querySelectorAll('[data-narrative-particles]').forEach(wrap => {
      if (wrap._narrInst) { wrap._narrInst.dead = true; }
      initNarrativeParticles(wrap);
    });
  }
  // Transition grid through 4-up/3-up/2-up/1-up based on slider position
  const workRows = document.getElementById('work-rows');
  if (workRows && workRows.classList.contains('grid-mode')) {
    const cols = px <= 38 ? 'cols-4' : px <= 52 ? 'cols-3' : px <= 64 ? 'cols-2' : 'cols-1';
    workRows.classList.remove('cols-1','cols-2','cols-3','cols-4');
    workRows.classList.add(cols);
  }
}

function tbApplyAlign(a) {
  root.style.setProperty('--work-align', a);
  document.querySelectorAll('.wt-align-btn').forEach(b => b.classList.toggle('active', b.dataset.align === a));
}

function tbApplyTheme(t) {
  document.body.classList.toggle('light-mode', t === 'light');
  document.querySelectorAll('.dark-btn').forEach(b => b.classList.toggle('active', t === 'dark'));
  document.querySelectorAll('.light-btn').forEach(b => b.classList.toggle('active', t === 'light'));
  window._heroBg = t === 'light' ? '#ffffff' : '#0a0a0a';
  if (window._portraitRebuild) window._portraitRebuild();
}

function tbReset() {
  const sz = defaultSizeForView();
  toolbarState = { ...TOOLBAR_DEFAULTS, size: sz };
  tbApplySize(sz);
  tbApplyAlign(TOOLBAR_DEFAULTS.align);
  tbApplyTheme(TOOLBAR_DEFAULTS.theme);
}

function initToolbar(container) {
  if (!container) return;
  const slider    = container.querySelector('.wt-slider, .cs-slider');
  const alignBtns = container.querySelectorAll('.wt-align-btn');
  const darkBtn   = container.querySelector('.dark-btn');
  const lightBtn  = container.querySelector('.light-btn');
  const resetBtn  = container.querySelector('.wt-reset, .cs-reset-btn');
  if (!slider) return;
  slider.value = toolbarState.size;
  const onSlide = () => {
    toolbarState.size = parseInt(slider.value);
    tbApplySize(toolbarState.size);
  };
  slider.addEventListener('input',  onSlide);
  slider.addEventListener('change', onSlide);
  alignBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      toolbarState.align = btn.dataset.align;
      tbApplyAlign(toolbarState.align);
    });
  });
  if (darkBtn)  darkBtn.addEventListener('click',  () => { toolbarState.theme = 'dark';  tbApplyTheme('dark');  });
  if (lightBtn) lightBtn.addEventListener('click', () => { toolbarState.theme = 'light'; tbApplyTheme('light'); });
  if (resetBtn) resetBtn.addEventListener('click', tbResetWithLayout);
}

// ── INIT STATE (must run before initToolbar so sliders get correct initial value) ──
toolbarState.size = defaultSizeForView();
tbApplySize(toolbarState.size);
tbApplyAlign(TOOLBAR_DEFAULTS.align);
tbApplyTheme(TOOLBAR_DEFAULTS.theme);
window._heroBg = '#0a0a0a';

initToolbar(document.getElementById('work-toolbar'));
document.querySelectorAll('.cs-toolbar-inst').forEach(t => initToolbar(t));

// ── BENTO / FULL WIDTH / FEED LAYOUT TOGGLE ────────────────────────────────
function applyLayout(layout, viewEl) {
  const galleries = viewEl ? viewEl.querySelectorAll('.masonry') : document.querySelectorAll('.masonry');
  galleries.forEach(g => {
    g.classList.toggle('layout-full', layout === 'full');
    g.classList.toggle('layout-feed', layout === 'feed');
  });
}

function initLayoutToggle(toolbar) {
  const btns = toolbar.querySelectorAll('.wt-layout-btn, .cs-layout-btn');
  if (!btns.length) return;
  const viewEl = toolbar.closest('.view') || document.querySelector('#view-index');

  // Apply whichever layout starts marked .active in the HTML, so the
  // gallery itself matches the highlighted button immediately on load
  // instead of only updating after the first click.
  const initiallyActive = Array.from(btns).find(b => b.classList.contains('active'));
  if (initiallyActive) applyLayout(initiallyActive.dataset.layout, viewEl);

  btns.forEach(btn => {
    btn.addEventListener('click', () => {
      const layout = btn.dataset.layout;
      btns.forEach(b => b.classList.toggle('active', b.dataset.layout === layout));
      applyLayout(layout, viewEl);
    });
  });
}

const indexToolbar = document.getElementById('work-toolbar');
if (indexToolbar) initLayoutToggle(indexToolbar);
document.querySelectorAll('.cs-toolbar-inst').forEach(t => initLayoutToggle(t));

// ── WORK INDEX LIST / GRID TOGGLE ──────────────────────────────────────────
(function(){
  const listBtn  = document.getElementById('wt-list');
  const gridBtn  = document.getElementById('wt-grid');
  const workRows = document.getElementById('work-rows');
  if (!listBtn || !gridBtn || !workRows) return;
  function getColsClass(px) {
    return px <= 38 ? 'cols-4' : px <= 52 ? 'cols-3' : px <= 64 ? 'cols-2' : 'cols-1';
  }
  function setWorkLayout(mode) {
    workRows.classList.toggle('grid-mode', mode === 'grid');
    workRows.classList.toggle('list-mode', mode === 'list');
    listBtn.classList.toggle('active', mode === 'list');
    gridBtn.classList.toggle('active', mode === 'grid');
    if (mode === 'grid') {
      const px = toolbarState.size || 28;
      workRows.classList.remove('cols-1','cols-2','cols-3','cols-4');
      workRows.classList.add(getColsClass(px));
    }
  }
  listBtn.addEventListener('click', () => setWorkLayout('list'));
  gridBtn.addEventListener('click', () => setWorkLayout('grid'));
  setWorkLayout('grid');
})();

// ── LETTERS: horizontal pager (desktop) + card/modal (mobile) ──────────────
(function initLetters() {
  const LETTER_IDS = ['about', 'insight', 'outlook', 'manifesto', 'confessions'];
  const LETTER_NAMES = { about: 'About', insight: 'Insight', outlook: 'Outlook', manifesto: 'Manifesto', confessions: 'Confessions' };

  const track   = document.getElementById('lettersTrack');
  const pager   = document.querySelector('.letters-hud');
  if (!track || !pager) return;

  const prevBtn = pager.querySelector('.letters-prev');
  const nextBtn = pager.querySelector('.letters-next');
  const dots    = Array.from(pager.querySelectorAll('.letters-dot'));
  const label   = pager.querySelector('.letters-pager-label');

  // ── Build infinite-loop peek clones: [clone(manifesto), about, insight, outlook, manifesto, clone(about)] ──
  const realPanels = LETTER_IDS.map(id => document.getElementById('letter-' + id));

  function makeClone(panel, cloneId) {
    const clone = panel.cloneNode(true);
    clone.id = cloneId;
    clone.classList.add('letter-panel-clone');
    clone.setAttribute('aria-hidden', 'true');
    clone.querySelectorAll('button, a, [tabindex]').forEach(el => el.setAttribute('tabindex', '-1'));
    return clone;
  }

  const cloneStart = makeClone(realPanels[realPanels.length - 1], 'letter-clone-start'); // peek of the last letter
  const cloneEnd   = makeClone(realPanels[0], 'letter-clone-end');                        // peek of About
  track.insertBefore(cloneStart, realPanels[0]);
  track.appendChild(cloneEnd);

  // allPanels[0] = clone(manifesto), allPanels[1..4] = real About..Manifesto, allPanels[5] = clone(about)
  function getAllPanels() { return Array.from(track.children); }

  let activeIndex = 0;   // real index, 0-3
  let isScrolling = false;

  function updatePagerUI(idx) {
    activeIndex = ((idx % LETTER_IDS.length) + LETTER_IDS.length) % LETTER_IDS.length;
    dots.forEach((d, i) => d.classList.toggle('active', i === activeIndex));
    label.textContent = LETTER_NAMES[LETTER_IDS[activeIndex]];
  }

  function scrollToReal(realIdx, behavior) {
    const idx = ((realIdx % LETTER_IDS.length) + LETTER_IDS.length) % LETTER_IDS.length;
    const target = getAllPanels()[idx + 1]; // +1 to skip the leading clone
    isScrolling = true;
    target.scrollIntoView({ behavior: behavior || 'smooth', inline: 'center', block: 'nearest' });
    updatePagerUI(idx);
    setTimeout(() => { isScrolling = false; }, 500);
  }

  function nearestPanelIndex() {
    const panels = getAllPanels();
    const trackRect = track.getBoundingClientRect();
    const centerX = trackRect.left + trackRect.width / 2;
    let best = 0, bestDist = Infinity;
    panels.forEach((p, i) => {
      const r = p.getBoundingClientRect();
      const c = r.left + r.width / 2;
      const d = Math.abs(c - centerX);
      if (d < bestDist) { bestDist = d; best = i; }
    });
    return best;
  }

  // If we've settled on a peek clone, silently jump (no animation) to the real slide it mirrors
  function correctIfOnClone() {
    const panels = getAllPanels();
    const idx = nearestPanelIndex();
    if (panels[idx] === cloneStart) {
      scrollToReal(LETTER_IDS.length - 1, 'auto'); // land on real Manifesto
    } else if (panels[idx] === cloneEnd) {
      scrollToReal(0, 'auto'); // land on real About
    } else {
      updatePagerUI(idx - 1);
    }
  }

  prevBtn.addEventListener('click', () => scrollToReal(activeIndex - 1));
  nextBtn.addEventListener('click', () => scrollToReal(activeIndex + 1));
  dots.forEach((dot, i) => dot.addEventListener('click', () => scrollToReal(i)));

  // In-card arrow (top-right of each tall card) also advances to the next
  // letter — wraps infinitely. Uses the arrow's OWN panel to determine which
  // letter it's advancing from, rather than the globally-tracked
  // activeIndex — otherwise clicking a neighboring (not-yet-centered) card's
  // arrow would advance from whichever card happened to be centered instead
  // of the one you actually clicked.
  document.querySelectorAll('[data-letter-arrow]').forEach(btn => {
    btn.addEventListener('click', () => {
      const panel = btn.closest('.letter-panel');
      const letterId = panel && panel.dataset.letter;
      const ownIndex = LETTER_IDS.indexOf(letterId);
      scrollToReal(ownIndex >= 0 ? ownIndex + 1 : activeIndex + 1);
    });
  });

  // ── Click-and-drag to pan between letters (like dragging a grid) ─────────
  let isDragging = false;
  let dragMoved = false;
  let dragStartX = 0;
  let dragStartScroll = 0;

  track.addEventListener('pointerdown', (e) => {
    if (e.button !== undefined && e.button !== 0) return; // left click / touch only
    if (e.target.closest('button, a')) return; // let interactive controls (arrows, etc.) handle their own clicks
    isDragging = true;
    dragMoved = false;
    dragStartX = e.clientX;
    dragStartScroll = track.scrollLeft;
    track.classList.add('dragging');
    track.setPointerCapture(e.pointerId);
  });

  track.addEventListener('pointermove', (e) => {
    if (!isDragging) return;
    const dx = e.clientX - dragStartX;
    if (Math.abs(dx) > 4) dragMoved = true;
    track.scrollLeft = dragStartScroll - dx;
  });

  function endDrag(e) {
    if (!isDragging) return;
    isDragging = false;
    track.classList.remove('dragging');
    if (e && e.pointerId !== undefined) {
      try { track.releasePointerCapture(e.pointerId); } catch (err) {}
    }
    // let the nearest panel settle now that scroll-snap is re-enabled — then correct for clones
    requestAnimationFrame(() => correctIfOnClone());
  }
  track.addEventListener('pointerup', endDrag);
  track.addEventListener('pointercancel', endDrag);
  track.addEventListener('pointerleave', (e) => { if (isDragging) endDrag(e); });

  // Suppress the click on cards/arrows/dots that immediately follows a drag
  track.addEventListener('click', (e) => {
    if (dragMoved) {
      e.preventDefault();
      e.stopPropagation();
      dragMoved = false;
    }
  }, true);

  // Debounced "settle" check for native trackpad/wheel scrolling (no pointer drag involved)
  let scrollRaf = null;
  let settleTimer = null;
  track.addEventListener('scroll', () => {
    if (isScrolling) return;
    if (scrollRaf) cancelAnimationFrame(scrollRaf);
    scrollRaf = requestAnimationFrame(() => {
      const idx = nearestPanelIndex();
      if (idx - 1 !== activeIndex) updatePagerUI(idx - 1);
    });
    if (settleTimer) clearTimeout(settleTimer);
    settleTimer = setTimeout(() => {
      if (!isDragging) correctIfOnClone();
    }, 160);
  });

  window.addEventListener('resize', () => {
    if (currentView === 'about') scrollToReal(activeIndex, 'auto');
  });

  document.addEventListener('keydown', (e) => {
    if (currentView !== 'about') return;
    if (window.innerWidth <= 640) return;
    const tag = (document.activeElement && document.activeElement.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    if (e.key === 'ArrowLeft') { scrollToReal(activeIndex - 1); }
    if (e.key === 'ArrowRight') { scrollToReal(activeIndex + 1); }
  });

  updatePagerUI(0);
  // Land on the real "About" slide (skip the leading clone), but only once —
  // scrollIntoView is unreliable while the view is still display:none, so we
  // do this lazily the first time showView() actually reveals #view-about.
  let hasInitializedPosition = false;
  window._lettersOnShow = function () {
    if (hasInitializedPosition) return;
    hasInitializedPosition = true;
    requestAnimationFrame(() => requestAnimationFrame(() => scrollToReal(0, 'auto')));
  };

  // ── Mobile: tap a card → move its panel into the modal sheet ──────────────
  const overlay = document.getElementById('letterModalOverlay');
  const slot    = document.getElementById('letterModalSlot');
  const closeBtn = overlay.querySelector('.letter-modal-close');
  let homePanel = null;
  let homeNextSibling = null;

  function openLetter(id) {
    const panel = document.getElementById('letter-' + id);
    if (!panel) return;
    homePanel = panel;
    homeNextSibling = panel.nextElementSibling;
    slot.appendChild(panel);
    overlay.classList.add('open');
    document.body.classList.add('letters-modal-locked');
    initAllNarrativeParticles(panel);
    setupReveal(panel);
  }

  function closeLetter() {
    overlay.classList.remove('open');
    document.body.classList.remove('letters-modal-locked');
    if (homePanel) {
      if (homeNextSibling) track.insertBefore(homePanel, homeNextSibling);
      else track.appendChild(homePanel);
      homePanel = null;
      homeNextSibling = null;
    }
  }

  document.querySelectorAll('.letter-card').forEach(card => {
    card.addEventListener('click', () => openLetter(card.dataset.letter));
  });
  closeBtn.addEventListener('click', closeLetter);
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) closeLetter();
  });

  window._escPanelStack.push({
    isOpen: () => overlay.classList.contains('open'),
    close: closeLetter,
  });
})();

function tbResetWithLayout() {
  const sz = defaultSizeForView();
  toolbarState = { ...TOOLBAR_DEFAULTS, size: sz };
  tbApplySize(sz);
  tbApplyAlign(TOOLBAR_DEFAULTS.align);
  tbApplyTheme(TOOLBAR_DEFAULTS.theme);
  document.querySelectorAll('.wt-layout-btn, .cs-layout-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.layout === 'bento');
  });
  document.querySelectorAll('.masonry').forEach(g => g.classList.remove('layout-full'));
  // reset work index grid → list
  const workRows = document.getElementById('work-rows');
  if (workRows) workRows.classList.remove('grid-mode');
  const wl = document.getElementById('wt-list');
  const wg = document.getElementById('wt-grid');
  if (wl) wl.classList.add('active');
  if (wg) wg.classList.remove('active');

(function initWeightThumbFollow() {
  const EDGE_MARGIN = 12;
  document.querySelectorAll('.fs-weight-row').forEach(row => {
    const thumb = row.querySelector('.fs-weight-thumb');
    if (!thumb) return;
    row.addEventListener('mousemove', (e) => {
      const rect = row.getBoundingClientRect();
      const halfW = (thumb.offsetWidth  || 300) / 2;
      const halfH = (thumb.offsetHeight || 200) / 2;

      let cx = e.clientX;
      let cy = e.clientY;

      const minX = halfW + EDGE_MARGIN;
      const maxX = window.innerWidth - halfW - EDGE_MARGIN;
      const minY = halfH + EDGE_MARGIN;
      const maxY = window.innerHeight - halfH - EDGE_MARGIN;

      cx = Math.max(minX, Math.min(maxX, cx));
      cy = Math.max(minY, Math.min(maxY, cy));

      thumb.style.left = (cx - rect.left) + 'px';
      thumb.style.top  = (cy - rect.top) + 'px';
    });
  });
})();

        // Clamp to viewport after browser paints the tooltip
        requestAnimationFrame(() => {
          const tr  = tip.getBoundingClientRect();
          const margin = 8;
          // Horizontal: if clipping left edge, shift right
          if (tr.left < margin) {
            const shift = margin - tr.left;
            const curRight = parseFloat(tip.style.right) || 12;
            tip.style.right = (curRight - shift) + 'px';
          }
          // Horizontal: if clipping right edge, shift left
          if (tr.right > window.innerWidth - margin) {
            const overshoot = tr.right - (window.innerWidth - margin);
            const curRight = parseFloat(tip.style.right) || 12;
            tip.style.right = (curRight + overshoot) + 'px';
          }
          // Vertical: if clipping top, flip below bulb instead of above
          if (tr.top < margin) {
            tip.style.bottom = 'auto';
            tip.style.top    = (bulb.offsetTop + bulb.offsetHeight + 8) + 'px';
          }
        });
      });
      bulb.addEventListener('mouseleave', () => {
        bulb.classList.remove('active');
        tip.classList.remove('visible');
        tip.style.right  = '';
        tip.style.left   = '';
        tip.style.bottom = '';
        tip.style.top    = '';
      });
    }
  });

function navigate(id) {
  if (id === currentView) return;
  wipe.className = 'in';
  setTimeout(() => {
    showView(id);
    wipe.className = 'out';
    setTimeout(() => { wipe.className = ''; }, 450);
  }, 380);
}

function showView(id) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  const el = document.getElementById('view-' + id);
  if (!el) return;
  el.classList.add('active');
  window.scrollTo(0, 0);
  currentView = id;
  toolbarState.size = defaultSizeForView(id);
  tbApplySize(toolbarState.size);
  // Reset page-scale when leaving about/contracts; tbApplySize will set it correctly for those views
  if (id !== 'about' && id !== 'contracts') {
    root.style.setProperty('--page-scale', '1');
  }
  if (!['bny','gnc','hardinge','kent','dana','power','wovn'].includes(id)) {
    root.style.setProperty('--cs-scale', '1');
  }
  document.getElementById('bc-label').textContent = VIEWS[id]?.bcLabel || id;
  document.querySelectorAll('.nav-tab[data-view]').forEach(t => {
    t.classList.toggle('active', t.dataset.view === (VIEWS[id]?.navTab || id));
  });

  initAllNarrativeParticles(el);

    setTimeout(() => window._portraitRebuild(true), 460);

    requestAnimationFrame(() => requestAnimationFrame(window._placeGlyphMetrics));

// ── SCROLL REVEAL ─────────────────────────────────────────────────────────
function setupReveal(container) {
  if (!container) return;
  const els = container.querySelectorAll('.reveal');
  els.forEach(e => e.classList.remove('in'));
  const obs = new IntersectionObserver(entries => {
    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); obs.unobserve(e.target); } });
  }, { threshold: 0.04 });
  els.forEach(e => obs.observe(e));
}
