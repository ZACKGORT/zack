<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Particle Flow · REDIRECT</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0a0a0a; overflow:hidden; font-family:'Courier New',monospace; cursor:none; }
canvas { display:block; }

#cursor {
  position:fixed; top:0; left:0; pointer-events:none; z-index:9999;
  width:18px; height:11px; border-radius:50%;
  background:rgba(255,255,248,0.92);
  box-shadow:0 0 8px rgba(255,255,255,0.4);
  will-change:transform;
}

/* ── DISPENSER ── */
#dispenser {
  position:fixed; z-index:300;
  top:18px; left:50%; transform:translateX(-50%);
  user-select:none; touch-action:none;
}
#cta-btn {
  display:flex; align-items:center; justify-content:center; gap:9px;
  background:#ffffff; color:#0a0a0a;
  border:none; padding:0 20px 0 18px; height:38px;
  font-family:'Helvetica Neue',Arial,sans-serif; font-size:11px;
  font-weight:700; letter-spacing:0.1em; text-transform:uppercase;
  cursor:none; border-radius:4px;
  box-shadow:0 2px 16px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.08);
  transition:box-shadow 0.15s, background 0.12s, color 0.12s;
  white-space:nowrap; min-width:100px;
}
#cta-btn:hover { box-shadow:0 4px 24px rgba(255,255,255,0.18), 0 0 0 1px rgba(255,255,255,0.25); }
#cta-btn.paused { background:#0a0a0a; color:#ffffff; box-shadow:0 2px 16px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.18); }
#cta-btn.paused:hover { box-shadow:0 4px 24px rgba(255,255,255,0.1), 0 0 0 1px rgba(255,255,255,0.32); }
#cta-btn.snap-active { box-shadow:0 0 0 2px rgba(255,255,255,0.55), 0 4px 20px rgba(255,255,255,0.12); }
#snap-hint {
  position:fixed; top:0; left:0; right:0; height:3px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.22),transparent);
  pointer-events:none; z-index:299; opacity:0; transition:opacity 0.3s;
}
#snap-hint.visible { opacity:1; }

/* ── CONTEXT MENU ── */
#ctx-menu {
  position:fixed; z-index:500; background:#111111;
  border:1px solid rgba(255,255,255,0.12); border-radius:8px;
  padding:8px; min-width:200px; display:none;
  box-shadow:0 8px 40px rgba(0,0,0,0.7);
  font-family:'Helvetica Neue',Arial,sans-serif;
}
#ctx-menu.visible { display:block; }
.ctx-title { font-size:9px; letter-spacing:0.3em; color:rgba(255,255,255,0.2); text-transform:uppercase; padding:4px 8px 8px; border-bottom:1px solid rgba(255,255,255,0.06); margin-bottom:6px; }
.shape-grid { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-bottom:8px; }
.shape-btn { background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.08); border-radius:6px; padding:10px 8px; cursor:none; color:#fff; text-align:center; transition:background 0.12s, border-color 0.12s; display:flex; flex-direction:column; align-items:center; gap:5px; }
.shape-btn:hover { background:rgba(255,255,255,0.09); border-color:rgba(255,255,255,0.22); }
.shape-icon { width:32px; height:32px; display:flex; align-items:center; justify-content:center; }
.shape-icon svg { width:28px; height:28px; }
.shape-label { font-size:9px; letter-spacing:0.15em; text-transform:uppercase; color:rgba(255,255,255,0.45); display:flex; flex-direction:column; gap:2px; align-items:center; }
.shape-trait { font-size:8px; color:rgba(255,255,255,0.22); letter-spacing:0.05em; text-transform:none; }
.ctx-divider { height:1px; background:rgba(255,255,255,0.06); margin:6px 0; }
.ctx-action { background:transparent; border:none; width:100%; padding:7px 8px; text-align:left; cursor:none; font-family:'Helvetica Neue',Arial,sans-serif; font-size:10px; letter-spacing:0.1em; text-transform:uppercase; color:rgba(255,255,255,0.3); border-radius:4px; transition:background 0.1s, color 0.1s; display:flex; align-items:center; gap:8px; }
.ctx-action:hover { background:rgba(255,255,255,0.05); color:rgba(255,255,255,0.6); }
.ctx-action.danger:hover { background:rgba(255,60,60,0.1); color:rgba(255,80,80,0.7); }

/* ── PANEL ── */
#panel {
  position:fixed; top:70px; right:16px; width:186px;
  background:rgba(10,10,10,0.85); border:1px solid rgba(255,255,255,0.07);
  backdrop-filter:blur(12px); z-index:100; border-radius:6px;
}
#panel-header { display:flex; align-items:center; justify-content:space-between; padding:9px 12px; border-bottom:1px solid rgba(255,255,255,0.04); }
#panel-title { font-size:9px; letter-spacing:0.3em; color:rgba(255,255,255,0.18); text-transform:uppercase; }
#btn-playpause { background:transparent; border:1px solid rgba(255,255,255,0.12); color:rgba(255,255,255,0.38); font-family:'Courier New',monospace; font-size:9px; letter-spacing:0.1em; padding:3px 7px; cursor:none; text-transform:uppercase; transition:all 0.15s; border-radius:3px; }
#btn-playpause:hover { color:#fff; border-color:rgba(255,255,255,0.35); }
#btn-playpause.paused { color:rgba(255,180,80,0.85); border-color:rgba(255,160,60,0.3); }
#panel-body { padding:11px; display:flex; flex-direction:column; gap:9px; }
.ctrl-row { display:flex; flex-direction:column; gap:4px; }
.ctrl-label { display:flex; justify-content:space-between; align-items:baseline; }
.ctrl-name { font-size:9px; letter-spacing:0.18em; color:rgba(255,255,255,0.18); text-transform:uppercase; }
.ctrl-val { font-size:9px; color:rgba(255,255,255,0.32); min-width:30px; text-align:right; }
input[type=range] { -webkit-appearance:none; width:100%; height:1px; background:rgba(255,255,255,0.08); outline:none; cursor:none; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:8px; height:8px; border-radius:50%; background:rgba(255,255,255,0.55); cursor:none; transition:transform 0.1s; }
input[type=range]::-webkit-slider-thumb:hover { transform:scale(1.5); background:#fff; }
.divider { height:1px; background:rgba(255,255,255,0.04); margin:1px 0; }
.tog { background:transparent; border:1px solid rgba(255,255,255,0.08); color:rgba(255,255,255,0.22); font-family:'Courier New',monospace; font-size:9px; letter-spacing:0.1em; padding:2px 7px; cursor:none; text-transform:uppercase; transition:all 0.15s; border-radius:3px; }
.tog:hover { color:rgba(255,255,255,0.55); border-color:rgba(255,255,255,0.25); }
.tog.on { color:rgba(255,255,255,0.75); border-color:rgba(255,255,255,0.35); }
.check-row { display:flex; align-items:center; justify-content:space-between; }

/* ── GAME HUD ── */
#game-hud {
  position:fixed; top:70px; left:16px; width:180px;
  background:rgba(10,10,10,0.85); border:1px solid rgba(255,255,255,0.07);
  backdrop-filter:blur(12px); z-index:100; border-radius:6px;
  padding:12px;
}
#game-hud-title { font-size:9px; letter-spacing:0.3em; color:rgba(255,255,255,0.18); text-transform:uppercase; margin-bottom:10px; }
.target-row { display:flex; align-items:center; gap:8px; margin-bottom:7px; }
.target-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.target-bar-bg { flex:1; height:3px; background:rgba(255,255,255,0.06); border-radius:2px; overflow:hidden; }
.target-bar-fill { height:100%; border-radius:2px; transition:width 0.15s; }
.target-pct { font-size:9px; color:rgba(255,255,255,0.25); min-width:28px; text-align:right; }
.target-check { font-size:10px; opacity:0; transition:opacity 0.3s; }
.target-check.done { opacity:1; }

#level-info { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
#level-label { font-size:9px; letter-spacing:0.25em; color:rgba(255,255,255,0.12); text-transform:uppercase; }
#level-val { font-size:9px; color:rgba(255,255,255,0.3); }

/* ── SCREENSHOT BUTTON ── */
#screenshot-btn {
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
  background:rgba(255,255,255,0.95); color:#0a0a0a;
  border:none; padding:10px 24px; border-radius:4px;
  font-family:'Helvetica Neue',Arial,sans-serif; font-size:11px;
  font-weight:700; letter-spacing:0.12em; text-transform:uppercase;
  cursor:none; z-index:500;
  box-shadow:0 4px 24px rgba(255,255,255,0.2);
  transition:all 0.2s;
  opacity:0; pointer-events:none;
}
#screenshot-btn.visible { opacity:1; pointer-events:auto; animation: pulse-btn 2s infinite; }
@keyframes pulse-btn {
  0%,100% { box-shadow:0 4px 24px rgba(255,255,255,0.2); }
  50% { box-shadow:0 4px 40px rgba(255,255,255,0.55); }
}
#screenshot-btn:hover { background:#fff; box-shadow:0 6px 32px rgba(255,255,255,0.4); }

/* ── LEVEL COMPLETE FLASH ── */
#complete-flash {
  position:fixed; inset:0; pointer-events:none; z-index:600;
  background:rgba(255,255,255,0);
  transition:background 0.1s;
}
#complete-flash.flash { background:rgba(255,255,255,0.12); }

/* ── NEXT LEVEL BUTTON ── */
#next-btn {
  position:fixed; bottom:68px; left:50%; transform:translateX(-50%);
  background:transparent; color:rgba(255,255,255,0.4);
  border:1px solid rgba(255,255,255,0.15); padding:7px 20px; border-radius:4px;
  font-family:'Helvetica Neue',Arial,sans-serif; font-size:10px;
  font-weight:600; letter-spacing:0.15em; text-transform:uppercase;
  cursor:none; z-index:500;
  transition:all 0.2s;
  opacity:0; pointer-events:none;
}
#next-btn.visible { opacity:1; pointer-events:auto; }
#next-btn:hover { color:rgba(255,255,255,0.8); border-color:rgba(255,255,255,0.4); }

#hint {
  position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
  font-size:9px; letter-spacing:0.28em; color:rgba(255,255,255,0.14);
  text-transform:uppercase; pointer-events:none; transition:opacity 1s; white-space:nowrap;
}
#shape-count { position:fixed; bottom:20px; right:16px; font-size:9px; letter-spacing:0.2em; color:rgba(255,255,255,0.14); text-transform:uppercase; pointer-events:none; }
</style>
</head>
<body>

<div id="cursor"></div>
<div id="snap-hint"></div>

<div id="dispenser">
  <button id="cta-btn">
    <svg id="icon-pause" width="10" height="11" viewBox="0 0 10 11" fill="currentColor"><rect x="0" y="0" width="3.5" height="11" rx="1"/><rect x="6.5" y="0" width="3.5" height="11" rx="1"/></svg>
    <svg id="icon-play" width="10" height="11" viewBox="0 0 10 11" fill="currentColor" style="display:none"><polygon points="0,0 10,5.5 0,11"/></svg>
    <span id="btn-label">Pause</span>
  </button>
</div>

<!-- Game HUD -->
<div id="game-hud">
  <div id="level-info">
    <span id="level-label">LEVEL</span>
    <span id="level-val">1 · 1 TARGET</span>
  </div>
  <div id="game-hud-title">REDIRECT TARGETS</div>
  <div id="targets-container"></div>
</div>

<!-- Context Menu -->
<div id="ctx-menu">
  <div class="ctx-title">Insert shape</div>
  <div class="shape-grid">
    <button class="shape-btn" data-shape="cube">
      <div class="shape-icon"><svg viewBox="0 0 28 28" fill="none"><path d="M14 3L25 8.5V19.5L14 25L3 19.5V8.5L14 3Z" stroke="rgba(255,255,255,0.6)" stroke-width="1" fill="rgba(255,255,255,0.04)"/><path d="M14 3L14 25M3 8.5L25 8.5" stroke="rgba(255,255,255,0.25)" stroke-width="0.7"/></svg></div>
      <div class="shape-label">Cube<span class="shape-trait">bouncy · light</span></div>
    </button>
    <button class="shape-btn" data-shape="sphere">
      <div class="shape-icon"><svg viewBox="0 0 28 28" fill="none"><circle cx="14" cy="14" r="10" stroke="rgba(255,255,255,0.6)" stroke-width="1" fill="rgba(255,255,255,0.04)"/><ellipse cx="14" cy="14" rx="10" ry="4" stroke="rgba(255,255,255,0.2)" stroke-width="0.7"/></svg></div>
      <div class="shape-label">Sphere<span class="shape-trait">slippery · fast</span></div>
    </button>
    <button class="shape-btn" data-shape="pyramid">
      <div class="shape-icon"><svg viewBox="0 0 28 28" fill="none"><path d="M14 4L26 22H2L14 4Z" stroke="rgba(255,255,255,0.6)" stroke-width="1" fill="rgba(255,255,255,0.04)"/></svg></div>
      <div class="shape-label">Pyramid<span class="shape-trait">sharp · deflects</span></div>
    </button>
    <button class="shape-btn" data-shape="torus">
      <div class="shape-icon"><svg viewBox="0 0 28 28" fill="none"><ellipse cx="14" cy="16" rx="10" ry="5" stroke="rgba(255,255,255,0.6)" stroke-width="1" fill="none"/><ellipse cx="14" cy="14" rx="10" ry="5" stroke="rgba(255,255,255,0.35)" stroke-width="0.7" fill="rgba(10,10,10,0.9)"/><ellipse cx="14" cy="14" rx="4" ry="2" stroke="rgba(255,255,255,0.5)" stroke-width="0.8" fill="none"/></svg></div>
      <div class="shape-label">Ring<span class="shape-trait">hollow · splits</span></div>
    </button>
    <button class="shape-btn" data-shape="wedge">
      <div class="shape-icon"><svg viewBox="0 0 28 28" fill="none"><path d="M4 22L24 22L24 8L4 22Z" stroke="rgba(255,255,255,0.6)" stroke-width="1" fill="rgba(255,255,255,0.04)"/></svg></div>
      <div class="shape-label">Wedge<span class="shape-trait">heavy · anchored</span></div>
    </button>
    <button class="shape-btn" data-shape="diamond">
      <div class="shape-icon"><svg viewBox="0 0 28 28" fill="none"><path d="M14 3L25 14L14 25L3 14L14 3Z" stroke="rgba(255,255,255,0.6)" stroke-width="1" fill="rgba(255,255,255,0.04)"/></svg></div>
      <div class="shape-label">Diamond<span class="shape-trait">glassy · spreads</span></div>
    </button>
  </div>
  <div class="ctx-divider"></div>
  <button class="ctx-action" id="ctx-reset-shapes">
    <svg width="11" height="11" viewBox="0 0 11 11" fill="none"><path d="M1 5.5A4.5 4.5 0 109.5 3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/><path d="M7 1l2.5 2-2 2.2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Reset shapes
  </button>
  <button class="ctx-action danger" id="ctx-clear-shapes">
    <svg width="11" height="11" viewBox="0 0 11 11" fill="none"><path d="M2 2.5L9 9.5M9 2.5L2 9.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
    Clear all shapes
  </button>
</div>

<!-- Control Panel -->
<div id="panel">
  <div id="panel-header">
    <div id="panel-title">FLOW</div>
    <button id="btn-playpause">❚❚ PAUSE</button>
  </div>
  <div id="panel-body">
    <div class="ctrl-row">
      <div class="ctrl-label"><span class="ctrl-name">AMOUNT</span><span class="ctrl-val" id="val-count">4000</span></div>
      <input type="range" id="sl-count" min="500" max="8000" step="100" value="4000">
    </div>
    <div class="ctrl-row">
      <div class="ctrl-label"><span class="ctrl-name">GRAVITY</span><span class="ctrl-val" id="val-gravity">9.8</span></div>
      <input type="range" id="sl-gravity" min="1" max="30" step="0.1" value="9.8">
    </div>
    <div class="ctrl-row">
      <div class="ctrl-label"><span class="ctrl-name">SPREAD</span><span class="ctrl-val" id="val-spread">0.30</span></div>
      <input type="range" id="sl-spread" min="0.05" max="2.5" step="0.05" value="0.3">
    </div>
    <div class="ctrl-row">
      <div class="ctrl-label"><span class="ctrl-name">BOUNCE</span><span class="ctrl-val" id="val-bounce">0.25</span></div>
      <input type="range" id="sl-bounce" min="0" max="1.0" step="0.01" value="0.25">
    </div>
    <div class="ctrl-row">
      <div class="ctrl-label"><span class="ctrl-name">SIZE</span><span class="ctrl-val" id="val-size">1.00</span></div>
      <input type="range" id="sl-size" min="0.2" max="3.0" step="0.05" value="1.0">
    </div>
    <div class="divider"></div>
    <div class="check-row">
      <span class="ctrl-name">RAIN MODE</span>
      <button class="tog" id="tog-rain">OFF</button>
    </div>
    <div class="divider"></div>
    <div class="check-row">
      <span class="ctrl-name">RESET PARTICLES</span>
      <button class="tog" id="tog-reset">GO</button>
    </div>
  </div>
</div>

<div id="hint">DRAG BUTTON · RIGHT CLICK TO ADD SHAPES · CLICK SHAPE TO ROTATE</div>
<div id="shape-count"></div>
<div id="complete-flash"></div>
<button id="screenshot-btn">📸 CAPTURE MOMENT</button>
<button id="next-btn">NEXT LEVEL →</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ── RENDERER ─────────────────────────────────────────────────────────────────
let W = window.innerWidth, H = window.innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0x0a0a0a);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0a0a, 0.016);

const camera = new THREE.PerspectiveCamera(50, W/H, 0.1, 200);
camera.position.set(0, 1.5, 28);
camera.lookAt(0, 0, 0);

scene.add(new THREE.AmbientLight(0xffffff, 0.07));
const mainLight = new THREE.PointLight(0xfff5ee, 3.2, 70);
mainLight.position.set(11, -1, 14); scene.add(mainLight);
const rimLight = new THREE.PointLight(0x9aaabb, 0.6, 40);
rimLight.position.set(-9, 5, 10); scene.add(rimLight);

const orbCanvas = document.createElement('canvas');
orbCanvas.width = orbCanvas.height = 256;
const orbCtx = orbCanvas.getContext('2d');
const og = orbCtx.createRadialGradient(128,128,0,128,128,128);
og.addColorStop(0,'rgba(255,255,248,1)'); og.addColorStop(0.08,'rgba(255,245,230,0.8)');
og.addColorStop(0.3,'rgba(220,210,190,0.18)'); og.addColorStop(1,'rgba(0,0,0,0)');
orbCtx.fillStyle=og; orbCtx.fillRect(0,0,256,256);
const orbSprite = new THREE.Sprite(new THREE.SpriteMaterial({
  map: new THREE.CanvasTexture(orbCanvas), transparent:true,
  blending:THREE.AdditiveBlending, depthWrite:false
}));
orbSprite.scale.set(22,22,1); orbSprite.position.set(11,-1,5); scene.add(orbSprite);

const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(100,100),
  new THREE.MeshStandardMaterial({color:0x050505, roughness:1.0})
);
floor.rotation.x = -Math.PI/2; floor.position.y = -9; scene.add(floor);

// ── UTILITIES ─────────────────────────────────────────────────────────────────
function screenToWorld(sx, sy) {
  const ndcX=(sx/W)*2-1, ndcY=-(sy/H)*2+1;
  const v = new THREE.Vector3(ndcX,ndcY,0.5).unproject(camera);
  const dir = v.sub(camera.position).normalize();
  const t = -camera.position.z / dir.z;
  return new THREE.Vector3(camera.position.x+dir.x*t, camera.position.y+dir.y*t, 0);
}

// ── GAME LEVELS ───────────────────────────────────────────────────────────────
// Target zone: worldX position at floor level (y=-9), radius in world units
// Colors: amber, cyan, rose
const TARGET_COLORS_HEX = [0xffb347, 0x47d4ff, 0xff6b8a];
const TARGET_COLORS_CSS = ['#ffb347','#47d4ff','#ff6b8a'];
const TARGET_THRESHOLD = 0.65; // 65% fill = target met

const LEVELS = [
  { targets: [{ x: 5.5, r: 2.8 }] },
  { targets: [{ x: -5.0, r: 2.5 }, { x: 6.0, r: 2.5 }] },
  { targets: [{ x: -6.5, r: 2.2 }, { x: 0, r: 2.0 }, { x: 6.5, r: 2.2 }] },
];

let currentLevel = 0;
let levelTargets = []; // { x, r, fill, mesh (ring on floor), label }
let levelComplete = false;
let screenshotReady = false;

// ── TARGET ZONES (floor ellipses) ────────────────────────────────────────────
const FLOOR_Y = -9.0;
const targetMeshes = [];

function worldToFloorScreen(wx, wy) {
  // project world coords to screen
  const v = new THREE.Vector3(wx, wy, 0);
  v.project(camera);
  return { sx: (v.x+1)/2*W, sy: (-v.y+1)/2*H };
}

// We'll draw targets on a 2D overlay canvas
const overlayCanvas = document.createElement('canvas');
overlayCanvas.style.cssText = 'position:fixed;top:0;left:0;pointer-events:none;z-index:50;';
overlayCanvas.width = W; overlayCanvas.height = H;
document.body.appendChild(overlayCanvas);
const overlayCtx = overlayCanvas.getContext('2d');

function initLevel(lvlIdx) {
  currentLevel = lvlIdx;
  levelComplete = false;
  screenshotReady = false;
  document.getElementById('screenshot-btn').classList.remove('visible');
  document.getElementById('next-btn').classList.remove('visible');

  const lvl = LEVELS[lvlIdx];
  levelTargets = lvl.targets.map((t, i) => ({
    x: t.x,
    r: t.r,
    fill: 0,
    colorHex: TARGET_COLORS_HEX[i],
    colorCSS: TARGET_COLORS_CSS[i],
    met: false,
    idx: i,
  }));

  buildTargetHUD();
  const total = LEVELS.length;
  document.getElementById('level-val').textContent =

  pyramid: { radius:1.45, bounce:0.85, mass:1.2,  springK:5.5,  damping:8.0,  color:0xffffff, roughness:0.8,  makeGeo:()=>new THREE.ConeGeometry(1.5,2.8,4),

             orientPresets:[new THREE.Euler(0,0,0),new THREE.Euler(Math.PI/2,0,0),new THREE.Euler(Math.PI/4,Math.PI/4,0),new THREE.Euler(0,Math.PI/3,Math.PI/6)] },
  wedge:   { radius:1.35, bounce:0.6,  mass:2.2,  springK:9.0,  damping:14.0, color:0xffffff, roughness:0.9,  makeGeo:()=>new THREE.CylinderGeometry(0,1.8,2.2,3),
             orientPresets:[new THREE.Euler(0,0,0),new THREE.Euler(0,Math.PI*(2/3),0),new THREE.Euler(0,Math.PI*(4/3),0),new THREE.Euler(Math.PI/2,0,0),new THREE.Euler(0,0,Math.PI/2)] },

             orientPresets:[new THREE.Euler(0,0,0),new THREE.Euler(0,Math.PI/4,0),new THREE.Euler(0,0,Math.PI/6),new THREE.Euler(Math.PI/6,Math.PI/4,0)] },

// ── SHAPE CLASS ───────────────────────────────────────────────────────────────
class PhysShape {
  constructor(type, startPos, rotEuler) {
    this.type = type;
    const def = SHAPE_DEFS[type];
    this.def = def;
    this.radius = def.radius;
    this.pos = startPos.clone();
    this.restPos = startPos.clone();
    this.vel = new THREE.Vector3();
    this.dragging = false;
    this.orientIdx = 0;
    this.targetEuler = rotEuler ? rotEuler.clone() : new THREE.Euler();
    this.currentEuler = this.targetEuler.clone();

    const mat = new THREE.MeshStandardMaterial({ color:def.color, roughness:def.roughness, metalness:type==='diamond'?0.15:0.02, transparent:type==='diamond', opacity:type==='diamond'?0.88:1.0 });
    this.mesh = new THREE.Mesh(def.makeGeo(), mat);
    this.mesh.rotation.copy(this.currentEuler);
    this.mesh.position.copy(this.pos);
    const eg = new THREE.EdgesGeometry(def.makeGeo(), 22);
    const eop = type==='sphere'?0.12:type==='diamond'?0.4:0.22;
    this.mesh.add(new THREE.LineSegments(eg, new THREE.LineBasicMaterial({color:0x888888,transparent:true,opacity:eop})));
    scene.add(this.mesh);
  }
  cycleOrientation() {
    const p = this.def.orientPresets;
    this.orientIdx = (this.orientIdx+1) % p.length;
    this.targetEuler = p[this.orientIdx].clone();
  }
  update(dt) {
    this.currentEuler.x += (this.targetEuler.x - this.currentEuler.x)*0.1;
    this.currentEuler.y += (this.targetEuler.y - this.currentEuler.y)*0.1;
    this.currentEuler.z += (this.targetEuler.z - this.currentEuler.z)*0.1;
    this.mesh.rotation.copy(this.currentEuler);
    if(!this.dragging){
      const xE=this.pos.x-this.restPos.x, yE=this.pos.y-this.restPos.y;
      this.vel.x -= xE*this.def.springK*dt;
      this.vel.y -= yE*this.def.springK*dt;
      this.vel.x -= this.vel.x*this.def.damping*dt;
      this.vel.y -= this.vel.y*this.def.damping*dt;
      this.pos.x += this.vel.x*dt*60;
      this.pos.y += this.vel.y*dt*60;
    }
    this.pos.z=0;
    const BX=13,BY_BOT=-8.5+this.radius,BY_TOP=14;
    if(this.pos.x> BX){this.pos.x= BX;this.vel.x*=-0.4;}
    if(this.pos.x<-BX){this.pos.x=-BX;this.vel.x*=-0.4;}
    if(this.pos.y<BY_BOT){this.pos.y=BY_BOT;this.vel.y*=-0.35;}
    if(this.pos.y>BY_TOP){this.pos.y=BY_TOP;this.vel.y*=-0.3;}
    this.mesh.position.copy(this.pos);
    this.mesh.updateMatrixWorld(true);
  }
  sdf(px,py,pz) {
    const l=this.mesh.worldToLocal(new THREE.Vector3(px,py,pz));
    const x=l.x,y=l.y,z=l.z;
    if(this.type==='cube'){const qx=Math.abs(x)-1.3,qy=Math.abs(y)-1.3,qz=Math.abs(z)-1.3;return Math.sqrt(Math.max(qx,0)**2+Math.max(qy,0)**2+Math.max(qz,0)**2)+Math.min(Math.max(qx,qy,qz),0);}
    if(this.type==='sphere'||this.type==='diamond') return Math.sqrt(x*x+y*y+z*z)-this.radius;
    if(this.type==='torus'){const qr=Math.sqrt(x*x+z*z)-1.2;return Math.sqrt(qr*qr+y*y)-0.42;}
    if(this.type==='pyramid'){const H=1.4,inR=1.5*Math.SQRT1_2,sl=Math.sqrt(inR*inR+(2*H)*(2*H)),nx=2*H/sl,ny=inR/sl,r2d=Math.max(Math.abs(x),Math.abs(z)),dS=r2d*nx+y*ny-inR*nx-(-H)*ny,dC=-H-y;if(dS<=0&&dC<=0)return Math.max(dS,dC);if(dS<=0)return dC;if(dC<=0)return dS;return Math.sqrt(dS*dS+dC*dC);}
    if(this.type==='wedge'){const H=1.1,inR=0.9,sl=Math.sqrt(inR*inR+(2*H)*(2*H)),nx=2*H/sl,ny=inR/sl,s3=Math.sin(Math.PI/3),c3=Math.cos(Math.PI/3),r0=x,r1=-c3*x+s3*z,r2=-c3*x-s3*z,r2d=Math.max(r0,r1,r2),dS=r2d*nx+y*ny-inR*nx-(-H)*ny,dC=-H-y;if(dS<=0&&dC<=0)return Math.max(dS,dC);if(dS<=0)return dC;if(dC<=0)return dS;return Math.sqrt(dS*dS+dC*dC);}
    return Math.sqrt(x*x+y*y+z*z)-this.radius;
  }
  dispose() {
    scene.remove(this.mesh);
    this.mesh.geometry.dispose();
    this.mesh.material.dispose();
    this.mesh.children.forEach(c=>{if(c.geometry)c.geometry.dispose();if(c.material)c.material.dispose();});
  }
}

// ── INITIAL SHAPES ─────────────────────────────────────────────────────────────
const INIT_LAYOUT = [
  { type:'cube',    pos:new THREE.Vector3( 0.4,  6.2,0), rot:new THREE.Euler(0,0.5,0.15) },
  { type:'sphere',  pos:new THREE.Vector3(-0.3,  2.4,0) },
  { type:'pyramid', pos:new THREE.Vector3( 0.3, -1.6,0), rot:new THREE.Euler(0,0.8,0) },
  { type:'wedge',   pos:new THREE.Vector3(-0.2, -5.2,0), rot:new THREE.Euler(0,Math.PI/5,0) },
];
let shapes = [];

function buildInitialShapes() {
  shapes.forEach(s=>s.dispose()); shapes=[];
  INIT_LAYOUT.forEach(d=>shapes.push(new PhysShape(d.type, d.pos, d.rot||null)));
  updateShapeCount();
}
function insertShape(type) {
  shapes.push(new PhysShape(type, new THREE.Vector3((Math.random()-0.5)*4, 10, 0)));
  updateShapeCount();
}
function clearAllShapes() { shapes.forEach(s=>s.dispose()); shapes=[]; updateShapeCount(); }
function updateShapeCount() {
  const el = document.getElementById('shape-count');
  el.textContent = shapes.length>0 ? shapes.length+' shapes' : '';
}
buildInitialShapes();

function resolveShapeCollisions() {
  for(let a=0;a<shapes.length;a++){
    for(let b=a+1;b<shapes.length;b++){
      const sa=shapes[a],sb=shapes[b];
      const dx=sb.pos.x-sa.pos.x,dy=sb.pos.y-sa.pos.y,dist=Math.sqrt(dx*dx+dy*dy),minD=sa.radius+sb.radius;
      if(dist>0.001&&dist<minD){
        const pen=minD-dist,nx=dx/dist,ny=dy/dist;
        const wa=sa.dragging?0:0.5,wb=sb.dragging?0:0.5;
        sa.pos.x-=nx*pen*wa; sa.pos.y-=ny*pen*wa;
        sb.pos.x+=nx*pen*wb; sb.pos.y+=ny*pen*wb;
        const dvx=sb.vel.x-sa.vel.x,dvy=sb.vel.y-sa.vel.y,dot=dvx*nx+dvy*ny;
        if(dot<0){const j=(1+0.5)*dot*0.5;
          if(!sa.dragging){sa.vel.x+=j*nx;sa.vel.y+=j*ny;}
          if(!sb.dragging){sb.vel.x-=j*nx;sb.vel.y-=j*ny;}}
      }
    }
  }
}

  fragmentShader:`varying float vFog;void main(){vec2 uv=gl_PointCoord-0.5;float d=length(uv);if(d>0.5)discard;float core=exp(-d*10.0);float soft=smoothstep(0.5,0.0,d)*0.5;float a=(core+soft)*(1.0-vFog*0.75);gl_FragColor=vec4(1.0,0.99,0.97,a*0.82);}`,

// ── TARGET ZONE COUNTING ──────────────────────────────────────────────────────
// For each target, count particles within its XZ cylinder at floor level
// We sample the live particle array each frame
const TARGET_SAMPLE_WINDOW = 120; // frames to smooth over
let frameCount = 0;

// Rolling counts: for each target, keep a ring buffer of recent frame counts
const FILL_ALPHA = 0.04; // smoothing
let targetCounts = []; // smoothed count per target

function countParticlesInTargets() {
  const N = Math.min(params.count, MAX_P);
  // Raw counts this frame
  const raw = levelTargets.map(()=>0);
  let total = 0;
  for(let i=0;i<N;i++){
    if(!palive[i]) continue;
    const b=i*3;
    // Only count particles near the floor
    if(ppos[b+1]>-7.5) continue; // above floor area
    total++;
    for(let t=0;t<levelTargets.length;t++){
      const tgt=levelTargets[t];
      const dx=ppos[b]-tgt.x, dz=ppos[b+2];
      const d2=dx*dx+dz*dz;
      if(d2<tgt.r*tgt.r) raw[t]++;
    }
  }
  // Smooth
  if(targetCounts.length!==levelTargets.length) targetCounts=levelTargets.map(()=>0);
  for(let t=0;t<levelTargets.length;t++){
    targetCounts[t]+=(raw[t]-targetCounts[t])*FILL_ALPHA;
    // Fill = fraction of particles in this target vs expected share
    const share = total>0 ? targetCounts[t]/total : 0;
    const normalizedFill = Math.min(share/(1/Math.max(levelTargets.length,1))*0.7,1);
    levelTargets[t].fill = normalizedFill;
    levelTargets[t].met = normalizedFill >= TARGET_THRESHOLD;
  }
}

  levelTargets.forEach((t,i)=>{
    const bar=document.getElementById('bar-'+i);
    const pct=document.getElementById('pct-'+i);

    if(!bar||!pct||!chk) return;
    bar.style.width=(t.fill*100).toFixed(1)+'%';
    pct.textContent=Math.round(t.fill*100)+'%';
    chk.classList.toggle('done',t.met);
  });
}

const cursorEl=document.getElementById('cursor');
const ray=new THREE.Raycaster();
const mvNDC=new THREE.Vector2();
let dragShape=null,dragOffset=new THREE.Vector3(),prevDragWP=null;
let lmbDownShape=null,lmbDownTime=0,lmbMoved=false;

renderer.domElement.addEventListener('mousedown',e=>{
  if(e.button===0){
    if(dispDragging) return;
    mvNDC.set((e.clientX/W)*2-1,-(e.clientY/H)*2+1);
    ray.setFromCamera(mvNDC,camera);
    const hits=ray.intersectObjects(shapes.map(s=>s.mesh),true);
    if(hits.length){
      const sh=shapes.find(s=>s.mesh===hits[0].object||s.mesh.children.includes(hits[0].object));
      if(sh){
        lmbDownShape=sh;lmbDownTime=Date.now();lmbMoved=false;
        dragShape=sh;sh.dragging=true;sh.vel.set(0,0,0);
        const wp=screenToWorld(e.clientX,e.clientY);
        dragOffset.set(wp.x-sh.pos.x,wp.y-sh.pos.y,0);
        prevDragWP=wp.clone();
      }
    }
  }
});
window.addEventListener('mousemove',e=>{
  mouseX=e.clientX;mouseY=e.clientY;
  if(dragShape){
    const wp=screenToWorld(e.clientX,e.clientY);
    if(prevDragWP){const dx=wp.x-prevDragWP.x,dy=wp.y-prevDragWP.y;if(Math.sqrt(dx*dx+dy*dy)>0.05)lmbMoved=true;}
    dragShape.pos.set(wp.x-dragOffset.x,wp.y-dragOffset.y,0);
    if(prevDragWP) dragShape.vel.set((wp.x-prevDragWP.x)*2.5,(wp.y-prevDragWP.y)*2.5,0);
    prevDragWP=wp.clone();
  }
});
window.addEventListener('mouseup',e=>{
  if(e.button===0&&dragShape){
    if(!lmbMoved&&(Date.now()-lmbDownTime)<350) dragShape.cycleOrientation();
    dragShape.restPos.set(dragShape.pos.x,dragShape.pos.y,0);
    dragShape.dragging=false;dragShape=null;prevDragWP=null;lmbDownShape=null;
  }
});

  const ipl  = document.getElementById('icon-play');
  // Update panel button
  const ppb  = document.getElementById('btn-playpause');

  if (paused) {
    btn.classList.add('paused');
    ip.style.display = 'none'; ipl.style.display = 'block';
    lbl.textContent = 'Play';
    ppb.textContent = '▶ PLAY';
    ppb.classList.add('paused');
  } else {
    btn.classList.remove('paused');
    ip.style.display = 'block'; ipl.style.display = 'none';
    lbl.textContent = 'Pause';
    ppb.textContent = '❚❚ PAUSE';
    ppb.classList.remove('paused');
    clock.getDelta(); // consume accumulated delta so we don't get a huge dt jump
  }
}

// CTA button click = toggle (only when not dragged)
ctaBtn.addEventListener('click', e => {
  if (!dispActuallyMoved) setPaused(!paused);
  e.stopPropagation();
});

// Panel button mirrors
document.getElementById('btn-playpause').addEventListener('click', () => setPaused(!paused));

function makeTog(id,on,off){
  const b=document.getElementById(id);let s=false;
  b.addEventListener('click',()=>{s=!s;b.textContent=s?'ON':'OFF';b.classList.toggle('on',s);s?on():off();});
}
makeTog('tog-rain',()=>params.rain=true,()=>params.rain=false);
document.getElementById('tog-reset').addEventListener('click',()=>{for(let i=0;i<MAX_P;i++)spawnParticle(i);});

// ── OVERLAY: DRAW TARGET ZONES ────────────────────────────────────────────────
// We project world coords to screen for the ellipse drawing
function drawTargetOverlay() {
  overlayCtx.clearRect(0,0,W,H);
  if(!levelTargets.length) return;

  const t = Date.now()*0.001;

  levelTargets.forEach((tgt, i)=>{
    // Project left and right edges of target circle to screen
    const cWorld = new THREE.Vector3(tgt.x, FLOOR_Y, 0);
    const lWorld = new THREE.Vector3(tgt.x-tgt.r, FLOOR_Y, 0);
    const rWorld = new THREE.Vector3(tgt.x+tgt.r, FLOOR_Y, 0);
    const fWorld = new THREE.Vector3(tgt.x, FLOOR_Y, tgt.r*0.55); // perspective depth

    // Project to NDC
    function proj(v){
      const c=v.clone().project(camera);
      return {x:(c.x+1)/2*W, y:(-c.y+1)/2*H};
    }
    const cs=proj(cWorld);
    const ls=proj(lWorld);
    const rs=proj(rWorld);
    const fs=proj(fWorld);

    const rx = (rs.x-ls.x)/2;    // horizontal radius in screen pixels
    const ry = Math.abs(fs.y-cs.y)*1.1; // vertical (perspective foreshortened)
    const cx2 = (rs.x+ls.x)/2;
    const cy2 = cs.y;

    const color = tgt.colorCSS;
    const fillRatio = tgt.fill;
    const isMet = tgt.met;

    // Outer dashed ring
    overlayCtx.save();
    overlayCtx.translate(cx2, cy2);
    overlayCtx.scale(1, ry/rx);
    overlayCtx.beginPath();
    overlayCtx.arc(0, 0, rx, 0, Math.PI*2);
    overlayCtx.restore();
    overlayCtx.setLineDash(isMet ? [] : [6,5]);
    overlayCtx.lineDashOffset = -t*18;
    overlayCtx.strokeStyle = isMet
      ? color
      : `rgba(${hexToRgb(tgt.colorCSS)},${0.35+fillRatio*0.45})`;
    overlayCtx.lineWidth = isMet ? 2.5 : 1.5;
    overlayCtx.shadowColor = color;
    overlayCtx.shadowBlur = isMet ? 14 : 4+fillRatio*10;
    overlayCtx.stroke();
    overlayCtx.setLineDash([]);
    overlayCtx.shadowBlur=0;

    // Fill arc (shows progress)
    if(fillRatio>0.01) {
      overlayCtx.save();
      overlayCtx.translate(cx2, cy2);
      overlayCtx.scale(1, ry/rx);
      overlayCtx.beginPath();
      overlayCtx.arc(0, 0, rx*0.88, -Math.PI/2, -Math.PI/2 + fillRatio*Math.PI*2);
      overlayCtx.restore();
      overlayCtx.strokeStyle = color;
      overlayCtx.globalAlpha = 0.55+fillRatio*0.3;
      overlayCtx.lineWidth = 3.5;
      overlayCtx.shadowColor = color;
      overlayCtx.shadowBlur = 8;
      overlayCtx.stroke();
      overlayCtx.globalAlpha = 1;
      overlayCtx.shadowBlur = 0;
    }

    // Inner glow fill when met
    if(isMet) {
      overlayCtx.save();
      overlayCtx.translate(cx2, cy2);
      overlayCtx.scale(1, ry/rx);
      const grd = overlayCtx.createRadialGradient(0,0,0,0,0,rx*0.85);
      grd.addColorStop(0, hexToRgba(color,0.12+Math.sin(t*3)*0.04));
      grd.addColorStop(1, hexToRgba(color,0));
      overlayCtx.beginPath();
      overlayCtx.arc(0, 0, rx*0.85, 0, Math.PI*2);
      overlayCtx.fillStyle = grd;
      overlayCtx.fill();
      overlayCtx.restore();
    }

    // Label
    overlayCtx.font = '10px Courier New';
    overlayCtx.letterSpacing = '0.2em';
    overlayCtx.fillStyle = isMet ? color : `rgba(${hexToRgb(color)},${0.35+fillRatio*0.4})`;
    overlayCtx.textAlign = 'center';
    overlayCtx.shadowColor = color;
    overlayCtx.shadowBlur = isMet ? 10 : 4;
    overlayCtx.fillText(isMet ? '✓ FILLED' : `TARGET ${String.fromCharCode(65+i)}`, cx2, cy2+ry+16);
    overlayCtx.shadowBlur=0;
  });
}

function hexToRgb(hex){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `${r},${g},${b}`;
}
function hexToRgba(hex,a){return `rgba(${hexToRgb(hex)},${a})`;}

// ── MAIN LOOP ─────────────────────────────────────────────────────────────────
initLevel(0);

function tick(){
  requestAnimationFrame(tick);
  const dt=Math.min(clock.getDelta(),0.033);

  // cursor
  cvx+=(mouseX-cursorX)*0.18; cvy+=(mouseY-cursorY)*0.18;
  cvx*=0.62; cvy*=0.62;
  cursorX+=cvx; cursorY+=cvy;
  const spd=Math.sqrt(cvx*cvx+cvy*cvy);
  const ang=spd>0.5?Math.atan2(cvy,cvx)*180/Math.PI:0;
  const stretch=Math.min(spd*0.55,13);
  const cw=18+stretch,ch=Math.max(6,11-stretch*0.28);
  cursorEl.style.transform=`translate(${cursorX-cw/2}px,${cursorY-ch/2}px) rotate(${ang}deg)`;
  cursorEl.style.width=cw+'px'; cursorEl.style.height=ch+'px';

  if(paused){
    drawTargetOverlay();
    renderer.render(scene,camera);
    return;
  }

  resolveShapeCollisions();
  shapes.forEach(s=>s.update(dt));
  pMat.uniforms.uSize.value=params.size;
  const N=Math.min(params.count,MAX_P);

  for(let i=0;i<N;i++){
    const b=i*3;
    if(!palive[i]){spawnParticle(i);continue;}
    page[i]+=dt;
    if(page[i]>plife[i]){spawnParticle(i);continue;}
    pvel[b+1]-=params.gravity*dt;
    if(params.rain){pvel[b]-=ppos[b]*0.4*dt;pvel[b+2]-=ppos[b+2]*0.3*dt;}
    ppos[b]  +=pvel[b]  *dt;
    ppos[b+1]+=pvel[b+1]*dt;
    ppos[b+2]+=pvel[b+2]*dt;
    ppos[b+2]-=ppos[b+2]*0.4*dt;
    pvel[b+2]*=0.92;
    for(let s=0;s<shapes.length;s++){
      const sh=shapes[s];
      const d=sh.sdf(ppos[b],ppos[b+1],ppos[b+2]);
      if(d<PR){
        sdfNorm(sh,ppos[b],ppos[b+1],ppos[b+2]);
        const pen=PR-d;
        ppos[b]+=_n.x*pen;ppos[b+1]+=_n.y*pen;ppos[b+2]+=_n.z*pen;
        const dot=pvel[b]*_n.x+pvel[b+1]*_n.y+pvel[b+2]*_n.z;
        if(dot<0){
          const bFactor=params.bounce*sh.def.bounce;
          pvel[b]  -=(1+bFactor)*dot*_n.x;
          pvel[b+1]-=(1+bFactor)*dot*_n.y;
          pvel[b+2]-=(1+bFactor)*dot*_n.z;
          pvel[b]  +=(Math.random()-0.5)*0.2;
          pvel[b+2]+=(Math.random()-0.5)*0.08;
        }
      }
    }
    if(ppos[b+1]<-8.9){ppos[b+1]=-8.9;pvel[b+1]=Math.abs(pvel[b+1])*0.04;pvel[b]*=0.55;pvel[b+2]*=0.55;}
    if(Math.abs(ppos[b])>22) spawnParticle(i);
    pvel[b]*=0.997;
  }
  // kill any beyond N
  for(let i=N;i<MAX_P;i++){if(palive[i]){palive[i]=0;ppos[i*3+1]=-9999;}}

  pGeo.attributes.position.needsUpdate=true;

  countParticlesInTargets();
  updateTargetHUD();
  checkLevelComplete();
  drawTargetOverlay();

  renderer.render(scene,camera);
  frameCount++;
}

tick();

window.addEventListener('resize',()=>{
  W=window.innerWidth;H=window.innerHeight;
  camera.aspect=W/H;camera.updateProjectionMatrix();renderer.setSize(W,H);
  overlayCanvas.width=W;overlayCanvas.height=H;
});
setTimeout(()=>{document.getElementById('hint').style.opacity='0';},7000);
</script>
