<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Logo Stage — Notifications</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,100..1000&display=swap" rel="stylesheet">
<style>
/* ════════ DESKTOP (default) ════════ */
:root{color-scheme:dark;--glass:#3a3838f2;--line:#ffffff1c;--line-2:#ffffff26;--line-3:#ffffff12;--cream:#ecebdc;--mut:#a09f90;--k:#c9c8ae;--bg:#2e2d2e;box-sizing:border-box}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);font:14px/1.5 Inter,system-ui,-apple-system,sans-serif;color:var(--cream);-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0;touch-action:pan-y;cursor:grab}
#track{position:absolute;inset:0;perspective:800px}
.it{position:absolute;left:0;top:0;display:flex;cursor:pointer;white-space:nowrap;text-decoration:none;user-select:none;-webkit-user-drag:none;will-change:transform,opacity,filter;outline:none;
 background:color-mix(in srgb,var(--acc) calc(var(--hl,0)*100%),var(--fill));color:color-mix(in srgb,var(--onacc) calc(var(--hl,0)*100%),var(--ink));
 border:1px solid var(--bd);border-radius:var(--r);padding:var(--pad);font-size:var(--fs);transition:background .5s,color .5s}
.it .in{display:flex;align-items:center;filter:grayscale(var(--g,0))}
.it .tx{display:inline-block;position:relative;font-weight:700;letter-spacing:-.025em;line-height:1}
.it .tx-text{display:block;white-space:nowrap;color:inherit}
.it:focus-visible{box-shadow:0 0 0 2px var(--k)}
.swap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.slot{position:relative;flex:none}
.slot .it{left:50%;top:50%;transform:translate(-50%,-50%);transition:opacity .6s,background .5s,color .5s}

/* ══════════════════════════════════════════════════════════════
   CHROMATIC ABERRATION — hover-driven
   Three absolutely positioned overlay copies (R/G/B), screen-blended
   over a visible base wordmark. Opacity is driven by --ci (0..1) set
   from JS: 0 = off (default), high = heavy split (out of focus),
   low = nearly off (in focus).
   ══════════════════════════════════════════════════════════════ */
@keyframes chroma-r {
  0%, 100% { transform: translate(-0.09em, 0); }
  22%      { transform: translate(-0.15em, 0.03em); }
  48%      { transform: translate(-0.07em, -0.03em); }
  74%      { transform: translate(-0.13em, 0.02em); }
}
@keyframes chroma-g {
  0%, 100% { transform: translate(0.01em, 0); }
  32%      { transform: translate(0.02em, -0.025em); }
  66%      { transform: translate(-0.01em, 0.025em); }
}
@keyframes chroma-b {
  0%, 100% { transform: translate(0.09em, 0); }
  22%      { transform: translate(0.15em, -0.03em); }
  48%      { transform: translate(0.07em, 0.03em); }
  74%      { transform: translate(0.13em, -0.02em); }
}

.chroma{
  position:absolute;
  inset:0;
  pointer-events:none;
}
.chroma__ch{
  position:absolute;
  top:0; left:0;
  display:inline-block;
  white-space:nowrap;
  font:inherit;
  letter-spacing:inherit;
  line-height:inherit;
  will-change:transform,opacity;
  opacity:var(--ci, 0);
  transition:opacity .35s ease;
  color:transparent;
}
.chroma__ch--r{ color:#ff2d55; mix-blend-mode:screen; animation:chroma-r 4.2s ease-in-out infinite; }
.chroma__ch--g{ color:#00ff5a; mix-blend-mode:screen; animation:chroma-g 5.6s ease-in-out infinite; }
.chroma__ch--b{ color:#2d9aff; mix-blend-mode:screen; animation:chroma-b 4.8s ease-in-out infinite; }

/* zack.cx — chromatic on hover, untouched */
@keyframes zackChroma {
  0%, 100% { text-shadow: -0.09em 0 #ff2d55, 0.09em 0 #2d9aff; }
  25%      { text-shadow: -0.15em 0.02em #ff2d55, 0.13em -0.02em #2d9aff; }
  50%      { text-shadow: -0.07em -0.02em #ff2d55, 0.07em 0.02em #2d9aff; }
  75%      { text-shadow: -0.13em 0 #ff2d55, 0.14em 0 #2d9aff; }
}

#tip{position:fixed;left:0;top:0;z-index:20;pointer-events:none;opacity:0;transition:opacity .2s ease,filter .12s ease;background:none;border:none;padding:0;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;max-width:340px;will-change:transform,filter}
#tip.on{opacity:1}
#tip .tip-name{display:block;font-family:'Inter',sans-serif;font-weight:700;font-size:16px;letter-spacing:-.025em;line-height:1.08;color:var(--cream);margin:0 0 10px;white-space:nowrap}
#tip .tip-rule{display:block;width:22px;height:1px;background:var(--cream);opacity:.4;margin:0 0 9px}
#tip .tip-meta{display:block;font-family:'Inter',sans-serif;font-size:9.5px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;line-height:1.4;color:var(--mut);white-space:nowrap}
#tip .tip-span{color:var(--cream);opacity:.72;font-variant-numeric:tabular-nums}
#tip .tip-sep{opacity:.35;margin:0 .7em}
#tip .tip-cat{color:var(--mut)}
#zackMark{position:fixed;top:calc(env(safe-area-inset-top,0px) + 20px);left:calc(env(safe-area-inset-left,0px) + 24px);z-index:55;font-family:'Roboto Flex',Inter,sans-serif;font-weight:500;font-size:17px;letter-spacing:-.015em;color:var(--cream);text-decoration:none;cursor:pointer;user-select:none;line-height:1;display:inline-block;opacity:.85;transition:opacity .25s ease}
#zackMark:hover{opacity:1;animation:zackChroma 3.2s ease-in-out infinite}
#zackMark .pc{display:inline-block;will-change:font-variation-settings}
#notifStack{position:fixed;right:0;top:0;bottom:0;z-index:30;width:min(460px,100vw);display:none;flex-direction:column;pointer-events:none;padding-top:calc(env(safe-area-inset-top,0px) + 56px)}
#notifStack.on{display:flex}
.stack-head{
  pointer-events:auto;
  flex:none;
  display:flex;
  align-items:center;
  gap:14px;
  padding:14px 32px 12px;
  background:none;
  backdrop-filter:none;
  -webkit-backdrop-filter:none;
  border-bottom:1px solid var(--line);
  font-family:'Inter',sans-serif;
  font-size:10.5px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--mut);
  font-weight:500
}
.stack-head .brand-mark{flex:1;min-width:0;display:flex;align-items:baseline;gap:10px;overflow:hidden}
.stack-head .bm-name{color:var(--cream);font-size:13px;font-weight:600;letter-spacing:-.01em;text-transform:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stack-head .bm-cat{color:var(--mut);font-size:10px;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stack-head .count{color:var(--mut);font-family:'Inter',sans-serif;font-size:10px;letter-spacing:.1em;font-variant-numeric:tabular-nums;white-space:nowrap;flex:none}
.stack-head .stack-btns{display:flex;gap:2px;align-items:center;flex:none;margin-left:2px}
.stack-btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;color:var(--mut);transition:color .18s,background .18s}
.stack-btn:hover{color:var(--cream);background:#ffffff0d}
.stack-btn:focus-visible{outline:2px solid var(--k);outline-offset:1px}
.stack-btn svg{width:13px;height:13px;display:block;stroke-width:1.6}
.stack-body{pointer-events:auto;flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;-ms-overflow-style:none;padding:0 0 180px;mask-image:linear-gradient(to bottom,#000 0,#000 calc(100% - 140px),transparent 100%);-webkit-mask-image:linear-gradient(to bottom,#000 0,#000 calc(100% - 140px),transparent 100%)}
.stack-body::-webkit-scrollbar{display:none}
.notif{position:relative;padding:24px 32px 26px;border-top:1px solid var(--line);animation:slideIn .45s cubic-bezier(.2,.9,.3,1) both;transition:opacity .42s cubic-bezier(.4,0,.2,1),transform .42s cubic-bezier(.4,0,.2,1),max-height .42s cubic-bezier(.4,0,.2,1),padding .42s cubic-bezier(.4,0,.2,1),border-top-color .4s;will-change:transform,opacity;max-height:2400px}
.notif:first-child{border-top:none}
@keyframes slideIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.notif.dismissed{opacity:0;transform:translateX(24px);max-height:0;padding-top:0;padding-bottom:0;border-top-color:transparent;pointer-events:none;overflow:hidden}
.notif .n-kicker{display:block;font-family:'Inter',sans-serif;font-size:10px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);margin:0 0 14px}
.notif .n-title{font-family:'Inter',sans-serif;font-weight:600;font-size:18px;letter-spacing:-.02em;line-height:1.24;color:var(--cream);margin:0 0 10px;text-wrap:pretty;padding-right:22px}
.notif .n-msg{font-family:'Inter',sans-serif;font-size:14px;font-weight:400;line-height:1.55;color:#c3c2b2;margin:0;text-wrap:pretty}
.notif .n-msg b{color:var(--cream);font-weight:600}
.notif .n-msg em{color:#d6d5c6;font-style:italic}
.notif .n-media{display:block;margin-top:18px;cursor:zoom-in;transition:opacity .25s ease}
.notif .n-media:hover{opacity:.94}
.notif .n-media img{display:block;width:100%;height:auto;max-width:100%;background:#1a1a1a;border-radius:2px}
.notif .n-media-cap{display:block;margin-top:8px;font-family:'Inter',sans-serif;font-size:10px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.notif .n-media-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:18px}
.notif .n-media-grid.n-2{grid-template-columns:repeat(2,1fr)}
.notif .n-media-grid.n-4{grid-template-columns:repeat(2,1fr)}
.notif .n-media-grid .n-thumb{display:block;aspect-ratio:1/1;overflow:hidden;border-radius:2px;background:#1a1a1a;cursor:zoom-in;transition:opacity .2s}
.notif .n-media-grid .n-thumb:hover{opacity:.85}
.notif .n-media-grid .n-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.notif details.n-more{margin-top:16px}
.notif details.n-more summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:8px;padding:6px 0;font-family:'Inter',sans-serif;font-size:10.5px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);user-select:none;transition:color .2s}
.notif details.n-more summary::-webkit-details-marker{display:none}
.notif details.n-more summary::after{content:'';display:inline-block;width:10px;height:10px;border-right:1px solid currentColor;border-bottom:1px solid currentColor;transform:rotate(45deg) translate(-2px,-2px);transition:transform .25s ease}
.notif details.n-more[open] summary::after{transform:rotate(-135deg) translate(-2px,0)}
.notif details.n-more summary:hover{color:var(--cream)}
.notif details.n-more .n-details{margin-top:6px;padding:14px 0 0;border-top:1px solid var(--line-3);font-family:'Inter',sans-serif;font-size:13.5px;line-height:1.65;color:#b9b8ab}
.notif details.n-more .n-details p{margin:0 0 10px}
.notif details.n-more .n-details p:last-child{margin-bottom:0}
.notif .n-close{all:unset;position:absolute;top:22px;right:28px;width:22px;height:22px;display:grid;place-items:center;cursor:pointer;color:var(--mut);transition:color .2s}
.notif .n-close::before,
.notif .n-close::after{content:'';position:absolute;top:50%;left:50%;width:11px;height:1px;background:currentColor;transform:translate(-50%,-50%) rotate(45deg);transition:transform .25s ease}
.notif .n-close::after{transform:translate(-50%,-50%) rotate(-45deg)}
.notif .n-close:hover{color:var(--cream)}
.notif .n-close:hover::before{transform:translate(-50%,-50%) rotate(135deg)}
.notif .n-close:hover::after{transform:translate(-50%,-50%) rotate(45deg)}
.notif .n-close:focus-visible{outline:2px solid var(--k);outline-offset:3px;border-radius:4px}

#lightbox{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;background:#000000e6;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding:48px;cursor:zoom-out;animation:lbIn .25s ease both}
#lightbox.on{display:flex}
@keyframes lbIn{from{opacity:0}to{opacity:1}}
#lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:3px;box-shadow:0 30px 80px #000c;animation:lbImgIn .35s cubic-bezier(.2,.9,.3,1) both}
@keyframes lbImgIn{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
#lightbox .lb-close{position:absolute;top:24px;right:24px;width:40px;height:40px;border-radius:50%;background:#ffffff0d;border:1px solid #ffffff1c;color:#fff;display:grid;place-items:center;cursor:pointer;transition:background .2s,transform .2s;font-family:inherit;padding:0;position:relative}
#lightbox .lb-close::before,
#lightbox .lb-close::after{content:'';position:absolute;top:50%;left:50%;width:14px;height:1px;background:currentColor;transform:translate(-50%,-50%) rotate(45deg)}
#lightbox .lb-close::after{transform:translate(-50%,-50%) rotate(-45deg)}
#lightbox .lb-close:hover{background:#ffffff1c;transform:scale(1.05)}
#cw{position:fixed;left:max(16px,env(safe-area-inset-left));bottom:max(16px,env(safe-area-inset-bottom));z-index:40}
#gear{all:unset;cursor:pointer;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#ffffff0d;border:1px solid var(--line);color:var(--mut);transition:.2s;backdrop-filter:blur(10px)}
#gear:hover,#cw.open #gear{color:var(--cream);background:#ffffff18}
#gear svg{width:18px;height:18px;transition:transform .4s}#cw.open #gear svg{transform:rotate(90deg)}
#pn{position:absolute;left:0;bottom:48px;width:290px;max-height:min(70vh,560px);overflow:auto;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:16px;padding:6px 14px;opacity:0;transform:translateY(8px) scale(.98);transform-origin:bottom left;pointer-events:none;transition:.22s;box-shadow:0 20px 50px #0007}
#cw.open #pn{opacity:1;transform:none;pointer-events:auto}
details.cfg{border-bottom:1px solid var(--line);padding:8px 0}details.cfg:last-child{border:0}
summary{cursor:pointer;list-style:none;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);font-weight:600;display:flex;justify-content:space-between}
summary::after{content:"+"}details[open] summary::after{content:"–"}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;font-size:12.5px;color:#c3c2b2}
.row input[type=range]{width:96px;accent-color:var(--k)}
.row output{width:34px;text-align:right;font-variant-numeric:tabular-nums;font-size:11.5px;color:var(--mut)}
.row select{background:#2e2d2e;color:var(--cream);border:1px solid var(--line);border-radius:7px;padding:4px 6px;font:inherit;max-width:130px}
.row input[type=color]{width:38px;height:24px;padding:1px;border:1px solid var(--line);border-radius:6px;background:none}
.row input[type=checkbox]{accent-color:var(--k);width:16px;height:16px}
.rv{display:flex;align-items:center;gap:6px}

/* ════════ MOBILE — sovereign identity ════════ */
#mobileWrap{display:none}

@media (max-width: 767px) {
  html, body {
    height: auto; min-height: 100%;
    overflow-x: hidden; overflow-y: auto;
    background: #101010; color: #fff;
    overscroll-behavior-y: auto;
    -webkit-text-size-adjust: 100%;
  }
  #stage, #tip, #zackMark, #notifStack, #cw { display: none !important; }
  #lightbox { padding: 20px; }
  #lightbox .lb-close { top: 14px; right: 14px; width: 36px; height: 36px; }

  #mobileWrap {
    display: block;
    --bg: #101010; --fg: #ffffff;
    --muted: color-mix(in srgb, var(--fg) 30%, var(--bg));
    --body: color-mix(in srgb, var(--fg) 68%, var(--bg));
    --line: color-mix(in srgb, var(--fg) 11%, transparent);
    --font: "Inter", "Helvetica Neue", Arial, system-ui, sans-serif;
    --title-weight: 400;
    --open-ms: 650ms; --close-ms: 450ms;
    --ease: cubic-bezier(.65, 0, .15, 1);
    --pad: clamp(20px, 5vw, 38px);
    background: var(--bg); color: var(--fg);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    min-height: 100vh; min-height: 100dvh;
  }
  #mobileWrap * { box-sizing: border-box; }

  .acc {
    padding: clamp(28px, 8vw, 56px) 0 clamp(60px, 14vw, 80px);
    padding-bottom: max(140px, 50vh);
    max-width: 640px; margin: 0 auto;
  }
  .acc__head {
    padding: 0 var(--pad);
    display: grid; grid-template-columns: 1fr;
    align-items: start; gap: 20px;
    margin-bottom: clamp(32px, 8vw, 64px);
  }
  .acc__eyebrow {
    display: flex; align-items: center; gap: 12px;
    font-size: 12px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--body); margin: 0 0 16px; font-weight: 500;
  }
  .acc__eyebrow i {
    width: 22px; height: 22px; border-radius: 50%;
    border: 1.5px solid var(--body); flex: none; display: block;
  }
  .acc__heading {
    margin: 0; font-weight: 400;
    font-size: clamp(56px, 20vw, 96px);
    line-height: .92; letter-spacing: -.04em;
    text-transform: uppercase; color: var(--fg);
  }
  .acc__side {
    margin: 0; max-width: 34ch; text-align: left;
    font-size: 12px; line-height: 1.7;
    letter-spacing: .08em; text-transform: uppercase;
    color: var(--body); font-weight: 400;
  }

  .m-marquee-wrap { position: relative; margin: 0 0 clamp(32px, 8vw, 56px); }

  .m-marquee {
    display: flex; align-items: center;
    gap: clamp(24px, 7vw, 48px);
    padding: 10px 0 8px;
    padding-inline: max(var(--pad), calc(50% - 70px));
    overflow-x: auto; overflow-y: hidden;
    scroll-snap-type: x proximity;
    scrollbar-width: none; -ms-overflow-style: none;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior-x: contain;
    scroll-behavior: smooth;
    touch-action: pan-x;
    position: relative; z-index: 1;
    mask-image: linear-gradient(to right,
      transparent 0%, rgba(0,0,0,0.15) 6%, #000 22%, #000 78%, rgba(0,0,0,0.15) 94%, transparent 100%);
    -webkit-mask-image: linear-gradient(to right,
      transparent 0%, rgba(0,0,0,0.15) 6%, #000 22%, #000 78%, rgba(0,0,0,0.15) 94%, transparent 100%);
  }
  .m-marquee::-webkit-scrollbar { display: none; }

  .m-mq-nav {
    position: absolute; top: 50%; transform: translateY(-50%);
    z-index: 3; width: 36px; height: 36px; border-radius: 50%;
    background: color-mix(in srgb, var(--bg) 72%, transparent);
    -webkit-backdrop-filter: blur(12px) saturate(1.2);
    backdrop-filter: blur(12px) saturate(1.2);
    border: 1px solid var(--line); color: var(--fg);
    display: grid; place-items: center; cursor: pointer; padding: 0;
    -webkit-tap-highlight-color: transparent;
    transition: opacity .22s ease, background .18s ease, transform .18s ease;
    font-family: inherit;
  }
  .m-mq-nav--prev { left: 6px; }
  .m-mq-nav--next { right: 6px; }
  .m-mq-nav:active { transform: translateY(-50%) scale(.94); }
  .m-mq-nav:disabled { opacity: 0; pointer-events: none; }
  .m-mq-nav svg { display: block; width: 15px; height: 15px; }

  .m-mq {
    position: relative; flex: none;
    scroll-snap-align: center;
    font-family: var(--font); font-weight: 700;
    font-size: clamp(16px, 4.4vw, 22px);
    letter-spacing: -.028em; line-height: 1;
    background: none; border: none;
    padding: 12px 2px; cursor: pointer; white-space: nowrap;
    will-change: filter, opacity;
    transition: filter .12s linear, opacity .18s ease;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .m-mq:focus-visible { outline: 2px solid var(--fg); outline-offset: 6px; border-radius: 3px; }
  .m-mq .tx-text { color: inherit; }

  .acc__list { list-style: none; margin: 0; padding: 0 var(--pad); border-top: 1px solid var(--line); }
  .m-item { border-bottom: 1px solid var(--line); }

  .m-item__btn {
    all: unset; box-sizing: border-box;
    display: grid; grid-template-columns: 32px 1fr 24px;
    align-items: start; gap: 14px; width: 100%;
    padding: clamp(20px, 5.5vw, 30px) 0;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .m-item__btn:focus-visible { outline: 2px solid var(--fg); outline-offset: 4px; }

  .m-item__num {
    font-size: 13px; letter-spacing: .06em;
    color: var(--muted); font-variant-numeric: tabular-nums;
    font-weight: 500; padding-top: 6px;
    transition: color var(--open-ms) var(--ease);
  }
  .m-item.is-open .m-item__num { color: var(--fg); }

  .m-item__title-wrap { display: block; min-width: 0; overflow-wrap: anywhere; }
  .m-item__title {
    position: relative; display: inline-block;
    font-weight: var(--title-weight);
    font-size: clamp(22px, 6.4vw, 34px);
    line-height: 1.05; letter-spacing: -.025em;
    text-transform: uppercase; color: var(--muted);
    overflow-wrap: anywhere; word-break: break-word;
  }

 if(glide){off+=(glide.to-off)*Math.min(1,dt*7);inertia=0;if(Math.abs(glide.to-off)<.8){off=glide.to;const cb=glide.cb;glide=null;cb&&cb()}}
 else if(!dragging){off+=((C.dir==='reverse'?1:-1)*C.speed*hoverF+inertia)*dt;inertia*=Math.exp(-dt*2.5)}
 update();raf=requestAnimationFrame(frame);
}
function run(){if(!raf&&visible&&!document.hidden&&mode!=='swap'){last=0;raf=requestAnimationFrame(frame)}}
new IntersectionObserver(e=>{visible=e[0].isIntersecting;run()}).observe(stage);
document.addEventListener('visibilitychange',run);

let lp=0,lt=0;
stage.addEventListener('pointerdown',e=>{
  if(!C.drag||mode==='swap')return;
  dragging=true;glide=null;moved=0;vel=0;
  dragHov=hov;                    // ← pin the current hovered item so its tooltip persists
  lp=H?e.clientX:e.clientY;lt=performance.now();
  pointerCaptured=false;
});
stage.addEventListener('pointermove',e=>{
  if(!dragging)return;
  const q=H?e.clientX:e.clientY,n=performance.now(),dl=q-lp;
  moved+=Math.abs(dl);
  if(!pointerCaptured && moved>4){
    try{stage.setPointerCapture(e.pointerId);pointerCaptured=true;}catch(_){}
    stage.style.cursor='grabbing';
  }
  off+=dl;
  vel=vel*.6+(dl/Math.max(.008,(n-lt)/1000))*.4;
  lp=q;lt=n;update();
});
const end=(e)=>{
  if(!dragging)return;
  dragging=false;
  pointerCaptured=false;
  dragHov=null;                   // ← release the pin
  inertia=clamp(vel,-2500,2500);
  stage.style.cursor='grab';
  setTimeout(()=>moved=0,60);
  // Pointer capture suppressed enter/leave during the drag, so `hov` is now
  // stale. Resync it to whatever logo (if any) is actually under the pointer,
  // so the tooltip either follows the new logo or hides cleanly.
  if(e && e.clientX != null){
    const under = document.elementFromPoint(e.clientX, e.clientY);
    const it = under && under.closest ? under.closest('.it') : null;
    hov = it || null;
    if(!hov) tip.classList.remove('on');
    else place();
  }
  run();
};
stage.addEventListener('pointerup',end);
stage.addEventListener('pointercancel',end);

let sy=scrollY;
addEventListener('scroll',()=>{const d=Math.abs(scrollY-sy);sy=scrollY;inertia=clamp(inertia+(C.dir==='reverse'?1:-1)*clamp(d,0,80)*C.scrollPush*2.2,-1800,1800)},{passive:true});

addEventListener('wheel', e => {
  const t = e.target;
  if (t && t.closest && t.closest('#notifStack')) {
    const body = stackEl.querySelector('.stack-body');
    if (body) {
      const atTop    = body.scrollTop <= 0;
      const atBottom = body.scrollTop + body.clientHeight >= body.scrollHeight - 1;
      const goingUp   = e.deltaY < 0;
      const goingDown = e.deltaY > 0;
      if ((goingUp && !atTop) || (goingDown && !atBottom)) return;
    } else {
      return;
    }
  }
  const d = clamp(e.deltaY, -100, 100);
  inertia = clamp(inertia + (C.dir === 'reverse' ? 1 : -1) * d * C.scrollPush * 1.4, -1800, 1800);
  run();
}, { passive: true });

let lw=0,lh=0;new ResizeObserver(()=>{const w=stage.clientWidth,h=stage.clientHeight;if(w!==lw||h!==lh){lw=w;lh=h;rebuild()}}).observe(stage);

const pn=$('#pn'),cw=$('#cw');
$('#gear').onclick=()=>cw.classList.toggle('open');
SCHEMA.forEach(([title,rows],gi)=>{
 const d=document.createElement('details');d.className='cfg';d.open=gi===0;d.innerHTML=`<summary>${title}</summary>`;
 rows.forEach(([k,lab,t,o])=>{
  const r=document.createElement('div');r.className='row';let inp,out;
  if(t==='sel'){inp=document.createElement('select');inp.innerHTML=o.map(v=>`<option>${v}</option>`).join('');inp.value=C[k]}
  else{inp=document.createElement('input');inp.type=t==='rng'?'range':t==='col'?'color':'checkbox';
   if(t==='rng'){[inp.min,inp.max,inp.step]=o;inp.value=C[k];out=document.createElement('output');out.textContent=C[k]}
   else if(t==='col')inp.value=C[k].slice(0,7);else inp.checked=C[k]}
  inp.addEventListener(t==='rng'?'input':'change',()=>{
   let v=t==='chk'?inp.checked:t==='rng'?+inp.value:inp.value;
   if(t==='col'&&(k==='fill'||k==='border'))v+='33';
   C[k]=v;if(out)out.textContent=v;rebuild()});
  const l=document.createElement('span');l.textContent=lab;const w=document.createElement('div');w.className='rv';w.append(inp);if(out)w.append(out);
  r.append(l,w);d.append(r)});
 pn.append(d)});

/* ══════════════════════════════════════════════════════════════
   MOBILE — marquee + accordion. Chroma stays off on mobile
   (no hover); --ci defaults to 0 from CSS.
   ══════════════════════════════════════════════════════════════ */
(function buildMobile(){
  const list = document.getElementById('mobileList');
  const marquee = document.getElementById('mMarquee');
  const prevBtn = document.getElementById('mPrev');
  const nextBtn = document.getElementById('mNext');
  if(!list || !marquee) return;

  const pad2 = n => String(n + 1).padStart(2, '0');
  const arrowSVG = '<svg class="m-item__arrow" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 4v23M6 17l10 10 10-10"/></svg>';

  function renderNotif(n){
    let media = '';
    if(n.image){
      media += `<div class="m-notif__media" data-lb="${n.image}"><img src="${n.image}" alt="" loading="lazy" draggable="false"></div>`;
      if(n.imageTag) media += `<div class="m-notif__cap">${esc(n.imageTag)}</div>`;
    }
    if(n.images && n.images.length){
      const cls = n.images.length === 2 ? 'g-2' : n.images.length === 4 ? 'g-4' : '';
      media = `<div class="m-notif__grid ${cls}">${n.images.map(src => `<div class="m-thumb" data-lb="${src}"><img src="${src}" alt="" loading="lazy" draggable="false"></div>`).join('')}</div>`;
    }
    const details = n.details
      ? `<details class="m-notif__more"><summary>View details</summary><div class="m-notif__detail">${n.details.split('\n\n').map(p => `<p>${p}</p>`).join('')}</div></details>`
      : '';
    return `
      <div class="m-notif">
        ${n.kicker ? `<div class="m-notif__kicker">${esc(n.kicker)}</div>` : ''}
        <h4 class="m-notif__title">${esc(n.title)}</h4>
        <p class="m-notif__msg">${n.message}</p>
        ${media}
        ${details}
      </div>
    `;
  }

  marquee.innerHTML = B.map((brand, i) => {
    const name = brand[0];
    return `<button class="m-mq" type="button" data-idx="${i}" aria-label="${esc(name)}">
      <span class="tx" style="font:inherit;letter-spacing:inherit;line-height:inherit">${chromaHTML(name)}</span>
    </button>`;
  }).join('');

  const mqButtons = [...marquee.querySelectorAll('.m-mq')];

  let paintRaf = 0;
  function paintMarquee(){
    paintRaf = 0;
    const wrapR = marquee.getBoundingClientRect();
    const cx = wrapR.left + wrapR.width / 2;
    const maxDist = Math.max(160, wrapR.width / 2);
    mqButtons.forEach(btn => {
      const r = btn.getBoundingClientRect();
      const ecx = r.left + r.width / 2;
      const d = Math.min(1, Math.abs(ecx - cx) / maxDist);
      const f = 1 - (d * d * (3 - 2 * d));
      btn.style.filter = d > 0.02 ? `blur(${(d * 6).toFixed(2)}px)` : 'none';
      btn.style.opacity = (0.14 + 0.86 * f).toFixed(3);
      btn.classList.toggle('is-active', d < 0.16);
    });
    if(prevBtn && nextBtn){
      const max = Math.max(1, marquee.scrollWidth - marquee.clientWidth);
      const x = marquee.scrollLeft;
      prevBtn.disabled = x <= 2;
      nextBtn.disabled = x >= max - 2;
    }
  }
  function schedulePaint(){
    if(paintRaf) return;
    paintRaf = requestAnimationFrame(paintMarquee);
  }
  marquee.addEventListener('scroll', schedulePaint, { passive: true });
  window.addEventListener('resize', schedulePaint);
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(schedulePaint);
  paintMarquee();

  function centerIndex(idx, smooth){
    const btn = mqButtons[idx];
    if(!btn) return;
    const wrapR = marquee.getBoundingClientRect();
    const btnR = btn.getBoundingClientRect();
    const target = marquee.scrollLeft + (btnR.left - wrapR.left) - (wrapR.width - btnR.width) / 2;
    if(smooth) marquee.scrollTo({ left: target, behavior: 'smooth' });
    else marquee.scrollLeft = target;
  }

  function currentCentered(){
    let best = 0, bd = Infinity;
    const wrapR = marquee.getBoundingClientRect();
    const cx = wrapR.left + wrapR.width / 2;
    mqButtons.forEach((b, i) => {
      const r = b.getBoundingClientRect();
      const d = Math.abs(r.left + r.width / 2 - cx);
      if(d < bd){ bd = d; best = i; }
    });
    return best;
  }
  function step(delta){
    const cur = currentCentered();
    const target = Math.max(0, Math.min(mqButtons.length - 1, cur + delta));
    if(target === cur) return;
    centerIndex(target, true);
    paintMarquee();
  }
  if(prevBtn) prevBtn.addEventListener('click', () => step(-1));
  if(nextBtn) nextBtn.addEventListener('click', () => step(1));

  list.innerHTML = B.map((brand, i) => {
    const [name, ty, g, col, cat, span, notifs] = brand;
    const notifHTML = notifs.map(renderNotif).join('');
    return `
      <li class="m-item" data-idx="${i}">
        <h3 style="margin:0">
          <button class="m-item__btn" type="button" id="mh${i}" aria-expanded="false" aria-controls="mp${i}">
            <span class="m-item__num">${pad2(i)}</span>
            <span class="m-item__title-wrap">
              <span class="m-item__title" data-text="${esc(name)}">${esc(name)}</span>
              <span class="m-item__cat">${esc(cat)}</span>
            </span>
            ${arrowSVG}
          </button>
        </h3>
        <div class="m-item__panel" id="mp${i}" role="region" aria-labelledby="mh${i}">
          <div class="m-item__clip">
            <div class="m-item__content">${notifHTML}</div>
          </div>
        </div>
      </li>
    `;
  }).join('');

  const mItems = [...list.querySelectorAll('.m-item')];

  function setOpen(item, open){
    item.classList.toggle('is-open', open);
    const btn = item.querySelector('.m-item__btn');
    btn.setAttribute('aria-expanded', open);
    const clip = item.querySelector('.m-item__clip');
    if(clip) clip.inert = !open;
  }
  mItems.forEach(el => setOpen(el, false));

  function openMobileItem(idx, scroll){
    const item = list.querySelector(`.m-item[data-idx="${idx}"]`);
    if(!item) return;
    const alreadyOpen = item.classList.contains('is-open');
    mItems.forEach(o => { if(o !== item) setOpen(o, false); });
    setOpen(item, !alreadyOpen ? true : false);
    if(scroll && !alreadyOpen){
      window.setTimeout(() => {
        const r = item.getBoundingClientRect();
        const y = Math.max(0, r.top + window.scrollY - 90);
        window.scrollTo({ top: y, behavior: 'smooth' });
      }, 720);
    }
  }

  list.addEventListener('click', e => {
    const lbTarget = e.target.closest('[data-lb]');
    if(lbTarget){
      e.stopPropagation();
      openLightbox(lbTarget.getAttribute('data-lb'));
      return;
    }
    const btn = e.target.closest('.m-item__btn');
    if(!btn) return;
    const item = btn.closest('.m-item');
    const idx = parseInt(item.dataset.idx, 10);
    if(isNaN(idx)) return;
    openMobileItem(idx, false);
    centerIndex(idx, true);
    paintMarquee();
  });

  list.addEventListener('keydown', e => {
    const btns = [...list.querySelectorAll('.m-item__btn')];
    const i = btns.indexOf(document.activeElement);
    if(i < 0) return;
    const next = { ArrowDown: i + 1, ArrowUp: i - 1, Home: 0, End: btns.length - 1 }[e.key];
    if(next === undefined) return;
    e.preventDefault();
    btns[(next + btns.length) % btns.length].focus();
  });

  let downX = 0, downY = 0, tappedMoved = false;
  marquee.addEventListener('pointerdown', e => {
    downX = e.clientX; downY = e.clientY; tappedMoved = false;
  }, { passive: true });
  marquee.addEventListener('pointermove', e => {
    if(tappedMoved) return;
    if(Math.hypot(e.clientX - downX, e.clientY - downY) > 8) tappedMoved = true;
  }, { passive: true });
  marquee.addEventListener('click', e => {
    if(tappedMoved) return;
    const btn = e.target.closest('.m-mq');
    if(!btn) return;
    const idx = parseInt(btn.dataset.idx, 10);
    if(isNaN(idx)) return;
    centerIndex(idx, true);
    openMobileItem(idx, true);
  });

  requestAnimationFrame(() => { centerIndex(0, false); paintMarquee(); });
})();

document.fonts.ready.then(()=>{ if(innerWidth > 767) rebuild(); });
</script>
