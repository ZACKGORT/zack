  .modal .mhead{padding:16px 22px;border-bottom:1px solid rgba(255,255,255,.09);

  .modal .mhead h3{font-size:13px;font-weight:700;color:#fff;letter-spacing:.02em}
  .modal .mbody{flex:1;overflow:hidden;padding:16px 22px}
  .modal pre{background:#050508;border:1px solid rgba(255,255,255,.06);
    padding:14px;font-family:'SF Mono',Monaco,Menlo,Consolas,monospace;
    font-size:11px;line-height:1.6;color:#a8b8e0;overflow:auto;
    height:100%;white-space:pre;max-height:calc(80vh - 160px)}
  .modal .mfoot{padding:14px 22px;border-top:1px solid rgba(255,255,255,.09);
    display:flex;justify-content:space-between;align-items:center;gap:12px}
  .modal .mfoot .hint{font-size:10px;color:#4a4a4a;letter-spacing:.1em}
  .toast{position:fixed;top:22px;left:50%;transform:translateX(-50%);
    background:#fff;color:#000;padding:9px 18px;font-size:11px;
    letter-spacing:.1em;font-weight:600;z-index:200;
    animation:slideDown .35s cubic-bezier(.16,1,.3,1)}
  @keyframes slideDown{from{opacity:0;transform:translate(-50%,-10px)}
    to{opacity:1;transform:translate(-50%,0)}}
</style>

/* =========================================================
   STORAGE
   ========================================================= */
const LS_KEY = "zackcx-tagger-v1";

function loadFromStorage() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (Array.isArray(parsed) && parsed.length > 0 && parsed[0].name) return parsed;
  } catch(e){}
  return null;
}

function saveToStorage(brands) {
  try { localStorage.setItem(LS_KEY, JSON.stringify(brands)); } catch(e){}
}

/* =========================================================
   MAIN APP
   ========================================================= */
function App(){
  const [brands, setBrands] = useState(() => loadFromStorage() || INITIAL_BRANDS);
  const [selected, setSelected] = useState(() => new Set());
  const [editingIdx, setEditingIdx] = useState(null);
  const [search, setSearch] = useState("");
  const [filter, setFilter] = useState("all"); // all | unverified | verified | untagged
  const [toast, setToast] = useState(null);
  const [showExport, setShowExport] = useState(false);

  /* Auto-save */
  useEffect(() => { saveToStorage(brands); }, [brands]);

  /* Toast helper */
  const flash = useCallback((msg) => {
    setToast(msg);
    setTimeout(() => setToast(null), 1800);
  }, []);

  /* ---- Derived ---- */
  const verifiedCount = brands.filter(b => b.verified).length;
  const untaggedCount = brands.filter(b => !b.kind || b.industries.length === 0).length;

  const filteredBrands = useMemo(() => {
    const q = search.trim().toLowerCase();
    return brands.map((b, i) => ({ b, i })).filter(({b}) => {
      if (filter === "verified" && !b.verified) return false;
      if (filter === "unverified" && b.verified) return false;
      if (filter === "untagged" && b.kind && b.industries.length > 0) return false;
      if (!q) return true;
      return (
        b.name.toLowerCase().includes(q) ||
        (b.kind||"").toLowerCase().includes(q) ||
        (b.parent||"").toLowerCase().includes(q) ||
        b.industries.some(i => i.toLowerCase().includes(q))
      );
    });
  }, [brands, search, filter]);

  /* ---- Actions ---- */
  const updateBrand = useCallback((idx, patch) => {
    setBrands(prev => prev.map((b, i) => i === idx ? { ...b, ...patch } : b));
  }, []);

  const toggleIndustry = useCallback((idx, ind) => {
    setBrands(prev => prev.map((b, i) => {
      if (i !== idx) return b;
      const has = b.industries.includes(ind);
      return { ...b, industries: has
        ? b.industries.filter(x => x !== ind)
        : [...b.industries, ind] };
    }));
  }, []);

  const toggleSelect = useCallback((idx) => {
    setSelected(prev => {
      const next = new Set(prev);
      if (next.has(idx)) next.delete(idx); else next.add(idx);
      return next;
    });
  }, []);

  const clearSelection = useCallback(() => setSelected(new Set()), []);

  const bulkApplyKind = useCallback((kind) => {
    setBrands(prev => prev.map((b, i) => selected.has(i) ? { ...b, kind } : b));
    flash(`Set kind to "${kind}" for ${selected.size} brands`);
  }, [selected, flash]);

  const bulkAddIndustry = useCallback((ind) => {
    setBrands(prev => prev.map((b, i) => {
      if (!selected.has(i)) return b;
      if (b.industries.includes(ind)) return b;
      return { ...b, industries: [...b.industries, ind] };
    }));
    flash(`Added "${ind}" to ${selected.size} brands`);
  }, [selected, flash]);

  const bulkRemoveIndustry = useCallback((ind) => {
    setBrands(prev => prev.map((b, i) => {
      if (!selected.has(i)) return b;
      return { ...b, industries: b.industries.filter(x => x !== ind) };
    }));
    flash(`Removed "${ind}" from ${selected.size} brands`);
  }, [selected, flash]);

  const bulkVerify = useCallback((val) => {
    setBrands(prev => prev.map((b, i) => selected.has(i) ? { ...b, verified: val } : b));
    flash(`Marked ${selected.size} brands as ${val ? "verified" : "unverified"}`);
  }, [selected, flash]);

  const bulkClearIndustries = useCallback(() => {
    setBrands(prev => prev.map((b, i) => selected.has(i) ? { ...b, industries: [] } : b));
    flash(`Cleared industries for ${selected.size} brands`);
  }, [selected, flash]);

  const resetAll = useCallback(() => {
    if (!confirm("Reset all edits? This will restore the initial pre-filled data.")) return;
    setBrands(INITIAL_BRANDS);
    clearSelection();
    setEditingIdx(null);
    flash("Reset to initial data");
  }, [clearSelection, flash]);

  /* ---- Export ---- */
  const exportJSON = useMemo(() => {
    const clean = brands.map(b => {
      const out = {
        name: b.name,
        kind: b.kind || "Client",
        industries: b.industries || []
      };
      if (b.parent) out.parent = b.parent;
      if (b.role) out.role = b.role;
      if (b.years) out.years = b.years;
      if (b.notes) out.notes = b.notes;
      return out;
    });
    return JSON.stringify(clean, null, 2);
  }, [brands]);

  const copyExport = useCallback(async () => {
    try {
      await navigator.clipboard.writeText(exportJSON);
      flash("Copied to clipboard");
    } catch(e) {
      flash("Copy failed — select manually");
    }
  }, [exportJSON, flash]);

  /* ---- Keyboard shortcuts ---- */
  useEffect(() => {
    const onKey = (e) => {
      if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA" || e.target.tagName === "SELECT") return;
      if (e.key === "Escape") {
        if (showExport) setShowExport(false);
        else if (selected.size > 0) clearSelection();
        else setEditingIdx(null);
      }
      if (e.key === "e" && (e.metaKey || e.ctrlKey)) {
        e.preventDefault();
        setShowExport(true);
      }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [showExport, selected, clearSelection]);

  const progressPct = (verifiedCount / brands.length) * 100;
  const editing = editingIdx != null ? brands[editingIdx] : null;

  return (
    <div className="app">
      {/* TOP BAR */}
      <div className="topbar">
        <div className="brand">
          <div className="logo">zack.cx</div>
          <div className="tag">Tagging Tool</div>
          <div className="progress">
            <span><b>{verifiedCount}</b> / {brands.length} verified</span>
            <div className="bar"><i style={{width: progressPct + "%"}}/></div>
            {untaggedCount > 0 && (
              <span style={{color:"#c47a4a"}}>{untaggedCount} incomplete</span>
            )}
          </div>
        </div>
        <div className="actions">
          <button className="btn" onClick={resetAll}>Reset</button>
          <button className="btn primary" onClick={() => setShowExport(true)}>Export</button>
        </div>
      </div>

      {/* BODY */}
      <div className="body">
        {/* LEFT — LIST */}
        <div className="listcol">
          <div className="listhead">
            <div className="searchbox">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" strokeWidth="2">
                <circle cx="11" cy="11" r="8"/>
                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
              </svg>
              <input placeholder="Search brands, kinds, industries…"
                value={search} onChange={e => setSearch(e.target.value)}/>
            </div>
            <div className="filters">
              {[
                {k:"all", l:"All"},
                {k:"unverified", l:"Todo"},
                {k:"verified", l:"Done"},
                {k:"untagged", l:"Incomplete"}
              ].map(f => (
                <button key={f.k}
                  className={"chip" + (filter === f.k ? " on" : "")}
                  onClick={() => setFilter(f.k)}>{f.l}</button>
              ))}
            </div>
          </div>

          <div className="list">
            {filteredBrands.map(({b, i}) => {
              const isEmpty = !b.kind || b.industries.length === 0;
              return (
                <div key={b.name}
                  className={"row" + (selected.has(i) ? " sel" : "") +
                    (editingIdx === i ? " editing" : "") +
                    (b.verified ? " verified" : "")}
                  onClick={() => setEditingIdx(i)}>
                  <div className={"chk" + (selected.has(i) ? " on" : "")}
                    onClick={(e) => { e.stopPropagation(); toggleSelect(i); }}/>
                  <div className="main">
                    <div className="name">
                      <span>{b.name}</span>
                      {b.verified && <span className="verify">verified</span>}
                    </div>
                    <div className={"meta" + (isEmpty ? " empty" : "")}>
                      {isEmpty ? (
                        <span className="warn">— needs tagging</span>
                      ) : (
                        <>
                          <span className="kind">{b.kind}</span>
                          {b.parent && <><span className="sep">·</span>
                            <span className="parent">{b.parent}</span></>}
                          {b.industries.length > 0 && (
                            <>
                              <span className="sep">·</span>
                              <span className="ind">{b.industries.join(" / ")}</span>
                            </>
                          )}
                        </>
                      )}
                    </div>
                  </div>
                </div>
              );
            })}
            {filteredBrands.length === 0 && (
              <div className="empty">No brands match</div>
            )}
          </div>
        </div>

        {/* RIGHT — EDITOR */}
        <div className="editcol">
          <div className="edithead">
            <div className="ttl">{editing ? "Editing" : "Select a brand"}</div>
            {editing && <div className="count">{(editingIdx + 1)} / {brands.length}</div>}
          </div>
          <div className="editbody">
            {!editing ? (
              <div className="empty">
                Click any brand on the left<br/>to tag it
              </div>
            ) : (
              <>
                <div className="field">
                  <label>Brand</label>
                  <div className="brandname">{editing.name}</div>
                </div>

                <div className="field">
                  <label>Engagement type</label>
                  <div className="kindrow">
                    {KINDS.map(k => (
                      <button key={k}
                        className={"kindbtn" + (editing.kind === k ? " on" : "")}
                        onClick={() => updateBrand(editingIdx, {kind: k})}>
                        {k}
                      </button>
                    ))}
                  </div>
                </div>

                <div className="field">
                  <label>Parent / Context</label>
                  <input type="text" value={editing.parent || ""}
                    onChange={e => updateBrand(editingIdx, {parent: e.target.value})}
                    placeholder="e.g. Turn5, Comcast, IPG…"/>
                </div>

                <div className="field">
                  <label>Industries</label>
                  <div className="indgrid">
                    {INDUSTRIES.map(ind => {
                      const on = editing.industries.includes(ind);
                      return (
                        <button key={ind}
                          className={"indbtn" + (on ? " on" : "")}
                          onClick={() => toggleIndustry(editingIdx, ind)}>
                          <span className="box"></span>
                          <span>{ind}</span>
                        </button>
                      );
                    })}
                  </div>
                </div>

                <div className="field">
                  <label>Role</label>
                  <input type="text" value={editing.role || ""}
                    onChange={e => updateBrand(editingIdx, {role: e.target.value})}
                    placeholder="e.g. Lead Designer, Art Director…"/>
                </div>

                <div className="field">
                  <label>Years</label>
                  <input type="text" value={editing.years || ""}
                    onChange={e => updateBrand(editingIdx, {years: e.target.value})}
                    placeholder="e.g. 2019 – 2021"/>
                </div>

                <div className="field">
                  <label>Notes</label>
                  <textarea value={editing.notes || ""}
                    onChange={e => updateBrand(editingIdx, {notes: e.target.value})}
                    placeholder="Contribution summary, deliverables, outcomes…"/>
                </div>

                <div className={"verifyrow" + (editing.verified ? " on" : "")}
                  onClick={() => updateBrand(editingIdx, {verified: !editing.verified})}>
                  <span className="box"></span>
                  <span>Mark as verified / complete</span>
                </div>
              </>
            )}
          </div>
        </div>
      </div>

      {/* BULK BAR */}
      {selected.size > 0 && (
        <div className="bulkbar">
          <div className="label"><b>{selected.size}</b> selected</div>
          <select onChange={e => { if (e.target.value) { bulkApplyKind(e.target.value); e.target.value=""; }}} defaultValue="">
            <option value="" disabled>Set kind…</option>
            {KINDS.map(k => <option key={k} value={k}>{k}</option>)}
          </select>
          <select onChange={e => { if (e.target.value) { bulkAddIndustry(e.target.value); e.target.value=""; }}} defaultValue="">
            <option value="" disabled>Add industry…</option>
            {INDUSTRIES.map(i => <option key={i} value={i}>{i}</option>)}
          </select>
          <select onChange={e => { if (e.target.value) { bulkRemoveIndustry(e.target.value); e.target.value=""; }}} defaultValue="">
            <option value="" disabled>Remove industry…</option>
            {INDUSTRIES.map(i => <option key={i} value={i}>{i}</option>)}
          </select>
          <button className="btn" onClick={() => bulkVerify(true)}>Verify</button>
          <button className="btn" onClick={bulkClearIndustries}>Clear tags</button>
          <button className="btn" onClick={clearSelection}>Deselect</button>
        </div>
      )}

      {/* EXPORT MODAL */}
      {showExport && (
        <div className="modal" onClick={(e) => { if (e.target.className === "modal") setShowExport(false); }}>
          <div className="inner">
            <div className="mhead">
              <h3>Export — brand data</h3>
              <button className="btn" onClick={() => setShowExport(false)}>Close</button>
            </div>
            <div className="mbody">
              <pre>{exportJSON}</pre>
            </div>
            <div className="mfoot">
              <div className="hint">Paste this back to update zack.cx</div>
              <div style={{display:"flex",gap:"8px"}}>
                <button className="btn" onClick={copyExport}>Copy JSON</button>
                <button className="btn primary" onClick={() => {
                  const blob = new Blob([exportJSON], {type:"application/json"});
                  const url = URL.createObjectURL(blob);
                  const a = document.createElement("a");
                  a.href = url; a.download = "zackcx-brands.json";
                  a.click(); URL.revokeObjectURL(url);
                }}>Download .json</button>
              </div>
            </div>
          </div>
        </div>
      )}

      {toast && <div className="toast">{toast}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
